# Misconceptions first detected in lesson 4.2 (shifts, stretches, graphical solutions, parity and period).
- id: MC-c4-shift-direction
  title: מזיזים את הגרף לכיוון ההפוך
  belief: >-
    הגרף של $f(x-2)$ הוא הגרף של $f$ מוזז 2 יחידות **שמאלה**, כי מחסרים 2.
  truth: >-
    $f(x-2)$ מקבלת ב-$x=a+2$ את הערך ש-$f$ מקבלת ב-$a$: כל נקודה זזה 2 ימינה. $f(x-a)$ מזיזה ימינה ב-$a$, ו-$f(x)+b$
    מזיזה למעלה ב-$b$.
  remedy: { lesson: '4.2', label: 'הזזה אופקית: f(x−a) זזה ימינה' }

- id: MC-c4-stretch-direction
  title: הופכים את כיוון המתיחה האופקית
  belief: >-
    הגרף של $f(2x)$ הוא הגרף של $f$ מתוח פי 2 לרוחב.
  truth: >-
    $f(2x)$ מגיעה ב-$x=\frac a2$ לערך ש-$f$ מקבלת ב-$a$: הגרף **מכווץ** פי 2 לעבר ציר $y$. $f\!\left(\frac xb\right)$ מותחת
    פי $b$ לרוחב, ו-$c\,f(x)$ מותחת פי $c$ לגובה.
  remedy: { lesson: '4.2', label: 'מתיחה וכיווץ אופקיים' }

- id: MC-c4-reflection-axis
  title: מבלבלים שיקוף ביחס לציר x עם שיקוף ביחס לציר y
  belief: >-
    $-f(x)$ ו-$f(-x)$ הם אותו שיקוף.
  truth: >-
    $-f(x)$ הופכת את סימן הערכים: שיקוף ביחס לציר $x$. $f(-x)$ הופכת את סימן הקלט: שיקוף ביחס לציר $y$. ל-$e^x$:
    $-e^x<0$ תמיד, ואילו $e^{-x}>0$ ויורדת.
  remedy: { lesson: '4.2', label: 'שני השיקופים' }

- id: MC-c4-vertical-shift-ignored
  title: שוכחים את ההזזה האנכית כשפותרים
  belief: >-
    ב-$T(t)=20+60e^{-kt}$ היחס $\frac{T(10)}{T(0)}$ הוא היחס בין ערכי האקספוננט.
  truth: >-
    האקספוננט הוא רק החלק $T-20$: הגרף של $60e^{-kt}$ הוזז 20 למעלה. לפני שמחלקים או לוקחים $\ln$, מחסירים את ההזזה:
    $\frac{T(10)-20}{T(0)-20}=e^{-10k}$.
  remedy: { lesson: '4.2', label: 'הזזה אנכית: מחסירים לפני שפותרים' }

- id: MC-c4-transform-order
  title: מבצעים מתיחה והזזה בסדר הלא נכון
  belief: >-
    "מותחים פי 2 לרוחב ואז מזיזים 1 ימינה" נותן $f\!\left(\frac x2-1\right)$.
  truth: >-
    כל פעולה מחליפה את $x$ **בנוסחה הנוכחית**: אחרי המתיחה $f\!\left(\frac x2\right)$, ואחרי ההזזה מחליפים $x$ ב-$x-1$:
    $f\!\left(\frac{x-1}{2}\right)$. הנוסחה $f\!\left(\frac x2-1\right)=f\!\left(\frac{x-2}{2}\right)$ מזיזה 2 ימינה.
  remedy: { lesson: '4.2', label: 'סדר הפעולות בהזזה ומתיחה' }

- id: MC-c4-periodic-one-period
  title: סופרים פתרונות רק במחזור אחד
  belief: >-
    למשוואה $\sin x=\frac12$ בקטע $[0,4\pi]$ יש שני פתרונות, כמו בקטע $[0,2\pi]$.
  truth: >-
    כל מחזור נוסף מוסיף עותק של הגרף, ואיתו את אותו מספר נקודות חיתוך. בקטע $[0,4\pi]$ יש שני מחזורים, ולכן 4 פתרונות.
  remedy: { lesson: '4.2', label: 'פתרונות של משוואה מחזורית' }

- id: MC-c4-abs-graph-reflection
  title: שוכחים את החלק המשוקף בגרף של ערך מוחלט
  belief: >-
    $|g(x)|=c$ שקולה ל-$g(x)=c$.
  truth: >-
    הגרף של $|g|$ משקף למעלה את החלקים שבהם $g<0$. לכן $|g(x)|=c$ (עם $c>0$) שקולה ל-$g(x)=c$ **או** $g(x)=-c$, ובגרף
    רואים חיתוכים גם עם החלק המשוקף.
  remedy: { lesson: '4.2', label: 'הגרף של |g(x)|' }

- id: MC-c4-graph-count-miss-far
  title: מפספסים נקודות חיתוך שרחוקות מהציור
  belief: >-
    מספר הפתרונות של $f(x)=g(x)$ הוא מספר החיתוכים שרואים בחלון הציור הראשון.
  truth: >-
    לפני שסופרים בודקים מה קורה בשני הקצוות: איזו פונקציה גדולה יותר כש-$x\to\infty$ ו-$x\to-\infty$. ל-$2^x=x^2$ יש
    חיתוך שלישי ב-$x<0$, ול-$2^x=x^{10}$ חיתוך ליד $x\approx58.8$.
  remedy: { lesson: '4.2', label: 'פתרון גרפי: גם בקצוות' }

- id: MC-c4-parity-by-exponents
  title: קובעים זוגיות לפי המעריכים שרואים בנוסחה
  belief: >-
    $x^3+1$ אי-זוגית כי המעריך 3 אי-זוגי.
  truth: >-
    בודקים את ההגדרה: $f$ אי-זוגית אם $f(-x)=-f(x)$ לכל $x$. כאן $f(-x)=-x^3+1\ne-(x^3+1)$. הקבוע 1 הוא $1\cdot x^0$, איבר
    זוגי, ולכן $x^3+1$ לא זוגית ולא אי-זוגית.
  remedy: { lesson: '4.2', label: 'זוגיות לפי ההגדרה' }

- id: MC-c4-even-odd-exclusive
  title: חושבים שכל פונקציה היא זוגית או אי-זוגית
  belief: >-
    פונקציה שאינה זוגית היא בהכרח אי-זוגית.
  truth: >-
    רוב הפונקציות אינן זוגיות ואינן אי-זוגיות: $e^x$, $x^3+1$, $(x-1)^2$. (וכל פונקציה היא **סכום** של חלק זוגי וחלק
    אי-זוגי: $e^x=\cosh x+\sinh x$.)
  remedy: { lesson: '4.2', label: 'לא זוגית ולא אי-זוגית' }

- id: MC-c4-period-scaling
  title: כופלים את המחזור במקדם במקום לחלק בו
  belief: >-
    המחזור של $\sin(kx)$ הוא $2\pi k$.
  truth: >-
    $\sin(kx)$ משלימה מחזור כש-$kx$ גדל ב-$2\pi$, כלומר כש-$x$ גדל ב-$\frac{2\pi}{k}$. מקדם גדול מאיץ את התנודה ומקצר את
    המחזור.
  remedy: { lesson: '4.2', label: 'המחזור של sin(kx)' }

- id: MC-c4-period-of-sum
  title: לוקחים את המחזור של אחד המחוברים כמחזור הסכום
  belief: >-
    המחזור של $\sin2x+\cos3x$ הוא המחזור של אחד המחוברים (למשל הגדול מביניהם).
  truth: >-
    מחזור של הסכום צריך להיות כפולה של **שני** המחזורים, $\pi$ ו-$\frac{2\pi}{3}$. הכפולה המשותפת הקטנה ביותר היא
    $2\pi$.
  remedy: { lesson: '4.2', label: 'המחזור של סכום' }
