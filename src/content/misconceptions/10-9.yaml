# Misconceptions first detected in lesson 10.9 (Lagrange multipliers).
- id: MC-c10-lagrange-gradient-zero
  title: מחפשים קיצון תחת אילוץ בנקודות שבהן הגרדיאנט מתאפס
  belief: >-
    בנקודת קיצון של $f$ על העקום $g=0$ מתקיים $\nabla f=0$.
  truth: >-
    על העקום $f$ צריכה להיות קיצונית רק **לאורך** העקום, ולכן רק הרכיב של $\nabla f$ המשיק לעקום מתאפס:
    $\nabla f\perp\vec T$, כלומר $\nabla f=\lambda\nabla g$. ל-$5x+y$ על אליפסה $\nabla f=(5,1)$ אינו מתאפס אף פעם, ובכל זאת
    יש מקסימום.
  remedy: { lesson: '10.9', label: 'תנאי לגרנז׳: גרדיאנטים מקבילים' }

- id: MC-c10-lagrange-perp
  title: חושבים שבנקודת קיצון תחת אילוץ הגרדיאנטים מאונכים
  belief: >-
    בנקודת קיצון של $f$ על $g=0$ מתקיים $\nabla f\perp\nabla g$.
  truth: >-
    גם $\nabla f$ וגם $\nabla g$ מאונכים לווקטור המשיק $\vec T$ של העקום, ולכן הם **מקבילים** זה לזה: $\nabla f=\lambda\nabla g$.
    גיאומטרית, קו הגובה של $f$ משיק לעקום האילוץ.
  remedy: { lesson: '10.9', label: 'תנאי לגרנז׳: גרדיאנטים מקבילים' }

- id: MC-c10-lagrange-check-constraint
  title: לא בודקים שהנקודה שנמצאה מקיימת את האילוץ
  belief: >-
    אחרי שמוצאים $x$ ו-$y$ בקירוב מתוך משוואות הגרדיאנט, אפשר להציב אותם ב-$f$.
  truth: >-
    המשוואה $g=0$ היא חלק מהמערכת, ונקודה שאינה עליה אינה מועמדת. ב-$5x+y$ על $x^2+4y^2=1$ הנקודה $(1,0.05)$ אינה על
    האליפסה ($1.01\ne1$), והמקסימום המדויק הוא $\frac{\sqrt{101}}{2}$, לא $5.05$.
  remedy: { lesson: '10.9', label: 'המערכת כוללת את האילוץ' }

- id: MC-c10-ellipse-vertices-only
  title: בודקים רק את הקודקודים של עקום האילוץ
  belief: >-
    הקיצון של $f$ על אליפסה מתקבל באחד מארבעת הקודקודים שלה, על הצירים.
  truth: >-
    הקודקודים מיוחדים רק כש-$f$ סימטרית מתאימה. ל-$x^2+y^2+xy$ על $x^2+4y^2=1$ המקסימום $\frac{5+\sqrt{13}}{8}$ מתקבל על
    ישר נטוי דרך הראשית, לא בקודקוד, שם הערך 1.
  remedy: { lesson: '10.9', label: 'כל הפתרונות של מערכת לגרנז׳' }

- id: MC-c10-lagrange-squared-objective
  title: מדווחים את הריבוע של המרחק במקום את המרחק
  belief: >-
    אחרי שממזערים את $d^2=x^2+y^2+z^2$, הערך המינימלי שהתקבל הוא המרחק.
  truth: >-
    מזעור $d^2$ במקום $d$ חוסך שורשים ונותן אותה נקודה, אבל הערך שהתקבל הוא $d^2$: בסוף מוציאים שורש.
  remedy: { lesson: '10.9', label: 'בעיות מרחק: d או הריבוע שלו' }

- id: MC-c10-lagrange-all-extrema
  title: חושבים שכל פתרון של מערכת לגרנז׳ הוא נקודת קיצון
  belief: >-
    כל נקודה שמקיימת $\nabla f=\lambda\nabla g$ ו-$g=0$ היא מקסימום או מינימום של $f$ על האילוץ.
  truth: >-
    מערכת לגרנז׳ נותנת **מועמדים**. כשהאילוץ הוא עקום סגור וחסום (מעגל, אליפסה) יש מקסימום ומינימום, ומשווים את ערכי
    $f$ במועמדים; מועמד יכול להיות גם לא זה ולא זה.
  remedy: { lesson: '10.9', label: 'מועמדים והשוואת ערכים' }

- id: MC-c10-two-constraints-drop-one
  title: פותרים בעיה עם שני אילוצים בעזרת אחד מהם בלבד
  belief: >-
    המינימום של $z$ על החיתוך של הספירה $x^2+y^2+z^2=1$ והמישור $x+y+z=1$ הוא המינימום של $z$ על הספירה, $-1$.
  truth: >-
    הנקודה צריכה לקיים את שני האילוצים. $(0,0,-1)$ על הספירה אבל לא על המישור. על המעגל שבחיתוך המינימום הוא $-\frac13$,
    וצריך $\nabla f=\lambda\nabla g+\mu\nabla h$.
  remedy: { lesson: '10.9', label: 'שני אילוצים: שני כופלים' }

- id: MC-c10-one-lambda-two-constraints
  title: משתמשים בכופל אחד גם כשיש שני אילוצים
  belief: >-
    עם שני אילוצים $g=0$ ו-$h=0$ כותבים $\nabla f=\lambda\nabla g$ ו-$\nabla f=\lambda\nabla h$, או $\nabla f=\lambda(\nabla g+\nabla h)$.
  truth: >-
    לכל אילוץ כופל משלו: $\nabla f=\lambda\nabla g+\mu\nabla h$. בשלושה משתנים זה נותן 3 משוואות, ועם שני האילוצים 5
    משוואות ב-5 נעלמים $x,y,z,\lambda,\mu$.
  remedy: { lesson: '10.9', label: 'שני אילוצים: שני כופלים' }

- id: MC-c10-lagrange-divide-by-zero
  title: מחלקים במשתנה שעשוי להתאפס ומאבדים פתרונות
  belief: >-
    מ-$4y=2\lambda y$ אפשר לחלק ב-$y$ ולקבל $\lambda=2$.
  truth: >-
    $4y=2\lambda y$ שקולה ל-$y(4-2\lambda)=0$: או $y=0$ או $\lambda=2$. חלוקה ב-$y$ מאבדת את המקרה $y=0$, ולפעמים
    דווקא שם המקסימום או המינימום.
  remedy: { lesson: '10.9', label: 'פתרון מערכת לגרנז׳: לא מאבדים מקרים' }
