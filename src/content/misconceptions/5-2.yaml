# Misconceptions first detected in lesson 5.2 (tangent line, linear approximation, differentials, notation).
- id: MC-c5-tangent-slope-not-number
  title: כותבים משוואת משיק עם הנגזרת כפונקציה במקום כמספר
  belief: >-
    המשיק ל-$f$ ב-$a$ הוא $y=f(a)+f'(x)(x-a)$, עם $f'(x)$ כפונקציה של $x$.
  truth: >-
    השיפוע של המשיק הוא **מספר**, $f'(a)$: $y=f(a)+f'(a)(x-a)$. עם $f'(x)$ יוצאת עקומה, לא ישר.
  remedy: { lesson: '5.2', label: 'משוואת המשיק: שיפוע הוא מספר' }

- id: MC-c5-tangent-through-origin
  title: שוכחים את נקודת ההשקה במשוואת המשיק
  belief: >-
    המשיק ב-$a$ הוא $y=f'(a)\,x$.
  truth: >-
    $y=f'(a)x$ עובר בראשית. המשיק עובר בנקודה $(a,f(a))$: $y=f(a)+f'(a)(x-a)$. בודקים תמיד שהישר עובר בנקודת ההשקה.
  remedy: { lesson: '5.2', label: 'המשיק עובר בנקודת ההשקה' }

- id: MC-c5-linear-approx-everywhere
  title: חושבים שהקירוב הלינארי טוב באותה מידה בכל מקום
  belief: >-
    הישר המשיק מקרב את הפונקציה היטב בכל נקודה, כי הוא ישר שמשיק לגרף.
  truth: >-
    הקירוב טוב רק ליד נקודת ההשקה: השגיאה $f(a+h)-[f(a)+f'(a)h]$ קטנה מהר יותר מ-$h$, אבל רק כש-$h$ קטן. המשיק ל-$\sqrt x$
    ב-4 נותן ב-9 את $3.25$ במקום 3.
  remedy: { lesson: '5.2', label: 'קירוב לינארי: רק ליד הנקודה' }

- id: MC-c5-differential-is-exact
  title: חושבים שהדיפרנציאל הוא השינוי המדויק של הפונקציה
  belief: >-
    $dy=f'(x)\,dx$ שווה בדיוק ל-$\Delta y=f(x+dx)-f(x)$.
  truth: >-
    $dy$ הוא השינוי **לאורך המשיק**. $\Delta y$ הוא השינוי על הגרף. ההפרש קטן לעומת $dx$ כש-$dx$ קטן, אבל בדרך כלל
    אינו 0: ל-$x^2$ ב-1 עם $dx=0.1$, $dy=0.2$ ו-$\Delta y=0.21$.
  remedy: { lesson: '5.2', label: 'דיפרנציאל מול השינוי האמיתי' }

- id: MC-c5-relative-error-exponent
  title: מעבירים שגיאה יחסית בלי להכפיל במעריך
  belief: >-
    אם $x$ נמדד בשגיאה יחסית של 1%, גם $x^n$ (נפח, שטח, שורש) ידוע בשגיאה יחסית של 1%, או של $(1\%)^n$.
  truth: >-
    מהדיפרנציאל: $\frac{d(x^n)}{x^n}=n\frac{dx}{x}$. השגיאה היחסית **מוכפלת במעריך**: פי 3 בנפח של קובייה, פי $\tfrac12$
    בשורש.
  remedy: { lesson: '5.2', label: 'שגיאה יחסית בעזרת דיפרנציאל' }

- id: MC-c5-evaluate-before-diff
  title: מציבים את הנקודה לפני שגוזרים
  belief: >-
    $\frac{d}{dx}\big[f(5)\big]$ ו-$f'(5)$ הם אותו דבר, או ש-$f(5)'$ הוא סימון לנגזרת ב-5.
  truth: >-
    $f(5)$ הוא מספר, והנגזרת של קבוע היא 0. $f'(5)$ פירושו: קודם גוזרים ומקבלים את הפונקציה $f'$, ואחר כך מציבים 5.
  remedy: { lesson: '5.2', label: 'סימוני הנגזרת: גוזרים ואז מציבים' }

- id: MC-c5-derivative-units
  title: טועים ביחידות של נגזרת
  belief: >-
    ל-$\frac{dV}{dt}$ יש היחידות של $V$, או היחידות של $V$ כפול היחידות של $t$.
  truth: >-
    $\frac{dV}{dt}$ הוא גבול של מנה $\frac{\Delta V}{\Delta t}$, ולכן יחידותיו יחידות $V$ **חלקי** יחידות $t$: ליטר
    לדקה, מטר לשנייה.
  remedy: { lesson: '5.2', label: 'סימון לייבניץ ויחידות' }

- id: MC-c5-degrees-in-calculus
  title: מציבים מעלות בנוסחת נגזרת של פונקציה טריגונומטרית
  belief: >-
    בדיפרנציאל $dy=f'(\theta)\,d\theta$ של פונקציה טריגונומטרית אפשר להציב את השינוי בזווית במעלות, למשל $d\theta=1$
    עבור מעלה אחת.
  truth: >-
    הנוסחאות $(\sin\theta)'=\cos\theta$ ו-$(\cos\theta)'=-\sin\theta$ נכונות כש-$\theta$ ברדיאנים. מעלה אחת היא
    $d\theta=\frac{\pi}{180}\approx0.0175$, ולכן הצבה של 1 מגדילה את התוצאה פי $\frac{180}{\pi}\approx57$.
  remedy: { lesson: '5.2', label: 'דיפרנציאל של זווית: ברדיאנים' }
