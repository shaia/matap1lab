# Misconceptions first detected in lesson 5.5 (the derivative table and its uses).
- id: MC-c5-cosh-sign
  title: מעתיקים את המינוס של קוסינוס לקוסינוס ההיפרבולי
  belief: >-
    $(\cosh x)'=-\sinh x$, כמו $(\cos x)'=-\sin x$.
  truth: >-
    מההגדרה $\cosh x=\frac{e^x+e^{-x}}{2}$: $(\cosh x)'=\frac{e^x-e^{-x}}{2}=\sinh x$, **בלי** מינוס. גם $(\sinh x)'=\cosh x$.
  remedy: { lesson: '5.5', label: 'הנגזרות של הפונקציות ההיפרבוליות' }

- id: MC-c5-base-ignored
  title: גוזרים אקספוננט או לוגריתם בבסיס a כאילו הבסיס הוא e
  belief: >-
    $(a^x)'=a^x$ ו-$(\log_a x)'=\frac1x$ לכל בסיס $a$.
  truth: >-
    $a^x=e^{x\ln a}$, ולכן $(a^x)'=a^x\ln a$; $\log_a x=\frac{\ln x}{\ln a}$, ולכן $(\log_a x)'=\frac{1}{x\ln a}$. רק ל-$a=e$
    הגורם $\ln a$ שווה 1.
  remedy: { lesson: '5.5', label: 'בסיס כללי: הגורם ln a' }

- id: MC-c5-related-substitute-early
  title: בקצבים קשורים מציבים את ערכי הרגע לפני הגזירה
  belief: >-
    בבעיית קצבים קשורים מציבים את הערכים של הרגע הנתון (למשל $r=5$) בנוסחה, ואז גוזרים לפי הזמן.
  truth: >-
    הערכים ברגע מסוים הם מספרים, והנגזרת של מספר היא 0. קודם כותבים קשר שנכון **בכל רגע**, גוזרים אותו לפי $t$,
    ורק אז מציבים את ערכי הרגע. גם גודל שמשתנה (רדיוס המים במיכל) אסור להחליף בקבוע.
  remedy: { lesson: '5.5', label: 'קצבים קשורים: גוזרים ואז מציבים' }

- id: MC-c5-related-same-rate
  title: חושבים שגדלים קשורים משתנים באותו קצב
  belief: >-
    אם קצה אחד של סולם זז במהירות 1 מ׳/ש׳, גם הקצה השני; אם המכונית נוסעת ב-30 מ׳/ש׳, המרחק ממנה גדל ב-30 מ׳/ש׳.
  truth: >-
    הקצבים קשורים דרך הנגזרת של הקשר ביניהם, וזו בדרך כלל אינה העתקה 1:1. בסולם $xx'+yy'=0$, כלומר
    $y'=-\frac{x}{y}x'$.
  remedy: { lesson: '5.5', label: 'הקשר בין הקצבים' }

- id: MC-c5-fprime-zero-extremum
  title: חושבים שבכל נקודה שבה הנגזרת מתאפסת יש קיצון
  belief: >-
    אם $f'(x_0)=0$, אז $x_0$ היא נקודת מקסימום או מינימום מקומי.
  truth: >-
    $f'(x_0)=0$ הוא תנאי **הכרחי** לקיצון בנקודה פנימית שבה $f$ גזירה, לא תנאי מספיק. ל-$x^3$ הנגזרת מתאפסת ב-0, אבל
    הפונקציה עולה משני הצדדים. צריך שהסימן של $f'$ יתחלף.
  remedy: { lesson: '5.5', label: 'מבחן החלפת הסימן' }

- id: MC-c5-endpoints-forgotten
  title: מחפשים מקסימום בקטע סגור רק בנקודות שבהן הנגזרת מתאפסת
  belief: >-
    הערך הגדול ביותר של $f$ בקטע $[a,b]$ מתקבל בנקודה שבה $f'=0$.
  truth: >-
    בקטע סגור בודקים שלושה סוגים של מועמדים: נקודות פנימיות שבהן $f'=0$, נקודות שבהן $f$ אינה גזירה, **וקצות הקטע**.
    ל-$x^3-3x$ ב-$[0,3]$ המקסימום 18, בקצה $x=3$.
  remedy: { lesson: '5.5', label: 'קיצון בקטע סגור: גם הקצוות' }

- id: MC-c5-sign-change-direction
  title: מבלבלים איזו החלפת סימן של הנגזרת נותנת מקסימום
  belief: >-
    כש-$f'$ עוברת מחיובית לשלילית, זו נקודת מינימום.
  truth: >-
    $f'>0$ משמאל: $f$ עולה; $f'<0$ מימין: $f$ יורדת. עלייה ואחריה ירידה היא **מקסימום** מקומי. מינוס ואחר כך פלוס
    נותן מינימום.
  remedy: { lesson: '5.5', label: 'סימן הנגזרת ותחומי עלייה וירידה' }

- id: MC-c5-fprime-graph-is-f
  title: קוראים גרף של הנגזרת כאילו הוא גרף של הפונקציה
  belief: >-
    כשנתון הגרף של $f'$, נקודות האפס שלו הן נקודות אפס של $f$, והשיא שלו הוא מקסימום של $f$.
  truth: >-
    בגרף של $f'$ קוראים **סימן**: איפה $f'>0$, שם $f$ עולה. אפס של $f'$ שבו הסימן מתחלף הוא נקודת קיצון של $f$, ולא
    נקודה שבה $f=0$.
  remedy: { lesson: '5.5', label: 'מגרף הנגזרת לגרף הפונקציה' }

- id: MC-c5-ivt-gives-uniqueness
  title: חושבים שמשפט ערך הביניים נותן פתרון יחיד
  belief: >-
    אם $f(a)<0<f(b)$ ו-$f$ רציפה, יש בדיוק פתרון אחד ל-$f(x)=0$ בקטע.
  truth: >-
    משפט ערך הביניים נותן **קיום** בלבד; יכולים להיות כמה פתרונות. יחידות באה ממונוטוניות, למשל $f'>0$ בכל הקטע.
  remedy: { lesson: '5.5', label: 'קיום מערך הביניים, יחידות מהנגזרת' }

- id: MC-c5-displacement-vs-distance
  title: מבלבלים העתק עם דרך שעברה
  belief: >-
    הדרך שגוף עבר בין $t=a$ ל-$t=b$ היא $x(b)-x(a)$.
  truth: >-
    $x(b)-x(a)$ הוא ההעתק. כשהגוף מחליף כיוון (המהירות מחליפה סימן), הדרך היא סכום המרחקים בכל קטע שבו הוא נע בכיוון
    אחד: מפצלים בנקודות שבהן $v=0$.
  remedy: { lesson: '5.5', label: 'תחומי עלייה וירידה של המקום' }
