# Misconceptions first detected in lesson 8.4 (the trapezoid rule and Simpson's rule).
- id: MC-c8-trap-weights
  title: נותנים לקצוות משקל מלא בכלל הטרפז
  belief: >-
    כלל הטרפז הוא $h(f_0+f_1+\dots+f_n)$.
  truth: >-
    $T_n=\frac h2\left(f_0+2f_1+\dots+2f_{n-1}+f_n\right)$: כל טרפז הוא $\frac h2(f_{i-1}+f_i)$, ולכן נקודה פנימית
    נספרת פעמיים והקצוות פעם אחת. זה הממוצע של הסכום השמאלי והימני.
  remedy: { lesson: '8.4', label: 'כלל הטרפז: המשקלים' }

- id: MC-c8-simpson-weights
  title: טועים במשקלים או בגורם של כלל סימפסון
  belief: >-
    בסימפסון המשקלים $1,2,2,\dots,2,1$, או שהגורם $\frac h2$, או שהמשקל 4 הולך לנקודות הזוגיות.
  truth: >-
    $S_n=\frac h3\left(f_0+4f_1+2f_2+4f_3+\dots+4f_{n-1}+f_n\right)$: משקל 4 לנקודות האמצעיות של כל זוג קטעים
    (האינדקסים האי-זוגיים), 2 לנקודות שבין הזוגות, 1 לקצוות.
  remedy: { lesson: '8.4', label: 'כלל סימפסון: המשקלים' }

- id: MC-c8-simpson-only-quadratics
  title: חושבים שסימפסון מדויק רק לפולינומים ממעלה שתיים, או שהוא דורש נוסחה
  belief: >-
    סימפסון מתאים פרבולות, ולכן הוא מדויק בדיוק לפולינומים ממעלה $\le2$; או שאפשר להפעיל אותו רק על פונקציה עם
    נוסחה.
  truth: >-
    השגיאה של סימפסון פרופורציונלית ל-$f^{(4)}$, ולכן הוא מדויק לכל פולינום ממעלה $\le3$ (ולא מעבר: ל-$x^4$ יש
    שגיאה). והוא צריך רק את הערכים $f_i$, כמו בטבלת מדידות.
  remedy: { lesson: '8.4', label: 'למה סימפסון מדויק לפולינום ממעלה שלוש' }

- id: MC-c8-error-halves
  title: חושבים שהכפלת מספר הקטעים מחלקת את הטעות בשתיים בכל שיטה
  belief: >-
    טעות של שיטה נומרית פרופורציונלית ל-$\frac1n$, ולכן הכפלת $n$ מקטינה אותה פי 2.
  truth: >-
    $\frac1n$ מתאים לסכומי רימן שמאלי וימני. בטרפז הטעות כמו $\frac1{n^2}$ (פי 4 בכל הכפלה), ובסימפסון כמו
    $\frac1{n^4}$ (פי 16).
  remedy: { lesson: '8.4', label: 'קצב הירידה של הטעות' }

- id: MC-c8-doubling-factor-mixup
  title: מחליפים בין קצב הטעות של הטרפז לזה של סימפסון
  belief: >-
    בטרפז הטעות קטנה פי 16 כשמכפילים את $n$, ובסימפסון פי 4; או שאי אפשר לזהות שיטה לפי טבלת טעויות.
  truth: >-
    טרפז: טעות כמו $h^2$, פי 4 בכל הכפלה. סימפסון: כמו $h^4$, פי 16. היחס בין טעויות עוקבות מזהה את השיטה.
  remedy: { lesson: '8.4', label: 'השוואת טעויות כשמכפילים את n' }

- id: MC-c8-simpson-odd-n
  title: שוכחים שבסימפסון מספר הקטעים זוגי, או מבלבלים קטעים עם נקודות
  belief: >-
    אפשר להפעיל סימפסון עם כל $n$, או ש-7 נקודות אינן מתאימות לסימפסון.
  truth: >-
    סימפסון מתאים פרבולה לכל **זוג** קטעים, ולכן $n$ (מספר הקטעים) זוגי. מספר הנקודות $n+1$ אז אי-זוגי: 7 נקודות
    הן 6 קטעים, ומתאימות.
  remedy: { lesson: '8.4', label: 'סימפסון: n זוגי' }

- id: MC-c8-round-down-n
  title: מעגלים את מספר הקטעים הנדרש כלפי מטה
  belief: >-
    אם $n\ge40.8$, אז $n=40$ מספיק.
  truth: >-
    החסם צריך להתקיים, ולכן מעגלים **למעלה**: $n=41$. בדקו את התשובה בהצבה בחסם.
  remedy: { lesson: '8.4', label: 'בחירת n לדיוק נתון' }

- id: MC-c8-max-wrong-end
  title: לוקחים את ערך הנגזרת בקצה לא נכון במקום את המקסימום
  belief: >-
    $M=\max|f''|$ הוא הערך בקצה הימני, או בכל נקודה נוחה.
  truth: >-
    החסם צריך את המקסימום של $|f''|$ (או של $|f^{(4)}|$) על **כל** הקטע. לפונקציה יורדת כמו $\frac2{x^3}$
    ב-$[1,2]$ הוא בקצה השמאלי. ערך קטן יותר נותן "חסם" שאינו מבטיח דבר.
  remedy: { lesson: '8.4', label: 'חסם השגיאה: המקסימום של הנגזרת' }
