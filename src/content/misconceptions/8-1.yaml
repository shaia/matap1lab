# Misconceptions first detected in lesson 8.1 (Riemann sums and area).
- id: MC-c8-left-right-endpoints
  title: מחליפים בין הסכום השמאלי, הימני וסכום האמצעים
  belief: >-
    בסכום רימן "שמאלי" דוגמים בכל הנקודות $x_1,\dots,x_n$, או שלא משנה באיזו נקודה של הקטע דוגמים.
  truth: >-
    בחלוקה $a=x_0<x_1<\dots<x_n=b$ הסכום השמאלי הוא $\sum_{i=0}^{n-1}f(x_i)\,\Delta x$ (הקצה השמאלי של כל קטע),
    הימני $\sum_{i=1}^{n}f(x_i)\,\Delta x$, וסכום האמצעים דוגם באמצע כל קטע. לחלוקה סופית הם נותנים מספרים שונים;
    רק הגבול כש-$\Delta x\to0$ משותף.
  remedy: { lesson: '8.1', label: 'סכומי רימן: איפה דוגמים בכל קטע' }

- id: MC-c8-riemann-forget-width
  title: סוכמים את ערכי הפונקציה בלי לכפול ברוחב הקטע
  belief: >-
    סכום רימן הוא $\sum f(x_i)$.
  truth: >-
    כל מחובר הוא שטח של מלבן, גובה כפול רוחב: $\sum f(x_i)\,\Delta x$. בלי $\Delta x$ הסכום גדל עם מספר הקטעים
    ואינו מתקרב לשטח.
  remedy: { lesson: '8.1', label: 'סכום רימן: גובה כפול רוחב' }

- id: MC-c8-sum-is-integral
  title: חושבים שסכום רימן שווה לאינטגרל
  belief: >-
    סכום רימן עם כמה מלבנים הוא כבר הערך של האינטגרל, או שבחירה נבונה של $n$ נותנת אותו בדיוק.
  truth: >-
    סכום רימן הוא **קירוב** לשטח. האינטגרל המסוים הוא הגבול של הסכומים כשרוחב הקטעים שואף ל-0. לחלוקה סופית יש
    בדרך כלל הפרש, למשל $L_4=\tfrac74$ ואילו $\int_0^2x^2\,dx=\tfrac83$.
  remedy: { lesson: '8.1', label: 'מסכום רימן לאינטגרל: גבול' }

- id: MC-c8-left-always-under
  title: חושבים שהסכום השמאלי תמיד קטן מהאינטגרל
  belief: >-
    הסכום השמאלי תמיד מעריך בחסר והימני תמיד בעודף, בלי קשר לפונקציה.
  truth: >-
    לפונקציה **עולה** $L_n\le\int_a^bf\le R_n$; לפונקציה **יורדת** ההפך. כשהפונקציה עולה ויורדת בקטע, אין כלל
    כללי.
  remedy: { lesson: '8.1', label: 'מתי הסכום השמאלי מעריך בחסר' }

- id: MC-c8-signed-vs-geometric
  title: מבלבלים בין אינטגרל לבין שטח גיאומטרי
  belief: >-
    $\int_a^bf(x)\,dx$ הוא תמיד השטח שבין הגרף לציר $x$, מספר חיובי.
  truth: >-
    האינטגרל הוא שטח **עם סימן**: חלקים מתחת לציר נספרים במינוס. השטח הגיאומטרי הוא $\int_a^b|f(x)|\,dx$: מפצלים
    את הקטע בנקודות שבהן $f$ מחליפה סימן.
  remedy: { lesson: '8.1', label: 'שטח עם סימן' }

- id: MC-c8-displacement-vs-distance
  title: מבלבלים בין העתק לבין דרך
  belief: >-
    האינטגרל של המהירות הוא הדרך שהגוף עבר.
  truth: >-
    $\int_{t_1}^{t_2}v\,dt$ הוא ה**העתק**, המיקום הסופי פחות ההתחלתי, ותנועה אחורה מקטינה אותו. הדרך היא
    $\int_{t_1}^{t_2}|v|\,dt$.
  remedy: { lesson: '8.1', label: 'אינטגרל של מהירות: העתק ודרך' }

- id: MC-c8-zero-integral-zero-function
  title: חושבים שאינטגרל אפס גורר פונקציה אפס
  belief: >-
    אם $\int_a^bf\,dx=0$, אז $f\equiv0$ בקטע.
  truth: >-
    שטחים עם סימנים שונים מתקזזים: $\int_0^{2\pi}\sin x\,dx=0$. רק $\int_a^b|f|\,dx=0$ (ל-$f$ רציפה) גורר $f\equiv0$.
  remedy: { lesson: '8.1', label: 'שטח עם סימן' }

- id: MC-c8-constant-integral-length
  title: חושבים שהאינטגרל של קבוע הוא הקבוע עצמו
  belief: >-
    $\int_a^b c\,dx=c$, או שמחובר קבוע בתוך האינטגרל אינו תורם.
  truth: >-
    $\int_a^b c\,dx=c(b-a)$: שטח של מלבן בגובה $c$ וברוחב $b-a$.
  remedy: { lesson: '8.1', label: 'תכונות האינטגרל: ליניאריות' }

- id: MC-c8-reverse-limits
  title: מתעלמים מסדר הגבולות
  belief: >-
    $\int_b^af\,dx$ ו-$\int_a^bf\,dx$ הם אותו מספר, או שבחישוב $F(b)-F(a)$ אפשר להחליף את הסדר.
  truth: >-
    $\int_b^af\,dx=-\int_a^bf\,dx$, ו-$\int_a^bf\,dx=F(b)-F(a)$ (הגבול העליון ראשון). החלפת הסדר הופכת סימן.
  remedy: { lesson: '8.1', label: 'תכונות האינטגרל: סדר הגבולות' }

- id: MC-c8-comparison-abs
  title: משתמשים בהשוואה בין אינטגרלים בלי לבדוק את כל הקטע, או עם ערך מוחלט
  belief: >-
    אם $f\le g$ במקום כלשהו, או אם $f\le g$, אז גם $\left|\int f\right|\le\left|\int g\right|$; או ש-$x^2\le x$ תמיד.
  truth: >-
    אם $f(x)\le g(x)$ **לכל** $x\in[a,b]$, אז $\int_a^bf\le\int_a^bg$, וזה כל מה שנובע. ערך מוחלט אינו שומר על סדר
    (למשל $-2\le1$). מה שנכון תמיד: $\left|\int_a^bf\right|\le\int_a^b|f|$.
  remedy: { lesson: '8.1', label: 'תכונות האינטגרל: השוואה' }

- id: MC-c8-definite-plus-c
  title: כותבים פלוס קבוע או פונקציה כתשובה לאינטגרל מסוים
  belief: >-
    $\int_0^1 2x\,dx=x^2+C$, כמו באינטגרל לא מסוים.
  truth: >-
    אינטגרל מסוים הוא **מספר**: $\int_0^12x\,dx=\left[x^2\right]_0^1=1$. הקבוע $C$ מתבטל בהפרש $F(b)-F(a)$.
  remedy: { lesson: '8.1', label: 'אינטגרל מסוים הוא מספר' }
