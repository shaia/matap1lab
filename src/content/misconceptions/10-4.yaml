# Misconceptions first detected in lesson 10.4 (the gradient and its meaning).
- id: MC-c10-max-rate-sum
  title: חושבים שקצב העלייה המרבי הוא סכום הנגזרות החלקיות
  belief: >-
    קצב העלייה המהיר ביותר של $f$ בנקודה הוא $f_x+f_y$.
  truth: >-
    $D_{\hat u}f=\nabla f\cdot\hat u\le|\nabla f|$, ושוויון מתקבל כש-$\hat u$ בכיוון $\nabla f$. לכן הקצב המרבי הוא
    $|\nabla f|=\sqrt{f_x^2+f_y^2}$. הסכום $f_x+f_y$ הוא הנגזרת בכיוון $(1,1)$, שאינו וקטור יחידה ואינו בכיוון הגרדיאנט
    בדרך כלל.
  remedy: { lesson: '10.4', label: 'הקצב המרבי הוא האורך של הגרדיאנט' }

- id: MC-c10-gradient-sign
  title: מתבלבלים בין כיוון העלייה לכיוון הירידה של הגרדיאנט
  belief: >-
    הגרדיאנט מצביע לכיוון שבו הפונקציה יורדת הכי מהר, או שהקצב בכיוון ההפוך לגרדיאנט הוא $+|\nabla f|$.
  truth: >-
    $\nabla f$ מצביע לכיוון העלייה המהירה ביותר, וקצב השינוי בו $|\nabla f|$. בכיוון $-\nabla f$ הירידה המהירה ביותר,
    וקצב השינוי $-|\nabla f|$.
  remedy: { lesson: '10.4', label: 'כיוון העלייה וכיוון הירידה' }

- id: MC-c10-gradient-along-level
  title: חושבים שהגרדיאנט משיק לקו הגובה
  belief: >-
    הגרדיאנט מצביע לאורך קו הגובה, ולכן הוא וקטור הכיוון של הישר המשיק לקו הגובה.
  truth: >-
    לאורך קו גובה $f$ קבועה, ולכן $\nabla f\cdot\vec r\,'(t)=0$: הגרדיאנט **מאונך** לקו הגובה. הוא הנורמל של הישר
    המשיק, לא וקטור הכיוון שלו.
  remedy: { lesson: '10.4', label: 'הגרדיאנט מאונך לקו הגובה' }
