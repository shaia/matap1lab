# Misconceptions first detected in lesson 7.3 (integration by parts).
- id: MC-c7-parts-drop-integral
  title: שוכחים את האינטגרל שנשאר באינטגרציה בחלקים
  belief: >-
    $\int xe^x\,dx=xe^x+C$: אחרי שבוחרים $u$ ו-$v$, התשובה היא $uv$.
  truth: >-
    $\int uv'\,dx=uv-\int u'v\,dx$: האינטגרל שנשאר הוא חלק מהתשובה, ואותו צריך לחשב. בדיקה בגזירה: $(xe^x)'=xe^x+e^x$,
    עודף של $e^x$.
  remedy: { lesson: '7.3', label: 'הנוסחה של אינטגרציה בחלקים' }

- id: MC-c7-parts-wrong-choice
  title: בוחרים לגזור את הגורם הלא נכון באינטגרציה בחלקים
  belief: >-
    לא משנה איזה גורם גוזרים, או שתמיד גוזרים את הגורם הראשון בכתיבה.
  truth: >-
    גוזרים את הגורם שנעשה פשוט יותר בגזירה (חזקה של $x$, $\ln x$, $\arctan x$) ומבצעים אינטגרציה לגורם שאינו מסתבך
    ($e^x$, $\sin x$, $\cos x$). בחירה הפוכה מעלה את החזקה ומסבכת. ובמכפלה כמו $xe^{x^2}$ ההצבה מתאימה יותר מחלקים.
  remedy: { lesson: '7.3', label: 'איזה גורם לגזור' }

- id: MC-c7-parts-sign-repeat
  title: מאבדים סימנים כשמפעילים אינטגרציה בחלקים כמה פעמים
  belief: >-
    $x^2e^x-2\int xe^x\,dx=x^2e^x-2xe^x-2e^x$: המינוס שלפני האינטגרל חל רק על האיבר הראשון.
  truth: >-
    המינוס חל על כל התוצאה של האינטגרל שנשאר: $-2\left[(x-1)e^x\right]=-2xe^x+2e^x$. כדאי לשים סוגריים בכל שלב.
  remedy: { lesson: '7.3', label: 'אינטגרציה בחלקים כמה פעמים' }

- id: MC-c7-parts-cycle-divide
  title: שוכחים לחלק במקדם כשהאינטגרל חוזר על עצמו
  belief: >-
    מ-$I=A-I$ מסיקים $I=A$, או $I=0$.
  truth: >-
    $I=A-I$ היא משוואה לינארית: $2I=A$, ולכן $I=\frac A2+C$. למשל $\int e^x\sin x\,dx=\frac{e^x(\sin x-\cos x)}{2}+C$.
  remedy: { lesson: '7.3', label: 'האינטגרל שחוזר על עצמו' }

- id: MC-c7-parts-cycle-fails
  title: חושבים שאינטגרציה בחלקים נכשלה כשהאינטגרל המקורי חוזר
  belief: >-
    אם אחרי שתי אינטגרציות בחלקים חוזרים ל-$\int e^x\cos x\,dx$, השיטה הסתובבה במעגל ואין תשובה.
  truth: >-
    כשהאינטגרל חוזר עם מקדם שונה מ-1, פותרים בשבילו כמו נעלם. מעגל אמיתי ($I=I$) מתקבל רק אם בפעם השנייה מחליפים את
    תפקידי הגורמים ומבטלים את הצעד הראשון.
  remedy: { lesson: '7.3', label: 'האינטגרל שחוזר על עצמו' }
