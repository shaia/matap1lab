# Misconceptions first detected in lesson 2.4 (cylindrical and spherical coordinates).
- id: MC-c2-spherical-convention
  title: מודדים את הזווית של קואורדינטות כדוריות ממישור xy במקום מציר z
  belief: >-
    בקואורדינטות כדוריות $z=r\sin\theta$, כי $\theta$ היא הזווית מעל מישור $xy$ (כמו קו רוחב).
  truth: >-
    בקורס הזה $\theta$ היא הזווית **מציר $z$ החיובי**, $0\le\theta\le\pi$, ו-$\varphi$ האזימוט במישור $xy$:
    $x=r\sin\theta\cos\varphi$, $y=r\sin\theta\sin\varphi$, $z=r\cos\theta$. בסיכומי ההרצאות הזווית נמדדת דווקא
    ממישור $xy$ (זווית רוחב $\beta$), ושם $z=\rho\sin\beta$: הזווית שלנו היא $\theta=\frac{\pi}{2}-\beta$, והאזימוט
    נשאר אותה זווית. מזהים מוסכמה לפי הנוסחה של $z$: קוסינוס פירושו זווית מציר $z$, סינוס פירושו זווית ממישור $xy$.
  remedy: { lesson: '2.4', anchor: conventions, label: 'המוסכמה של הקורס לקואורדינטות כדוריות' }

- id: MC-c2-theta-cyl-vs-sph
  title: חושבים שהאות θ מציינת אותה זווית בגליליות ובכדוריות
  belief: >-
    ה-$\theta$ של קואורדינטות גליליות וה-$\theta$ של קואורדינטות כדוריות הן אותה זווית.
  truth: >-
    בגליליות $(r,\theta,z)$ הזווית $\theta$ היא האזימוט במישור $xy$, כמו בקוטביות. בכדוריות $(r,\theta,\varphi)$
    האזימוט נקרא $\varphi$, ו-$\theta$ היא הזווית מציר $z$. כשעוברים בין השתיים, ה-$\theta$ הגלילי הוא ה-$\varphi$
    הכדורי.
  remedy: { lesson: '2.4', anchor: theta-clash, label: 'אותה אות, זוויות שונות' }

- id: MC-c2-cyl-r-vs-sph-r
  title: מבלבלים בין ה-r של גליליות לבין ה-r של כדוריות
  belief: >-
    בשתי המערכות $r$ הוא המרחק מהראשית, ולכן $r=2$ הוא תמיד ספירה.
  truth: >-
    בגליליות $r=\sqrt{x^2+y^2}$ הוא המרחק **מציר $z$**, ו-$r=2$ הוא גליל. בכדוריות $r=\sqrt{x^2+y^2+z^2}$ הוא המרחק
    **מהראשית**, ו-$r=2$ ספירה. הקשר: ה-$r$ הגלילי שווה $r\sin\theta$ הכדורי.
  remedy: { lesson: '2.4', anchor: two-r, label: 'שני סוגי r' }

- id: MC-c2-angle-const-plane
  title: חושבים שכל זווית קבועה נותנת מישור
  belief: >-
    $\theta=\frac{\pi}{4}$ בקואורדינטות כדוריות הוא מישור, כמו $\varphi=\frac{\pi}{4}$.
  truth: >-
    $\varphi$ קבוע הוא חצי מישור שמכיל את ציר $z$. $\theta$ קבוע הוא **חרוט** סביב ציר $z$ שהקודקוד שלו בראשית (הוא פונה למעלה
    כש-$\theta<\frac{\pi}{2}$ ולמטה כש-$\theta>\frac{\pi}{2}$), ורק $\theta=\frac{\pi}{2}$ הוא מישור, מישור $xy$.
  remedy: { lesson: '2.4', anchor: coordinate-surfaces, label: 'משטחי הקואורדינטות' }

- id: MC-c2-cone-inside-outside
  title: מתבלבלים איזה צד של החרוט הוא התחום
  belief: >-
    "מעל החרוט $z=\sqrt{x^2+y^2}$" פירושו $\frac{\pi}{4}\le\theta\le\frac{\pi}{2}$, או שהחתך של גוף נקבע לפי המשטח
    הראשון שעולה בדעתנו.
  truth: >-
    מעל החרוט $z\ge\sqrt{x^2+y^2}$, כלומר קרוב לציר $z$: $0\le\theta\le\frac{\pi}{4}$. כשגוף חסום בשני משטחים, נקודה של
    הגוף מקיימת את שני התנאים: מבין שתי תקרות קובעת הנמוכה, והיא יכולה להתחלף במקום שבו המשטחים נפגשים.
  remedy: { lesson: '2.4', anchor: cone-side, label: 'גופים שחסומים בחרוט' }

- id: MC-c2-sqrt-of-difference
  title: מוציאים שורש מכל איבר בנפרד
  belief: >-
    $\sqrt{9-r^2}=3-r$.
  truth: >-
    שורש אינו מתחלק על חיבור או חיסור. ב-$r=0$ וב-$r=3$ שני הביטויים שווים במקרה, אבל ב-$r=2$ השמאלי
    $\sqrt5\approx2.24$ והימני 1. החצי העליון של הספירה $x^2+y^2+z^2=9$ הוא $z=\sqrt{9-r^2}$.
  remedy: { lesson: '2.4', anchor: sphere-cylindrical, label: 'ספירה בקואורדינטות גליליות' }

- id: MC-c2-azimuth-difference-is-angle
  title: חושבים שהזווית בין שני כיוונים היא הפרש האזימוטים
  belief: >-
    הזווית בין שני וקטורי מקום על ספירה היא $|\varphi_1-\varphi_2|$.
  truth: >-
    זה נכון רק לשתי נקודות על קו המשווה ($\theta=\frac{\pi}{2}$). באופן כללי מחשבים את שני הווקטורים בקואורדינטות
    קרטזיות ואת הזווית ממכפלה סקלרית: $\cos\alpha=\frac{\vec u\cdot\vec v}{|\vec u||\vec v|}$. שתי נקודות עם
    $\theta=\frac{\pi}{3}$ והפרש אזימוטים $\frac{\pi}{2}$ נמצאות בזווית $\arccos\frac14$.
  remedy: { lesson: '2.4', anchor: ex-2-4-5, label: 'מכפלה סקלרית בקואורדינטות כדוריות' }
