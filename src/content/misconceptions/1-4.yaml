# Misconceptions first detected in lesson 1.4 (the cross product).
- id: MC-c1-cross-commutes
  title: חושבים שהמכפלה הווקטורית חילופית
  belief: >-
    $\vec u\times\vec v=\vec v\times\vec u$, ולכן הסדר במומנט $\vec r\times\vec F$ או בכוח $q\vec v\times\vec B$ לא משנה.
  truth: >-
    $\vec v\times\vec u=-\vec u\times\vec v$: החלפת הסדר הופכת את הכיוון. $\hat\imath\times\hat\jmath=\hat k$ אבל
    $\hat\jmath\times\hat\imath=-\hat k$. בכלל יד ימין האצבעות מסתובבות מהגורם **הראשון** אל השני.
  remedy: { lesson: '1.4', anchor: cross-order, label: 'המכפלה הווקטורית: הסדר קובע את הכיוון' }

- id: MC-c1-middle-sign
  title: שוכחים את המינוס של הרכיב האמצעי במכפלה וקטורית
  belief: >-
    כשמכסים עמודה וכופלים בהצלבה (או מפתחים את הדטרמיננטה לפי השורה הראשונה), כל שלושת הרכיבים באים עם פלוס, ולכן
    הרכיב האמצעי, רכיב ה-$\hat\jmath$, של $\vec u\times\vec v$ הוא $u_1v_3-u_3v_1$.
  truth: >-
    הסימנים בשיטת "מכסים עמודה", וגם בפיתוח לפי השורה הראשונה, הם $+\,-\,+$. הרכיב האמצעי הוא
    $-(u_1v_3-u_3v_1)=u_3v_1-u_1v_3$. בדיקה: התוצאה צריכה להיות מאונכת לשני הגורמים.
  remedy: { lesson: '1.4', anchor: middle-sign, label: 'פיתוח דטרמיננטה: הסימנים פלוס, מינוס, פלוס' }

- id: MC-c1-cross-componentwise
  title: מחשבים מכפלה וקטורית רכיב ברכיב
  belief: >-
    $(1,2,3)\times(4,5,6)=(4,10,18)$.
  truth: >-
    כל רכיב של $\vec u\times\vec v$ בנוי מהרכיבים **האחרים**: $(u_2v_3-u_3v_2,\ u_3v_1-u_1v_3,\ u_1v_2-u_2v_1)$. בדיקה:
    $(4,10,18)\cdot(1,2,3)\ne0$, והמכפלה הווקטורית חייבת להיות מאונכת לגורמים.
  remedy: { lesson: '1.4', anchor: cross-formula, label: 'נוסחת המכפלה הווקטורית' }

- id: MC-c1-cross-vs-dot
  title: מבלבלים בין המכפלה הווקטורית לסקלרית
  belief: >-
    $\vec u\times\vec v$ הוא מספר, הוא מתאפס כשהווקטורים מאונכים, או שאפשר לכתוב $\vec u\times(\vec v\cdot\vec w)$.
  truth: >-
    $\vec u\cdot\vec v$ הוא מספר שמתאפס כשהווקטורים **מאונכים**; $\vec u\times\vec v$ הוא וקטור שמתאפס כשהם **מקבילים**.
    מכפלה וקטורית מוגדרת רק בין שני וקטורים, ולכן $\vec u\times(\vec v\cdot\vec w)$ חסר משמעות.
  remedy: { lesson: '1.4', anchor: dot-vs-cross, label: 'סקלרית מול וקטורית' }

- id: MC-c1-triangle-half
  title: שוכחים את החצי בשטח משולש
  belief: >-
    שטח המשולש $ABC$ הוא $|\vec{AB}\times\vec{AC}|$.
  truth: >-
    $|\vec{AB}\times\vec{AC}|$ הוא שטח **המקבילית** שנפרשת מ-$\vec{AB}$ ו-$\vec{AC}$; המשולש הוא חצי ממנה:
    $\frac12|\vec{AB}\times\vec{AC}|$.
  remedy: { lesson: '1.4', anchor: triangle-half, label: 'שטח מקבילית ושטח משולש' }

- id: MC-c1-cross-magnitude-no-sin
  title: חושבים שגודל המכפלה הווקטורית הוא מכפלת האורכים
  belief: >-
    $|\vec u\times\vec v|=|\vec u|\,|\vec v|$, וגודל המומנט הוא תמיד $|\vec r|\,|\vec F|$.
  truth: >-
    $|\vec u\times\vec v|=|\vec u||\vec v|\sin\theta$. רק הרכיב המאונך נחשב: כוח לאורך הקו שעובר בציר הסיבוב אינו יוצר
    מומנט כלל ($\theta=0$).
  remedy: { lesson: '1.4', anchor: cross-magnitude, label: 'גודל המכפלה הווקטורית: שטח עם סינוס' }

- id: MC-c1-cross-along-factor
  title: חושבים שהמכפלה הווקטורית מצביעה בכיוון אחד הגורמים
  belief: >-
    $\vec u\times\vec v$ נמצא במישור של $\vec u$ ו-$\vec v$, למשל בכיוון של אחד מהם.
  truth: >-
    $\vec u\times\vec v$ מאונך **לשניהם**, כלומר למישור שהם פורשים. לכן משתמשים בו כנורמל למישור.
  remedy: { lesson: '1.4', anchor: cross-perpendicular, label: 'המכפלה הווקטורית מאונכת לשני הגורמים' }
