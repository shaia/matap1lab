# Misconceptions first detected in lesson 12.3 (double integrals in polar coordinates).
- id: MC-c12-polar-no-r
  title: שוכחים את הגורם r במעבר לקוטביות או לגליליות
  belief: >-
    במעבר לקואורדינטות קוטביות $dx\,dy=dr\,d\theta$ (ובגליליות $dV=dr\,d\theta\,dz$).
  truth: >-
    התא הקוטבי הקטן הוא כמעט מלבן עם צלעות $dr$ ו-$r\,d\theta$, ולכן $dA=r\,dr\,d\theta$; זה הערך המוחלט של היעקוביאן
    $\frac{\partial(x,y)}{\partial(r,\theta)}=r$. בגליליות $dV=r\,dr\,d\theta\,dz$.
  remedy: { lesson: '12.3', label: 'הגורם r באלמנט השטח' }

- id: MC-c12-polar-limits
  title: גבולות שגויים בקואורדינטות קוטביות
  belief: >-
    לגזרה או לעיגול לוקחים את $\theta$ "בערך" (למשל 0 עד $\pi$ לעיגול שלם, או הרבע הלא נכון), או מעלים את $r$ עד
    $R^2$ כשהמעגל הוא $x^2+y^2=R^2$, או שוכחים את האינטגרל לפי $\theta$.
  truth: >-
    כל קרן מהראשית בזווית $\theta$ נכנסת לתחום ויוצאת ממנו: זה הטווח של $r$ (למעגל $x^2+y^2=R^2$, עד $r=R$). הטווח של
    $\theta$ הוא הזוויות של הקרניים שפוגשות את התחום: לעיגול שלם $0\le\theta\le2\pi$, ואז האינטגרל לפי $\theta$ של
    פונקציה של $r$ בלבד נותן גורם $2\pi$.
  remedy: { lesson: '12.3', label: 'גבולות בקוטביות: קרניים מהראשית' }

- id: MC-c12-coords-mismatch
  title: בוחרים מערכת קואורדינטות בלי להתאים אותה לשפה ולאינטגרנד
  belief: >-
    קואורדינטות קוטביות (או כדוריות) תמיד מפשטות, או שבוחרים לפי צורה אחת שמופיעה בבעיה בלי לבדוק את שאר השפה.
  truth: >-
    בוחרים קואורדינטות שבהן **כל** השפה נעשית "קואורדינטה = קבוע" והאינטגרנד פשוט: עיגולים וטבעות לקוטביות, גליל
    ומשטחים מעליו ומתחתיו לגליליות, כדור וחרוט סביב ציר $z$ לכדוריות. למלבן או לתיבה נשארים בקרטזיות.
  remedy: { lesson: '12.5', label: 'בוחרים מערכת קואורדינטות לפי השפה' }

- id: MC-c12-gauss-forget-root
  title: שוכחים להוציא שורש בחישוב אינטגרל גאוס
  belief: >-
    $\int_{-\infty}^{\infty}e^{-x^2}\,dx=\pi$, כי זה מה שיוצא מהאינטגרל בקוטביות.
  truth: >-
    בקוטביות מחשבים את $\iint_{\mathbb{R}^2}e^{-(x^2+y^2)}\,dA=\pi$, וזה **הריבוע** $I^2$ של $I=\int_{-\infty}^{\infty}e^{-x^2}\,dx$.
    לכן $I=\sqrt\pi$ (השורש החיובי, כי $I>0$).
  remedy: { lesson: '12.3', label: 'אינטגרל גאוס: I בריבוע' }

- id: MC-c12-gauss-quadrant
  title: מבלבלים בין הרביע הראשון למישור כולו באינטגרל גאוס
  belief: >-
    $\iint e^{-(x^2+y^2)}\,dA$ על הרביע הראשון שווה $\pi$, כמו על המישור כולו, או שבמישור כולו לוקחים $0\le\theta\le\frac\pi2$.
  truth: >-
    על הרביע הראשון $0\le\theta\le\frac\pi2$ והתוצאה $\frac\pi4$, שהיא $\left(\int_0^\infty e^{-x^2}dx\right)^2$; על המישור
    כולו $0\le\theta\le2\pi$ והתוצאה $\pi$.
  remedy: { lesson: '12.3', label: 'אינטגרל גאוס: איזה תחום' }
