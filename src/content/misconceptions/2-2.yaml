# Misconceptions first detected in lesson 2.2 (parabola and hyperbolas).
- id: MC-c2-conic-by-sign
  title: מתעלמים מהסימן שבין הריבועים
  belief: >-
    $9x^2-4y^2=36$ ו-$9x^2+4y^2=36$ הם אותו סוג עקום, או שמינוס באגף ימין הופך עקום להיפרבולה.
  truth: >-
    מה שקובע הוא הסימנים של המקדמים של $x^2$ ושל $y^2$ (בלי איבר $xy$): אותו סימן אליפסה (או מעגל, או קבוצה ריקה, או
    נקודה), סימנים שונים היפרבולה (או זוג ישרים), ואחד מהם 0 פרבולה. $x^2+2y^2=-1$ הוא הקבוצה הריקה, לא היפרבולה.
  remedy: { lesson: '2.2', anchor: identify, label: 'זיהוי חתך חרוט לפי המשוואה' }

- id: MC-c2-degenerate-conic
  title: חושבים שכל משוואה ממעלה שנייה היא אליפסה, פרבולה או היפרבולה
  belief: >-
    $x^2-y^2=0$ היא היפרבולה, ו-$x^2+y^2=0$ הוא מעגל.
  truth: >-
    יש חתכי חרוט "מנוונים": $x^2-y^2=0$ הוא זוג הישרים $y=\pm x$ (האסימפטוטות של $x^2-y^2=c$), $x^2+y^2=0$ הוא
    הנקודה $(0,0)$, ו-$x^2+y^2=-1$ הקבוצה הריקה. בודקים את אגף ימין אחרי השלמת הריבוע.
  remedy: { lesson: '2.2', anchor: degenerate, label: 'חתכי חרוט מנוונים' }

- id: MC-c2-hyperbola-opening
  title: טועים בכיוון שאליו ההיפרבולה פתוחה
  belief: >-
    כל היפרבולה חותכת את ציר $x$, או ש-$xy=1$ נמצאת בכל ארבעת הרביעים כמו $x^2-y^2=1$.
  truth: >-
    $x^2-y^2=c$ עם $c>0$ פתוחה ימינה ושמאלה וחותכת את ציר $x$; עם $c<0$ היא פתוחה למעלה ולמטה. $xy=c$ עם $c>0$
    נמצאת ברביעים הראשון והשלישי בלבד. בדיקה: הציבו $x=0$ ו-$y=0$ וראו לאיזו הצבה יש פתרון.
  remedy: { lesson: '2.2', anchor: hyperbola, label: 'שלוש ההיפרבולות הבסיסיות' }

- id: MC-c2-asymptote-swap
  title: הופכים את השיפוע של האסימפטוטה
  belief: >-
    האסימפטוטות של $\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$ הן $y=\pm\frac{a}{b}x$.
  truth: >-
    רחוק מהמרכז ה-1 זניח, ו-$\frac{x^2}{a^2}\approx\frac{y^2}{b^2}$, כלומר $y\approx\pm\frac{b}{a}x$. בהיפרבולה
    מוזזת האסימפטוטות עוברות דרך המרכז: $y-k=\pm\frac{b}{a}(x-h)$.
  remedy: { lesson: '2.2', anchor: asymptotes, label: 'האסימפטוטות של היפרבולה' }

- id: MC-c2-xy-asymptotes
  title: חושבים שהאסימפטוטות של כל היפרבולה הן y שווה פלוס מינוס x
  belief: >-
    לכל היפרבולה, גם ל-$xy=1$, האסימפטוטות הן $y=x$ ו-$y=-x$.
  truth: >-
    $y=\pm x$ הן האסימפטוטות של $x^2-y^2=c$. ל-$xy=1$, כלומר $y=\frac1x$, האסימפטוטות הן הצירים: כש-$|x|$ גדל
    מאוד $y$ מתקרב ל-0, וכש-$x$ מתקרב ל-0, $|y|$ גדל בלי גבול. $xy=1$ היא $x^2-y^2=2$ מסובבת ב-$45^\circ$. בהיפרבולה
    מוזזת $(x-h)(y-k)=c$ האסימפטוטות הן $x=h$ ו-$y=k$.
  remedy: { lesson: '2.2', anchor: xy-hyperbola, label: 'האסימפטוטות של xy=1' }

- id: MC-c2-param-range
  title: בודקים רק שהנקודות על העקום ולא שהן מכסות את כולו
  belief: >-
    אם כל נקודה של המסילה מקיימת את משוואת העקום, המסילה היא פרמטריזציה של העקום כולו.
  truth: >-
    צריך גם שכל נקודה של העקום תתקבל. $(t^2,t^4)$ מקיימת $y=x^2$, אבל $x=t^2\ge0$, ולכן היא עוברת רק על החצי
    הימני של הפרבולה. בודקים אילו ערכים כל רכיב מקבל.
  remedy: { lesson: '2.2', anchor: param, label: 'פרמטריזציה של כל העקום' }

- id: MC-c2-parabola-axis
  title: חושבים שכל פרבולה נפתחת כלפי מעלה או כלפי מטה
  belief: >-
    כל משוואה של פרבולה אפשר לקרוא כמו $y=a(x-h)^2+k$, גם כשהמשתנה שבריבוע הוא $y$.
  truth: >-
    המשתנה שבריבוע קובע את הכיוון. כשהריבוע של $y$, הפרבולה היא $x=a(y-k)^2+h$: היא נפתחת ימינה או שמאלה, ציר
    הסימטריה שלה אופקי, $y=k$, והקודקוד עדיין $(h,k)$. היא אינה גרף של פונקציה של $x$.
  remedy: { lesson: '2.2', anchor: parabola, label: 'פרבולה אופקית' }

- id: MC-c2-complete-square-sign
  title: מוסיפים במקום להחסיר בהשלמה לריבוע
  belief: >-
    $x^2-4x=(x-2)^2+4$.
  truth: >-
    $(x-2)^2=x^2-4x+4$, ולכן $x^2-4x=(x-2)^2-4$: את מה שנוסף מחסירים. כשיש מקדם או מינוס לפני הסוגריים,
    $-(y^2-4y)=-(y-2)^2+4$, גם הפיצוי מוכפל בו.
  remedy: { lesson: '2.2', anchor: ex-2-2-6, label: 'השלמה לריבוע בזיהוי חתך חרוט' }
