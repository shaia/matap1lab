# Misconceptions first detected in lesson 11.1 (vector fields, gradient fields, flow lines).
- id: MC-c11-field-point-check
  title: מנחשים את כיוון החצים של שדה בלי להציב נקודה
  belief: >-
    אפשר לדעת "בעין" לאן מסתובב שדה כמו $(-y,x)$ או $(y,-x)$, בלי לחשב את השדה באף נקודה.
  truth: >-
    כיוון השדה נקבע בהצבה. ב-$(1,0)$ השדה $(-y,x)$ הוא $(0,1)$ (למעלה: סיבוב נגד כיוון השעון), והשדה $(y,-x)$ הוא
    $(0,-1)$ (למטה: עם כיוון השעון). שתיים-שלוש נקודות על הצירים מספיקות כדי לשרטט שדה פשוט.
  remedy: { lesson: '11.1', label: 'שרטוט שדה: מציבים נקודות על הצירים' }

- id: MC-c11-rotational-vs-radial
  title: מחליפים בין שדה רדיאלי לשדה סיבובי
  belief: >-
    השדה $(-y,x)$ מצביע החוצה מהראשית, או שהשדה $(x,y)$ מסתובב סביבה.
  truth: >-
    $(x,y)$ הוא וקטור המקום: הוא מצביע החוצה מהראשית (שדה רדיאלי). $(-y,x)$ מאונך לווקטור המקום, כי
    $(x,y)\cdot(-y,x)=0$: הוא משיק למעגלים סביב הראשית (שדה סיבובי).
  remedy: { lesson: '11.1', label: 'שלושת השדות הבסיסיים: קבוע, רדיאלי וסיבובי' }

- id: MC-c11-field-length-ignored
  title: מתעלמים מאורך החצים של השדה
  belief: >-
    השדות $(x,y)$ ו-$\frac{(x,y)}{\sqrt{x^2+y^2}}$ הם אותו שדה, כי הם מצביעים לאותו כיוון.
  truth: >-
    שדה וקטורי קובע בכל נקודה גם כיוון וגם אורך. ל-$(x,y)$ האורך הוא המרחק מהראשית, ולכן החצים מתארכים כשמתרחקים;
    ל-$\frac{(x,y)}{\sqrt{x^2+y^2}}$ כל החצים באורך 1.
  remedy: { lesson: '11.1', label: 'שדה וקטורי: כיוון וגם אורך בכל נקודה' }

- id: MC-c11-gradient-order
  title: מחליפים את סדר הרכיבים של הגרדיאנט
  belief: >-
    הרכיב הראשון של $\nabla f$ הוא $\frac{\partial f}{\partial y}$, או שהסדר לא משנה.
  truth: >-
    $\nabla f=\left(\frac{\partial f}{\partial x},\frac{\partial f}{\partial y}\right)$: הרכיב ה-$x$ הוא הנגזרת לפי $x$.
    החלפת הרכיבים נותנת שדה אחר לגמרי: ל-$f=x^2y$ הגרדיאנט $(2xy,x^2)$, ו-$(x^2,2xy)$ אינו גרדיאנט של אף פונקציה.
  remedy: { lesson: '11.1', label: 'שדה הגרדיאנט: רכיב לכל משתנה' }

- id: MC-c11-flowline-is-level
  title: חושבים שקווי הזרימה של שדה גרדיאנט הם קווי הגובה
  belief: >-
    קו זרימה של $\nabla f$ הולך לאורך קו גובה של $f$, או שקו זרימה מאונך לשדה.
  truth: >-
    קו זרימה הולך **בכיוון** השדה: $\vec r\,'(t)=\vec F(\vec r(t))$. הגרדיאנט מאונך לקווי הגובה, ולכן קווי הזרימה של
    $\nabla f$ חוצים את קווי הגובה בזווית ישרה ועולים במהירות הגדולה ביותר.
  remedy: { lesson: '11.1', label: 'קווי זרימה: הולכים בכיוון השדה' }

- id: MC-c11-flowline-speed
  title: חושבים שמספיק שהמהירות של העקום תהיה מקבילה לשדה
  belief: >-
    כל פרמטריזציה של עקום שמשיק לשדה בכל נקודה היא קו זרימה, גם אם היא עוברת אותו מהר יותר או לאט יותר.
  truth: >-
    בקו זרימה וקטור המהירות **שווה** לשדה: $\vec r\,'(t)=\vec F(\vec r(t))$, כמו חלקיק שהשדה הוא המהירות שלו.
    $(\cos2t,\sin2t)$ עובר על אותו מעגל, אבל המהירות שלו היא $2\vec F$ ולא $\vec F$ של $\vec F=(-y,x)$.
  remedy: { lesson: '11.1', label: 'הגדרת קו זרימה: המהירות שווה לשדה' }

- id: MC-c11-gradient-vs-value
  title: מחליפים את ערך הפונקציה באורך הגרדיאנט שלה
  belief: >-
    אם $f(3,4)=5$, אז גם האורך של $\nabla f(3,4)$ הוא 5.
  truth: >-
    $f$ נותנת מספר בכל נקודה, ו-$\nabla f$ נותן וקטור שמתאר את **קצב** השינוי של $f$. ל-$f=\sqrt{x^2+y^2}$ הערך
    ב-$(3,4)$ הוא 5, אבל $\nabla f=\frac{(x,y)}{\sqrt{x^2+y^2}}$ הוא וקטור יחידה: המרחק גדל בקצב 1 כשמתרחקים מהראשית.
  remedy: { lesson: '11.1', label: 'שדה גרדיאנט: קצב שינוי, לא ערך' }
