# Misconceptions first detected in lesson 8.5 (areas between graphs, solids of revolution).
- id: MC-c8-area-order
  title: מחסרים את הגרף העליון מהתחתון
  belief: >-
    השטח בין $f$ ל-$g$ הוא $\int(g-f)\,dx$ בסדר שבו הפונקציות נכתבו, ותוצאה שלילית היא שטח שלילי.
  truth: >-
    השטח הוא $\int_a^b(f-g)\,dx$ כש-$f$ הגרף העליון ו-$g$ התחתון: בכל קטע מחסרים מהעליון את התחתון. בודקים מי
    עליון בהצבה של נקודה אחת בין החיתוכים. שטח אינו שלילי.
  remedy: { lesson: '8.5', anchor: 'top-minus-bottom', label: 'שטח בין שני גרפים: עליון פחות תחתון' }

- id: MC-c8-area-crossing
  title: מחשבים שטח בין גרפים שנחתכים באינטגרל אחד
  belief: >-
    השטח בין $f$ ל-$g$ ב-$[a,b]$ הוא $\int_a^b(f-g)\,dx$ גם כשהגרפים נחתכים בתוך הקטע.
  truth: >-
    השטח הוא $\int_a^b|f-g|\,dx$: מפצלים בכל נקודת חיתוך, ובכל חלק מחסרים מהעליון את התחתון. אחרת חלקים מתקזזים,
    כמו $\int_{-1}^{1}(x-x^3)\,dx=0$.
  remedy: { lesson: '8.5', anchor: 'area-crossing', label: 'גרפים שמחליפים מקום' }

- id: MC-c8-area-one-formula
  title: מתעלמים מגבול שמשנה נוסחה, או מערבבים גבולות של x ושל y
  belief: >-
    לתחום בין שני עקומים תמיד מספיק אינטגרל אחד לפי $x$, עם הגבולות של נקודות החיתוך.
  truth: >-
    כשהגבול העליון או התחתון של התחום משנה נוסחה, אינטגרל לפי $x$ מתפצל. לפעמים אינטגרל לפי $y$ ("ימני פחות
    שמאלי") פותר את זה, והגבולות שלו הם ערכי $y$ של החיתוכים.
  remedy: { lesson: '8.5', anchor: 'area-dy', label: 'שטח: אינטגרציה לפי x או לפי y' }

- id: MC-c8-disc-no-square
  title: שוכחים להעלות את הרדיוס בריבוע בשיטת הדיסקות
  belief: >-
    נפח גוף הסיבוב סביב ציר $x$ הוא $\pi\int_a^bf(x)\,dx$, או $\pi r^2h$ עם רדיוס קבוע.
  truth: >-
    כל פרוסה היא דיסקה בשטח $\pi\bigl(f(x)\bigr)^2$, ולכן $V=\pi\int_a^b\bigl(f(x)\bigr)^2dx$. בדיקת ממדים: התוצאה
    בחזקה שלישית של אורך.
  remedy: { lesson: '8.5', anchor: 'disks', label: 'שיטת הדיסקות' }

- id: MC-c8-washer-square-difference
  title: מעלים בריבוע את הפרש הרדיוסים בשיטת הטבעות, או שוכחים את החור
  belief: >-
    שטח טבעת הוא $\pi(R-r)^2$, או $\pi R^2$ גם כשיש חור.
  truth: >-
    שטח הטבעת הוא $\pi R^2-\pi r^2=\pi(R^2-r^2)$, ו-$(R-r)^2\ne R^2-r^2$. כשיש רווח בין התחום לציר, הרדיוס הפנימי
    אינו 0.
  remedy: { lesson: '8.5', anchor: 'washers', label: 'שיטת הטבעות' }

- id: MC-c8-axis-confusion
  title: מסובבים סביב הציר הלא נכון או מודדים רדיוס מציר אחר
  belief: >-
    $\pi\int f^2dx$ נותן את הנפח בכל סיבוב, או שמדידת הרדיוס מציר $x$ מתאימה גם לסיבוב סביב ישר אחר.
  truth: >-
    כל רדיוס נמדד **מציר הסיבוב**. סביב ציר $y$ דיסקות הן אופקיות (אינטגרל לפי $y$) או שעוברים לקליפות; סביב
    $y=-1$ מוסיפים 1 לכל ערך $y$. שתי השיטות, אם נעשו נכון, נותנות אותו נפח.
  remedy: { lesson: '8.5', anchor: 'axis-line', label: 'ציר הסיבוב קובע את הרדיוס' }

- id: MC-c8-shell-radius
  title: מבלבלים בין הרדיוס לגובה של קליפה גלילית
  belief: >-
    בשיטת הקליפות סביב ציר $y$ הרדיוס הוא $f(x)$, או שהציר $x=c$ אינו משנה את הרדיוס, או שאין צורך ב-$2\pi$.
  truth: >-
    קליפה בנקודה $x$: רדיוס = המרחק לציר הסיבוב ($x$ סביב ציר $y$, $|x-c|$ סביב $x=c$), גובה = אורך הקטע האנכי
    שבתחום, ועובי $dx$. $V=2\pi\int d(x)\,h(x)\,dx$, כש-$d(x)$ הרדיוס, $h(x)$ הגובה ו-$2\pi\,d(x)$ היקף הקליפה.
  remedy: { lesson: '8.5', anchor: 'shell-radius', label: 'שיטת הקליפות: רדיוס וגובה' }

- id: MC-c8-infinite-area-infinite-volume
  title: חושבים ששטח אינסופי נותן גוף סיבוב בנפח אינסופי
  belief: >-
    אם השטח שמתחת ל-$y=f(x)$ אינסופי, גם נפח גוף הסיבוב סביב ציר $x$ אינסופי.
  truth: >-
    הנפח הוא $\pi\int f^2dx$, ו-$f^2$ יכולה לדעוך מהר יותר מ-$f$: ל-$f=\frac1x$ ב-$[1,\infty)$ השטח
    $\int\frac{dx}{x}=\infty$ אבל הנפח $\pi\int\frac{dx}{x^2}=\pi$ ("הצופר של גבריאל").
  remedy: { lesson: '8.5', anchor: 'infinite-volume', label: 'נפח של גוף סיבוב אינסופי' }
