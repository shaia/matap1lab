# Misconceptions first detected in lesson 6.3 (the expansions of the elementary functions).
- id: MC-c6-sin-cos-swap
  title: מחליפים בין הטור של סינוס לטור של קוסינוס
  belief: >-
    הטור של $\cos x$ הוא $x-\frac{x^3}{3!}+\dots$, או שבטור של $\sin x$ יש חזקות זוגיות.
  truth: >-
    $\sin x=x-\frac{x^3}{3!}+\frac{x^5}{5!}-\dots$ (אי-זוגית: חזקות אי-זוגיות, $\sin0=0$), ו-$\cos x=1-\frac{x^2}{2!}+\frac{x^4}{4!}-\dots$
    (זוגית: חזקות זוגיות, $\cos0=1$). בדיקה ב-$x=0$ מבחינה ביניהם.
  remedy: { lesson: '6.3', label: 'הטורים של סינוס וקוסינוס' }

- id: MC-c6-alternating-sign-lost
  title: מאבדים את הסימנים המתחלפים בטור
  belief: >-
    בטורים של $\cos x$, $\ln(1+x)$ או $\arctan x$ כל האיברים חיוביים, או שבחיסור של טורים הסימן של איבר פנימי לא משתנה.
  truth: >-
    $\cos x$, $\sin x$, $\ln(1+x)$ ו-$\arctan x$ הם טורים מתחלפים: $\cos''(0)=-1$, ו-$\frac{1}{1+t^2}=1-t^2+t^4-\dots$.
    בחיסור של טור, כל סימן בתוכו מתהפך.
  remedy: { lesson: '6.3', label: 'סימנים בטורים הסטנדרטיים' }

- id: MC-c6-ln-factorial
  title: שמים עצרת במכנה של הטור של הלוגריתם
  belief: >-
    $\ln(1+x)=x-\frac{x^2}{2!}+\frac{x^3}{3!}-\dots$, כמו בטור של האקספוננט.
  truth: >-
    $\ln(1+x)=x-\frac{x^2}{2}+\frac{x^3}{3}-\dots$: המכנה הוא $k$. הסיבה: $f^{(k)}(0)=(-1)^{k+1}(k-1)!$, ו-$\frac{(k-1)!}{k!}=\frac1k$.
    אותו דבר נובע מאינטגרציה של $1-x+x^2-\dots$.
  remedy: { lesson: '6.3', label: 'הטור של הלוגריתם' }

- id: MC-c6-binom-alpha
  title: מציבים את המעריך הלא נכון בטור הבינומי
  belief: >-
    $\frac{1}{\sqrt{1+x}}$ מתפתחת עם $\alpha=\frac12$, כמו $\sqrt{1+x}$.
  truth: >-
    כותבים את הפונקציה בצורה $(1+x)^\alpha$ לפני שמציבים: $\frac{1}{\sqrt{1+x}}=(1+x)^{-1/2}$, ולכן
    $1-\frac x2+\frac38x^2-\dots$
  remedy: { lesson: '6.3', label: 'הטור הבינומי' }

- id: MC-c6-subst-match-powers
  title: בהצבה בטור מתאימים חזקה לחזקה במקום איבר לאיבר
  belief: >-
    בטור של $e^{-x^2}$ המקדם של $x^4$ הוא המקדם של $x^4$ בטור של $e^x$, כלומר $\frac{1}{4!}$.
  truth: >-
    מציבים $u=-x^2$ בכל **איבר** של $e^u$: $x^4$ בא מ-$\frac{u^2}{2!}$, ולכן מקדמו $\frac12$. החזקה ה-$k$ של $u$ נותנת את
    החזקה ה-$2k$ של $x$.
  remedy: { lesson: '6.3', label: 'פיתוחים חדשים בהצבה' }

- id: MC-c6-product-termwise
  title: כופלים טורים איבר באיבר באותה חזקה
  belief: >-
    המקדם של $x^3$ במכפלה של שני טורים הוא מכפלת המקדמים של $x^3$ בשניהם, או שמספיק זוג אחד של איברים.
  truth: >-
    במכפלה $\left(\sum a_ix^i\right)\left(\sum b_jx^j\right)$ המקדם של $x^n$ הוא $\sum_{i+j=n}a_ib_j$: כל הזוגות שסכום
    החזקות בהם $n$.
  remedy: { lesson: '6.3', label: 'מכפלה של טורים' }

- id: MC-c6-series-ops-forbidden
  title: חושבים שאסור לגזור או לבצע אינטגרציה לטור איבר-איבר
  belief: >-
    טור חדש מקבלים רק מחישוב כל הנגזרות של הפונקציה; גזירה או אינטגרציה של טור ידוע איבר-איבר אינן נותנות את טור
    טיילור, או שאפשר לעצור באמצע (למשל לשכוח את האינטגרציה).
  truth: >-
    בתוך תחום ההתכנסות מותר לגזור טור חזקות ולבצע לו אינטגרציה איבר-איבר, והתוצאה היא טור טיילור של הנגזרת או של
    הפונקציה הקדומה. כך $\frac{1}{(1-x)^2}=\sum kx^{k-1}$ ו-$\arctan x=\sum\frac{(-1)^kx^{2k+1}}{2k+1}$.
  remedy: { lesson: '6.3', label: 'גזירה ואינטגרציה של טורים' }

- id: MC-c6-arctan-factorials
  title: כותבים את הטור של arctan עם עצרות כמו של סינוס
  belief: >-
    $\arctan x=x-\frac{x^3}{3!}+\frac{x^5}{5!}-\dots$
  truth: >-
    $\arctan x=x-\frac{x^3}{3}+\frac{x^5}{5}-\dots$: אינטגרציה של $t^{2k}$ נותנת $\frac{x^{2k+1}}{2k+1}$, בלי עצרת.
  remedy: { lesson: '6.3', label: 'הטור של arctan מהטור ההנדסי' }

- id: MC-c6-coeff-is-derivative
  title: מבלבלים בין מקדם בטור לבין הנגזרת
  belief: >-
    אם המקדם של $x^n$ בטור הוא $a_n$, אז $f^{(n)}(0)=a_n$.
  truth: >-
    $a_n=\frac{f^{(n)}(0)}{n!}$, ולכן $f^{(n)}(0)=n!\,a_n$. כך מחשבים נגזרות מסדר גבוה מתוך טור ידוע.
  remedy: { lesson: '6.3', label: 'נגזרות מתוך הטור' }

- id: MC-c6-truncate-too-early
  title: עוצרים את הפיתוח לפני האיבר שקובע את התשובה
  belief: >-
    $\sin x\approx x$ ו-$\cos x\approx1$ מספיקים תמיד, ולכן $x-\sin x$ "שווה 0" ליד 0.
  truth: >-
    מפתחים עד שהאיבר המוביל של הביטוי אינו מתבטל, ובגבול עד החזקה של המכנה: $x-\sin x=\frac{x^3}{6}+\dots$, ו-$\frac{x-\sin x}{x^3}\to\frac16$.
  remedy: { lesson: '6.3', label: 'גבולות בעזרת טורים: כמה איברים לפתח' }
