# Misconceptions first detected in lesson 9.1 (parametrised curves).
- id: MC-c9-substitute-x-for-t
  title: מחליפים את הפרמטר בקואורדינטה x בלי לבודד אותו
  belief: >-
    כדי לקבל משוואה קרטזית מ-$x=x(t)$, $y=y(t)$ פשוט כותבים $x$ במקום $t$ בנוסחה של $y$.
  truth: >-
    $t$ הוא פרמטר, לא קואורדינטה. מבודדים את $t$ מאחת המשוואות ($x=e^t\Rightarrow t=\ln x$), או משתמשים בזהות
    ($\cos^2t+\sin^2t=1$), ורק אז מציבים. בדיקה: נקודה אחת של העקום צריכה לקיים את המשוואה.
  remedy: { lesson: '9.1', anchor: eliminate, label: 'מפרמטריזציה למשוואה קרטזית' }

- id: MC-c9-cartesian-whole-curve
  title: חושבים שהעקום ממלא את כל מה שהמשוואה הקרטזית מתארת
  belief: >-
    אם כל נקודה של העקום מקיימת $F(x,y)=0$, אז העקום הוא כל הקבוצה $F(x,y)=0$; או שטווח הפרמטר אינו חשוב.
  truth: >-
    המשוואה מראה רק שהעקום **בתוך** הקבוצה. טווח הפרמטר והטווח של כל רכיב קובעים איזה חלק מתקבל: $(\cos^2t,\sin^2t)$
    הוא רק הקטע $0\le x\le1$ של הישר $x+y=1$.
  remedy: { lesson: '9.1', anchor: which-part, label: 'איזה חלק של העקום מתקבל' }

- id: MC-c9-semi-axes-squared
  title: מבלבלים בין חצי ציר (או רדיוס) לבין הריבוע שלו
  belief: >-
    לאליפסה $\frac{x^2}{4}+\frac{y^2}{9}=1$ הפרמטריזציה $(4\cos t,9\sin t)$, ול-$x=3\cos t$, $y=2\sin t$ המשוואה
    $\frac{x^2}{3}+\frac{y^2}{2}=1$.
  truth: >-
    בפרמטריזציה $(a\cos t,b\sin t)$ מופיעים חצאי הצירים $a,b$; במשוואה $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$
    מופיעים הריבועים שלהם. במעגל: רדיוס $R$ בפרמטריזציה, $R^2$ במשוואה.
  remedy: { lesson: '9.1', anchor: circle-ellipse, label: 'פרמטריזציה של מעגל ואליפסה' }

- id: MC-c9-centre-shift
  title: שוכחים להזיז את הפרמטריזציה למרכז, או מזיזים בסימן הפוך
  belief: >-
    למעגל שמרכזו $(2,-1)$ הפרמטריזציה $(-2+3\cos t,1+3\sin t)$, או שהמרכז אינו משנה את הפרמטריזציה.
  truth: >-
    מעגל או אליפסה שמרכזם $(x_0,y_0)$: $(x_0+a\cos t,\ y_0+b\sin t)$. המרכז מתווסף כמו שהוא; הסימן ההפוך מופיע רק
    במשוואה, $(x-x_0)^2$.
  remedy: { lesson: '9.1', anchor: centre-shift, label: 'מעגל ואליפסה שמרכזם אינו בראשית' }

- id: MC-c9-segment-add-endpoint
  title: כותבים קטע כ-A ועוד t כפול B
  belief: >-
    הקטע מ-$A$ ל-$B$ הוא $A+tB$, $0\le t\le1$.
  truth: >-
    $\vec r(t)=A+t(B-A)$: יוצאים מ-$A$ בכיוון ההפרש $B-A$. ב-$t=1$ מגיעים ל-$B$, ואילו $A+tB$ מגיע ל-$A+B$.
  remedy: { lesson: '9.1', anchor: segment, label: 'פרמטריזציה של קטע' }

- id: MC-c9-orientation-ignored
  title: מתעלמים מכיוון התנועה ומנקודת ההתחלה של הפרמטריזציה
  belief: >-
    כל פרמטריזציה של אותו עקום מתאימה, גם כשנדרשים נקודת התחלה או כיוון.
  truth: >-
    לפרמטריזציה יש כיוון: $(\cos t,\sin t)$ נגד כיוון השעון מ-$(1,0)$, ו-$(\sin t,\cos t)$ בכיוון השעון מ-$(0,1)$.
    בודקים את $\vec r(0)$ ואת הכיוון שאליו הנקודה זזה מיד אחר כך.
  remedy: { lesson: '9.1', anchor: orientation, label: 'כיוון של פרמטריזציה' }

- id: MC-c9-helix-pitch-per-radian
  title: מחשבים את עליית הסליל לפי רדיאן במקום לפי סיבוב
  belief: >-
    סליל שעולה $h$ בכל סיבוב הוא $(R\cos t,R\sin t,ht)$.
  truth: >-
    סיבוב שלם הוא $\Delta t=2\pi$, ולכן $z(t)=\frac{h}{2\pi}t$. עם $z=ht$ הסליל עולה $2\pi h$ בכל סיבוב.
  remedy: { lesson: '9.1', anchor: helix, label: 'פרמטריזציה של סליל' }

- id: MC-c9-curve-equals-graph
  title: מבלבלים בין העקום לבין קו העולם
  belief: >-
    הגרף של הפונקציה הווקטורית $\vec r(t)$ הוא העקום עצמו, ולכן מהעקום אפשר לקרוא מתי הנקודה הייתה בכל מקום.
  truth: >-
    העקום הוא קבוצת המקומות $\{\vec r(t)\}$. קו העולם $\{(t,\vec r(t))\}$ מוסיף את הזמן, ולכן הוא במרחב עם ממד אחד
    יותר. ההיטל של קו העולם על מרחב המקום הוא העקום; את הזמן אפשר לקרוא רק מקו העולם.
  remedy: { lesson: '9.1', anchor: world-line, label: 'עקום וקו עולם' }

- id: MC-c9-curve-is-formula
  title: חושבים שעקום אחד הוא נוסחה אחת
  belief: >-
    שתי פרמטריזציות עם נוסחאות שונות מתארות עקומים שונים.
  truth: >-
    עקום הוא קבוצת נקודות, ולו פרמטריזציות רבות: $(t,t^2)$ על $[0,2]$ ו-$(t^2,t^4)$ על $[0,\sqrt2]$ הן אותה פרבולה.
    מה שתלוי בפרמטריזציה הוא התנועה: המהירות והזמן.
  remedy: { lesson: '9.1', anchor: many-params, label: 'עקום אחד, פרמטריזציות רבות' }

- id: MC-c9-graph-param-swap
  title: מחליפים בין הרכיבים בפרמטריזציה של גרף
  belief: >-
    הגרף של $y=f(x)$ הוא $(f(t),t)$.
  truth: >-
    הגרף של $y=f(x)$, $a\le x\le b$, הוא $(t,f(t))$, $a\le t\le b$: הרכיב הראשון הוא $x$. $(f(t),t)$ הוא הגרף של
    $x=f(y)$, השיקוף ביחס לישר $y=x$.
  remedy: { lesson: '9.1', anchor: graph-param, label: 'פרמטריזציה של גרף' }

- id: MC-c9-surface-check-one-point
  title: בודקים אם עקום נמצא על משטח לפי נקודה אחת בלבד
  belief: >-
    אם $\vec r(0)$ מקיימת את משוואת המשטח, כל העקום נמצא עליו.
  truth: >-
    מציבים את כל הפרמטריזציה במשוואה ובודקים שהיא מתקיימת **לכל** $t$: לעקום $(e^t\cos t,e^t\sin t,e^t)$,
    $x^2+y^2-z^2=0$ לכל $t$ (חרוט), ואילו $x^2+y^2+z^2=2e^{2t}$ שווה 2 רק ב-$t=0$.
  remedy: { lesson: '9.1', anchor: on-surface, label: 'על איזה משטח נמצא העקום' }

- id: MC-c9-trig-means-circle
  title: חושבים שסינוס וקוסינוס בפרמטריזציה פירושם מעגל
  belief: >-
    אם בפרמטריזציה מופיעים $\sin t$ או $\cos t$, העקום הוא מעגל או אליפסה.
  truth: >-
    את הצורה קובעת המשוואה הקרטזית, לא הפונקציות שבנוסחה: $(\cos^2t,\sin^2t)$ מקיימת $x+y=1$ והיא קטע של ישר,
    ו-$(\sin t,\sin^2t)$ מקיימת $y=x^2$ והיא קשת של פרבולה.
  remedy: { lesson: '9.1', anchor: eliminate, label: 'סינוס אינו אומר מעגל' }

- id: MC-c9-self-cross-equal-t
  title: מחפשים נקודת חיתוך עצמי בלי לדרוש שני זמנים שונים ושני רכיבים שווים
  belief: >-
    כל פתרון של $\vec r(t_1)=\vec r(t_2)$ הוא נקודת חיתוך עצמי, גם $t_1=t_2$; או שמספיק ש-$x(t_1)=x(t_2)$.
  truth: >-
    נקודת חיתוך עצמי דורשת $t_1\ne t_2$ **וגם** שוויון בכל הרכיבים. ב-$(t^2-1,\ t^3-t)$ כל זוג $t=\pm a$ נותן אותו $x$,
    אבל $y$ שווה רק כש-$a=1$: הנקודה $(0,0)$, ב-$t=-1$ וב-$t=1$.
  remedy: { lesson: '9.1', anchor: self-cross, label: 'עקום שחותך את עצמו' }

# Added with the chapter math review (2026-11-27): Q-9-review-09's third distractor.
- id: MC-c9-range-is-fraction
  title: קובעים איזה חלק של העקום מצויר לפי השבר של קטע הפרמטר
  belief: >-
    קטע פרמטר שהוא חצי מ-$[0,2\pi]$ נותן חצי עקום: $r=2\cos\theta$ עם $0\le\theta\le\pi$ הוא רק חצי מעגל.
  truth: >-
    החלק שמתקבל נקבע מהרכיבים, לא מאורך הקטע. ב-$r=2\cos\theta$, $x=2\cos^2\theta=1+\cos2\theta$ ו-$y=\sin2\theta$:
    הזווית $2\theta$ עוברת על $[0,2\pi]$, והעקום הוא המעגל $(x-1)^2+y^2=1$ כולו, פעם אחת. כך גם $(\cos2t,\sin2t)$
    מקיפה את מעגל היחידה כבר על $[0,\pi]$.
  remedy: { lesson: '9.1', anchor: orientation, label: 'כיוון, נקודת התחלה ומספר סיבובים' }
