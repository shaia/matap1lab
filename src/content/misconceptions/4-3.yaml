# Misconceptions first detected in lesson 4.3 (exponentials, logarithms, powers, growth rates).
- id: MC-c4-exp-base-small
  title: חושבים שכל אקספוננט שואף לאינסוף
  belief: >-
    $a^x\to\infty$ כש-$x\to\infty$ לכל בסיס $a>0$.
  truth: >-
    ל-$a>1$ כן. ל-$0<a<1$ הפונקציה **יורדת**: $\left(\tfrac12\right)^x=2^{-x}\to0$ כש-$x\to\infty$, ושואפת לאינסוף כש-$x\to-\infty$.
  remedy: { lesson: '4.3', label: 'אקספוננט עם בסיס קטן מ-1' }

- id: MC-c4-ln-near-zero
  title: חושבים שהלוגריתם שואף ל-0 ליד 0
  belief: >-
    $\ln x\to0$ כש-$x\to0^+$, או ש-$\ln0=0$.
  truth: >-
    $\ln1=0$, לא $\ln0$. ליד 0 מימין $\ln x\to-\infty$: $\ln(e^{-M})=-M$ לכל $M$. ציר $y$ הוא אסימפטוטה אנכית של
    $\ln x$, ו-$\ln0$ אינו מוגדר.
  remedy: { lesson: '4.3', label: 'ln ליד 0' }

- id: MC-c4-bigger-base-bigger
  title: חושבים שבסיס גדול יותר נותן תמיד ערך גדול יותר
  belief: >-
    $3^x>2^x$ לכל $x$, ו-$\log_3x>\log_2x$ לכל $x>1$.
  truth: >-
    $3^x>2^x$ רק ל-$x>0$; ל-$x<0$ ההפך ($3^{-1}<2^{-1}$). בלוגריתמים: $\log_3x=\frac{\ln x}{\ln3}$ קטן בערכו המוחלט
    מ-$\log_2x=\frac{\ln x}{\ln2}$, ולכן ל-$x>1$ דווקא $\log_2x>\log_3x$.
  remedy: { lesson: '4.3', label: 'השוואת בסיסים' }

- id: MC-c4-log-bounded
  title: חושבים שללוגריתם יש אסימפטוטה אופקית
  belief: >-
    $\ln x$ גדל לאט כל כך שהוא מתקרב לערך סופי כש-$x\to\infty$.
  truth: >-
    $\ln x$ גדל לאט אבל **לא חסום**: לכל $M$, $\ln x>M$ כש-$x>e^M$. אין לו אסימפטוטה אופקית.
  remedy: { lesson: '4.3', label: 'ln איטי אבל לא חסום' }

- id: MC-c4-e-limit-is-1
  title: חושבים ש-(1+1/n) בחזקת n שואף ל-1
  belief: >-
    $1+\frac1n\to1$, ו-1 בכל חזקה הוא 1, ולכן $\left(1+\frac1n\right)^n\to1$.
  truth: >-
    הבסיס מתקרב ל-1 **והמעריך גדל** באותו זמן; שתי המגמות מתחרות. הגבול הוא $e\approx2.718$: ל-$n=1000$ מתקבל כבר
    $2.7169\ldots$.
  remedy: { lesson: '4.3', label: 'המספר e כגבול' }

- id: MC-c4-exp-product-confusion
  title: מבלבלים את e בחזקת 2x עם 2 כפול e בחזקת x
  belief: >-
    $e^{2x}=2e^x$, ולכן מ-$e^{2x}=5$ מקבלים $e^x=\frac52$.
  truth: >-
    $e^{2x}=\left(e^x\right)^2$. מ-$e^{2x}=5$ לוקחים $\ln$: $2x=\ln5$, ו-$x=\frac{\ln5}{2}$.
  remedy: { lesson: '4.3', label: 'חוקי חזקות עם e' }

- id: MC-c4-exp-log-coefficient
  title: מבטלים exp ו-ln גם כשיש מקדם ביניהם
  belief: >-
    $e^{3\ln x}=3x$.
  truth: >-
    $e^{\ln u}=u$ רק כשבמעריך יש בדיוק $\ln u$. קודם מכניסים את המקדם: $3\ln x=\ln(x^3)$, ולכן $e^{3\ln x}=x^3$ (ל-$x>0$).
  remedy: { lesson: '4.3', label: 'e ו-ln כפונקציות הפוכות' }

- id: MC-c4-ln-product-is-product
  title: חושבים שלוגריתם של מכפלה הוא מכפלת הלוגריתמים
  belief: >-
    $\ln(ab)=\ln a\cdot\ln b$.
  truth: >-
    $\ln(ab)=\ln a+\ln b$: הלוגריתם הופך כפל לחיבור. בדיקה: $\ln(1\cdot e)=1$, ואילו $\ln1\cdot\ln e=0$.
  remedy: { lesson: '4.3', label: 'חוקי הלוגריתם' }

- id: MC-c4-inverse-domain-ignored
  title: משתמשים בזהות של פונקציה הפוכה מחוץ לתחום שלה
  belief: >-
    $e^{\ln x}=x$ לכל $x$ ממשי, כמו $\ln(e^x)=x$.
  truth: >-
    $f^{-1}(f(x))=x$ לכל $x$ בתחום של $f$, ו-$f(f^{-1}(y))=y$ לכל $y$ בתחום של $f^{-1}$. $\ln(e^x)=x$ לכל $x$, אבל
    $e^{\ln x}=x$ רק ל-$x>0$: ל-$x\le0$ הביטוי $\ln x$ אינו מוגדר.
  remedy: { lesson: '4.3', label: 'פונקציות הפוכות ותחומיהן' }

- id: MC-c4-inverse-is-reciprocal
  title: מבלבלים פונקציה הפוכה עם אחד חלקי הפונקציה
  belief: >-
    $f^{-1}(x)=\frac{1}{f(x)}$: ההפוכה של $e^{2x}+1$ היא $\frac{1}{e^{2x}+1}$, ו-$\sin^{-1}x=\frac1{\sin x}$.
  truth: >-
    $f^{-1}$ מבטלת את $f$: $f^{-1}(f(x))=x$. מוצאים אותה מפתרון $y=f(x)$ לפי $x$. הסימון $\sin^{-1}x$ פירושו
    $\arcsin x$, ו-$\frac1{\sin x}$ הוא דבר אחר לגמרי.
  remedy: { lesson: '4.3', label: 'מהי פונקציה הפוכה' }

- id: MC-c4-power-beats-exp
  title: חושבים שחזקה גבוהה מנצחת אקספוננט
  belief: >-
    $x^{100}$ גדל מהר יותר מ-$e^x$, ולכן $\frac{x^{100}}{e^x}\to\infty$.
  truth: >-
    כל אקספוננט עם בסיס גדול מ-1 גדל בסופו של דבר מהר יותר מכל חזקה: $\frac{x^{n}}{e^x}\to0$ כש-$x\to\infty$, לכל $n$.
    החזקה מובילה רק בטווח מוגבל.
  remedy: { lesson: '4.3', label: 'סולם קצבי הגידול' }

- id: MC-c4-faster-means-already-bigger
  title: חושבים שהפונקציה שגדלה מהר יותר כבר גדולה יותר
  belief: >-
    $2^x$ גדל מהר יותר מ-$x^{10}$, ולכן $2^x>x^{10}$ לכל $x>1$ (או לכל $x>10$).
  truth: >-
    "גדל מהר יותר" הוא אמירה על $x\to\infty$: היחס $\frac{2^x}{x^{10}}\to\infty$. אבל $2^{10}=1024<10^{10}$, והעקיפה
    קורית רק ליד $x\approx58.8$.
  remedy: { lesson: '4.3', label: 'מתי האקספוננט עוקף' }

- id: MC-c4-exp-as-linear
  title: מתייחסים לדעיכה מעריכית כאל ירידה לינארית
  belief: >-
    אם חצי מהחומר מתפרק ב-5730 שנה, אז 90% מתפרקים ב-$1.8\cdot5730$ שנה.
  truth: >-
    בדעיכה מעריכית נשאר **אותו חלק יחסי** בכל פרק זמן שווה: $N=N_0\left(\tfrac12\right)^{t/T}$. כדי שיישאר $10\%$ צריך
    $\left(\tfrac12\right)^{t/T}=\tfrac1{10}$, כלומר $t=T\frac{\ln10}{\ln2}\approx3.32\,T$.
  remedy: { lesson: '4.3', label: 'דעיכה מעריכית וזמן מחצית חיים' }
