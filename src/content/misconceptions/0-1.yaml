# Misconceptions first detected in lesson 0.1 (how to study the course; the algebra we need).
- id: MC-c0-confidence-noise
  title: חושבים ששאלת הביטחון היא רק טקס
  belief: >-
    השאלה "בטוחים או לא בטוחים" לפני הבדיקה לא משנה דבר, ואפשר לסמן תמיד "בטוחים".
  truth: >-
    תשובה שגויה עם "בטוחים" מסמנת תפיסה שגויה, משהו שצריך לשכוח וללמוד מחדש; תשובה שגויה עם "לא בטוחים" מסמנת פער ידע,
    משהו שעוד לא נלמד. האתר מפריד בין השתיים רק אם מסמנים בכנות.
  remedy: { lesson: '0.1', label: 'מסלול הלימוד: למה שואלים אם אתם בטוחים' }

- id: MC-c0-exam-first
  title: מדלגים ישר לשאלות המבחן
  belief: >-
    הכי יעיל להתחיל משאלות המבחן של הפרק, ורק אם נתקעים לחזור לשאלות ההבנה.
  truth: >-
    שאלות המבחן משלבות כמה שלבים, וטעות בהן לא מראה איזה שלב חסר. המסלול בנוי בסדר: שאלות הבנה של כל שיעור (בסיס, בינוני,
    מבחן), חוברת התרגול, שאלות חזרה על הפרק, ורק אז שאלות המבחן ומבחן הפרק.
  remedy: { lesson: '0.1', label: 'מסלול הלימוד: הסדר של השלבים' }

- id: MC-c0-quadratic-formula
  title: טועים בנוסחת השורשים
  belief: >-
    בנוסחה $x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}$ אפשר לשכוח את המינוס לפני $b$, לחלק ב-$a$ במקום ב-$2a$, או לוותר על ה-4
    בדיסקרימיננטה.
  truth: >-
    כל חלק בנוסחה הכרחי: $-b$ (עם הסימן של $b$ עצמו), $\Delta=b^2-4ac$, והמכנה $2a$ מתחת לכל המונה. בדיקה מהירה: מציבים
    את השורש שהתקבל במשוואה.
  remedy: { lesson: '0.1', label: 'נוסחת השורשים והבדיקה בהצבה' }

- id: MC-c0-cancel-terms
  title: מצמצמים מחוברים במקום גורמים
  belief: >-
    בשבר $\frac{x^2-4}{x^2+4x+4}$ אפשר "לצמצם" את $x^2$ שבמונה עם $x^2$ שבמכנה.
  truth: >-
    מצמצמים רק גורם שכופל את כל המונה ואת כל המכנה. קודם מפרקים: $\frac{(x-2)(x+2)}{(x+2)^2}=\frac{x-2}{x+2}$ (כש-$x\ne-2$).
  remedy: { lesson: '0.1', label: 'צמצום שברים: קודם מפרקים לגורמים' }

- id: MC-c0-split-denominator
  title: מפצלים שבר לפי המחוברים שבמכנה
  belief: >-
    $\frac{1}{a-b}=\frac1a-\frac1b$, כמו שמפצלים את המונה.
  truth: >-
    מונה אפשר לפצל: $\frac{a-b}{c}=\frac ac-\frac bc$. מכנה לא: כבר ב-$a=2$, $b=1$ מתקבל $\frac11=1$ מול $\frac12-1=-\frac12$.
  remedy: { lesson: '0.1', label: 'שברים: מה מותר לפצל' }

- id: MC-c0-conjugate-product
  title: טועים במכפלה של ביטוי בצמוד שלו
  belief: >-
    $(\sqrt5-1)(\sqrt5+1)=5+1$.
  truth: >-
    $(p-q)(p+q)=p^2-q^2$, ולכן $(\sqrt5-1)(\sqrt5+1)=5-1=4$. זה כל הטעם בכפל בצמוד: השורש נעלם מהמכנה.
  remedy: { lesson: '0.1', label: 'הוצאת שורש מהמכנה בעזרת הצמוד' }

- id: MC-c0-root-of-sum
  title: מוציאים שורש מכל מחובר בנפרד
  belief: >-
    $\sqrt{a+b}=\sqrt a+\sqrt b$, ולכן $\sqrt{x^2+9}=x+3$.
  truth: >-
    שורש מתפצל על מכפלה, $\sqrt{ab}=\sqrt a\sqrt b$ (כש-$a,b\ge0$), אבל לא על סכום: $\sqrt{16+9}=5$ ואילו $4+3=7$.
  remedy: { lesson: '0.1', label: 'חוקי השורשים: מכפלה כן, סכום לא' }

- id: MC-c0-squaring-extraneous
  title: מעלים בריבוע ולא בודקים את הפתרונות
  belief: >-
    אחרי העלאה בריבוע של משוואה, כל פתרון של המשוואה החדשה פותר גם את המקורית.
  truth: >-
    העלאה בריבוע יכולה להוסיף פתרונות: גם $A=-B$ נותן $A^2=B^2$. לכן מציבים כל פתרון במשוואה המקורית. ב-$\sqrt{x+5}=x-1$
    הערך $x=-1$ נותן $2$ מול $-2$, ונפסל.
  remedy: { lesson: '0.1', label: 'משוואות עם שורש: בדיקה בהצבה' }

- id: MC-c0-abs-or-and
  title: מחליפים בין "וגם" ל"או" באי-שוויון עם ערך מוחלט
  belief: >-
    $|x-3|<2$ פירושו $x-3<-2$ או $x-3>2$, כלומר הפתרון מחוץ לקטע.
  truth: >-
    $|A|<c$ (עם $c>0$) פירושו $-c<A<c$: קטע אחד סביב המרכז. $|A|>c$ פירושו $A<-c$ או $A>c$: שתי קרניים. ערך מוחלט הוא
    מרחק: $|x-3|<2$ הן הנקודות שמרחקן מ-3 קטן מ-2.
  remedy: { lesson: '0.1', label: 'ערך מוחלט כמרחק' }

- id: MC-c0-abs-linear
  title: מפרקים ערך מוחלט כאילו הוא לינארי
  belief: >-
    $|x-3|=|x|-3$, או $|a+b|=|a|+|b|$ תמיד.
  truth: >-
    ערך מוחלט אינו מתפצל על סכום או הפרש: ב-$x=0$, $|0-3|=3$ ואילו $|0|-3=-3$. מה שנכון תמיד הוא אי-שוויון המשולש
    $|a+b|\le|a|+|b|$.
  remedy: { lesson: '0.1', label: 'ערך מוחלט כמרחק' }

- id: MC-c0-multiply-unknown-sign
  title: כופלים אי-שוויון בביטוי שהסימן שלו לא ידוע
  belief: >-
    אפשר לכפול את שני האגפים של $\frac{x+1}{x-2}\ge0$ ב-$x-2$, או את $\frac1x<x$ ב-$x$, בלי לשנות את כיוון האי-שוויון.
  truth: >-
    כפל בביטוי שלילי הופך את כיוון האי-שוויון, והסימן של $x-2$ משתנה לפי $x$. דרך בטוחה: מעבירים הכול לאגף אחד, מפרקים
    לגורמים ובונים טבלת סימנים.
  remedy: { lesson: '0.1', label: 'אי-שוויונות עם שברים: טבלת סימנים' }

- id: MC-c0-denominator-zero-included
  title: כוללים בפתרון נקודה שבה המכנה מתאפס
  belief: >-
    בפתרון של $\frac{x+1}{x-2}\ge0$ הסימן $\ge$ מתיר לכלול גם את $x=2$.
  truth: >-
    ב-$x=2$ הביטוי כלל אינו מוגדר, ולכן הנקודה הזו לעולם אינה בפתרון. השוויון ל-0 מתקיים רק כשהמונה מתאפס, ב-$x=-1$.
  remedy: { lesson: '0.1', label: 'אי-שוויונות עם שברים: תחום ההגדרה' }

- id: MC-c0-quadratic-ineq-outside
  title: מבלבלים בין "בין השורשים" ל"מחוץ לשורשים"
  belief: >-
    $x^2-x-6<0$ מתקיים מחוץ לשורשים, כלומר $x<-2$ או $x>3$.
  truth: >-
    כשהמקדם של $x^2$ חיובי, הפרבולה פתוחה כלפי מעלה: היא שלילית בין השורשים וחיובית מחוצה להם. לכן $x^2-x-6<0$ בדיוק
    כש-$-2<x<3$. בדיקה בנקודה אחת ($x=0$ נותן $-6<0$) מכריעה.
  remedy: { lesson: '0.1', label: 'אי-שוויון ריבועי: לפי צורת הפרבולה' }

- id: MC-c0-shift-sign
  title: טועים בסימן של הזזה
  belief: >-
    הגורם $(x-3)$ מתאפס ב-$x=-3$, והמעגל $(x-a)^2+(y-b)^2=r^2$ מרכזו ב-$(-a,-b)$.
  truth: >-
    $x-3=0$ בדיוק כש-$x=3$. באותו אופן $(x-a)^2+(y-b)^2=r^2$ מרכזו ב-$(a,b)$, והישר $y-y_0=m(x-x_0)$ עובר ב-$(x_0,y_0)$.
    בדיקה: מציבים את הנקודה ובודקים שהסוגריים מתאפסים.
  remedy: { lesson: '0.1', label: 'הזזות: הסימן שבתוך הסוגריים' }
