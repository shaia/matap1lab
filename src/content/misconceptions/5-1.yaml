# Misconceptions first detected in lesson 5.1 (velocity and the difference quotient).
- id: MC-c5-position-height-is-velocity
  title: קוראים את המהירות מהגובה של גרף המקום
  belief: >-
    בגרף מקום-זמן, המהירות ברגע $t_0$ היא הגובה $x(t_0)$ של הגרף, וגוף שנמצא רחוק נע מהר.
  truth: >-
    המהירות היא **השיפוע** של גרף המקום: $v(t_0)=x'(t_0)$. גוף יכול להיות רחוק ועומד ($x(t_0)$ גדול,
    $x'(t_0)=0$), או ליד הראשית ונע מהר.
  remedy: { lesson: '5.1', label: 'מהירות היא שיפוע של גרף המקום' }

- id: MC-c5-avg-vs-instant
  title: מבלבלים מהירות ממוצעת במהירות רגעית
  belief: >-
    המהירות ברגע $t_0$ היא ההעתק בפרק זמן כלשהו (למשל שנייה אחת) חלקי הזמן, או שיפוע המיתר מהראשית.
  truth: >-
    $\frac{x(t_0+h)-x(t_0)}{h}$ היא מהירות ממוצעת, שיפוע של מיתר. המהירות הרגעית היא הגבול שלה כש-$h\to0$,
    שיפוע המשיק.
  remedy: { lesson: '5.1', label: 'ממיתר למשיק: מהירות רגעית כגבול' }

- id: MC-c5-plug-h-zero
  title: מציבים h שווה 0 במנת ההפרשים לפני שמצמצמים
  belief: >-
    כדי לחשב $\lim_{h\to0}\frac{f(x+h)-f(x)}{h}$ מציבים $h=0$, ולכן הגבול הוא $\frac{0}{0}$, כלומר אינו מוגדר או
    שווה 0.
  truth: >-
    הצבה ישירה תמיד נותנת $\frac00$, כי המונה והמכנה שואפים יחד ל-0. קודם מפשטים (פותחים סוגריים, כופלים בצמוד)
    ומצמצמים את $h$, ורק אז שולחים את $h$ ל-0.
  remedy: { lesson: '5.1', label: 'נגזרת לפי ההגדרה: מצמצמים ואז מציבים' }

- id: MC-c5-def-quotient-algebra
  title: טעות באלגברה של מנת ההפרשים
  belief: >-
    במנת ההפרשים אפשר לשכוח לחלק ב-$h$, או לחסר בסדר הפוך $f(x)-f(x+h)$.
  truth: >-
    המנה היא $\frac{f(x+h)-f(x)}{h}$: הערך המאוחר פחות המוקדם, חלקי $h$. חילוק ב-$h$ חסר נותן ביטוי ששואף ל-0, וסדר
    הפוך מחליף את הסימן של הנגזרת.
  remedy: { lesson: '5.1', label: 'מנת ההפרשים צעד אחר צעד' }

- id: MC-c5-continuous-implies-differentiable
  title: חושבים שכל פונקציה רציפה גזירה
  belief: >-
    אם $f$ רציפה בנקודה (הגרף לא נקטע שם), היא גזירה בנקודה.
  truth: >-
    הכיוון ההפוך נכון: גזירה גוררת רציפות. רציפה ולא גזירה: $|x|$ ב-0 (פינה, שיפועים חד-צדדיים $-1$ ו-$1$) ו-$\sqrt[3]{x}$
    ב-0 (משיק אנכי, המנה $h^{-2/3}\to\infty$).
  remedy: { lesson: '5.1', label: 'פינה ומשיק אנכי: רציפה ולא גזירה' }

- id: MC-c5-abs-never-differentiable
  title: חושבים שכל פונקציה עם ערך מוחלט אינה גזירה
  belief: >-
    פונקציה שבנוסחה שלה מופיע ערך מוחלט אינה גזירה בנקודה שבה הביטוי בתוכו מתאפס.
  truth: >-
    מה שקובע הוא הגרף, לא הנוסחה. $x|x|$ גזירה ב-0: המנה $\frac{h|h|}{h}=|h|\to0$. $|x|$ אינה גזירה שם, כי
    השיפועים החד-צדדיים שונים.
  remedy: { lesson: '5.1', label: 'בודקים שיפועים חד-צדדיים, לא נוסחה' }

- id: MC-c5-value-vs-derivative
  title: מבלבלים את ערך הפונקציה בנגזרת שלה
  belief: >-
    $f'(a)$ הוא $f(a)$, או שהשיפוע בנקודה הוא הערך של הפונקציה בה.
  truth: >-
    $f(a)$ הוא גובה הגרף, $f'(a)$ השיפוע שלו. ל-$f(x)=x^3$: $f(5)=125$ אבל $f'(5)=3\cdot5^2=75$. (בסיכומים עמ׳ 8
    נכתב בטעות "y = 75".)
  remedy: { lesson: '5.1', label: 'ערך מול שיפוע' }
