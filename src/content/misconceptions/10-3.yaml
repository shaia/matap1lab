# Misconceptions first detected in lesson 10.3 (differentiability, tangent plane, differential).
- id: MC-c10-remainder-only-to-zero
  title: חושבים שבהגדרת הדיפרנציאביליות מספיק שהשארית תשאף ל-0
  belief: >-
    $f$ דיפרנציאבילית ב-$(x_0,y_0)$ אם בכתיבה $f(x_0+h,y_0+k)=f(x_0,y_0)+ah+bk+\psi$ השארית מקיימת $\psi\to0$.
  truth: >-
    $\psi\to0$ נכון לכל פונקציה רציפה ולכל $a,b$. הדרישה היא ש-$\psi$ קטנה **יותר מהמרחק**:
    $\frac{\psi}{\sqrt{h^2+k^2}}\to0$. רק אז החלק הלינארי $ah+bk$ הוא הקירוב הטוב ביותר.
  remedy: { lesson: '10.3', label: 'ההגדרה: השארית קטנה מהמרחק' }

- id: MC-c10-partials-imply-differentiable
  title: חושבים שקיום הנגזרות החלקיות גורר דיפרנציאביליות
  belief: >-
    אם $f_x$ ו-$f_y$ קיימות בנקודה, $f$ דיפרנציאבילית בה ויש לה מישור משיק.
  truth: >-
    הנגזרות החלקיות רואות רק את שני הקווים המקבילים לצירים. ל-$f=\frac{xy}{x^2+y^2}$ (ו-0 בראשית) שתיהן 0 בראשית, אבל
    $f(t,t)=\frac12$, ו-$f$ אפילו לא רציפה שם. מה שמבטיח דיפרנציאביליות הוא נגזרות חלקיות **רציפות** בסביבה של הנקודה.
  remedy: { lesson: '10.3', label: 'נגזרות חלקיות בלי דיפרנציאביליות' }

- id: MC-c10-continuity-implies-differentiable
  title: חושבים שפונקציה רציפה היא דיפרנציאבילית
  belief: >-
    אם $f$ רציפה בנקודה, יש לה שם מישור משיק.
  truth: >-
    החרוט $f=\sqrt{x^2+y^2}$ רציף בראשית, אבל יש לו שם חוד: $f(t,0)=|t|$, ולכן $f_x(0,0)$ אינה קיימת ואין מישור משיק.
    דיפרנציאביליות גוררת רציפות, לא להפך.
  remedy: { lesson: '10.3', label: 'רציפות אינה מבטיחה מישור משיק' }

- id: MC-c10-tangent-plane-base
  title: שוכחים את נקודת ההשקה במשוואת המישור המשיק
  belief: >-
    המישור המשיק לגרף בנקודה $(x_0,y_0)$ הוא $z=f_x x+f_y y$, או $z=f_x(x-x_0)+f_y(y-y_0)$ בלי $f(x_0,y_0)$.
  truth: >-
    $z=f(x_0,y_0)+f_x(x_0,y_0)(x-x_0)+f_y(x_0,y_0)(y-y_0)$. בדיקה מהירה: ב-$(x_0,y_0)$ המישור חייב לתת את $z_0=f(x_0,y_0)$.
  remedy: { lesson: '10.3', label: 'משוואת המישור המשיק: עוברים דרך הנקודה' }

- id: MC-c10-grad-is-normal-to-graph
  title: חושבים שהגרדיאנט של f הוא הנורמל לגרף של f
  belief: >-
    הנורמל לגרף $z=f(x,y)$ הוא $(f_x,f_y,0)$, כלומר הגרדיאנט.
  truth: >-
    $\nabla f=(f_x,f_y)$ הוא וקטור במישור $xy$, מאונך לקו הגובה. הנורמל לגרף במרחב הוא $(f_x,f_y,-1)$: הגרף הוא משטח
    הגובה $F=f(x,y)-z=0$, ו-$\nabla F=(f_x,f_y,-1)$.
  remedy: { lesson: '10.3', label: 'הנורמל למישור המשיק לגרף' }

- id: MC-c10-differential-one-term
  title: מחשבים דיפרנציאל עם שינוי של משתנה אחד בלבד
  belief: >-
    השינוי בנפח $V=\pi r^2h$ כש-$r$ ו-$h$ משתנים מעט הוא $\frac{\partial V}{\partial r}dr$.
  truth: >-
    הדיפרנציאל השלם סוכם את התרומה של כל משתנה: $dV=\frac{\partial V}{\partial r}dr+\frac{\partial V}{\partial h}dh$.
  remedy: { lesson: '10.3', label: 'הדיפרנציאל השלם: תרומה מכל משתנה' }

- id: MC-c10-error-signs-cancel
  title: מחשבים שגיאה מרבית עם סימנים שמקזזים זה את זה
  belief: >-
    השגיאה המרבית ב-$P$ היא $|P_T\,dT+P_V\,dV|$ עם $dT$ ו-$dV$ החיוביים, גם כשהתרומות מנוגדות בסימן.
  truth: >-
    השגיאות במדידה יכולות להיות בכל סימן, והגרוע ביותר הוא כשהתרומות מצטרפות:
    $|dP|\le|P_T|\,|dT|+|P_V|\,|dV|$.
  remedy: { lesson: '10.3', label: 'הערכת שגיאה מרבית בדיפרנציאל' }
