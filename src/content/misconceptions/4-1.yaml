# Misconceptions first detected in lesson 4.1 (domain, image, graph, composition).
- id: MC-c4-domain-one-condition
  title: בודקים רק תנאי אחד בתחום ההגדרה
  belief: >-
    כדי למצוא תחום הגדרה מספיק לבדוק שהמכנה אינו מתאפס (או רק שהביטוי שבתוך השורש אינו שלילי).
  truth: >-
    כל פעולה בנוסחה מוסיפה תנאי: מכנה $\ne0$, ביטוי בתוך שורש זוגי $\ge0$, ביטוי בתוך $\ln$ חיובי ממש. תחום ההגדרה
    הוא החיתוך של **כל** התנאים: ל-$\frac{\sqrt{x+2}}{x-1}$ זה $x\ge-2$ וגם $x\ne1$.
  remedy: { lesson: '4.1', label: 'תחום הגדרה: כל התנאים יחד' }

- id: MC-c4-image-endpoints
  title: מוצאים את התמונה בקטע רק מהערכים בקצוות
  belief: >-
    התמונה של $f$ על הקטע $[a,b]$ היא הקטע שבין $f(a)$ ל-$f(b)$.
  truth: >-
    זה נכון רק לפונקציה רציפה ומונוטונית. ל-$x^2$ על $[-1,2]$ הקצוות נותנים 1 ו-4, אבל ב-$x=0$ הערך 0: התמונה
    $[0,4]$. מחפשים גם את הנקודות שבהן הפונקציה מחליפה כיוון.
  remedy: { lesson: '4.1', label: 'תמונה של פונקציה על קטע' }

- id: MC-c4-image-all-reals
  title: חושבים שהתמונה היא כל הממשיים
  belief: >-
    פונקציה שמוגדרת על "כמעט כל" הישר מקבלת את כל הערכים הממשיים.
  truth: >-
    התמונה היא אוסף הערכים שהפונקציה **באמת** מקבלת. $\frac1x$ לעולם אינה 0, ולכן התמונה שלה $\mathbb{R}\setminus\{0\}$;
    התמונה של $x^2$ היא $[0,\infty)$.
  remedy: { lesson: '4.1', label: 'מהי התמונה' }

- id: MC-c4-composition-order
  title: מחליפים את סדר ההרכבה
  belief: >-
    $f(g(x))$ ו-$g(f(x))$ הם אותו דבר, או ש-$f(g(x))$ פירושו להפעיל קודם את $f$.
  truth: >-
    ב-$f(g(x))$ מפעילים **קודם** את $g$ (הפנימית) ועל התוצאה את $f$. בדרך כלל הסדר משנה: ל-$f(x)=x^2+1$, $g(x)=3x-2$,
    $f(g(x))=(3x-2)^2+1$ ואילו $g(f(x))=3x^2+1$.
  remedy: { lesson: '4.1', label: 'הרכבה: מבפנים החוצה' }

- id: MC-c4-composition-is-product
  title: מבלבלים הרכבה עם מכפלה
  belief: >-
    $f(g(x))=f(x)\cdot g(x)$, ו-$\sin(x^3)$ היא המכפלה של $\sin x$ ו-$x^3$.
  truth: >-
    בהרכבה הפלט של $g$ הוא **הקלט** של $f$: $\sin(x^3)$ היא $f(g(x))$ עם $g(x)=x^3$ ו-$f(u)=\sin u$. במכפלה שתי
    הפונקציות מקבלות את אותו $x$ ותוצאותיהן נכפלות.
  remedy: { lesson: '4.1', label: 'הרכבה מול מכפלה' }

- id: MC-c4-composition-skip-inner
  title: מציבים את הנקודה ישר בפונקציה החיצונית
  belief: >-
    $f(g(a))=f(a)$: למשל $\ln(x-1)$ ב-$x=2$ הוא $\ln2$.
  truth: >-
    קודם מחשבים את הפנימית בנקודה, $g(a)$, ורק את התוצאה מציבים בחיצונית: $\ln(x-1)$ ב-$x=2$ הוא $\ln(2-1)=\ln1=0$.
  remedy: { lesson: '4.1', label: 'ערך של הרכבה בנקודה' }

- id: MC-c4-composition-domain-inner-only
  title: לוקחים את תחום ההרכבה מאחת הפונקציות בלבד
  belief: >-
    תחום ההגדרה של $f(g(x))$ הוא תחום ההגדרה של $g$ (או של $f$).
  truth: >-
    $x$ בתחום של $f\circ g$ כש-$x$ בתחום של $g$ **וגם** $g(x)$ בתחום של $f$. ל-$\sqrt{1-x^2}$: $g(x)=1-x^2$ מוגדרת
    לכל $x$, אבל צריך $1-x^2\ge0$, ולכן התחום $[-1,1]$.
  remedy: { lesson: '4.1', label: 'תחום ההגדרה של הרכבה' }

- id: MC-c4-composition-domain-final-formula
  title: קובעים את תחום ההרכבה מהנוסחה המפושטת
  belief: >-
    $(\sqrt x)^2=x$, ולכן ההרכבה מוגדרת לכל $x$ ממשי.
  truth: >-
    הפישוט נכון רק במקום שבו כל השלבים מוגדרים. $(\sqrt x)^2$ דורשת קודם את $\sqrt x$, ולכן מוגדרת רק ל-$x\ge0$. גם
    אחרי צמצום, $\frac{x^2-5x+6}{x-2}$ אינה מוגדרת ב-$x=2$.
  remedy: { lesson: '4.1', label: 'פישוט אינו מרחיב את התחום' }

- id: MC-c4-graph-increasing-positive
  title: מבלבלים פונקציה עולה עם פונקציה חיובית
  belief: >-
    במקום שבו הגרף מעל ציר $x$ הפונקציה עולה, ובמקום שבו הוא מתחת לציר היא יורדת.
  truth: >-
    חיובית/שלילית זה **הגובה** של הגרף; עולה/יורדת זה **הכיוון** שלו כשזזים ימינה. $(x-1)(x-3)$ שלילית בכל $(1,3)$,
    אבל יורדת רק ב-$(1,2)$ ועולה ב-$(2,3)$.
  remedy: { lesson: '4.1', label: 'קריאת גרף: גובה מול כיוון' }

- id: MC-c4-intercept-axes-swap
  title: מחליפים בין נקודות החיתוך עם שני הצירים
  belief: >-
    נקודת החיתוך עם ציר $y$ מתקבלת מ-$f(x)=0$.
  truth: >-
    על ציר $y$ מתקיים $x=0$: החיתוך הוא $(0,f(0))$. על ציר $x$ מתקיים $y=0$: פותרים $f(x)=0$.
  remedy: { lesson: '4.1', label: 'חיתוך עם הצירים' }

- id: MC-c4-ln-sign
  title: חושבים שהלוגריתם חיובי בכל מקום שבו הוא מוגדר
  belief: >-
    $\ln u\ge0$ בדיוק כש-$u\ge0$ (או כש-$u>0$).
  truth: >-
    $\ln u$ מוגדר ל-$u>0$, אבל **חיובי** רק ל-$u>1$: $\ln u<0$ ל-$0<u<1$, ו-$\ln1=0$. לכן $\ln u\ge0$ בדיוק כש-$u\ge1$.
  remedy: { lesson: '4.1', label: 'הסימן של ln' }

- id: MC-c4-domain-image-swap
  title: מבלבלים תחום הגדרה עם תמונה
  belief: >-
    הערכים שהמשתנה $x$ (או הזמן $t$) מקבל הם התמונה של הפונקציה.
  truth: >-
    התחום הוא אוסף **הקלטים** (ערכי $t$), והתמונה אוסף **הפלטים** (ערכי $f(t)$). לגובה של כדור, הזמנים הם התחום והגבהים
    הם התמונה.
  remedy: { lesson: '4.1', label: 'תחום מול תמונה' }
