# Misconceptions first detected in lesson 6.4 (the domain of convergence and Leibniz-type series).
- id: MC-c6-radius-substitution
  title: הופכים או שוכחים את ההצבה כשמחשבים רדיוס התכנסות של טור נגזר
  belief: >-
    הטור של $\frac{1}{1-3x}$ מתכנס כש-$|x|<3$, או שהטור של $\ln\left(1+\frac{x^2}{4}\right)$ מתכנס כש-$|x|<4$.
  truth: >-
    מציבים $u$ בטור ידוע ופותרים את התנאי $|u|<R$ עבור $x$: $|3x|<1$ נותן $|x|<\frac13$, ו-$\frac{x^2}{4}<1$ נותן $|x|<2$.
    מקדם גדול של $x$ מקטין את הרדיוס.
  remedy: { lesson: '6.4', label: 'רדיוס התכנסות של פיתוח נגזר' }

- id: MC-c6-series-beyond-radius
  title: משתמשים בטור מחוץ לתחום ההתכנסות שלו
  belief: >-
    השוויון $\frac{1}{1-x}=\sum x^k$ (או כל פיתוח אחר) נכון בכל מקום שהפונקציה מוגדרת, למשל ב-$x=2$.
  truth: >-
    טור החזקות מייצג את הפונקציה רק בתחום ההתכנסות. מחוץ לו האיברים אינם שואפים לאפס, והטור מתבדר גם כשהפונקציה
    מוגדרת היטב.
  remedy: { lesson: '6.4', label: 'תחום ההתכנסות של הפיתוחים' }

- id: MC-c6-smooth-means-infinite-radius
  title: חושבים שפונקציה חלקה על כל הישר מתפתחת לטור שמתכנס בכל הישר
  belief: >-
    אם $f$ גזירה אינסוף פעמים על כל $\mathbb{R}$, רדיוס ההתכנסות של הטור שלה אינסופי.
  truth: >-
    $\frac{1}{1+x^2}$ ו-$\arctan x$ חלקות על כל הישר, ורדיוס ההתכנסות שלהן 1. את הרדיוס קובעת הנקודה ה"רעה" הקרובה
    ביותר, גם מרוכבת: כאן $\pm i$.
  remedy: { lesson: '6.4', label: 'למה הרדיוס של arctan הוא 1' }

- id: MC-c6-radius-endpoints
  title: מסיקים מהרדיוס מה קורה בקצוות של תחום ההתכנסות
  belief: >-
    בקצוות $x=\pm R$ הטור תמיד מתבדר, או תמיד מתכנס אם איבריו שואפים לאפס.
  truth: >-
    הרדיוס אינו אומר דבר על הקצוות; בודקים כל קצה בנפרד. $\sum\frac{(-1)^{k+1}x^k}{k}$ מתכנס ב-$x=1$ (טור לייבניץ) ומתבדר
    ב-$x=-1$ (הטור ההרמוני).
  remedy: { lesson: '6.4', label: 'בדיקת הקצוות' }

- id: MC-c6-leibniz-last-included
  title: חוסמים את השגיאה של טור לייבניץ באיבר האחרון שנכלל
  belief: >-
    השגיאה של סכום חלקי של טור מתחלף קטנה מהאיבר האחרון שסוכם, ולכן דורשים שהוא יהיה קטן מהדיוק.
  truth: >-
    בטור מתחלף שאיבריו יורדים לאפס, $|S-S_n|\le a_{n+1}$: האיבר הראשון ש**הושמט**. זה חסם טוב יותר, ולפעמים חוסך איבר
    אחד.
  remedy: { lesson: '6.4', label: 'חסם לייבניץ: האיבר הראשון שהושמט' }

- id: MC-c6-leibniz-sign
  title: חושבים שסכום חלקי של טור מתחלף תמיד קטן מהסכום
  belief: >-
    כמו בטור חיובי, הסכומים החלקיים עולים אל הסכום, ולכן כל סכום חלקי קטן ממנו.
  truth: >-
    בטור לייבניץ הסכומים החלקיים קופצים מעל ומתחת לסכום לסירוגין. השגיאה $S-S_n$ בסימן של האיבר הראשון שהושמט: אחרי
    איבר חיובי, $S_n>S$.
  remedy: { lesson: '6.4', label: 'הסימן של השגיאה בטור לייבניץ' }

- id: MC-c6-compose-truncate
  title: בהרכבת טורים זורקים איברים שעוד תורמים לסדר המבוקש
  belief: >-
    כדי לפתח $e^{\sin x}$ או $\ln(\cos x)$ מספיק האיבר הראשון של הפונקציה הפנימית, או האיבר הראשון של החיצונית.
  truth: >-
    כש-$u$ מתחיל ב-$x^m$, האיבר $u^k$ מתחיל ב-$x^{km}$. שומרים כל $u^k$ עם $km\le n$, ובכל אחד את החזקות של $x$ עד $n$.
    למשל ב-$\ln\cos x$ גם $-\frac{u^2}{2}$ תורם ל-$x^4$.
  remedy: { lesson: '6.4', label: 'הרכבה של טורים' }

- id: MC-c6-leibniz-count
  title: עוצרים מוקדם מדי כשסופרים כמה איברים לסכם
  belief: >-
    מספיק לסכם עד שהאיבר הבא "נראה קטן", בלי לבדוק שהאיבר הראשון שהושמט כבר קטן מהדיוק הנדרש.
  truth: >-
    אחרי $n$ איברים השגיאה חסומה ב-$a_{n+1}$, האיבר הראשון שהושמט. בוחרים את ה-$n$ הקטן ביותר שבו $a_{n+1}$ קטן מהדיוק;
    אם $a_{n+1}$ עוד גדול ממנו, צריך איבר נוסף.
  remedy: { lesson: '6.4', label: 'כמה איברים צריך בטור לייבניץ' }
