# Misconceptions first detected in lesson 5.4 (implicit differentiation, inverse functions, logarithmic differentiation).
- id: MC-c5-implicit-forget-yprime
  title: בגזירה סתומה מתייחסים ל-y כקבוע
  belief: >-
    כשגוזרים את משוואת העקום לפי $x$, $(y^2)'=2y$ ו-$(xy)'=y$, כאילו $y$ קבוע.
  truth: >-
    $y$ היא פונקציה של $x$, ולכן כלל השרשרת וכלל המכפלה חלים: $(y^2)'=2y\,y'$, $(xy)'=y+xy'$.
  remedy: { lesson: '5.4', label: 'גזירה סתומה: y תלוי ב-x' }

- id: MC-c5-inverse-wrong-point
  title: מחשבים את נגזרת ההפוכה בנקודה הלא נכונה
  belief: >-
    $(f^{-1})'(b)=\frac{1}{f'(b)}$.
  truth: >-
    $(f^{-1})'(b)=\frac{1}{f'(a)}$ כש-$f(a)=b$: הנגזרת של $f$ מחושבת בנקודה **המקבילה** על הגרף של $f$. השיפוע של
    ההפוכה ב-$(b,a)$ הופכי לשיפוע של $f$ ב-$(a,b)$.
  remedy: { lesson: '5.4', label: 'נגזרת ההפוכה: באיזו נקודה' }

- id: MC-c5-inverse-is-reciprocal
  title: מבלבלים פונקציה הפוכה עם אחד חלקי הפונקציה
  belief: >-
    $f^{-1}(x)=\frac{1}{f(x)}$, או שנגזרת ההפוכה שווה ל-$f'$ עצמה.
  truth: >-
    $f^{-1}$ הופכת את $f$ ביחס להרכבה: $f^{-1}(f(x))=x$. ל-$f(x)=x^3$, $f^{-1}(x)=\sqrt[3]{x}$, ולא $\frac1{x^3}$. השיפוע
    שלה הוא **ההופכי** של שיפוע $f$ בנקודה המקבילה.
  remedy: { lesson: '5.4', label: 'פונקציה הפוכה ונגזרתה' }

- id: MC-c5-arccos-sign
  title: שוכחים את המינוס בנגזרת של arccos
  belief: >-
    $(\arccos x)'=\frac{1}{\sqrt{1-x^2}}$, כמו $\arcsin$.
  truth: >-
    $(\arccos x)'=-\frac{1}{\sqrt{1-x^2}}$: $\arccos$ **יורדת** בקטע $(-1,1)$, ולכן נגזרתה שלילית. (וגם
    $\arcsin x+\arccos x=\frac\pi2$.)
  remedy: { lesson: '5.4', label: 'הנגזרות של arcsin ו-arccos' }

- id: MC-c5-power-rule-variable-exponent
  title: גוזרים חזקה שגם הבסיס וגם המעריך שלה משתנים בכלל אחד בלבד
  belief: >-
    $(x^x)'=x\cdot x^{x-1}$ (כלל החזקה) או $(x^x)'=x^x\ln x$ (כלל האקספוננט); ובאופן כללי מחליפים בין הכלל לבסיס
    משתנה לכלל למעריך משתנה.
  truth: >-
    כלל החזקה דורש מעריך קבוע, וכלל האקספוננט בסיס קבוע. כששניהם משתנים כותבים $x^x=e^{x\ln x}$ (או גוזרים את
    $\ln y=x\ln x$), ומקבלים $(x^x)'=x^x(\ln x+1)$: סכום שתי התרומות.
  remedy: { lesson: '5.4', label: 'גזירה לוגריתמית' }

- id: MC-c5-logdiff-forget-y
  title: בגזירה לוגריתמית שוכחים להכפיל ב-y
  belief: >-
    אחרי שגוזרים את $\ln y$, הנגזרת $y'$ היא מה שהתקבל באגף ימין.
  truth: >-
    גזירת $\ln y$ נותנת $\frac{y'}{y}$. לכן $y'=y\cdot(\ldots)$: צריך להכפיל בחזרה בפונקציה עצמה.
  remedy: { lesson: '5.4', label: 'גזירה לוגריתמית: הצעד האחרון' }

- id: MC-c5-implicit-zero-denominator
  title: מפרשים מכנה שמתאפס בנוסחת השיפוע הסתומה כמשיק אופקי או כפינה
  belief: >-
    כשהמכנה בנוסחה ל-$y'$ שהתקבלה מגזירה סתומה מתאפס, המשיק אופקי, או שלעקום יש שם פינה ואין לו משיק.
  truth: >-
    משיק אופקי הוא **מונה** שמתאפס ($y'=0$). מכנה שמתאפס (והמונה לא) הוא שיפוע ששואף לאינסוף: משיק **אנכי**. העקום
    יכול להיות חלק לגמרי שם, כמו המעגל $x^2+y^2=1$ ב-$(1,0)$, שבו $y'=-\frac xy$.
  remedy: { lesson: '5.4', label: 'גזירה סתומה: משיק אופקי ומשיק אנכי' }
