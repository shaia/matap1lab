# Misconceptions first detected in lesson 0.4 (lines and circles in the plane).
- id: MC-c0-slope-inverted
  title: מחשבים שיפוע כהפרש ה-x חלקי הפרש ה-y
  belief: >-
    השיפוע של ישר דרך $(x_1,y_1)$ ו-$(x_2,y_2)$ הוא $\frac{x_2-x_1}{y_2-y_1}$.
  truth: >-
    שיפוע הוא "כמה עולים לכל צעד ימינה": $m=\frac{y_2-y_1}{x_2-x_1}$. ישר תלול יש לו שיפוע גדול בערכו המוחלט.
  remedy: { lesson: '0.4', label: 'שיפוע: עלייה חלקי ריצה' }

- id: MC-c0-perp-slope
  title: טועים בשיפוע של ישר מאונך
  belief: >-
    ישר מאונך לישר עם שיפוע $m$ יש לו שיפוע $-m$, או $\frac1m$.
  truth: >-
    שני ישרים (לא אנכיים) מאונכים בדיוק כש-$m_1m_2=-1$, כלומר $m_2=-\frac{1}{m_1}$: גם הופכי וגם סימן הפוך. לשיפוע
    $-\frac23$ המאונך הוא $\frac32$.
  remedy: { lesson: '0.4', label: 'ישרים מאונכים: מכפלת השיפועים $-1$' }

- id: MC-c0-slope-from-coefficient
  title: קוראים את השיפוע ישר מהמקדם של x בצורה הכללית
  belief: >-
    השיפוע של $4x-2y=5$ הוא 4.
  truth: >-
    השיפוע הוא המקדם של $x$ רק בצורה $y=mx+n$. מבודדים את $y$: $y=2x-\frac52$, ולכן השיפוע 2. בצורה $ax+by=c$ השיפוע
    הוא $-\frac ab$.
  remedy: { lesson: '0.4', label: 'משוואת ישר: מבודדים את y' }

- id: MC-c0-vertical-horizontal
  title: מבלבלים בין ישר אנכי לישר אופקי
  belief: >-
    הישר דרך $(2,1)$ ו-$(2,5)$ הוא $y=2$, ושיפועו 0.
  truth: >-
    לכל נקודות הישר אותו $x$, ולכן זה הישר האנכי $x=2$. לישר אנכי אין שיפוע (הפרש ה-$x$ הוא 0); לישר אופקי $y=c$ השיפוע 0.
  remedy: { lesson: '0.4', label: 'ישרים אנכיים ואופקיים' }

- id: MC-c0-distance-sum
  title: מחשבים מרחק כסכום ההפרשים
  belief: >-
    המרחק בין $(x_1,y_1)$ ל-$(x_2,y_2)$ הוא $|x_2-x_1|+|y_2-y_1|$.
  truth: >-
    המרחק (בקו ישר) הוא היתר במשולש ישר זווית שניצביו ההפרשים: $\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}$ (פיתגורס). סכום ההפרשים
    הוא אורך הדרך "לאורך הצירים", והוא גדול יותר כששני ההפרשים שונים מ-0.
  remedy: { lesson: '0.4', label: 'נוסחת המרחק מפיתגורס' }

- id: MC-c0-distance-add-coords
  title: מחברים קואורדינטות במקום לחסר בנוסחת המרחק
  belief: >-
    המרחק בין $(-1,2)$ ל-$(3,-1)$ הוא $\sqrt{(-1+3)^2+(2-1)^2}$.
  truth: >-
    במרחק מופיעים **הפרשים**: $\sqrt{(3-(-1))^2+(-1-2)^2}=\sqrt{16+9}=5$. מינוס של מספר שלילי הוא חיבור, אבל הנוסחה
    עצמה היא תמיד הפרש.
  remedy: { lesson: '0.4', label: 'נוסחת המרחק: הפרשי קואורדינטות' }

- id: MC-c0-midpoint-difference
  title: מחשבים אמצע קטע כחצי ההפרש
  belief: >-
    שיעור ה-$x$ של אמצע הקטע בין $x_1$ ל-$x_2$ הוא $\frac{x_2-x_1}{2}$.
  truth: >-
    אמצע הקטע הוא הממוצע: $\frac{x_1+x_2}{2}$. חצי ההפרש $\frac{x_2-x_1}{2}$ הוא **אורך** חצי הקטע, לא מקומו.
  remedy: { lesson: '0.4', label: 'אמצע קטע: ממוצע הקואורדינטות' }

- id: MC-c0-equidistant-midpoint
  title: חושבים שהנקודה היחידה במרחק שווה משתי נקודות היא אמצע הקטע
  belief: >-
    הנקודה על ציר ה-$x$ שמרחקה מ-$A$ ומ-$B$ שווה היא בשיעור $x$ של אמצע $AB$.
  truth: >-
    הנקודות שמרחקן שווה מ-$A$ ומ-$B$ יוצרות ישר שלם: האנך האמצעי של $AB$. נקודה עליו שנמצאת על ציר ה-$x$ מוצאים
    בהשוואת המרחקים, והיא מתחת לאמצע רק כש-$AB$ אופקי.
  remedy: { lesson: '0.4', label: 'האנך האמצעי' }

- id: MC-c0-circle-radius
  title: קוראים את הרדיוס לא נכון ממשוואת המעגל
  belief: >-
    במעגל $(x-a)^2+(y-b)^2=16$ הרדיוס 16, או שב-$x^2+y^2-6x+4y-3=0$ הרדיוס $\sqrt3$.
  truth: >-
    באגף ימין של הצורה הקנונית נמצא $r^2$, ולכן $r=\sqrt{16}=4$. וקודם משלימים לריבוע: הקבוע בצורה הכללית אינו $r^2$,
    כי ההשלמה מוסיפה לו.
  remedy: { lesson: '0.4', label: 'מעגל: השלמה לריבוע' }

- id: MC-c0-circle-center-coeff
  title: לוקחים את המקדמים עצמם כמרכז המעגל
  belief: >-
    המרכז של $x^2+y^2-6x+4y-3=0$ הוא $(6,-4)$ או $(-6,4)$.
  truth: >-
    $x^2-6x=(x-3)^2-9$: בהשלמה לריבוע לוקחים **חצי** מהמקדם. המרכז הוא $(3,-2)$.
  remedy: { lesson: '0.4', label: 'מעגל: השלמה לריבוע' }

- id: MC-c0-every-xy-square-circle
  title: חושבים שכל משוואה מהצורה x בריבוע ועוד y בריבוע ועוד ... היא מעגל
  belief: >-
    כל משוואה $x^2+y^2+Dx+Ey+F=0$ מתארת מעגל.
  truth: >-
    אחרי השלמה לריבוע מתקבל $(x-a)^2+(y-b)^2=K$. רק כש-$K>0$ זה מעגל; כש-$K=0$ זו נקודה אחת, וכש-$K<0$ אין אף נקודה,
    כמו ב-$x^2+y^2+2x+10=0$, שנותן $(x+1)^2+y^2=-9$.
  remedy: { lesson: '0.4', label: 'מעגל, נקודה, או קבוצה ריקה' }

- id: MC-c0-tangent-radius-slope
  title: משתמשים בשיפוע הרדיוס כשיפוע המשיק
  belief: >-
    המשיק למעגל בנקודה $P$ עובר בכיוון של הרדיוס מהמרכז ל-$P$.
  truth: >-
    המשיק למעגל **מאונך** לרדיוס בנקודת ההשקה. אם שיפוע הרדיוס $m$, שיפוע המשיק $-\frac1m$.
  remedy: { lesson: '0.4', label: 'משיק למעגל: מאונך לרדיוס' }

- id: MC-c0-slope-angle
  title: חושבים שהשיפוע הוא הסינוס או הקוסינוס של זווית הנטייה
  belief: >-
    ישר שיוצר זווית $60^\circ$ עם ציר ה-$x$ שיפועו $\sin60^\circ$ או $\cos60^\circ$.
  truth: >-
    השיפוע הוא עלייה חלקי ריצה, $\frac{\sin\alpha}{\cos\alpha}=\tan\alpha$. לזווית $60^\circ$ השיפוע $\sqrt3\approx1.73$.
  remedy: { lesson: '0.4', label: 'שיפוע וזווית נטייה' }
