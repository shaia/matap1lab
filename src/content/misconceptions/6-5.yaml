# Misconceptions first detected in lesson 6.5 (sketching graphs).
- id: MC-c6-asymptote-degree
  title: מוצאים אסימפטוטה אופקית בלי להשוות את המעלות של המונה והמכנה
  belief: >-
    לכל פונקציה רציונלית יש אסימפטוטה אופקית בגובה היחס בין המקדמים המובילים, או שהיא שואפת ל-1.
  truth: >-
    כשמעלת המונה קטנה ממעלת המכנה, $y=0$; כשהן שוות, היחס בין המקדמים המובילים; כשהמונה גדול במעלה אחת, אסימפטוטה
    משופעת מחילוק פולינומים, כמו $\frac{x^2+1}{x-1}=x+1+\frac{2}{x-1}$.
  remedy: { lesson: '6.5', label: 'אסימפטוטות של פונקציה רציונלית' }

- id: MC-c6-asymptote-denominator
  title: מחפשים אסימפטוטה אנכית במקום שבו המכנה אינו מתאפס
  belief: >-
    ל-$\frac{x}{1+x^2}$ יש אסימפטוטות אנכיות ב-$x=\pm1$, או שכל ערך "מיוחד" של המכנה נותן אסימפטוטה.
  truth: >-
    אסימפטוטה אנכית יכולה להיות רק היכן שהמכנה מתאפס (והמונה לא). $1+x^2\ge1$ לעולם אינו מתאפס, ולכן הפונקציה מוגדרת
    ורציפה בכל הישר.
  remedy: { lesson: '6.5', label: 'אסימפטוטות אנכיות: איפה המכנה מתאפס' }

- id: MC-c6-inflection-is-critical
  title: מחפשים נקודות פיתול באפסים של הנגזרת הראשונה
  belief: >-
    נקודות הפיתול הן הנקודות שבהן $f'=0$, ובפרט מספרן הוא מספר הנקודות הקריטיות.
  truth: >-
    נקודת פיתול היא נקודה שבה $f''$ מחליפה סימן, כלומר הגרף עובר מקמור לקעור. $f'=0$ מסמן משיק אופקי (מועמד לקיצון),
    ושתי השאלות בלתי תלויות: ל-$x^3-6x^2+5$ הקיצון ב-0 וב-4, הפיתול ב-2.
  remedy: { lesson: '6.5', label: 'נקודת פיתול: f השנייה מחליפה סימן' }

- id: MC-c6-fpp-zero-inflection
  title: חושבים שכל נקודה שבה הנגזרת השנייה מתאפסת היא נקודת פיתול
  belief: >-
    אם $f''(x_0)=0$, ל-$f$ יש נקודת פיתול ב-$x_0$.
  truth: >-
    $f''(x_0)=0$ הוא תנאי הכרחי בלבד (כש-$f''$ רציפה). ל-$x^4$ ב-0, $f''(0)=0$ אבל $f''=12x^2\ge0$ משני הצדדים: אין פיתול,
    יש מינימום. בודקים החלפת סימן, או את האיבר המוביל בטיילור.
  remedy: { lesson: '6.5', label: 'מתי f השנייה שווה אפס אינה פיתול' }

- id: MC-c6-convex-sign
  title: מתבלבלים בין קמור לקעור
  belief: >-
    $f''<0$ פירושו שהגרף קמור (פתוח למעלה).
  truth: >-
    $f''>0$: השיפוע עולה והגרף קמור, פתוח כלפי מעלה, כמו $x^2$. $f''<0$: הגרף קעור, פתוח כלפי מטה, כמו $-x^2$.
  remedy: { lesson: '6.5', label: 'קמירות וסימן הנגזרת השנייה' }

- id: MC-c6-skip-value-check
  title: קובעים את סוג הנקודה הקריטית בלי לבדוק
  belief: >-
    כל נקודה שבה $f'=0$ היא מקסימום, או שסוג הקיצון נקבע לפי סימן הערך $f(x_0)$.
  truth: >-
    את הסוג קובעים לפי הסימן של $f'$ משני הצדדים, לפי $f''$, או בבדיקה מהירה של ערכים סמוכים: אם $f(x_0)$ קטן משני
    השכנים, זה מינימום. בדיקה בערכים תופסת טעויות סימן בחקירה.
  remedy: { lesson: '6.5', label: 'בדיקת השרטוט מול ערכים מחושבים' }

- id: MC-c6-second-test-final
  title: חושבים שכשהנגזרת השנייה מתאפסת אין דרך להכריע
  belief: >-
    אם $f'(x_0)=f''(x_0)=0$, אי אפשר לדעת אם יש קיצון, או שהגרף בהכרח נראה כמו פרבולה.
  truth: >-
    מפתחים לפי טיילור עד האיבר הראשון שאינו אפס, $a_k(x-x_0)^k$. אם $k$ זוגי יש קיצון (מינימום כש-$a_k>0$, מקסימום
    כש-$a_k<0$); אם $k$ אי-זוגי, הגרף חוצה את המשיק בנקודת פיתול.
  remedy: { lesson: '6.5', label: 'ההתנהגות המובילה מטיילור' }
