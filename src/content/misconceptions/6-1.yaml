# Misconceptions first detected in lesson 6.1 (higher derivatives and the Taylor polynomial).
- id: MC-c6-chain-power
  title: בנגזרת מסדר גבוה של הרכבה סופרים את הנגזרת הפנימית פעם אחת בלבד
  belief: >-
    $\frac{d^n}{dx^n}\sin(3x)=3\sin^{(n)}(3x)$: הגורם 3 של כלל השרשרת מופיע פעם אחת, או שהנגזרות של $e^{2x}$ ו-$\sin x$
    נעלמות בסוף כמו של פולינום.
  truth: >-
    כל גזירה מפעילה מחדש את כלל השרשרת, ולכן $\frac{d^n}{dx^n}f(ax)=a^nf^{(n)}(ax)$, למשל
    $\frac{d^n}{dx^n}e^{2x}=2^ne^{2x}$. רק לפולינום הנגזרות מתאפסות מסדר מסוים והלאה.
  remedy: { lesson: '6.1', anchor: 'chain-each-time', label: 'נגזרות מסדר גבוה: כלל השרשרת בכל גזירה' }

- id: MC-c6-nth-deriv-sign
  title: טועים בסימנים של נגזרות חוזרות
  belief: >-
    הנגזרות של $\frac1x$ או של $\ln x$ כולן באותו סימן, או שהסימן של $\sin^{(n)}$ אינו משנה.
  truth: >-
    גזירה של $x^{k}$ עם $k<0$ מוסיפה גורם שלילי, ולכן $\left(\frac1x\right)^{(n)}=\frac{(-1)^nn!}{x^{n+1}}$ והסימנים
    מתחלפים. ב-$\frac{1}{1-x}$ הנגזרת הפנימית $-1$ מבטלת את המינוס, ו-$\left(\frac{1}{1-x}\right)^{(n)}=\frac{n!}{(1-x)^{n+1}}$.
    הנגזרות של $\sin$ חוזרות במחזור $\sin,\ \cos,\ -\sin,\ -\cos$.
  remedy: { lesson: '6.1', anchor: 'nth-formula', label: 'נוסחה לנגזרת מסדר n: בודקים את הסימן ב-n קטנים' }

- id: MC-c6-forget-factorial
  title: שוכחים לחלק בעצרת במקדמי טיילור
  belief: >-
    המקדם של $(x-x_0)^k$ בפולינום טיילור הוא $f^{(k)}(x_0)$, או $\frac{f^{(k)}(x_0)}{k}$.
  truth: >-
    $T_n(x)=\sum_{k=0}^{n}\frac{f^{(k)}(x_0)}{k!}(x-x_0)^k$. העצרת באה מכך ש-$k$ גזירות של $(x-x_0)^k$ נותנות $k!$: רק כך
    לפולינום יש אותן נגזרות כמו ל-$f$ בנקודה.
  remedy: { lesson: '6.1', anchor: 'factorial-why', label: 'הנוסחה של פולינום טיילור ומאיפה באה העצרת' }

- id: MC-c6-powers-of-x
  title: כותבים פולינום טיילור סביב נקודה בחזקות של x במקום בחזקות של x פחות הנקודה
  belief: >-
    פולינום טיילור סביב $x_0$ הוא $f(x_0)+f'(x_0)x+\frac{f''(x_0)}{2}x^2+\dots$, או שהמקדמים שלו הם המקדמים של הפולינום
    בחזקות של $x$.
  truth: >-
    סביב $x_0$ כותבים חזקות של $x-x_0$: $T_n(x)=\sum_k\frac{f^{(k)}(x_0)}{k!}(x-x_0)^k$. בדיקה מהירה: $T_n(x_0)=f(x_0)$.
    המקדמים בחזקות של $x-x_0$ שונים מהמקדמים בחזקות של $x$.
  remedy: { lesson: '6.1', anchor: 'about-x0', label: 'פולינום טיילור סביב נקודה' }

- id: MC-c6-taylor-global
  title: חושבים שפולינום טיילור מתלכד עם הפונקציה או שהוא מיתר
  belief: >-
    פולינום טיילור מתלכד עם $f$ בקטע שלם סביב $x_0$, או שהוא נבנה משתי נקודות על הגרף כמו מיתר; ומצד שני, קירוב לעולם
    אינו מדויק.
  truth: >-
    $T_n$ בנוי רק מהמידע ב-$x_0$: $f(x_0),f'(x_0),\dots,f^{(n)}(x_0)$. הוא צמוד ל-$f$ ליד $x_0$, והשגיאה בדרך כלל אינה
    אפס מחוץ ל-$x_0$; אבל לפולינום ממעלה $\le n$ השגיאה אפס בכל מקום.
  remedy: { lesson: '6.1', anchor: 'taylor-local', label: 'מה פולינום טיילור יודע על הפונקציה' }

- id: MC-c6-poly-taylor-different
  title: חושבים שפולינום טיילור של פולינום הוא פולינום אחר
  belief: >-
    פולינום טיילור של $x^3-2x+1$ סביב 2 הוא פולינום אחר, כי הוא כתוב בחזקות של $x-2$.
  truth: >-
    לפולינום $p$ ממעלה $n$, פולינום טיילור מסדר $n$ (או יותר) סביב כל נקודה הוא $p$ עצמו, כתוב בחזקות של $x-x_0$. פתיחת
    הסוגריים מחזירה את $p$.
  remedy: { lesson: '6.1', anchor: 'poly-self', label: 'פולינום שווה לפולינום הטיילור של עצמו' }

- id: MC-c6-osculating-tangent-only
  title: חושבים שהפרבולה הצמודה מוסיפה רק מה שהמשיק כבר נותן
  belief: >-
    $T_2$ מתאים ל-$f$ רק בערך ובשיפוע, כמו המשיק, ולכן האיבר הריבועי אינו משנה דבר חשוב.
  truth: >-
    $T_2''(x_0)=f''(x_0)$: הפרבולה הצמודה מתעקמת כמו הגרף ובאותו כיוון. לכן היא מבחינה בין מקסימום למינימום כשהמשיק
    אופקי, ומשפרת את הקירוב ליד $x_0$.
  remedy: { lesson: '6.1', anchor: 'osculating', label: 'הפרבולה הצמודה: ערך, שיפוע וכיוון ההתעקמות' }
