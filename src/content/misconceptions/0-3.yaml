# Misconceptions first detected in lesson 0.3 (powers, the exponential and logarithms).
- id: MC-c0-negative-exponent-sign
  title: חושבים שמעריך שלילי נותן מספר שלילי
  belief: >-
    $8^{-2/3}=-4$, ו-$\frac18=2^{3}$: המינוס במעריך עובר לתוצאה.
  truth: >-
    מעריך שלילי פירושו הופכי: $a^{-n}=\frac{1}{a^n}$. לכן $8^{-2/3}=\frac{1}{8^{2/3}}=\frac14$, ו-$\frac18=2^{-3}$. חזקה של
    בסיס חיובי היא תמיד חיובית. ובחילוק חזקות מחסרים את המעריכים: $\frac{x^a}{x^{-1}}=x^{a+1}$.
  remedy: { lesson: '0.3', label: 'מעריכים שליליים: הופכי, לא סימן' }

- id: MC-c0-fractional-exponent-swap
  title: מחליפים בין המונה למכנה במעריך שברי
  belief: >-
    $a^{2/3}$ פירושו השורש הריבועי של $a^3$.
  truth: >-
    $a^{m/n}=\sqrt[n]{a^m}=\left(\sqrt[n]{a}\right)^m$: המכנה הוא סדר השורש, המונה הוא החזקה. $8^{2/3}=\left(\sqrt[3]8\right)^2=4$.
  remedy: { lesson: '0.3', label: 'מעריכים שבריים' }

- id: MC-c0-power-sum-rule
  title: מחברים חזקות כאילו כופלים אותן
  belief: >-
    $2^x+2^x=4^x$, או $a^m+a^n=a^{m+n}$.
  truth: >-
    החוק $a^m\cdot a^n=a^{m+n}$ הוא על **מכפלה**. סכום של שתי חזקות זהות הוא פי 2: $2^x+2^x=2\cdot2^x=2^{x+1}$. ב-$x=2$:
    $8$ מול $4^2=16$.
  remedy: { lesson: '0.3', label: 'חוקי החזקות: מכפלה, לא סכום' }

- id: MC-c0-bigger-exponent-bigger
  title: משווים חזקות לפי המעריך בלבד או לפי הבסיס בלבד
  belief: >-
    מבין $2^{30}$, $3^{20}$ ו-$5^{12}$ הגדול הוא זה עם המעריך הגדול ביותר, או זה עם הבסיס הגדול ביותר.
  truth: >-
    גם הבסיס וגם המעריך משנים. משווים אחרי שמביאים למעריך משותף: $2^{30}=8^{10}$ ו-$3^{20}=9^{10}$, ולכן
    $3^{20}>2^{30}$; ו-$5^{12}=125^4$ מול $3^{20}=243^4$.
  remedy: { lesson: '0.3', label: 'השוואת חזקות: מעריך משותף' }

- id: MC-c0-log-linear
  title: מתייחסים ללוגריתם כאל פונקציה לינארית
  belief: >-
    $\ln(a+b)=\ln a+\ln b$, $\ln\frac ab=\frac{\ln a}{\ln b}$, או $\log_4 32=\frac{32}{4}$.
  truth: >-
    הלוגריתם הופך **מכפלה** לסכום: $\ln(ab)=\ln a+\ln b$ ו-$\ln\frac ab=\ln a-\ln b$. על סכום אין כלל כזה, ו-$\log_ab$ שואל
    "בכמה צריך להעלות את $a$ כדי לקבל $b$", לא "כמה פעמים $a$ נכנס ב-$b$".
  remedy: { lesson: '0.3', label: 'חוקי הלוגריתמים' }

- id: MC-c0-log-power-outside
  title: מבלבלים בין לוגריתם של חזקה לחזקה של לוגריתם
  belief: >-
    $(\ln a)^2=2\ln a$, או $e^{2\ln3}=2\cdot3$.
  truth: >-
    $\ln(a^2)=2\ln a$: המעריך יוצא מתוך הלוגריתם. אבל $(\ln a)^2$ הוא ריבוע של מספר, ואינו $2\ln a$ (ב-$a=e^3$: 9 מול 6).
    ו-$e^{2\ln3}=\left(e^{\ln3}\right)^2=9$.
  remedy: { lesson: '0.3', label: 'לוגריתם של חזקה' }

- id: MC-c0-change-base-inverted
  title: הופכים את נוסחת מעבר הבסיס
  belief: >-
    $\log_ab=\frac{\ln a}{\ln b}$.
  truth: >-
    $\log_ab=\frac{\ln b}{\ln a}$: הבסיס במכנה. בדיקה: $\log_28=\frac{\ln8}{\ln2}=3$, ואילו ההפוך נותן $\frac13$.
  remedy: { lesson: '0.3', label: 'מעבר בסיס' }

- id: MC-c0-inverse-order
  title: מבטלים פעולות בסדר הלא נכון
  belief: >-
    כדי לחלץ את $x$ מ-$y=5e^{3x}$ אפשר לקחת $\ln$ ולחלק ב-3, ורק אחר כך לטפל ב-5.
  truth: >-
    מבטלים את הפעולות בסדר הפוך לסדר שבו בוצעו: קודם מחלקים ב-5 ($e^{3x}=\frac y5$), אחר כך $\ln$ ($3x=\ln\frac y5$), ובסוף
    מחלקים ב-3. כך $x=\frac13\ln\frac y5$.
  remedy: { lesson: '0.3', label: 'פונקציה הפוכה: מבטלים מהסוף להתחלה' }

- id: MC-c0-domain-check-skip
  title: שוכחים את תחום ההגדרה של הלוגריתם
  belief: >-
    כל פתרון של המשוואה שמתקבלת אחרי שימוש בחוקי הלוגריתמים פותר גם את המקורית, ו-$\ln(x^2)=2\ln x$ לכל $x\ne0$.
  truth: >-
    $\ln u$ מוגדר רק כש-$u>0$. לכן בודקים כל פתרון במשוואה המקורית: ב-$\log_2x+\log_2(x-2)=3$ הערך $x=-2$ נפסל. והזהות
    הנכונה לכל $x\ne0$ היא $\ln(x^2)=2\ln|x|$.
  remedy: { lesson: '0.3', label: 'תחום ההגדרה של הלוגריתם' }

- id: MC-c0-substitution-back
  title: עוצרים אחרי ההצבה ולא חוזרים למשתנה המקורי
  belief: >-
    ב-$e^{2x}-3e^x+2=0$, אחרי ההצבה $t=e^x$, הפתרונות $t=1,2$ הם התשובה.
  truth: >-
    הפתרונות ב-$t$ הם רק שלב ביניים: חוזרים ל-$x$ דרך $e^x=t$, ומקבלים $x=0$ ו-$x=\ln2$. ואם $t$ יצא שלילי, אין לו $x$
    מתאים, כי $e^x>0$.
  remedy: { lesson: '0.3', label: 'משוואות מעריכיות בהצבה' }
