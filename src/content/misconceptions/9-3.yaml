# Misconceptions first detected in lesson 9.3 (arc length).
- id: MC-c9-length-projection
  title: מחשבים אורך של עקום במרחב לפי ההיטל שלו או לפי רכיב אחד
  belief: >-
    האורך של סליל הוא ההיקף של המעגל שמתחתיו, או רק העלייה שלו; אורך של גרף הוא $\int|f'|\,dx$.
  truth: >-
    האורך הוא $\int|\vec r\,'|\,dt$, וגודל המהירות משלב את כל הרכיבים: לסליל $(3\cos t,3\sin t,4t)$,
    $|\vec r\,'|=\sqrt{3^2+4^2}=5$. כל היטל אינו ארוך מהעקום עצמו, ושווה לו רק כשהרכיב שהושמט קבוע.
  remedy: { lesson: '9.3', anchor: space-length, label: 'אורך עקום: אינטגרל של גודל המהירות' }

- id: MC-c9-length-chord
  title: מחליפים את אורך העקום במרחק בין קצותיו
  belief: >-
    אורך העקום מ-$\vec r(a)$ ל-$\vec r(b)$ הוא $|\vec r(b)-\vec r(a)|$.
  truth: >-
    זה אורך המיתר, והוא שווה לאורך העקום רק כשהעקום הוא קטע. לכל עקום אחר $L>|\vec r(b)-\vec r(a)|$: הקו הישר הוא
    הקצר ביותר.
  remedy: { lesson: '9.3', anchor: chord-shorter, label: 'אורך עקום ואורך מיתר' }

- id: MC-c9-length-of-trace
  title: חושבים שהאינטגרל של גודל המהירות הוא תמיד אורך העקום, גם כשעוברים עליו פעמיים
  belief: >-
    כל פרמטריזציה של מעגל היחידה נותנת $\int|\vec r\,'|\,dt=2\pi$.
  truth: >-
    $\int_a^b|\vec r\,'|\,dt$ הוא **הדרך שהנקודה עברה**. הוא שווה לאורך העקום כשכל נקודה נעברת פעם אחת;
    $(\cos2t,\sin2t)$ על $[0,2\pi]$ מקיפה פעמיים ונותנת $4\pi$.
  remedy: { lesson: '9.3', anchor: when-independent, label: 'אי-תלות בפרמטריזציה: מתי' }

- id: MC-c9-length-parameter-interval
  title: חושבים שאורך העקום הוא אורך קטע הפרמטר, או שתלוי רק במהירות
  belief: >-
    האורך של $\vec r$ על $[a,b]$ הוא $b-a$, או שהוא גודל המהירות.
  truth: >-
    $L=\int_a^b|\vec r\,'(t)|\,dt$. רק בפרמטריזציה לפי אורך ($|\vec r\,'|=1$) הוא $b-a$; במהירות קבועה $|\vec r\,'|=c$ הוא
    $c\,(b-a)$.
  remedy: { lesson: '9.3', anchor: speed-times-time, label: 'אורך עקום: מהירות כפול זמן' }

- id: MC-c9-arclength-param-not-rescaled
  title: כותבים s במקום t בלי לבטא את t באמצעות s
  belief: >-
    הפרמטריזציה לפי אורך מתקבלת כשמחליפים את האות $t$ באות $s$.
  truth: >-
    מחשבים $s(t)=\int_{t_0}^t|\vec r\,'(\tau)|\,d\tau$, הופכים ל-$t=t(s)$, ומציבים: $\vec\rho(s)=\vec r(t(s))$.
    בדיקה: $|\vec\rho\,'(s)|=1$.
  remedy: { lesson: '9.3', anchor: arc-length-param, label: 'פרמטריזציה לפי אורך' }

- id: MC-c9-unit-speed-means-straight
  title: חושבים שמהירות בגודל אחד פירושה תאוצה אפס
  belief: >-
    בפרמטריזציה לפי אורך $\vec\rho\,''=\vec 0$, כי המהירות קבועה.
  truth: >-
    רק **הגודל** של $\vec\rho\,'$ קבוע; הכיוון שלו מסתובב לאורך העקום. $\vec\rho\,''=\vec 0$ רק בישר.
  remedy: { lesson: '9.3', anchor: unit-speed-turns, label: 'פרמטריזציה לפי אורך' }

- id: MC-c9-graph-length-no-root
  title: שוכחים את השורש בנוסחת האורך של גרף
  belief: >-
    אורך הגרף הוא $\int_a^b\left(1+f'(x)\right)dx$ או $\int_a^b\left(1+f'^2\right)dx$.
  truth: >-
    $L=\int_a^b\sqrt{1+f'(x)^2}\,dx$: האורך של וקטור המהירות $(1,f'(x))$ של הפרמטריזציה $(x,f(x))$.
  remedy: { lesson: '9.3', anchor: graph-length, label: 'אורך של גרף' }

- id: MC-c9-graph-length-f-not-fprime
  title: מציבים את הפונקציה במקום את הנגזרת בנוסחת האורך
  belief: >-
    אורך הגרף הוא $\int_a^b\sqrt{1+f(x)^2}\,dx$.
  truth: >-
    בנוסחה מופיעה $f'$: האורך תלוי בשיפוע, לא בגובה. הזזה של הגרף למעלה ($f+c$) אינה משנה את אורכו.
  remedy: { lesson: '9.3', anchor: graph-length, label: 'אורך של גרף' }

- id: MC-c9-polar-length-r-only
  title: מחשבים אורך של עקום קוטבי כאינטגרל של r
  belief: >-
    אורך העקום $r=f(\theta)$ הוא $\int r\,d\theta$.
  truth: >-
    $L=\int\sqrt{r^2+\left(\frac{dr}{d\theta}\right)^2}\,d\theta$, גודל המהירות של $(r\cos\theta,r\sin\theta)$.
    $\int r\,d\theta$ נכון רק כש-$r$ קבוע (קשת של מעגל).
  remedy: { lesson: '9.3', anchor: r-only, label: 'אורך של עקום בקואורדינטות קוטביות' }

- id: MC-c9-speed-abs-dropped
  title: משמיטים ערך מוחלט כשמוציאים שורש מגודל המהירות
  belief: >-
    $\sqrt{9\sin^2t\cos^2t}=3\sin t\cos t$, ולכן מותר לחשב את האינטגרל על כל הקטע בבת אחת.
  truth: >-
    $\sqrt{u^2}=|u|$. גודל מהירות אינו שלילי, ולכן מפצלים במקומות שבהם הביטוי מחליף סימן (או משתמשים בסימטריה). אורך
    0 לעקום שזז הוא סימן לטעות.
  remedy: { lesson: '9.3', anchor: abs-root, label: 'שורש של ריבוע: ערך מוחלט' }
