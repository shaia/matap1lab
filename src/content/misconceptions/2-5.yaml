# Misconceptions first detected in lesson 2.5 (surfaces in space and their sections).
- id: MC-c2-cone-vs-paraboloid
  title: מבלבלים בין חרוט לפרבולואיד
  belief: >-
    $z=x^2+y^2$ ו-$z^2=x^2+y^2$ הם אותו משטח, כי בשניהם החתכים האופקיים מעגלים שגדלים.
  truth: >-
    החתכים האופקיים לא מבדילים ביניהם; החתכים האנכיים כן. ב-$x=0$ הפרבולואיד נותן את הפרבולה $z=y^2$, והחרוט את זוג
    הישרים $z=\pm y$. ברדיוס: בגובה $z=c$ הפרבולואיד ברדיוס $\sqrt c$, והחרוט ברדיוס $|c|$.
  remedy: { lesson: '2.5', anchor: cone-vs-paraboloid, label: 'חתכים אנכיים: פרבולה או ישרים' }

- id: MC-c2-hyperboloid-sheets
  title: מחליפים בין היפרבולואיד חד-יריעתי לדו-יריעתי
  belief: >-
    $x^2+y^2-z^2=-1$ הוא היפרבולואיד חד-יריעתי, כמו $x^2+y^2-z^2=1$.
  truth: >-
    מציבים $z=c$: ב-$x^2+y^2-z^2=1$ מקבלים $x^2+y^2=1+c^2$, מעגל לכל $c$, ולכן המשטח הוא חתיכה אחת. ב-$x^2+y^2-z^2=-1$
    מקבלים $x^2+y^2=c^2-1$, שאין לו פתרון כש-$|c|<1$: שתי יריעות נפרדות, מעל $z=1$ ומתחת ל-$z=-1$. הבדיקה הקצרה:
    מציבים אפס במשתנה שהסימן של הריבוע שלו שונה משל שני האחרים (כאן $z$); אם נשאר חתך, יריעה אחת, ואם לא, שתיים.
  remedy: { lesson: '2.5', anchor: sheets, label: 'כמה יריעות להיפרבולואיד' }

- id: MC-c2-section-same-size
  title: חושבים שכל החתכים המקבילים של משטח שווים בגודלם
  belief: >-
    החתך של האליפסואיד $\frac{x^2}{4}+\frac{y^2}{9}+z^2=1$ במישור $z=\frac12$ הוא האליפסה $\frac{x^2}{4}+\frac{y^2}{9}=1$.
  truth: >-
    מציבים את $z$ במשוואה: $\frac{x^2}{4}+\frac{y^2}{9}=1-z^2=\frac34$. החתך אליפסה דומה, מוקטנת פי $\sqrt{\frac34}$:
    חצאי הצירים $\sqrt3$ ו-$\frac{3\sqrt3}{2}$. בגליל, למשל, כל החתכים האופקיים שווים.
  remedy: { lesson: '2.5', anchor: parallel-sections, label: 'חתכים במישורים מקבילים' }

- id: MC-c2-missing-variable-cylinder
  title: חושבים שמשוואה שחסר בה משתנה מתארת גם במרחב עקום
  belief: >-
    במרחב, $x^2+y^2=1$ הוא מעגל היחידה שבמישור $xy$, כמו במישור.
  truth: >-
    משתנה שאינו מופיע במשוואה הוא משתנה **חופשי**, לא משתנה ששווה אפס. אם $(x,y)$ מקיימת $x^2+y^2=1$, אז $(x,y,z)$ על
    המשטח לכל $z$: מעל כל נקודה של המעגל עומד ישר אנכי שלם, ויחד הם גליל. המעגל שבמישור $xy$ דורש **שתי** משוואות:
    $x^2+y^2=1$ וגם $z=0$. במרחב משוואה אחת מתארת משטח, ושתיים עקום.
  remedy: { lesson: '2.5', anchor: missing-variable, label: 'משתנה חסר: גליל מעל עקום' }

- id: MC-c2-projection-is-curve
  title: חושבים שהמשוואה שמתקבלת מהצבת מישור נטוי היא עקום החיתוך עצמו
  belief: >-
    המישור $z=2x$ חותך את הפרבולואיד $z=x^2+y^2$ במעגל $(x-1)^2+y^2=1$, שרדיוסו 1.
  truth: >-
    אחרי ההצבה נשארת משוואה ב-$x$ ו-$y$ בלבד, והיא מתארת את **ההיטל** של עקום החיתוך על מישור $xy$. העקום עצמו נמצא
    במישור הנטוי, ושם המרחקים בכיוון השיפוע ארוכים יותר: כאן הוא אליפסה שחצאי הצירים שלה $\sqrt5$ ו-1, בין הנקודות
    $(0,0,0)$ ו-$(2,0,4)$. רק במישור $z=c$ החתך וההיטל שלו הם אותה צורה.
  remedy: { lesson: '2.5', anchor: general-plane, label: 'חיתוך עם מישור נטוי: ההיטל והעקום' }

- id: MC-c2-tilted-plane-always-parabola
  title: חושבים שכל מישור נטוי חותך את החרוט בפרבולה
  belief: >-
    כל מישור נטוי שאינו עובר בקודקוד חותך את החרוט $z^2=x^2+y^2$ בפרבולה, כמו המישור $z=x+2$.
  truth: >-
    הסוג נקבע מהשיפוע של המישור לעומת השיפוע של הישרים של החרוט, שהוא 1. במישור $z=px+k$ ההצבה נותנת
    $(1-p^2)x^2-2pkx+y^2=k^2$: $x^2$ מצטמצם רק כש-$|p|=1$, ואז מתקבלת פרבולה. כש-$|p|<1$ שני הריבועים באותו סימן
    (אליפסה), וכש-$|p|>1$ בסימנים שונים (היפרבולה).
  remedy: { lesson: '2.5', anchor: conic-sections, label: 'חתכי החרוט לפי השיפוע של המישור' }
