# Misconceptions first detected in lesson 2.5 (surfaces in space and their sections).
- id: MC-c2-cone-vs-paraboloid
  title: מבלבלים בין חרוט לפרבולואיד
  belief: >-
    $z=x^2+y^2$ ו-$z^2=x^2+y^2$ הם אותו משטח, כי בשניהם החתכים האופקיים מעגלים שגדלים.
  truth: >-
    החתכים האופקיים לא מבדילים ביניהם; החתכים האנכיים כן. ב-$x=0$ הפרבולואיד נותן את הפרבולה $z=y^2$, והחרוט את זוג
    הישרים $z=\pm y$. ברדיוס: בגובה $z=c$ הפרבולואיד ברדיוס $\sqrt c$, והחרוט ברדיוס $|c|$.
  remedy: { lesson: '2.5', label: 'חתכים אנכיים: פרבולה או ישרים' }

- id: MC-c2-hyperboloid-sheets
  title: מחליפים בין היפרבולואיד חד-יריעתי לדו-יריעתי
  belief: >-
    $x^2+y^2-z^2=-1$ הוא היפרבולואיד חד-יריעתי, כמו $x^2+y^2-z^2=1$.
  truth: >-
    מציבים $z=c$: ב-$x^2+y^2-z^2=1$ מקבלים $x^2+y^2=1+c^2$, מעגל לכל $c$, ולכן יריעה אחת רציפה. ב-$x^2+y^2-z^2=-1$
    מקבלים $x^2+y^2=c^2-1$, שאין לו פתרון כש-$|c|<1$: שתי יריעות נפרדות, מעל $z=1$ ומתחת ל-$z=-1$.
  remedy: { lesson: '2.5', label: 'כמה יריעות להיפרבולואיד' }

- id: MC-c2-section-same-size
  title: חושבים שכל החתכים המקבילים של משטח שווים בגודלם
  belief: >-
    החתך של האליפסואיד $\frac{x^2}{4}+\frac{y^2}{9}+z^2=1$ במישור $z=\frac12$ הוא האליפסה $\frac{x^2}{4}+\frac{y^2}{9}=1$.
  truth: >-
    מציבים את $z$ במשוואה: $\frac{x^2}{4}+\frac{y^2}{9}=1-z^2=\frac34$. החתך אליפסה דומה, מוקטנת פי $\sqrt{\frac34}$:
    חצאי הצירים $\sqrt3$ ו-$\frac{3\sqrt3}{2}$. בגליל, למשל, כל החתכים האופקיים שווים.
  remedy: { lesson: '2.5', label: 'חתכים במישורים מקבילים' }
