# Misconceptions first detected in lesson 2.1 (circle and ellipse: equation and parametrisation).
- id: MC-c2-sqrt-half-curve
  title: חושבים שפתרון עבור y עם שורש נותן את כל העקום
  belief: >-
    $x^2+y^2=1$ ו-$y=\sqrt{1-x^2}$ הן אותו עקום: פשוט "פתרנו עבור $y$".
  truth: >-
    שורש אינו שלילי, ולכן $y=\sqrt{1-x^2}$ הוא רק חצי המעגל העליון; החצי התחתון הוא $y=-\sqrt{1-x^2}$. באותו אופן
    $x=\sqrt{1+y^2}$ הוא רק הענף הימני של $x^2-y^2=1$. בכל הוצאת שורש בוחרים סימן, והבחירה קובעת איזה חלק של העקום
    מתקבל.
  remedy: { lesson: '2.1', anchor: half-curve, label: 'משוואה קרטזית מול חצי עקום' }

- id: MC-c2-square-not-root
  title: שוכחים להוציא שורש מהמספר שבריבוע
  belief: >-
    במעגל $(x-h)^2+(y-k)^2=9$ הרדיוס 9, ובאליפסה $\frac{x^2}{16}+\frac{y^2}{9}=1$ חצאי הצירים 16 ו-9.
  truth: >-
    המספרים במשוואה הם **ריבועים**: $R^2=9$ ולכן $R=3$; $a^2=16$, $b^2=9$ ולכן חצאי הצירים 4 ו-3. בדיקה מהירה:
    הציבו $y=0$ וראו היכן העקום חותך את ציר $x$.
  remedy: { lesson: '2.1', anchor: read-axes, label: 'רדיוס וחצאי צירים מתוך המשוואה' }

- id: MC-c2-param-vs-curve
  title: מבלבלים בין עקום לבין הפרמטריזציה שלו
  belief: >-
    לכל עקום יש פרמטריזציה אחת, ולכן $(\sin t,\cos t)$ אינו מעגל היחידה; או להפך: כל זוג נוסחאות שנותן את הנקודות
    הנכונות מתאים, גם אם נקודת ההתחלה וכיוון התנועה שגויים.
  truth: >-
    העקום הוא **קבוצת נקודות**; לפרמטריזציה יש גם נקודת התחלה, כיוון ומהירות. ל-$x^2+y^2=1$ יש אינסוף פרמטריזציות:
    $(\cos t,\sin t)$ נגד כיוון השעון מ-$(1,0)$, $(\sin t,\cos t)$ עם כיוון השעון מ-$(0,1)$, ועוד. כשהשאלה קובעת התחלה
    וכיוון, רק חלק מהן מתאימות.
  remedy: { lesson: '2.1', anchor: curve-vs-param, label: 'עקום ופרמטריזציה' }

- id: MC-c2-angle-range
  title: מתעלמים מהקטע שבו הזווית או הפרמטר צריכים להיות
  belief: >-
    כל ערך של זווית שמגיע לנקודה הנכונה הוא תשובה נכונה, גם אם הוא מחוץ לקטע שנתון בשאלה.
  truth: >-
    זווית נקבעת עד כדי כפולה של $2\pi$, ולכן שאלה קובעת קטע: $[0,2\pi)$ או $(-\pi,\pi]$. $-\frac{\pi}{2}$
    ו-$\frac{3\pi}{2}$ מגיעים לאותה נקודה, אבל רק אחד מהם בקטע $[0,2\pi)$. מוסיפים או מחסירים $2\pi$ עד שנכנסים לקטע.
  remedy: { lesson: '2.1', anchor: param-range, label: 'הפרמטר בקטע הנתון' }

- id: MC-c2-shift-sign
  title: טועים בסימן של ההזזה
  belief: >-
    $(x-3)^2+(y+1)^2=4$ הוא מעגל שמרכזו $(-3,1)$, ולהזזת מעגל ב-$(3,-1)$ מציבים $x+3$ ו-$y-1$.
  truth: >-
    המרכז הוא הנקודה שבה הביטויים בסוגריים מתאפסים: $x-3=0$ ו-$y+1=0$, כלומר $(3,-1)$. כדי להזיז עקום ב-$(h,k)$
    מציבים $x-h$ במקום $x$ ו-$y-k$ במקום $y$: הנקודה החדשה $(x,y)$ על העקום אם $(x-h,y-k)$ הייתה עליו.
  remedy: { lesson: '2.1', anchor: shift, label: 'הזזה של עקום' }

- id: MC-c2-ellipse-axes-swap
  title: מחליפים בין חצאי הצירים של אליפסה
  belief: >-
    המקדם הגדול שליד $x^2$ אומר שהאליפסה ארוכה בכיוון $x$, או שחצי הציר בכיוון $x$ קשור למכנה של $y^2$.
  truth: >-
    בצורה $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$ האליפסה חותכת את ציר $x$ ב-$\pm a$ ואת ציר $y$ ב-$\pm b$. מקדם גדול
    ליד $x^2$ (בלי מכנה) פירושו $a$ **קטן**: $4x^2+9y^2=36$ נותן $a=3$, $b=2$.
  remedy: { lesson: '2.1', anchor: read-axes, label: 'קריאת חצאי הצירים' }

- id: MC-c2-ellipse-rhs-not-one
  title: קוראים חצאי צירים לפני שאגף ימין הוא 1
  belief: >-
    ב-$4x^2+9y^2=36$ אפשר לכתוב $4x^2=\frac{x^2}{1/4}$ ולקרוא מייד חצי ציר $\frac12$.
  truth: >-
    הקריאה של $a^2$ מהמכנה נכונה רק בצורה $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$. קודם מחלקים ב-36:
    $\frac{x^2}{9}+\frac{y^2}{4}=1$, ורק אז $a=3$, $b=2$.
  remedy: { lesson: '2.1', anchor: rhs-one, label: 'הצורה הסטנדרטית של אליפסה' }

- id: MC-c2-param-angle-polar
  title: חושבים שהפרמטר של אליפסה הוא הזווית של הנקודה
  belief: >-
    בפרמטריזציה $(a\cos t,b\sin t)$ הפרמטר $t$ הוא הזווית בין הקטע מהראשית לנקודה לבין ציר $x$.
  truth: >-
    זה נכון רק במעגל ($a=b$). באליפסה השיפוע של הקטע הוא $\frac{b}{a}\tan t$, והזווית היא $\arctan\left(\frac{b}{a}\tan t\right)$
    ברביע הנכון, ולא $t$. למשל ב-$(\cos t,2\sin t)$ עם $t=\frac{\pi}{4}$ הזווית היא $\arctan2$.
  remedy: { lesson: '2.1', anchor: param-not-angle, label: 'הפרמטר של האליפסה אינו הזווית של הנקודה' }

- id: MC-c2-stretch-direction
  title: מציבים את הפעולה עצמה במקום את הפעולה ההפוכה
  belief: >-
    כדי למתוח עקום פי 2 בכיוון $x$ מציבים $2x$ במקום $x$.
  truth: >-
    נקודה $(x,y)$ על העקום החדש אם הנקודה **שממנה הגיעה**, $(u,v)=\left(\frac{x}{2},y\right)$, על העקום הישן. לכן מציבים
    $\frac{x}{2}$: מעגל היחידה נמתח ל-$\frac{x^2}{4}+y^2=1$. הצבת $2x$ מכווצת. (באותו אופן הזזה ב-$h$ מציבה $x-h$.)
  remedy: { lesson: '2.1', anchor: stretch, label: 'מתיחה של עקום' }
