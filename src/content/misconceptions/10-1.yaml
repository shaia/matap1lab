# Misconceptions first detected in lesson 10.1 (graphs, level curves, sections; domain; limits in two variables).
- id: MC-c10-level-vs-section
  title: מבלבלים קו גובה עם חתך אנכי של הגרף
  belief: >-
    קו הגובה $f=c$ הוא העקום שמתקבל כשחותכים את הגרף במישור אנכי, כמו $y=0$, ומשרטטים אותו במישור $xz$.
  truth: >-
    קו גובה הוא קבוצת הנקודות $(x,y)$ במישור $xy$ שבהן $f(x,y)=c$: חותכים את הגרף במישור **אופקי** $z=c$ ומטילים
    את החיתוך על מישור $xy$. חתך במישור אנכי ($y=0$ או $x=0$) הוא עקום אחר, שמראה איך הגובה משתנה לאורך קו ישר.
  remedy: { lesson: '10.1', label: 'קו גובה: חיתוך עם מישור אופקי' }

- id: MC-c10-contour-spacing
  title: חושבים שהמרווחים בין קווי הגובה אינם אומרים דבר על צורת הגרף
  belief: >-
    אם קווי הגובה הם מעגלים סביב הראשית, הגרף הוא פרבולואיד, בלי קשר למרווחים בין המעגלים.
  truth: >-
    כשקווי הגובה משורטטים בהפרשי גובה שווים, המרווח ביניהם מראה את התלילות. ל-$f=x^2+y^2$ הרדיוס של קו הגובה $c$ הוא
    $\sqrt c$, והמעגלים מתקרבים זה לזה כלפי חוץ (הפרבולואיד מתלול); ל-$f=\sqrt{x^2+y^2}$ הרדיוס הוא $c$, והמרווחים שווים
    (חרוט, שיפוע קבוע).
  remedy: { lesson: '10.1', label: 'לקרוא תלילות מהמרווחים בין קווי הגובה' }

- id: MC-c10-contour-density-height
  title: חושבים שקווי גובה צפופים מסמנים מקום גבוה
  belief: >-
    במפה טופוגרפית, איפה שקווי הגובה צפופים ההר גבוה יותר.
  truth: >-
    קווים צפופים מסמנים מקום **תלול**: אותו הפרש גובה בין שני קווים שכנים מתפרס על מרחק אופקי קטן. הגובה עצמו נקרא
    מהמספרים שעל הקווים.
  remedy: { lesson: '10.1', label: 'צפיפות קווי הגובה היא תלילות' }

- id: MC-c10-domain-boundary
  title: מכלילים בתחום ההגדרה את השפה שבה הביטוי אינו מוגדר
  belief: >-
    התחום של $\ln(y-x^2)$ הוא $y\ge x^2$, כמו בתנאי של שורש.
  truth: >-
    הלוגריתם מוגדר רק לארגומנט חיובי, ולכן התחום הוא $y>x^2$ בלבד, בלי הפרבולה עצמה. שורש מוגדר גם ב-0 (תנאי $\ge$),
    לוגריתם ומכנה לא (תנאי $>$ או $\ne$).
  remedy: { lesson: '10.1', label: 'תחום הגדרה: תנאי חזק או חלש לפי הפונקציה' }

- id: MC-c10-domain-forget-denominator
  title: שוכחים את התנאי שהמכנה אינו מתאפס
  belief: >-
    בתחום של $\frac{\sqrt{4-x^2-y^2}}{y-x}$ מספיק לדרוש שהביטוי בתוך השורש לא יהיה שלילי.
  truth: >-
    כל גורם בנוסחה מוסיף תנאי, ותחום ההגדרה הוא החיתוך של כל התנאים: כאן העיגול $x^2+y^2\le4$ **בלי** הישר $y=x$.
  remedy: { lesson: '10.1', label: 'תחום הגדרה: החיתוך של כל התנאים' }

- id: MC-c10-domain-one-condition
  title: מקיימים רק אחד מכמה תנאים של תחום ההגדרה
  belief: >-
    בתחום של $\sqrt{9-x^2-y^2}+\sqrt{x^2+y^2-4}$ מספיק התנאי של השורש הראשון, $x^2+y^2\le9$.
  truth: >-
    כל שורש דורש ביטוי לא שלילי, והתחום הוא החיתוך: $4\le x^2+y^2\le9$, טבעת ולא עיגול מלא.
  remedy: { lesson: '10.1', label: 'תחום הגדרה: החיתוך של כל התנאים' }

- id: MC-c10-lines-enough
  title: חושבים שאם הגבול לאורך כל הישרים זהה, הגבול קיים
  belief: >-
    אם $f$ שואפת לאותו מספר לאורך כל ישר $y=mx$ ולאורך הצירים, אז הגבול בנקודה קיים.
  truth: >-
    הגבול בשני משתנים דורש התקרבות **מכל הכיוונים ובכל המסלולים**. ל-$\frac{x^2y}{x^4+y^2}$ הגבול לאורך כל ישר הוא 0,
    אבל לאורך הפרבולה $y=x^2$ הערך הוא $\frac12$, והגבול לא קיים. שני מסלולים עם גבולות שונים שוללים גבול; כדי להוכיח
    שהגבול קיים צריך חסם שתלוי רק במרחק מהנקודה.
  remedy: { lesson: '10.1', label: 'גבול בשני משתנים: כל המסלולים' }

- id: MC-c10-zero-denominator
  title: חושבים שבנקודה שבה המכנה מתאפס אין גבול
  belief: >-
    ל-$\frac{xy}{\sqrt{x^2+y^2}}$ אין גבול בראשית כי המכנה מתאפס שם.
  truth: >-
    מכנה שמתאפס אומר רק שהפונקציה לא מוגדרת בנקודה. הגבול יכול להתקיים: $\frac{|xy|}{\sqrt{x^2+y^2}}\le\frac{\sqrt{x^2+y^2}}{2}\to0$,
    כי $|xy|\le\frac{x^2+y^2}{2}$.
  remedy: { lesson: '10.1', label: 'גבול בנקודה שבה הפונקציה אינה מוגדרת' }
