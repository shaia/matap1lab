# Misconceptions first detected in lesson 1.1 (vectors: arrow and coordinates).
- id: MC-c1-ab-order
  title: מחסרים בסדר הפוך כשמוצאים את הווקטור מ-A ל-B
  belief: >-
    הווקטור מ-$A$ ל-$B$ הוא $A-B$, או שבמקבילית $ABCD$ האלכסון מ-$B$ ל-$D$ הוא $\vec u-\vec v$ כש-$\vec u=\vec{AB}$,
    $\vec v=\vec{AD}$.
  truth: >-
    $\vec{AB}=B-A$: "סוף פחות התחלה", כי $A+\vec{AB}=B$. הסדר קובע את הכיוון: $\vec{BA}=-\vec{AB}$. במקבילית
    $\vec{BD}=\vec{AD}-\vec{AB}=\vec v-\vec u$.
  remedy: { lesson: '1.1', anchor: point-to-point, label: 'הווקטור מנקודה לנקודה: סוף פחות התחלה' }

- id: MC-c1-ab-sum
  title: מחברים את שתי הנקודות כדי לקבל את הווקטור ביניהן
  belief: >-
    הווקטור מ-$A$ ל-$B$ הוא $A+B$.
  truth: >-
    $A+B$ אינו קשור למיקום היחסי של הנקודות (והוא אפילו משתנה כשמזיזים את הראשית). ההעתק מ-$A$ ל-$B$ הוא ההפרש $B-A$.
  remedy: { lesson: '1.1', anchor: point-to-point, label: 'הווקטור מנקודה לנקודה: סוף פחות התחלה' }

- id: MC-c1-length-sum
  title: מחשבים אורך של וקטור כסכום הרכיבים
  belief: >-
    האורך של $(3,2,-4)$ הוא $3+2+4=9$, ווקטור שסכום רכיביו 1 הוא וקטור יחידה.
  truth: >-
    האורך הוא $|\vec v|=\sqrt{v_1^2+v_2^2+v_3^2}$, פיתגורס פעמיים. $(\tfrac13,\tfrac13,\tfrac13)$ אורכו $\frac{1}{\sqrt3}$,
    לא 1. סכום הערכים המוחלטים גדול מהאורך כשיותר מרכיב אחד שונה מ-0.
  remedy: { lesson: '1.1', anchor: length, label: 'אורך של וקטור מפיתגורס' }

- id: MC-c1-length-no-root
  title: שוכחים את השורש באורך של וקטור
  belief: >-
    $|\vec v|=v_1^2+v_2^2+v_3^2$, ולכן וקטור היחידה הוא $\frac{\vec v}{v_1^2+v_2^2+v_3^2}$.
  truth: >-
    $|\vec v|^2=v_1^2+v_2^2+v_3^2$, ו-$|\vec v|$ הוא השורש. בדיקה ביחידות: אם הרכיבים במטרים, הסכום במטר רבוע.
  remedy: { lesson: '1.1', anchor: length, label: 'אורך ווקטור יחידה' }

- id: MC-c1-diagonal-sum
  title: חושבים ששני האלכסונים של מקבילית הם סכום הצלעות
  belief: >-
    במקבילית שצלעותיה $\vec u$ ו-$\vec v$ שני האלכסונים הם $\vec u+\vec v$.
  truth: >-
    האלכסון מהקודקוד המשותף הוא $\vec u+\vec v$ (כלל המקבילית); האלכסון השני מחבר את קצות הצלעות, והוא ההפרש $\vec v-\vec u$
    (או $\vec u-\vec v$, לפי הכיוון).
  remedy: { lesson: '1.1', anchor: parallelogram-diagonals, label: 'כלל המקבילית: סכום והפרש' }

- id: MC-c1-negative-scalar
  title: חושבים שכפל בסקלר שלילי משמר כיוון או נותן אורך שלילי
  belief: >-
    $-2\vec v$ הוא באותו כיוון כמו $\vec v$, או שאורכו $-2|\vec v|$.
  truth: >-
    $|\lambda\vec v|=|\lambda|\,|\vec v|$: אורך תמיד אי-שלילי. סקלר שלילי הופך את הכיוון: $-2\vec v$ ארוך פי 2 ומצביע
    בכיוון ההפוך.
  remedy: { lesson: '1.1', anchor: scalar-multiple, label: 'כפל בסקלר: מתיחה והיפוך' }

- id: MC-c1-section-ratio
  title: מחליפים את היחס כשמחלקים קטע
  belief: >-
    הנקודה שמחלקת את $AB$ ביחס $1:2$ (מ-$A$) היא $A+\frac23\vec{AB}$.
  truth: >-
    ביחס $1:2$ הקטע מתחלק לשלושה חלקים שווים, והנקודה במרחק חלק אחד מ-$A$: $P=A+\frac13\vec{AB}$. הנקודה
    $A+\frac23\vec{AB}$ מחלקת ביחס $2:1$.
  remedy: { lesson: '1.1', anchor: segment, label: 'נקודה על קטע: $A+t\vec{AB}$' }

- id: MC-c1-position-vs-displacement
  title: משתמשים בווקטור המקום במקום בווקטור ההעתק
  belief: >-
    העבודה לאורך תזוזה מ-$P_0$ ל-$P_1$ היא $\vec F\cdot P_1$, ונקודות על ישר אחד אם ווקטורי המקום שלהן מקבילים.
  truth: >-
    כל מה שנוגע לתנועה או למיקום יחסי משתמש בהפרשים: ההעתק $P_1-P_0$, הווקטורים $\vec{AB}$ ו-$\vec{AC}$. וקטור המקום תלוי
    בבחירת הראשית; ההעתק לא.
  remedy: { lesson: '1.1', anchor: position-vs-displacement, label: 'וקטור מקום מול וקטור העתק' }

- id: MC-c1-length-additive
  title: חושבים שאורך הסכום הוא סכום האורכים
  belief: >-
    $|\vec u+\vec v|=|\vec u|+|\vec v|$, ולכן הכוח השקול של שני כוחות גודלו סכום הגדלים.
  truth: >-
    זה נכון רק כשהווקטורים באותו כיוון. בכלל $|\vec u+\vec v|\le|\vec u|+|\vec v|$ (אי-שוויון המשולש): לשקול של
    $(3,4,0)$ ו-$(1,-2,2)$ אורך $\sqrt{24}\approx4.9$, ולא $5+3=8$.
  remedy: { lesson: '1.1', anchor: triangle-inequality, label: 'חיבור וקטורים ואי-שוויון המשולש' }
