# Misconceptions first detected in lesson 12.2 (regions that are not rectangles, changing the order).
- id: MC-c12-region-wrong-side
  title: הגבולות מתארים תחום אחר מהתחום הנתון
  belief: >-
    מספיק לכתוב את העקומים שמופיעים בשרטוט כגבולות, בלי לבדוק מי למעלה ומי למטה, באיזה צד של העקום התחום נמצא, או אם
    השפה מורכבת מכמה עקומים.
  truth: >-
    לכל $x$ קבוע בודקים על הרצועה האנכית: מאיפה היא נכנסת לתחום (הגבול התחתון) ואיפה יוצאת (העליון). גבולות הפוכים
    נותנים את הסימן ההפוך, וצד לא נכון נותן תחום אחר. כשהשפה העליונה מתחלפת באמצע, מפצלים לשני אינטגרלים או עוברים
    לסדר השני.
  remedy: { lesson: '12.2', label: 'מתארים תחום בעזרת רצועות' }

- id: MC-c12-bounding-rectangle
  title: כותבים גבולות קבועים לתחום שאינו מלבן
  belief: >-
    לתחום מתחת ל-$y=x^2$, כש-$0\le x\le2$, כותבים $\int_0^2\!\int_0^4f\,dy\,dx$, כי $y$ נע בין 0 ל-4.
  truth: >-
    גבולות קבועים בשני האינטגרלים מתארים את המלבן $[0,2]\times[0,4]$ כולו. בתחום כללי הגבולות של האינטגרל הפנימי
    תלויים במשתנה החיצוני: $\int_0^2\!\int_0^{x^2}f\,dy\,dx$.
  remedy: { lesson: '12.2', label: 'גבולות פנימיים שתלויים במשתנה' }

- id: MC-c12-swap-keep-limits
  title: מחליפים סדר אינטגרציה בהחלפת הדיפרנציאלים בלבד
  belief: >-
    כדי להחליף סדר מספיק לכתוב $dx\,dy$ במקום $dy\,dx$ (או להחליף את מקום שני האינטגרלים) ולהשאיר את הגבולות.
  truth: >-
    החלפת סדר היא תיאור חדש של אותו תחום. משרטטים את התחום מהגבולות הישנים, ואז קוראים אותו ברצועות בכיוון השני:
    הגבולות החיצוניים מספרים, והפנימיים פונקציות של המשתנה החיצוני החדש.
  remedy: { lesson: '12.2', label: 'החלפת סדר: משרטטים את התחום' }

- id: MC-c12-outer-limit-variable
  title: הגבולות של האינטגרל החיצוני תלויים במשתנה
  belief: >-
    אפשר לכתוב $\int_0^{x^2}\!\int_0^2f\,dx\,dy$, ואת הגבולות של האינטגרל החיצוני להשאיר כפונקציה של משתנה פנימי.
  truth: >-
    האינטגרל החיצוני צריך לצאת מספר, ולכן הגבולות שלו קבועים. רק גבולות פנימיים יכולים לתלות במשתנים שמחוץ להם
    (באינטגרל משולש: הפנימי ב-$x,y$, האמצעי ב-$x$, החיצוני באף אחד).
  remedy: { lesson: '12.2', label: 'הגבולות החיצוניים הם מספרים' }

- id: MC-c12-stuck-means-impossible
  title: חושבים שאינטגרל כפול שהפנימי שלו אינו אלמנטרי אי-אפשר לחשב
  belief: >-
    ל-$e^{y^2}$ אין פונקציה קדומה אלמנטרית, ולכן את $\int_0^1\!\int_x^1e^{y^2}\,dy\,dx$ אפשר רק לקרב נומרית.
  truth: >-
    הקושי שייך לסדר, לא לאינטגרל. אחרי החלפת הסדר האינטגרל הפנימי לפי $x$ נותן גורם $y$, ו-$ye^{y^2}$ כן ניתן לחישוב:
    התוצאה $\frac{e-1}{2}$.
  remedy: { lesson: '12.2', label: 'כשרק סדר אחד מאפשר לחשב' }
