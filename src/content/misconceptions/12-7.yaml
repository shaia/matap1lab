# Misconceptions first detected in lesson 12.7 (area, volume, centre of mass, moment of inertia).
- id: MC-c12-centroid-no-divide
  title: שוכחים לחלק במסה או בשטח בחישוב מרכז מסה
  belief: >-
    $\bar x=\iint_D x\,\rho\,dA$.
  truth: >-
    $\bar x=\frac{1}{M}\iint_Dx\,\rho\,dA$ עם $M=\iint_D\rho\,dA$: ממוצע משוקלל של $x$. בלי החלוקה מתקבל המומנט, ולא
    מיקום. בדיקה מהירה: $\bar x$ חייב ליפול בין הערך הקטן לגדול של $x$ בגוף.
  remedy: { lesson: '12.7', label: 'מרכז מסה: מחלקים במסה' }

- id: MC-c12-centroid-anywhere
  title: חושבים שמרכז מסה יכול לצאת בכל מקום
  belief: >-
    מרכז המסה יכול להיות מחוץ לגוף, ולכן גם ערך של $\bar x$ מחוץ לטווח ה-$x$ של הגוף הוא תוצאה סבירה.
  truth: >-
    מרכז מסה יכול להיות מחוץ לגוף עצמו (למשל במרכז של טבעת), אבל $\bar x$ הוא ממוצע משוקלל של ערכי $x$ בגוף עם משקלים
    חיוביים, ולכן תמיד $\min x\le\bar x\le\max x$. תוצאה מחוץ לטווח הזה היא טעות.
  remedy: { lesson: '12.7', label: 'בדיקת סבירות למרכז מסה' }

- id: MC-c12-density-ignored
  title: מתעלמים מהצפיפות במרכז מסה
  belief: >-
    מרכז המסה תלוי רק בצורה של הגוף: אם הצורה סימטרית ביחס לציר $y$, אז $\bar x=0$.
  truth: >-
    לצפיפות שאינה אחידה מרכז המסה זז לכיוון החלק הכבד. סימטריה נותנת $\bar x=0$ רק כשגם הצורה וגם הצפיפות סימטריות.
  remedy: { lesson: '12.7', label: 'מרכז מסה עם צפיפות' }

- id: MC-c12-inertia-not-squared
  title: מחשבים מומנט התמד עם המרחק ולא עם ריבוע המרחק
  belief: >-
    $I=\iint_D d\,\rho\,dA$, כש-$d$ המרחק מהציר.
  truth: >-
    $I=\iint_D d^2\rho\,dA$: כל אלמנט מסה תורם מסה כפול **ריבוע** המרחק מהציר. האינטגרל עם $d$ בחזקה ראשונה הוא מומנט
    ראשון, שקשור למרכז המסה.
  remedy: { lesson: '12.7', label: 'מומנט התמד: ריבוע המרחק' }

- id: MC-c12-inertia-wrong-axis
  title: מודדים את המרחק לציר הלא נכון
  belief: >-
    מומנט ההתמד סביב ציר $x$ הוא $\iint x^2\rho\,dA$, או שסביב ציר $z$ משתמשים במרחק לראשית $x^2+y^2+z^2$.
  truth: >-
    המרחק של $(x,y)$ מציר $x$ הוא $|y|$, ולכן $I_x=\iint y^2\rho\,dA$; המרחק של $(x,y,z)$ מציר $z$ הוא
    $\sqrt{x^2+y^2}$, ולכן $I_z=\iiint(x^2+y^2)\rho\,dV$.
  remedy: { lesson: '12.7', label: 'מרחק מציר הסיבוב' }
