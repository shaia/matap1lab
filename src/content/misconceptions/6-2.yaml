# Misconceptions first detected in lesson 6.2 (Taylor's formula with the Lagrange remainder).
- id: MC-c6-remainder-at-center
  title: מחשבים את השארית בנקודת הפיתוח ולא בנקודה לא ידועה בדרך
  belief: >-
    השארית של $T_n$ היא האיבר הבא, $\frac{f^{(n+1)}(x_0)}{(n+1)!}(x-x_0)^{n+1}$, עם הנגזרת בנקודת הפיתוח $x_0$.
  truth: >-
    $R_n(x)=\frac{f^{(n+1)}(c)}{(n+1)!}(x-x_0)^{n+1}$ עם $c$ כלשהו בין $x_0$ ל-$x$. ה-$c$ הלא ידוע סופג את כל האיברים
    שאחרי האיבר הבא, ולכן חוסמים את $|f^{(n+1)}(c)|$ במקסימום שלה על כל הקטע.
  remedy: { lesson: '6.2', label: 'שארית לגרנז׳: הנגזרת בנקודה c' }

- id: MC-c6-remainder-order
  title: מתבלבלים בסדר של השארית ומשתמשים בעצרת או בחזקה של הפולינום עצמו
  belief: >-
    השארית של $T_n$ היא מסדר $n$: $\frac{f^{(n)}(c)}{n!}(x-x_0)^n$, ולכן גם החסם הוא $\frac{M}{n!}d^n$.
  truth: >-
    $T_n$ כבר משתמש בנגזרות עד הסדר $n$; השארית מתחילה בנגזרת ה-$(n+1)$: $R_n=\frac{f^{(n+1)}(c)}{(n+1)!}(x-x_0)^{n+1}$.
    וכשהמקדם הבא אפס (כמו $x^4$ בסינוס), $T_n=T_{n+1}$ ומותר להשתמש ב-$R_{n+1}$.
  remedy: { lesson: '6.2', label: 'נוסחת טיילור עם שארית: איזה סדר מופיע בשארית' }

- id: MC-c6-c-fixed
  title: חושבים שהנקודה c בשארית קבועה או ידועה
  belief: >-
    הנקודה $c$ בשארית לגרנז׳ היא אותה נקודה לכל $x$, או שהיא אמצע הקטע בין $x_0$ ל-$x$.
  truth: >-
    המשפט מבטיח רק ש-$c$ קיימת בין $x_0$ ל-$x$; היא תלויה ב-$x$ וב-$n$, ואין לה נוסחה. לכן השארית משמשת לחסם ולקביעת
    סימן, לא לחישוב מדויק.
  remedy: { lesson: '6.2', label: 'מה המשפט אומר על c' }

- id: MC-c6-max-wrong-end
  title: חוסמים את הנגזרת בקצה הלא נכון של הקטע
  belief: >-
    כדי לחסום את $|f^{(n+1)}(c)|$ מציבים את הקצה הרחוק $c=x$, או את הקצה שבו הנגזרת קטנה.
  truth: >-
    חסם צריך לכסות את המקרה הגרוע: לוקחים את המקסימום של $|f^{(n+1)}|$ על כל הקטע. לפונקציה יורדת כמו
    $\frac{2}{(1+c)^3}$ הוא בקצה השמאלי, ולעולה כמו $e^c$ בקצה הימני.
  remedy: { lesson: '6.2', label: 'חסם על השגיאה בקטע' }

- id: MC-c6-remainder-sign-unknown
  title: חושבים שאי אפשר לדעת את סימן השגיאה כי c לא ידועה
  belief: >-
    כיוון ש-$c$ לא ידועה, השארית יודעת רק גודל משוער ולא סימן, ולכן אי אפשר להסיק ממנה אי-שוויון.
  truth: >-
    לפעמים הסימן של $f^{(n+1)}$ ידוע בכל הקטע, למשל $e^c>0$. אז הסימן של $R_n(x)$ ידוע, ומקבלים אי-שוויונות כמו
    $e^x>1+x+\frac{x^2}{2}$ לכל $x>0$.
  remedy: { lesson: '6.2', label: 'הסימן של השארית ואי-שוויונות' }
