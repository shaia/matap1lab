# Misconceptions first detected in lesson 13.2 (flux of a vector field).
- id: MC-c13-flux-magnitude
  title: חושבים שהשטף הוא גודל השדה כפול השטח
  belief: >-
    השטף של $\vec F$ דרך $S$ הוא $\iint_S|\vec F|\,dS$, או $|\vec F|$ כפול השטח כשהשדה קבוע.
  truth: >-
    רק הרכיב **הניצב** למשטח עובר דרכו: השטף הוא $\iint_S\vec F\cdot\hat n\,dS$. שדה שמשיק למשטח נותן שטף 0, ומשטח
    שמוטה בזווית $\alpha$ ביחס לזרם "רואה" רק $\cos\alpha$ מהזרם.
  remedy: { lesson: '13.2', label: 'שטף: הרכיב הנורמלי בלבד' }

- id: MC-c13-flux-orientation
  title: מתעלמים מכיוון הנורמל בחישוב שטף
  belief: >-
    לשטף יש ערך אחד, בלי קשר לכיוון שבו בוחרים את הנורמל, ואפשר לקחת את $\vec r_u\times\vec r_v$ כמו שהוא יוצא.
  truth: >-
    החלפת כיוון הנורמל הופכת את סימן השטף. לכן בוחרים כיוון (החוצה, למעלה) ובודקים שה-$\vec r_u\times\vec r_v$ של
    הפרמטריזציה מצביע אליו; אם לא, מחליפים את הסדר או מוסיפים מינוס.
  remedy: { lesson: '13.2', label: 'כיוון הנורמל וסימן השטף' }
