# Misconceptions first detected in lesson 12.1 (double integral over a rectangle, Fubini).
- id: MC-c12-integral-is-size
  title: האינטגרל הכפול הוא תמיד השטח של התחום
  belief: >-
    $\iint_D f\,dA$ שווה לשטח של $D$ (ו-$\iiint_E f\,dV$ לנפח של $E$), בלי קשר לפונקציה $f$.
  truth: >-
    השטח של $D$ הוא $\iint_D 1\,dA$, המקרה $f\equiv1$. לפונקציה אחרת כל תא קטן נשקל בערך של $f$ בו:
    $\iint_D f\,dA\approx\sum f(x_i,y_i)\,\Delta A$. כש-$f\ge0$ זה הנפח מתחת לגרף, וכש-$f$ צפיפות זו המסה.
  remedy: { lesson: '12.1', label: 'אינטגרל כפול: סכום של ערך כפול שטח' }

- id: MC-c12-volume-vs-surface
  title: מבלבלים בין הנפח מתחת לגרף לבין השטח של הגרף
  belief: >-
    $\iint_R f\,dA$ מודד את השטח של המשטח $z=f(x,y)$ שמעל $R$.
  truth: >-
    כל מחובר בסכום רימן $f(x_i,y_i)\,\Delta A$ הוא נפח של עמודה: גובה כפול שטח בסיס. לכן כש-$f\ge0$ האינטגרל הוא הנפח
    בין $R$ לבין הגרף. השטח של המשטח עצמו הוא נושא אחר (פרק 13), והנוסחה שלו שונה.
  remedy: { lesson: '12.1', label: 'אינטגרל כפול כנפח' }

- id: MC-c12-riemann-no-area
  title: סוכמים את ערכי הפונקציה בלי להכפיל בשטח התא
  belief: >-
    סכום רימן של אינטגרל כפול הוא $\sum f(x_i,y_i)$.
  truth: >-
    $\sum f(x_i,y_i)\,\Delta A_i$: כל ערך מוכפל בשטח התא שלו. בלי $\Delta A$ הסכום גדל בלי גבול כשמעדנים את החלוקה.
  remedy: { lesson: '12.1', label: 'סכומי רימן במישור' }

- id: MC-c12-signed-volume
  title: חושבים שאינטגרל כפול תמיד חיובי כי הוא נפח
  belief: >-
    $\iint_R f\,dA$ הוא נפח, ולכן אינו יכול להיות שלילי או אפס כש-$f$ אינה אפס.
  truth: >-
    האינטגרל הוא נפח **מסומן**: מה שמעל המישור נספר בחיוב ומה שמתחתיו בשלילה. למשל
    $\iint_{[-1,1]\times[0,2]}x^3e^y\,dA=0$, כי $x^3$ אי-זוגית והתחום סימטרי.
  remedy: { lesson: '12.1', label: 'נפח מסומן' }

- id: MC-c12-inner-constant
  title: מטפלים לא נכון במשתנה החיצוני בתוך האינטגרל הפנימי
  belief: >-
    באינטגרל הפנימי לפי $y$, הביטוי $x^3$ מתנהג כמו משתנה: $\int_1^5x^3\,dy=\frac{x^4}{4}$, או שהוא "נשאר כמו שהוא":
    $\int_1^5x^3\,dy=x^3$.
  truth: >-
    באינטגרל לפי $y$ המשתנה $x$ קבוע, ולכן $\int_1^5x^3\,dy=x^3\cdot(5-1)=4x^3$. אינטגרל של קבוע על קטע הוא הקבוע כפול
    אורך הקטע.
  remedy: { lesson: '12.1', label: 'האינטגרל הפנימי: המשתנה השני קבוע' }

- id: MC-c12-order-changes-value
  title: חושבים שסדר האינטגרציה משנה את התוצאה
  belief: >-
    $\int_a^b\!\int_c^d f\,dy\,dx$ ו-$\int_c^d\!\int_a^b f\,dx\,dy$ יכולים לתת מספרים שונים, ולכן חייבים לחשב בסדר
    שבו האינטגרל נכתב.
  truth: >-
    משפט פוביני: לפונקציה רציפה על מלבן שני הסדרים נותנים את אותו מספר, $\iint_R f\,dA$. תוצאות שונות בשני הסדרים
    מעידות על טעות חישוב. הסדר קובע רק כמה קשה החישוב.
  remedy: { lesson: '12.1', label: 'משפט פוביני' }

- id: MC-c12-order-by-habit
  title: מחשבים תמיד באותו סדר בלי לבדוק איזה סדר קל יותר
  belief: >-
    תמיד מתחילים מהאינטגרל לפי $x$ (או לפי הסדר הרגיל), גם כשהאינטגרל הפנימי יוצא קשה.
  truth: >-
    לפני שמתחילים בודקים באיזה סדר האינטגרל הפנימי פשוט. ל-$\iint x\cos(xy)\,dA$ האינטגרל לפי $y$ נותן מיד
    $\sin(xy)$, ואילו לפי $x$ צריך אינטגרציה בחלקים.
  remedy: { lesson: '12.1', label: 'בוחרים סדר אינטגרציה' }

- id: MC-c12-separable-misuse
  title: מפרקים אינטגרל כפול למכפלה כשאסור
  belief: >-
    כל אינטגרל כפול מתפרק למכפלה של שני אינטגרלים של משתנה אחד, או שמפרקים מכפלה לסכום של שני אינטגרלים.
  truth: >-
    $\iint_R g(x)h(y)\,dA=\left(\int_a^bg\,dx\right)\left(\int_c^dh\,dy\right)$ רק כש-$R=[a,b]\times[c,d]$ מלבן והאינטגרנד
    **מכפלה** של פונקציה של $x$ בפונקציה של $y$. $\sin(x+y)$ או $x+y$ אינם כאלה, ובתחום שאינו מלבן הגבולות הפנימיים
    תלויים במשתנה החיצוני.
  remedy: { lesson: '12.1', label: 'פירוק למכפלה על מלבן' }
