# Misconceptions first detected in lesson 1.5 (the triple product and determinants).
- id: MC-c1-det2-sign
  title: מחברים את שתי המכפלות בדטרמיננטה מסדר 2
  belief: >-
    $\begin{vmatrix}a&b\\c&d\end{vmatrix}=ad+bc$.
  truth: >-
    $\begin{vmatrix}a&b\\c&d\end{vmatrix}=ad-bc$: אלכסון ראשי פחות אלכסון משני. בדיקה: לשני וקטורים מקבילים, כמו $(1,2)$
    ו-$(2,4)$, הדטרמיננטה (השטח) צריכה להיות 0, ו-$4-4=0$.
  remedy: { lesson: '1.5', anchor: det2, label: 'דטרמיננטה מסדר 2' }

- id: MC-c1-det-order-irrelevant
  title: חושבים שסדר השורות או הגורמים לא משנה את הדטרמיננטה
  belief: >-
    החלפת שתי שורות בדטרמיננטה, או החלפת $\vec b$ ו-$\vec c$ ב-$\vec a\cdot(\vec b\times\vec c)$, משאירה את התוצאה.
  truth: >-
    החלפת שתי שורות הופכת את הסימן: $\vec a\cdot(\vec c\times\vec b)=-\vec a\cdot(\vec b\times\vec c)$. הגודל (הנפח) לא
    משתנה, הכיוון כן. רק **סיבוב מעגלי** $\vec a\to\vec b\to\vec c\to\vec a$ שומר על הסימן.
  remedy: { lesson: '1.5', anchor: det-properties, label: 'סימן הדטרמיננטה והסדר' }

- id: MC-c1-det-scale-linear
  title: חושבים שהכפלת כל האיברים ב-2 מכפילה את הדטרמיננטה ב-2
  belief: >-
    אם $\det$ של מטריצה מסדר 3 הוא 2, אז כשכופלים את כל האיברים ב-2 מתקבל 4.
  truth: >-
    כל שורה (כל צלע של המקבילון) מוכפלת ב-2, והנפח גדל פי $2^3=8$: מתקבל 16. במטריצה מסדר 2 השטח גדל פי $2^2=4$.
  remedy: { lesson: '1.5', anchor: det-scale, label: 'דטרמיננטה כנפח: מתיחה של הצלעות' }

- id: MC-c1-det-sign-meaning
  title: חושבים שדטרמיננטה שלילית היא טעות, או שהיא הנפח עצמו
  belief: >-
    נפח המקבילון הוא הדטרמיננטה כפי שהיא, וכשהיא יוצאת שלילית יש טעות בחישוב.
  truth: >-
    הדטרמיננטה היא נפח (או שטח) **עם סימן**: הסימן אומר אם הסדר של הווקטורים הוא "יד ימין" או "יד שמאל". הנפח עצמו הוא
    הערך המוחלט, $|\det|$.
  remedy: { lesson: '1.5', anchor: orientation, label: 'נפח עם סימן' }

- id: MC-c1-det-sign-is-dot
  title: מבלבלים בין הסימן של הדטרמיננטה לסימן של המכפלה הסקלרית
  belief: >-
    $\det(\vec u,\vec v)<0$ במישור פירושו שהזווית בין $\vec u$ ל-$\vec v$ קהה.
  truth: >-
    הסימן של $\det(\vec u,\vec v)=u_1v_2-u_2v_1$ אומר לאיזה **צד** פונים: חיובי אם הסיבוב הקצר מ-$\vec u$ אל $\vec v$ נגד
    כיוון השעון, שלילי אם עם כיוון השעון. חדה או קהה נקבע לפי הסימן של $\vec u\cdot\vec v$.
  remedy: { lesson: '1.5', anchor: det2-sign, label: 'הסימן של דטרמיננטה מסדר 2' }

- id: MC-c1-tetra-sixth
  title: לוקחים את נפח המקבילון כנפח הארבעון
  belief: >-
    נפח הארבעון שצלעותיו מקודקוד אחד הן $\vec a,\vec b,\vec c$ הוא $|\vec a\cdot(\vec b\times\vec c)|$, או חצי ממנו כמו במשולש.
  truth: >-
    הארבעון הוא פירמידה: נפחו שליש משטח הבסיס כפול הגובה, והבסיס משולש שהוא חצי מקבילית. לכן הנפח
    $\frac16|\vec a\cdot(\vec b\times\vec c)|$.
  remedy: { lesson: '1.5', anchor: tetrahedron, label: 'נפח ארבעון: שישית המקבילון' }

- id: MC-c1-coplanar-means-parallel
  title: חושבים ששלושה וקטורים במישור אחד מחייבים שניים מקבילים
  belief: >-
    אם $\vec a\cdot(\vec b\times\vec c)=0$, שניים מהווקטורים מקבילים.
  truth: >-
    מכפלה משולשת אפס פירושה שהמקבילון שטוח: שלושת הווקטורים במישור אחד. $(1,0,0)$, $(0,1,0)$, $(1,1,0)$ כולם במישור
    $z=0$, ואף שניים מהם אינם מקבילים.
  remedy: { lesson: '1.5', anchor: coplanar, label: 'מכפלה משולשת אפס: במישור אחד' }

- id: MC-c1-nonparallel-intersect
  title: חושבים ששני ישרים לא מקבילים במרחב תמיד נחתכים
  belief: >-
    כמו במישור, שני ישרים במרחב שאינם מקבילים חייבים להיפגש.
  truth: >-
    במרחב יש גם **ישרים מצטלבים**: לא מקבילים ולא נחתכים, כמו קו שעובר מעל קו אחר בכיוון אחר. הישרים
    $P+t\vec u$ ו-$Q+s\vec v$ (לא מקבילים) נחתכים בדיוק כש-$(Q-P)\cdot(\vec u\times\vec v)=0$.
  remedy: { lesson: '1.5', anchor: skew-lines, label: 'ישרים נחתכים וישרים מצטלבים' }
