# Misconceptions first detected in lesson 10.8 (absolute extrema on a closed bounded region).
- id: MC-c10-forget-interior
  title: בודקים רק את השפה ושוכחים את הנקודות הקריטיות בפנים
  belief: >-
    מקסימום ומינימום מוחלטים בתחום סגור מתקבלים תמיד על השפה.
  truth: >-
    הם יכולים להתקבל גם בנקודה קריטית בפנים התחום. ל-$x^2+y^2-xy+x+y$ במשולש $(0,0),(-3,0),(0,-3)$ המינימום הוא $-1$,
    בנקודה הפנימית $(-1,-1)$, נמוך מכל ערך על השפה.
  remedy: { lesson: '10.8', label: 'האלגוריתם: פנים ושפה' }

- id: MC-c10-forget-corners
  title: על צלע של השפה בודקים רק נקודות שבהן הנגזרת מתאפסת, בלי קצות הצלע
  belief: >-
    אחרי שמצמצמים את $f$ לצלע ומקבלים פונקציה של משתנה אחד, מספיק לבדוק איפה הנגזרת שלה מתאפסת.
  truth: >-
    על כל צלע זו בעיית קיצון בקטע סגור: בודקים את הנקודות שבהן הנגזרת מתאפסת **וגם את קצות הקטע**, שהם הקודקודים של
    התחום. במשולש של הדוגמה המקסימום 6 מתקבל בקודקודים.
  remedy: { lesson: '10.8', label: 'השפה: קטעים וקודקודים' }

- id: MC-c10-crit-outside-region
  title: משתמשים בנקודה קריטית שנמצאת מחוץ לתחום
  belief: >-
    הנקודה הקריטית של $f$ היא המועמדת לקיצון גם כשהיא לא נמצאת בתחום הנתון.
  truth: >-
    מחפשים קיצון של $f$ **על התחום** בלבד: נקודה קריטית מחוץ לתחום אינה מועמדת. ל-$x^2+y^2-xy+x+y$ בעיגול היחידה הנקודה
    הקריטית $(-1,-1)$ בחוץ, והמינימום $\frac12-\sqrt2$ מתקבל על השפה.
  remedy: { lesson: '10.8', label: 'רק נקודות בתוך התחום' }

- id: MC-c10-edge-line
  title: כותבים משוואה לא נכונה לצלע של התחום
  belief: >-
    הצלע מ-$(-3,0)$ ל-$(0,-3)$ היא הישר $y=x-3$.
  truth: >-
    ישר דרך שתי נקודות: השיפוע $\frac{-3-0}{0-(-3)}=-1$, ולכן $y=-x-3$. בדיקה: שתי הנקודות מקיימות את המשוואה.
  remedy: { lesson: '10.8', label: 'פרמטריזציה של צלעות' }

- id: MC-c10-half-boundary
  title: מפרמטרים רק חצי מהשפה של עיגול
  belief: >-
    השפה של העיגול $x^2+y^2\le4$ היא $y=\sqrt{4-x^2}$, $-2\le x\le2$.
  truth: >-
    $y=\sqrt{4-x^2}$ הוא רק חצי המעגל העליון; צריך גם $y=-\sqrt{4-x^2}$. הפרמטריזציה $(2\cos t,2\sin t)$, $0\le t\le2\pi$,
    מכסה את כל המעגל בבת אחת.
  remedy: { lesson: '10.8', label: 'פרמטריזציה של מעגל' }

- id: MC-c10-open-region-max
  title: חושבים שלפונקציה רציפה יש תמיד מקסימום, גם בתחום פתוח
  belief: >-
    ל-$f=x+y$ בעיגול הפתוח $x^2+y^2<1$ יש מקסימום מוחלט.
  truth: >-
    המשפט מבטיח מקסימום ומינימום לפונקציה רציפה בתחום **סגור וחסום**. בעיגול הפתוח $x+y$ מתקרבת ל-$\sqrt2$ ליד
    $\left(\tfrac{1}{\sqrt2},\tfrac{1}{\sqrt2}\right)$ אבל לא מגיעה אליו, כי הנקודה הזו על השפה ולא בתחום.
  remedy: { lesson: '10.8', label: 'קיום מקסימום: תחום סגור וחסום' }

- id: MC-c10-abs-only-critical
  title: חושבים שהמקסימום המוחלט מתקבל בנקודה קריטית
  belief: >-
    מקסימום מוחלט הוא בפרט מקסימום מקומי, ולכן הוא מתקבל בנקודה שבה $\nabla f=0$.
  truth: >-
    $\nabla f=0$ נדרש רק בנקודה **פנימית**. על השפה הפונקציה יכולה להיות מקסימלית בלי שהגרדיאנט מתאפס: $f=x$ בריבוע
    $[0,1]^2$ מקבלת מקסימום 1 על הצלע $x=1$, ואין לה נקודה קריטית בכלל.
  remedy: { lesson: '10.8', label: 'קיצון מוחלט יכול להיות על השפה' }
