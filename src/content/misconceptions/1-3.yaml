# Misconceptions first detected in lesson 1.3 (lines and planes in space).
- id: MC-c1-line-point-direction-swap
  title: מחליפים בין הנקודה לכיוון במשוואת הישר
  belief: >-
    הישר דרך $P_0$ בכיוון $\vec v$ הוא $\vec v+tP_0$, או שהישר דרך $A$ ו-$B$ הוא בכיוון $B$.
  truth: >-
    $\vec r(t)=P_0+t\vec v$: הנקודה היא נקודת ההתחלה (ב-$t=0$), והכיוון מוכפל ב-$t$. ישר דרך שתי נקודות: הכיוון הוא
    $\vec{AB}=B-A$, לא אחת הנקודות.
  remedy: { lesson: '1.3', anchor: line-parametric, label: 'ישר במרחב: נקודה ועוד t כפול כיוון' }

- id: MC-c1-one-equation-enough
  title: בודקים שנקודה על ישר לפי רכיב אחד בלבד
  belief: >-
    כדי לבדוק אם נקודה על הישר $x=1+2t$, $y=1+3t$, $z=8-5t$ מספיק למצוא $t$ ממשוואה אחת.
  truth: >-
    הנקודה על הישר רק אם **אותו** $t$ מקיים את שלוש המשוואות. מוצאים $t$ מאחת ובודקים בשתיים האחרות.
  remedy: { lesson: '1.3', anchor: point-on-line, label: 'האם נקודה על ישר: אותו t בכל הרכיבים' }

- id: MC-c1-zero-denominator-line
  title: חושבים שמכנה 0 בצורה הקנונית אומר שהרכיב חופשי
  belief: >-
    לישר בכיוון $(0,2,3)$ דרך $(1,1,1)$ אפשר לכתוב $\frac{x-1}{0}=\frac{y-1}{2}=\frac{z-1}{3}$, ו-$x$ יכול להיות כל מספר.
  truth: >-
    כשרכיב הכיוון 0, הקואורדינטה הזו **קבועה** לאורך הישר: $x=1$, ושאר הקואורדינטות בצורה הקנונית:
    $x=1,\ \frac{y-1}{2}=\frac{z-1}{3}$. בצורה הפרמטרית אין בעיה: $x=1+0\cdot t$.
  remedy: { lesson: '1.3', anchor: canonical-zero, label: 'הצורה הקנונית כשרכיב כיוון מתאפס' }

- id: MC-c1-plane-d-sign
  title: טועים בסימן של האיבר החופשי במשוואת מישור
  belief: >-
    המישור דרך $(x_0,y_0,z_0)$ עם נורמל $(a,b,c)$ הוא $ax+by+cz=-(ax_0+by_0+cz_0)$.
  truth: >-
    $a(x-x_0)+b(y-y_0)+c(z-z_0)=0$, ולכן $ax+by+cz=d$ עם $d=ax_0+by_0+cz_0$. בדיקה: הנקודה הנתונה חייבת לקיים את
    המשוואה.
  remedy: { lesson: '1.3', anchor: plane-equation, label: 'מישור מנקודה ונורמל' }

- id: MC-c1-plane-coefficients
  title: מבלבלים בין הנורמל לבין נקודה או לבין האיבר החופשי
  belief: >-
    במישור $2x-y+4z=7$ הנקודה $(0,0,\frac74)$ או המספר 7 קובעים את כיוון המישור, ומישורים עם איברים חופשיים שונים אינם
    מקבילים.
  truth: >-
    המקדמים של $x,y,z$ הם רכיבי הנורמל וקובעים את הכיוון; האיבר החופשי רק מזיז את המישור. מישורים עם נורמלים
    פרופורציוניים מקבילים (או זהים), בלי קשר לאיבר החופשי.
  remedy: { lesson: '1.3', anchor: plane-coefficients, label: 'המקדמים במשוואת המישור' }

- id: MC-c1-normal-in-plane
  title: מבלבלים בין וקטור במישור לבין נורמל
  belief: >-
    וקטור שמקיים $\vec n\cdot\vec v=0$ עם הנורמל הוא גם נורמל למישור.
  truth: >-
    $\vec v\cdot\vec n=0$ פירושו ש-$\vec v$ **מקביל** למישור (שוכב בו). נורמל הוא וקטור מקביל ל-$\vec n$, כלומר כפולה שלו.
  remedy: { lesson: '1.3', anchor: normal-vs-in-plane, label: 'נורמל מול וקטור במישור' }

- id: MC-c1-t-is-point
  title: עוצרים בערך של הפרמטר במקום למצוא את הנקודה
  belief: >-
    כשמחשבים חיתוך של ישר ומישור, הערך $t=1$ שמתקבל הוא נקודת החיתוך.
  truth: >-
    $t$ הוא רק הפרמטר. נקודת החיתוך מתקבלת בהצבה שלו בחזרה בישר: $\vec r(1)=P_0+\vec v$.
  remedy: { lesson: '1.3', anchor: line-plane, label: 'חיתוך ישר ומישור: מציבים את t בחזרה' }

- id: MC-c1-perp-normal-means-perp-plane
  title: חושבים שכיוון ישר המאונך לנורמל פירושו ישר מאונך למישור
  belief: >-
    אם $\vec v\cdot\vec n=0$, הישר בכיוון $\vec v$ מאונך למישור וחותך אותו.
  truth: >-
    ישר מאונך למישור כשהכיוון שלו **מקביל** לנורמל. כש-$\vec v\cdot\vec n=0$ הישר מקביל למישור: הוא בתוכו (אם נקודה אחת
    שלו במישור) או לא פוגש אותו כלל.
  remedy: { lesson: '1.3', anchor: line-parallel-plane, label: 'ישר מקביל למישור' }

- id: MC-c1-distance-no-norm
  title: שוכחים לחלק באורך הנורמל במרחק נקודה ממישור
  belief: >-
    המרחק מ-$P$ למישור $ax+by+cz=d$ הוא $|ax_1+by_1+cz_1-d|$ (כש-$P=(x_1,y_1,z_1)$), או אותו מספר חלקי $a^2+b^2+c^2$.
  truth: >-
    $h=\frac{|ax_1+by_1+cz_1-d|}{\sqrt{a^2+b^2+c^2}}$, כש-$P=(x_1,y_1,z_1)$: זה הרכיב של $\vec{QP}$ ($Q$ נקודה במישור) בכיוון הנורמל
    **היחידה**. בלי החילוק התוצאה משתנה כשכופלים את משוואת המישור ב-2.
  remedy: { lesson: '1.3', anchor: distance, label: 'מרחק מנקודה למישור' }
