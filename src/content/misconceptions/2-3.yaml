# Misconceptions first detected in lesson 2.3 (polar coordinates).
- id: MC-c2-arctan-quadrant
  title: מחשבים את הזווית הקוטבית כ-arctan של y חלקי x בלי לבדוק את הרביע
  belief: >-
    הזווית של $(x,y)$ היא תמיד $\theta=\arctan\frac{y}{x}$.
  truth: >-
    $\arctan$ מחזיר ערכים רק בין $-\frac{\pi}{2}$ ל-$\frac{\pi}{2}$, כלומר זווית ברביע הראשון או הרביעי. $(1,1)$
    ו-$(-1,-1)$ נותנים אותו $\frac{y}{x}$. קובעים קודם את הרביע לפי הסימנים של $x$ ו-$y$; כש-$x<0$ מוסיפים $\pi$
    ל-$\arctan\frac{y}{x}$. גם בכיוון ההפוך: הסימן של $\cos\theta$ ו-$\sin\theta$ תלוי ברביע.
  remedy: { lesson: '2.3', anchor: angle-quadrant, label: 'הזווית ברביע הנכון' }

- id: MC-c2-polar-unique
  title: חושבים שלכל נקודה יש זווית קוטבית אחת בלבד
  belief: >-
    $\left(2,\frac{\pi}{3}\right)$ ו-$\left(2,\frac{7\pi}{3}\right)$ הן נקודות שונות.
  truth: >-
    הזווית נקבעת עד כדי כפולה שלמה של $2\pi$, כי $\cos$ ו-$\sin$ מחזוריות. לכן שאלה שרוצה תשובה אחת קובעת טווח:
    $[0,2\pi)$ או $(-\pi,\pi]$. (והראשית, $r=0$, מתקבלת מכל זווית.)
  remedy: { lesson: '2.3', anchor: polar-not-unique, label: 'הזווית נקבעת עד כדי 2π' }

- id: MC-c2-polar-graph-as-cartesian
  title: משרטטים משוואה קוטבית כגרף רגיל
  belief: >-
    את $r=2\sin\theta$ משרטטים כמו $y=2\sin x$: $\theta$ על הציר האופקי ו-$r$ על האנכי.
  truth: >-
    במשוואה קוטבית $\theta$ הוא **כיוון** ו-$r$ **מרחק מהראשית**: לכל $\theta$ מסמנים את הנקודה
    $(r\cos\theta,r\sin\theta)$. $r=2\sin\theta$ הוא מעגל שמרכזו $(0,1)$. כדי לזהות, כופלים ב-$r$ ומתרגמים:
    $x^2+y^2=2y$.
  remedy: { lesson: '2.3', anchor: polar-sketch, label: 'שרטוט של משוואה קוטבית' }

- id: MC-c2-polar-r-theta-roles
  title: מבלבלים בין התפקידים של r ושל הזווית, או של קוסינוס וסינוס
  belief: >-
    $r=3$ הוא ישר, $\theta=3$ הוא מעגל, או $x=r\sin\theta$.
  truth: >-
    $r$ הוא המרחק מהראשית ו-$\theta$ הכיוון: $r=c$ הוא מעגל סביב הראשית, $\theta=c$ קרן מהראשית. $x=r\cos\theta$,
    $y=r\sin\theta$, ובתרגום של משוואה כל $x$ ו-$y$ מוחלפים יחד עם ה-$r$ שלהם: $4x=4r\cos\theta$.
  remedy: { lesson: '2.3', anchor: polar-grid, label: 'r ו-θ: מרחק וכיוון' }

- id: MC-c2-polar-region-center
  title: חושבים שכל מעגל או עיגול נכתב בקוטביות כ-r קבוע
  belief: >-
    כל מעגל הוא $r=R$ בקואורדינטות קוטביות, וכל עיגול הוא $0\le r\le R$ עם $0\le\theta\le2\pi$.
  truth: >-
    $r=R$ הוא רק מעגל **שמרכזו בראשית**. מעגל שעובר דרך הראשית, כמו $(x-1)^2+y^2=1$, נכתב $r=2\cos\theta$ עם
    $-\frac{\pi}{2}\le\theta\le\frac{\pi}{2}$: גם הגבול של $r$ וגם טווח הזוויות משתנים.
  remedy: { lesson: '2.3', anchor: polar-offcentre, label: 'מעגלים שאינם סביב הראשית' }

- id: MC-c2-polar-extreme-r
  title: מחפשים את הנקודה הקיצונית במישור רק לפי הערך הקיצוני של r
  belief: >-
    הנקודה השמאלית ביותר של עקום קוטבי היא במקום שבו $r$ הגדול ביותר, או במקום שבו $\theta=\pi$.
  truth: >-
    השמאלית ביותר היא זו עם $x=r\cos\theta$ הקטן ביותר, וזה תלוי ב-$r$ ובזווית יחד. בקרדיואידה $r=1+\cos\theta$
    ב-$\theta=\pi$ דווקא $r=0$, והמינימום של $x$, $-\frac14$, מתקבל ב-$\cos\theta=-\frac12$.
  remedy: { lesson: '2.3', anchor: polar-extreme, label: 'נקודות קיצון של עקום קוטבי' }
