# Misconceptions first detected in lesson 4.6 (limits and continuity, intuitively).
- id: MC-c4-zero-over-zero
  title: חושבים שגבול מהצורה 0 חלקי 0 הוא 0, 1 או לא קיים
  belief: >-
    אם הצבה נותנת $\frac00$, הגבול הוא 0 (או 1), או שאינו קיים.
  truth: >-
    $\frac00$ אינו ערך אלא סימן שצריך לעבוד: לצמצם גורם משותף, לכפול בצמוד. $\frac{x^2-5x+6}{x-2}=x-3\to-1$ כש-$x\to2$,
    ו-$\frac{\sqrt{x+4}-2}{x}\to\frac14$.
  remedy: { lesson: '4.6', anchor: zero-over-zero, label: 'גבול מהצורה 0/0' }

- id: MC-c4-sinx-over-x-everywhere
  title: חושבים ש-sin x חלקי x שואף ל-1 בכל מקום
  belief: >-
    $\frac{\sin x}{x}\to1$ גם כש-$x\to\infty$.
  truth: >-
    $\frac{\sin x}x\to1$ כש-$x\to0$. כש-$x\to\infty$ המונה חסום בין מינוס 1 ל-1 והמכנה גדל, ולכן המנה שואפת ל-0.
  remedy: { lesson: '4.6', anchor: sinc, label: 'sin x / x ליד 0 ובאינסוף' }

- id: MC-c4-one-sided-ignored
  title: מסתכלים רק על צד אחד של הנקודה
  belief: >-
    $\lim_{x\to0}\frac1x=\infty$.
  truth: >-
    מימין $\frac1x\to+\infty$ ומשמאל $\frac1x\to-\infty$. הגבולות החד-צדדיים שונים, ולכן הגבול הדו-צדדי אינו קיים (גם לא
    כגבול אינסופי). ל-$\frac1{x^2}$ שני הצדדים נותנים $+\infty$.
  remedy: { lesson: '4.6', anchor: one-sided, label: 'גבולות חד-צדדיים' }

- id: MC-c4-rational-limit-at-infinity
  title: מחשבים גבול באינסוף של מנת פולינומים מהאיברים הלא נכונים
  belief: >-
    $\lim_{x\to\infty}\frac{3x^2-x}{1-2x^2}$ נקבע לפי האיברים החופשיים, או שהוא תמיד 0 או $\infty$.
  truth: >-
    באינסוף שולטים האיברים מהחזקה **הגבוהה**: מחלקים מונה ומכנה ב-$x^2$ ומקבלים $\frac{3-\frac1x}{\frac1{x^2}-2}\to-\frac32$.
    כשהמעלות שוות, הגבול הוא היחס בין המקדמים המובילים.
  remedy: { lesson: '4.6', anchor: limits-at-infinity, label: 'גבול באינסוף של מנת פולינומים' }

- id: MC-c4-infinity-minus-infinity
  title: חושבים שאינסוף פחות אינסוף הוא 0
  belief: >-
    $\sqrt{x^2+3x}\to\infty$ וגם $x\to\infty$, ולכן ההפרש שואף ל-0.
  truth: >-
    $\infty-\infty$ אינו מוגדר: התוצאה תלויה בקצב. כופלים בצמוד: $\sqrt{x^2+3x}-x=\frac{3x}{\sqrt{x^2+3x}+x}\to\frac32$.
  remedy: { lesson: '4.6', anchor: infinity-minus-infinity, label: 'אינסוף פחות אינסוף' }

- id: MC-c4-removable-vs-jump
  title: מבלבלים אי-רציפות סליקה עם קפיצה
  belief: >-
    כל אי-רציפות שבה הגבולות החד-צדדיים סופיים היא סליקה.
  truth: >-
    סליקה: הגבול הדו-צדדי **קיים** (שני הצדדים שווים) ורק הערך בנקודה חסר או שונה. קפיצה: שני הגבולות החד-צדדיים
    סופיים אבל **שונים**, ושום ערך בנקודה לא יתקן את זה.
  remedy: { lesson: '4.6', anchor: classify, label: 'סליקה מול קפיצה' }

- id: MC-c4-zero-denominator-infinite
  title: חושבים שכל אפס של המכנה נותן אסימפטוטה
  belief: >-
    אם המכנה מתאפס ב-$x=a$, יש שם אי-רציפות אינסופית.
  truth: >-
    אם גם המונה מתאפס שם, ייתכן שהגורם $(x-a)$ מצטמצם והגבול סופי: $\frac{x^2-1}{(x-1)(x+2)}=\frac{x+1}{x+2}$ ל-$x\ne1$,
    ולכן ב-$x=1$ האי-רציפות סליקה. בודקים את הגבול, לא רק את המכנה.
  remedy: { lesson: '4.6', anchor: zero-denominator, label: 'אפס במכנה: סליקה או אינסופית' }

- id: MC-c4-bounded-has-limit
  title: חושבים שפונקציה חסומה ליד נקודה מתכנסת בה
  belief: >-
    $\sin\frac1x$ חסומה בין מינוס 1 ל-1, ולכן יש לה גבול ב-0, ואפשר לסלק את אי-הרציפות.
  truth: >-
    חסימות אינה מספיקה: $\sin\frac1x$ מתנודדת בין מינוס 1 ל-1 אינסוף פעמים בכל סביבה של 0, ואין לה גבול חד-צדדי בשום
    צד. בנקודה כזו אין גבול: אי-הרציפות אינה סליקה ואינה קפיצה.
  remedy: { lesson: '4.6', anchor: no-limit, label: 'sin(1/x): חסומה בלי גבול' }

- id: MC-c4-oscillation-no-limit
  title: חושבים שפונקציה מתנודדת אינה יכולה להתכנס
  belief: >-
    $\frac{\sin x}{x}$ מחליפה סימן שוב ושוב כש-$x\to\infty$, ולכן אין לה גבול.
  truth: >-
    תנודה מונעת גבול רק כשגודלה לא קטן. כאן $\left|\frac{\sin x}{x}\right|\le\frac1x\to0$: התנודות דועכות, והגבול 0.
    לעומת זאת $\sin\frac1x$ ליד 0 מתנודדת בין מינוס 1 ל-1 בלי לדעוך, ולה אין גבול.
  remedy: { lesson: '4.6', anchor: squeeze, label: 'גבול של מכפלת חסומה בשואפת ל-0' }

- id: MC-c4-ivt-without-continuity
  title: מפעילים את משפט ערך הביניים בלי לבדוק רציפות
  belief: >-
    אם $f(a)<0<f(b)$, אז ל-$f$ יש שורש בין $a$ ל-$b$.
  truth: >-
    המשפט דורש ש-$f$ תהיה **רציפה בכל הקטע** $[a,b]$. ל-$\frac1x$ ב-$[-1,1]$: $f(-1)=-1<0<1=f(1)$, ואין שורש: הגרף
    "קופץ" מעל ציר $x$ דרך האסימפטוטה.
  remedy: { lesson: '4.6', anchor: ivt-hypotheses, label: 'משפט ערך הביניים: התנאים' }

- id: MC-c4-monotone-gives-root
  title: חושבים שמונוטוניות מבטיחה שורש
  belief: >-
    $f$ עולה בקטע, ולכן היא חוצה את ציר $x$ שם.
  truth: >-
    מונוטוניות נותנת **לכל היותר** שורש אחד ($e^x$ עולה ואין לה שורש). קיום בא מרציפות ומהחלפת סימן (ערך הביניים).
  remedy: { lesson: '4.6', anchor: existence-uniqueness, label: 'קיום מול יחידות של שורש' }

- id: MC-c4-evt-open-interval
  title: חושבים שלכל פונקציה רציפה יש מקסימום בכל קטע
  belief: >-
    $f(x)=x$ רציפה, ולכן מקבלת ערך גדול ביותר בקטע $(0,1)$.
  truth: >-
    המשפט על קיום מקסימום ומינימום דורש קטע **סגור** $[a,b]$ ופונקציה רציפה בו. ב-$(0,1)$ הערכים של $x$ מתקרבים ל-1 בלי
    להגיע, ואין מקסימום; $\frac1x$ ב-$(0,1]$ אינה חסומה כלל.
  remedy: { lesson: '4.6', anchor: extreme, label: 'קיום מקסימום בקטע סגור' }

- id: MC-c4-bisection-wrong-half
  title: בוחרים בחצייה את החצי הלא נכון
  belief: >-
    בשיטת החצייה ממשיכים תמיד עם החצי שבו $f$ בנקודת האמצע קרובה יותר ל-0, או עם החצי הימני.
  truth: >-
    ממשיכים עם החצי שבקצותיו $f$ **מחליפה סימן**: שם ערך הביניים מבטיח שורש. אם $f(m)<0$ ו-$f(b)>0$, הקטע הבא $[m,b]$.
  remedy: { lesson: '4.6', anchor: bisection, label: 'שיטת החצייה' }

- id: MC-c4-undefined-no-limit
  title: חושבים שאם הפונקציה אינה מוגדרת בנקודה, אין לה גבול שם
  belief: >-
    $\frac{x^2-5x+6}{x-2}$ אינה מוגדרת ב-2, ולכן אין לה גבול ב-2, ואין מה לומר על ההתנהגות שלה ליד 2.
  truth: >-
    הגבול מדבר על הערכים **ליד** הנקודה, לא **בה**. $\frac{x^2-5x+6}{x-2}=x-3$ לכל $x\ne2$, ולכן הגבול ב-2 הוא מינוס 1, אף
    שהערך ב-2 אינו מוגדר. זו בדיוק אי-רציפות סליקה.
  remedy: { lesson: '4.6', anchor: limit-idea, label: 'גבול: ליד הנקודה, לא בה' }

- id: MC-c4-glue-sign
  title: מאבדים סימן כשמציבים את נקודת החיבור בנוסחה עם פרמטר
  belief: >-
    ב-$f(x)=x^2-a$ ב-$x=2$ מקבלים $4+a$, או שמציבים בנוסחה הלא נכונה לצד הזה.
  truth: >-
    מציבים רק את $x$, וכל השאר נשאר כמו שהוא: $2^2-a=4-a$. כל צד מחשבים מהנוסחה שלו, ואחרי שמוצאים את הפרמטר מציבים אותו
    בחזרה ובודקים ששני הגבולות החד-צדדיים יוצאים שווים.
  remedy: { lesson: '4.6', anchor: glue, label: 'להדביק שתי נוסחאות' }
