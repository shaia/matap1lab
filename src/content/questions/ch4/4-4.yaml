# Lesson 4.4 — trigonometric functions and their inverses.
# Objectives (src/course.ts):
#   OBJ-4.4-1  sketch sine, cosine and tangent with period, amplitude and phase shift
#   OBJ-4.4-2  define arcsin, arccos and arctan, their domains and their images
#   OBJ-4.4-3  compute values of the inverse functions and simplify compositions such as cos(arcsin x)
# Every number is recomputed in screens/tools/checks_ch4.py.
chapter: 4
questions:
  - id: Q-4.4-period-3sin2x
    type: numeric
    objectives: [OBJ-4.4-1]
    level: basic
    prompt: >-
      מהו המחזור של $y=3\sin(2x)$? (אפשר לכתוב ערך מדויק, כמו 5π/6 או 3√2)
    answer: 3.141592653589793
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\pi$. המקדם 3 קובע את האמפליטודה ואינו משפיע על המחזור; המקדם 2 מקצר את המחזור $2\pi$ פי 2.
    wrongFeedback: >-
      $\sin(2x)$ משלימה מחזור כש-$2x$ גדל ב-$2\pi$.
    commonWrong:
      - value: 12.566370614359172
        feedback: >-
          זה $4\pi=2\pi\cdot2$: הכפלתם במקדם של $x$ במקום לחלק בו.
        misconception: MC-c4-period-scaling

  - id: Q-4.4-amplitude
    type: numeric
    objectives: [OBJ-4.4-1]
    level: basic
    prompt: >-
      מהי האמפליטודה של $y=-2\cos\frac x3+1$?
    answer: 2
    tolerance: 0.001
    correctFeedback: >-
      נכון. הגרף מתנודד בין $1-2=-1$ ל-$1+2=3$: חצי המרחק ביניהם הוא 2. המינוס משקף את הגל ביחס לקו האמצע $y=1$.
    wrongFeedback: >-
      מצאו את הערך הגבוה והנמוך של $y$, וחשבו חצי מההפרש.
    commonWrong:
      - value: -2
        feedback: >-
          אמפליטודה היא מרחק, ולכן חיובית: $|-2|=2$. המינוס רק הופך את הגל (מתחיל במינימום במקום במקסימום).
        misconception: MC-c4-amplitude-sign

  - id: Q-4.4-arcsin-def
    type: mc
    objectives: [OBJ-4.4-2]
    qualitative: true
    level: basic
    prompt: >-
      מהם תחום ההגדרה והתמונה של $\arcsin$?
    choices:
      - text: 'תחום $[-1,1]$, תמונה $\left[-\frac\pi2,\frac\pi2\right]$'
        correct: true
        feedback: >-
          נכון. הסינוס מצומצם ל-$\left[-\frac\pi2,\frac\pi2\right]$, שם הוא עולה ומקבל כל ערך ב-$[-1,1]$ פעם אחת. ההפוכה מחליפה
          תחום ותמונה.
      - text: 'תחום $[-1,1]$, תמונה $[0,\pi]$'
        feedback: >-
          זו התמונה של $\arccos$. בקטע $[0,\pi]$ הסינוס **אינו** חד-חד-ערכי ($\sin\frac\pi6=\sin\frac{5\pi}6$).
        misconception: MC-c4-arcsin-arccos-range-swap
      - text: 'תחום $\mathbb{R}$, תמונה $[-1,1]$'
        feedback: >-
          אלה התחום והתמונה של $\sin$ עצמה, הפוכים. $\arcsin2$ אינו מוגדר: אין זווית שהסינוס שלה 2.
        misconception: MC-c4-inverse-needs-one-to-one
      - text: 'תחום $\mathbb{R}$ פרט לכפולות של $\pi$, כי $\arcsin x=\frac1{\sin x}$'
        feedback: >-
          $\sin^{-1}$ פירושו פונקציה הפוכה, לא אחד חלקי סינוס. $\frac1{\sin x}$ היא פונקציה אחרת.
        misconception: MC-c4-inverse-is-reciprocal

  - id: Q-4.4-arccos-value
    type: numeric
    objectives: [OBJ-4.4-3]
    level: basic
    prompt: >-
      חשבו את $\arccos\!\left(-\frac12\right)$. (אפשר לכתוב ערך מדויק, כמו 5π/6 או 3√2)
    answer: 2.0943951023931957
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{2\pi}3$: זו הזווית היחידה ב-$[0,\pi]$ שהקוסינוס שלה $-\frac12$.
    wrongFeedback: >-
      $\arccos$ מחזירה זווית ב-$[0,\pi]$. איזו זווית בקטע הזה נותנת קוסינוס $-\frac12$?
    commonWrong:
      - value: -1.0471975511965976
        feedback: >-
          $-\frac\pi3$ אינה בטווח של $\arccos$, ו-$\cos\left(-\frac\pi3\right)=+\frac12$. ל-$\arcsin$ מותר לצאת שלילי, ל-$\arccos$ לא.
        misconception: MC-c4-arccos-range

  - id: Q-4.4-sin-inverse-notation
    type: twotier
    objectives: [OBJ-4.4-2]
    qualitative: true
    level: basic
    prompt: >-
      נכון או לא נכון: $\sin^{-1}x=\frac{1}{\sin x}$.
    choices:
      - text: 'לא נכון'
        correct: true
        feedback: 'נכון. $\sin^{-1}x$ הוא סימון ל-$\arcsin x$. למשל $\sin^{-1}1=\frac\pi2$, ואילו $\frac1{\sin1}\approx1.19$.'
      - text: 'נכון'
        feedback: >-
          $\frac1{\sin x}$ מוגדרת גם ב-$x=5$, אבל $\arcsin5$ אינו מוגדר. אלה פונקציות שונות.
        misconception: MC-c4-inverse-is-reciprocal
    reasons:
      - text: 'המעריך $-1$ על שם של פונקציה מסמן את הפונקציה ההפוכה ביחס להרכבה'
        correct: true
        feedback: 'בדיוק. $f^{-1}(f(x))=x$. (ובכל זאת $\sin^2x$ פירושו $(\sin x)^2$: הסימון לא עקבי, ולכן בקורס כותבים $\arcsin$.)'
      - text: 'חזקה $-1$ היא תמיד אחד חלקי'
        feedback: >-
          על מספר כן, $a^{-1}=\frac1a$. על שם של פונקציה, $f^{-1}$ הוא ההפוכה.
        misconception: MC-c4-inverse-is-reciprocal

  - id: Q-4.4-phase-shift
    type: numeric
    objectives: [OBJ-4.4-1]
    level: mid
    prompt: >-
      הגרף של $y=\sin\!\left(2x-\frac\pi2\right)$ הוא הגרף של $y=\sin(2x)$ מוזז ימינה. בכמה? (אפשר לכתוב ערך מדויק, כמו 5π/6 או 3√2)
    answer: 0.7853981633974483
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac\pi4$. $\sin\!\left(2x-\frac\pi2\right)=\sin\!\left(2\left(x-\frac\pi4\right)\right)$: החלפת $x$ ב-$x-\frac\pi4$.
    wrongFeedback: >-
      הוציאו את המקדם של $x$ מהסוגריים, וקראו את ההזזה.
    commonWrong:
      - value: 1.5707963267948966
        feedback: >-
          $\frac\pi2$ נקרא ישר מהנוסחה, אבל המקדם 2 של $x$ מכווץ גם את ההזזה: $2x-\frac\pi2=2\left(x-\frac\pi4\right)$.
        misconception: MC-c4-phase-shift-factor

  - id: Q-4.4-tan-graph
    type: mc
    objectives: [OBJ-4.4-1]
    qualitative: true
    level: mid
    prompt: >-
      מה נכון לגבי הגרף של $\tan x$?
    choices:
      - text: 'המחזור $\pi$, ויש אסימפטוטות אנכיות ב-$x=\frac\pi2+k\pi$'
        correct: true
        feedback: >-
          נכון. $\tan(x+\pi)=\tan x$, ובכל קטע $\left(-\frac\pi2+k\pi,\frac\pi2+k\pi\right)$ הטנגנס עולה מ-$-\infty$ ל-$\infty$.
      - text: 'המחזור $2\pi$, כמו סינוס וקוסינוס'
        feedback: >-
          גם $2\pi$ הוא מחזור, אבל לא הקטן ביותר: $\tan(x+\pi)=\frac{-\sin x}{-\cos x}=\tan x$.
        misconception: MC-c4-tan-period-2pi
      - text: 'האמפליטודה 1'
        feedback: >-
          הטנגנס אינו חסום: ליד $\frac\pi2$ הוא שואף לאינסוף. אין לו אמפליטודה.
        misconception: MC-c4-tan-bounded

  - id: Q-4.4-why-restrict
    type: mc
    objectives: [OBJ-4.4-2]
    qualitative: true
    level: mid
    prompt: >-
      כדי להגדיר את $\arcsin$ מצמצמים את הסינוס לקטע $\left[-\frac\pi2,\frac\pi2\right]$. למה?
    choices:
      - text: 'בקטע הזה הסינוס חד-חד-ערכי ומקבל כל ערך ב-$[-1,1]$'
        correct: true
        feedback: >-
          נכון. בלי צמצום, ל-$\sin x=\frac12$ יש אינסוף פתרונות, ו"ההפוכה" לא הייתה יודעת איזה מהם להחזיר.
      - text: 'מחוץ לקטע הזה הסינוס אינו מוגדר'
        feedback: >-
          הסינוס מוגדר לכל $x$. הבעיה היא שהוא חוזר על ערכיו, ולכן אין לו הפוכה על כל הישר.
        misconception: MC-c4-inverse-needs-one-to-one
      - text: 'כי זה המחזור של הסינוס'
        feedback: >-
          המחזור של הסינוס הוא $2\pi$, והקטע באורך $\pi$. בוחרים קטע שבו הסינוס עולה, ולא מחזור שלם (שבו כל ערך מתקבל פעמיים).
        misconception: MC-c4-inverse-needs-one-to-one

  - id: Q-4.4-arctan-facts
    type: multi
    objectives: [OBJ-4.4-2]
    qualitative: true
    level: mid
    prompt: >-
      אילו מהטענות על $\arctan$ נכונות? סמנו את כולן.
    choices:
      - text: '$\arctan$ מוגדרת לכל $x$ ממשי'
        correct: true
        feedback: 'נכון. הטנגנס מקבל כל ערך ממשי ב-$\left(-\frac\pi2,\frac\pi2\right)$.'
      - text: '$\arctan x\to\frac\pi2$ כש-$x\to\infty$'
        correct: true
        feedback: 'נכון. האסימפטוטות האנכיות של הטנגנס הופכות לאסימפטוטות אופקיות $y=\pm\frac\pi2$ של ההפוכה.'
      - text: '$\arctan(\tan x)=x$ לכל $x$ שבו $\tan x$ מוגדר'
        feedback: >-
          רק ל-$x\in\left(-\frac\pi2,\frac\pi2\right)$. למשל $\arctan(\tan\pi)=\arctan0=0\ne\pi$.
        misconception: MC-c4-inverse-range-ignored
      - text: 'התמונה של $\arctan$ היא $(-\pi,\pi)$'
        feedback: >-
          התמונה היא $\left(-\frac\pi2,\frac\pi2\right)$, הקטע שאליו צמצמנו את הטנגנס.
        misconception: MC-c4-arcsin-arccos-range-swap

  - id: Q-4.4-arcsin-sin-value
    type: numeric
    objectives: [OBJ-4.4-3]
    level: mid
    prompt: >-
      חשבו את $\arcsin\!\left(\sin\frac{3\pi}{4}\right)$. (אפשר לכתוב ערך מדויק, כמו 5π/6 או 3√2)
    answer: 0.7853981633974483
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac\pi4$. $\sin\frac{3\pi}4=\frac{\sqrt2}2$, ו-$\arcsin\frac{\sqrt2}2=\frac\pi4$, הזווית שבקטע $\left[-\frac\pi2,\frac\pi2\right]$.
    wrongFeedback: >-
      חשבו קודם את $\sin\frac{3\pi}4$, ואז את $\arcsin$ שלו: הזווית בקטע $\left[-\frac\pi2,\frac\pi2\right]$.
    commonWrong:
      - value: 2.356194490192345
        feedback: >-
          $\frac{3\pi}4$ אינה בטווח של $\arcsin$. הפונקציות מבטלות זו את זו רק בקטע $\left[-\frac\pi2,\frac\pi2\right]$.
        misconception: MC-c4-inverse-range-ignored

  - id: Q-4.4-arcsin-sin-claim
    type: twotier
    objectives: [OBJ-4.4-3]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא נכון: $\sin(\arcsin y)=y$ לכל $y\in[-1,1]$, אבל $\arcsin(\sin x)=x$ **לא** לכל $x$ ממשי.
    choices:
      - text: 'נכון'
        correct: true
        feedback: >-
          נכון. $\arcsin y$ היא זווית שהסינוס שלה $y$, ולכן הכיוון הראשון תמיד עובד. בכיוון השני $\arcsin$ מחזירה רק זוויות
          ב-$\left[-\frac\pi2,\frac\pi2\right]$.
      - text: 'לא נכון: שתי הזהויות נכונות תמיד'
        feedback: >-
          ב-$x=\pi$: $\arcsin(\sin\pi)=\arcsin0=0\ne\pi$.
        misconception: MC-c4-inverse-range-ignored
    reasons:
      - text: 'התמונה של $\arcsin$ היא $\left[-\frac\pi2,\frac\pi2\right]$, ולכן $\arcsin(\sin x)$ תמיד בקטע הזה'
        correct: true
        feedback: 'בדיוק. ל-$x$ מחוץ לקטע, $\arcsin(\sin x)$ היא זווית אחרת עם אותו סינוס.'
      - text: '$\arcsin$ ו-$\sin$ הפוכות, ולכן מבטלות זו את זו בכל סדר'
        feedback: >-
          הפוכות רק אחרי שמצמצמים את הסינוס. מחוץ לקטע הצמצום הן אינן מבטלות.
        misconception: MC-c4-inverse-range-ignored

  - id: Q-4.4-cos-arcsin
    type: expr
    objectives: [OBJ-4.4-3]
    level: mid
    prompt: >-
      פשטו את $\cos(\arcsin x)$ לביטוי אלגברי ב-$x$, ל-$-1\le x\le1$ (במשתנה x).
    answer: 'sqrt(1 - x^2)'
    answerTex: '$\cos(\arcsin x)=\sqrt{1-x^2}$'
    variables: [x]
    domain: [-0.9, 0.9]
    correctFeedback: >-
      נכון. $\theta=\arcsin x$ מקיימת $\sin\theta=x$ ו-$\theta\in\left[-\frac\pi2,\frac\pi2\right]$, שם $\cos\theta\ge0$. לכן
      $\cos\theta=\sqrt{1-\sin^2\theta}=\sqrt{1-x^2}$.
    wrongFeedback: >-
      סמנו $\theta=\arcsin x$ והשתמשו ב-$\cos^2\theta+\sin^2\theta=1$. איזה סימן יש ל-$\cos\theta$ בקטע של $\theta$?
    commonWrong:
      - expr: '-sqrt(1 - x^2)'
        feedback: >-
          $\arcsin x$ בקטע $\left[-\frac\pi2,\frac\pi2\right]$, שם הקוסינוס אי-שלילי. בדיקה: $\cos(\arcsin0)=\cos0=1$.
        misconception: MC-c4-cos-arcsin-sign
    hints: ['ציירו משולש ישר-זווית עם יתר 1 וניצב $x$ מול הזווית.']

  - id: Q-4.4-oscillation
    type: expr
    objectives: [OBJ-4.4-1]
    level: exam
    prompt: >-
      גוף על קפיץ מתנודד סביב הגובה 1 מ׳, באמפליטודה 3 מ׳ ובמחזור 4 שניות, וברגע $t=0$ הוא בנקודה הגבוהה ביותר. כתבו את
      הגובה שלו $y(t)$ כפונקציה של הזמן (במשתנה t).
    answer: '1 + 3*cos(pi*t/2)'
    answerTex: '$y(t)=1+3\cos\frac{\pi t}{2}$'
    variables: [t]
    domain: [0, 4]
    correctFeedback: >-
      נכון. קוסינוס מתחיל במקסימום; מחזור 4 פירושו $kt$ גדל ב-$2\pi$ כש-$t$ גדל ב-4, ולכן $k=\frac{2\pi}4=\frac\pi2$; האמפליטודה
      3 וקו האמצע 1. בדיקה: $y(0)=4$, $y(2)=-2$, $y(4)=4$.
    wrongFeedback: >-
      בחרו בין סינוס לקוסינוס לפי מה שקורה ב-$t=0$, ומצאו את $k$ מהמחזור: $\frac{2\pi}{k}=4$.
    commonWrong:
      - expr: '1 + 3*cos(8*pi*t)'
        feedback: >-
          $k=2\pi\cdot4$ נותן מחזור $\frac{2\pi}{8\pi}=\frac14$ שנייה, קצר פי 16. המחזור הוא $\frac{2\pi}k$, ולכן $k=\frac{2\pi}{4}$.
        misconception: MC-c4-period-scaling
      - expr: '1 + 3*cos(4*t)'
        feedback: >-
          המספר בתוך הקוסינוס אינו המחזור: $\cos(4t)$ חוזרת אחרי $\frac{2\pi}4\approx1.57$ שניות. צריך $k$ עם $\frac{2\pi}k=4$.
        misconception: MC-c4-period-scaling
      - expr: '1 + 3*sin(pi*t/2)'
        feedback: >-
          $\sin$ מתחיל בקו האמצע ($y(0)=1$), לא בנקודה הגבוהה. גוף שמתחיל בשיא מתואר בקוסינוס.
        misconception: MC-c0-sin-cos-swap

  - id: Q-4.4-tan-arccos
    type: expr
    objectives: [OBJ-4.4-3]
    level: exam
    prompt: >-
      פשטו את $\tan(\arccos x)$ לביטוי אלגברי ב-$x$, ל-$0<x\le1$ (במשתנה x).
    answer: 'sqrt(1 - x^2)/x'
    answerTex: '$\tan(\arccos x)=\frac{\sqrt{1-x^2}}{x}$'
    variables: [x]
    domain: [0.2, 0.9]
    correctFeedback: >-
      נכון. $\theta=\arccos x\in\left[0,\frac\pi2\right)$ כש-$0<x\le1$, ושם $\sin\theta=\sqrt{1-x^2}\ge0$. לכן
      $\tan\theta=\frac{\sin\theta}{\cos\theta}=\frac{\sqrt{1-x^2}}{x}$. בדיקה: $x=1$ נותן $\tan0=0$.
    wrongFeedback: >-
      במשולש עזר: $\cos\theta=x$ פירושו ניצב $x$ **ליד** הזווית ויתר 1. מה הניצב שמולה?
    commonWrong:
      - expr: 'x/sqrt(1 - x^2)'
        feedback: >-
          זה $\cot\theta$: שמתם את $x$ מול הזווית. בדיקה ב-$x=1$: $\tan(\arccos1)=\tan0=0$, והביטוי הזה אינו מוגדר שם.
        misconception: MC-c4-triangle-legs-swap

  - id: Q-4.4-arctan-sum
    type: numeric
    objectives: [OBJ-4.4-3]
    level: exam
    prompt: >-
      חשבו את $\arctan1+\arctan2+\arctan3$. (רמז: נוסחת הטנגנס של סכום. אפשר לכתוב למשל pi/2.)
    answer: 3.141592653589793
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\pi$. $\tan(\arctan2+\arctan3)=\frac{2+3}{1-6}=-1$, והסכום $\arctan2+\arctan3$ בין $\frac\pi2$ ל-$\pi$ (כל מחובר
      בין $\frac\pi4$ ל-$\frac\pi2$), ולכן הוא $\frac{3\pi}4$. ועוד $\arctan1=\frac\pi4$: סך הכול $\pi$.
    wrongFeedback: >-
      חשבו את $\tan(\alpha+\beta)$ ל-$\alpha=\arctan2$, $\beta=\arctan3$, וקבעו באיזה רביע הסכום, לפי גודלם של $\alpha$ ו-$\beta$.
    commonWrong:
      - value: 1.4056476493802699
        feedback: >-
          זה $\arctan6$: חיברתם את הארגומנטים. $\arctan$ אינה לינארית; הטנגנס של סכום הוא $\frac{a+b}{1-ab}$.
        misconception: MC-c4-arctan-additive
      - value: 0
        feedback: >-
          קיבלתם $\arctan2+\arctan3=\arctan(-1)=-\frac\pi4$, ואז $-\frac\pi4+\frac\pi4=0$. אבל $\arctan2+\arctan3$ חיובי ובין
          $\frac\pi2$ ל-$\pi$: הזווית שם עם טנגנס $-1$ היא $\frac{3\pi}4$, לא הערך הראשי $-\frac\pi4$.
        misconception: MC-c4-inverse-range-ignored
