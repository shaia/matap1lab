  - id: Q-5.3-value-at-2
    type: numeric
    objectives: [OBJ-5.3-3]
    level: exam
    prompt: >-
      תהי $f(x)=x\sqrt{x^2+a}$, כש-$a>0$ קבוע. ידוע ש-$f'(2)=\frac{13}{3}$. מצאו את $a$.
    answer: 5
    tolerance: 0.001
    correctFeedback: >-
      נכון. $f'(x)=\sqrt{x^2+a}+\frac{x^2}{\sqrt{x^2+a}}=\frac{2x^2+a}{\sqrt{x^2+a}}$, וב-2: $\frac{8+a}{\sqrt{4+a}}=\frac{13}{3}$.
      עם $s=4+a$ ובהעלאה בריבוע: $9(s+4)^2=169s$, כלומר $9s^2-97s+144=0$, ולכן $s=9$ או $s=\frac{16}{9}$. הפתרון
      השני נותן $a=-\frac{20}{9}<0$, ולכן $a=5$. בדיקה: $\frac{13}{\sqrt9}=\frac{13}{3}$.
    wrongFeedback: >-
      גזרו בכלל המכפלה עם $u=x$ ו-$v=\sqrt{x^2+a}$, ו-$v'$ בכלל השרשרת; הציבו $x=2$, וקבלו משוואה ב-$a$. אל תשכחו את
      התנאי $a>0$.
    commonWrong:
      - value: 12.7179618739289
        feedback: >-
          זה מה שיוצא מ-$\sqrt{4+a}+\frac{1}{\sqrt{4+a}}=\frac{13}{3}$: בנגזרת של השורש חסר הכופל $(x^2+a)'=2x$, כלומר
          כתבתם $\frac{1}{2\sqrt{x^2+a}}$ בלבד.
        misconception: MC-c5-chain-missing-inner
      - value: -2.22222222222222
        feedback: >-
          $a=-\frac{20}{9}$ הוא הפתרון השני של המשוואה הריבועית, והוא אכן נותן $f'(2)=\frac{13}{3}$, אבל הוא שלילי. הנתון
          $a>0$ פוסל אותו.

  - id: Q-5.3-nested-exp
    type: expr
    objectives: [OBJ-5.3-2]
    level: exam
    prompt: 'גזרו: $f(x)=\sin\!\big(e^{x^2}\big)$. כתבו את $f''(x)$.'
    answer: '2*x*exp(x^2)*cos(exp(x^2))'
    answerTex: '$f''(x)=\cos\!\big(e^{x^2}\big)\cdot e^{x^2}\cdot2x$'
    variables: [x]
    domain: [-1.2, 1.2]
    correctFeedback: >-
      נכון. שלוש שכבות: $\sin$, האקספוננט ו-$x^2$. כל אחת נגזרת בערך של מה שבתוכה: $\cos(e^{x^2})$, $e^{x^2}$, $2x$.
    wrongFeedback: >-
      כתבו $y=\sin u$, $u=e^{w}$, $w=x^2$, וכפלו $\cos u\cdot e^w\cdot2x$.
    commonWrong:
      - expr: 'exp(x^2)*cos(exp(x^2))'
        feedback: >-
          חסרה הנגזרת של השכבה הפנימית ביותר, $(x^2)'=2x$.
        misconception: MC-c5-chain-missing-inner
      - expr: 'cos(exp(x^2))'
        feedback: >-
          גזרתם רק את הסינוס. אחריו באות הנגזרות של $e^{x^2}$ ושל $x^2$.
        misconception: MC-c5-chain-missing-inner
      - expr: 'cos(2*x*exp(x^2))'
        feedback: >-
          הכנסתם את הנגזרת של הפנימית לתוך הקוסינוס. בתוך $\cos$ נשאר $e^{x^2}$ כמו שהוא.
        misconception: MC-c5-chain-inner-inside
