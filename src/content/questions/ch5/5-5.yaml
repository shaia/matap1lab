# Lesson 5.5 — the derivative table and its uses.
# Objectives (src/course.ts):
#   OBJ-5.5-1  differentiate every elementary function in the table, including the hyperbolic ones
#   OBJ-5.5-2  compute related rates in physical and geometric problems
#   OBJ-5.5-3  use the derivative to find intervals of increase and decrease and extreme points
# Every key is recomputed in screens/tools/checks_ch5.py; the keys revised in the 5.5 review in screens/tools/lesson-5-5.py.
chapter: 5
questions:
  - id: Q-5.5-cosh
    type: expr
    objectives: [OBJ-5.5-1]
    level: basic
    prompt: 'גזרו: $f(x)=\cosh(3x)$. כתבו את $f''(x)$ (אפשר להקליד sinh ו-cosh).'
    answer: '3*sinh(3*x)'
    answerTex: '$f''(x)=3\sinh(3x)$'
    variables: [x]
    domain: [-1.5, 1.5]
    correctFeedback: >-
      נכון. הנגזרת של $\cosh$ היא $\sinh$, בלי מינוס, כפול הנגזרת של השכבה הפנימית, $(3x)'=3$.
    wrongFeedback: >-
      מהטבלה, $(\cosh x)'=\sinh x$, בלי מינוס. כאן יש שכבה פנימית, $3x$, ולפי כלל השרשרת כופלים בנגזרת שלה.
    commonWrong:
      - expr: '-3*sinh(3*x)'
        feedback: >-
          המינוס שייך ל-$(\cos x)'$. ל-$\cosh$: $\left(\frac{e^x+e^{-x}}{2}\right)'=\frac{e^x-e^{-x}}{2}=\sinh x$.
        misconception: MC-c5-cosh-sign
      - expr: 'sinh(3*x)'
        feedback: >-
          חסרה הנגזרת הפנימית $(3x)'=3$.
        misconception: MC-c5-chain-missing-inner

  - id: Q-5.5-two-to-x
    type: expr
    objectives: [OBJ-5.5-1]
    level: basic
    prompt: 'גזרו: $f(x)=2^x$. כתבו את $f''(x)$ (אפשר להקליד ln).'
    answer: '2^x*log(2)'
    answerTex: '$f''(x)=2^x\ln2$'
    variables: [x]
    domain: [-2, 2]
    correctFeedback: >-
      נכון (כך גם בסיכומי ההרצאות שהקורס נבנה לפיהם). $2^x=e^{x\ln2}$, ובכלל השרשרת $(2^x)'=e^{x\ln2}\cdot\ln2$.
    wrongFeedback: >-
      כתבו $2^x=e^{x\ln 2}$ וגזרו בכלל השרשרת.
    commonWrong:
      - expr: 'x*2^(x - 1)'
        feedback: >-
          זה כלל החזקה, שמתאים לבסיס משתנה ומעריך קבוע. כאן הבסיס 2 קבוע והמעריך $x$ משתנה.
        misconception: MC-c5-power-rule-on-exponential
      - expr: '2^x'
        feedback: >-
          רק ל-$e^x$ הנגזרת שווה לפונקציה. לבסיס $a$ יש כופל $\ln a$, וכאן $\ln2\approx0.69$.
        misconception: MC-c5-base-ignored

  - id: Q-5.5-log10
    type: numeric
    objectives: [OBJ-5.5-1]
    level: basic
    prompt: >-
      תהי $f(x)=\log_{10}x$. חשבו את $f'(1)$.
    answer: 0.434294481903252
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{1}{\ln10}\approx0.434$. $\log_{10}x=\frac{\ln x}{\ln10}$, ולכן $f'(x)=\frac{1}{x\ln10}$.
    wrongFeedback: >-
      העבירו לבסיס $e$: $\log_{10}x=\frac{\ln x}{\ln 10}$, ו-$\ln10$ הוא קבוע.
    commonWrong:
      - value: 1
        feedback: >-
          זו הנגזרת של $\ln x$ ב-1. בבסיס 10 יש כופל $\frac{1}{\ln10}$.
        misconception: MC-c5-base-ignored

  - id: Q-5.5-balloon
    type: numeric
    objectives: [OBJ-5.5-2]
    level: basic
    prompt: >-
      ממלאים בלון כדורי, והרדיוס שלו גדל בקצב קבוע של $2$ ס״מ לשנייה. באיזה קצב (בסמ״ק לשנייה) גדל הנפח
      $V=\frac43\pi r^3$ ברגע שבו $r=5$ ס״מ?
    answer: 628.318530717959
    tolerance: 0.001
    correctFeedback: >-
      נכון, $200\pi\approx628$ סמ״ק לשנייה. גוזרים לפי הזמן: $\frac{dV}{dt}=4\pi r^2\frac{dr}{dt}=4\pi\cdot25\cdot2$.
    wrongFeedback: >-
      גזרו את $V=\frac43\pi r^3$ לפי $t$, כש-$r=r(t)$ (כלל השרשרת), ורק אחר כך הציבו $r=5$ ו-$\frac{dr}{dt}=2$.
    commonWrong:
      - value: 0
        feedback: >-
          הצבתם $r=5$ **לפני** הגזירה: $V=\frac{500\pi}{3}$ הוא מספר, ונגזרתו 0. הרדיוס משתנה; מציבים רק בסוף.
        misconception: MC-c5-related-substitute-early
      - value: 2
        feedback: >-
          הנפח אינו גדל באותו קצב כמו הרדיוס: הקשר ביניהם $\frac{dV}{dt}=4\pi r^2\frac{dr}{dt}$, ויש לו יחידות אחרות.
        misconception: MC-c5-related-same-rate
      - value: 314.159265358979
        feedback: >-
          $100\pi=4\pi r^2$ ב-$r=5$ הוא $\frac{dV}{dr}$: קצב השינוי של הנפח לכל ס״מ של רדיוס. לפי כלל השרשרת חסר הכופל
          $\frac{dr}{dt}=2$: $\frac{dV}{dt}=\frac{dV}{dr}\cdot\frac{dr}{dt}$.
        misconception: MC-c5-chain-missing-inner

  - id: Q-5.5-decreasing
    type: mc
    objectives: [OBJ-5.5-3]
    level: basic
    prompt: >-
      באיזה תחום יורדת הפונקציה $f(x)=x^3-3x$?
    choices:
      - text: '$[-1,1]$'
        correct: true
        feedback: >-
          נכון. $f'(x)=3x^2-3=3(x-1)(x+1)$, שלילית בדיוק כש-$-1<x<1$.
      - text: '$(-\infty,-1]$ ו-$[1,\infty)$'
        feedback: >-
          שם $f'>0$, ולכן $f$ **עולה**. ירידה היא המקום שבו הנגזרת שלילית.
        misconception: MC-c5-sign-change-direction
      - text: '$(-\infty,-\sqrt3]$ ו-$[0,\sqrt3]$'
        feedback: >-
          שם $f\le0$: הגרף מתחת לציר, אבל זה הסימן של $f$, לא הכיוון שלה. למשל $f(-2)=-2<f(-\sqrt3)=0$: ב-$(-\infty,-\sqrt3]$
          היא **עולה**. ירידה נקבעת לפי הסימן של $f'$.
        misconception: MC-c4-graph-increasing-positive
      - text: '$[-\sqrt3,\sqrt3]$'
        feedback: >-
          $\pm\sqrt3$ ו-0 הם האפסים של $f$ עצמה, לא של $f'$. תחומי עלייה וירידה נקבעים לפי האפסים והסימן של $f'$.
        misconception: MC-c5-fprime-graph-is-f

  - id: Q-5.5-x-cubed
    type: twotier
    objectives: [OBJ-5.5-3]
    qualitative: true
    level: basic
    prompt: >-
      ל-$f(x)=x^3$ מתקיים $f'(0)=0$. נכון או לא נכון: ב-$x=0$ יש ל-$f$ נקודת קיצון מקומית.
    choices:
      - text: 'לא נכון'
        correct: true
        feedback: >-
          נכון. $f'(x)=3x^2\ge0$ משני הצדדים, ולכן $f$ עולה דרך 0: ערכים שליליים משמאל, חיוביים מימין.
      - text: 'נכון'
        feedback: >-
          $f'(x_0)=0$ הוא תנאי הכרחי לקיצון בנקודה פנימית, לא מספיק. כאן הנגזרת אינה מחליפה סימן.
        misconception: MC-c5-fprime-zero-extremum
    reasons:
      - text: 'הסימן של $f''$ אינו מתחלף ב-0: $f''\ge0$ משני הצדדים'
        correct: true
        feedback: 'בדיוק. קיצון דורש החלפת סימן של הנגזרת (או בדיקה אחרת).'
      - text: 'בכל נקודה שבה $f''=0$ יש קיצון, ולכן גם כאן'
        feedback: >-
          לא כל נקודה שבה $f'=0$ היא קיצון. ליד 0 יש ל-$x^3$ גם ערכים קטנים מ-$f(0)=0$ וגם גדולים ממנו.
        misconception: MC-c5-fprime-zero-extremum
      - text: 'ל-$x^3$ אין נגזרת ב-0'
        feedback: >-
          $x^3$ פולינום, גזירה בכל מקום, ו-$f'(0)=0$. הגרף שטוח שם, ובכל זאת אין קיצון: $f'=0$ אינו מבטיח קיצון.
        misconception: MC-c5-fprime-zero-extremum

  - id: Q-5.5-table
    type: multi
    objectives: [OBJ-5.5-1]
    qualitative: true
    level: mid
    prompt: >-
      אילו מהשורות הבאות בטבלת הנגזרות נכונות? סמנו את כולן.
    choices:
      - text: "$(\\sinh x)'=\\cosh x$"
        correct: true
        feedback: 'נכון: $\left(\frac{e^x-e^{-x}}{2}\right)''=\frac{e^x+e^{-x}}{2}$.'
      - text: "$(\\ln|x|)'=\\frac1x$ לכל $x\\ne0$"
        correct: true
        feedback: >-
          נכון. ל-$x<0$: $\ln|x|=\ln(-x)$, ובכלל השרשרת $\frac{1}{-x}\cdot(-1)=\frac1x$.
      - text: "$(\\tan x)'=\\frac{1}{\\cos^2x}$"
        correct: true
        feedback: 'נכון: כלל המנה נותן $\frac{\cos^2x+\sin^2x}{\cos^2x}$.'
      - text: "$(\\cosh x)'=-\\sinh x$"
        feedback: >-
          אין מינוס: $(\cosh x)'=\sinh x$. המינוס של $(\cos x)'$ אינו עובר להיפרבוליות.
        misconception: MC-c5-cosh-sign
      - text: "$(a^x)'=x\\,a^{x-1}$"
        feedback: >-
          זה כלל החזקה, שמתאים למעריך קבוע. $(a^x)'=a^x\ln a$.
        misconception: MC-c5-power-rule-on-exponential
      - text: "$(\\arccos x)'=\\frac{1}{\\sqrt{1-x^2}}$"
        feedback: >-
          חסר מינוס: $\arccos$ יורדת, ו-$(\arccos x)'=-\frac{1}{\sqrt{1-x^2}}$.
        misconception: MC-c5-arccos-sign

  - id: Q-5.5-tanh
    type: expr
    objectives: [OBJ-5.5-1]
    level: mid
    prompt: >-
      גזרו: $f(x)=\ln(\tanh x)$, כש-$x>0$. כתבו את $f'(x)$ בעזרת sinh ו-cosh.
    answer: '1/(sinh(x)*cosh(x))'
    answerTex: '$f''(x)=\dfrac{1}{\tanh x}\cdot\dfrac{1}{\cosh^2x}=\dfrac{\cosh x}{\sinh x}\cdot\dfrac{1}{\cosh^2x}=\dfrac{1}{\sinh x\cosh x}$'
    variables: [x]
    domain: [0.3, 2]
    correctFeedback: >-
      נכון. שתי שכבות: $(\ln w)'=\frac1w$ עם $w=\tanh x$, כפול $(\tanh x)'=\frac{1}{\cosh^2x}$. בצורה אחרת:
      $\frac{2}{\sinh2x}$.
    wrongFeedback: >-
      החיצונית $\ln w$, הפנימית $w=\tanh x$. גזרו כל אחת מהטבלה וכפלו; אחר כך כתבו $\tanh x=\frac{\sinh x}{\cosh x}$
      ופשטו.
    commonWrong:
      - expr: '1/tanh(x)'
        feedback: >-
          גזרתם רק את הלוגריתם. לפי כלל השרשרת כופלים גם בנגזרת של הפנימית, $(\tanh x)'=\frac{1}{\cosh^2x}$.
        misconception: MC-c5-chain-missing-inner

  - id: Q-5.5-ladder
    type: numeric
    objectives: [OBJ-5.5-2]
    level: basic
    prompt: >-
      סולם באורך 5 מ׳ נשען על קיר אנכי. הקצה התחתון מחליק מהקיר על הרצפה במהירות 1 מ׳ לשנייה. מהי המהירות (במ׳
      לשנייה, עם סימן) של הקצה העליון ברגע שבו הקצה התחתון במרחק 3 מ׳ מהקיר? (מהירות שלילית: הקצה יורד.)
    answer: -0.75
    tolerance: 0.001
    correctFeedback: >-
      נכון. $x^2+y^2=25$ בכל רגע; גזירה לפי $t$: $2xx'+2yy'=0$. ברגע הנתון $x=3$, $y=4$, $x'=1$, ולכן
      $y'=-\frac{3\cdot1}{4}$.
    wrongFeedback: >-
      כתבו קשר שנכון בכל רגע ($x^2+y^2=25$), גזרו לפי הזמן, ורק אז הציבו $x=3$, $y=4$, $x'=1$.
    commonWrong:
      - value: -1
        feedback: >-
          הקצה העליון אינו זז באותה מהירות כמו התחתון: $y'=-\frac xy x'$, והיחס תלוי במצב.
        misconception: MC-c5-related-same-rate
      - value: 0
        feedback: >-
          הצבתם $x=3$, $y=4$ לפני הגזירה: מספרים קבועים, ונגזרתם 0. גוזרים את הקשר הכללי ומציבים אחר כך.
        misconception: MC-c5-related-substitute-early
      - value: 0.75
        feedback: >-
          הגודל נכון, הסימן לא. הגובה $y$ של הקצה העליון קטן, ולכן הקצב שלו שלילי: $y'=-\frac{x}{y}x'=-\frac34$. המינוס בא
          מהעברת אגף ב-$2xx'+2yy'=0$.
        misconception: MC-c5-related-sign

  - id: Q-5.5-related-steps
    type: rank
    objectives: [OBJ-5.5-2]
    level: mid
    prompt: >-
      סדרו את שלבי הפתרון של בעיית קצבים קשורים (למשל מים שנשפכים לתוך מיכל חרוטי).
    help: 'גררו את השלבים לסדר הנכון, מהראשון לאחרון.'
    items:
      - id: draw
        label: 'מציירים את המצב ברגע כללי, לא ברגע המבוקש'
      - id: vars
        label: 'מסמנים באותיות את הגדלים שמשתנים, ורושמים את הנתונים ואת המבוקש כנגזרות לפי $t$'
      - id: relation
        label: 'כותבים משוואה שקושרת את הגדלים ונכונה בכל רגע (גיאומטריה, משולשים דומים)'
      - id: diff
        label: 'גוזרים את שני האגפים לפי הזמן $t$, בכלל השרשרת'
      - id: plug
        label: 'מציבים בסוף את ערכי הרגע ואת הקצבים הנתונים, פותרים לקצב המבוקש ובודקים סימן ויחידות'
    order: [draw, vars, relation, diff, plug]
    correctFeedback: >-
      נכון. הצעד הקריטי הוא הסדר "גוזרים ואז מציבים": ערכי הרגע הם מספרים, ונגזרתם 0.
    wrongFeedback: >-
      מה יקרה לנגזרת אם מציבים את ערכי הרגע לפני הגזירה? ומה צריך להיות כתוב לפני שאפשר לגזור?

  - id: Q-5.5-cone-substitute
    type: twotier
    objectives: [OBJ-5.5-2]
    qualitative: true
    level: mid
    prompt: >-
      מים נשפכים למיכל בצורת חרוט הפוך, שהרדיוס שלו בגובה $h$ הוא $r=\frac h2$. כדי למצוא את קצב העלייה של המים, אפשר
      להציב $r=\frac h2$ בנוסחת הנפח $V=\frac13\pi r^2h$ **לפני** שגוזרים לפי $t$. נכון או לא נכון?
    choices:
      - text: 'נכון'
        correct: true
        feedback: >-
          נכון. $r=\frac h2$ נכון **בכל רגע** (משולשים דומים), ולכן מותר להציב: $V=\frac{\pi h^3}{12}$, ואז לגזור.
      - text: 'לא נכון'
        feedback: >-
          אסור להציב לפני הגזירה **ערכים של רגע מסוים**. $r=\frac h2$ אינו ערך אלא קשר שנכון תמיד, וההצבה שלו מקטינה את
          מספר המשתנים.
        misconception: MC-c5-related-substitute-early
    reasons:
      - text: 'הקשר $r=\frac h2$ נכון בכל רגע, ולכן גם הנגזרות שלו נכונות: $r''=\frac{h''}2$'
        correct: true
        feedback: 'בדיוק. מה שאסור הוא להחליף גודל משתנה במספר, למשל $r=2$, לפני הגזירה.'
      - text: 'מותר תמיד להציב כל ערך לפני הגזירה'
        feedback: >-
          לא: הצבת $h=4$ ו-$r=2$ לפני הגזירה הופכת את $V$ למספר, ונגזרתו 0. מציבים רק קשרים כלליים.
        misconception: MC-c5-related-substitute-early
      - text: 'הרדיוס של המים קבוע, כי המיכל לא משנה צורה'
        feedback: >-
          המיכל קבוע, אבל הרדיוס של **פני המים** גדל כשהמים עולים. אילו $r$ היה קבוע, היינו מקבלים קצב שגוי.
        misconception: MC-c5-related-substitute-early

  - id: Q-5.5-closed-max
    type: numeric
    objectives: [OBJ-5.5-3]
    level: mid
    prompt: >-
      מהו הערך הגדול ביותר של $f(x)=x^3-12x$ בקטע הסגור $[-3,5]$?
    answer: 65
    tolerance: 0.001
    correctFeedback: >-
      נכון. $f'(x)=3(x-2)(x+2)$, והנקודות הקריטיות $\pm2$ שתיהן בתוך הקטע: $f(-2)=16$, $f(2)=-16$. בקצוות $f(-3)=9$
      ו-$f(5)=125-60=65$. הגדול ביותר 65, בקצה $x=5$.
    wrongFeedback: >-
      בקטע סגור המועמדים הם הנקודות הקריטיות שבתוך הקטע **וקצות הקטע**. חשבו את $f$ בכולם והשוו.
    commonWrong:
      - value: 16
        feedback: >-
          $f(-2)=16$ הוא מקסימום **מקומי**, בנקודה שבה $f'=0$. אבל בקצה $x=5$ הערך 65 גדול ממנו: קצות הקטע הם מועמדים.
        misconception: MC-c5-endpoints-forgotten

  - id: Q-5.5-fprime-formula
    type: mc
    objectives: [OBJ-5.5-3]
    qualitative: true
    level: mid
    prompt: >-
      על פונקציה גזירה $f$ ידוע רק ש-$f'(x)=(x+1)^2(x-3)$. מה נכון?
    choices:
      - text: 'ב-$x=3$ יש ל-$f$ מינימום מקומי, וב-$x=-1$ אין קיצון'
        correct: true
        feedback: >-
          נכון. ב-3 הגורם $x-3$ מחליף סימן ממינוס לפלוס (ירידה ואחריה עלייה). ב-$x=-1$ הנגזרת 0, אבל $(x+1)^2\ge0$,
          ולכן $f'<0$ משני הצדדים: $f$ ממשיכה לרדת.
      - text: 'ב-$x=3$ יש מקסימום מקומי, וב-$x=-1$ מינימום מקומי'
        feedback: >-
          משמאל ל-3, $f'<0$ ($f$ יורדת), ומימין $f'>0$ (עולה): זה מינימום. ב-$x=-1$ הנגזרת אינה מחליפה סימן.
        misconception: MC-c5-sign-change-direction
      - text: 'יש ל-$f$ קיצון גם ב-$x=3$ וגם ב-$x=-1$, כי שם $f''=0$'
        feedback: >-
          $f'=0$ לא מספיק. ב-$x=-1$ הגורם $(x+1)^2$ אינו שלילי, ולכן $f'$ אינה מחליפה סימן שם.
        misconception: MC-c5-fprime-zero-extremum
      - text: '$f(3)=0$ ו-$f(-1)=0$'
        feedback: >-
          האפסים של $f'$ אינם אפסים של $f$. מ-$f'$ אפשר לדעת איפה $f$ עולה ויורדת, לא את ערכיה.
        misconception: MC-c5-fprime-graph-is-f

  - id: Q-5.5-unique-root
    type: twotier
    objectives: [OBJ-5.5-3]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא נכון: למשוואה $x^3+x-1=0$ יש בדיוק פתרון ממשי אחד.
    choices:
      - text: 'נכון'
        correct: true
        feedback: >-
          נכון. $f(0)=-1<0<1=f(1)$ ו-$f$ רציפה, ולכן יש פתרון ב-$(0,1)$; ו-$f'(x)=3x^2+1>0$, כך ש-$f$ עולה ממש ואינה
          יכולה לחצות את 0 פעמיים.
      - text: 'לא נכון'
        feedback: >-
          לפולינום ממעלה 3 יכולים להיות עד שלושה שורשים ממשיים, אבל לזה יש אחד בלבד, כי הוא עולה ממש.
        misconception: MC-c5-cubic-three-roots
    reasons:
      - text: 'ערך הביניים נותן קיום, ו-$f''>0$ נותן יחידות'
        correct: true
        feedback: 'בדיוק: שני כלים לשתי שאלות.'
      - text: 'משפט ערך הביניים לבדו מבטיח פתרון יחיד בין 0 ל-1'
        feedback: >-
          משפט ערך הביניים נותן **קיום** בלבד; ל-$x^3-x$ בקטע $[-2,2]$ יש שלושה פתרונות. היחידות באה מהמונוטוניות.
        misconception: MC-c5-ivt-gives-uniqueness
      - text: 'כי $f''$ לא מתאפסת, אז ל-$f$ אין אפסים בכלל חוץ מאחד'
        feedback: >-
          $f'\ne0$ נותן מונוטוניות, כלומר **לכל היותר** פתרון אחד. קיום דורש עוד נימוק: החלפת סימן וערך הביניים.
        misconception: MC-c4-monotone-gives-root

  - id: Q-5.5-recip-increasing
    type: twotier
    objectives: [OBJ-5.5-3]
    qualitative: true
    level: mid
    prompt: >-
      לפונקציה $f(x)=-\frac{1}{x^3}$ (מוגדרת כש-$x\ne0$) הנגזרת היא $f'(x)=\frac{3}{x^4}$, חיובית בכל נקודה של התחום.
      נכון או לא נכון: $f$ עולה בכל תחום ההגדרה שלה, כלומר לכל $x_1<x_2$ שונים מ-0 מתקיים $f(x_1)<f(x_2)$.
    choices:
      - text: 'לא נכון'
        correct: true
        feedback: >-
          נכון. $f(-1)=1$ ו-$f(1)=-1$: הנקודה הימנית נותנת ערך קטן יותר. $f$ עולה ב-$(-\infty,0)$ ועולה ב-$(0,\infty)$,
          כל קטע לחוד.
      - text: 'נכון'
        feedback: >-
          המשפט "$f'>0$ גורר עלייה" עובד בקטע אחד. התחום כאן הוא שני קטעים, ובין $-1$ ל-1 הפונקציה אינה מוגדרת ב-0.
          בדקו: $f(-1)=1$ ו-$f(1)=-1$.
        misconception: MC-c5-monotone-on-union
    reasons:
      - text: 'התחום אינו קטע אחד, ומשפט הערך הממוצע אינו חל בקטע שמכיל את 0'
        correct: true
        feedback: 'בדיוק. בכל אחד משני הקטעים $f$ עולה, אבל לא מעבר ל-0.'
      - text: 'נגזרת חיובית בכל נקודה גוררת תמיד עלייה בכל התחום'
        feedback: >-
          רק בקטע. $-\frac1x$ ו-$-\frac{1}{x^3}$ הן דוגמאות נגדיות: הנגזרת חיובית, ובכל זאת $f(-1)>f(1)$.
        misconception: MC-c5-monotone-on-union
      - text: 'בכל נקודה של התחום המשיק עולה, ולכן כל הגרף עולה משמאל לימין'
        feedback: >-
          משיק עולה בכל נקודה מבטיח עלייה רק בתוך קטע אחד. בין $-1$ ל-1 הגרף נקטע ב-0, ושם הוא עובר מערכים חיוביים
          גדולים מאוד לערכים שליליים גדולים מאוד.
        misconception: MC-c5-monotone-on-union

  - id: Q-5.5-arcsin-combo
    type: expr
    objectives: [OBJ-5.5-1]
    level: exam
    prompt: >-
      גזרו ופשטו: $f(x)=x\arcsin x+\sqrt{1-x^2}$ בקטע $|x|<1$. כתבו את $f'(x)$ (אפשר להקליד arcsin).
    answer: 'asin(x)'
    answerTex: '$f''(x)=\arcsin x+\dfrac{x}{\sqrt{1-x^2}}-\dfrac{x}{\sqrt{1-x^2}}=\arcsin x$'
    variables: [x]
    domain: [-0.9, 0.9]
    correctFeedback: >-
      נכון. כלל המכפלה נותן $\arcsin x+\frac{x}{\sqrt{1-x^2}}$, והשורש נגזר ל-$\frac{-2x}{2\sqrt{1-x^2}}$: שני האיברים
      מתבטלים.
    wrongFeedback: >-
      גזרו את $x\arcsin x$ בכלל המכפלה ואת $\sqrt{1-x^2}$ בכלל השרשרת. צפו לביטול.
    commonWrong:
      - expr: 'asin(x) + x/sqrt(1 - x^2) + 1/(2*sqrt(1 - x^2))'
        feedback: >-
          בנגזרת של $\sqrt{1-x^2}$ חסר הכופל $(1-x^2)'=-2x$: היא $-\frac{x}{\sqrt{1-x^2}}$, לא $\frac{1}{2\sqrt{1-x^2}}$.
        misconception: MC-c5-chain-missing-inner
      - expr: '(1 - x)/sqrt(1 - x^2)'
        feedback: >-
          גזרתם את $x\arcsin x$ כמכפלת הנגזרות, $1\cdot\frac{1}{\sqrt{1-x^2}}$. כלל המכפלה הוא סכום של שני איברים.
        misconception: MC-c5-product-of-derivatives
      - expr: 'asin(x) + 2*x/sqrt(1 - x^2)'
        feedback: >-
          המינוס אבד: $(1-x^2)'=-2x$, ולכן $\left(\sqrt{1-x^2}\right)'=\frac{-2x}{2\sqrt{1-x^2}}=-\frac{x}{\sqrt{1-x^2}}$, והוא
          מבטל את $\frac{x}{\sqrt{1-x^2}}$ מכלל המכפלה במקום להכפיל אותו.

  - id: Q-5.5-log-cosh
    type: expr
    objectives: [OBJ-5.5-1]
    level: exam
    prompt: >-
      גזרו: $f(x)=\ln\big(\cosh(2x)\big)$. כתבו את $f'(x)$ (אפשר להקליד tanh, sinh, cosh).
    answer: '2*tanh(2*x)'
    answerTex: '$f''(x)=\dfrac{2\sinh(2x)}{\cosh(2x)}=2\tanh(2x)$'
    variables: [x]
    domain: [-1.5, 1.5]
    correctFeedback: >-
      נכון. שלוש שכבות: $\ln$, $\cosh$ ו-$2x$: $\frac{1}{\cosh2x}\cdot\sinh2x\cdot2$.
    wrongFeedback: >-
      $(\ln w)'=\frac1w$ בערך $w=\cosh(2x)$, כפול הנגזרת של $\cosh(2x)$, שהיא בעצמה הרכבה.
    commonWrong:
      - expr: 'tanh(2*x)'
        feedback: >-
          חסר הכופל 2 מהשכבה הפנימית ביותר, $(2x)'=2$.
        misconception: MC-c5-chain-missing-inner
      - expr: '-2*tanh(2*x)'
        feedback: >-
          הסימן הפוך: $(\cosh w)'=+\sinh w$. בדיקה: $\ln\cosh(2x)$ עולה כש-$x>0$.
        misconception: MC-c5-cosh-sign
      - expr: '1/cosh(2*x)'
        feedback: >-
          גזרתם רק את הלוגריתם. אחריו באה הנגזרת של $\cosh(2x)$, שהיא $2\sinh(2x)$.
        misconception: MC-c5-chain-missing-inner

  - id: Q-5.5-radar
    type: numeric
    objectives: [OBJ-5.5-2]
    level: exam
    prompt: >-
      מטוס טס בגובה קבוע של 6 ק״מ, במהירות 600 קמ״ש, בקו ישר שעובר בדיוק מעל צופה שעומד על הקרקע, ומתקרב אליו. באיזה
      קצב (ברדיאנים לשעה) גדלה זווית ההגבהה $\theta$, הזווית בין הקרקע לבין קו הראייה מהצופה אל המטוס, ברגע שבו המרחק
      האופקי בין הצופה למטוס הוא 8 ק״מ?
    answer: 36
    tolerance: 0.001
    correctFeedback: >-
      נכון: 36 רדיאנים לשעה, כלומר $0.01$ רדיאן לשנייה. אם $x$ המרחק האופקי, אז בכל רגע $\tan\theta=\frac6x$, כלומר
      $\theta=\arctan\frac6x$. גזירה לפי $t$:
      $\frac{d\theta}{dt}=\frac{1}{1+\frac{36}{x^2}}\cdot\left(-\frac{6}{x^2}\right)\frac{dx}{dt}=-\frac{6}{x^2+36}\cdot\frac{dx}{dt}$.
      עם $x=8$ ו-$\frac{dx}{dt}=-600$ (המרחק קטן) יוצא $\frac{6\cdot600}{100}=36$.
    wrongFeedback: >-
      סמנו ב-$x$ את המרחק האופקי. כתבו קשר בין $\theta$ ל-$x$ שנכון בכל רגע ($\tan\theta=\frac6x$), גזרו לפי $t$, ורק אז
      הציבו $x=8$ ואת $\frac{dx}{dt}$, עם הסימן הנכון.
    commonWrong:
      - value: -36
        feedback: >-
          הסימן: המטוס מתקרב, ולכן המרחק האופקי $x$ קטן, ו-$\frac{dx}{dt}=-600$, לא 600. בדיקה בציור: מטוס שמתקרב נראה
          גבוה יותר בשמיים, והזווית גדלה.
        misconception: MC-c5-related-sign
      - value: 0
        feedback: >-
          הצבתם $x=8$ לפני הגזירה: $\arctan\frac68$ הוא מספר, ונגזרתו 0. גוזרים את הקשר הכללי ומציבים בסוף.
        misconception: MC-c5-related-substitute-early

  - id: Q-5.5-distance
    type: numeric
    objectives: [OBJ-5.5-3]
    level: exam
    prompt: >-
      גוף נע על ישר, ומקומו ברגע $t$ הוא $x(t)=t^3-6t^2+9t$ (מטרים, שניות). איזו דרך (במטרים) הוא עובר בין $t=0$
      ל-$t=4$?
    answer: 12
    tolerance: 0.001
    correctFeedback: >-
      נכון. $v=3t^2-12t+9=3(t-1)(t-3)$: הגוף מחליף כיוון ב-$t=1$ וב-$t=3$. $x(0)=0$, $x(1)=4$, $x(3)=0$, $x(4)=4$, ולכן
      הדרך $4+4+4=12$.
    wrongFeedback: >-
      מצאו את כל הרגעים שבהם $v=0$ ו-$v$ מחליפה סימן: שם הגוף משנה כיוון. חשבו את המרחק בכל קטע שבו הוא נע בכיוון
      אחד, וחברו.
    commonWrong:
      - value: 4
        feedback: >-
          4 יוצא בשתי דרכים, ושתיהן מפספסות שינוי כיוון. $x(4)-x(0)=4$ הוא ההעתק, בלי לפצל בכלל. וגם פיצול באחד בלבד
          משני רגעי שינוי הכיוון נותן 4: ב-$t=1$ בלבד, $|4-0|+|4-4|=4$; ב-$t=3$ בלבד, $|0-0|+|4-0|=4$. הגוף משנה כיוון
          פעמיים, ב-$t=1$ וב-$t=3$: מפצלים בשתיהן.
        misconception: MC-c5-displacement-vs-distance

  - id: Q-5.5-rectangle
    type: numeric
    objectives: [OBJ-5.5-3]
    level: exam
    prompt: >-
      מלבן בנוי כך שהבסיס שלו על ציר $x$, סימטרי סביב ציר $y$, ושני הקודקודים העליונים שלו על הפרבולה $y=12-x^2$. מהו
      השטח הגדול ביותר שיכול להיות למלבן כזה?
    answer: 32
    tolerance: 0.001
    correctFeedback: >-
      נכון. אם הקודקוד הימני העליון ב-$(x,12-x^2)$, אז הרוחב $2x$ והגובה $12-x^2$, והשטח $A(x)=2x(12-x^2)=24x-2x^3$
      בקטע $[0,\sqrt{12}]$. $A'(x)=24-6x^2=0$ ב-$x=2$, ו-$A(2)=4\cdot8=32$; בקצוות $A=0$.
    wrongFeedback: >-
      בטאו את השטח בעזרת משתנה אחד: הקודקוד העליון הימני $(x,12-x^2)$. שימו לב שהרוחב הוא $2x$. קבעו את התחום, גזרו,
      והשוו עם הקצוות.
    commonWrong:
      - value: 16
        feedback: >-
          16 הוא השטח של חצי מלבן: לקחתם רוחב $x$ במקום $2x$, כלומר $A=x(12-x^2)$. המקסימום באותה נקודה, $x=2$, אבל
          השטח כפול: 32.
