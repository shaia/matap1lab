# Chapter 0 exam questions — original, in the style of the first week of 80114 (not taken from a real exam).
# Each is worth 25 points in lettered parts, with at least one open part graded against a model solution and a rubric.
# Every number recomputed with screens/tools/cas.py.
chapter: 0
questions:
  - id: Q-0-exam-1
    type: exam
    title: אי-שוויון עם ערך מוחלט
    prompt: >-
      נתון אי-השוויון $|x^2-4|<3x$.
    parts:
      - label: א
        points: 6
        type: numeric
        objectives: [OBJ-0.1-2]
        prompt: >-
          פתרו את המשוואה $x^2-3x-4=0$. מהו הפתרון הגדול?
        answer: 4
        tolerance: 0.001
        correctFeedback: >-
          נכון. $x^2-3x-4=(x-4)(x+1)$, והשורשים 4 ו-$-1$.
        wrongFeedback: >-
          פרקו לגורמים: שני מספרים שמכפלתם $-4$ וסכומם $-3$.
        commonWrong:
          - value: 1
            feedback: >-
              זה $\frac{-3+5}{2}$: כתבתם $b$ במקום $-b$. השורשים של $x^2+3x-4$ הם 1 ו-$-4$; כאן $b=-3$, ולכן $-b=3$.
            misconception: MC-c0-quadratic-formula

      - label: ב
        points: 6
        type: mc
        objectives: [OBJ-0.1-3]
        prompt: >-
          מהו הפתרון של $4-x^2<3x$ בתוך הקטע $-2<x<2$?
        choices:
          - text: '$(1,2)$'
            correct: true
            feedback: >-
              נכון. $x^2+3x-4>0$, כלומר $(x+4)(x-1)>0$: $x<-4$ או $x>1$. החיתוך עם $(-2,2)$ הוא $(1,2)$.
          - text: '$(-2,1)$'
            feedback: >-
              זה החלק שבו $x^2+3x-4<0$: הסימן התהפך. ב-$x=0$: $4<0$ אינו נכון.
            misconception: MC-c0-quadratic-ineq-outside
          - text: '$(-4,1)$'
            feedback: >-
              זה הקטע שבין השורשים, שם $x^2+3x-4<0$, וגם הוא אינו בתוך $(-2,2)$. אנחנו צריכים $x^2+3x-4>0$: מחוץ לשורשים.
            misconception: MC-c0-quadratic-ineq-outside
          - text: '$(-2,-1)\cup(1,2)$'
            feedback: >-
              השורשים של $x^2+3x-4$ הם $-4$ ו-1, לא $\pm1$. ב-$x=-1.5$: $4-2.25=1.75$, שאינו קטן מ-$-4.5$.
            misconception: MC-c0-shift-sign

      - label: ג
        points: 13
        type: open
        objectives: [OBJ-0.1-3, OBJ-0.1-2]
        prompt: >-
          פתרו את $|x^2-4|<3x$ וכתבו את הפתרון כקטע או כאיחוד קטעים.
        solution:
          - kind: given
            text: '$|x^2-4|<3x$.'
          - kind: goal
            text: 'כל ה-$x$ הממשיים שמקיימים את אי-השוויון.'
          - kind: idea
            text: >-
              מפרקים את הערך המוחלט לפי הסימן של $x^2-4$: הוא אי-שלילי כש-$|x|\ge2$ ושלילי כש-$|x|<2$. בכל תחום פותרים
              אי-שוויון ריבועי, ומחתכים עם התחום.
          - kind: step
            text: >-
              תחום 1, $|x|\ge2$: $x^2-4<3x$, כלומר $x^2-3x-4<0$, $(x-4)(x+1)<0$, ולכן $-1<x<4$. החיתוך עם $|x|\ge2$:
              $[2,4)$.
          - kind: step
            text: >-
              תחום 2, $|x|<2$: $4-x^2<3x$, כלומר $x^2+3x-4>0$, $(x+4)(x-1)>0$, ולכן $x<-4$ או $x>1$. החיתוך עם $(-2,2)$:
              $(1,2)$.
          - kind: check
            text: >-
              ב-$x=3$: $|9-4|=5<9$, פתרון. ב-$x=0$: $4<0$, לא פתרון. ב-$x=-3$: $5<-9$, לא פתרון (אגף ימין שלילי). ב-$x=4$:
              $12<12$ אינו נכון, ולכן 4 אינו בפתרון.
          - kind: result
            text: 'האיחוד $(1,2)\cup[2,4)$, כלומר הקטע $(1,4)$.'
        rubric:
          - text: 'פירוק נכון לשני תחומים לפי הסימן של $x^2-4$'
            weight: 3
          - text: 'פתרון נכון של כל אחד משני האי-שוויונים הריבועיים (בין השורשים / מחוץ להם)'
            weight: 4
          - text: 'חיתוך כל פתרון עם התחום שלו'
            weight: 3
          - text: 'איחוד נכון וכתיבה כקטע, $(1,4)$, עם קצוות פתוחים'
            weight: 3

  - id: Q-0-exam-2
    type: exam
    title: זהויות ומשוואות טריגונומטריות
    prompt: >-
      בשאלה זו כל הזוויות ברדיאנים.
    parts:
      - label: א
        points: 5
        type: numeric
        objectives: [OBJ-0.2-2]
        prompt: >-
          חשבו בדיוק את $\cos\frac{\pi}{12}$, בעזרת $\frac\pi{12}=\frac\pi3-\frac\pi4$. (אפשר לכתוב למשל (√6+√2)/4.)
        answer: 0.965925826289068
        tolerance: 0.001
        correctFeedback: >-
          נכון. $\cos\left(\frac\pi3-\frac\pi4\right)=\cos\frac\pi3\cos\frac\pi4+\sin\frac\pi3\sin\frac\pi4=\frac12\cdot\frac{\sqrt2}{2}+\frac{\sqrt3}{2}\cdot\frac{\sqrt2}{2}=\frac{\sqrt2+\sqrt6}{4}$.
        wrongFeedback: >-
          $\cos(a-b)=\cos a\cos b+\sin a\sin b$.
        commonWrong:
          - value: -0.207106781186548
            feedback: >-
              זה $\cos\frac\pi3-\cos\frac\pi4$: קוסינוס אינו מתפצל על הפרש. ותוצאה שלילית לזווית חדה כבר מראה שמשהו לא בסדר.
            misconception: MC-c0-sin-linear

      - label: ב
        points: 6
        type: numeric
        objectives: [OBJ-0.2-3]
        prompt: >-
          כמה פתרונות יש למשוואה $\sin2x=\sin x$ בקטע הסגור $[0,2\pi]$?
        answer: 5
        tolerance: 0.001
        correctFeedback: >-
          נכון. $\sin x\,(2\cos x-1)=0$. $\sin x=0$: $0$, $\pi$, $2\pi$. $\cos x=\frac12$: $\frac\pi3$, $\frac{5\pi}{3}$.
          חמישה פתרונות.
        wrongFeedback: >-
          כתבו $\sin2x=2\sin x\cos x$, העבירו הכול לאגף אחד והוציאו גורם משותף. הקטע סגור: גם $2\pi$ בפנים.
        commonWrong:
          - value: 2
            feedback: >-
              חילקתם ב-$\sin x$ ונשארתם עם $\cos x=\frac12$. החילוק מאבד את שלושת הפתרונות שבהם $\sin x=0$.
            misconception: MC-c0-divide-lose-roots
          - value: 4
            feedback: >-
              החמצתם פתרון אחד: או את $\frac{5\pi}{3}$ (ל-$\cos x=\frac12$ יש שניים בקטע, $\frac\pi3$ ו-$\frac{5\pi}{3}$), או
              את $2\pi$ (הקטע סגור, ו-$\sin2\pi=0$).
            misconception: MC-c0-arcsin-only
          - value: 3
            feedback: >-
              החמצתם את שני הקצוות: מ-$\sin x=0$ יש בקטע הסגור שלושה פתרונות, $0$, $\pi$ ו-$2\pi$, ולא רק $\pi$.
            misconception: MC-c0-arcsin-only

      - label: ג
        points: 14
        type: open
        objectives: [OBJ-0.2-3, OBJ-0.2-2]
        prompt: >-
          מצאו את כל הפתרונות של $\cos2x+3\sin x=2$ בקטע $[0,2\pi)$.
        solution:
          - kind: given
            text: '$\cos2x+3\sin x=2$, $0\le x<2\pi$.'
          - kind: goal
            text: 'כל ה-$x$ בקטע שמקיימים את המשוואה.'
          - kind: idea
            text: >-
              מבטאים הכול בעזרת $\sin x$ (זווית כפולה בצורה $\cos2x=1-2\sin^2x$), ומקבלים משוואה ריבועית ב-$u=\sin x$.
          - kind: computation
            text: >-
              $1-2\sin^2x+3\sin x=2$, כלומר $2\sin^2x-3\sin x+1=0$. עם $u=\sin x$: $2u^2-3u+1=(2u-1)(u-1)=0$, ולכן
              $u=\frac12$ או $u=1$.
          - kind: step
            text: >-
              $\sin x=1$: בקטע רק $x=\frac\pi2$. $\sin x=\frac12$: $x=\frac\pi6$ וגם $x=\pi-\frac\pi6=\frac{5\pi}{6}$.
          - kind: check
            text: >-
              ב-$x=\frac\pi6$: $\cos\frac\pi3+3\cdot\frac12=\frac12+\frac32=2$. ב-$x=\frac\pi2$: $\cos\pi+3=2$. ב-$x=\frac{5\pi}{6}$:
              $\cos\frac{5\pi}{3}+\frac32=\frac12+\frac32=2$.
          - kind: result
            text: '$x\in\left\{\frac\pi6,\ \frac\pi2,\ \frac{5\pi}{6}\right\}$.'
        rubric:
          - text: 'שימוש נכון בזווית הכפולה בצורה $1-2\sin^2x$, כך שנשאר רק $\sin x$'
            weight: 4
          - text: 'פתרון נכון של המשוואה הריבועית ב-$\sin x$'
            weight: 4
          - text: 'מציאת כל הפתרונות בקטע, כולל $\frac{5\pi}{6}$'
            weight: 4
          - text: 'בדיקה בהצבה ותשובה סופית מסודרת'
            weight: 2

  - id: Q-0-exam-3
    type: exam
    title: מעגל ומשיק
    prompt: >-
      נתון המעגל $x^2+y^2-4x+2y-20=0$.
    parts:
      - label: א
        points: 5
        type: numeric
        objectives: [OBJ-0.4-3]
        prompt: >-
          מהו הרדיוס של המעגל?
        answer: 5
        tolerance: 0.001
        correctFeedback: >-
          נכון. $(x-2)^2-4+(y+1)^2-1-20=0$, כלומר $(x-2)^2+(y+1)^2=25$.
        wrongFeedback: >-
          השלימו לריבוע ב-$x$ וב-$y$, והעבירו את הקבועים לאגף ימין.
        commonWrong:
          - value: 25
            feedback: '25 הוא $r^2$. הרדיוס $\sqrt{25}=5$.'
            misconception: MC-c0-circle-radius
          - value: 4.47213595499958
            feedback: >-
              $\sqrt{20}$ מגיע מהקבוע $-20$ בלבד. ההשלמה לריבוע מוסיפה לו $4+1$: $r^2=25$.
            misconception: MC-c0-circle-radius

      - label: ב
        points: 5
        type: mc
        objectives: [OBJ-0.4-3]
        prompt: >-
          מהו המרכז של המעגל?
        choices:
          - text: '$(2,-1)$'
            correct: true
            feedback: 'נכון. $(x-2)^2+(y+1)^2=25$: הסוגריים מתאפסים ב-$x=2$ וב-$y=-1$.'
          - text: '$(-2,1)$'
            feedback: >-
              $(x-2)^2$ מתאפס ב-$x=2$. המרכז של $(x-a)^2+(y-b)^2=r^2$ הוא $(a,b)$.
            misconception: MC-c0-shift-sign
          - text: '$(4,-2)$'
            feedback: >-
              אלה המקדמים של $x$ ו-$y$ (עם סימן הפוך). בהשלמה לריבוע לוקחים חצי: $x^2-4x=(x-2)^2-4$.
            misconception: MC-c0-circle-center-coeff

      - label: ג
        points: 15
        type: open
        objectives: [OBJ-0.4-1, OBJ-0.4-3]
        standalone: false
        prompt: >-
          הראו שהנקודה $P=(5,3)$ נמצאת על המעגל, מצאו את משוואת המשיק למעגל ב-$P$, וחשבו את שטח המשולש שהמשיק יוצר עם שני
          הצירים.
        solution:
          - kind: given
            text: 'המעגל $(x-2)^2+(y+1)^2=25$, מרכז $M=(2,-1)$, רדיוס 5; הנקודה $P=(5,3)$.'
          - kind: goal
            text: '(1) $P$ על המעגל; (2) משוואת המשיק ב-$P$; (3) שטח המשולש בין המשיק לצירים.'
          - kind: check
            text: '$(5-2)^2+(3+1)^2=9+16=25$, ולכן $P$ על המעגל.'
          - kind: idea
            text: >-
              המשיק למעגל מאונך לרדיוס $MP$. מוצאים את שיפוע $MP$, לוקחים את השיפוע המאונך, וכותבים ישר מנקודה ושיפוע.
          - kind: computation
            text: >-
              שיפוע $MP$: $\frac{3-(-1)}{5-2}=\frac43$. שיפוע המשיק: $-\frac34$. המשיק: $y-3=-\frac34(x-5)$, כלומר
              $y=-\frac34x+\frac{27}{4}$ (או $3x+4y=27$).
          - kind: computation
            text: >-
              חיתוך עם ציר ה-$y$ ($x=0$): $y=\frac{27}4$. חיתוך עם ציר ה-$x$ ($y=0$): $x=9$. המשולש ישר זווית בראשית, וניצביו
              9 ו-$\frac{27}{4}$.
          - kind: result
            text: 'המשיק $3x+4y=27$, והשטח $\frac12\cdot9\cdot\frac{27}{4}=\frac{243}{8}=30.375$.'
        rubric:
          - text: 'בדיקה שהנקודה על המעגל'
            weight: 2
          - text: 'שימוש בכך שהמשיק מאונך לרדיוס, ושיפוע נכון $-\frac34$'
            weight: 5
          - text: 'משוואת משיק נכונה'
            weight: 4
          - text: 'נקודות חיתוך עם הצירים ושטח נכון'
            weight: 4
