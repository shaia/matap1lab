# Lesson 0.2 — trigonometry.
# Objectives (src/course.ts):
#   OBJ-0.2-1  sine and cosine on the unit circle; degrees and radians
#   OBJ-0.2-2  the basic identities: sum of squares, sine and cosine of a sum, the double angle
#   OBJ-0.2-3  solve simple trigonometric equations and find all solutions in a given interval
# Angles are in radians unless degrees are written. Every number recomputed in screens/tools/recompute-ch0.py.
chapter: 0
questions:
  - id: Q-0.2-deg-rad
    type: numeric
    objectives: [OBJ-0.2-1]
    level: basic
    prompt: >-
      המירו $150^\circ$ לרדיאנים. (אפשר לכתוב ערך מדויק, כמו √7 או 3π/4.)
    answer: 2.61799387799149
    tolerance: 0.001
    correctFeedback: >-
      נכון. $150\cdot\frac{\pi}{180}=\frac{5\pi}{6}\approx2.618$: קצת פחות מ-$\pi$, כמו ש-$150^\circ$ קצת פחות מ-$180^\circ$.
    wrongFeedback: >-
      $180^\circ$ הם $\pi$ רדיאנים. איזה חלק של $180^\circ$ הם $150^\circ$?
    commonWrong:
      - value: 8594.36692696235
        feedback: >-
          כפלתם ב-$\frac{180}{\pi}$, ההמרה בכיוון ההפוך. זווית של פחות מחצי סיבוב לא יכולה להיות אלפי רדיאנים: חצי סיבוב
          הוא $\pi\approx3.14$.
        misconception: MC-c0-deg-rad-inverse
    hints: ['$180^\circ=\pi$.']

  - id: Q-0.2-unit-circle
    type: numeric
    objectives: [OBJ-0.2-1]
    level: basic
    prompt: >-
      חשבו את $\cos\frac{2\pi}{3}$.
    answer: -0.5
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\frac{2\pi}{3}=120^\circ$, ברביע השני. הנקודה על מעגל היחידה היא $\left(-\frac12,\frac{\sqrt3}{2}\right)$, והקוסינוס
      הוא שיעור ה-$x$ שלה.
    wrongFeedback: >-
      איפה נמצאת הזווית $\frac{2\pi}{3}$ על מעגל היחידה, ומה הסימן של שיעור ה-$x$ שם?
    commonWrong:
      - value: 0.5
        feedback: >-
          זה $\cos\frac\pi3$. הזווית $\frac{2\pi}{3}$ ברביע השני, שם שיעור ה-$x$ שלילי, ולכן הקוסינוס $-\frac12$.
        misconception: MC-c0-quadrant-sign
      - value: 0.866025403784439
        feedback: >-
          זה $\sin\frac{2\pi}{3}=\frac{\sqrt3}{2}$, שיעור ה-$y$. הקוסינוס הוא שיעור ה-$x$ של הנקודה על מעגל היחידה.
        misconception: MC-c0-sin-cos-swap
    hints: ['הנקודה על מעגל היחידה בזווית $\theta$ היא $(\cos\theta,\sin\theta)$.']

  - id: Q-0.2-sign-quadrant
    type: mc
    objectives: [OBJ-0.2-1]
    qualitative: true
    level: basic
    prompt: >-
      ידוע ש-$\sin\theta<0$ ו-$\cos\theta>0$, ו-$0\le\theta<2\pi$. באיזה קטע נמצאת $\theta$?
    choices:
      - text: '$\left(\frac{3\pi}{2},2\pi\right)$'
        correct: true
        feedback: >-
          נכון. ברביע הרביעי הנקודה $(\cos\theta,\sin\theta)$ מימין לציר ה-$y$ ומתחת לציר ה-$x$.
      - text: '$\left(\frac{\pi}{2},\pi\right)$'
        feedback: >-
          ברביע השני הסימנים הפוכים: $\sin\theta>0$ ו-$\cos\theta<0$. נראה שהחלפתם בין סינוס לקוסינוס.
        misconception: MC-c0-sin-cos-swap
      - text: '$\left(\pi,\frac{3\pi}{2}\right)$'
        feedback: >-
          ברביע השלישי שני השיעורים שליליים, כך שגם $\cos\theta<0$.
        misconception: MC-c0-quadrant-sign
      - text: '$\left(0,\frac{\pi}{2}\right)$'
        feedback: >-
          ברביע הראשון שני השיעורים חיוביים, כך שגם $\sin\theta>0$.
        misconception: MC-c0-quadrant-sign
    hints: ['קוסינוס הוא שיעור ה-$x$, סינוס שיעור ה-$y$.']

  - id: Q-0.2-sin2-positive
    type: twotier
    objectives: [OBJ-0.2-1]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא נכון: $\sin 2>0$ (הזווית 2 ברדיאנים).
    choices:
      - text: 'נכון'
        correct: true
        feedback: 'נכון. $\sin2\approx0.909$.'
      - text: 'לא נכון'
        feedback: >-
          $\frac\pi2\approx1.57<2<\pi\approx3.14$, כלומר הזווית ברביע השני, ושם הסינוס חיובי.
        misconception: MC-c0-quadrant-sign
    reasons:
      - text: '$\frac{\pi}{2}<2<\pi$, והסינוס חיובי ברביע השני'
        correct: true
        feedback: 'בדיוק. 2 רדיאנים הם בערך $114.6^\circ$.'
      - text: '2 היא זווית קטנה, קרובה ל-0, וסינוס של זווית חיובית קטנה הוא חיובי'
        feedback: >-
          "2" כאן הוא 2 רדיאנים, לא $2^\circ$: יותר מזווית ישרה. המסקנה במקרה נכונה, אבל הנימוק היה נכשל ב-$\sin4<0$.
        misconception: MC-c0-radians-as-degrees
      - text: '$2>\frac\pi2$, ומעבר לזווית ישרה הסינוס שלילי'
        feedback: >-
          מעבר לזווית ישרה מתהפך הסימן של **הקוסינוס**. הסינוס נשאר חיובי עד $\pi$.
        misconception: MC-c0-sin-cos-swap

  - id: Q-0.2-pythag
    type: numeric
    objectives: [OBJ-0.2-2]
    level: basic
    prompt: >-
      ידוע ש-$\sin\theta=\frac35$ ו-$\frac\pi2<\theta<\pi$. חשבו את $\cos\theta$.
    answer: -0.8
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\cos^2\theta=1-\frac{9}{25}=\frac{16}{25}$, ולכן $\cos\theta=\pm\frac45$. ברביע השני הקוסינוס שלילי:
      $\cos\theta=-\frac45$.
    wrongFeedback: >-
      השתמשו ב-$\sin^2\theta+\cos^2\theta=1$, ואחר כך בחרו סימן לפי הרביע.
    commonWrong:
      - value: 0.8
        feedback: >-
          הגודל נכון, הסימן לא: השורש נותן $\pm\frac45$, וברביע השני הקוסינוס שלילי.
        misconception: MC-c0-quadrant-sign
    hints: ['$\sin^2\theta+\cos^2\theta=1$.']

  - id: Q-0.2-sum-formula
    type: mc
    objectives: [OBJ-0.2-2]
    qualitative: true
    level: basic
    prompt: >-
      איזו נוסחה נכונה לכל $a$ ו-$b$?
    choices:
      - text: '$\cos(a+b)=\cos a\cos b-\sin a\sin b$'
        correct: true
        feedback: >-
          נכון. בדיקה ב-$a=b=\frac\pi2$: $\cos\pi=-1$, ואגף ימין $0\cdot0-1\cdot1=-1$.
      - text: '$\cos(a+b)=\cos a+\cos b$'
        feedback: >-
          קוסינוס אינו לינארי: ב-$a=b=0$ אגף שמאל $\cos0=1$ ואגף ימין 2.
        misconception: MC-c0-sin-linear
      - text: '$\cos(a+b)=\cos a\cos b+\sin a\sin b$'
        feedback: >-
          זו הנוסחה של $\cos(a-b)$. ב-$a=b=\frac\pi2$ היא נותנת $1$ במקום $\cos\pi=-1$.
        misconception: MC-c0-sum-formula-sign
      - text: '$\cos(a+b)=\cos a\sin b+\sin a\cos b$'
        feedback: >-
          זו הנוסחה של $\sin(a+b)$. ב-$a=b=0$ היא נותנת 0 במקום $\cos0=1$.
        misconception: MC-c0-sin-cos-swap
    hints: ['בדקו כל נוסחה בזווית מיוחדת, למשל $a=b=0$ או $a=b=\frac\pi2$.']

  - id: Q-0.2-double
    type: numeric
    objectives: [OBJ-0.2-2]
    level: mid
    prompt: >-
      ידוע ש-$\sin\theta=\frac35$ ו-$\frac\pi2<\theta<\pi$. חשבו את $\sin2\theta$.
    answer: -0.96
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\cos\theta=-\frac45$ (רביע שני), ו-$\sin2\theta=2\sin\theta\cos\theta=2\cdot\frac35\cdot\left(-\frac45\right)=-\frac{24}{25}$.
      בדיקת שפיות: $2\theta$ בין $\pi$ ל-$2\pi$, שם הסינוס שלילי.
    wrongFeedback: >-
      $\sin2\theta=2\sin\theta\cos\theta$. מצאו קודם את $\cos\theta$, עם הסימן הנכון לרביע.
    commonWrong:
      - value: 0.96
        feedback: >-
          לקחתם $\cos\theta=+\frac45$. ברביע השני הקוסינוס שלילי, ולכן $\sin2\theta<0$.
        misconception: MC-c0-quadrant-sign
      - value: 1.2
        feedback: >-
          זה $2\sin\theta=\frac65$, וזה גדול מ-1, כך שאינו יכול להיות סינוס של שום זווית. $\sin2\theta=2\sin\theta\cos\theta$.
        misconception: MC-c0-sin-linear
    hints: ['$\sin2\theta=2\sin\theta\cos\theta$.']

  - id: Q-0.2-sin75
    type: numeric
    objectives: [OBJ-0.2-2]
    level: mid
    prompt: >-
      חשבו את $\sin75^\circ$ בדיוק, בעזרת $75^\circ=45^\circ+30^\circ$. (אפשר לכתוב למשל (√6+√2)/4.)
    answer: 0.965925826289068
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\sin75^\circ=\sin45^\circ\cos30^\circ+\cos45^\circ\sin30^\circ=\frac{\sqrt2}{2}\cdot\frac{\sqrt3}{2}+\frac{\sqrt2}{2}\cdot\frac12=\frac{\sqrt6+\sqrt2}{4}\approx0.966$.
    wrongFeedback: >-
      השתמשו ב-$\sin(a+b)=\sin a\cos b+\cos a\sin b$ עם $a=45^\circ$ ו-$b=30^\circ$.
    commonWrong:
      - value: 1.20710678118655
        feedback: >-
          זה $\sin45^\circ+\sin30^\circ=\frac{\sqrt2}{2}+\frac12\approx1.207$, יותר מ-1: סינוס אינו מתפצל על סכום.
        misconception: MC-c0-sin-linear
    hints: ['$\sin(a+b)=\sin a\cos b+\cos a\sin b$.']

  - id: Q-0.2-double-tf
    type: twotier
    objectives: [OBJ-0.2-2]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא נכון: $\sin2x=2\sin x$ לכל $x$.
    choices:
      - text: 'לא נכון'
        correct: true
        feedback: 'נכון. הזהות הנכונה היא $\sin2x=2\sin x\cos x$, והן שוות רק כש-$\sin x=0$ או $\cos x=1$.'
      - text: 'נכון'
        feedback: >-
          ב-$x=\frac\pi2$: $\sin\pi=0$ ואילו $2\sin\frac\pi2=2$.
        misconception: MC-c0-sin-linear
    reasons:
      - text: 'ב-$x=\frac\pi2$ אגף שמאל 0 ואגף ימין 2'
        correct: true
        feedback: 'בדיוק: דוגמה נגדית אחת מפריכה זהות. וגם: $2\sin x$ מגיע ל-2, וסינוס אף פעם לא.'
      - text: 'מוציאים את ה-2 מהסינוס כמו מסוגריים'
        feedback: >-
          ה-2 נמצא בתוך הארגומנט של הסינוס, לא כופל אותו. סינוס אינו לינארי, ולכן אי אפשר "להוציא" ממנו מספר.
        misconception: MC-c0-sin-linear
      - text: 'ב-$x=0$ שני האגפים 0, ולכן הזהות נכונה'
        feedback: >-
          שוויון בנקודה אחת אינו מוכיח זהות: היא צריכה להתקיים בכל $x$.
        misconception: MC-c0-sin-linear

  - id: Q-0.2-tan-sum
    type: numeric
    objectives: [OBJ-0.2-2]
    level: exam
    prompt: >-
      $\alpha$ ו-$\beta$ זוויות חדות עם $\tan\alpha=\frac12$ ו-$\tan\beta=\frac13$. חשבו את $\alpha+\beta$ ברדיאנים.
    answer: 0.785398163397448
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac\pi4$. מנוסחאות הסכום (מחלקים את $\sin(\alpha+\beta)$ ב-$\cos(\alpha+\beta)$ ואת המונה והמכנה
      ב-$\cos\alpha\cos\beta$) מתקבל
      $\tan(\alpha+\beta)=\frac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}=\frac{5/6}{5/6}=1$. שתי הזוויות חדות, ולכן
      $0<\alpha+\beta<\pi$, והזווית היחידה שם עם טנגנס 1 היא $\frac\pi4$.
    wrongFeedback: >-
      חשבו את $\tan(\alpha+\beta)$ בעזרת נוסחאות הסכום של סינוס וקוסינוס, ואז מצאו את הזווית בתחום האפשרי.
    commonWrong:
      - value: 0.694738276196703
        feedback: >-
          זה $\arctan\frac56$: הנחתם ש-$\tan(\alpha+\beta)=\tan\alpha+\tan\beta$. טנגנס אינו לינארי; חסר המכנה
          $1-\tan\alpha\tan\beta$.
        misconception: MC-c0-sin-linear
      - value: 45
        feedback: >-
          $45^\circ$ היא הזווית הנכונה, אבל התבקשה תשובה ברדיאנים: $\frac\pi4\approx0.785$.
        misconception: MC-c0-radians-as-degrees
    hints: ['$\tan(\alpha+\beta)=\frac{\sin(\alpha+\beta)}{\cos(\alpha+\beta)}$; פתחו מונה ומכנה בנוסחאות הסכום.']

  - id: Q-0.2-eq-count
    type: numeric
    objectives: [OBJ-0.2-3]
    level: basic
    prompt: >-
      כמה פתרונות יש למשוואה $\sin x=\frac12$ בקטע $[0,2\pi]$?
    answer: 2
    tolerance: 0.001
    correctFeedback: >-
      נכון: $x=\frac\pi6$ ו-$x=\pi-\frac\pi6=\frac{5\pi}{6}$. על מעגל היחידה הישר $y=\frac12$ חותך את המעגל בשתי נקודות.
    wrongFeedback: >-
      ציירו את הישר $y=\frac12$ על מעגל היחידה. בכמה נקודות הוא חותך אותו?
    commonWrong:
      - value: 1
        feedback: >-
          מצאתם רק את $\frac\pi6$. גם $\frac{5\pi}{6}$ פותר: $\sin(\pi-x)=\sin x$.
        misconception: MC-c0-arcsin-only
    hints: ['$\sin(\pi-x)=\sin x$.']

  - id: Q-0.2-eq-cos
    type: mc
    objectives: [OBJ-0.2-3]
    level: mid
    prompt: >-
      מהו הפתרון הכללי של $\cos x=-\frac12$? (כאן $k$ שלם כלשהו.)
    choices:
      - text: '$x=\pm\frac{2\pi}{3}+2\pi k$'
        correct: true
        feedback: >-
          נכון. $\cos\frac{2\pi}{3}=-\frac12$, הקוסינוס זוגי ולכן גם $-\frac{2\pi}{3}$ פותר, והמחזור $2\pi$. בקטע $[0,2\pi)$ אלה
          $\frac{2\pi}{3}$ ו-$\frac{4\pi}{3}$.
      - text: '$x=\frac{2\pi}{3}+2\pi k$'
        feedback: >-
          חסרים הפתרונות $-\frac{2\pi}{3}+2\pi k$, למשל $\frac{4\pi}{3}$: גם שם $\cos x=-\frac12$.
        misconception: MC-c0-arcsin-only
      - text: '$x=\pm\frac{\pi}{3}+2\pi k$'
        feedback: >-
          $\cos\frac\pi3=+\frac12$. הקוסינוס שלילי ברביעים השני והשלישי, ולכן הזווית הבסיסית היא $\frac{2\pi}{3}$.
        misconception: MC-c0-quadrant-sign
      - text: '$x=\frac{2\pi}{3}+\pi k$'
        feedback: >-
          המחזור של קוסינוס הוא $2\pi$. ב-$k=1$ מתקבל $\frac{5\pi}{3}$, ושם $\cos x=+\frac12$.
        misconception: MC-c0-period-wrong
    hints: ['הקוסינוס זוגי: $\cos(-x)=\cos x$.']

  - id: Q-0.2-tan-tf
    type: twotier
    objectives: [OBJ-0.2-3]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא נכון: למשוואה $\tan x=1$ יש בדיוק פתרון אחד בקטע $[0,2\pi]$.
    choices:
      - text: 'לא נכון'
        correct: true
        feedback: 'נכון. יש שניים: $\frac\pi4$ ו-$\frac{5\pi}{4}$.'
      - text: 'נכון'
        feedback: >-
          גם $x=\frac{5\pi}{4}$ פותר: שם $\sin x=\cos x=-\frac{\sqrt2}{2}$, והמנה 1.
        misconception: MC-c0-arcsin-only
    reasons:
      - text: 'המחזור של $\tan$ הוא $\pi$, ולכן גם $\frac\pi4+\pi$ פותר'
        correct: true
        feedback: 'בדיוק. בקטע באורך $2\pi$ יש לכן שני פתרונות.'
      - text: 'המחזור של $\tan$ הוא $2\pi$, ולכן יש פתרון אחד בכל קטע באורך $2\pi$'
        feedback: >-
          $\tan(x+\pi)=\frac{-\sin x}{-\cos x}=\tan x$: המחזור הוא $\pi$, לא $2\pi$.
        misconception: MC-c0-period-wrong
      - text: '$\arctan1=\frac\pi4$, וזה הפתרון'
        feedback: >-
          $\arctan$ נותן רק את הפתרון שבין $-\frac\pi2$ ל-$\frac\pi2$. את השאר מוסיפים לפי המחזור.
        misconception: MC-c0-arcsin-only

  - id: Q-0.2-eq-double
    type: numeric
    objectives: [OBJ-0.2-3, OBJ-0.2-2]
    level: exam
    prompt: >-
      כמה פתרונות יש למשוואה $\sin2x=\cos x$ בקטע $[0,2\pi)$?
    answer: 4
    tolerance: 0.001
    correctFeedback: >-
      נכון. $2\sin x\cos x-\cos x=0$, כלומר $\cos x\,(2\sin x-1)=0$. מ-$\cos x=0$: $\frac\pi2$, $\frac{3\pi}{2}$. מ-$\sin x=\frac12$:
      $\frac\pi6$, $\frac{5\pi}{6}$. סך הכול ארבעה.
    wrongFeedback: >-
      פתחו $\sin2x=2\sin x\cos x$, העבירו הכול לאגף אחד והוציאו גורם משותף. אל תחלקו.
    commonWrong:
      - value: 2
        feedback: >-
          חילקתם ב-$\cos x$ ונשארתם עם $\sin x=\frac12$. החילוק מאבד את $\cos x=0$: ב-$x=\frac\pi2$ שני האגפים 0.
        misconception: MC-c0-divide-lose-roots
      - value: 3
        feedback: >-
          החמצתם פתרון אחד, בדרך כלל $\frac{5\pi}{6}$ או $\frac{3\pi}{2}$: למשוואה $\sin x=\frac12$ יש שני פתרונות בקטע,
          $\frac\pi6$ ו-$\frac{5\pi}{6}$, וגם ל-$\cos x=0$ יש שניים.
        misconception: MC-c0-arcsin-only
    hints: ['$\sin2x=2\sin x\cos x$. מכפלה מתאפסת כשאחד הגורמים מתאפס.']
