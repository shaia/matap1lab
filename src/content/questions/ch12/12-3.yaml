# Lesson 12.3 — double integrals in polar coordinates (notes pp. 77–78, 81).
# Objectives (src/course.ts):
#   OBJ-12.3-1  switch to polar coordinates in a double integral, with the factor r
#   OBJ-12.3-2  integrate over disks, annuli and sectors
#   OBJ-12.3-3  compute the Gaussian integral by passing to polar coordinates
# Recomputed with sympy (screens/tools/recompute-ch12.py). From the notes: e^{x^2+y^2} on the disk of radius 3 (p. 77;
# the notes stop before the factor 2π: π(e^9-1)), the sector above y = x inside x^2+y^2 = 4 (p. 78, unfinished there:
# 16/3 - 4√2), and the Gaussian integral (p. 78).
chapter: 12
questions:
  - id: Q-12.3-element
    type: mc
    objectives: [OBJ-12.3-1]
    qualitative: true
    level: basic
    prompt: >-
      במעבר לקואורדינטות קוטביות, $x=r\cos\theta$, $y=r\sin\theta$, במה מחליפים את $dA=dx\,dy$?
    choices:
      - text: '$r\,dr\,d\theta$'
        correct: true
        feedback: >-
          נכון. התא הקטן שבין $r$ ל-$r+dr$ ובין $\theta$ ל-$\theta+d\theta$ הוא כמעט מלבן עם צלעות $dr$ ו-$r\,d\theta$
          (קשת ברדיוס $r$). זה גם הערך המוחלט של היעקוביאן $\frac{\partial(x,y)}{\partial(r,\theta)}=r$.
      - text: '$dr\,d\theta$'
        feedback: >-
          התאים הקוטביים אינם שווים בגודלם: רחוק מהראשית הקשת $r\,d\theta$ ארוכה יותר. בלי הגורם $r$ התאים הרחוקים נספרים
          קטנים מדי.
        misconception: MC-c12-polar-no-r
      - text: '$r^2\,dr\,d\theta$'
        feedback: >-
          לתא יש צלע רדיאלית $dr$ וצלע קשת $r\,d\theta$, כלומר רק גורם $r$ אחד. $r^2$ מופיע באלמנט הנפח הכדורי, לא כאן.
        misconception: MC-c12-polar-no-r

  - id: Q-12.3-integrand
    type: expr
    objectives: [OBJ-12.3-1]
    level: basic
    prompt: >-
      כותבים $\iint_{x^2+y^2\le4}\sqrt{x^2+y^2}\,dA=\int_0^{2\pi}\!\int_0^2g(r)\,dr\,d\theta$. מהי $g(r)$? (כתבו בעזרת $r$.)
    answer: 'r^2'
    answerTex: '$g(r)=r\cdot r=r^2$'
    variables: [r]
    domain: [0.2, 3]
    correctFeedback: >-
      נכון. $\sqrt{x^2+y^2}=r$, ועוד גורם $r$ מאלמנט השטח $dA=r\,dr\,d\theta$.
    wrongFeedback: >-
      תרגמו את האינטגרנד ל-$r$, ואל תשכחו את אלמנט השטח בקוטביות.
    commonWrong:
      - expr: 'r'
        feedback: >-
          זה רק האינטגרנד. חסר הגורם $r$ של אלמנט השטח: $dA=r\,dr\,d\theta$.
        misconception: MC-c12-polar-no-r
    hints: ['מה זה $\sqrt{x^2+y^2}$ בקוטביות? ומהו $dA$?']

  - id: Q-12.3-disk-exp
    type: numeric
    objectives: [OBJ-12.3-1, OBJ-12.3-2]
    level: basic
    prompt: >-
      חשבו את $\iint_De^{x^2+y^2}\,dA$, כש-$D$ העיגול $x^2+y^2\le9$. (אפשר לכתוב ביטוי מדויק עם e ו-π.)
    answer: 25453.4473456388
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\int_0^{2\pi}\!\int_0^3e^{r^2}r\,dr\,d\theta=2\pi\cdot\frac{e^9-1}{2}=\pi\left(e^9-1\right)$ (הצבה $t=r^2$).
      הגורם $r$ הוא מה שמאפשר את ההצבה.
    wrongFeedback: >-
      עברו לקוטביות: $0\le r\le3$, $0\le\theta\le2\pi$, ו-$dA=r\,dr\,d\theta$. האינטגרל הפנימי לפי $r$ בהצבה $t=r^2$.
    commonWrong:
      - value: 4051.04196378769
        feedback: >-
          זה $\frac{e^9-1}{2}$, האינטגרל לפי $r$ בלבד. נשאר האינטגרל לפי $\theta$ מ-0 עד $2\pi$, שנותן עוד גורם $2\pi$.
        misconception: MC-c12-polar-limits
    hints: ['$\int_0^3re^{r^2}dr=\frac12\int_0^9e^t\,dt$.']

  - id: Q-12.3-annulus
    type: numeric
    objectives: [OBJ-12.3-2]
    level: basic
    prompt: >-
      חשבו את $\iint_A\frac{1}{x^2+y^2}\,dA$, כש-$A$ הטבעת $1\le x^2+y^2\le4$.
    answer: 4.3551721806072
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\int_0^{2\pi}\!\int_1^2\frac{1}{r^2}\,r\,dr\,d\theta=2\pi\ln2$.
    wrongFeedback: >-
      בטבעת $1\le r\le2$ ו-$0\le\theta\le2\pi$. הכפילו ב-$r$ לפני שמחשבים את האינטגרל לפי $r$.
    commonWrong:
      - value: 3.14159265358979
        feedback: >-
          $\pi$ יוצא מ-$2\pi\int_1^2\frac{dr}{r^2}=2\pi\cdot\frac12$, בלי הגורם $r$. עם הגורם האינטגרנד $\frac1r$ והתוצאה
          $2\pi\ln2$.
        misconception: MC-c12-polar-no-r
    hints: ['$\frac{1}{r^2}\cdot r=\frac1r$.']

  - id: Q-12.3-when-polar
    type: multi
    objectives: [OBJ-12.3-1]
    qualitative: true
    level: mid
    prompt: >-
      באילו מהאינטגרלים הבאים כדאי לעבור לקואורדינטות קוטביות? סמנו את כל האפשרויות הנכונות.
    choices:
      - text: '$\iint e^{-(x^2+y^2)}\,dA$ על העיגול $x^2+y^2\le1$'
        correct: true
        feedback: 'נכון. התחום $r\le1$ והאינטגרנד $e^{-r^2}$, ועם הגורם $r$ יש לו פונקציה קדומה.'
      - text: '$\iint\ln(x^2+y^2)\,dA$ על הטבעת $1\le x^2+y^2\le9$'
        correct: true
        feedback: 'נכון. הטבעת היא מלבן בקוטביות, $1\le r\le3$, והאינטגרנד $2\ln r$.'
      - text: '$\iint x\,dA$ על רבע העיגול $x^2+y^2\le4$, $x,y\ge0$'
        correct: true
        feedback: 'נכון. $0\le r\le2$, $0\le\theta\le\frac\pi2$, והאינטגרנד $r\cos\theta$ מתפרק למכפלה.'
      - text: '$\iint xy\,dA$ על הריבוע $[0,1]\times[0,1]$'
        feedback: >-
          בקרטזיות זו מכפלה על מלבן: $\frac12\cdot\frac12$. בקוטביות הצלעות $x=1$ ו-$y=1$ הופכות ל-$r=\frac{1}{\cos\theta}$
          ו-$r=\frac{1}{\sin\theta}$, וצריך לפצל את $\theta$.
        misconception: MC-c12-coords-mismatch

  - id: Q-12.3-sector-limits
    type: mc
    objectives: [OBJ-12.3-2]
    qualitative: true
    level: mid
    prompt: >-
      $D$ הוא החלק של העיגול $x^2+y^2\le4$ שנמצא ברביע הראשון ומעל הישר $y=x$. אילו גבולות מתארים את $D$ בקוטביות?
    choices:
      - text: '$0\le r\le2$, $\frac\pi4\le\theta\le\frac\pi2$'
        correct: true
        feedback: >-
          נכון. הישר $y=x$ ברביע הראשון הוא הקרן $\theta=\frac\pi4$, ציר $y$ הוא $\theta=\frac\pi2$, וכל קרן ביניהן יוצאת
          מהתחום על המעגל $r=2$.
      - text: '$0\le r\le2$, $0\le\theta\le\frac\pi4$'
        feedback: >-
          אלה הקרניים **מתחת** לישר $y=x$ (בין ציר $x$ לישר). מעל הישר הזוויות גדולות מ-$\frac\pi4$.
        misconception: MC-c12-polar-limits
      - text: '$0\le r\le4$, $\frac\pi4\le\theta\le\frac\pi2$'
        feedback: >-
          המעגל $x^2+y^2=4$ הוא $r^2=4$, כלומר $r=2$. 4 הוא $r^2$, לא $r$.
        misconception: MC-c12-polar-limits
      - text: '$x\le r\le2$, $\frac\pi4\le\theta\le\frac\pi2$'
        feedback: >-
          בקוטביות כל הגבולות נכתבים ב-$r$ וב-$\theta$. הישר $y=x$ הוא גבול על הזווית ($\theta=\frac\pi4$), לא על $r$.
        misconception: MC-c12-polar-limits

  - id: Q-12.3-sector
    type: numeric
    objectives: [OBJ-12.3-2]
    level: mid
    prompt: >-
      חשבו את $\iint_D(2x-y)\,dA$, כש-$D$ החלק של העיגול $x^2+y^2\le4$ ברביע הראשון שמעל הישר $y=x$.
    answer: -0.323520916159047
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\int_{\pi/4}^{\pi/2}\!\int_0^2r(2\cos\theta-\sin\theta)\,r\,dr\,d\theta=\frac83\left[2\sin\theta+\cos\theta\right]_{\pi/4}^{\pi/2}=\frac83\left(2-\frac{3}{\sqrt2}\right)=\frac{16}{3}-4\sqrt2$.
      התוצאה שלילית: ליד ציר $y$ האינטגרנד $2x-y$ שלילי.
    wrongFeedback: >-
      הגבולות: $0\le r\le2$, $\frac\pi4\le\theta\le\frac\pi2$. האינטגרנד $r(2\cos\theta-\sin\theta)$, ועוד גורם $r$.
    commonWrong:
      - value: -0.242640687119285
        feedback: >-
          $4-3\sqrt2$ יוצא בלי הגורם $r$ של אלמנט השטח: $\int_0^2r\,dr=2$ במקום $\int_0^2r^2\,dr=\frac83$.
        misconception: MC-c12-polar-no-r
      - value: 2.99018758282571
        feedback: >-
          $4\sqrt2-\frac83$ הוא האינטגרל על $0\le\theta\le\frac\pi4$, החלק שמתחת לישר $y=x$.
        misconception: MC-c12-polar-limits
    hints: ['$\int_0^2r^2\,dr=\frac83$.']

  - id: Q-12.3-ring-x2
    type: numeric
    objectives: [OBJ-12.3-2]
    level: exam
    prompt: >-
      חשבו את $\iint_Dx^2\,dA$, כש-$D$ חצי הטבעת $1\le x^2+y^2\le4$, $y\ge0$.
    answer: 5.89048622548086
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\int_0^\pi\!\int_1^2r^2\cos^2\theta\,r\,dr\,d\theta=\left(\int_0^\pi\cos^2\theta\,d\theta\right)\left(\int_1^2r^3\,dr\right)=\frac\pi2\cdot\frac{15}{4}=\frac{15\pi}{8}$.
    wrongFeedback: >-
      חצי הטבעת העליון: $1\le r\le2$, $0\le\theta\le\pi$. האינטגרנד $r^2\cos^2\theta$ כפול $r$, ומתפרק למכפלה.
    commonWrong:
      - value: 3.66519142918809
        feedback: >-
          $\frac{7\pi}{6}$ יוצא בלי הגורם $r$: $\int_1^2r^2\,dr=\frac73$ במקום $\int_1^2r^3\,dr=\frac{15}{4}$.
        misconception: MC-c12-polar-no-r
      - value: 11.7809724509617
        feedback: >-
          $\frac{15\pi}{4}$ הוא האינטגרל על הטבעת כולה ($0\le\theta\le2\pi$). חצי הטבעת עם $y\ge0$ הוא $0\le\theta\le\pi$.
        misconception: MC-c12-polar-limits
    hints: ['$\int_0^\pi\cos^2\theta\,d\theta=\frac\pi2$.']

  - id: Q-12.3-gauss-value
    type: numeric
    objectives: [OBJ-12.3-3]
    level: basic
    prompt: >-
      ידוע ש-$\iint_{\mathbb{R}^2}e^{-(x^2+y^2)}\,dA=\pi$. מה ערכו של $\int_{-\infty}^{\infty}e^{-x^2}\,dx$?
    answer: 1.77245385090552
    tolerance: 0.001
    correctFeedback: >-
      נכון. לפי פירוק למכפלה $\iint_{\mathbb{R}^2}e^{-x^2}e^{-y^2}\,dA=I\cdot I=I^2$, ולכן $I^2=\pi$ ו-$I=\sqrt\pi$ (חיובי,
      כי האינטגרנד חיובי).
    wrongFeedback: >-
      $e^{-(x^2+y^2)}=e^{-x^2}e^{-y^2}$. מה הקשר בין האינטגרל הכפול ל-$I=\int_{-\infty}^{\infty}e^{-x^2}dx$?
    commonWrong:
      - value: 3.14159265358979
        feedback: >-
          $\pi$ הוא האינטגרל הכפול, כלומר $I^2$. $I$ עצמו הוא $\sqrt\pi$.
        misconception: MC-c12-gauss-forget-root
    hints: ['האינטגרל הכפול מתפרק למכפלה של שני אינטגרלים זהים.']

  - id: Q-12.3-gauss-quadrant
    type: numeric
    objectives: [OBJ-12.3-3]
    level: mid
    prompt: >-
      חשבו את $\iint_Qe^{-(x^2+y^2)}\,dA$, כש-$Q$ הרביע הראשון $x\ge0$, $y\ge0$.
    answer: 0.785398163397448
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\int_0^{\pi/2}\!\int_0^\infty e^{-r^2}r\,dr\,d\theta=\frac\pi2\cdot\frac12=\frac\pi4$. זה גם
      $\left(\int_0^\infty e^{-x^2}dx\right)^2=\left(\frac{\sqrt\pi}{2}\right)^2$.
    wrongFeedback: >-
      ברביע הראשון $0\le\theta\le\frac\pi2$ ו-$0\le r<\infty$. $\int_0^\infty re^{-r^2}dr=\frac12$.
    commonWrong:
      - value: 3.14159265358979
        feedback: >-
          $\pi$ הוא האינטגרל על המישור כולו, $0\le\theta\le2\pi$. הרביע הוא רבע מזה.
        misconception: MC-c12-gauss-quadrant
    hints: ['כמה רדיאנים יש ברביע?']

  - id: Q-12.3-gauss-rank
    type: rank
    objectives: [OBJ-12.3-3]
    level: mid
    prompt: >-
      סדרו את שלבי החישוב של $I=\int_{-\infty}^{\infty}e^{-x^2}\,dx$.
    help: סדרו את שלבי השיטה מהראשון לאחרון.
    items:
      - id: a
        label: 'כותבים $I^2=\left(\int_{-\infty}^{\infty}e^{-x^2}dx\right)\left(\int_{-\infty}^{\infty}e^{-y^2}dy\right)$.'
      - id: b
        label: 'מאחדים לאינטגרל כפול על המישור: $I^2=\iint_{\mathbb{R}^2}e^{-(x^2+y^2)}\,dA$.'
      - id: c
        label: 'עוברים לקוטביות: $I^2=\int_0^{2\pi}\!\int_0^\infty e^{-r^2}\,r\,dr\,d\theta$.'
      - id: d
        label: 'בהצבה $t=r^2$: $\int_0^\infty e^{-r^2}r\,dr=\frac12$, ולכן $I^2=2\pi\cdot\frac12=\pi$.'
      - id: e
        label: 'מוציאים שורש: $I=\sqrt\pi$, כי $I>0$.'
    order: [a, b, c, d, e]
    correctFeedback: >-
      נכון. הטריק כולו בצעד c: בקרטזיות אין פונקציה קדומה, ובקוטביות הגורם $r$ של אלמנט השטח יוצר אותה.
    wrongFeedback: >-
      מתחילים מ-$I^2$ כמכפלה, מאחדים לאינטגרל כפול, ורק אז עוברים לקוטביות. השורש בא בסוף, כי חישבנו את $I^2$.

  - id: Q-12.3-gauss-why
    type: twotier
    objectives: [OBJ-12.3-3, OBJ-12.3-1]
    qualitative: true
    level: mid
    prompt: >-
      ל-$e^{-x^2}$ אין פונקציה קדומה אלמנטרית. נכון או לא נכון: "בקוטביות אפשר לחשב את
      $\iint_{\mathbb{R}^2}e^{-(x^2+y^2)}\,dA$ במדויק."
    choices:
      - text: נכון
        correct: true
        feedback: 'נכון. התוצאה $\pi$, וממנה $\int_{-\infty}^{\infty}e^{-x^2}dx=\sqrt\pi$.'
      - text: לא נכון
        feedback: >-
          בקוטביות האינטגרנד אינו רק $e^{-r^2}$ אלא $e^{-r^2}r$, ולביטוי הזה יש פונקציה קדומה: $-\frac12e^{-r^2}$.
        misconception: MC-c12-polar-no-r
    reasons:
      - text: 'אלמנט השטח מוסיף גורם $r$, ו-$re^{-r^2}$ היא הנגזרת של $-\frac12e^{-r^2}$'
        correct: true
        feedback: 'בדיוק. בלי הגורם $r$ היינו נתקעים שוב עם $\int e^{-r^2}dr$.'
      - text: 'בקוטביות האינטגרנד $e^{-r^2}$ תלוי במשתנה אחד בלבד, וזה מספיק'
        feedback: >-
          גם $e^{-x^2}$ תלוי במשתנה אחד, ובכל זאת אין לו פונקציה קדומה. מה שעוזר הוא הגורם $r$ מאלמנט השטח.
        misconception: MC-c12-polar-no-r
      - text: 'האינטגרל הכפול הוא שטח המישור, ולכן הוא אינסופי ואי-אפשר לחשב אותו'
        feedback: >-
          זה לא שטח: האינטגרנד דועך מהר, והאינטגרל הכפול סופי, $\pi$.
        misconception: MC-c12-integral-is-size

  - id: Q-12.3-gauss-variant
    type: numeric
    objectives: [OBJ-12.3-3]
    level: exam
    prompt: >-
      חשבו את $\int_{-\infty}^{\infty}e^{-3x^2}\,dx$. (אפשר להיעזר באינטגרל כפול בקוטביות, או להציב ולהשתמש באינטגרל גאוס.)
    answer: 1.02332670794649
    tolerance: 0.0005
    correctFeedback: >-
      נכון. $J^2=\iint_{\mathbb{R}^2}e^{-3(x^2+y^2)}\,dA=2\pi\int_0^\infty e^{-3r^2}r\,dr=2\pi\cdot\frac16=\frac\pi3$, ולכן
      $J=\sqrt{\pi/3}$. (או: $u=\sqrt3x$ נותן $\frac{1}{\sqrt3}\sqrt\pi$.)
    wrongFeedback: >-
      חזרו על השיטה של גאוס עם $e^{-3r^2}$: $\int_0^\infty re^{-3r^2}dr=\frac16$. ובסוף שורש.
    commonWrong:
      - value: 1.0471975511966
        feedback: >-
          $\frac\pi3$ הוא $J^2$, האינטגרל הכפול. התשובה היא השורש שלו.
        misconception: MC-c12-gauss-forget-root
    hints: ['$\int_0^\infty re^{-3r^2}dr=\frac16$.']
