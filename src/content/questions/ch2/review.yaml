# Chapter 2 review — coordinate systems and basic shapes (lessons 2.1–2.5), easy to hard.
# Every lesson is touched; several questions combine lessons, some reach back to chapters 0 and 1.
# Each hint names the lesson to go back to. Every number recomputed in screens/tools/recompute-ch2.py.
chapter: 2
questions:
  - id: Q-2-review-01
    type: numeric
    objectives: [OBJ-2.1-3, OBJ-0.4-3]
    level: basic
    prompt: >-
      מה הרדיוס של המעגל $x^2+y^2+2x-6y=6$?
    answer: 4
    tolerance: 0.001
    correctFeedback: >-
      נכון. $(x+1)^2-1+(y-3)^2-9=6$, כלומר $(x+1)^2+(y-3)^2=16$: מרכז $(-1,3)$ ורדיוס 4.
    wrongFeedback: >-
      השלימו כל משתנה לריבוע, ואל תשכחו לפצות על מה שנוסף.
    commonWrong:
      - value: 16
        feedback: '16 הוא $R^2$; הרדיוס $\sqrt{16}=4$.'
        misconception: MC-c2-square-not-root
      - value: 2.449489742783178
        feedback: >-
          $\sqrt6$ מתקבל אם לא מוסיפים לאגף ימין את 1 ואת 9 שנוספו בהשלמה לריבוע.
        misconception: MC-c2-complete-square-sign
    hints: ['חזרו לשיעור 2.1 (הזזה של מעגל) ולשיעור 0.4 (מעגל בהשלמה לריבוע).']

  - id: Q-2-review-02
    type: mc
    objectives: [OBJ-2.3-2, OBJ-2.4-2]
    qualitative: true
    level: basic
    prompt: >-
      המשוואה $r=3$ מתארת עקום במישור בקואורדינטות קוטביות, ומשטח במרחב בקואורדינטות גליליות. מהם?
    choices:
      - text: 'במישור מעגל ברדיוס 3 סביב הראשית; במרחב גליל ברדיוס 3 סביב ציר $z$'
        correct: true
        feedback: >-
          נכון. בגליליות $r$ הוא המרחק מציר $z$, ו-$z$ חופשי: המעגל "נמתח" לאורך ציר $z$.
      - text: 'במישור מעגל; במרחב ספירה ברדיוס 3'
        feedback: >-
          ספירה היא $r=3$ בקואורדינטות **כדוריות**, שבהן $r$ המרחק מהראשית. ה-$r$ הגלילי הוא המרחק מציר $z$.
        misconception: MC-c2-cyl-r-vs-sph-r
      - text: 'במישור ישר; במרחב מישור'
        feedback: '$r$ קבוע פירושו מרחק קבוע מהראשית (או מהציר): מעגל, לא ישר.'
        misconception: MC-c2-polar-r-theta-roles
    hints: ['חזרו לשיעור 2.3 (עקומים קוטביים) ולשיעור 2.4 (משטחי הקואורדינטות).']

  - id: Q-2-review-03
    type: numeric
    objectives: [OBJ-2.4-1]
    level: basic
    prompt: >-
      לנקודה הקואורדינטות הכדוריות $(r,\theta,\varphi)=\left(2,\frac{\pi}{2},\pi\right)$. מהי קואורדינטת $x$ שלה?
    answer: -2
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\theta=\frac{\pi}{2}$: הנקודה במישור $xy$; $\varphi=\pi$: בכיוון ציר $x$ השלילי. $x=2\sin\frac{\pi}{2}\cos\pi$,
      כלומר $(-2,0,0)$.
    wrongFeedback: '$x=r\sin\theta\cos\varphi$.'
    commonWrong:
      - value: 0
        feedback: >-
          0 מתקבל מ-$x=r\cos\theta\cos\varphi$, כאילו $\theta$ נמדדת ממישור $xy$. בקורס $\theta=\frac{\pi}{2}$ היא
          דווקא מישור $xy$, ו-$x=r\sin\theta\cos\varphi$.
        misconception: MC-c2-spherical-convention
    hints: ['חזרו לשיעור 2.4: הנוסחאות של הקואורדינטות הכדוריות.']

  - id: Q-2-review-04
    type: mc
    objectives: [OBJ-2.1-1, OBJ-1.2-2]
    level: basic
    prompt: >-
      על מעגל היחידה $(\cos t,\sin t)$ לוקחים את הנקודות ב-$t$ וב-$t+\frac{\pi}{2}$. מה הזווית בין שני וקטורי המקום?
    choices:
      - text: '$\frac{\pi}{2}$, לכל $t$'
        correct: true
        feedback: >-
          נכון. המכפלה הסקלרית $\cos t\cos\left(t+\frac{\pi}{2}\right)+\sin t\sin\left(t+\frac{\pi}{2}\right)=\cos\frac{\pi}{2}=0$.
          במעגל, הפרמטר הוא הזווית, והפרש פרמטרים הוא הזווית בין הווקטורים.
      - text: 'תלוי ב-$t$'
        feedback: >-
          המכפלה הסקלרית היא $\cos\left((t+\frac{\pi}{2})-t\right)$, שאינה תלויה ב-$t$. (באליפסה זה היה משתנה.)
        misconception: MC-c2-param-angle-polar
      - text: '$\frac{\pi}{4}$'
        feedback: 'הפרש הפרמטרים הוא $\frac{\pi}{2}$, ובמעגל היחידה זו בדיוק הזווית בין וקטורי המקום.'
        misconception: MC-c2-param-angle-polar
    hints: ['חזרו לשיעור 2.1 (פרמטריזציה של המעגל) ולשיעור 1.2 (הזווית ממכפלה סקלרית).']

  - id: Q-2-review-05
    type: expr
    objectives: [OBJ-2.2-3]
    level: mid
    prompt: >-
      פרמטריזציה של הענף הימני של ההיפרבולה $xy=4$ מתחילה ב-$x(t)=2t$, $t>0$. מהו $y(t)$? (השתמשו במשתנה $t$)
    answer: '2/t'
    answerTex: '$y(t)=\frac{2}{t}$'
    variables: [t]
    domain: [0.3, 3]
    correctFeedback: 'נכון. $xy=2t\cdot\frac2t=4$, וכש-$t$ עובר על $(0,\infty)$, $x$ עובר על כל החיוביים.'
    wrongFeedback: 'פתרו את $2t\cdot y=4$ עבור $y$.'
    commonWrong:
      - expr: '4/t'
        feedback: 'עם $y=\frac4t$ מקבלים $xy=8$. צריך לחלק ב-$x=2t$, לא ב-$t$.'
        misconception: MC-c2-param-vs-curve
      - expr: '2*t'
        feedback: 'זה הישר $y=x$, לא היפרבולה: $xy=4t^2$ אינו קבוע.'
        misconception: MC-c2-xy-asymptotes
    hints: ['חזרו לשיעור 2.2: פרמטריזציה של היפרבולה.']

  - id: Q-2-review-06
    type: twotier
    objectives: [OBJ-2.2-2]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא: כל משוואה מהצורה $Ax^2+Cy^2+Dx+Ey+F=0$ עם $A,C$ שאינם שניהם 0 מתארת אליפסה, פרבולה או היפרבולה.
    choices:
      - text: 'לא נכון'
        correct: true
        feedback: 'נכון. יש מקרים מנוונים: נקודה, זוג ישרים, ישר, וגם הקבוצה הריקה.'
      - text: 'נכון'
        feedback: >-
          $x^2-y^2=0$ הוא זוג ישרים, $x^2+y^2=0$ נקודה, ו-$x^2+y^2+1=0$ קבוצה ריקה. הסוג נקבע רק אחרי השלמת הריבוע,
          לפי אגף ימין.
        misconception: MC-c2-degenerate-conic
    reasons:
      - text: '$x^2+y^2+1=0$ היא קבוצה ריקה, ו-$x^2-y^2=0$ הוא זוג ישרים'
        correct: true
        feedback: 'בדיוק: דוגמה נגדית אחת מספיקה, והנה שתיים.'
      - text: 'כי סימני $A$ ו-$C$ קובעים תמיד את סוג העקום'
        feedback: >-
          הסימנים קובעים רק את ה"משפחה". באותה משפחה של האליפסות נמצאים גם הנקודה והקבוצה הריקה, לפי אגף ימין.
        misconception: MC-c2-conic-by-sign
    hints: ['חזרו לשיעור 2.2: זיהוי חתך חרוט ומקרים מנוונים.']

  - id: Q-2-review-07
    type: numeric
    objectives: [OBJ-2.4-1, OBJ-1.1-3]
    level: mid
    prompt: >-
      מה המרחק מהראשית של הנקודה שהקואורדינטות הגליליות שלה $(r,\theta,z)=\left(3,\frac{\pi}{5},4\right)$?
    answer: 5
    tolerance: 0.001
    correctFeedback: >-
      נכון. $x^2+y^2=r^2=9$, ולכן המרחק $\sqrt{9+16}=5$. הזווית $\frac{\pi}{5}$ אינה משנה דבר: סיבוב סביב ציר $z$ שומר
      מרחקים.
    wrongFeedback: 'אורך וקטור המקום הוא $\sqrt{x^2+y^2+z^2}$, ו-$x^2+y^2$ בגליליות הוא $r^2$.'
    commonWrong:
      - value: 3
        feedback: '3 הוא ה-$r$ הגלילי: המרחק מציר $z$, לא מהראשית.'
        misconception: MC-c2-cyl-r-vs-sph-r
      - value: 7
        feedback: 'אורך אינו סכום הרכיבים: $\sqrt{3^2+4^2}=5$, לא $3+4$.'
        misconception: MC-c1-length-sum
    hints: ['חזרו לשיעור 2.4 (גליליות) ולשיעור 1.1 (אורך של וקטור).']

  - id: Q-2-review-08
    type: multi
    objectives: [OBJ-2.4-2, OBJ-2.5-2]
    qualitative: true
    level: mid
    prompt: >-
      אילו מהבאים מתארים את אותה קבוצה כמו החרוט $z=\sqrt{x^2+y^2}$? סמנו את כולם.
    choices:
      - text: 'בגליליות: $z=r$'
        correct: true
        feedback: 'נכון. $\sqrt{x^2+y^2}$ הוא ה-$r$ הגלילי.'
      - text: 'בכדוריות: $\theta=\frac{\pi}{4}$'
        correct: true
        feedback: 'נכון. $z=r\cos\theta$ ו-$\sqrt{x^2+y^2}=r\sin\theta$, ושוויון ביניהם עם $z\ge0$ הוא $\theta=\frac{\pi}{4}$.'
      - text: 'בכדוריות: $\varphi=\frac{\pi}{4}$'
        feedback: 'אזימוט קבוע הוא חצי מישור. החרוט סימטרי סביב ציר $z$ ואינו תלוי ב-$\varphi$.'
        misconception: MC-c2-angle-const-plane
      - text: '$z=x^2+y^2$'
        feedback: 'זה פרבולואיד: בגובה $z=4$ הרדיוס 2, ובחרוט 4.'
        misconception: MC-c2-cone-vs-paraboloid
    hints: ['חזרו לשיעור 2.4 (משטחי הקואורדינטות) ולשיעור 2.5 (חרוט מול פרבולואיד).']

  - id: Q-2-review-09
    type: numeric
    objectives: [OBJ-2.5-3, OBJ-2.5-2]
    level: mid
    prompt: >-
      מה הרדיוס של מעגל החיתוך של ההיפרבולואיד $x^2+y^2-z^2=1$ עם המישור $z=2$?
    answer: 2.23606797749979
    tolerance: 0.001
    correctFeedback: 'נכון, $\sqrt5$: $x^2+y^2=1+z^2=5$. החתך הצר ביותר, ברדיוס 1, הוא ב-$z=0$.'
    wrongFeedback: 'הציבו $z=2$ והעבירו את $z^2$ לאגף ימין.'
    commonWrong:
      - value: 5
        feedback: '5 הוא $R^2$; הרדיוס $\sqrt5$.'
        misconception: MC-c2-square-not-root
      - value: 1
        feedback: '1 הוא הרדיוס של "המותן" ב-$z=0$. ככל ש-$|z|$ גדל, החתך גדל.'
        misconception: MC-c2-section-same-size
    hints: ['חזרו לשיעור 2.5: חיתוך של משטח עם מישור.']

  - id: Q-2-review-10
    type: mc
    objectives: [OBJ-2.3-3, OBJ-2.1-3]
    level: mid
    prompt: >-
      איך מתארים בקואורדינטות קוטביות את העיגול $x^2+(y-1)^2\le1$?
    choices:
      - text: '$0\le\theta\le\pi$, $0\le r\le2\sin\theta$'
        correct: true
        feedback: >-
          נכון. $x^2+y^2\le2y$ הוא $r^2\le2r\sin\theta$, כלומר $r\le2\sin\theta$, ויש נקודות רק כש-$\sin\theta\ge0$:
          העיגול מעל ציר $x$, נוגע בראשית.
      - text: '$0\le\theta<2\pi$, $0\le r\le1$'
        feedback: 'זה עיגול היחידה **סביב הראשית**. העיגול כאן מרכזו $(0,1)$.'
        misconception: MC-c2-polar-region-center
      - text: '$0\le\theta\le\pi$, $0\le r\le2\cos\theta$'
        feedback: '$2y=2r\sin\theta$. $r\le2\cos\theta$ הוא העיגול שמרכזו $(1,0)$.'
        misconception: MC-c2-polar-r-theta-roles
    hints: ['חזרו לשיעור 2.3 (תחומים בקוטביות) ולשיעור 2.1 (מעגל מוזז).']

  - id: Q-2-review-11
    type: numeric
    objectives: [OBJ-2.4-1, OBJ-1.2-2]
    level: exam
    prompt: >-
      שתי ערים על כדור הארץ (ספירה ברדיוס 1) נמצאות בזווית $\theta=\frac{\pi}{3}$ מהקוטב הצפוני, ובאזימוטים
      $\varphi=0$ ו-$\varphi=\frac{\pi}{2}$. מהי הזווית בין וקטורי המקום שלהן (ברדיאנים)?
    answer: 1.318116071652818
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\arccos\frac14\approx1.318$. הווקטורים: $\left(\frac{\sqrt3}{2},0,\frac12\right)$ ו-$\left(0,\frac{\sqrt3}{2},\frac12\right)$,
      והמכפלה הסקלרית $0+0+\frac14$. הזווית קטנה מ-$\frac{\pi}{2}$ כי שתי הערים קרובות לקוטב.
    wrongFeedback: >-
      כתבו את שני הווקטורים בקואורדינטות קרטזיות ($x=\sin\theta\cos\varphi$…) וחשבו מכפלה סקלרית.
    commonWrong:
      - value: 1.5707963267948966
        feedback: >-
          $\frac{\pi}{2}$ הוא הפרש האזימוטים. הוא שווה לזווית בין הווקטורים רק על קו המשווה, $\theta=\frac{\pi}{2}$.
        misconception: MC-c2-azimuth-difference-is-angle
      - value: 0.7227342478134157
        feedback: >-
          זה $\arccos\frac34$, מהווקטורים $\left(\frac12,0,\frac{\sqrt3}{2}\right)$ ו-$\left(0,\frac12,\frac{\sqrt3}{2}\right)$:
          החלפתם בין $\sin\theta$ ל-$\cos\theta$, כאילו $\theta$ נמדדת ממישור $xy$.
        misconception: MC-c2-spherical-convention
    hints: ['חזרו לשיעור 2.4 (מעבר מכדוריות לקרטזיות) ולשיעור 1.2 (זווית ממכפלה סקלרית).']

  - id: Q-2-review-12
    type: mc
    objectives: [OBJ-2.3-2, OBJ-2.2-2]
    level: exam
    prompt: >-
      מה העקום $r=\frac{1}{1-\cos\theta}$, $0<\theta<2\pi$?
    choices:
      - text: 'הפרבולה $y^2=1+2x$'
        correct: true
        feedback: >-
          נכון. $r-r\cos\theta=1$, כלומר $\sqrt{x^2+y^2}=1+x$, ובריבוע $x^2+y^2=1+2x+x^2$: $y^2=1+2x$. על הפרבולה
          $x\ge-\frac12$, ולכן $1+x>0$, וההעלאה בריבוע לא הוסיפה נקודות. המשוואה $\sqrt{x^2+y^2}=1+x$ אומרת גם משהו
          גיאומטרי: כל נקודה של העקום רחוקה מהראשית בדיוק כמו מהישר $x=-1$.
      - text: 'מעגל שעובר בראשית'
        feedback: >-
          $r\to\infty$ כש-$\theta\to0$: העקום אינו חסום, ולכן אינו מעגל. תרגמו: $\sqrt{x^2+y^2}=1+x$.
        misconception: MC-c2-polar-graph-as-cartesian
      - text: 'היפרבולה'
        feedback: >-
          אחרי ההעלאה בריבוע $x^2$ מצטמצם, ונשאר משתנה אחד בריבוע: פרבולה. בהיפרבולה נשארים שני ריבועים בסימנים שונים.
        misconception: MC-c2-conic-by-sign
    hints: ['חזרו לשיעור 2.3 (תרגום משוואה קוטבית) ולשיעור 2.2 (זיהוי חתך חרוט).']

  - id: Q-2-review-13
    type: numeric
    objectives: [OBJ-2.5-3, OBJ-2.1-2]
    level: exam
    prompt: >-
      המישור $z=y$ חותך את הגליל $x^2+y^2=1$ באליפסה. מה המרחק בין שתי הנקודות הרחוקות ביותר זו מזו על האליפסה
      (אורך הציר הגדול)?
    answer: 2.8284271247461903
    tolerance: 0.001
    correctFeedback: >-
      נכון, $2\sqrt2$. פרמטריזציה: $(\cos t,\sin t,\sin t)$. הנקודות $(0,1,1)$ ו-$(0,-1,-1)$ במרחק
      $\sqrt{0+4+4}=2\sqrt2$, ואילו $(\pm1,0,0)$ במרחק 2: חצאי הצירים $\sqrt2$ ו-1.
    wrongFeedback: >-
      כתבו את עקום החיתוך בפרמטריזציה $(\cos t,\sin t,\sin t)$ ומצאו את הנקודות הרחוקות ביותר מהמרכז.
    commonWrong:
      - value: 2
        feedback: >-
          2 הוא קוטר הגליל, וזה הציר **הקטן** של האליפסה. המישור הנטוי מותח את החתך בכיוון $y$ פי $\sqrt2$.
        misconception: MC-c2-section-same-size
    hints: ['חזרו לשיעור 2.5 (חיתוך עם מישור) ולשיעור 2.1 (חצאי הצירים של אליפסה).']
