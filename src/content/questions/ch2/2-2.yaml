# Lesson 2.2 — parabola and hyperbolas (notes p. 17: y - x^2 = 0, xy = 1).
# Objectives (src/course.ts):
#   OBJ-2.2-1  sketch the basic parabola and the hyperbolas xy = c and x^2 - y^2 = c
#   OBJ-2.2-2  identify a conic by its equation, completing the square when needed
#   OBJ-2.2-3  asymptotes of a hyperbola, and a parametrisation of each curve
# Hyperbolic functions are chapter 4: the hyperbola is parametrised here as a graph (x = sqrt(1 + t^2), y = t).
# Every number recomputed in screens/tools/recompute-ch2.py.
chapter: 2
questions:
  - id: Q-2.2-xy-quadrants
    type: mc
    objectives: [OBJ-2.2-1]
    qualitative: true
    level: basic
    prompt: >-
      היפרבולה מהצורה $xy=c$ עוברת דרך הנקודה $(-2,3)$. באילו רביעים של המישור היא נמצאת?
    choices:
      - text: 'ברביע השני וברביע הרביעי'
        correct: true
        feedback: >-
          נכון. $c=(-2)\cdot3=-6<0$, ולכן בכל נקודה של העקום $x$ ו-$y$ בסימנים הפוכים: ענף אחד ברביע השני, שבו
          הנקודה הנתונה, וענף אחד ברביע הרביעי, למשל הנקודה $(2,-3)$.
      - text: 'ברביע הראשון וברביע השלישי'
        feedback: >-
          שם נמצאת $xy=c$ כש-$c>0$. כאן $c=(-2)\cdot3=-6$, והנקודה הנתונה עצמה נמצאת ברביע השני.
        misconception: MC-c2-hyperbola-opening
      - text: 'בכל ארבעת הרביעים'
        feedback: >-
          זה נכון ל-$x^2-y^2=c$, שכל ענף שלה עובר בשני רביעים. ב-$xy=-6$ המכפלה שלילית בכל נקודה, ולכן אין נקודות
          ברביעים הראשון והשלישי.
        misconception: MC-c2-hyperbola-opening
      - text: 'ברביע הראשון וברביע השני'
        feedback: >-
          ברביע הראשון $x$ ו-$y$ חיוביים, והמכפלה שלהם חיובית, לא $-6$. שני חלקים מעל ציר $x$ יש לפרבולה כמו
          $y=x^2$, לא להיפרבולה הזו.
        misconception: MC-c2-hyperbola-opening

  - id: Q-2.2-opening
    type: mc
    objectives: [OBJ-2.2-1]
    qualitative: true
    level: basic
    prompt: >-
      היכן ההיפרבולה $y^2-x^2=1$ חותכת את הצירים?
    choices:
      - text: 'רק את ציר $y$, בנקודות $(0,\pm1)$'
        correct: true
        feedback: >-
          נכון. $x=0$ נותן $y^2=1$, ו-$y=0$ נותן $x^2=-1$, שאין לו פתרון. הענפים פתוחים למעלה ולמטה, והאסימפטוטות
          $y=\pm x$.
      - text: 'רק את ציר $x$, בנקודות $(\pm1,0)$'
        feedback: >-
          זה המצב של $x^2-y^2=1$. כאן המשתנה עם הפלוס הוא $y$, ולכן הענפים חותכים את ציר $y$. הציבו $y=0$: $-x^2=1$.
        misconception: MC-c2-hyperbola-opening
      - text: 'את שני הצירים, בארבע נקודות'
        feedback: >-
          כך נראה מעגל או אליפסה. בהיפרבולה ההצבה באחד הצירים נותנת ריבוע שווה למספר שלילי.
        misconception: MC-c2-conic-by-sign

  - id: Q-2.2-vertex
    type: numeric
    objectives: [OBJ-2.2-1, OBJ-2.2-2]
    level: basic
    prompt: >-
      מהי קואורדינטת $y$ של הקודקוד של הפרבולה $y=x^2-4x+1$?
    answer: -3
    tolerance: 0.001
    correctFeedback: >-
      נכון. $x^2-4x+1=(x-2)^2-3$: הפרבולה $y=x^2$ מוזזת ב-2 ימינה וב-3 למטה, והקודקוד $(2,-3)$.
    wrongFeedback: >-
      השלימו לריבוע: $x^2-4x=(x-2)^2-4$.
    commonWrong:
      - value: 5
        feedback: >-
          $x^2-4x=(x-2)^2-4$, כי $(x-2)^2=x^2-4x+4$: את ה-4 שנוסף **מחסירים**. כאן הוסיפו אותו.
        misconception: MC-c2-complete-square-sign
      - value: 2
        feedback: >-
          2 היא קואורדינטת $x$ של הקודקוד $(2,-3)$. השאלה מבקשת את קואורדינטת $y$: הציבו $x=2$ ב-$y=x^2-4x+1$.

  - id: Q-2.2-identify
    type: mc
    objectives: [OBJ-2.2-2]
    level: basic
    prompt: >-
      איזה עקום מתאר $9x^2-4y^2=36$?
    choices:
      - text: 'היפרבולה שחותכת את ציר $x$ ב-$\pm2$'
        correct: true
        feedback: >-
          נכון. מחלקים ב-36: $\frac{x^2}{4}-\frac{y^2}{9}=1$. סימן מינוס בין הריבועים: היפרבולה; $y=0$ נותן $x=\pm2$.
      - text: 'אליפסה עם חצאי צירים 2 ו-3'
        feedback: >-
          באליפסה שני הריבועים באותו סימן. כאן יש מינוס, ולכן $y=0$ נותן נקודות אבל $x=0$ נותן $-4y^2=36$, בלי פתרון.
        misconception: MC-c2-conic-by-sign
      - text: 'היפרבולה שחותכת את ציר $y$ ב-$\pm3$'
        feedback: >-
          הציבו $x=0$: $-4y^2=36$, אין פתרון. הענפים חותכים את ציר $x$, של המשתנה שבא עם פלוס.
        misconception: MC-c2-hyperbola-opening
      - text: 'שני ישרים'
        feedback: >-
          שני ישרים מתקבלים כשאגף ימין 0: $9x^2-4y^2=0$, כלומר $y=\pm\frac32x$. אלה האסימפטוטות של העקום הזה.
        misconception: MC-c2-degenerate-conic

  - id: Q-2.2-asymptote-slope
    type: numeric
    objectives: [OBJ-2.2-3]
    level: basic
    prompt: >-
      מהו השיפוע החיובי של האסימפטוטות של ההיפרבולה $\frac{x^2}{9}-\frac{y^2}{4}=1$?
    answer: 0.6666666666666666
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac23$. לערכים גדולים של $|x|$ ה-1 זניח, ו-$\frac{x^2}{9}\approx\frac{y^2}{4}$, כלומר
      $y\approx\pm\frac23x$. האסימפטוטות הן $y=\pm\frac{b}{a}x$ עם $a=3$, $b=2$.
    wrongFeedback: >-
      החליפו את 1 ב-0 ופתרו את $\frac{x^2}{9}=\frac{y^2}{4}$ עבור $y$.
    commonWrong:
      - value: 1.5
        feedback: >-
          $\frac32$ הוא $\frac{a}{b}$: זה השיפוע של $x$ כפונקציה של $y$. פתרו עבור $y$: $y^2=\frac49x^2$.
        misconception: MC-c2-asymptote-swap
      - value: 0.4444444444444444
        feedback: >-
          $\frac49$ הוא $\frac{b^2}{a^2}$. צריך שורש: $y=\pm\sqrt{\frac49}\,x=\pm\frac23x$.
        misconception: MC-c2-square-not-root

  - id: Q-2.2-which-hyperbola
    type: multi
    objectives: [OBJ-2.2-2]
    qualitative: true
    level: mid
    prompt: >-
      אילו מהמשוואות מתארות היפרבולה? סמנו את כולן.
    choices:
      - text: '$xy=4$'
        correct: true
        feedback: 'נכון. זו $y=\frac4x$: היפרבולה ברביעים הראשון והשלישי, עם הצירים כאסימפטוטות.'
      - text: '$y^2-x^2=-3$'
        correct: true
        feedback: 'נכון. כפלו ב-$-1$: $x^2-y^2=3$, היפרבולה שפתוחה ימינה ושמאלה.'
      - text: '$y=\frac1x+2$'
        correct: true
        feedback: 'נכון. $(y-2)x=1$: ההיפרבולה $xy=1$ מוזזת ב-2 למעלה, עם האסימפטוטות $x=0$ ו-$y=2$.'
      - text: '$x^2-y^2=0$'
        feedback: >-
          $(x-y)(x+y)=0$: זוג הישרים $y=\pm x$. זה חתך חרוט "מנוון", והוא האסימפטוטות של ההיפרבולות $x^2-y^2=c$
          עם $c\ne0$.
        misconception: MC-c2-degenerate-conic
      - text: '$x^2+2y^2=-1$'
        feedback: >-
          אגף שמאל אינו שלילי, ולכן אין אף נקודה: הקבוצה ריקה. הסימן השלילי באגף ימין אינו הופך עקום להיפרבולה;
          ההיפרבולה צריכה סימנים שונים **בין הריבועים**.
        misconception: MC-c2-conic-by-sign

  - id: Q-2.2-complete-square
    type: mc
    objectives: [OBJ-2.2-2]
    level: mid
    prompt: >-
      מה מתאר העקום $x^2-y^2+2x+4y-4=0$?
    choices:
      - text: 'היפרבולה שמרכזה $(-1,2)$'
        correct: true
        feedback: >-
          נכון. $(x^2+2x)-(y^2-4y)-4=(x+1)^2-1-(y-2)^2+4-4$, ולכן $(x+1)^2-(y-2)^2=1$: ההיפרבולה $x^2-y^2=1$ מוזזת
          למרכז $(-1,2)$.
      - text: 'היפרבולה שמרכזה $(1,-2)$'
        feedback: >-
          $(x+1)^2$ מתאפס ב-$x=-1$ ו-$(y-2)^2$ ב-$y=2$: המרכז $(-1,2)$.
        misconception: MC-c2-shift-sign
      - text: 'מעגל שמרכזו $(-1,2)$'
        feedback: >-
          המקדמים של $x^2$ ושל $y^2$ הם 1 ו-$-1$, בסימנים שונים: היפרבולה. במעגל המקדמים שווים.
        misconception: MC-c2-conic-by-sign
      - text: 'שני ישרים דרך $(-1,2)$'
        feedback: >-
          שני ישרים מתקבלים רק כשאחרי השלמת הריבוע אגף ימין הוא 0. כאן $-(y^2-4y)=-(y-2)^2+4$, ובסוף נשאר
          $(x+1)^2-(y-2)^2=1$. מי ששוכח לפצות על מה שנוסף בהשלמה מקבל אגף ימין שגוי.
        misconception: MC-c2-complete-square-sign

  - id: Q-2.2-recipe
    type: rank
    objectives: [OBJ-2.2-2]
    qualitative: true
    level: basic
    prompt: >-
      סדרו את השלבים לזיהוי עקום מהצורה $Ax^2+Cy^2+Dx+Ey+F=0$ (בלי איבר $xy$, ו-$A,C\ne0$).
    help: 'גררו את השלבים לסדר הנכון: הראשון למעלה.'
    items:
      - { id: group, label: 'מקבצים את האיברים של $x$ ואת האיברים של $y$, ומוציאים את $A$ ואת $C$ מחוץ לסוגריים' }
      - { id: square, label: 'משלימים כל סוגריים לריבוע, ומפצים על מה שנוסף' }
      - { id: move, label: 'מעבירים את הקבוע לאגף ימין, ואם הוא שונה מ-0 מחלקים בו, כדי לקבל 1' }
      - { id: read, label: 'קוראים את הסוג מהסימן שבין הריבועים (אותו סימן אליפסה, סימנים שונים היפרבולה), את המרכז מהביטויים שבסוגריים ואת חצאי הצירים מהמכנים' }
    order: [group, square, move, read]
    correctFeedback: >-
      נכון. השלמת הריבוע מעבירה את המרכז לראשית; אחרי שאגף ימין הוא 1 אפשר לקרוא את סוג העקום ואת המידות שלו.
    wrongFeedback: >-
      אי אפשר לקרוא את חצאי הצירים לפני שאגף ימין הוא 1, ואי אפשר להשלים לריבוע לפני שמקבצים את איברי כל משתנה.

  - id: Q-2.2-xy-asymptotes
    type: mc
    objectives: [OBJ-2.2-3]
    level: mid
    prompt: >-
      מהן האסימפטוטות של ההיפרבולה $xy-2y=3$?
    choices:
      - text: 'הישרים $x=2$ ו-$y=0$'
        correct: true
        feedback: >-
          נכון. מוציאים את $y$ מחוץ לסוגריים: $(x-2)\,y=3$. זו ההיפרבולה $xy=3$ מוזזת ב-2 ימינה, והאסימפטוטות שלה הן
          הצירים המוזזים: כש-$x$ קרוב ל-2, $|y|=\frac{3}{|x-2|}$ גדול מאוד, וכש-$|x|$ גדול מאוד, $y$ קרוב ל-0.
      - text: 'שני הצירים, $x=0$ ו-$y=0$'
        feedback: >-
          אלה האסימפטוטות של $xy=3$. כאן $(x-2)\,y=3$: העקום מוזז ב-2 ימינה, והאסימפטוטה האנכית זזה איתו. בדקו:
          ב-$x=0$ יש נקודה על העקום, $\left(0,-\frac32\right)$, ולכן ציר $y$ אינו אסימפטוטה.
        misconception: MC-c2-xy-asymptotes
      - text: 'הישרים $x=-2$ ו-$y=0$'
        feedback: >-
          $(x-2)\,y=3$: הגורם $x-2$ מתאפס ב-$x=2$, ושם אין נקודה על העקום. ב-$x=-2$ דווקא יש נקודה,
          $\left(-2,-\frac34\right)$.
        misconception: MC-c2-shift-sign
      - text: 'הישרים $y=x-2$ ו-$y=-(x-2)$'
        feedback: >-
          ישרים נטויים דרך המרכז הם האסימפטוטות של היפרבולה של הפרש ריבועים, כמו $(x-2)^2-y^2=3$. כאן המכפלה
          $(x-2)\,y$ קבועה, והאסימפטוטות מקבילות לצירים.
        misconception: MC-c2-xy-asymptotes

  - id: Q-2.2-param-hyperbola
    type: expr
    objectives: [OBJ-2.2-3]
    level: mid
    prompt: >-
      רוצים פרמטריזציה של הענף **הימני** של ההיפרבולה $x^2-y^2=1$ שבה $y(t)=t$, כש-$t$ עובר על כל המספרים
      הממשיים. מהו $x(t)$? (השתמשו במשתנה $t$)
    answer: 'sqrt(1+t^2)'
    answerTex: '$x(t)=\sqrt{1+t^2},\quad y(t)=t$'
    variables: [t]
    domain: [-3, 3]
    correctFeedback: >-
      נכון. $x^2=1+y^2=1+t^2$, ובענף הימני $x>0$, ולכן לוקחים את השורש החיובי. כש-$t$ עובר על כל הממשיים, הנקודה
      עוברת על כל הענף.
    wrongFeedback: >-
      פתרו את $x^2-t^2=1$ עבור $x$, ובחרו את הסימן שמתאים לענף הימני.
    commonWrong:
      - expr: '-sqrt(1+t^2)'
        feedback: >-
          זה הענף **השמאלי**: שם $x\le-1$. לענף הימני צריך את השורש החיובי.
        misconception: MC-c2-sqrt-half-curve
      - expr: 'sqrt(t^2-1)'
        feedback: >-
          $x^2-y^2=1$ נותן $x^2=1+y^2$, עם פלוס. עם $\sqrt{t^2-1}$ מקבלים $x^2-t^2=-1$, היפרבולה אחרת, וגם הנוסחה אינה
          מוגדרת כש-$|t|<1$.
        misconception: MC-c2-hyperbola-opening
      - expr: '1+t^2'
        feedback: >-
          זה $x^2$. צריך $x=\sqrt{1+t^2}$.
        misconception: MC-c2-square-not-root

  - id: Q-2.2-param-range
    type: twotier
    objectives: [OBJ-2.2-3, OBJ-2.2-1]
    qualitative: true
    level: mid
    prompt: >-
      האם המסילה $(x,y)=(t^4,t^2)$, כש-$t$ עובר על כל המספרים הממשיים, עוברת על כל הפרבולה האופקית $x=y^2$?
    choices:
      - text: 'לא, רק על החצי $y\ge0$'
        correct: true
        feedback: >-
          נכון. כל הנקודות מקיימות $x=(t^2)^2=y^2$, אבל $y=t^2\ge0$: החצי התחתון של הפרבולה לעולם אינו מתקבל.
      - text: 'כן, כי $x=y^2$ לכל $t$'
        feedback: >-
          זה מראה שהמסילה **בתוך** הפרבולה, לא שהיא מכסה את כולה. צריך לבדוק גם אילו ערכים $y$ מקבל.
        misconception: MC-c2-param-range
    reasons:
      - text: '$y=t^2$ אינו שלילי לאף $t$, ולכן נקודה כמו $(1,-1)$ אינה מתקבלת'
        correct: true
        feedback: 'בדיוק. פרמטריזציה של הפרבולה כולה היא $(t^2,t)$: בפרבולה אופקית $y$ הוא שקובע את הנקודה.'
      - text: 'כי $t^4$ גדל מהר יותר מ-$t^2$'
        feedback: >-
          קצב הגידול אינו משנה את קבוצת הנקודות; כל הנקודות מקיימות $x=y^2$ בדיוק. השאלה היא אילו $y$ מתקבלים.
        misconception: MC-c2-param-range
      - text: 'כי כל נקודה מתקבלת פעמיים, מ-$t$ ומ-$-t$'
        feedback: >-
          זה נכון, אבל זה לא מה שמחסיר נקודות. מעבר כפול על אותן נקודות אינו מוסיף את החצי התחתון.
        misconception: MC-c2-param-vs-curve

  - id: Q-2.2-asymptote-shifted
    type: numeric
    objectives: [OBJ-2.2-3, OBJ-2.2-2]
    level: exam
    prompt: >-
      העקום $4x^2-y^2-8x+6y-9=0$ הוא היפרבולה שנפתחת ימינה ושמאלה. האסימפטוטה שלה בעלת השיפוע החיובי והישר האנכי
      שעובר דרך הקודקוד הימני נפגשים בנקודה אחת. מהי קואורדינטת $y$ של הנקודה הזו?
    answer: 5
    tolerance: 0.001
    correctFeedback: >-
      נכון. $4(x-1)^2-4-(y-3)^2+9-9=0$, כלומר $4(x-1)^2-(y-3)^2=4$, או $(x-1)^2-\frac{(y-3)^2}{4}=1$. המרכז $(1,3)$,
      $a=1$ ו-$b=2$. הקודקוד הימני $(2,3)$, והאסימפטוטה $y-3=2(x-1)$ נמצאת ב-$x=2$ בגובה $3+2=5$. זו הפינה $(2,5)$
      של המלבן שהאסימפטוטות הן האלכסונים שלו.
    wrongFeedback: >-
      השלימו לריבוע והביאו את אגף ימין ל-1, כדי לקרוא את המרכז, את $a$ ואת $b$. הקודקוד הימני נמצא $a$ יחידות מימין
      למרכז, והאסימפטוטות עוברות דרך המרכז בשיפועים $\pm\frac{b}{a}$.
    commonWrong:
      - value: 7.69041575982343
        feedback: >-
          $3+\sqrt{22}$ מתקבל מאגף ימין 22 במקום 4. לפני הסוגריים של $y$ עומד מינוס, ולכן $-(y^2-6y)=-(y-3)^2+9$,
          עם פלוס: הקבוע הוא $-4+9-9=-4$, ולא $-4-9-9=-22$.
        misconception: MC-c2-complete-square-sign
      - value: 4
        feedback: >-
          זה מתקבל מאגף ימין 1 במקום 4. הסוגריים של $x$ מוכפלים ב-4, ולכן $4(x^2-2x)=4(x-1)^2-4$: הפיצוי הוא $-4$,
          ולא $-1$.
        misconception: MC-c2-complete-square-sign
      - value: -1
        feedback: >-
          זה מתקבל מהמרכז $(-1,-3)$, עם סימנים הפוכים. $(x-1)^2$ מתאפס ב-$x=1$ ו-$(y-3)^2$ ב-$y=3$: המרכז $(1,3)$.
        misconception: MC-c2-shift-sign
      - value: 3.5
        feedback: >-
          זה מתקבל משיפוע $\frac12$ במקום 2. המשוואה $(x-1)^2-\frac{(y-3)^2}{4}=1$ נותנת, רחוק מהמרכז,
          $|y-3|\approx2|x-1|$, כלומר שיפוע $\frac{b}{a}=\frac21$.
        misconception: MC-c2-asymptote-swap

  - id: Q-2.2-sideways
    type: mc
    objectives: [OBJ-2.2-1, OBJ-2.2-2]
    level: mid
    prompt: >-
      מה מתארת המשוואה $y^2+2y-x+3=0$?
    choices:
      - text: 'פרבולה שנפתחת ימינה, עם קודקוד $(2,-1)$'
        correct: true
        feedback: >-
          נכון. יש $y^2$ ואין $x^2$: פרבולה אופקית. משלימים לריבוע את $y$ ומחלצים את $x$:
          $x=(y+1)^2-1+3=(y+1)^2+2$. זו הצורה $x=a(y-k)^2+h$ עם $a=1>0$, $h=2$ ו-$k=-1$.
      - text: 'פרבולה שנפתחת כלפי מעלה, עם קודקוד $(-1,2)$'
        feedback: >-
          המשתנה שבריבוע הוא $y$, ולכן $x=(y+1)^2+2$ היא פרבולה אופקית: ציר הסימטריה שלה הוא הישר האופקי $y=-1$,
          והקודקוד $(2,-1)$. כאן הוחלפו התפקידים של $x$ ושל $y$.
        misconception: MC-c2-parabola-axis
      - text: 'פרבולה שנפתחת ימינה, עם קודקוד $(-2,1)$'
        feedback: >-
          ב-$x=(y+1)^2+2$ הריבוע מתאפס ב-$y=-1$, ואז $x=2$: הקודקוד $(2,-1)$. בדקו: $(-2,1)$ נותנת במשוואה
          $1+2+2+3=8$, לא 0.
        misconception: MC-c2-shift-sign
      - text: 'פרבולה שנפתחת ימינה, עם קודקוד $(4,-1)$'
        feedback: >-
          $y^2+2y=(y+1)^2-1$: את ה-1 שנוסף מחסירים, ולכן $x=(y+1)^2-1+3=(y+1)^2+2$. כאן הוסיפו אותו וקיבלו 4.
        misconception: MC-c2-complete-square-sign

  - id: Q-2.2-degenerate-family
    type: mc
    objectives: [OBJ-2.2-2]
    qualitative: true
    level: exam
    prompt: >-
      לכל מספר $F$ נתונה המשוואה $x^2+4y^2-6x+8y+F=0$. מה היא מתארת, לפי הערך של $F$?
    choices:
      - text: 'אליפסה כש-$F<13$, נקודה אחת כש-$F=13$, וקבוצה ריקה כש-$F>13$'
        correct: true
        feedback: >-
          נכון. $(x-3)^2-9+4(y+1)^2-4+F=0$, כלומר $(x-3)^2+4(y+1)^2=13-F$. אגף שמאל הוא סכום של ריבועים: כשאגף ימין
          חיובי זו אליפסה שמרכזה $(3,-1)$, כשהוא 0 נשארת רק הנקודה $(3,-1)$, וכשהוא שלילי אין אף נקודה.
      - text: 'אליפסה לכל ערך של $F$, כי המקדמים של $x^2$ ושל $y^2$ חיוביים'
        feedback: >-
          הסימנים של המקדמים קובעים רק את המשפחה. אחרי ההשלמה לריבוע, $(x-3)^2+4(y+1)^2=13-F$: כש-$F=13$ זו נקודה
          אחת, וכש-$F>13$ אין אף נקודה, כי סכום של ריבועים אינו שלילי.
        misconception: MC-c2-degenerate-conic
      - text: 'אליפסה כש-$F>13$, נקודה אחת כש-$F=13$, וקבוצה ריקה כש-$F<13$'
        feedback: >-
          הכיוון הפוך. כשמעבירים את הקבוע לאגף ימין מתקבל $13-F$, והוא חיובי כש-$F<13$. בדקו עם $F=0$: הנקודה
          $(0,0)$ מקיימת את המשוואה, ולכן הקבוצה אינה ריקה.
        misconception: MC-c2-conic-by-sign
      - text: 'אליפסה כש-$F<10$, נקודה אחת כש-$F=10$, וקבוצה ריקה כש-$F>10$'
        feedback: >-
          10 מתקבל מ-$9+1$. אבל הסוגריים של $y$ מוכפלים ב-4: $4(y^2+2y)=4(y+1)^2-4$, ולכן הפיצוי הוא 4 ולא 1, והמספר
          הקובע הוא $9+4=13$.
        misconception: MC-c2-complete-square-sign

  - id: Q-2.2-vertex-distance
    type: numeric
    objectives: [OBJ-2.2-1, OBJ-2.2-3]
    level: exam
    prompt: >-
      היפרבולה מהצורה $x^2-y^2=c$ עוברת דרך הנקודה $(1,3)$. מהו המרחק בין שני הקודקודים שלה? (אפשר לכתוב תשובה
      מדויקת, עם שורש.)
    answer: 5.656854249492381
    tolerance: 0.001
    correctFeedback: >-
      נכון, $4\sqrt2$. $c=1-9=-8$, ולכן המשוואה היא $y^2-x^2=8$: ההיפרבולה נפתחת למעלה ולמטה. $x=0$ נותן
      $y=\pm\sqrt8=\pm2\sqrt2$, והמרחק בין הקודקודים $(0,2\sqrt2)$ ו-$(0,-2\sqrt2)$ הוא $4\sqrt2\approx5.657$.
    wrongFeedback: >-
      הציבו את הנקודה כדי למצוא את $c$, ושימו לב לסימן שלו. אחר כך הציבו $x=0$ ואז $y=0$, וראו לאיזו הצבה יש פתרון:
      שם הקודקודים.
    commonWrong:
      - value: 2.8284271247461903
        feedback: >-
          $2\sqrt2$ הוא המרחק של כל קודקוד מהמרכז. יש שני קודקודים, $(0,2\sqrt2)$ ו-$(0,-2\sqrt2)$, והמרחק ביניהם
          כפול.
      - value: 16
        feedback: >-
          16 הוא $2\cdot8$. מ-$y^2=8$ צריך להוציא שורש: $y=\pm\sqrt8$, והמרחק הוא $2\sqrt8=4\sqrt2$.
        misconception: MC-c2-square-not-root
      - value: 8
        feedback: >-
          8 הוא $y^2$ בקודקודים, לא המרחק ביניהם: $y=\pm\sqrt8$, והמרחק הוא $2\sqrt8=4\sqrt2$.
        misconception: MC-c2-square-not-root
