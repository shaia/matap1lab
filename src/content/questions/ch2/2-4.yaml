# Lesson 2.4 — cylindrical and spherical coordinates (notes pp. 29, 34–35).
# Objectives (src/course.ts):
#   OBJ-2.4-1  Cartesian <-> cylindrical and spherical, by the course's angle convention
#   OBJ-2.4-2  the surfaces where one coordinate is constant: cylinder, plane, sphere, cone
#   OBJ-2.4-3  solids such as a ball, a cylinder and a cone in the fitting coordinates
# Convention (CLAUDE.md): cylindrical (r, θ, z); spherical (r, θ, φ), θ from the positive z-axis, φ the azimuth.
# The notes measure their angle φ from the xy-plane (a latitude, -π/2..π/2) and call the azimuth θ: translated here.
# Every number recomputed in screens/tools/recompute-ch2.py; the questions revised after the lesson's review
# (theta-const, solid-cylinder, notes-translate, cone-translate, sphere-cyl, cyl-in-sph, under-cone,
# cone-sphere-circle, two-ceilings) in screens/tools/lesson-2-4.py.
chapter: 2
questions:
  - id: Q-2.4-cyl-to-cart
    type: numeric
    objectives: [OBJ-2.4-1]
    level: basic
    prompt: >-
      לנקודה הקואורדינטות הגליליות $(r,\theta,z)=\left(2,\frac{\pi}{3},-1\right)$. מהי קואורדינטת $y$ שלה?
    answer: 1.7320508075688772
    tolerance: 0.001
    correctFeedback: >-
      נכון, $y=r\sin\theta=2\cdot\frac{\sqrt3}{2}=\sqrt3$. הנקודה כולה: $(1,\sqrt3,-1)$; $z$ עובר כמו שהוא.
    wrongFeedback: >-
      בגליליות $x=r\cos\theta$, $y=r\sin\theta$, $z=z$: קוטביות במישור $xy$ ועוד גובה.
    commonWrong:
      - value: 1
        feedback: 'זה $x=r\cos\theta=1$. קואורדינטת $y$ באה עם סינוס.'
        misconception: MC-c2-polar-r-theta-roles
      - value: -1
        feedback: '$-1$ הוא $z$. השאלה שואלת על $y=r\sin\theta$.'
        misconception: MC-c2-polar-r-theta-roles

  - id: Q-2.4-sph-z
    type: numeric
    objectives: [OBJ-2.4-1]
    level: basic
    prompt: >-
      לנקודה הקואורדינטות הכדוריות $(r,\theta,\varphi)=\left(4,\frac{\pi}{3},\frac{\pi}{4}\right)$ (במוסכמה של הקורס:
      $\theta$ מציר $z$, $\varphi$ האזימוט). מהי קואורדינטת $z$ שלה?
    answer: 2
    tolerance: 0.001
    correctFeedback: >-
      נכון. $z=r\cos\theta=4\cos\frac{\pi}{3}=2$. הנקודה כולה: $(\sqrt6,\sqrt6,2)$, ובדיקה: $6+6+4=16=r^2$.
    wrongFeedback: >-
      $\theta$ היא הזווית מציר $z$, ולכן ההיטל על ציר $z$ הוא $r\cos\theta$.
    commonWrong:
      - value: 3.4641016151377544
        feedback: >-
          $2\sqrt3=4\sin\frac{\pi}{3}$ מתאים לזווית שנמדדת **ממישור $xy$**, כמו בסיכומי ההרצאות. בקורס $\theta$ נמדדת
          מציר $z$: $z=r\cos\theta$.
        misconception: MC-c2-spherical-convention
      - value: 2.8284271247461903
        feedback: >-
          $2\sqrt2=4\cos\frac{\pi}{4}$: השתמשתם באזימוט $\varphi$ במקום ב-$\theta$. האזימוט אינו משפיע על $z$.
        misconception: MC-c2-theta-cyl-vs-sph

  - id: Q-2.4-theta-const
    type: mc
    objectives: [OBJ-2.4-2]
    level: basic
    prompt: >-
      איזה משטח מתארת המשוואה $\theta=\frac{3\pi}{4}$ בקואורדינטות כדוריות?
    choices:
      - text: 'חרוט שהקודקוד שלו בראשית והוא פונה למטה, סביב ציר $z$ השלילי'
        correct: true
        feedback: >-
          נכון. כל הקרניים מהראשית שנוטות $\frac{3\pi}{4}$ מציר $z$ החיובי. הנטייה גדולה מ-$\frac{\pi}{2}$, ולכן
          $z=r\cos\theta<0$: החרוט מתחת למישור $xy$, והוא $z=-\sqrt{x^2+y^2}$.
      - text: 'חרוט שהקודקוד שלו בראשית והוא פונה למעלה, סביב ציר $z$ החיובי'
        feedback: >-
          חרוט שפונה למעלה הוא $\theta$ קטן מ-$\frac{\pi}{2}$, למשל $\theta=\frac{\pi}{4}$. כאן
          $\cos\frac{3\pi}{4}<0$, ולכן כל הנקודות מתחת למישור $xy$.
        misconception: MC-c2-angle-range
      - text: 'חצי מישור שהשפה שלו היא ציר $z$'
        feedback: >-
          זה $\varphi=\frac{3\pi}{4}$: אזימוט קבוע. כש-$\theta$ קבוע האזימוט מקיף את ציר $z$, והקרן משרטטת חרוט.
        misconception: MC-c2-angle-const-plane
      - text: 'ספירה ברדיוס $\frac{3\pi}{4}$'
        feedback: >-
          ספירה היא $r$ קבוע. $\theta$ היא זווית, ולא מרחק.
        misconception: MC-c2-polar-r-theta-roles

  - id: Q-2.4-solid-cylinder
    type: mc
    objectives: [OBJ-2.4-3]
    level: basic
    prompt: >-
      איך מתארים את הגליל המלא $x^2+y^2\le9$, $1\le z\le5$ בקואורדינטות גליליות?
    choices:
      - text: '$0\le r\le3$, $0\le\theta<2\pi$, $1\le z\le5$'
        correct: true
        feedback: 'נכון. בכל גובה בין 1 ל-5 החתך הוא עיגול ברדיוס 3 סביב ציר $z$.'
      - text: '$0\le r\le9$, $0\le\theta<2\pi$, $1\le z\le5$'
        feedback: '$x^2+y^2=r^2\le9$, ולכן $r\le3$.'
        misconception: MC-c2-square-not-root
      - text: '$0\le r\le3$, $0\le\theta\le\pi$, $1\le z\le5$'
        feedback: 'זה חצי גליל בלבד, $y\ge0$. גליל מלא סביב ציר $z$ מכסה את כל הכיוונים, $0\le\theta<2\pi$.'
        misconception: MC-c2-theta-cyl-vs-sph

  - id: Q-2.4-cart-to-sph
    type: numeric
    objectives: [OBJ-2.4-1]
    level: mid
    prompt: >-
      מצאו את הזווית הכדורית $\theta$ (מציר $z$ החיובי) של הנקודה $(0,\sqrt3,1)$.
    answer: 1.0471975511965976
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\theta=\frac{\pi}{3}$. $r=\sqrt{0+3+1}=2$ ו-$\cos\theta=\frac{z}{r}=\frac12$. האזימוט $\varphi=\frac{\pi}{2}$,
      כי הנקודה על ציר $y$ החיובי מבחינת ההיטל שלה.
    wrongFeedback: >-
      חשבו $r=\sqrt{x^2+y^2+z^2}$, ואז $\cos\theta=\frac{z}{r}$.
    commonWrong:
      - value: 0.5235987755982988
        feedback: >-
          $\frac{\pi}{6}$ היא הזווית **מעל מישור $xy$** (קו רוחב). הזווית מציר $z$ משלימה אותה ל-$\frac{\pi}{2}$.
        misconception: MC-c2-spherical-convention
      - value: 1.5707963267948966
        feedback: >-
          $\frac{\pi}{2}$ הוא האזימוט $\varphi$ של הנקודה, הזווית במישור $xy$. $\theta$ נמדדת מציר $z$.
        misconception: MC-c2-theta-cyl-vs-sph

  - id: Q-2.4-azimuth
    type: numeric
    objectives: [OBJ-2.4-1]
    level: mid
    prompt: >-
      מצאו את האזימוט $\varphi\in[0,2\pi)$ של הנקודה $(-1,-1,5)$ בקואורדינטות כדוריות.
    answer: 3.9269908169872414
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\varphi=\frac{5\pi}{4}$: האזימוט הוא הזווית הקוטבית של ההיטל $(-1,-1)$ על מישור $xy$, ברביע השלישי. הגובה
      $z=5$ אינו משפיע עליו.
    wrongFeedback: >-
      הטילו על מישור $xy$ ומצאו את הזווית הקוטבית של $(-1,-1)$, ברביע הנכון.
    commonWrong:
      - value: 0.7853981633974483
        feedback: >-
          $\arctan\frac{-1}{-1}=\frac{\pi}{4}$ היא הזווית של $(1,1)$. ההיטל $(-1,-1)$ ברביע השלישי: מוסיפים $\pi$.
        misconception: MC-c2-arctan-quadrant
      - value: -2.356194490192345
        feedback: '$-\frac{3\pi}{4}$ מגיע לאותו כיוון, אבל השאלה מבקשת $\varphi\in[0,2\pi)$.'
        misconception: MC-c2-angle-range

  - id: Q-2.4-notes-translate
    type: mc
    objectives: [OBJ-2.4-1]
    qualitative: true
    level: mid
    prompt: >-
      בספר שלא הכרתם כתוב על קואורדינטות כדוריות רק זה: $x=\rho\cos\theta\cos\varphi$,
      $y=\rho\sin\theta\cos\varphi$, $z=\rho\sin\varphi$. מה אפשר להסיק על הזווית שמסומנת שם $\varphi$?
    choices:
      - text: 'היא נמדדת ממישור $xy$ (זווית רוחב); הזווית של הקורס מציר $z$ שווה $\frac{\pi}{2}$ פחות הזווית הזו'
        correct: true
        feedback: >-
          נכון. מסתכלים על הנוסחה של $z$: יש בה סינוס, ולכן בזווית 0 הגובה הוא 0, כלומר הזווית נמדדת ממישור
          $xy$. אם נסמן אותה $\beta$, אז $z=\rho\sin\beta=r\cos\theta$ עם $\theta=\frac{\pi}{2}-\beta$: שתי זוויות
          שמשלימות זו את זו ל-$\frac{\pi}{2}$ מחליפות סינוס בקוסינוס. אלה הנוסחאות של סיכומי ההרצאות.
      - text: 'היא נמדדת מציר $z$ החיובי; זו הזווית $\theta$ של הקורס, ורק האות שלה אחרת'
        feedback: >-
          אילו נמדדה מציר $z$, בזווית 0 הנקודה הייתה על הציר והגובה היה $\rho$: בנוסחה של $z$ היה קוסינוס. כאן
          כתוב סינוס, ובזווית 0 הגובה הוא 0.
        misconception: MC-c2-spherical-convention
      - text: 'היא האזימוט, כמו הזווית $\varphi$ של הקורס, כי היא מסומנת באותה אות'
        feedback: >-
          האות אינה אומרת דבר. האזימוט אינו משפיע על הגובה, וכאן $z$ תלוי בזווית הזו. האזימוט של הספר הוא
          הזווית שמסומנת שם $\theta$: היא מופיעה ב-$x$ עם קוסינוס וב-$y$ עם סינוס, כמו בקוטביות.
        misconception: MC-c2-theta-cyl-vs-sph

  - id: Q-2.4-planes
    type: multi
    objectives: [OBJ-2.4-2]
    qualitative: true
    level: mid
    prompt: >-
      אילו מהמשטחים הבאים הם מישור או חצי מישור? סמנו את כולם.
    choices:
      - text: 'בגליליות: $\theta=\frac{\pi}{3}$'
        correct: true
        feedback: 'נכון. אזימוט קבוע וכל $r\ge0$ וכל $z$: חצי מישור שמכיל את ציר $z$.'
      - text: 'בגליליות: $z=2$'
        correct: true
        feedback: 'נכון. המישור האופקי בגובה 2.'
      - text: 'בכדוריות: $\theta=\frac{\pi}{2}$'
        correct: true
        feedback: 'נכון. זווית ישרה עם ציר $z$, כלומר $z=0$: מישור $xy$. זה ה"חרוט" היחיד שהוא שטוח.'
      - text: 'בכדוריות: $\varphi=\frac{\pi}{3}$'
        correct: true
        feedback: 'נכון. אזימוט קבוע: חצי מישור שמכיל את ציר $z$, כמו $\theta$ קבוע בגליליות.'
      - text: 'בכדוריות: $\theta=\frac{\pi}{3}$'
        feedback: >-
          $\theta$ קבוע בכדוריות הוא חרוט סביב ציר $z$. אל תבלבלו עם $\theta$ הגלילי, שהוא אזימוט.
        misconception: MC-c2-theta-cyl-vs-sph
      - text: 'בגליליות: $r=2$'
        feedback: '$r$ הגלילי הוא המרחק מציר $z$: $r=2$ הוא גליל.'
        misconception: MC-c2-cyl-r-vs-sph-r

  - id: Q-2.4-cone-translate
    type: mc
    objectives: [OBJ-2.4-2, OBJ-2.4-1]
    level: mid
    prompt: >-
      נתון המשטח $x^2+y^2=3z^2$, $z\ge0$. מה המשוואה של המשטח הזה בקואורדינטות הכדוריות של הקורס, ומה המשוואה
      שלו בקואורדינטות גליליות?
    choices:
      - text: 'כדוריות: $\theta=\frac{\pi}{3}$; גליליות: $r=\sqrt3\,z$'
        correct: true
        feedback: >-
          נכון. בכדוריות $x^2+y^2=r^2\sin^2\theta$ ו-$z^2=r^2\cos^2\theta$, ולכן $\tan^2\theta=3$, ועם $z\ge0$:
          $\tan\theta=\sqrt3$, $\theta=\frac{\pi}{3}$. בגליליות $x^2+y^2=r^2$, ולכן $r^2=3z^2$, ועם $z\ge0$:
          $r=\sqrt3\,z$. זה חרוט רחב שפונה למעלה: המרחק מהציר גדול פי $\sqrt3$ מהגובה.
      - text: 'כדוריות: $\theta=\frac{\pi}{6}$; גליליות: $r=\sqrt3\,z$'
        feedback: >-
          $\tan\theta$ הוא המרחק מהציר חלקי הגובה, $\frac{r\sin\theta}{r\cos\theta}$, וכאן הוא $\sqrt3$, לא
          $\frac{1}{\sqrt3}$. $\frac{\pi}{6}$ היא הזווית שהדופן יוצרת עם מישור $xy$, לא עם ציר $z$.
        misconception: MC-c2-spherical-convention
      - text: 'כדוריות: $r=\sqrt3$; גליליות: $r=\sqrt3\,z$'
        feedback: >-
          $r=\sqrt3$ בכדוריות הוא ספירה. על המשטח הזה אין מרחק קבוע מהראשית: כל קרן שלו נמשכת בלי סוף. מה
          שקבוע הוא הזווית מציר $z$.
        misconception: MC-c2-polar-r-theta-roles
      - text: 'כדוריות: $\varphi=\frac{\pi}{3}$; גליליות: $\theta=\frac{\pi}{3}$'
        feedback: >-
          אזימוט קבוע הוא חצי מישור. המשטח הזה נראה אותו דבר מכל צד של ציר $z$, ולכן האזימוט אינו מופיע
          במשוואה שלו בכלל.
        misconception: MC-c2-angle-const-plane

  - id: Q-2.4-sphere-cyl
    type: expr
    objectives: [OBJ-2.4-2, OBJ-2.4-3]
    level: mid
    prompt: >-
      כתבו את חצי הספירה **התחתון**, $x^2+y^2+z^2=16$ עם $z\le0$, בקואורדינטות גליליות, כ-$z$ כפונקציה של $r$.
      (השתמשו במשתנה $r$)
    answer: '-sqrt(16-r^2)'
    answerTex: '$z=-\sqrt{16-r^2},\quad 0\le r\le4$'
    variables: [r]
    domain: [0, 3.8]
    correctFeedback: >-
      נכון. $x^2+y^2=r^2$, ולכן $r^2+z^2=16$ ו-$z^2=16-r^2$. מאחר ש-$z\le0$ לוקחים את השורש השלילי. בדיקה:
      מתחת לראשית ($r=0$) הגובה הוא מינוס 4, ובשפה ($r=4$) הוא 0.
    wrongFeedback: >-
      החליפו את $x^2+y^2$ ב-$r^2$, פתרו עבור $z$, ובחרו את הסימן לפי $z\le0$.
    commonWrong:
      - expr: 'sqrt(16-r^2)'
        feedback: 'זה חצי הספירה **העליון**. עם $z\le0$ לוקחים את השורש השלילי.'
        misconception: MC-c2-sqrt-half-curve
      - expr: 'r-4'
        feedback: >-
          $\sqrt{16-r^2}$ אינו $4-r$: שורש של הפרש אינו הפרש של שורשים. ב-$r=2$ הגובה של הספירה הוא
          $z=-\sqrt{12}\approx-3.46$, ואילו $2-4=-2$. המשטח $z=r-4$ הוא חרוט שהקודקוד שלו ב-$(0,0,-4)$.
        misconception: MC-c2-sqrt-of-difference
      - expr: 'r^2-16'
        feedback: 'זה מינוס $z^2$. צריך להוציא שורש מ-$16-r^2$ ורק אז לשים את הסימן.'
        misconception: MC-c2-square-not-root

  - id: Q-2.4-cyl-in-sph
    type: mc
    objectives: [OBJ-2.4-2]
    level: mid
    prompt: >-
      הגליל $x^2+y^2=25$ הוא משטח קואורדינטה בגליליות, אבל לא בכדוריות. מה המשוואה שלו בקואורדינטות הכדוריות
      של הקורס?
    choices:
      - text: '$r=\dfrac{5}{\sin\theta}$'
        correct: true
        feedback: >-
          נכון. המרחק מציר $z$ הוא $r\sin\theta$, ועל הגליל הוא שווה 5: $r\sin\theta=5$. בדיקה: על הרצפה
          ($\theta=\frac{\pi}{2}$) המרחק מהראשית הוא 5, וככל שהקרן קרובה יותר לציר $z$ היא פוגעת בגליל רחוק
          יותר.
      - text: '$r=5$'
        feedback: >-
          $r=5$ בכדוריות הוא ספירה: מרחק 5 **מהראשית**. על הגליל המרחק **מציר $z$** הוא 5, והוא $r\sin\theta$.
        misconception: MC-c2-cyl-r-vs-sph-r
      - text: '$r=\dfrac{5}{\cos\theta}$'
        feedback: >-
          $r\cos\theta$ הוא הגובה $z$, ולכן זו המשוואה של המישור $z=5$. המרחק מציר $z$ הוא $r\sin\theta$, כי
          $\theta$ נמדדת מהציר ולא ממישור $xy$.
        misconception: MC-c2-spherical-convention
      - text: '$r=5\sin\theta$'
        feedback: >-
          מ-$r\sin\theta=5$ מחלקים ב-$\sin\theta$, לא כופלים. בדיקה: ב-$\theta=\frac{\pi}{6}$ הנוסחה הזו נותנת
          $r=2.5$, והמרחק מהציר הוא אז $2.5\cdot\frac12=1.25$, לא 5.
        misconception: MC-c2-polar-r-theta-roles

  - id: Q-2.4-choose
    type: mc
    objectives: [OBJ-2.4-3]
    qualitative: true
    level: mid
    prompt: >-
      צינור עבה נתון על ידי $1\le x^2+y^2\le4$, $0\le z\le5$. באיזו מערכת קואורדינטות התיאור שלו פשוט ביותר, ואיך הוא
      נראה בה?
    choices:
      - text: 'גליליות: $1\le r\le2$, $0\le\theta<2\pi$, $0\le z\le5$'
        correct: true
        feedback: 'נכון. התנאי הוא על המרחק מציר $z$ בלבד, וזה בדיוק ה-$r$ הגלילי; כל הגבולות קבועים.'
      - text: 'כדוריות: $1\le r\le2$, $0\le\theta\le\pi$, $0\le\varphi<2\pi$'
        feedback: >-
          זו קליפה כדורית בין הספירות ברדיוס 1 ו-2. ה-$r$ הכדורי הוא המרחק מהראשית, ובצינור הנקודה $(1.5,0,4)$
          במרחק גדול מ-2 מהראשית.
        misconception: MC-c2-cyl-r-vs-sph-r
      - text: 'גליליות: $1\le r\le4$, $0\le\theta<2\pi$, $0\le z\le5$'
        feedback: '$r^2$ בין 1 ל-4, ולכן $r$ בין 1 ל-2.'
        misconception: MC-c2-square-not-root

  - id: Q-2.4-under-cone
    type: mc
    objectives: [OBJ-2.4-3, OBJ-2.4-2]
    level: exam
    prompt: >-
      הגוף $E$ הוא כל הנקודות שבתוך הכדור $x^2+y^2+z^2\le36$, מעל מישור $xy$ ($z\ge0$) ו**מתחת** לחרוט
      $\sqrt3\,z=\sqrt{x^2+y^2}$. איך מתארים אותו בקואורדינטות כדוריות?
    choices:
      - text: '$0\le r\le6$, $\frac{\pi}{3}\le\theta\le\frac{\pi}{2}$, $0\le\varphi<2\pi$'
        correct: true
        feedback: >-
          נכון. על החרוט המרחק מהציר הוא $\sqrt3$ כפול הגובה: $r\sin\theta=\sqrt3\,r\cos\theta$, כלומר
          $\tan\theta=\sqrt3$ ו-$\theta=\frac{\pi}{3}$. "מתחת לחרוט" פירושו רחוק יותר מציר $z$, $\theta$ גדול, ו"מעל
          מישור $xy$" עוצר את $\theta$ ב-$\frac{\pi}{2}$. הכדור הוא $r\le6$, והגוף מקיף את ציר $z$ כולו.
      - text: '$0\le r\le6$, $\frac{\pi}{6}\le\theta\le\frac{\pi}{2}$, $0\le\varphi<2\pi$'
        feedback: >-
          $\tan\theta$ הוא המרחק מהציר חלקי הגובה, וכאן הוא $\sqrt3$, לא $\frac{1}{\sqrt3}$. $\frac{\pi}{6}$ היא
          הזווית שהדופן של החרוט יוצרת עם מישור $xy$; $\theta$ נמדדת מציר $z$.
        misconception: MC-c2-spherical-convention
      - text: '$0\le r\le6$, $0\le\theta\le\frac{\pi}{3}$, $0\le\varphi<2\pi$'
        feedback: >-
          זה החלק של הכדור ש**מעל** החרוט, סביב ציר $z$. בדיקה: הנקודה $(1,0,0)$ נמצאת ב-$E$ (על הרצפה, מתחת
          לחרוט), והזווית שלה היא $\theta=\frac{\pi}{2}$.
        misconception: MC-c2-cone-inside-outside
      - text: '$0\le r\le36$, $\frac{\pi}{3}\le\theta\le\frac{\pi}{2}$, $0\le\varphi<2\pi$'
        feedback: '$r^2\le36$ נותן $r\le6$.'
        misconception: MC-c2-square-not-root

  - id: Q-2.4-cone-sphere-circle
    type: numeric
    objectives: [OBJ-2.4-3, OBJ-2.4-1]
    level: exam
    prompt: >-
      החרוט $\sqrt3\,z=\sqrt{x^2+y^2}$ פוגש את הספירה $x^2+y^2+z^2=36$ במעגל אופקי. מה **הרדיוס** של המעגל הזה?
    answer: 5.196152422706632
    tolerance: 0.001
    correctFeedback: >-
      נכון, $3\sqrt3\approx5.196$. על החרוט $x^2+y^2=3z^2$, ולכן בספירה $4z^2=36$ ו-$z=3$; הרדיוס של המעגל הוא
      המרחק מציר $z$, $\sqrt{x^2+y^2}=\sqrt3\cdot3$. בכדוריות: החרוט הוא $\theta=\frac{\pi}{3}$, והרדיוס הוא
      $r\sin\theta=6\sin\frac{\pi}{3}=3\sqrt3$.
    wrongFeedback: >-
      הציבו $x^2+y^2=3z^2$ במשוואת הספירה כדי למצוא את הגובה, ואז חשבו את המרחק מציר $z$. הרדיוס של מעגל אופקי
      סביב ציר $z$ הוא המרחק של הנקודות שלו מהציר, לא מהראשית.
    commonWrong:
      - value: 3
        feedback: >-
          3 הוא **הגובה** של המעגל, $z=6\cos\frac{\pi}{3}$. הרדיוס שלו הוא המרחק מציר $z$:
          $\sqrt{x^2+y^2}=\sqrt3\,z=3\sqrt3$.
        misconception: MC-c2-polar-r-theta-roles
      - value: 6
        feedback: >-
          6 הוא המרחק של נקודות המעגל **מהראשית**, הרדיוס של הספירה. הרדיוס של המעגל הוא המרחק שלהן **מציר
          $z$**: $6\sin\frac{\pi}{3}=3\sqrt3$.
        misconception: MC-c2-cyl-r-vs-sph-r
      - value: 27
        feedback: 'זה $x^2+y^2$, ריבוע הרדיוס. הרדיוס הוא $\sqrt{27}=3\sqrt3$.'
        misconception: MC-c2-square-not-root

  - id: Q-2.4-two-ceilings
    type: mc
    objectives: [OBJ-2.4-3]
    level: exam
    prompt: >-
      הגוף $E$ הוא כל הנקודות שבתוך הכדור $x^2+y^2+z^2\le36$, מעל מישור $xy$ ($z\ge0$) ומתחת לחרוט
      $\sqrt3\,z=\sqrt{x^2+y^2}$. איך מתארים אותו בקואורדינטות **גליליות**? (בכל התשובות $0\le\theta<2\pi$.)
    choices:
      - text: 'ל-$0\le r\le3\sqrt3$: $0\le z\le\frac{r}{\sqrt3}$; ל-$3\sqrt3\le r\le6$: $0\le z\le\sqrt{36-r^2}$'
        correct: true
        feedback: >-
          נכון. בגליליות החרוט הוא $z=\frac{r}{\sqrt3}$ והספירה $z=\sqrt{36-r^2}$, ושניהם חוסמים את $z$ מלמעלה: שתי
          תקרות, וקובעת הנמוכה. הן נפגשות כש-$\frac{r^2}{3}=36-r^2$, כלומר $r=3\sqrt3$. עד שם החרוט נמוך יותר
          (ב-$r=3$: $\sqrt3\approx1.73$ מול $\sqrt{27}\approx5.2$), ומשם והלאה הספירה.
      - text: 'ל-$0\le r\le6$: $0\le z\le\frac{r}{\sqrt3}$'
        feedback: >-
          זה מתעלם מהכדור. ב-$r=6$ התיאור הזה מרשה גובה $\frac{6}{\sqrt3}\approx3.46$, אבל נקודה במרחק 6
          מהציר נמצאת בכדור רק בגובה 0. צריך להיות מתחת לשתי התקרות.
        misconception: MC-c2-cone-inside-outside
      - text: 'ל-$0\le r\le3\sqrt3$: $\frac{r}{\sqrt3}\le z\le\sqrt{36-r^2}$'
        feedback: >-
          זה החלק של הכדור ש**מעל** החרוט: כאן החרוט הוא רצפה. בגוף $E$ החרוט הוא תקרה, והרצפה היא מישור
          $xy$.
        misconception: MC-c2-cone-inside-outside
      - text: 'ל-$0\le r\le3\sqrt3$: $0\le z\le\frac{r}{\sqrt3}$; ל-$3\sqrt3\le r\le6$: $0\le z\le6-r$'
        feedback: >-
          הפיצול נכון, אבל הספירה בגליליות היא $z=\sqrt{36-r^2}$, ולא $6-r$: שורש של הפרש אינו הפרש של שורשים.
          ב-$r=3\sqrt3$ הגובה של הספירה הוא 3, ואילו $6-3\sqrt3\approx0.8$.
        misconception: MC-c2-sqrt-of-difference
