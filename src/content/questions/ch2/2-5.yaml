# Lesson 2.5 — surfaces in space and their sections (notes pp. 27–29, 33–34: the ellipsoid x^2/4 + y^2/9 + z^2 = 1
# and the cone x^2 + y^2 - z^2 = 0 through their sections).
# Objectives (src/course.ts):
#   OBJ-2.5-1  identify a surface by its sections with planes parallel to the coordinate planes
#   OBJ-2.5-2  the basic quadric surfaces: ellipsoid, cone, paraboloid, hyperboloid
#   OBJ-2.5-3  sketch a quadric from its sections, and find its intersection with a given plane
# Every number recomputed in screens/tools/recompute-ch2.py.
chapter: 2
questions:
  - id: Q-2.5-name
    type: mc
    objectives: [OBJ-2.5-2]
    level: basic
    prompt: >-
      מה המשטח $z=x^2+y^2$?
    choices:
      - text: 'פרבולואיד סיבובי, "קערה" שקודקודה בראשית'
        correct: true
        feedback: >-
          נכון. החתכים האופקיים $z=c>0$ הם מעגלים ברדיוס $\sqrt c$, והחתכים האנכיים $x=0$ ו-$y=0$ הם הפרבולות $z=y^2$
          ו-$z=x^2$.
      - text: 'חרוט'
        feedback: >-
          בחרוט $z^2=x^2+y^2$ החתכים האנכיים דרך הציר הם ישרים, $z=\pm y$. כאן ב-$x=0$ מקבלים את הפרבולה $z=y^2$.
        misconception: MC-c2-cone-vs-paraboloid
      - text: 'ספירה'
        feedback: >-
          בספירה $x^2+y^2+z^2=R^2$ שלושת המשתנים בריבוע ובאותו סימן, והמשטח חסום. כאן $z$ מופיע בחזקה ראשונה ו-$z$
          גדל ללא הגבלה.
        misconception: MC-c2-conic-by-sign

  - id: Q-2.5-ellipsoid-section
    type: numeric
    objectives: [OBJ-2.5-1, OBJ-2.5-3]
    level: basic
    prompt: >-
      המישור $z=\frac12$ חותך את האליפסואיד $\frac{x^2}{4}+\frac{y^2}{9}+z^2=1$ באליפסה. מה אורך חצי הציר שלה בכיוון
      $x$?
    answer: 1.7320508075688772
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\sqrt3$. מציבים: $\frac{x^2}{4}+\frac{y^2}{9}=\frac34$, ו-$y=0$ נותן $x^2=3$. חצי הציר בכיוון $y$ הוא
      $\frac{3\sqrt3}{2}$: אליפסה דומה לחתך ב-$z=0$, מוקטנת פי $\frac{\sqrt3}{2}$.
    wrongFeedback: >-
      הציבו $z=\frac12$ במשוואה, העבירו לאגף ימין, ואז הציבו $y=0$.
    commonWrong:
      - value: 2
        feedback: >-
          2 הוא חצי הציר של החתך ב-$z=0$. בגובה $\frac12$ החתך קטן יותר: אגף ימין $1-\frac14$.
        misconception: MC-c2-section-same-size
      - value: 1.5
        feedback: >-
          $\frac32=2\cdot\frac34$: הכפלתם את חצי הציר הישן ב-$\frac34$ בלי שורש. $x^2=4\cdot\frac34=3$, ולכן חצי הציר
          $2\sqrt{\frac34}=\sqrt3$.
        misconception: MC-c2-square-not-root

  - id: Q-2.5-hyperboloid
    type: mc
    objectives: [OBJ-2.5-2]
    level: basic
    prompt: >-
      מה המשטח $x^2+y^2-z^2=-1$?
    choices:
      - text: 'היפרבולואיד דו-יריעתי'
        correct: true
        feedback: >-
          נכון. $x^2+y^2=z^2-1$: יש חתך רק כש-$|z|\ge1$, ולכן שתי יריעות, מעל $z=1$ ומתחת ל-$z=-1$.
      - text: 'היפרבולואיד חד-יריעתי'
        feedback: >-
          זה $x^2+y^2-z^2=+1$, שבו לכל גובה יש מעגל. כאן ב-$z=0$ מקבלים $x^2+y^2=-1$, בלי נקודות.
        misconception: MC-c2-hyperboloid-sheets
      - text: 'חרוט'
        feedback: >-
          החרוט הוא $x^2+y^2-z^2=0$, עם אגף ימין 0. אגף ימין $-1$ מרחיק את המשטח מהראשית.
        misconception: MC-c2-degenerate-conic

  - id: Q-2.5-paraboloid-plane
    type: numeric
    objectives: [OBJ-2.5-3]
    level: basic
    prompt: >-
      מה הרדיוס של מעגל החיתוך של הפרבולואיד $z=x^2+y^2$ עם המישור $z=4$?
    answer: 2
    tolerance: 0.001
    correctFeedback: 'נכון. $x^2+y^2=4$: מעגל ברדיוס 2 בגובה 4.'
    wrongFeedback: 'הציבו $z=4$ וקראו את הרדיוס מהמשוואה של המעגל.'
    commonWrong:
      - value: 4
        feedback: '4 הוא $R^2$. הרדיוס $\sqrt4=2$.'
        misconception: MC-c2-square-not-root

  - id: Q-2.5-sections-identify
    type: mc
    objectives: [OBJ-2.5-1, OBJ-2.5-2]
    qualitative: true
    level: mid
    prompt: >-
      על משטח מסוים ידועים רק שני דברים: החתך שלו בכל מישור $z=c$ הוא מעגל סביב ציר $z$ ברדיוס $|c|$, והחתך שלו
      במישור $x=0$ הוא זוג הישרים $z=\pm y$. מה המשטח?
    choices:
      - text: 'חרוט כפול, $z^2=x^2+y^2$'
        correct: true
        feedback: >-
          נכון. רדיוס שגדל ביחס ישר לגובה וחתך אנכי שהוא זוג ישרים: זה החרוט. ב-$z=0$ המעגל מתנוון לנקודה, הקודקוד.
      - text: 'פרבולואיד, $z=x^2+y^2$'
        feedback: >-
          בפרבולואיד הרדיוס בגובה $c$ הוא $\sqrt c$, לא $|c|$, והחתך ב-$x=0$ הוא פרבולה. גם בו החתכים האופקיים
          מעגלים, ולכן צריך את החתך האנכי כדי להבדיל.
        misconception: MC-c2-cone-vs-paraboloid
      - text: 'גליל, $x^2+y^2=1$'
        feedback: >-
          בגליל כל החתכים האופקיים שווים ואינם תלויים ב-$c$. כאן הרדיוס $|c|$ משתנה עם הגובה.
        misconception: MC-c2-section-same-size

  - id: Q-2.5-sheets-why
    type: twotier
    objectives: [OBJ-2.5-1, OBJ-2.5-2]
    qualitative: true
    level: mid
    prompt: >-
      האם המישור $y=0$ חותך את המשטח $x^2-y^2+z^2=-1$?
    choices:
      - text: 'לא'
        correct: true
        feedback: >-
          נכון. $y=0$ נותן $x^2+z^2=-1$: אין חתך. $y$ הוא המשתנה החריג, והמישור $y=0$ מפריד בין שתי היריעות של
          המשטח.
      - text: 'כן, במעגל היחידה'
        feedback: >-
          מעגל היחידה $x^2+z^2=1$ הוא החתך במישור $y=0$ של המשטח $x^2-y^2+z^2=+1$. כאן הסימן של אגף ימין הפוך.
        misconception: MC-c2-hyperboloid-sheets
    reasons:
      - text: 'הצבת $y=0$ נותנת סכום ריבועים ששווה למספר שלילי'
        correct: true
        feedback: 'בדיוק. החתכים $y=c$ הם $x^2+z^2=c^2-1$, והם קיימים רק כש-$c^2\ge1$.'
      - text: 'כי כל היפרבולואיד עובר דרך הראשית'
        feedback: >-
          אף היפרבולואיד אינו עובר דרך הראשית: $0-0+0\ne\pm1$. רק החרוט, עם אגף ימין 0, עובר שם.
        misconception: MC-c2-degenerate-conic
      - text: 'כי הצבת $z=0$ נותנת $x^2-y^2=-1$, שהיא היפרבולה'
        feedback: >-
          החשבון נכון, אבל זה החתך במישור אחר, $z=0$, והוא אינו מכריע: חתכים שהם היפרבולות יש בשני סוגי
          ההיפרבולואידים. מה שמכריע הוא הצבת אפס במשתנה החריג, כאן $y$.
        misconception: MC-c2-hyperboloid-sheets

  - id: Q-2.5-saddle-sections
    type: mc
    objectives: [OBJ-2.5-1, OBJ-2.5-3]
    level: mid
    prompt: >-
      חותכים את המשטח $z=x^2-y^2$ במישורים $y=1$ ו-$x=1$. מה מתקבל?
    choices:
      - text: 'ב-$y=1$ פרבולה שנפתחת כלפי מעלה, $z=x^2-1$; ב-$x=1$ פרבולה שנפתחת כלפי מטה, $z=1-y^2$'
        correct: true
        feedback: >-
          נכון. בכיוון $x$ המשטח עולה ובכיוון $y$ יורד: זה פרבולואיד היפרבולי, "אוכף". החתכים האופקיים $z=c$ הם
          ההיפרבולות $x^2-y^2=c$ (ובגובה אפס, זוג הישרים $y=\pm x$).
      - text: 'בשני המישורים פרבולות שנפתחות כלפי מעלה'
        feedback: >-
          ב-$x=1$ מקבלים $z=1-y^2$, עם מינוס לפני $y^2$: פרבולה הפוכה. הסימן של כל משתנה קובע את כיוון הפתיחה.
        misconception: MC-c2-conic-by-sign
      - text: 'בשני המישורים היפרבולות'
        feedback: >-
          היפרבולות הן החתכים **האופקיים**, $z=c$ עם $c\ne0$. במישור $y=1$ נשאר משתנה אחד בריבוע, $x$, וזו פרבולה.
        misconception: MC-c2-hyperbola-opening

  - id: Q-2.5-sketch-recipe
    type: rank
    objectives: [OBJ-2.5-3, OBJ-2.5-1]
    qualitative: true
    level: mid
    prompt: >-
      סדרו את השלבים לשרטוט של המשטח $\frac{x^2}{4}+\frac{y^2}{9}-z^2=1$ בעזרת חתכים, לפי המתכון של השיעור.
    help: 'גררו את השלבים לסדר הנכון: הראשון למעלה.'
    items:
      - { id: subst, label: 'מציבים $z=c$ ומעבירים את $c^2$ לאגף ימין: $\frac{x^2}{4}+\frac{y^2}{9}=1+c^2$' }
      - { id: exists, label: 'אגף ימין חיובי לכל $c$: בכל גובה יש חתך, והוא אליפסה' }
      - { id: size, label: 'מחלקים באגף ימין וקוראים את חצאי הצירים, $2\sqrt{1+c^2}$ ו-$3\sqrt{1+c^2}$: הקטנים ביותר בגובה אפס' }
      - { id: profile, label: 'מציבים $x=0$, ואחר כך $y=0$: ההיפרבולות $\frac{y^2}{9}-z^2=1$ ו-$\frac{x^2}{4}-z^2=1$' }
      - { id: assemble, label: 'מציירים אליפסות בכמה גבהים, מחברים אותן בענפים של ההיפרבולות, ומזהים: היפרבולואיד חד-יריעתי' }
    order: [subst, exists, size, profile, assemble]
    correctFeedback: >-
      נכון. החתכים האופקיים אומרים באילו גבהים המשטח קיים ואיך הוא מתרחב; החתכים האנכיים נותנים את הפרופיל; יחד הם
      שלד, ורק ממנו מזהים את המשטח.
    wrongFeedback: >-
      לפי המתכון: קודם החתכים האופקיים (הצבה, לאילו גבהים יש חתך, ואז הגודל שלו), אחריהם שני החתכים האנכיים שנותנים
      את הפרופיל, ורק בסוף, כשיש שלד, מזהים את המשטח.

  - id: Q-2.5-sphere-plane
    type: numeric
    objectives: [OBJ-2.5-3]
    level: mid
    prompt: >-
      מה הרדיוס של מעגל החיתוך של הספירה $x^2+y^2+z^2=25$ עם המישור הנטוי $2x-y+2z=9$?
    answer: 4
    tolerance: 0.001
    correctFeedback: >-
      נכון. המרחק של המישור מהראשית, שהיא מרכז הספירה, הוא $\frac{|{-}9|}{\sqrt{4+1+4}}=3$, ולפי פיתגורס הרדיוס של
      החתך $\sqrt{25-9}=4$.
    wrongFeedback: >-
      כל חתך של ספירה במישור הוא מעגל. חשבו את המרחק $m$ של המישור ממרכז הספירה (הנוסחה של שיעור 1.3), ואז את
      $\sqrt{R^2-m^2}$.
    commonWrong:
      - value: 16
        feedback: '16 הוא ריבוע הרדיוס, $25-9$. הרדיוס $\sqrt{16}=4$.'
        misconception: MC-c2-square-not-root
      - value: 5
        feedback: >-
          5 הוא רדיוס הספירה. רק מישור שעובר דרך המרכז חותך אותה במעגל ברדיוס הזה. המישור כאן נמצא במרחק 3
          מהמרכז, והחתך קטן יותר.
        misconception: MC-c2-section-same-size

  - id: Q-2.5-ellipse-section-param
    type: expr
    objectives: [OBJ-2.5-3]
    level: exam
    prompt: >-
      המישור $z=2y+3$ חותך את הפרבולואיד $z=x^2+y^2$. כתבו פרמטריזציה של עקום החיתוך בצורה $x=p\cos t$,
      $y=q+p\sin t$, $z=z(t)$, עם $p>0$. מהו $z(t)$? (השתמשו במשתנה $t$)
    answer: '5+4*sin(t)'
    answerTex: '$x=2\cos t,\quad y=1+2\sin t,\quad z=5+4\sin t$'
    variables: [t]
    domain: [0, 6]
    correctFeedback: >-
      נכון. משווים את שני הביטויים ל-$z$: $x^2+y^2=2y+3$, ואחרי השלמה לריבוע $x^2+(y-1)^2=4$. ההיטל על מישור $xy$
      הוא מעגל ברדיוס 2 שמרכזו $(0,1)$, ולכן $x=2\cos t$ ו-$y=1+2\sin t$. את הגובה לוקחים מהמישור:
      $z=2y+3=5+4\sin t$. בדיקה על הפרבולואיד: $4\cos^2t+(1+2\sin t)^2=5+4\sin t$.
    wrongFeedback: >-
      מצאו קודם את ההיטל על מישור $xy$: השוו את שני הביטויים ל-$z$ והשלימו לריבוע ב-$y$. כתבו פרמטריזציה של
      ההיטל, ואת $z$ קחו ממשוואת המישור.
    commonWrong:
      - expr: '5+8*sin(t)'
        feedback: >-
          לקחתם 4 כרדיוס של ההיטל. במשוואה $x^2+(y-1)^2=4$ המספר 4 הוא ריבוע הרדיוס: הרדיוס 2, ולכן
          $y=1+2\sin t$ ו-$z=5+4\sin t$.
        misconception: MC-c2-square-not-root
      - expr: '1+4*sin(t)'
        feedback: >-
          לקחתם את המרכז של ההיטל ב-$(0,-1)$. $y^2-2y=(y-1)^2-1$, והסוגריים $(y-1)$ מתאפסים ב-$y=1$: המרכז $(0,1)$,
          ולכן $y=1+2\sin t$ ו-$z=2y+3=5+4\sin t$.
        misconception: MC-c2-shift-sign

  - id: Q-2.5-cone-plane
    type: mc
    objectives: [OBJ-2.5-3]
    level: exam
    prompt: >-
      המישור $z=2x+3$ חותך את החרוט $z^2=x^2+y^2$. מה ההיטל של עקום החיתוך על מישור $xy$?
    choices:
      - text: 'היפרבולה שמרכזה $(-2,0)$'
        correct: true
        feedback: >-
          נכון. מציבים: $(2x+3)^2=x^2+y^2$, כלומר $3x^2+12x+9=y^2$. הריבועים בסימנים שונים, ולכן זו היפרבולה.
          משלימים לריבוע, $3(x+2)^2-12+9=y^2$, ומקבלים $(x+2)^2-\frac{y^2}{3}=1$. השיפוע של המישור, 2, גדול מהשיפוע
          של הישרים של החרוט, 1, ולכן המישור פוגש את שני החצאים של החרוט. גם עקום החיתוך עצמו הוא היפרבולה: ההיטל
          כשהוא מתוח פי $\sqrt5$ בכיוון $x$.
      - text: 'היפרבולה שמרכזה $(2,0)$'
        feedback: >-
          הסוג נכון, המרכז לא. $3x^2+12x=3(x+2)^2-12$, והסוגריים $(x+2)$ מתאפסים ב-$x=-2$: המרכז $(-2,0)$.
        misconception: MC-c2-shift-sign
      - text: 'אליפסה שמרכזה $(-2,0)$'
        feedback: >-
          אחרי ההצבה מקבלים $3x^2+12x+9=y^2$. כשמעבירים את $y^2$ לאגף של $x^2$ הסימן שלו מתהפך, ולשני הריבועים
          סימנים שונים: היפרבולה. ההיטל הוא אליפסה רק כשהשיפוע של המישור קטן מ-1.
        misconception: MC-c2-conic-by-sign
      - text: 'פרבולה'
        feedback: >-
          ההיטל הוא פרבולה רק כש-$x^2$ מצטמצם, וזה קורה כשהשיפוע של המישור הוא 1, כמו במישור $z=x+2$. כאן
          $(2x+3)^2=4x^2+12x+9$, ואחרי ההצבה נשאר $3x^2$.
        misconception: MC-c2-tilted-plane-always-parabola

  # Added with the lesson (2026-11-18): the lesson teaches cylinders (a missing variable) and the difference between
  # a section by a tilted plane and its projection, and the bank had no question on either.
  - id: Q-2.5-missing-variable
    type: mc
    objectives: [OBJ-2.5-2]
    qualitative: true
    level: basic
    prompt: >-
      מה מתארת במרחב המשוואה $x^2+z^2=4$?
    choices:
      - text: 'גליל ברדיוס 2 שהציר שלו הוא ציר $y$'
        correct: true
        feedback: >-
          נכון. $y$ אינו מופיע במשוואה, ולכן הוא חופשי: דרך כל נקודה של המעגל $x^2+z^2=4$ שבמישור $xz$ עובר ישר שלם
          במקביל לציר $y$. כל החתכים $y=c$ הם אותו מעגל.
      - text: 'מעגל ברדיוס 2 במישור $xz$'
        feedback: >-
          כך היה במישור. במרחב משוואה אחת מתארת משטח: $y$ חסר במשוואה, ולכן הוא חופשי, לא אפס. המעגל עצמו דורש שתי
          משוואות, $x^2+z^2=4$ וגם $y=0$.
        misconception: MC-c2-missing-variable-cylinder
      - text: 'ספירה ברדיוס 2'
        feedback: >-
          בספירה מופיעים שלושת הריבועים, $x^2+y^2+z^2=4$. כאן $y$ חסר: הנקודה $(2,100,0)$ מקיימת את המשוואה, והיא רחוקה
          מאוד מהראשית.
        misconception: MC-c2-missing-variable-cylinder

  - id: Q-2.5-projection
    type: mc
    objectives: [OBJ-2.5-3]
    qualitative: true
    level: mid
    prompt: >-
      המישור $z=2y$ חותך את הפרבולואיד $z=x^2+y^2$. מציבים, משלימים לריבוע, ומקבלים $x^2+(y-1)^2=1$. מה מתארת
      המשוואה הזו?
    choices:
      - text: 'את ההיטל של עקום החיתוך על מישור $xy$; העקום עצמו אינו מעגל'
        correct: true
        feedback: >-
          נכון. המשוואה היא ב-$x$ וב-$y$ בלבד, ולכן היא מתארת את הצל של העקום על מישור $xy$: מעגל ברדיוס 1. העקום
          עצמו, $(\cos t,\ 1+\sin t,\ 2+2\sin t)$, הוא המעגל הזה כשהוא מתוח פי $\sqrt{1+2^2}=\sqrt5$ בכיוון $y$:
          אליפסה עם חצאי הצירים $\sqrt5$ ו-1. ואכן מ-$(0,0,0)$ עד $(0,2,4)$ המרחק $2\sqrt5$, ובכיוון $x$ רק 2.
      - text: 'את עקום החיתוך עצמו, שהוא מעגל ברדיוס 1 במישור הנטוי'
        feedback: >-
          הנקודות $(0,0,0)$ ו-$(0,2,4)$ שתיהן על העקום, והמרחק ביניהן $\sqrt{4+16}=2\sqrt5$, יותר מקוטר של מעגל ברדיוס
          1. המשוואה מתארת את ההיטל; העקום נמצא במישור נטוי, ושם הוא אליפסה.
        misconception: MC-c2-projection-is-curve
      - text: 'מעגל ברדיוס 1 שנמצא במישור $xy$, והוא עקום החיתוך, כי $z$ אינו מופיע במשוואה'
        feedback: >-
          $z$ שאינו מופיע אינו $z=0$. על עקום החיתוך $z=2y$, ורק הנקודה $(0,0,0)$ שלו נמצאת במישור $xy$.
        misconception: MC-c2-missing-variable-cylinder
