# Lesson 2.3 — polar coordinates (notes p. 17: x = r cos θ, y = r sin θ, r = sqrt(x^2 + y^2)).
# Objectives (src/course.ts):
#   OBJ-2.3-1  Cartesian <-> polar in both directions, the angle in the right quadrant
#   OBJ-2.3-2  sketch curves given by a polar equation, translate a Cartesian equation to polar
#   OBJ-2.3-3  regions such as an annulus or a sector in polar coordinates
# Convention in these questions: r >= 0, and each question states the range of θ it wants.
# Every number recomputed in screens/tools/recompute-ch2.py; the questions revised after the lesson review
# (arctan-trap, identify, offcenter-disk, extreme-x) in screens/tools/lesson-2-3.py.
chapter: 2
questions:
  - id: Q-2.3-to-cartesian
    type: numeric
    objectives: [OBJ-2.3-1]
    level: basic
    prompt: >-
      לנקודה הקואורדינטות הקוטביות $(r,\theta)=\left(4,\frac{2\pi}{3}\right)$. מהי קואורדינטת $x$ שלה?
    answer: -2
    tolerance: 0.001
    correctFeedback: >-
      נכון. $x=r\cos\theta=4\cos\frac{2\pi}{3}=4\cdot\left(-\frac12\right)$, כלומר $x=-2$, ו-$y=4\sin\frac{2\pi}{3}=2\sqrt3$.
      הנקודה ברביע השני, כמו שהזווית אומרת.
    wrongFeedback: >-
      $x=r\cos\theta$. הזווית $\frac{2\pi}{3}$ ברביע השני: מה הסימן של הקוסינוס שם?
    commonWrong:
      - value: 2
        feedback: >-
          ברביע השני הקוסינוס שלילי: $\cos\frac{2\pi}{3}=-\frac12$. הנקודה משמאל לציר $y$.
        misconception: MC-c2-arctan-quadrant
      - value: 3.4641016151377544
        feedback: >-
          זה $y=r\sin\theta=2\sqrt3$. הקואורדינטה $x$ באה עם קוסינוס.
        misconception: MC-c2-polar-r-theta-roles

  - id: Q-2.3-angle-quadrant
    type: numeric
    objectives: [OBJ-2.3-1]
    level: basic
    prompt: >-
      מצאו את הזווית הקוטבית של הנקודה $(-1,-\sqrt3)$, בטווח $0\le\theta<2\pi$. (כפולה של $\pi$ מקלידים בצורה
      כמו 2pi/5.)
    answer: 4.1887902047863905
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\theta=\frac{4\pi}{3}$. הנקודה ברביע השלישי, $r=2$, ו-$\cos\theta=-\frac12$, $\sin\theta=-\frac{\sqrt3}{2}$.
    wrongFeedback: >-
      קבעו קודם את הרביע לפי הסימנים של $x$ ו-$y$, ורק אחר כך את הזווית. $\arctan\frac{y}{x}$ לבדו אינו יודע באיזה רביע
      הנקודה.
    commonWrong:
      - value: 1.0471975511965976
        feedback: >-
          $\arctan\frac{-\sqrt3}{-1}=\arctan\sqrt3=\frac{\pi}{3}$, אבל זו הזווית של $(1,\sqrt3)$ ברביע הראשון. לנקודה
          $(-1,-\sqrt3)$ מוסיפים $\pi$.
        misconception: MC-c2-arctan-quadrant
      - value: -2.0943951023931957
        feedback: >-
          $-\frac{2\pi}{3}$ מגיע לאותה נקודה, אבל השאלה מבקשת זווית בטווח $0\le\theta<2\pi$: מוסיפים $2\pi$.
        misconception: MC-c2-angle-range

  - id: Q-2.3-same-point
    type: twotier
    objectives: [OBJ-2.3-1]
    qualitative: true
    level: basic
    prompt: >-
      האם $(r,\theta)=\left(2,\frac{\pi}{3}\right)$ ו-$(r,\theta)=\left(2,\frac{7\pi}{3}\right)$ הן אותה נקודה במישור?
    choices:
      - text: 'כן'
        correct: true
        feedback: 'נכון. $\frac{7\pi}{3}=\frac{\pi}{3}+2\pi$: סיבוב שלם נוסף מחזיר לאותה נקודה.'
      - text: 'לא'
        feedback: >-
          לנקודה אחת יש אינסוף זוויות, שנבדלות בכפולות של $2\pi$. לכן שאלות קובעות טווח, כמו $[0,2\pi)$, כשהן רוצות
          תשובה אחת.
        misconception: MC-c2-polar-unique
    reasons:
      - text: '$\cos$ ו-$\sin$ מחזוריות עם מחזור $2\pi$, ולכן $x$ ו-$y$ יוצאים זהים'
        correct: true
        feedback: 'בדיוק: $x=2\cos\frac{7\pi}{3}=1$ ו-$y=2\sin\frac{7\pi}{3}=\sqrt3$, כמו ב-$\frac{\pi}{3}$.'
      - text: 'כי הזוויות שונות, ולכל נקודה יש זווית אחת'
        feedback: >-
          הזווית נקבעת רק עד כדי כפולה של $2\pi$. הנקודה $(1,\sqrt3)$ מתקבלת מ-$\frac{\pi}{3}$, מ-$\frac{7\pi}{3}$
          ומ-$-\frac{5\pi}{3}$.
        misconception: MC-c2-polar-unique
      - text: 'כי $r$ זהה, ו-$r$ לבדו קובע את הנקודה'
        feedback: >-
          $r$ קובע רק את המעגל שעליו הנקודה; הזווית קובעת איפה על המעגל. כאן גם הזוויות מתאימות, וזו הסיבה.
        misconception: MC-c2-polar-r-theta-roles

  - id: Q-2.3-circle-to-polar
    type: mc
    objectives: [OBJ-2.3-2]
    level: basic
    prompt: >-
      מהי המשוואה הקוטבית של המעגל $x^2+y^2=4x$?
    choices:
      - text: '$r=4\cos\theta$'
        correct: true
        feedback: >-
          נכון. $r^2=4r\cos\theta$, ומחלקים ב-$r$ (הראשית, $r=0$, מתקבלת גם כך ב-$\theta=\frac{\pi}{2}$). זה מעגל
          שמרכזו $(2,0)$ ורדיוסו 2, ועובר בראשית.
      - text: '$r=4\sin\theta$'
        feedback: >-
          $4x=4r\cos\theta$, עם קוסינוס. $r=4\sin\theta$ הוא המעגל $x^2+y^2=4y$, שמרכזו על ציר $y$.
        misconception: MC-c2-polar-r-theta-roles
      - text: '$r=2$'
        feedback: >-
          $r=2$ הוא מעגל ברדיוס 2 **סביב הראשית**. המעגל כאן מרכזו $(2,0)$: $(x-2)^2+y^2=4$.
        misconception: MC-c2-polar-region-center
      - text: '$r^2=4\cos\theta$'
        feedback: >-
          $4x=4r\cos\theta$ ולא $4\cos\theta$: גם $x$ צריך להיות מתורגם עם $r$.
        misconception: MC-c2-polar-r-theta-roles

  - id: Q-2.3-annulus
    type: mc
    objectives: [OBJ-2.3-3]
    level: basic
    prompt: >-
      איך מתארים בקואורדינטות קוטביות את התחום $1\le x^2+y^2\le4$, $y\ge0$?
    choices:
      - text: '$1\le r\le2$, $0\le\theta\le\pi$'
        correct: true
        feedback: 'נכון. חצי טבעת עליונה בין המעגלים ברדיוס 1 ו-2.'
      - text: '$1\le r\le4$, $0\le\theta\le\pi$'
        feedback: '$x^2+y^2=r^2$, ולכן $1\le r^2\le4$, כלומר $1\le r\le2$.'
        misconception: MC-c2-square-not-root
      - text: '$1\le r\le2$, $0\le\theta\le\frac{\pi}{2}$'
        feedback: >-
          $y\ge0$ כולל גם את הרביע השני ($x<0$), כלומר $\frac{\pi}{2}\le\theta\le\pi$. הרביע הראשון לבדו הוא רק חצי
          מהתחום.
        misconception: MC-c2-arctan-quadrant

  - id: Q-2.3-arctan-trap
    type: mc
    objectives: [OBJ-2.3-1]
    qualitative: true
    level: mid
    prompt: >-
      על נקודה במישור, שאינה הראשית, ידוע רק ש-$\tan\theta=-\sqrt3$, כאשר $\theta$ היא הזווית הקוטבית שלה. סטודנטית
      מקישה במחשבון $\arctan(-\sqrt3)$, מקבלת $-\frac{\pi}{3}$, ומסיקה: "הנקודה ברביע הרביעי". מה נכון?
    choices:
      - text: 'אי אפשר לדעת מהנתון הזה: הנקודה ברביע הרביעי או ברביע השני, וצריך נתון נוסף, למשל הסימן של $y$'
        correct: true
        feedback: >-
          נכון. למשוואה $\tan\theta=-\sqrt3$ יש שני פתרונות בסיבוב, שנבדלים ב-$\pi$: $\theta=\frac{5\pi}{3}$ (ברביע
          הרביעי, אותו כיוון כמו $-\frac{\pi}{3}$) ו-$\theta=\frac{2\pi}{3}$ (ברביע השני). המחשבון מחזיר תמיד את זה
          שפונה ימינה. אם $y>0$ הנקודה ברביע השני, ואם $y<0$ ברביע הרביעי.
      - text: 'היא צודקת: $\arctan$ מחזיר את הזווית של הנקודה'
        feedback: >-
          $\arctan$ מחזיר רק זוויות בין $-\frac{\pi}{2}$ ל-$\frac{\pi}{2}$, שפונות ימינה. גם $\tan\frac{2\pi}{3}$ הוא
          $-\sqrt3$, ולכן הנקודה יכולה להיות גם ברביע השני, למשל $(-1,\sqrt3)$.
        misconception: MC-c2-arctan-quadrant
      - text: 'היא טועה: לתוצאה של המחשבון תמיד מוסיפים $\pi$, ולכן הנקודה ברביע השני'
        feedback: >-
          $\pi$ מוסיפים רק כש-$x<0$, ואת הסימן של $x$ לא נתנו לנו. הנקודה $(1,-\sqrt3)$, למשל, מקיימת את הנתון והיא
          ברביע הרביעי. את הרביע קובעים מהסימנים של $x$ ו-$y$, לא מהמחשבון.
        misconception: MC-c2-arctan-quadrant
      - text: 'הרביע נכון, אבל הזווית היא $\frac{5\pi}{3}$ ולא $-\frac{\pi}{3}$'
        feedback: >-
          $\frac{5\pi}{3}$ ו-$-\frac{\pi}{3}$ הן שני שמות לאותו כיוון, בשני טווחים. הבעיה אינה השם אלא הרביע: הטנגנס
          לבדו אינו מבדיל בין הרביע הרביעי לרביע השני.
        misconception: MC-c2-angle-range

  - id: Q-2.3-line-to-polar
    type: mc
    objectives: [OBJ-2.3-2]
    qualitative: true
    level: mid
    prompt: >-
      איך נכתב הישר $y=3$ בקואורדינטות קוטביות?
    choices:
      - text: '$r=\frac{3}{\sin\theta}$, עם $0<\theta<\pi$'
        correct: true
        feedback: >-
          נכון. $r\sin\theta=3$. ככל ש-$\theta$ מתקרב ל-0 או ל-$\pi$ הנקודה מתרחקת לאורך הישר, ו-$r$ גדל בלי גבול.
      - text: '$r=3$'
        feedback: >-
          $r=3$ אומר "מרחק 3 מהראשית": זה מעגל, לא ישר. בישר $y=3$ המרחק מהראשית משתנה.
        misconception: MC-c2-polar-r-theta-roles
      - text: '$\theta=3$'
        feedback: >-
          $\theta$ קבוע הוא קרן מהראשית בזווית קבועה. הישר $y=3$ אינו עובר בראשית.
        misconception: MC-c2-polar-r-theta-roles

  - id: Q-2.3-identify
    type: mc
    objectives: [OBJ-2.3-2]
    qualitative: true
    level: mid
    prompt: >-
      מה העקום $r=-4\sin\theta$, $\pi\le\theta\le2\pi$?
    choices:
      - text: 'מעגל שמרכזו $(0,-2)$ ורדיוסו 2'
        correct: true
        feedback: >-
          נכון. כפלו ב-$r$: $x^2+y^2=-4y$, כלומר $x^2+(y+2)^2=4$. בטווח הנתון $\sin\theta\le0$, ולכן $r\ge0$: למשל
          ב-$\theta=\frac{3\pi}{2}$ מתקבל $r=4$, הנקודה $(0,-4)$. העקום עובר בראשית ב-$\theta=\pi$ וב-$\theta=2\pi$.
      - text: 'מעגל שמרכזו $(0,2)$ ורדיוסו 2'
        feedback: >-
          זה $r=4\sin\theta$. כאן יש מינוס: $x^2+y^2=-4y$, והשלמה לריבוע נותנת $(y+2)^2$. וגם בלי אלגברה: הכיוונים
          $\pi\le\theta\le2\pi$ פונים למטה, ולכן כל הנקודות מתחת לציר $x$.
        misconception: MC-c2-arctan-quadrant
      - text: 'גל של סינוס, הפוך, בגובה 4'
        feedback: >-
          זה הגרף של $y=-4\sin x$ במישור $(x,y)$. במשוואה קוטבית $\theta$ הוא זווית ו-$r$ מרחק: לכל כיוון $\theta$
          משרטטים נקודה במרחק שהנוסחה נותנת מהראשית.
        misconception: MC-c2-polar-graph-as-cartesian
      - text: 'מעגל שמרכזו בראשית ורדיוסו 4'
        feedback: >-
          $r$ אינו קבוע: ב-$\theta=\pi$ הוא 0 וב-$\theta=\frac{3\pi}{2}$ הוא 4. המעגל הזה עובר דרך הראשית, ו-4 הוא
          הקוטר שלו.
        misconception: MC-c2-polar-region-center

  - id: Q-2.3-intersection
    type: numeric
    objectives: [OBJ-2.3-2]
    level: mid
    prompt: >-
      המעגלים $r=1$ ו-$r=2\cos\theta$ נחתכים בשתי נקודות. מהי קואורדינטת $y$ של נקודת החיתוך העליונה?
    answer: 0.8660254037844386
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{\sqrt3}{2}$. $2\cos\theta=1$ נותן $\theta=\pm\frac{\pi}{3}$, והנקודה העליונה
      $\left(\cos\frac{\pi}{3},\sin\frac{\pi}{3}\right)=\left(\frac12,\frac{\sqrt3}{2}\right)$.
    wrongFeedback: >-
      השוו את שני הביטויים ל-$r$ ומצאו את $\theta$, ואז $y=r\sin\theta$.
    commonWrong:
      - value: 1.0471975511965976
        feedback: >-
          $\frac{\pi}{3}$ היא הזווית של הנקודה, לא קואורדינטת ה-$y$ שלה: $y=r\sin\theta=\sin\frac{\pi}{3}$.
        misconception: MC-c2-polar-r-theta-roles
      - value: 0.5
        feedback: >-
          $\frac12$ היא קואורדינטת $x$: $x=r\cos\theta$.
        misconception: MC-c2-polar-r-theta-roles

  - id: Q-2.3-sector-points
    type: multi
    objectives: [OBJ-2.3-3, OBJ-2.3-1]
    qualitative: true
    level: mid
    prompt: >-
      התחום $D$ נתון בקואורדינטות קוטביות: $0\le r\le2$, $\frac{\pi}{4}\le\theta\le\frac{\pi}{2}$. אילו מהנקודות
      (בקואורדינטות קרטזיות) נמצאות ב-$D$? סמנו את כולן.
    choices:
      - text: '$(1,1)$'
        correct: true
        feedback: 'נכון. $r=\sqrt2\le2$ ו-$\theta=\frac{\pi}{4}$: על הקרן שתוחמת את הגזרה, והיא שייכת לה כי האי-שוויון כולל שוויון.'
      - text: '$\left(0,\frac32\right)$'
        correct: true
        feedback: 'נכון. $r=\frac32$ ו-$\theta=\frac{\pi}{2}$, על ציר $y$, הקרן השנייה שתוחמת את הגזרה.'
      - text: '$(1,2)$'
        feedback: >-
          הזווית $\arctan2$ בין $\frac{\pi}{4}$ ל-$\frac{\pi}{2}$, אבל $r=\sqrt5>2$: הנקודה מחוץ לגזרה, רחוקה מדי.
        misconception: MC-c2-square-not-root
      - text: '$(2,1)$'
        feedback: >-
          $r=\sqrt5$, וגם הזווית $\arctan\frac12<\frac{\pi}{4}$: הנקודה מתחת לישר $y=x$.
        misconception: MC-c2-polar-r-theta-roles
      - text: '$(-1,1)$'
        feedback: >-
          $r=\sqrt2$, אבל הנקודה ברביע השני: $\theta=\frac{3\pi}{4}$, מחוץ לגזרה. ($\arctan\frac{1}{-1}=-\frac{\pi}{4}$
          טועה ברביע.)
        misconception: MC-c2-arctan-quadrant

  - id: Q-2.3-offcenter-disk
    type: mc
    objectives: [OBJ-2.3-3, OBJ-2.3-2]
    level: exam
    prompt: >-
      $D$ הוא החלק של העיגול $(x-1)^2+y^2\le1$ שנמצא מעל הישר $y=x$ או עליו. איך מתארים את $D$ בקואורדינטות
      קוטביות?
    choices:
      - text: '$\frac{\pi}{4}\le\theta\le\frac{\pi}{2}$, $0\le r\le2\cos\theta$'
        correct: true
        feedback: >-
          נכון. העיגול: $(x-1)^2+y^2\le1$ שקול ל-$r^2\le2r\cos\theta$, כלומר $r\le2\cos\theta$, ויש בו נקודות רק
          בכיוונים שבהם $\cos\theta\ge0$, בין מינוס $\frac{\pi}{2}$ ל-$\frac{\pi}{2}$. התנאי $y\ge x$ הוא חצי המישור
          $\frac{\pi}{4}\le\theta\le\frac{5\pi}{4}$. הכיוונים שמקיימים את שניהם: $\frac{\pi}{4}\le\theta\le\frac{\pi}{2}$.
          בדיקה: הנקודה $(r,\theta)=\left(\frac12,\frac{\pi}{3}\right)$ היא $\left(\frac14,\frac{\sqrt3}{4}\right)$,
          בתוך העיגול ומעל הישר.
      - text: '$\frac{\pi}{4}\le\theta\le\frac{\pi}{2}$, $0\le r\le1$'
        feedback: >-
          $0\le r\le1$ הוא עיגול ברדיוס 1 **סביב הראשית**. העיגול כאן מרכזו $(1,0)$, והראשית על המעגל שתוחם אותו,
          ולכן הגבול של $r$ תלוי בכיוון. הנקודה $(0,1)$, למשל, מקיימת את התיאור הזה ואינה בעיגול: $(0-1)^2+1^2=2>1$.
        misconception: MC-c2-polar-region-center
      - text: '$-\frac{\pi}{2}\le\theta\le\frac{\pi}{2}$, $0\le r\le2\cos\theta$'
        feedback: >-
          זה העיגול כולו: טווח הזוויות שבו $\cos\theta\ge0$, בלי התנאי $y\ge x$. הנקודה $(1,0)$, למשל ($r=1$,
          $\theta=0$), מקיימת את התיאור הזה ואינה ב-$D$, כי היא מתחת לישר: $0<1$. טווח הזוויות של $D$ צריך לקיים גם את
          התנאי של חצי המישור, $\frac{\pi}{4}\le\theta\le\frac{5\pi}{4}$.
        misconception: MC-c2-polar-region-center
      - text: '$\frac{\pi}{4}\le\theta\le\frac{\pi}{2}$, $0\le r\le2\sin\theta$'
        feedback: >-
          $r=2\sin\theta$ הוא המעגל $x^2+(y-1)^2=1$, שמרכזו על ציר $y$. כאן המרכז $(1,0)$ על ציר $x$:
          $x^2+y^2\le2x$, ו-$x$ הולך עם הקוסינוס.
        misconception: MC-c2-polar-r-theta-roles

  - id: Q-2.3-extreme-x
    type: numeric
    objectives: [OBJ-2.3-2]
    level: exam
    prompt: >-
      על העקום $r=3-2\cos\theta$, $0\le\theta<2\pi$, מהי קואורדינטת $x$ הגדולה ביותר? (אפשר להקליד שבר, כמו 7/3.)
    answer: 1.125
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac98$. $x=r\cos\theta=(3-2u)\,u$ עם $u=\cos\theta$, כלומר $x=-2u^2+3u=-2\left(u-\frac34\right)^2+\frac98$.
      זו פרבולה "בוכה" שהקודקוד שלה ב-$u=\frac34$, בתוך הקטע $[-1,1]$, ולכן המקסימום הוא $\frac98$, כש-$\cos\theta=\frac34$.
      הנקודה הימנית ביותר אינה על ציר $x$: ב-$\theta=0$ רק $x=1$.
    wrongFeedback: >-
      "הימנית ביותר" היא שאלה על $x=r\cos\theta$, לא על $r$ ולא על $\theta$. כתבו את $x$ בעזרת $\cos\theta$ בלבד, תנו
      לו שם, והשלימו לריבוע. זכרו שקוסינוס מקבל רק ערכים בין מינוס 1 ל-1.
    commonWrong:
      - value: 1
        feedback: >-
          זה $x$ בכיוון $\theta=0$, שם $r=1$. פונים ימינה, אבל המרחק שם הוא הקטן ביותר. קצת מעל הציר המרחק גדל מהר
          יותר ממה שהכיוון מפסיד: כש-$\cos\theta=\frac34$ מתקבל $r=\frac32$ ו-$x=\frac32\cdot\frac34=\frac98>1$.
        misconception: MC-c2-polar-extreme-r
      - value: 5
        feedback: >-
          5 הוא ה-$r$ הגדול ביותר, והוא מתקבל ב-$\theta=\pi$, בצד **שמאל**: זו הנקודה $(-5,0)$, השמאלית ביותר. מרחק
          גדול אינו אומר $x$ גדול.
        misconception: MC-c2-polar-extreme-r
      - value: 0.75
        feedback: >-
          $\frac34$ הוא הערך של $\cos\theta$ שבו $x$ הגדול ביותר, לא $x$ עצמו: שם $r=3-2\cdot\frac34=\frac32$,
          ו-$x=r\cos\theta=\frac32\cdot\frac34$.
        misconception: MC-c2-polar-r-theta-roles
