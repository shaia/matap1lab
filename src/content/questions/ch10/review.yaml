# Chapter 10 review — functions of several variables (lessons 10.1–10.9), easy to hard.
# Every lesson is touched; most questions combine two lessons, several reach back to chapters 1, 2, 4, 5, 6 and 9.
# Each hint names the lesson to go back to. Keys recomputed with screens/tools/cas.py.
chapter: 10
questions:
  - id: Q-10-review-01
    type: mc
    objectives: [OBJ-10.1-1, OBJ-2.5-2]
    qualitative: true
    level: basic
    prompt: >-
      קווי הגובה $f=c$ של פונקציה הם המעגלים $x^2+y^2=c$ (לכל $c\ge0$). איזה משטח הוא הגרף $z=f(x,y)$?
    choices:
      - text: 'פרבולואיד, $z=x^2+y^2$'
        correct: true
        feedback: >-
          נכון. בגובה $c$ החתך הוא מעגל ברדיוס $\sqrt c$, והחתכים האנכיים $z=x^2$ ($y=0$) הם פרבולות.
      - text: 'חרוט, $z=\sqrt{x^2+y^2}$'
        feedback: 'לחרוט קו הגובה $c$ הוא $x^2+y^2=c^2$, מעגל ברדיוס $c$, לא $\sqrt c$.'
        misconception: MC-c10-contour-spacing
      - text: 'גליל, $x^2+y^2=1$'
        feedback: 'גליל אינו גרף של פונקציה $z=f(x,y)$: מעל כל נקודה של המעגל יש ישר אנכי שלם.'
        misconception: MC-c10-level-vs-section
      - text: 'ספירה, $x^2+y^2+z^2=1$'
        feedback: 'בספירה המעגלים קטנים ככל ש-$z$ מתרחק מ-0, ואילו כאן הרדיוס גדל עם $c$.'
        misconception: MC-c10-contour-spacing
    hints: ['חזרו לשיעור 10.1 (קווי גובה וחתכים) ולשיעור 2.5 (המשטחים הריבועיים).']

  - id: Q-10-review-02
    type: numeric
    objectives: [OBJ-10.2-2, OBJ-1.1-3]
    level: basic
    prompt: >-
      תהי $f(x,y,z)=x^2yz$. חשבו את הנגזרת הכיוונית של $f$ בנקודה $(1,2,-1)$ בכיוון הווקטור $(2,1,2)$.
    answer: -1.66666666667
    tolerance: 0.001
    correctFeedback: >-
      נכון, $-\frac53$. $\nabla f=(2xyz,\ x^2z,\ x^2y)=(-4,-1,2)$, וקטור היחידה $\frac{(2,1,2)}{3}$ (האורך 3), ו-$D_{\hat u}f=\frac{-8-1+4}{3}$.
    wrongFeedback: >-
      חשבו את הגרדיאנט בנקודה, נרמלו את הכיוון, והכפילו סקלרית.
    commonWrong:
      - value: -5
        feedback: 'זה $\nabla f\cdot(2,1,2)$ בלי לחלק באורך 3. נגזרת כיוונית נלקחת עם וקטור יחידה.'
        misconception: MC-c10-nonunit-direction
    hints: ['חזרו לשיעור 10.2 (נגזרת כיוונית) ולשיעור 1.1 (וקטור יחידה).']

  - id: Q-10-review-03
    type: numeric
    objectives: [OBJ-10.3-2, OBJ-5.2-1]
    level: basic
    prompt: >-
      השתמשו במישור המשיק לגרף של $f(x,y)=e^x\cos y$ בנקודה $(0,0)$ כדי להעריך את $f(0.1,\,0.2)$.
    answer: 1.1
    tolerance: 0.001
    correctFeedback: >-
      נכון. $f(0,0)=1$, $f_x=e^x\cos y=1$, $f_y=-e^x\sin y=0$ בראשית, והמישור $z=1+x$, כמו הישר המשיק במשתנה אחד, עם איבר
      לינארי לכל משתנה.
    wrongFeedback: >-
      $f(x,y)\approx f(0,0)+f_x(0,0)\,x+f_y(0,0)\,y$. חשבו את שלושת המספרים.
    commonWrong:
      - value: 1.3
        feedback: '$f_y(0,0)=-\sin0=0$, לא 1: הנגזרת של $\cos y$ לפי $y$ מתאפסת ב-0. השינוי ב-$y$ לא תורם לקירוב הלינארי כאן.'
        misconception: MC-c10-partial-wrong-variable
    hints: ['חזרו לשיעור 10.3 (המישור המשיק כקירוב) ולשיעור 5.2 (קירוב לינארי במשתנה אחד).']

  - id: Q-10-review-04
    type: mc
    objectives: [OBJ-10.1-2, OBJ-4.1-1]
    level: basic
    prompt: >-
      מהו תחום ההגדרה של $f(x,y)=\ln x+\sqrt y$?
    choices:
      - text: '$x>0$ ו-$y\ge0$'
        correct: true
        feedback: 'נכון. כל גורם מוסיף תנאי: הלוגריתם $x>0$ והשורש $y\ge0$. התחום הוא הרביע הראשון עם חצי הציר החיובי של $x$ ($y=0$), בלי ציר $y$.'
      - text: '$x\ge0$ ו-$y\ge0$'
        feedback: '$\ln0$ אינו מוגדר: התנאי של הלוגריתם הוא אי-שוויון חזק.'
        misconception: MC-c10-domain-boundary
      - text: '$x>0$ ו-$y>0$'
        feedback: '$\sqrt0=0$ מוגדר, ולכן הנקודות עם $y=0$ ו-$x>0$ בתחום.'
        misconception: MC-c10-domain-boundary
      - text: '$x>0$'
        feedback: 'גם השורש מוסיף תנאי, $y\ge0$. התחום הוא החיתוך של התנאים.'
        misconception: MC-c10-domain-one-condition
    hints: ['חזרו לשיעור 10.1 (תחום הגדרה) ולשיעור 4.1 (תחום של פונקציה של משתנה אחד).']

  - id: Q-10-review-05
    type: numeric
    objectives: [OBJ-10.5-1, OBJ-9.2-1]
    level: mid
    prompt: >-
      חלקיק נע על מעגל היחידה, $\vec r(t)=(\cos t,\sin t)$, בשדה הטמפרטורה $T(x,y)=x^2-y^2$. חשבו את $\frac{dT}{dt}$ ב-$t=\frac{\pi}{6}$.
      (אפשר לכתוב שורש.)
    answer: -1.73205080757
    tolerance: 0.001
    correctFeedback: >-
      נכון, $-\sqrt3$. $\frac{dT}{dt}=\nabla T\cdot\vec r\,'(t)=(2x,-2y)\cdot(-\sin t,\cos t)=-4\sin t\cos t=-2\sin2t$, וב-$\frac\pi6$:
      $-2\cdot\frac{\sqrt3}{2}$. בדיקה: $T=\cos2t$.
    wrongFeedback: >-
      כלל השרשרת: הגרדיאנט במקום הנוכחי, כפול **וקטור המהירות** $\vec r\,'(t)$.
    commonWrong:
      - value: 1
        feedback: '$1=\nabla T\cdot\vec r(t)$: כפלתם בווקטור המקום. כלל השרשרת כופל בנגזרות $x''(t)$, $y''(t)$, כלומר במהירות.'
        misconception: MC-c10-chain-position-not-velocity
    hints: ['חזרו לשיעור 10.5 (כלל השרשרת לאורך עקום) ולשיעור 9.2 (וקטור המהירות).']

  - id: Q-10-review-06
    type: expr
    objectives: [OBJ-10.4-3, OBJ-10.3-2, OBJ-1.3-2]
    level: mid
    prompt: >-
      ראו את הפרבולואיד $z=x^2+y^2$ כמשטח הגובה $F=x^2+y^2-z=0$, ומצאו בעזרת $\nabla F$ את המישור המשיק לו בנקודה $(1,2,5)$.
      כתבו אותו בצורה $z=\ldots$.
    answer: '2*x + 4*y - 5'
    answerTex: '$2(x-1)+4(y-2)-(z-5)=0$, כלומר $z=2x+4y-5$'
    variables: [x, y]
    correctFeedback: >-
      נכון. $\nabla F=(2x,2y,-1)=(2,4,-1)$ הוא הנורמל, והמישור עובר דרך $(1,2,5)$. אותו מישור נותנת הנוסחה של שיעור 10.3,
      $z=5+2(x-1)+4(y-2)$.
    wrongFeedback: >-
      מישור עם נורמל $(a,b,c)$ דרך $(x_0,y_0,z_0)$: $a(x-x_0)+b(y-y_0)+c(z-z_0)=0$.
    commonWrong:
      - expr: '2*x + 4*y'
        feedback: 'המישור הזה לא עובר דרך $(1,2,5)$: ב-$(1,2)$ הוא נותן 10. שכחתם להציב את הנקודה כדי למצוא את הקבוע.'
        misconception: MC-c10-tangent-plane-base
    hints: ['חזרו לשיעור 10.4 (מישור משיק למשטח גובה) ולשיעור 1.3 (מישור לפי נקודה ונורמל).']

  - id: Q-10-review-07
    type: expr
    objectives: [OBJ-10.7-2, OBJ-6.3-2]
    level: mid
    prompt: >-
      כתבו את פולינום טיילור מסדר שני של $f(x,y)=\ln(1+x+2y)$ סביב $(0,0)$. (רמז: אפשר להציב $u=x+2y$ בפיתוח של
      $\ln(1+u)$.)
    answer: 'x + 2*y - (x + 2*y)^2/2'
    answerTex: '$T_2=x+2y-\frac{(x+2y)^2}{2}=x+2y-\frac{x^2}{2}-2xy-2y^2$'
    variables: [x, y]
    domain: [-0.3, 0.3]
    correctFeedback: >-
      נכון. $\ln(1+u)=u-\frac{u^2}{2}+\ldots$, ו-$u=x+2y$. אותה תוצאה מהנגזרות: $f_{xx}=-1$, $f_{xy}=-2$, $f_{yy}=-4$ בראשית.
    wrongFeedback: >-
      הציבו $u=x+2y$ ב-$u-\frac{u^2}{2}$ ופתחו את הריבוע במלואו.
    commonWrong:
      - expr: 'x + 2*y - (x^2 + 4*y^2)/2'
        feedback: 'בפתיחת $(x+2y)^2$ חסר האיבר המעורב $4xy$. האיבר המעורב בטיילור הוא $f_{xy}\,xy=-2xy$.'
        misconception: MC-c10-taylor-mixed-factor
    hints: ['חזרו לשיעור 10.7 (טיילור בשני משתנים) ולשיעור 6.3 (פיתוחים בהצבה).']

  - id: Q-10-review-08
    type: numeric
    objectives: [OBJ-10.6-1, OBJ-5.4-1]
    level: mid
    prompt: >-
      הנקודה $(1,1)$ על העקום $x^2+xy+y^2=3$. מהו השיפוע $\frac{dy}{dx}$ של העקום בנקודה?
    answer: -1
    tolerance: 0.001
    correctFeedback: >-
      נכון. $-\frac{F_x}{F_y}=-\frac{2x+y}{x+2y}=-\frac33$. אותה תוצאה מגזירה סתומה של שיעור 5.4: $2x+y+xy'+2yy'=0$.
    wrongFeedback: >-
      $F=x^2+xy+y^2-3$; $\frac{dy}{dx}=-\frac{F_x}{F_y}$ בנקודה.
    commonWrong:
      - value: 1
        feedback: 'חסר המינוס: מ-$F_x+F_y\,y''=0$ מקבלים $y''=-\frac{F_x}{F_y}$.'
        misconception: MC-c10-implicit-sign
    hints: ['חזרו לשיעור 10.6 (הנוסחה $-F_x/F_y$) ולשיעור 5.4 (גזירה סתומה).']

  - id: Q-10-review-09
    type: numeric
    objectives: [OBJ-10.7-1, OBJ-10.7-3]
    level: mid
    prompt: >-
      ל-$f(x,y)=x^2+xy+y^2-3x$ יש נקודה קריטית אחת, והיא מינימום מקומי. מה הערך של $f$ בה?
    answer: -3
    tolerance: 0.001
    correctFeedback: >-
      נכון. $2x+y=3$ ו-$x+2y=0$ נותנים $(2,-1)$, ו-$f=4-2+1-6=-3$. $D=2\cdot2-1=3>0$ ו-$f_{xx}=2>0$: מינימום.
    wrongFeedback: >-
      פתרו $f_x=2x+y-3=0$, $f_y=x+2y=0$, והציבו ב-$f$.
    hints: ['חזרו לשיעור 10.7 (נקודות קריטיות ומבחן הנגזרות השניות).']

  - id: Q-10-review-10
    type: twotier
    objectives: [OBJ-10.8-1, OBJ-10.7-1]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא נכון: המקסימום המוחלט של פונקציה דיפרנציאבילית בתחום סגור וחסום מתקבל תמיד בנקודה שבה $\nabla f=0$.
    choices:
      - text: 'לא נכון'
        correct: true
        feedback: 'נכון. $f=x$ בריבוע $[0,1]^2$ מקבלת מקסימום על הצלע $x=1$, ו-$\nabla f=(1,0)$ אינו מתאפס בשום מקום.'
      - text: 'נכון'
        feedback: '$\nabla f=0$ נדרש רק בקיצון **פנימי**. על השפה הפונקציה יכולה להמשיך לעלות החוצה מהתחום.'
        misconception: MC-c10-abs-only-critical
    reasons:
      - text: 'התנאי $\nabla f=0$ נכון רק בנקודה פנימית; על השפה אפשר לזוז רק לכיוונים מסוימים'
        correct: true
        feedback: 'בדיוק, ולכן האלגוריתם בודק גם את השפה.'
      - text: 'מקסימום מוחלט הוא מקסימום מקומי, ובמקסימום מקומי הגרדיאנט מתאפס'
        feedback: 'במקסימום מקומי **פנימי** הגרדיאנט מתאפס. בנקודת שפה אין סביבה מלאה בתחום, והטיעון נשבר.'
        misconception: MC-c10-abs-only-critical
      - text: 'בתחום סגור וחסום אין נקודות קריטיות'
        feedback: 'יש בהחלט: $x^2+y^2$ בעיגול היחידה, עם נקודה קריטית (המינימום) במרכז.'
        misconception: MC-c10-forget-interior
    hints: ['חזרו לשיעור 10.8 (האלגוריתם: פנים ושפה) ולשיעור 10.7 (נקודות קריטיות).']

  - id: Q-10-review-11
    type: twotier
    objectives: [OBJ-10.2-2, OBJ-10.3-3]
    qualitative: true
    level: mid
    prompt: >-
      ל-$f$ יש נגזרות חלקיות רציפות בכל המישור. נכון או לא נכון: $D_{\hat u}f=\nabla f\cdot\hat u$ לכל וקטור יחידה $\hat u$
      ובכל נקודה.
    choices:
      - text: 'נכון'
        correct: true
        feedback: 'נכון. נגזרות חלקיות רציפות מבטיחות דיפרנציאביליות, ולפונקציה דיפרנציאבילית הנוסחה נכונה.'
      - text: 'לא נכון'
        feedback: 'הנוסחה נכשלת רק כש-$f$ אינה דיפרנציאבילית, וכאן הנגזרות החלקיות הרציפות מבטיחות שהיא כן.'
        misconception: MC-c10-partials-imply-differentiable
    reasons:
      - text: 'נגזרות חלקיות רציפות גוררות דיפרנציאביליות, ואז הנגזרת הכיוונית היא הקירוב הלינארי בכיוון $\hat u$'
        correct: true
        feedback: 'בדיוק. לכן מותר להשתמש בנוסחה לכל פונקציה אלמנטרית בתחום ההגדרה שלה.'
      - text: 'הנוסחה נכונה לכל פונקציה שיש לה נגזרות חלקיות'
        feedback: >-
          ל-$\frac{xy}{x^2+y^2}$ (ו-0 בראשית) $\nabla f(0,0)=(0,0)$, אבל בכיוון $\frac{(1,1)}{\sqrt2}$ אין נגזרת כיוונית בכלל: $f$
          קופצת ל-$\frac12$ לאורך הישר.
        misconception: MC-c10-partials-imply-differentiable
      - text: 'הנוסחה היא הגדרת הנגזרת הכיוונית'
        feedback: 'ההגדרה היא גבול: $\lim_{t\to0}\frac{f(a+t\hat u)-f(a)}{t}$. הנוסחה היא משפט, ונכונה כש-$f$ דיפרנציאבילית.'
        misconception: MC-c10-partials-imply-differentiable
    hints: ['חזרו לשיעור 10.2 (שתי הדרכים לחשב נגזרת כיוונית) ולשיעור 10.3 (מתי $f$ דיפרנציאבילית).']

  - id: Q-10-review-12
    type: numeric
    objectives: [OBJ-10.8-1, OBJ-10.9-1]
    level: exam
    prompt: >-
      מצאו את המקסימום המוחלט של $f(x,y)=xy$ בעיגול הסגור $x^2+y^2\le8$.
    answer: 4
    tolerance: 0.001
    correctFeedback: >-
      נכון. בפנים: $\nabla f=(y,x)=0$ רק בראשית, נקודת אוכף עם $f=0$. על השפה, בלגרנז׳: $y=2\lambda x$, $x=2\lambda y$, ולכן
      $x^2=y^2=4$ והנקודות $(\pm2,\pm2)$. הערכים $4$ (ב-$(2,2)$, $(-2,-2)$) ו-$-4$. המקסימום 4.
    wrongFeedback: >-
      בדקו את הפנים (נקודות קריטיות) ואת השפה (פרמטריזציה או לגרנז׳), והשוו.
    commonWrong:
      - value: 0
        feedback: '$0$ הוא הערך בנקודה הקריטית היחידה, והיא אוכף. המקסימום בתחום סגור יכול להיות על השפה, וכאן הוא שם.'
        misconception: MC-c10-abs-only-critical
      - value: 8
        feedback: >-
          $8$ הוא $x^2+y^2$ על השפה. $xy\le\frac{x^2+y^2}{2}=4$, עם שוויון כש-$x=y$. בדקו ערך בנקודה שמצאתם.
        misconception: MC-c10-lagrange-check-constraint
    hints: ['חזרו לשיעור 10.8 (פנים ושפה) ולשיעור 10.9 (לגרנז׳ על השפה).']

  - id: Q-10-review-13
    type: twotier
    objectives: [OBJ-10.1-3, OBJ-2.3-1]
    qualitative: true
    level: exam
    prompt: >-
      נכון או לא נכון: $\lim_{(x,y)\to(0,0)}\frac{x^3+y^3}{x^2+y^2}=0$.
    choices:
      - text: 'נכון'
        correct: true
        feedback: >-
          נכון. בקוטביות $\frac{r^3(\cos^3\theta+\sin^3\theta)}{r^2}=r(\cos^3\theta+\sin^3\theta)$, והערך המוחלט קטן או שווה
          ל-$2r$, ששואף ל-0 בלי תלות ב-$\theta$.
      - text: 'לא נכון'
        feedback: 'המונה מסדר 3 והמכנה מסדר 2 במרחק $r$: המנה קטנה מ-$2r$ ושואפת ל-0.'
        misconception: MC-c10-zero-denominator
    reasons:
      - text: 'בקואורדינטות קוטביות הערך המוחלט חסום על ידי $2r$, חסם שתלוי רק במרחק'
        correct: true
        feedback: 'בדיוק. החסם אחיד בכל הכיוונים, ולכן הוא תופס כל מסלול.'
      - text: 'לאורך כל ישר $y=mx$ הגבול 0'
        feedback: 'זה נכון כאן, אבל אינו הוכחה: ל-$\frac{x^2y}{x^4+y^2}$ כל הישרים נותנים 0, ואין גבול.'
        misconception: MC-c10-lines-enough
      - text: 'בראשית המונה מתאפס'
        feedback: 'גם המכנה מתאפס שם. הגבול נקבע מהקצב שבו כל אחד מתאפס, לא מהערך בנקודה.'
        misconception: MC-c10-zero-denominator
