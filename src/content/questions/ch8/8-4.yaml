# Lesson 8.4 — numerical methods: the trapezoid rule and Simpson's rule.
# Objectives (src/course.ts):
#   OBJ-8.4-1  approximate an integral by the trapezoid rule and by Simpson's rule
#   OBJ-8.4-2  compare the errors of the methods when the number of subintervals doubles
#   OBJ-8.4-3  choose a method and a number of subintervals for a given accuracy
# Conventions: h=(b-a)/n; T_n = h/2 (f0 + 2f1 + … + 2f_{n-1} + fn); S_n (n even) = h/3 (f0 + 4f1 + 2f2 + … + 4f_{n-1} + fn);
# error bounds |E_T| ≤ (b-a)^3 M2 / (12 n^2), |E_S| ≤ (b-a)^5 M4 / (180 n^4). Numbers in screens/tools/recompute-ch8.py.
chapter: 8
questions:
  - id: Q-8.4-trap-basic
    type: numeric
    objectives: [OBJ-8.4-1]
    level: basic
    prompt: >-
      קרבו את $\int_0^2x^2\,dx$ בכלל הטרפז עם $n=4$ קטעים, $T_4=\frac h2\left(f_0+2f_1+2f_2+2f_3+f_4\right)$.
    answer: 2.75
    tolerance: 0.001
    correctFeedback: >-
      נכון. $h=\tfrac12$, הערכים $0,\tfrac14,1,\tfrac94,4$, ולכן $T_4=\tfrac14\left(0+\tfrac12+2+\tfrac92+4\right)=\tfrac{11}{4}$.
      הערך המדויק $\tfrac83\approx2.667$: הטרפז מעריך בעודף, כי $x^2$ קמורה.
    wrongFeedback: >-
      כתבו את חמשת ערכי $f$ בנקודות $0,\tfrac12,1,\tfrac32,2$. הקצוות במשקל 1, הנקודות הפנימיות במשקל 2, והכול כפול
      $\frac h2$.
    commonWrong:
      - value: 3.75
        feedback: >-
          זה $h(f_0+f_1+f_2+f_3+f_4)$: כל הערכים במשקל שווה. בטרפז הקצוות נספרים **חצי**, כי כל קצה שייך לטרפז אחד
          בלבד.
        misconception: MC-c8-trap-weights
      - value: 1.75
        feedback: >-
          זה סכום רימן השמאלי, $h(f_0+f_1+f_2+f_3)$. כלל הטרפז הוא הממוצע של הסכום השמאלי והימני: $\tfrac{1.75+3.75}{2}$.
        misconception: MC-c8-left-right-endpoints
    hints: ['$h=\frac{2-0}{4}$.']

  - id: Q-8.4-trap-formula
    type: mc
    objectives: [OBJ-8.4-1]
    qualitative: true
    level: basic
    prompt: >-
      $[a,b]$ מחולק ל-$n$ קטעים ברוחב $h$, ו-$f_i=f(a+ih)$. איזו נוסחה היא כלל הטרפז?
    choices:
      - text: '$\frac h2\left(f_0+2f_1+2f_2+\dots+2f_{n-1}+f_n\right)$'
        correct: true
        feedback: >-
          נכון. כל קטע תורם טרפז בשטח $\frac h2(f_{i-1}+f_i)$; בסכום, כל נקודה פנימית מופיעה פעמיים והקצוות פעם אחת.
      - text: '$h\left(f_0+f_1+\dots+f_n\right)$'
        feedback: >-
          כאן יש $n+1$ מלבנים ברוחב $h$ על קטע באורך $nh$: חצי מלבן מיותר בכל קצה. הקצוות צריכים משקל חצי.
        misconception: MC-c8-trap-weights
      - text: '$\frac h3\left(f_0+4f_1+2f_2+\dots+4f_{n-1}+f_n\right)$'
        feedback: 'זה כלל סימפסון, שמתאים פרבולות לזוגות של קטעים, ולא ישרים.'
        misconception: MC-c8-simpson-weights
      - text: '$\frac h2\left(2f_0+2f_1+\dots+2f_n\right)$'
        feedback: >-
          זו אותה נוסחה כמו $h\sum f_i$: הקצוות קיבלו משקל מלא. בטרפז הראשון הקצה $f_0$ מופיע פעם אחת בלבד.
        misconception: MC-c8-trap-weights

  - id: Q-8.4-simpson-basic
    type: numeric
    objectives: [OBJ-8.4-1]
    level: basic
    prompt: >-
      קרבו את $\int_0^\pi\sin x\,dx$ בכלל סימפסון עם $n=2$, $S_2=\frac h3\left(f_0+4f_1+f_2\right)$. (אפשר לכתוב ערך מדויק, כמו 3√2, 5π/4 או ln 3.)
    answer: 2.0943951023932
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{2\pi}{3}\approx2.094$. $h=\frac\pi2$ והערכים $0,1,0$: $\frac{\pi}{6}(0+4+0)$. הערך המדויק 2, שגיאה של
      כ-5% עם שלוש נקודות בלבד.
    wrongFeedback: >-
      $h=\frac{\pi-0}{2}$, והנקודות $0,\frac\pi2,\pi$. המשקלים $1,4,1$ והגורם $\frac h3$.
    commonWrong:
      - value: 1.0471975511966
        feedback: >-
          זה $\frac\pi6(0+2\cdot1+0)$: הנקודה האמצעית בסימפסון במשקל 4, לא 2.
        misconception: MC-c8-simpson-weights
      - value: 3.1415926535898
        feedback: >-
          זה $\frac h2(0+4+0)$: בסימפסון הגורם הוא $\frac h3$, לא $\frac h2$.
        misconception: MC-c8-simpson-weights
    hints: ['$\sin\frac\pi2=1$.']

  - id: Q-8.4-concave
    type: mc
    objectives: [OBJ-8.4-1]
    qualitative: true
    level: mid
    prompt: >-
      $f''(x)>0$ בכל $[a,b]$ (הגרף קמור, "מחייך"). מה אפשר לומר על כלל הטרפז $T_n$?
    choices:
      - text: '$T_n\ge\int_a^bf\,dx$ לכל $n$: הטרפז מעריך בעודף'
        correct: true
        feedback: >-
          נכון. בגרף קמור כל מיתר נמצא **מעל** הגרף, ולכן כל טרפז מכיל את השטח שמתחת לגרף בקטע שלו.
      - text: '$T_n\le\int_a^bf\,dx$: הטרפז תמיד מעריך בחסר'
        feedback: >-
          זה נכון כשהגרף קעור ($f''<0$). כאן המיתרים מעל הגרף.
        misconception: MC-c8-left-always-under
      - text: 'אי אפשר לדעת: זה תלוי אם $f$ עולה או יורדת'
        feedback: >-
          עלייה וירידה קובעות את הכיוון של **סכום רימן** השמאלי. בטרפז הקווים הם מיתרים, והכיוון נקבע לפי הקמירות.
        misconception: MC-c8-left-always-under
      - text: '$T_n=\int_a^bf\,dx$ כש-$n$ גדול מספיק'
        feedback: >-
          השגיאה קטנה כמו $\frac1{n^2}$ אבל אינה מתאפסת לשום $n$ סופי כש-$f''>0$: כל מיתר בולט מעל הגרף.
        misconception: MC-c8-sum-is-integral

  - id: Q-8.4-data-simpson
    type: numeric
    objectives: [OBJ-8.4-1]
    level: mid
    prompt: >-
      המהירות של רכב נמדדה כל שנייה: ב-$t=0,1,2,3,4$ שניות היא $0,2,3,3,2$ מטרים לשנייה. העריכו בכלל סימפסון את
      הדרך שעבר, במטרים, בין $t=0$ ל-$t=4$. (המהירות אינה שלילית.)
    answer: 9.3333333333333
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\tfrac{28}{3}$. $h=1$ ו-$n=4$ זוגי: $\tfrac13\left(0+4\cdot2+2\cdot3+4\cdot3+2\right)=\tfrac{28}{3}$.
    wrongFeedback: >-
      המשקלים בסימפסון הם $1,4,2,4,1$ (הנקודות האי-זוגיות במשקל 4), והגורם $\frac h3$.
    commonWrong:
      - value: 8
        feedback: >-
          זה $\tfrac13(0+2\cdot2+4\cdot3+2\cdot3+2)$: החלפתם בין המשקלים 4 ו-2. משקל 4 הולך לנקודות **האמצעיות** של כל
          זוג קטעים, $t=1$ ו-$t=3$.
        misconception: MC-c8-simpson-weights
      - value: 9
        feedback: >-
          9 הוא כלל הטרפז, $\tfrac12(0+4+6+6+2)$, הערכה סבירה, אבל השאלה מבקשת את סימפסון.
    hints: ['$S_4=\frac13\left(v_0+4v_1+2v_2+4v_3+v_4\right)$.']

  - id: Q-8.4-simpson-cubic
    type: twotier
    objectives: [OBJ-8.4-1, OBJ-8.4-2]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא נכון: כלל סימפסון עם $n=2$ נותן **בדיוק** את $\int_0^2x^3\,dx$.
    choices:
      - text: 'נכון'
        correct: true
        feedback: >-
          נכון. $S_2=\tfrac13(0+4\cdot1+8)=4=\left[\tfrac{x^4}{4}\right]_0^2$.
      - text: 'לא נכון'
        feedback: >-
          חשבו: $S_2=\tfrac13(0+4+8)=4$, והאינטגרל גם הוא 4. סימפסון מדויק לכל פולינום ממעלה 3 לכל היותר.
        misconception: MC-c8-simpson-only-quadratics
    reasons:
      - text: 'חסם השגיאה של סימפסון תלוי ב-$f^{(4)}$, וכאן $f^{(4)}(x)=0$ לכל $x$'
        correct: true
        feedback: >-
          בדיוק. השגיאה של סימפסון פרופורציונלית לנגזרת הרביעית, ולכן היא אפס לכל פולינום ממעלה $\le3$: "מתנה" של
          הסימטריה של הנוסחה.
      - text: 'סימפסון מדויק לכל פולינום, כי הוא מתאים פרבולות'
        feedback: >-
          ל-$x^4$ ב-$[0,2]$: $S_2=\tfrac{20}{3}$ ואילו $\int_0^2x^4dx=\tfrac{32}{5}$. סימפסון מדויק רק עד מעלה 3.
        misconception: MC-c8-simpson-only-quadratics
      - text: 'פרבולה אינה יכולה להתאים ל-$x^3$, ולכן יש שגיאה'
        feedback: >-
          הפרבולה אכן שונה מ-$x^3$, אבל השטחים שווים: מה שהפרבולה מוסיפה בחצי אחד היא מורידה בחצי השני.
        misconception: MC-c8-simpson-only-quadratics

  - id: Q-8.4-double-trap
    type: numeric
    objectives: [OBJ-8.4-2]
    level: mid
    prompt: >-
      בכלל הטרפז עם $n=10$ השגיאה בחישוב אינטגרל של פונקציה חלקה היא בערך $0.008$. מה צפויה להיות השגיאה עם $n=20$?
      (כתבו מספר עשרוני.)
    answer: 0.002
    tolerance: 0.001
    correctFeedback: >-
      נכון. השגיאה של הטרפז פרופורציונלית ל-$h^2$, כלומר ל-$\frac1{n^2}$: הכפלת $n$ מקטינה אותה פי 4.
    wrongFeedback: >-
      השגיאה של הטרפז מתנהגת כמו $\frac{C}{n^2}$. מה קורה ל-$\frac{C}{n^2}$ כש-$n$ גדל פי 2?
    commonWrong:
      - value: 0.004
        feedback: >-
          חילקתם ב-2, כאילו השגיאה פרופורציונלית ל-$\frac1n$. כך מתנהגים סכומי רימן השמאלי והימני; בטרפז זה $\frac1{n^2}$.
        misconception: MC-c8-error-halves
      - value: 0.0005
        feedback: >-
          חילקתם ב-16, היחס של סימפסון ($\frac1{n^4}$). בטרפז היחס 4.
        misconception: MC-c8-doubling-factor-mixup
    hints: ['$\frac{C}{(2n)^2}=\frac14\cdot\frac{C}{n^2}$.']

  - id: Q-8.4-double-simpson
    type: numeric
    objectives: [OBJ-8.4-2]
    level: mid
    prompt: >-
      בכלל סימפסון עם $n=4$ השגיאה היא בערך $3.2\cdot10^{-4}$. מה צפויה להיות השגיאה עם $n=8$? (כתבו מספר עשרוני.)
    answer: 0.00002
    tolerance: 0.001
    correctFeedback: >-
      נכון, $2\cdot10^{-5}$. בסימפסון השגיאה פרופורציונלית ל-$\frac1{n^4}$: הכפלת $n$ מקטינה אותה פי 16.
    wrongFeedback: >-
      השגיאה של סימפסון מתנהגת כמו $\frac{C}{n^4}$. בכמה מתחלקת כש-$n$ גדל פי 2?
    commonWrong:
      - value: 0.00008
        feedback: >-
          חילקתם ב-4, היחס של הטרפז. בסימפסון החזקה היא 4, ו-$2^4=16$.
        misconception: MC-c8-doubling-factor-mixup
      - value: 0.00016
        feedback: >-
          חילקתם ב-2, כאילו השגיאה פרופורציונלית ל-$\frac1n$. סימפסון מתכנס הרבה יותר מהר.
        misconception: MC-c8-error-halves
    hints: ['$2^4=16$.']

  - id: Q-8.4-which-method
    type: mc
    objectives: [OBJ-8.4-2]
    qualitative: true
    level: mid
    prompt: >-
      שיטה נומרית הופעלה על אינטגרל של פונקציה חלקה. השגיאות: עם $n=2$ בערך $1.2\cdot10^{-2}$, עם $n=4$ בערך
      $3.0\cdot10^{-3}$, ועם $n=8$ בערך $7.5\cdot10^{-4}$. איזו שיטה זו, ככל הנראה?
    choices:
      - text: 'כלל הטרפז'
        correct: true
        feedback: >-
          נכון. בכל הכפלה של $n$ השגיאה קטנה פי 4 ($1.2\cdot10^{-2}\to3.0\cdot10^{-3}\to7.5\cdot10^{-4}$), כמו $\frac{1}{n^2}$.
      - text: 'כלל סימפסון'
        feedback: 'בסימפסון השגיאה הייתה קטנה פי 16 בכל הכפלה, כמו $\frac1{n^4}$, לא פי 4.'
        misconception: MC-c8-doubling-factor-mixup
      - text: 'סכום רימן שמאלי'
        feedback: 'בסכום שמאלי השגיאה קטנה רק פי 2 בכל הכפלה, כמו $\frac1n$.'
        misconception: MC-c8-error-halves
      - text: 'אי אפשר לדעת מטבלת שגיאות'
        feedback: >-
          היחס בין שגיאות עוקבות חושף את החזקה של $n$: פי 2, פי 4 או פי 16. זו בדיוק הדרך לזהות שיטה, או לבדוק שקוד
          עובד.
        misconception: MC-c8-doubling-factor-mixup

  - id: Q-8.4-choose-method
    type: mc
    objectives: [OBJ-8.4-3]
    qualitative: true
    level: mid
    prompt: >-
      ניסוי מדד את ההספק של מנוע ב-7 זמנים במרווחים שווים (6 קטעים), וההספק משתנה בצורה חלקה. רוצים את האנרגיה,
      האינטגרל של ההספק, בדיוק הטוב ביותר מהנתונים האלה. מה מתאים?
    choices:
      - text: 'כלל סימפסון עם $n=6$'
        correct: true
        feedback: >-
          נכון. מספר הקטעים זוגי, ולכן סימפסון אפשרי, והשגיאה שלו (כמו $h^4$) קטנה בהרבה משל הטרפז (כמו $h^2$)
          לפונקציה חלקה.
      - text: 'אי אפשר להשתמש בסימפסון, כי מספר הנקודות, 7, אי-זוגי'
        feedback: >-
          הדרישה בסימפסון היא מספר **קטעים** זוגי, והוא 6. מספר הנקודות $n+1$ הוא תמיד אי-זוגי כשהדרישה מתקיימת.
        misconception: MC-c8-simpson-odd-n
      - text: 'כלל הטרפז, כי עם נתונים מדודים סימפסון אינו מוגדר'
        feedback: >-
          שתי השיטות צריכות רק את הערכים בנקודות החלוקה, ולא נוסחה. סימפסון עובד על טבלת נתונים בדיוק כמו הטרפז.
        misconception: MC-c8-simpson-only-quadratics
      - text: 'סכום רימן שמאלי, כי הוא הפשוט ביותר'
        feedback: 'הוא גם הכי פחות מדויק: השגיאה שלו כמו $h$ בלבד, והנקודה האחרונה לא נכנסת לחישוב.'
        misconception: MC-c8-error-halves

  - id: Q-8.4-choose-n-trap
    type: numeric
    objectives: [OBJ-8.4-3]
    level: exam
    prompt: >-
      רוצים לחשב את $\int_1^2\frac{dx}{x}=\ln 2$ בכלל הטרפז בשגיאה של לכל היותר $10^{-4}$. לפי החסם
      $|E_T|\le\frac{(b-a)^3M_2}{12n^2}$, כש-$M_2=\max_{[1,2]}|f''|$, מהו ה-$n$ הקטן ביותר שמבטיח זאת?
    answer: 41
    tolerance: 0.001
    correctFeedback: >-
      נכון. $f''=\frac{2}{x^3}$, והמקסימום ב-$[1,2]$ הוא ב-$x=1$: $M_2=2$. צריך $\frac{2}{12n^2}\le10^{-4}$, כלומר
      $n^2\ge\frac{10^4}{6}\approx1666.7$ ו-$n\ge40.8$. לכן $n=41$.
    wrongFeedback: >-
      חשבו את $f''$, מצאו את המקסימום של $|f''|$ בקטע, הציבו בחסם ופתרו את אי-השוויון עבור $n$. $n$ שלם.
    commonWrong:
      - value: 40
        feedback: >-
          עם $n=40$ החסם הוא $\frac{1}{6\cdot1600}\approx1.04\cdot10^{-4}$, מעט יותר מהנדרש. $n\ge40.8$ דורש לעגל
          **למעלה**.
        misconception: MC-c8-round-down-n
      - value: 15
        feedback: >-
          לקחתם $M_2=|f''(2)|=\tfrac14$, הערך בקצה הלא נכון. $\frac2{x^3}$ יורדת, ולכן המקסימום שלה ב-$x=1$.
        misconception: MC-c8-max-wrong-end
    hints: ['$f''''(x)=\frac{2}{x^3}$; היכן היא הכי גדולה ב-$[1,2]$?']

  - id: Q-8.4-choose-n-simpson
    type: numeric
    objectives: [OBJ-8.4-3]
    level: exam
    prompt: >-
      אותו אינטגרל, $\int_1^2\frac{dx}{x}$, בכלל סימפסון ובשגיאה של לכל היותר $10^{-4}$. לפי החסם
      $|E_S|\le\frac{(b-a)^5M_4}{180n^4}$, כש-$M_4=\max_{[1,2]}|f^{(4)}|$, מהו ה-$n$ הקטן ביותר שמבטיח זאת?
    answer: 8
    tolerance: 0.001
    correctFeedback: >-
      נכון. $f^{(4)}=\frac{24}{x^5}$ ו-$M_4=24$. צריך $\frac{24}{180n^4}\le10^{-4}$, כלומר $n^4\ge1333.3$ ו-$n\ge6.04$.
      $n=7$ אי-זוגי, ולכן $n=8$. השוו ל-41 קטעים בטרפז.
    wrongFeedback: >-
      $f^{(4)}(x)=\frac{24}{x^5}$. פתרו את אי-השוויון עבור $n$, וזכרו שבסימפסון $n$ זוגי.
    commonWrong:
      - value: 7
        feedback: >-
