  - id: Q-9.3-unit-speed
    type: mc
    objectives: [OBJ-9.3-2]
    qualitative: true
    level: mid
    prompt: >-
      מה מאפיין פרמטריזציה לפי אורך, $\vec\rho(s)$?
    choices:
      - text: '$|\vec\rho\,''(s)|=1$ לכל $s$: הפרמטר $s$ הוא בדיוק הדרך שנעברה'
        correct: true
        feedback: 'נכון. אז האורך מ-$s=a$ עד $s=b$ הוא $\int_a^b1\,ds=b-a$.'
      - text: '$\vec\rho\,''''(s)=\vec 0$: אין תאוצה'
        feedback: >-
          מהירות בגודל 1 עדיין יכולה להחליף כיוון: במעגל ברדיוס $R$ לפי אורך $|\vec\rho\,''|=\frac1R$. תאוצה אפס הייתה
          אומרת שהעקום ישר.
        misconception: MC-c9-unit-speed-means-straight
      - text: 'הפרמטר $s$ עובר על $[0,1]$'
        feedback: 'הפרמטר עובר על $[0,L]$, כש-$L$ אורך העקום. נרמול הוא של המהירות, לא של הקטע.'
        misconception: MC-c9-length-parameter-interval
      - text: '$|\vec\rho(s)|=1$: העקום על מעגל היחידה'
        feedback: 'זה תנאי על וקטור המקום. התנאי הוא על **הנגזרת**: גודל מהירות 1.'
        misconception: MC-c9-speed-is-position-length

  - id: Q-9.3-graph-length
    type: numeric
    objectives: [OBJ-9.3-3]
    level: mid
    prompt: >-
      חשבו את אורך הגרף של $y=\frac23x^{3/2}$, $0\le x\le3$. (אפשר לכתוב שבר.)
    answer: 4.6666666666667
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{14}{3}$. $y'=\sqrt x$, ו-$L=\int_0^3\sqrt{1+x}\,dx=\left[\tfrac23(1+x)^{3/2}\right]_0^3=\tfrac23(8-1)$.
    wrongFeedback: >-
      $L=\int_a^b\sqrt{1+f'(x)^2}\,dx$, הפרמטריזציה $(x,f(x))$ עם מהירות $(1,f'(x))$.
    commonWrong:
      - value: 6.4641016151
        feedback: '$\int_0^3(1+\sqrt x)\,dx=3+2\sqrt3$: חסר השורש. גודל המהירות $(1,f'')$ הוא $\sqrt{1+f''^2}$, לא $1+f''$.'
        misconception: MC-c9-graph-length-no-root
    hints: ['$\left(\sqrt x\right)^2=x$.']

  - id: Q-9.3-graph-formula
    type: mc
    objectives: [OBJ-9.3-3]
    qualitative: true
    level: basic
    prompt: >-
      מהי נוסחת האורך של הגרף של $y=f(x)$, $a\le x\le b$, ומאיפה היא באה?
    choices:
      - text: '$\int_a^b\sqrt{1+f''(x)^2}\,dx$: גודל המהירות של הפרמטריזציה $(x,f(x))$'
        correct: true
        feedback: 'נכון. $\vec r(x)=(x,f(x))$, $\vec r\,''=(1,f''(x))$, וזה מקרה פרטי של $\int|\vec r\,''|$.'
      - text: '$\int_a^b\sqrt{1+f(x)^2}\,dx$'
        feedback: 'בנוסחה מופיעה הנגזרת, לא הפונקציה: הוספה של קבוע ל-$f$ אינה משנה את האורך.'
        misconception: MC-c9-graph-length-f-not-fprime
      - text: '$\int_a^b\left(1+f''(x)^2\right)dx$'
        feedback: 'חסר השורש: אורך הווקטור $(1,f'')$ הוא $\sqrt{1+f''^2}$.'
        misconception: MC-c9-graph-length-no-root
      - text: '$\int_a^b|f''(x)|\,dx$'
        feedback: 'זה סופר רק את השינוי האנכי. לישר אופקי $f''=0$, והאורך שלו בכל זאת $b-a$.'
        misconception: MC-c9-length-projection

  - id: Q-9.3-polar-circle
    type: numeric
    objectives: [OBJ-9.3-3]
    level: basic
    prompt: >-
      חשבו את אורך העקום הקוטבי $r=2\sin\theta$, $0\le\theta\le\pi$, לפי $L=\int\sqrt{r^2+\left(\frac{dr}{d\theta}\right)^2}\,d\theta$.
      (אפשר לכתוב ערך מדויק, כמו 3√2, 5π/4 או ln 3.)
    answer: 6.2831853071796
    tolerance: 0.001
    correctFeedback: >-
      נכון, $2\pi$. $r^2+r'^2=4\sin^2\theta+4\cos^2\theta=4$, ולכן $L=\int_0^\pi2\,d\theta=2\pi$. זה מעגל ברדיוס 1 (מרכזו
      $(0,1)$), וההיקף שלו אכן $2\pi$.
    wrongFeedback: >-
      חשבו $\frac{dr}{d\theta}=2\cos\theta$, הציבו בנוסחה ופשטו.
    commonWrong:
      - value: 4
        feedback: '$\int_0^\pi2\sin\theta\,d\theta=4$: אינטגרל של $r$ לבדו. בנוסחה יש גם $r''$, תחת שורש.'
        misconception: MC-c9-polar-length-r-only
    hints: ['$\sin^2\theta+\cos^2\theta=1$.']

  - id: Q-9.3-cardioid
    type: numeric
    objectives: [OBJ-9.3-3]
    level: exam
    prompt: >-
      חשבו את אורך הקרדיואידה $r=1+\cos\theta$, $0\le\theta\le2\pi$. (רמז: $1+\cos\theta=2\cos^2\frac\theta2$.)
    answer: 8
    tolerance: 0.001
    correctFeedback: >-
      נכון. $r^2+r'^2=(1+\cos\theta)^2+\sin^2\theta=2+2\cos\theta=4\cos^2\frac\theta2$, ולכן
      $L=\int_0^{2\pi}2\left|\cos\tfrac\theta2\right|d\theta=2\int_0^\pi2\cos\tfrac\theta2\,d\theta=8$ (סימטריה).
    wrongFeedback: >-
      פשטו את $r^2+r'^2$ לפי הרמז, וזכרו ש-$\sqrt{u^2}=|u|$: $\cos\frac\theta2$ שלילי כש-$\theta>\pi$.
    commonWrong:
      - value: 6.2831853072
        feedback: '$\int_0^{2\pi}(1+\cos\theta)\,d\theta=2\pi$: אינטגרל של $r$ לבדו.'
        misconception: MC-c9-polar-length-r-only
      - value: 0
        feedback: >-
          $\int_0^{2\pi}2\cos\tfrac\theta2\,d\theta=0$: השמטתם את הערך המוחלט. $\sqrt{4\cos^2\frac\theta2}=2\left|\cos\frac\theta2\right|$,
          ואורך אינו מתאפס.
        misconception: MC-c9-speed-abs-dropped
    hints: ['$\sqrt{4\cos^2\frac\theta2}=2\left|\cos\frac\theta2\right|$.']

  - id: Q-9.3-astroid
    type: numeric
    objectives: [OBJ-9.3-1]
    level: exam
    prompt: >-
      חשבו את ההיקף של האסטרואידה $\vec r(t)=\left(\cos^3t,\ \sin^3t\right)$, $0\le t\le2\pi$.
    answer: 6
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\vec r\,'=3\sin t\cos t\,(-\cos t,\sin t)$, ולכן $|\vec r\,'|=3|\sin t\cos t|$. בגלל הסימטריה:
      $L=4\int_0^{\pi/2}3\sin t\cos t\,dt=4\cdot\tfrac32=6$.
    wrongFeedback: >-
      גודל המהירות הוא $3|\sin t\cos t|$, עם ערך מוחלט. חשבו את הרבע הראשון וכפלו ב-4.
    commonWrong:
      - value: 0
        feedback: >-
          $\int_0^{2\pi}3\sin t\cos t\,dt=0$: השמטתם את הערך המוחלט, והחלקים "השליליים" קיזזו את החיוביים. גודל מהירות
          אינו שלילי.
        misconception: MC-c9-speed-abs-dropped
    hints: ['$\sqrt{9\sin^2t\cos^2t}=3|\sin t\cos t|$.']
