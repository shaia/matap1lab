chapter: 9
questions:
  - id: Q-9.3-helix-length
    type: numeric
    objectives: [OBJ-9.3-1]
    level: basic
    prompt: >-
      חשבו את האורך של סיבוב אחד של הסליל $\vec r(t)=\left(3\cos t,\ 3\sin t,\ 4t\right)$, $0\le t\le2\pi$. (אפשר לכתוב ערך מדויק, כמו 3√2, 5π/4 או ln 3.)
    answer: 31.415926535898
    tolerance: 0.001
    correctFeedback: >-
      נכון, $10\pi$. $\vec v=(-3\sin t,3\cos t,4)$ ו-$|\vec v|=\sqrt{9+16}=5$ קבוע, ולכן $L=\int_0^{2\pi}5\,dt$.
    wrongFeedback: >-
      $L=\int_a^b|\vec r\,'(t)|\,dt$. חשבו את גודל המהירות (הוא יוצא קבוע).
    commonWrong:
      - value: 18.849555921539
        feedback: >-
          $6\pi$ הוא היקף המעגל ברדיוס 3, ההיטל של הסליל על מישור $xy$. הסליל גם עולה, ולכן הוא ארוך יותר.
        misconception: MC-c9-length-projection
      - value: 25.132741228718
        feedback: '$8\pi$ הוא רק העלייה האנכית, $4\cdot2\pi$. האורך משלב את שתי התנועות: $\sqrt{3^2+4^2}=5$ לכל יחידת $t$.'
        misconception: MC-c9-length-projection
    hints: ['$\sin^2t+\cos^2t=1$.']

  - id: Q-9.3-segment-length
    type: numeric
    objectives: [OBJ-9.3-1]
    level: basic
    prompt: >-
      $\vec r(t)=\left(1+2t,\ 3-t,\ 2t\right)$, $0\le t\le3$. חשבו את אורך העקום.
    answer: 9
    tolerance: 0.001
    correctFeedback: >-
      נכון. $|\vec v|=|(2,-1,2)|=3$, ולכן $L=3\cdot3=9$. בדיקה: זה קטע, ו-$|\vec r(3)-\vec r(0)|=|(6,-3,6)|=9$.
    wrongFeedback: >-
      גודל המהירות קבוע; כפלו אותו באורך קטע הזמן.
    commonWrong:
      - value: 3
        feedback: '3 הוא גודל המהירות. האורך הוא המהירות כפול משך התנועה, 3 יחידות זמן.'
        misconception: MC-c9-length-parameter-interval
      - value: 9.2195444573
        feedback: >-
          $\sqrt{85}=|\vec r(3)|=|(7,0,6)|$, המרחק של נקודת הסיום מהראשית. אורך העקום הוא המרחק **לאורך** העקום, מ-$\vec r(0)$
          ל-$\vec r(3)$.
        misconception: MC-c9-speed-is-position-length
    hints: ['$|(2,-1,2)|=\sqrt{4+1+4}$.']

  - id: Q-9.3-setup
    type: mc
    objectives: [OBJ-9.3-1]
    qualitative: true
    level: basic
    prompt: >-
      איזה אינטגרל נותן את האורך של חצי האליפסה $\vec r(t)=(\cos t,\ 2\sin t)$, $0\le t\le\pi$?
    choices:
      - text: '$\int_0^\pi\sqrt{\sin^2t+4\cos^2t}\,dt$'
        correct: true
        feedback: >-
          נכון. $\vec r\,'=(-\sin t,2\cos t)$. (את האינטגרל הזה אין לחשב בנוסחה סגורה: אורך של אליפסה מחשבים נומרית,
          למשל בסימפסון.)
      - text: '$\int_0^\pi\sqrt{\cos^2t+4\sin^2t}\,dt$'
        feedback: 'זה $\int|\vec r(t)|\,dt$: האורך של וקטור המקום, לא של המהירות.'
        misconception: MC-c9-speed-is-position-length
      - text: '$\int_0^\pi\left(-\sin t+2\cos t\right)dt$'
        feedback: 'זה סכום הרכיבים של המהירות (ואף יוצא שלילי). אורך הוא אינטגרל של $\sqrt{x''^2+y''^2}$.'
        misconception: MC-c9-speed-sum-components
      - text: '$\int_0^\pi\sqrt{1+4\cos^2t}\,dt$'
        feedback: 'זו נוסחת האורך של **גרף** עם $f''(t)=2\cos t$, אבל העקום אינו הגרף של $2\sin t$: $x=\cos t$, לא $t$.'
        misconception: MC-c9-graph-param-swap

  - id: Q-9.3-cusp-length
    type: numeric
    objectives: [OBJ-9.3-1]
    level: mid
    prompt: >-
      חשבו את אורך העקום $\vec r(t)=\left(t^2,t^3\right)$, $0\le t\le1$. (אפשר לכתוב ערך מדויק, כמו 3√2, 5π/4 או ln 3.)
    answer: 1.4397098733716
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\frac{13\sqrt{13}-8}{27}\approx1.4397$. $|\vec v|=t\sqrt{4+9t^2}$, ובהצבה $u=4+9t^2$:
      $\frac1{18}\int_4^{13}\sqrt u\,du=\frac1{27}\left(13^{3/2}-8\right)$. בדיקה: קצת יותר מהמיתר $\sqrt2\approx1.414$.
    wrongFeedback: >-
      $|\vec v|=\sqrt{4t^2+9t^4}=t\sqrt{4+9t^2}$ (כי $t\ge0$), ואז הצבה $u=4+9t^2$ עם גבולות חדשים.
    commonWrong:
      - value: 2
        feedback: '$\int_0^1(2t+3t^2)\,dt=2$: סכום רכיבי המהירות במקום האורך שלה.'
        misconception: MC-c9-speed-sum-components
      - value: 1.4142135624
        feedback: '$\sqrt2$ הוא אורך המיתר מ-$(0,0)$ ל-$(1,1)$. העקום מתעקל, ולכן הוא ארוך יותר.'
        misconception: MC-c9-length-chord
      - value: 25.914777720688
        feedback: >-
          $\frac23\left(13^{3/2}-8\right)\approx25.91$ הוא $\int_4^{13}\sqrt u\,du$ בלי הגורם $\frac1{18}$: מ-$u=4+9t^2$ יוצא
          $du=18t\,dt$, ולכן $t\,dt=\frac{du}{18}$. בדיקה מהירה: 25 ארוך בהרבה מכל דרך סבירה בין $(0,0)$ ל-$(1,1)$.
        misconception: MC-c7-subst-forget-factor
    hints: ['$\int t\sqrt{4+9t^2}\,dt$ בהצבה $u=4+9t^2$.']

  - id: Q-9.3-twice-around
    type: twotier
    objectives: [OBJ-9.3-2]
    qualitative: true
    level: mid
    prompt: >-
      $\vec r_1(t)=(\cos t,\sin t)$, $0\le t\le2\pi$, ו-$\vec r_2(t)=(\cos2t,\sin2t)$, $0\le t\le2\pi$. נכון או לא נכון:
      האינטגרלים $\int|\vec r_1\,'|\,dt$ ו-$\int|\vec r_2\,'|\,dt$ שווים, כי שתיהן מתארות את מעגל היחידה.
    choices:
      - text: 'לא נכון: הראשון $2\pi$ והשני $4\pi$'
        correct: true
        feedback: >-
          נכון. $|\vec r_2\,'|=2$ על קטע באורך $2\pi$: $\vec r_2$ מקיפה את המעגל **פעמיים**. אי-התלות בפרמטריזציה נכונה
          כשכל נקודה נעברת פעם אחת.
      - text: 'נכון: אורך אינו תלוי בפרמטריזציה'
        feedback: >-
          המשפט חל על פרמטריזציות שעוברות על העקום **פעם אחת**. האינטגרל מודד את הדרך שהנקודה עברה, ו-$\vec r_2$ עוברת
          כל נקודה פעמיים.
        misconception: MC-c9-length-of-trace
    reasons:
      - text: '$\vec r_2$ עוברת את המעגל פעמיים, והאינטגרל סופר את הדרך שעברה'
        correct: true
        feedback: 'בדיוק. על $[0,\pi]$ גם $\vec r_2$ הייתה נותנת $2\pi$.'
      - text: 'המהירות של $\vec r_2$ כפולה, ולכן האינטגרל של $\vec r_2$ יוצא כפול על כל קטע של $t$, גם קצר'
        feedback: >-
          מהירות כפולה לבדה אינה משנה את האורך: היא מקצרת את הזמן באותו יחס. כאן הזמן **לא** קוצר, ולכן נעבר סיבוב
          נוסף.
        misconception: MC-c9-length-parameter-interval
      - text: 'האורך תלוי בפרמטריזציה תמיד'
        feedback: 'לא: $(\cos2t,\sin2t)$ על $[0,\pi]$ נותנת בדיוק $2\pi$, כמו $\vec r_1$.'
        misconception: MC-c9-curve-is-formula

  - id: Q-9.3-same-length
    type: numeric
    objectives: [OBJ-9.3-2]
    level: mid
    prompt: >-
      $\vec r(t)=\left(\cos(t^2),\ \sin(t^2)\right)$, $0\le t\le\sqrt\pi$. חשבו את אורך העקום. (אפשר לכתוב ערך מדויק, כמו 3√2, 5π/4 או ln 3.)
    answer: 3.1415926535898
    tolerance: 0.001
    correctFeedback: >-
      נכון, $\pi$. $|\vec r\,'(t)|=2t$, ו-$\int_0^{\sqrt\pi}2t\,dt=\pi$. העקום הוא חצי מעגל היחידה (הזווית $t^2$ עוברת
      מ-0 עד $\pi$), ואורכו $\pi$ בכל פרמטריזציה.
    wrongFeedback: >-
      גזרו בכלל השרשרת: $(\cos t^2)'=-2t\sin t^2$. מה האורך של $\vec r\,'(t)$?
    commonWrong:
      - value: 1.7724538509
        feedback: '$\sqrt\pi$ הוא אורך קטע הפרמטר. האורך הוא אינטגרל של גודל המהירות, $2t$, לא של 1.'
        misconception: MC-c9-length-parameter-interval
    hints: ['$|\vec r\,''(t)|=2t\sqrt{\sin^2t^2+\cos^2t^2}$.']

