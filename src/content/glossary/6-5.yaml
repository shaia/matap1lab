# Terms first defined in lesson 6.5 (sketching graphs).
- id: oblique-asymptote
  term: אסימפטוטה משופעת
  en: oblique (slant) asymptote
  symbol: 'y=ax+b'
  definition: >-
    ישר $y=ax+b$ עם $a\ne0$ כך ש-$f(x)-(ax+b)\to0$ כש-$x\to\infty$ (או $-\infty$). לפונקציה רציונלית שמעלת המונה שלה גדולה
    באחד ממעלת המכנה, מוצאים אותה בחילוק פולינומים.
  reject: []
  lesson: '6.5'
- id: convex-function
  term: פונקציה קמורה
  en: convex (concave up) function
  definition: >-
    בקטע שבו $f''>0$ השיפוע עולה והגרף קמור, פתוח כלפי מעלה (כמו $x^2$); בקטע שבו $f''<0$ הגרף קעור, פתוח כלפי מטה (כמו
    $-x^2$).
  reject: []
  lesson: '6.5'
- id: inflection-point
  term: נקודת פיתול
  en: inflection point
  definition: >-
    נקודה על הגרף שבה הקמירות מתחלפת: משני צדיה $f''$ בסימנים שונים. אם $f''$ רציפה, בנקודה כזאת $f''=0$, אבל ההפך אינו
    נכון: ל-$x^4$ ב-0, $f''(0)=0$ ואין פיתול.
  reject: []
  lesson: '6.5'
