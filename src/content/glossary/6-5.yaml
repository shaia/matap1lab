# Terms first defined in lesson 6.5 (sketching graphs).
- id: oblique-asymptote
  term: אסימפטוטה משופעת
  en: oblique (slant) asymptote
  symbol: 'y=mx+b'
  definition: >-
    ישר $y=mx+b$ עם $m\ne0$ כך ש-$f(x)-(mx+b)\to0$ כש-$x\to\infty$ (או כש-$x\to-\infty$). מוצאים אותה בשני גבולות,
    $m=\lim\frac{f(x)}{x}$ ו-$b=\lim\left(f(x)-mx\right)$; לפונקציה רציונלית שמעלת המונה שלה גדולה באחד ממעלת המכנה, גם
    בחילוק פולינומים עם שארית.
  reject: []
  lesson: '6.5'
- id: convex-function
  term: פונקציה קמורה
  en: convex (concave up) function
  definition: >-
    $f$ קמורה בקטע אם השיפוע $f'$ עולה בו: הגרף פתוח כלפי מעלה (כמו $y=x^2$) ונמצא מעל המשיקים שלו. $f$ קעורה בקטע
    אם $f'$ יורדת בו: פתוחה כלפי מטה (כמו $y=-x^2$). מבחן: $f''>0$ בקטע גורר קמורה, $f''<0$ גורר קעורה.
  reject: []
  lesson: '6.5'
- id: inflection-point
  term: נקודת פיתול
  en: inflection point
  definition: >-
    נקודה על הגרף שבה הקמירות מתחלפת: משני צדיה $f''$ בסימנים שונים. אם $f''$ רציפה, בנקודה כזאת $f''=0$, אבל ההפך אינו
    נכון: ל-$x^4$ ב-0, $f''(0)=0$ ואין פיתול.
  reject: []
  lesson: '6.5'
