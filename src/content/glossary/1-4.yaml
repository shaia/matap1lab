# Terms first defined in lesson 1.4 (the cross product).
- id: cross-product
  term: מכפלה וקטורית
  en: cross product (vector product)
  symbol: '\vec u\times\vec v'
  definition: >-
    הווקטור $\vec u\times\vec v=(u_2v_3-u_3v_2,\ u_3v_1-u_1v_3,\ u_1v_2-u_2v_1)$. הוא מאונך ל-$\vec u$ ול-$\vec v$, אורכו
    $|\vec u||\vec v|\sin\theta$ (שטח המקבילית שהם פורשים), וכיוונו לפי כלל יד ימין. $\vec v\times\vec u=-\vec u\times\vec v$,
    ו-$\vec u\times\vec v=\vec0$ בדיוק כשהם מקבילים.
  lesson: '1.4'
- id: right-hand-rule
  term: כלל יד ימין
  en: right-hand rule
  definition: >-
    הדרך לקבוע את הכיוון של $\vec u\times\vec v$: מכופפים את אצבעות יד ימין מ-$\vec u$ אל $\vec v$ (בזווית הקטנה מ-$\pi$),
    והאגודל מצביע בכיוון המכפלה. כך $\hat\imath\times\hat\jmath=\hat k$, $\hat\jmath\times\hat k=\hat\imath$, $\hat k\times\hat\imath=\hat\jmath$.
  lesson: '1.4'
- id: torque
  term: מומנט כוח
  en: torque
  symbol: '\vec\tau=\vec r\times\vec F'
  definition: >-
    כוח $\vec F$ שפועל בנקודה שמיקומה $\vec r$ ביחס לנקודת הציר יוצר מומנט $\vec\tau=\vec r\times\vec F$ (בסדר הזה). גודלו
    $|\vec r||\vec F|\sin\theta$, וכיוונו ציר הסיבוב לפי כלל יד ימין. כוח לאורך $\vec r$ אינו יוצר מומנט.
  lesson: '1.4'
- id: right-handed-axes
  term: מערכת צירים ימנית
  en: right-handed coordinate system
  definition: >-
    מערכת צירים שבה $\hat\imath\times\hat\jmath=\hat k$ לפי כלל יד ימין: כשמכופפים את אצבעות יד ימין מציר $x$ החיובי אל
    ציר $y$ החיובי, האגודל מצביע לאורך ציר $z$ החיובי. על דף: $x$ ימינה, $y$ למעלה ו-$z$ החוצה מהדף, אל הקורא. זו המערכת
    של הקורס כולו.
  lesson: '1.4'
- id: anticommutative
  term: אנטי-חילופיות
  en: anticommutativity
  symbol: '\vec v\times\vec u=-\vec u\times\vec v'
  definition: >-
    התכונה של המכפלה הווקטורית שהחלפת סדר הגורמים הופכת את הסימן של התוצאה: אותו אורך, כיוון הפוך. (במכפלה חילופית,
    כמו המכפלה הסקלרית, החלפת הסדר אינה משנה דבר.)
  lesson: '1.4'
- id: moment-arm
  term: זרוע הכוח
  en: moment arm (lever arm)
  definition: >-
    המרחק מנקודת הציר אל קו הפעולה של הכוח (הישר שעובר בנקודת האחיזה בכיוון הכוח): $|\vec r|\sin\theta$. גודל המומנט הוא
    גודל הכוח כפול הזרוע, $|\vec\tau|=|\vec F|\cdot|\vec r|\sin\theta$.
  lesson: '1.4'
- id: line-of-action
  term: קו הפעולה
  en: line of action
  definition: >-
    הישר שעובר בנקודת האחיזה של כוח, בכיוון הכוח. המומנט של הכוח אינו משתנה כשמזיזים את נקודת האחיזה לאורך קו הפעולה,
    והמרחק מנקודת הציר אל קו הפעולה הוא זרוע הכוח.
  lesson: '1.4'
- id: minor
  term: מינור
  en: minor
  definition: >-
    הטבלה הקטנה שנשארת אחרי שמכסים שורה ועמודה בטבלה של מספרים. בסכמה של המכפלה הווקטורית כל מינור הוא טבלה של ארבעה
    מספרים, והמספר שמחשבים ממנו הוא המכפלה בהצלבה $ps-qr$.
  lesson: '1.4'
