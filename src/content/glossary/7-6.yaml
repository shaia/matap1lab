# Terms first defined in lesson 7.6 (tables of integrals and strategy).
- id: elementary-function
  term: פונקציה אלמנטרית
  en: elementary function
  definition: >-
    פונקציה שבנויה בנוסחה אחת סופית מהפונקציות של טבלת הנגזרות (חזקות ושורשים, $e^x$ ו-$\ln x$, הפונקציות
    הטריגונומטריות וההפוכות שלהן) בפעולות החשבון ובהרכבה. הנגזרת של פונקציה אלמנטרית היא תמיד אלמנטרית; הפונקציה
    הקדומה לא תמיד: ל-$e^{-x^2}$ ול-$\frac{\sin x}{x}$ יש פונקציה קדומה, אבל היא אינה אלמנטרית.
  reject: []
  lesson: '7.6'
- id: table-of-integrals
  term: טבלת אינטגרלים
  en: table of integrals
  definition: >-
    רשימה של אינטגרלים לא מסוימים בצורה כללית, עם פרמטרים ($a$, $k$), שמשתמשים בה אחרי שמביאים אינטגרל לאחת הצורות
    שבה: בלינאריות, בהשלמה לריבוע או בהצבה. כל שורה בה היא נגזרת שנקראת מהסוף להתחלה, ולכן בודקים אותה בגזירה.
  reject: []
  lesson: '7.6'
