# Terms first defined in lesson 1.2 (the dot product).
- id: dot-product
  term: מכפלה סקלרית
  en: dot product (scalar product)
  symbol: '\vec a\cdot\vec b'
  definition: >-
    המספר $\vec a\cdot\vec b=a_1b_1+a_2b_2+a_3b_3$, השווה גם ל-$|\vec a||\vec b|\cos\theta$ כש-$\theta$ הזווית בין הווקטורים.
    היא חילופית ומתפלגת, ו-$\vec a\cdot\vec a=|\vec a|^2$.
  lesson: '1.2'
- id: perpendicular-vectors
  term: וקטורים מאונכים
  en: perpendicular (orthogonal) vectors
  symbol: '\vec a\perp\vec b'
  definition: >-
    וקטורים שהזווית ביניהם ישרה. במונחי המכפלה הסקלרית: $\vec a\perp\vec b$ בדיוק כש-$\vec a\cdot\vec b=0$ (ווקטור האפס
    נחשב מאונך לכל וקטור). נקראים גם ניצבים.
  lesson: '1.2'
- id: projection
  term: היטל
  en: projection
  symbol: '\operatorname{proj}_{\vec b}\vec a=\frac{\vec a\cdot\vec b}{|\vec b|^2}\vec b'
  definition: >-
    ההיטל הסקלרי (הרכיב) של $\vec a$ בכיוון $\vec b$ הוא $\vec a\cdot\hat b=\frac{\vec a\cdot\vec b}{|\vec b|}$: אורך
    "הצל" של $\vec a$ על הישר של $\vec b$, עם סימן. וקטור ההיטל הוא $\frac{\vec a\cdot\vec b}{|\vec b|^2}\vec b$, והשארית
    $\vec a-\operatorname{proj}_{\vec b}\vec a$ מאונכת ל-$\vec b$.
  lesson: '1.2'
- id: orthonormal-basis
  term: בסיס אורתונורמלי
  en: orthonormal basis
  symbol: '\hat u_1,\hat u_2,\hat u_3'
  definition: >-
    שלושה וקטורי יחידה במרחב שכל שניים מהם מאונכים, כמו $\hat\imath,\hat\jmath,\hat k$. כל וקטור $\vec v$ נכתב בעזרתם
    בדרך אחת, $\vec v=\alpha_1\hat u_1+\alpha_2\hat u_2+\alpha_3\hat u_3$, והמקדמים הם ההיטלים: $\alpha_i=\vec v\cdot\hat u_i$.
  lesson: '1.2'
- id: work-constant-force
  term: עבודה של כוח קבוע
  en: work of a constant force
  symbol: 'W=\vec F\cdot\vec d'
  definition: >-
    כוח קבוע $\vec F$ שפועל לאורך העתק $\vec d$ עושה עבודה $W=\vec F\cdot\vec d=|\vec F||\vec d|\cos\theta$: רק הרכיב של
    הכוח בכיוון התנועה תורם. ביחידות SI: ג׳אול = ניוטון כפול מטר.
  lesson: '1.2'
