# Terms first defined in lesson 4.3 (exponential, logarithm, inverse function, e).
- id: inverse-function
  term: פונקציה הפוכה
  en: inverse function
  symbol: 'f^{-1}'
  definition: >-
    לפונקציה חד-חד-ערכית $f$: הפונקציה $f^{-1}$ שמבטלת אותה, $f^{-1}(f(x))=x$ ו-$f(f^{-1}(y))=y$. התחום של $f^{-1}$ הוא
    התמונה של $f$, והגרף שלה הוא שיקוף הגרף של $f$ ביחס לישר $y=x$. אין לבלבל עם $\frac1{f}$.
  lesson: '4.3'
- id: euler-number
  term: המספר e
  en: Euler's number e
  symbol: 'e\approx2.71828'
  definition: >-
    המספר שאליו $\left(1+\frac1n\right)^n$ מתקרב כש-$n$ גדל מאוד, $e\approx2.71828$. באופן שקול, המספר שבו השטח מתחת
    ל-$\frac1t$ מ-1 עד $e$ שווה 1 (שקילות שתוכח בפרק 8).
  lesson: '4.3'
- id: natural-log
  term: לוגריתם טבעי
  en: natural logarithm
  symbol: '\ln x'
  definition: >-
    הלוגריתם בבסיס $e$, מוגדר ל-$x>0$: $\ln x=y$ פירושו $e^y=x$. הפונקציות $e^x$ ו-$\ln x$ הפוכות זו לזו. בסיכומי
    ההרצאות הוא מוגדר כשטח מתחת ל-$\frac1t$ בין 1 ל-$x$ (שקילות שתוכח בפרק 8).
  lesson: '4.3'
- id: exponential-function
  term: פונקציה מעריכית
  en: exponential function
  symbol: 'a^x=e^{x\ln a}'
  definition: >-
    $a^x$ עם בסיס קבוע $a>0$, $a\ne1$: מוגדרת לכל $x$, חיובית, עולה כש-$a>1$ ויורדת כש-$0<a<1$. כל אקספוננט הוא
    $e^{x\ln a}$.
  lesson: '4.3'
- id: compound-interest
  term: ריבית דריבית
  en: compound interest
  symbol: '\left(1+\frac{r}{n}\right)^{n}'
  definition: >-
    ריבית שמחושבת על הסכום שכבר כולל את הריביות הקודמות. ריבית שנתית $r$ שמחושבת $n$ פעמים בשנה, בחלקים שווים של
    $\frac{r}{n}$, כופלת את הסכום בשנה אחת פי $\left(1+\frac{r}{n}\right)^n$. כש-$n$ גדל בלי גבול הגורם מתקרב ל-$e^r$; ב-$r=1$
    זו ההגדרה של $e$.
  lesson: '4.3'
- id: exponential-decay
  term: דעיכה מעריכית
  en: exponential decay
  symbol: 'N(t)=N_0e^{-\lambda t}'
  definition: >-
    כמות שבכל פרק זמן באורך קבוע נכפלת באותו גורם קטן מ-1: $N(t)=N_0e^{-\lambda t}$ עם $\lambda>0$, או $N_0a^t$ עם $0<a<1$.
    בכל פרק זמן שווה נשאר אותו **חלק יחסי**, לא אותה כמות. דוגמאות: התפרקות רדיואקטיבית, הלחץ באטמוספרה כפונקציה של
    הגובה.
  lesson: '4.3'
- id: half-life
  term: זמן מחצית חיים
  en: half-life
  symbol: 'T_{1/2}=\frac{\ln2}{\lambda}'
  definition: >-
    בדעיכה מעריכית: פרק הזמן שבו הכמות נחצית, $N(t)=N_0\left(\frac12\right)^{t/T_{1/2}}$. הוא אינו תלוי בכמות ההתחלתית:
    אחרי שני זמני מחצית חיים נשאר רבע, אחרי שלושה שמינית. אם $N=N_0e^{-\lambda t}$, אז $T_{1/2}=\frac{\ln2}{\lambda}$.
  lesson: '4.3'
- id: log-scale
  term: סולם לוגריתמי
  en: logarithmic scale
  definition: >-
    ציר או סולם שבו מרחקים שווים מייצגים **כפל** באותו גורם ולא חיבור של אותו מספר: מסמנים על הציר את $\log_{10}y$ במקום
    את $y$. אקספוננט נראה בו כקו ישר. דציבלים ($10\log_{10}\frac{I}{I_0}$) ו-pH (מינוס $\log_{10}$ של ריכוז יוני המימן) הם
    סולמות לוגריתמיים.
  lesson: '4.3'
- id: faster-growth
  term: גדלה מהר יותר
  en: grows faster (as x goes to infinity)
  symbol: '\frac{f(x)}{g(x)}'
  definition: >-
    אומרים ש-$g$ גדלה מהר יותר מ-$f$ אם המנה $\frac{f(x)}{g(x)}$ נעשית קטנה כרצוננו כש-$x$ גדל (בשיעור 4.6: גבולה 0). זו טענה על $x$ גדולים מאוד בלבד: היא
    אינה אומרת ש-$g(x)>f(x)$ כבר עכשיו, רק שמנקודה מסוימת $g$ מובילה, והיחס $\frac{g(x)}{f(x)}$ גדל בלי גבול. הסולם: לוגריתם, אחריו
    חזקות (לפי המעריך), אחריהן אקספוננטים (לפי הבסיס).
  lesson: '4.3'
