# Terms first defined in lesson 6.3 (the expansions of the elementary functions).
- id: taylor-series
  term: טור טיילור
  en: Taylor series
  symbol: '\sum_{k=0}^{\infty}\frac{f^{(k)}(x_0)}{k!}(x-x_0)^k'
  definition: >-
    הטור האינסופי $\sum_{k\ge0}\frac{f^{(k)}(x_0)}{k!}(x-x_0)^k$, שפולינומי טיילור הם הסכומים החלקיים שלו. לפונקציות
    האלמנטריות הוא מתכנס לפונקציה בתחום ההתכנסות שלו, למשל $e^x=\sum\frac{x^k}{k!}$ לכל $x$.
  reject: [טור טיילר]
  lesson: '6.3'
- id: binomial-series
  term: הטור הבינומי
  en: binomial series
  symbol: '(1+x)^\alpha=1+\alpha x+\frac{\alpha(\alpha-1)}{2!}x^2+\dots'
  definition: >-
    טור טיילור של $(1+x)^\alpha$ סביב 0, לכל מעריך ממשי $\alpha$:
    $1+\alpha x+\frac{\alpha(\alpha-1)}{2!}x^2+\frac{\alpha(\alpha-1)(\alpha-2)}{3!}x^3+\dots$; מתכנס כש-$|x|<1$. כש-$\alpha$
    טבעי הוא נעצר ונותן את הבינום של ניוטון.
  reject: []
  lesson: '6.3'
- id: leading-term
  term: האיבר המוביל
  en: leading term
  definition: >-
    האיבר הראשון שאינו אפס בפיתוח של פונקציה סביב נקודה, $a_k(x-x_0)^k$. ליד $x_0$ הפונקציה מתנהגת כמוהו (היחס ביניהם
    שואף ל-1), ולכן הוא קובע גבולות של מנות ואת צורת הגרף ליד הנקודה.
  reject: []
  lesson: '6.3'
- id: power-series
  term: טור חזקות
  en: power series
  symbol: '\sum_{k=0}^{\infty}a_kx^k'
  definition: >-
    סכום אינסופי של חזקות של המשתנה עם מקדמים, $a_0+a_1x+a_2x^2+\dots$ (או בחזקות של $x-x_0$). טור טיילור הוא טור חזקות
    שהמקדמים שלו $a_k=\frac{f^{(k)}(0)}{k!}$. לפונקציה יש לכל היותר טור חזקות אחד ששווה לה ליד הנקודה, ולכן כל דרך
    שמגיעה לטור כזה נותנת את טור טיילור.
  reject: []
  lesson: '6.3'
- id: geometric-series
  term: הטור ההנדסי
  en: geometric series
  symbol: '\frac{1}{1-x}=1+x+x^2+\dots'
  definition: >-
    הטור $1+x+x^2+x^3+\dots=\sum_{k\ge0}x^k$, שסכומו $\frac{1}{1-x}$ כש-$|x|<1$ (הטור ההנדסי האינסופי של התיכון, עם
    האיבר הראשון 1 והמנה $x$). כש-$|x|\ge1$ הוא אינו מתכנס.
  reject: []
  lesson: '6.3'
