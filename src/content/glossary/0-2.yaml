# Terms first used in lesson 0.2 (trigonometry).
- id: radian
  term: רדיאן
  en: radian
  definition: >-
    יחידת מידה לזווית: זווית של $\theta$ רדיאנים היא הזווית שקשת באורך $\theta$ על מעגל היחידה נשענת עליה. סיבוב שלם הוא
    $2\pi$ ולכן $180^\circ=\pi$, ורדיאן אחד הוא בערך $57.3^\circ$. בקורס זווית בלי סימן מעלות היא ברדיאנים.
  lesson: '0.2'
- id: unit-circle
  term: מעגל היחידה
  en: unit circle
  symbol: 'x^2+y^2=1'
  definition: >-
    המעגל שמרכזו בראשית ורדיוסו 1. הנקודה עליו בזווית $\theta$ (נמדדת מהכיוון החיובי של ציר ה-$x$, נגד כיוון השעון) היא
    $(\cos\theta,\sin\theta)$: זו ההגדרה של קוסינוס וסינוס לכל זווית, וממנה נקבעים הסימנים בכל רביע.
  lesson: '0.2'
