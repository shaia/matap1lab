# Terms first used in lesson 0.1 (how to study; the algebra we need).
- id: interval
  term: קטע
  en: interval
  symbol: '(a,b),\ [a,b],\ (a,\infty)'
  definition: >-
    כל המספרים בין שני קצוות. סוגר עגול: הקצה אינו בקטע; סוגר מרובע: הקצה בקטע. $(1,5)$ הם המספרים $1<x<5$, $[-3,2]$ הם
    $-3\le x\le2$, ו-$(2,\infty)$ הם כל $x>2$ (באינסוף תמיד סוגר עגול). פתרון של אי-שוויון נכתב כקטע או כאיחוד קטעים,
    למשל $(-\infty,-1]\cup(2,\infty)$.
  lesson: '0.1'
- id: sign-table
  term: טבלת סימנים
  en: sign chart
  definition: >-
    שיטה לפתרון אי-שוויון של מכפלה או של שבר: מסמנים על הישר את הנקודות שבהן כל גורם מתאפס, וקובעים את הסימן של כל גורם
    בכל אחד מהקטעים שביניהן. הסימן של המכפלה או של השבר הוא מכפלת הסימנים. נקודה שבה המכנה מתאפס לעולם אינה בפתרון.
  lesson: '0.1'
