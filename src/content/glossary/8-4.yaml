# Terms first defined in lesson 8.4 (numerical methods).
- id: trapezoid-rule
  term: כלל הטרפז
  en: trapezoid rule
  symbol: 'T_n=\frac h2\left(f_0+2f_1+\dots+2f_{n-1}+f_n\right)'
  definition: >-
    קירוב של $\int_a^bf\,dx$ בחלוקה ל-$n$ קטעים ברוחב $h=\frac{b-a}{n}$: בכל קטע מחליפים את הגרף במיתר, ומחברים את
    שטחי הטרפזים. השגיאה לכל היותר $\frac{(b-a)^3M_2}{12n^2}$ כש-$M_2=\max|f''|$: היא קטנה פי 4 כשמכפילים את $n$.
  reject: []
  lesson: '8.4'
- id: simpson-rule
  term: כלל סימפסון
  en: Simpson's rule
  symbol: 'S_n=\frac h3\left(f_0+4f_1+2f_2+\dots+4f_{n-1}+f_n\right)'
  definition: >-
    קירוב של $\int_a^bf\,dx$ בחלוקה למספר **זוגי** $n$ של קטעים: על כל זוג קטעים מחליפים את הגרף בפרבולה דרך שלוש
    הנקודות. השגיאה לכל היותר $\frac{(b-a)^5M_4}{180n^4}$ כש-$M_4=\max|f^{(4)}|$: היא קטנה פי 16 כשמכפילים את $n$,
    והכלל מדויק לכל פולינום ממעלה $\le3$.
  reject: [סימפסן]
  lesson: '8.4'
- id: quadrature-error
  term: שגיאת הקירוב
  en: error of a numerical rule
  symbol: 'E_T=T_n-\int_a^bf\,dx,\quad E_S=S_n-\int_a^bf\,dx'
  definition: >-
    ההפרש בין הקירוב הנומרי לערך המדויק של האינטגרל: חיובית כשהקירוב גדול מהערך המדויק (הערכה בעודף), ושלילית
    כשהוא קטן ממנו (הערכה בחסר). חסם השגיאה הוא מספר $B$ שמובטח ש-$|E|\le B$, בלי לדעת את הערך המדויק.
  reject: []
  lesson: '8.4'
- id: smooth-function
  term: פונקציה חלקה
  en: smooth function
  definition: >-
    פונקציה שיש לה נגזרות רציפות עד הסדר שהטענה צריכה. בשיעור 8.4: עד הנגזרת השנייה בחסם של הטרפז, ועד הרביעית בחסם
    של סימפסון. לפונקציה עם פינה, כמו $|x|$, אין אפילו נגזרת ראשונה בפינה, והיא אינה חלקה.
  reject: []
  lesson: '8.4'
