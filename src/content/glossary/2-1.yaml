# Terms first defined in lesson 2.1 (circle and ellipse).
- id: parametrisation
  term: פרמטריזציה
  en: parametrisation
  symbol: '(x(t),y(t)),\ t\in I'
  definition: >-
    תיאור של עקום על ידי שתי פונקציות של פרמטר אחד, $x=x(t)$ ו-$y=y(t)$, כש-$t$ עובר על קטע: לכל $t$ נקודה על העקום.
    לעקום אחד יש הרבה פרמטריזציות, שנבדלות בנקודת ההתחלה, בכיוון ובמהירות. מעגל היחידה: $(\cos t,\sin t)$,
    $0\le t<2\pi$.
  reject: [פרמטריזאציה, פרמטריזצייה]
  lesson: '2.1'
- id: ellipse
  term: אליפסה
  en: ellipse
  symbol: '\frac{x^2}{a^2}+\frac{y^2}{b^2}=1'
  definition: >-
    העקום $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$ ($a,b>0$), וכל הזזה שלו: מעגל שנמתח בכיוון הצירים. הוא חותך את ציר $x$
    ב-$\pm a$ ואת ציר $y$ ב-$\pm b$. פרמטריזציה: $(a\cos t,b\sin t)$, $0\le t<2\pi$.
  reject: [אלפסה, אליפסא]
  lesson: '2.1'
- id: semi-axis
  term: חצי ציר
  en: semi-axis
  definition: >-
    באליפסה $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$: המספרים $a$ ו-$b$, המרחקים מהמרכז לנקודות שבהן האליפסה חותכת את
    צירי הסימטריה שלה. הגדול מביניהם הוא חצי הציר הגדול. בהיפרבולה $\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$ באותו שם
    נקראים $a$ ו-$b$.
  lesson: '2.1'
- id: cartesian-equation
  term: משוואה קרטזית
  en: Cartesian equation
  symbol: 'F(x,y)=0'
  definition: >-
    משוואה אחת שקושרת את $x$ ואת $y$, בלי פרמטר: העקום הוא קבוצת כל הנקודות $(x,y)$ שמקיימות אותה. למשל
    $x^2+y^2=1$ למעגל היחידה. המשוואה אומרת אילו נקודות על העקום, ואינה אומרת באיזה סדר עוברים עליהן.
  lesson: '2.1'
- id: curve-shift
  term: הזזה של עקום
  en: translation of a curve
  symbol: 'x\to x-h,\ y\to y-k'
  definition: >-
    מעבירים כל נקודה $(u,v)$ של העקום לנקודה $(x,y)=(u+h,v+k)$. המשוואה של העקום המוזז מתקבלת כשמציבים $x-h$ במקום $x$
    ו-$y-k$ במקום $y$. מעגל היחידה שהוזז ב-$(h,k)$ הוא $(x-h)^2+(y-k)^2=1$.
  lesson: '2.1'
- id: curve-stretch
  term: מתיחה של עקום
  en: stretch of a curve
  symbol: 'x\to \frac{x}{a},\ y\to \frac{y}{b}'
  definition: >-
    מעבירים כל נקודה $(u,v)$ של העקום לנקודה $(x,y)=(au,bv)$, עם $a,b>0$: מתיחה פי $a$ בכיוון ציר $x$ ופי $b$ בכיוון ציר
    $y$ (כיווץ, כשהמספר קטן מ-1). המשוואה של העקום המתוח מתקבלת כשמציבים $\frac{x}{a}$ במקום $x$ ו-$\frac{y}{b}$
    במקום $y$.
  lesson: '2.1'
- id: parametrised-path
  term: מסילה
  en: path (parametrised curve)
  symbol: '(x(t),y(t))'
  definition: >-
    עקום יחד עם פרמטריזציה שלו: לא רק קבוצת הנקודות, אלא גם נקודת ההתחלה, הכיוון והקצב שבהם עוברים עליהן.
    $(\cos t,\sin t)$ ו-$(\sin t,\cos t)$, $0\le t<2\pi$, הן שתי מסילות שונות על אותו עקום, מעגל היחידה.
  lesson: '2.1'
