# Terms first defined in lesson 2.4 (cylindrical and spherical coordinates).
- id: cylindrical-coordinates
  term: קואורדינטות גליליות
  en: cylindrical coordinates
  symbol: '(r,\theta,z)'
  definition: >-
    קואורדינטות קוטביות במישור $xy$ ועוד הגובה: $x=r\cos\theta$, $y=r\sin\theta$, $z=z$. כאן $r=\sqrt{x^2+y^2}$ הוא
    המרחק **מציר $z$**. המשטח $r=c$ הוא גליל.
  lesson: '2.4'
- id: spherical-coordinates
  term: קואורדינטות כדוריות
  en: spherical coordinates
  symbol: '(r,\theta,\varphi)'
  definition: >-
    $r=\sqrt{x^2+y^2+z^2}$ המרחק מהראשית, $\theta\in[0,\pi]$ הזווית מציר $z$ החיובי, ו-$\varphi$ האזימוט במישור $xy$:
    $x=r\sin\theta\cos\varphi$, $y=r\sin\theta\sin\varphi$, $z=r\cos\theta$ (המוסכמה של הפיזיקה; בספרי חשבון רבים
    האותיות של שתי הזוויות מוחלפות, ובסיכומי ההרצאות הזווית השנייה נמדדת ממישור $xy$).
  lesson: '2.4'
- id: azimuth
  term: אזימוט
  en: azimuth (azimuthal angle)
  symbol: '\varphi'
  definition: >-
    הזווית של ההיטל של נקודה על מישור $xy$, נמדדת מציר $x$ החיובי נגד כיוון השעון. בקואורדינטות כדוריות היא $\varphi$,
    ובגליליות היא $\theta$. המשטח שבו האזימוט קבוע הוא חצי מישור שמכיל את ציר $z$.
  lesson: '2.4'
- id: sphere
  term: ספירה
  en: sphere
  symbol: 'x^2+y^2+z^2=R^2'
  definition: >-
    קבוצת כל הנקודות במרחב שמרחקן מנקודה אחת, המרכז, שווה לרדיוס $R$: רק **פני** הכדור, בלי הפנים שלו. הספירה שמרכזה
    בראשית היא $x^2+y^2+z^2=R^2$. ה**כדור** הוא הגוף המלא, $x^2+y^2+z^2\le R^2$.
  lesson: '2.4'
- id: coordinate-surface
  term: משטח קואורדינטה
  en: coordinate surface
  definition: >-
    המשטח שמתקבל כשמקבעים קואורדינטה אחת ונותנים לשתי האחרות לעבור על כל הערכים שלהן. בקרטזיות אלה מישורים; בגליליות
    $r=c$ הוא גליל, $\theta=c$ חצי מישור ו-$z=c$ מישור; בכדוריות $r=c$ הוא ספירה, $\theta=c$ חרוט שהקודקוד שלו בראשית (צד אחד בלבד של החרוט הכפול) ו-$\varphi=c$ חצי
    מישור.
  lesson: '2.4'
- id: latitude
  term: זווית רוחב
  en: latitude
  definition: >-
    הזווית שבין הקרן מהראשית אל הנקודה לבין מישור $xy$, חיובית מעליו ושלילית מתחתיו, בין $-\frac{\pi}{2}$
    ל-$\frac{\pi}{2}$: קו הרוחב של הגיאוגרפיה. בקורס היא מסומנת $\beta$, והיא שווה $\frac{\pi}{2}-\theta$, כאשר $\theta$
    הזווית מציר $z$ החיובי. סיכומי ההרצאות מודדים בה במקום ב-$\theta$.
  lesson: '2.4'
- id: spherical-shell
  term: קליפה כדורית
  en: spherical shell
  symbol: 'R_1\le r\le R_2'
  definition: >-
    הגוף שבין שתי ספירות בעלות אותו מרכז: בקואורדינטות כדוריות $R_1\le r\le R_2$, בלי שום הגבלה על הזוויות.
  lesson: '2.4'
