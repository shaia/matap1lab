# Terms first defined in lesson 2.2 (parabola and hyperbolas).
- id: parabola
  term: פרבולה
  en: parabola
  symbol: 'y=a(x-h)^2+k'
  definition: >-
    העקום $y=x^2$, וכל הזזה, מתיחה או שיקוף שלו: $y=a(x-h)^2+k$ (נפתחת כלפי מעלה או כלפי מטה) או $x=a(y-k)^2+h$
    (נפתחת ימינה או שמאלה), עם $a\ne0$. במשוואה יש ריבוע של משתנה אחד בלבד. פרמטריזציה של $y=x^2$: $(t,t^2)$,
    $t\in\mathbb{R}$.
  reject: [פרבולא, פראבולה]
  lesson: '2.2'
- id: conic-vertex
  term: קודקוד
  en: vertex
  definition: >-
    בפרבולה: הנקודה של הפרבולה שנמצאת על ציר הסימטריה שלה, $(h,k)$ ב-$y=a(x-h)^2+k$. בהיפרבולה: שתי הנקודות
    הקרובות ביותר למרכז, אחת בכל ענף: $(\pm a,0)$ ב-$\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$, ו-$(1,1)$, $(-1,-1)$
    ב-$xy=1$.
  lesson: '2.2'
- id: hyperbola-branch
  term: ענף
  en: branch
  definition: >-
    כל אחד משני החלקים הנפרדים של היפרבולה. ב-$\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$ הענף הימני הוא החלק שבו $x\ge a$
    והענף השמאלי הוא החלק שבו $x\le-a$; ב-$xy=1$ ענף אחד ברביע הראשון ואחד ברביע השלישי.
  lesson: '2.2'
- id: conic-section
  term: חתך חרוט
  en: conic section
  definition: >-
    עקום שמתקבל מחיתוך של חרוט כפול עם מישור: אליפסה (ובפרט מעגל), פרבולה או היפרבולה, ובמקרים מנוונים נקודה, ישר
    או זוג ישרים נחתכים. כל אחד מהם מתואר על ידי משוואה ממעלה שנייה ב-$x$ ו-$y$. משוואה כזו יכולה לתאר גם זוג
    ישרים מקבילים או קבוצה ריקה, שאינם חתכים של החרוט.
  reject: []
  lesson: '2.2'
- id: hyperbola
  term: היפרבולה
  en: hyperbola
  symbol: '\frac{x^2}{a^2}-\frac{y^2}{b^2}=1'
  definition: >-
    העקום $\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$, וכל הזזה או סיבוב שלו, למשל $xy=1$. יש לו שני ענפים ושתי אסימפטוטות,
    $y=\pm\frac{b}{a}x$. סימן מינוס בין הריבועים מבדיל אותו מאליפסה.
  reject: [היפרבלה]
  lesson: '2.2'
- id: asymptote
  term: אסימפטוטה
  en: asymptote
  definition: >-
    ישר שהעקום מתקרב אליו ככל שמתרחקים לאינסוף לאורך העקום. להיפרבולה $\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$ האסימפטוטות
    $y=\pm\frac{b}{a}x$, ול-$xy=1$ הן שני הצירים.
  reject: [אסימטוטה]
  lesson: '2.2'
- id: degenerate-conic
  term: חתך חרוט מנוון
  en: degenerate conic
  definition: >-
    חתך של החרוט הכפול במישור שעובר דרך החוד שלו: נקודה ($x^2+y^2=0$), זוג ישרים נחתכים ($x^2-y^2=0$) או ישר אחד
    ($x^2=0$). משוואה ממעלה שנייה יכולה לתאר גם זוג ישרים מקבילים ($x^2-4=0$) או קבוצה ריקה ($x^2+y^2=-1$); אלה
    מתקבלים רק מהמשוואה, ואינם חתכים של החרוט.
  lesson: '2.2'
