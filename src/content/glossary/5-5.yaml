# Terms first defined in lesson 5.5 (the derivative table and its uses).
- id: related-rates
  term: קצבים קשורים
  en: related rates
  definition: >-
    בעיה שבה כמה גדלים משתנים בזמן וקשורים במשוואה שנכונה בכל רגע. גוזרים את המשוואה לפי הזמן $t$ ומקבלים קשר בין
    הנגזרות שלהם (הקצבים), ורק אחר כך מציבים את ערכי הרגע המבוקש.
  lesson: '5.5'
- id: local-extremum
  term: נקודת קיצון מקומית
  en: local extremum
  definition: >-
    $x_0$ היא נקודת מקסימום מקומי של $f$ אם $f(x)\le f(x_0)$ לכל $x$ קרוב מספיק ל-$x_0$ (מינימום מקומי: $\ge$). בנקודה
    פנימית שבה $f$ גזירה, בקיצון מקומי $f'(x_0)=0$; ההפך אינו נכון ($x^3$ ב-0).
  lesson: '5.5'
- id: critical-point-1d
  term: נקודה קריטית (במשתנה אחד)
  en: critical point (one variable)
  definition: >-
    נקודה פנימית בתחום ההגדרה של $f$ שבה $f'=0$ או ש-$f'$ אינה קיימת (פינה, משיק אנכי). קיצון מקומי בנקודה פנימית יכול
    להיות רק בנקודה קריטית, אבל לא כל נקודה קריטית היא קיצון: ל-$x^3$ ב-0 הנגזרת מתאפסת, והפונקציה עולה משני הצדדים.
    (בכמה משתנים, בשיעור 10.7: הנקודה שבה כל הנגזרות החלקיות מתאפסות.)
  lesson: '5.5'
- id: mean-value-theorem
  term: משפט הערך הממוצע
  en: mean value theorem
  symbol: 'f''(c)=\frac{f(b)-f(a)}{b-a}'
  definition: >-
    נקרא גם משפט לגרנז׳. אם $f$ רציפה בקטע הסגור $[a,b]$ וגזירה בקטע הפתוח $(a,b)$, יש נקודה $c$ עם $a<c<b$ שבה השיפוע
    של המשיק שווה לשיפוע המיתר בין הקצוות: $f'(c)=\frac{f(b)-f(a)}{b-a}$. בקורס הוא משמש בלי הוכחה, ומכאן ש-$f'>0$
    בקטע גורר ש-$f$ עולה בו.
  lesson: '5.5'
- id: sign-change-test
  term: מבחן החלפת הסימן
  en: first-derivative test
  definition: >-
    מבחן לסיווג נקודה קריטית $c$ של פונקציה רציפה: אם $f'$ עוברת ב-$c$ מחיובית (משמאל) לשלילית (מימין), זה מקסימום
    מקומי; משלילית לחיובית, מינימום מקומי; ואם הסימן של $f'$ זהה משני הצדדים, אין ב-$c$ קיצון.
  lesson: '5.5'
- id: global-extremum
  term: קיצון מוחלט
  en: global (absolute) extremum
  definition: >-
    הערך הגדול ביותר (מקסימום מוחלט) או הקטן ביותר (מינימום מוחלט) של $f$ בכל הקבוצה שבה מסתכלים עליה, לא רק ליד נקודה.
    בקטע סגור $[a,b]$ שבו $f$ רציפה הם קיימים (משפט קיום מקסימום ומינימום), ומתקבלים בנקודה קריטית בתוך הקטע או באחד
    הקצוות.
  lesson: '5.5'
