# Terms first defined in lesson 12.8 (Green's theorem, enrichment).
- id: greens-theorem
  term: משפט גרין
  en: Green's theorem
  symbol: '\oint_C P\,dx+Q\,dy=\iint_D\left(\frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}\right)dA'
  definition: >-
    כש-$C$ עקום סגור פשוט שהוא השפה של התחום $D$, בכיוון החיובי, ול-$P,Q$ נגזרות חלקיות רציפות בכל $D$, האינטגרל הקווי
    על $C$ שווה לאינטגרל הכפול של $\frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}$ על $D$. בקורס משתמשים בו
    בלי הוכחה.
  reject: []
  lesson: '12.8'
- id: positive-orientation
  term: כיוון חיובי של עקום סגור
  en: positive orientation
  definition: >-
    הכיוון שבו מקיפים את עקום השפה כשהתחום נשאר משמאל להולך: נגד כיוון השעון במעגל. $\oint_C$ נלקח בכיוון הזה אלא אם
    נאמר אחרת, והקפה בכיוון ההפוך הופכת את הסימן של אינטגרל קווי של שדה.
  reject: []
  lesson: '12.8'
