# Terms first defined in lesson 2.3 (polar coordinates).
- id: polar-coordinates
  term: קואורדינטות קוטביות
  en: polar coordinates
  symbol: '(r,\theta)'
  definition: >-
    תיאור נקודה במישור על ידי המרחק שלה מהראשית $r=\sqrt{x^2+y^2}\ge0$ והזווית $\theta$ מהכיוון החיובי של ציר $x$, נגד
    כיוון השעון: $x=r\cos\theta$, $y=r\sin\theta$. הזווית נקבעת עד כדי כפולה של $2\pi$, ולכן קובעים טווח, $[0,2\pi)$
    או $(-\pi,\pi]$.
  reject: [קואורדינאטות קוטביות, קורדינטות קוטביות]
  lesson: '2.3'
- id: cardioid
  term: קרדיואידה
  en: cardioid
  symbol: 'r=1+\cos\theta'
  definition: >-
    העקום הקוטבי $r=a(1+\cos\theta)$, בצורת לב: הוא עובר דרך הראשית ב-$\theta=\pi$ ומגיע הכי רחוק, $2a$, ב-$\theta=0$.
  lesson: '2.3'
- id: quadrant
  term: רביע
  en: quadrant
  definition: >-
    אחד מארבעת החלקים שהצירים מחלקים אליהם את המישור, ממוספרים נגד כיוון השעון: בראשון $x>0$ ו-$y>0$, בשני $x<0$
    ו-$y>0$, בשלישי $x<0$ ו-$y<0$, ברביעי $x>0$ ו-$y<0$. נקודה על ציר אינה בשום רביע.
  lesson: '2.3'
- id: ray
  term: קרן
  en: ray
  symbol: '\theta=c'
  definition: >-
    חצי ישר: כל הנקודות שיוצאות מנקודה אחת בכיוון אחד. בקואורדינטות קוטביות $\theta=c$ היא הקרן שיוצאת מהראשית בזווית
    $c$ לכיוון החיובי של ציר $x$; החצי השני של אותו ישר הוא הקרן $\theta=c+\pi$.
  lesson: '2.3'
- id: polar-equation
  term: משוואה קוטבית
  en: polar equation
  symbol: 'r=f(\theta)'
  definition: >-
    משוואה שקושרת בין $r$ ל-$\theta$, בדרך כלל $r=f(\theta)$. העקום שלה הוא כל הנקודות שהקואורדינטות הקוטביות שלהן
    מקיימות אותה: בכל כיוון $\theta$ מסמנים נקודה במרחק $f(\theta)$ מהראשית. בקורס $r\ge0$, ולכן יש לעקום נקודות רק
    בכיוונים שבהם $f(\theta)\ge0$.
  lesson: '2.3'
- id: disc
  term: עיגול
  en: disc
  symbol: '0\le r\le R'
  definition: >-
    מעגל יחד עם כל מה שבתוכו. המעגל הוא רק הקו, $x^2+y^2=R^2$; העיגול הוא התחום $x^2+y^2\le R^2$, ובקואורדינטות
    קוטביות $0\le r\le R$ עם כל הזוויות.
  lesson: '2.3'
- id: annulus
  term: טבעת
  en: annulus
  symbol: 'a\le r\le b'
  definition: >-
    התחום שבין שני מעגלים עם אותו מרכז. סביב הראשית: $a^2\le x^2+y^2\le b^2$, ובקואורדינטות קוטביות $a\le r\le b$ עם
    כל הזוויות.
  lesson: '2.3'
- id: sector
  term: גזרה
  en: circular sector
  symbol: '0\le r\le R,\ \alpha\le\theta\le\beta'
  definition: >-
    "פרוסת עוגה": החלק של עיגול שבין שתי קרניים שיוצאות מהמרכז. סביב הראשית, בקואורדינטות קוטביות:
    $0\le r\le R$, $\alpha\le\theta\le\beta$.
  lesson: '2.3'
