# Terms first defined in lesson 1.3 (lines and planes).
- id: parametric-line
  term: הצגה פרמטרית של ישר
  en: parametric equations of a line
  symbol: '\vec r(t)=P_0+t\vec v'
  definition: >-
    הישר דרך הנקודה $P_0$ בכיוון $\vec v\ne\vec0$: $\vec r(t)=P_0+t\vec v$, כלומר $x=x_0+v_1t$, $y=y_0+v_2t$, $z=z_0+v_3t$, כש-$t$
    עובר על כל המספרים. אפשר לחשוב על $t$ כזמן ועל $\vec v$ כמהירות קבועה. ישר דרך $A$ ו-$B$: $P_0=A$, $\vec v=\vec{AB}$.
  lesson: '1.3'
- id: canonical-line
  term: הצורה הקנונית של ישר
  en: symmetric (canonical) equations of a line
  symbol: '\frac{x-x_0}{v_1}=\frac{y-y_0}{v_2}=\frac{z-z_0}{v_3}'
  definition: >-
    מה שמתקבל כשמבודדים את $t$ מכל אחת מהמשוואות הפרמטריות (כש-$v_1,v_2,v_3\ne0$). אם רכיב כיוון מתאפס, הקואורדינטה המתאימה
    קבועה: לכיוון $(0,v_2,v_3)$ כותבים $x=x_0$ ו-$\frac{y-y_0}{v_2}=\frac{z-z_0}{v_3}$.
  lesson: '1.3'
- id: normal-vector
  term: וקטור נורמל
  en: normal vector
  symbol: '\vec n=(a,b,c)'
  definition: >-
    וקטור שמאונך למישור, כלומר לכל וקטור שמחבר שתי נקודות במישור. המישור דרך $P_0$ עם נורמל $\vec n=(a,b,c)$ הוא
    $\vec n\cdot(\vec r-P_0)=0$, כלומר $ax+by+cz=d$ עם $d=\vec n\cdot P_0$: המקדמים של $x,y,z$ הם רכיבי הנורמל.
  lesson: '1.3'
- id: direction-vector
  term: וקטור כיוון
  en: direction vector
  symbol: '\vec v=(v_1,v_2,v_3)'
  definition: >-
    וקטור שונה מאפס שמקביל לישר: ההעתק בין שתי נקודות שונות כלשהן על הישר. הוא אינו יחיד: כל כפולה שלו במספר שונה מאפס
    היא וקטור כיוון של אותו ישר. שני ישרים מקבילים בדיוק כשווקטורי הכיוון שלהם כפולה זה של זה.
  lesson: '1.3'
- id: parameter
  term: פרמטר
  en: parameter
  symbol: 't'
  definition: >-
    משתנה עזר שכל ערך שלו בוחר נקודה אחת: בהצגה הפרמטרית של ישר, $t$ אומר כמה פעמים הוסיפו את וקטור הכיוון לנקודת
    ההתחלה. הפרמטר אינו נקודה: כדי לקבל נקודה מציבים אותו במשוואות הישר.
  lesson: '1.3'
- id: plane-equation
  term: משוואת מישור
  en: equation of a plane
  symbol: 'ax+by+cz=d'
  definition: >-
    משוואה ממעלה ראשונה בשלושת המשתנים, $ax+by+cz=d$, שבה $a,b,c$ אינם כולם אפס. הנקודות שמקיימות אותה הן מישור
    שהנורמל שלו $(a,b,c)$; $d=0$ בדיוק כשהמישור עובר דרך הראשית, ושינוי של $d$ מזיז את המישור במקביל לעצמו.
  lesson: '1.3'
- id: point-plane-distance
  term: מרחק מנקודה למישור
  en: distance from a point to a plane
  symbol: '\frac{|ax_1+by_1+cz_1-d|}{\sqrt{a^2+b^2+c^2}}'
  definition: >-
    אורך הקטע המאונך למישור שמחבר את הנקודה אליו; זה המרחק הקצר ביותר מהנקודה אל נקודה במישור. הוא שווה לערך המוחלט של
    ההיטל של $\vec{P_0Q}$ על כיוון הנורמל, כש-$P_0$ נקודה כלשהי במישור: $\frac{|\vec n\cdot(Q-P_0)|}{|\vec n|}$, ובמקדמים, לנקודה $Q=(x_1,y_1,z_1)$, הנוסחה שבסמל.
  lesson: '1.3'
