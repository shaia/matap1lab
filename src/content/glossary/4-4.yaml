# Terms first defined in lesson 4.4 (trigonometric functions and their inverses).
- id: amplitude
  term: אמפליטודה
  en: amplitude
  definition: >-
    ב-$A\sin(\omega x+\varphi)+d$: המספר $|A|$, חצי המרחק בין הערך הגבוה לנמוך. הגרף מתנודד בין $d-|A|$ ל-$d+|A|$.
  lesson: '4.4'
- id: midline
  term: קו האמצע
  en: midline
  definition: >-
    ב-$A\sin(\omega x+\varphi)+d$: הישר האופקי $y=d$, שהגרף מתנודד סביבו, באמצע בין הערך הגבוה לנמוך.
  lesson: '4.4'
- id: angular-frequency
  term: תדירות זוויתית
  en: angular frequency
  symbol: '\omega=\frac{2\pi}{T}'
  definition: >-
    ב-$\sin(\omega x+\varphi)$, עם $\omega>0$: המקדם של $x$, הקצב שבו גדלה הזווית שבתוך הסינוס. המחזור הוא
    $T=\frac{2\pi}{\omega}$. כש-$x$ הוא זמן בשניות, $\omega$ נמדדת ברדיאנים לשנייה.
  lesson: '4.4'
- id: phase
  term: מופע
  en: phase
  definition: >-
    ב-$A\cos(\omega t+\varphi)$: הזווית $\omega t+\varphi$ שבתוך הקוסינוס, שאומרת באיזה שלב של המחזור נמצאת התנודה ברגע
    $t$. הקבוע $\varphi$ הוא המופע ברגע $t=0$ (**המופע ההתחלתי**).
  lesson: '4.4'
- id: phase-shift
  term: הזזת מופע
  en: phase shift
  definition: >-
    ב-$\sin(\omega x+\varphi)=\sin\!\left(\omega\left(x+\frac{\varphi}{\omega}\right)\right)$: ההזזה האופקית של הגרף ביחס
    ל-$\sin(\omega x)$. היא $-\frac{\varphi}{\omega}$: ימינה כשהמספר הזה חיובי, שמאלה כשהוא שלילי.
  lesson: '4.4'
- id: arcsin
  term: ארקסינוס
  en: arcsine
  symbol: '\arcsin:[-1,1]\to\left[-\tfrac\pi2,\tfrac\pi2\right]'
  definition: >-
    ההפוכה של הסינוס המצומצם לקטע $\left[-\frac\pi2,\frac\pi2\right]$: $\arcsin y$ היא הזווית היחידה בקטע הזה שהסינוס שלה
    $y$. מוגדרת ל-$y\in[-1,1]$. נכתבת גם $\sin^{-1}y$, ואינה $\frac1{\sin y}$.
  lesson: '4.4'
- id: arccos
  term: ארקקוסינוס
  en: arccosine
  symbol: '\arccos:[-1,1]\to[0,\pi]'
  definition: >-
    ההפוכה של הקוסינוס המצומצם לקטע $[0,\pi]$: $\arccos y$ היא הזווית היחידה ב-$[0,\pi]$ שהקוסינוס שלה $y$.
  lesson: '4.4'
- id: arctan
  term: ארקטנגנס
  en: arctangent
  symbol: '\arctan:\mathbb{R}\to\left(-\tfrac\pi2,\tfrac\pi2\right)'
  definition: >-
    ההפוכה של הטנגנס המצומצם לקטע הפתוח $\left(-\frac\pi2,\frac\pi2\right)$: מוגדרת לכל $y$ ממשי ועולה. כש-$y$ גדל בלי
    גבול היא מתקרבת ל-$\frac\pi2$, וכש-$y$ יורד בלי גבול היא מתקרבת למינוס $\frac\pi2$, בלי להגיע אליהם.
  lesson: '4.4'
- id: principal-value-inverse-trig
  term: הערך הראשי
  en: principal value (of an inverse trigonometric function)
  definition: >-
    מבין כל הזוויות שהסינוס (הקוסינוס, הטנגנס) שלהן שווה למספר נתון, הזווית היחידה שבתמונה של $\arcsin$ (של $\arccos$,
    של $\arctan$). למשל ל-$\sin\theta=\frac12$ יש אינסוף פתרונות, והערך הראשי הוא $\frac\pi6$.
  lesson: '4.4'
