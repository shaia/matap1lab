# Terms first defined in lesson 7.3 (integration by parts).
- id: integration-by-parts
  term: אינטגרציה בחלקים
  en: integration by parts
  symbol: '\int u\,v''\,dx=uv-\int u''v\,dx'
  definition: >-
    שיטת אינטגרציה שהיא כלל המכפלה בכיוון ההפוך: $\int uv'\,dx=uv-\int u'v\,dx$, ובכתיב של דיפרנציאלים
    $\int u\,dv=uv-\int v\,du$. את הגורם $u$ גוזרים, ולגורם $v'$ מבצעים אינטגרציה. בוחרים כ-$u$ את הגורם שנעשה פשוט
    יותר בגזירה, וכ-$v'$ גורם שיודעים לבצע לו אינטגרציה.
  reject: [אינטגרציה לפי חלקים]
  lesson: '7.3'

- id: reduction-formula
  term: נוסחת נסיגה
  en: reduction formula
  symbol: 'I_n=x^ne^x-n\,I_{n-1}'
  definition: >-
    נוסחה שמבטאת אינטגרל שתלוי במספר טבעי $n$, כמו $I_n=\int x^ne^x\,dx$, בעזרת אותו אינטגרל עם $n$ קטן יותר. מפעילים
    אותה שוב ושוב עד שמגיעים לאינטגרל מיידי. בדרך כלל מתקבלת מאינטגרציה בחלקים.
  lesson: '7.3'
