# Terms first defined in lesson 8.5 (areas between graphs, solids of revolution).
- id: solid-of-revolution
  term: גוף סיבוב
  en: solid of revolution
  definition: >-
    הגוף שנוצר כשתחום במישור מסתובב סביב ישר (ציר הסיבוב) שאינו חוצה אותו. כל חתך ניצב לציר הוא דיסקה או טבעת.
  reject: []
  lesson: '8.5'
- id: disc-method
  term: שיטת הדיסקות
  en: disc (and washer) method
  symbol: 'V=\pi\int_a^b\bigl(f(x)\bigr)^2dx'
  definition: >-
    חישוב נפח של גוף סיבוב בפרוסות ניצבות לציר: סביב ציר $x$ הפרוסה בנקודה $x$ היא דיסקה ברדיוס $f(x)$, ולכן
    $V=\pi\int_a^bf(x)^2dx$. כשיש חור, הפרוסה היא **טבעת** עם רדיוסים $R>r$, בשטח $\pi(R^2-r^2)$.
  reject: [שיטת הדסקיות]
  lesson: '8.5'
- id: shell-method
  term: שיטת הקליפות הגליליות
  en: cylindrical shell method
  symbol: 'V=2\pi\int_a^b x\,f(x)\,dx'
  definition: >-
    חישוב נפח של גוף סיבוב בגלילים דקים שמקבילים לציר: קליפה בנקודה $x$, ברדיוס $d(x)$ (המרחק לציר), בגובה
    $h(x)$ (אורך הפס) ובעובי $dx$, תורמת $2\pi\,d(x)\,h(x)\,dx$, ולכן $V=2\pi\int_a^bd(x)\,h(x)\,dx$. סביב ציר $y$, לתחום
    שמתחת ל-$y=f(x)$: $V=2\pi\int_a^bx\,f(x)\,dx$. (את הרדיוס של קליפה מסמנים $d(x)$ ולא $r(x)$: $r(x)$ הוא הרדיוס
    הפנימי בשיטת הטבעות.)
  reject: []
  lesson: '8.5'
- id: washer-method
  term: שיטת הטבעות
  en: washer method
  symbol: 'V=\pi\int_a^b\bigl(R(x)^2-r(x)^2\bigr)dx'
  definition: >-
    שיטת הדיסקות כשיש חור: הפרוסה הניצבת לציר היא טבעת, עם רדיוס חיצוני $R(x)$ (המרחק מהציר לקצה הרחוק של התחום)
    ורדיוס פנימי $r(x)$ (המרחק לקצה הקרוב). שטח הטבעת $\pi R^2-\pi r^2=\pi(R^2-r^2)$, ולא $\pi(R-r)^2$.
  reject: []
  lesson: '8.5'
