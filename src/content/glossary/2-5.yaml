# Terms first defined in lesson 2.5 (surfaces in space and their sections).
# The letter c is kept for the position of a cutting plane (z = c), as in the figure and in the bank; the third
# semi-axis of a quadric is therefore called h.
- id: coordinate-planes
  term: מישורי הצירים
  en: coordinate planes
  definition: >-
    שלושת המישורים שכל אחד מהם מכיל שניים מהצירים: מישור $xy$ (הנקודות עם $z=0$), מישור $xz$ ($y=0$) ומישור $yz$
    ($x=0$). מישור מקביל למישור צירים הוא מישור שבו קואורדינטה אחת קבועה: $z=c$ (מישור אופקי), $x=c$ או $y=c$ (מישורים
    אנכיים).
  lesson: '2.5'
- id: quadric-surface
  term: משטח ריבועי
  en: quadric surface
  definition: >-
    משטח במרחב שמשוואתו ממעלה שנייה ב-$x,y,z$. הבסיסיים: אליפסואיד, חרוט, פרבולואיד (סיבובי והיפרבולי) והיפרבולואיד
    (חד-יריעתי ודו-יריעתי), וגם גלילים מעל חתכי חרוט. מזהים אותו לפי החתכים שלו.
  lesson: '2.5'
- id: section
  term: חתך
  en: section (trace)
  definition: >-
    אוסף הנקודות המשותפות למשטח ולמישור, לרוב מישור מקביל לאחד ממישורי הצירים ($z=c$, $x=c$, $y=c$): מציבים את הקבוע
    במשוואה ומקבלים עקום בשני המשתנים האחרים. חתך במישור $z=c$ נקרא חתך אופקי, וחתך במישור $x=c$ או $y=c$ נקרא חתך
    אנכי. כשהמישור אינו פוגש את המשטח אומרים שאין חתך. כשהמישור נטוי, או כשחותכים שני משטחים, אומרים גם "עקום
    החיתוך".
  lesson: '2.5'
- id: ellipsoid
  term: אליפסואיד
  en: ellipsoid
  symbol: '\frac{x^2}{a^2}+\frac{y^2}{b^2}+\frac{z^2}{h^2}=1'
  definition: >-
    המשטח $\frac{x^2}{a^2}+\frac{y^2}{b^2}+\frac{z^2}{h^2}=1$: כל חתך שלו במישור מקביל למישור צירים הוא אליפסה (או
    נקודה, או ריק). הוא חותך את הצירים ב-$\pm a$, $\pm b$ ו-$\pm h$. ספירה היא המקרה $a=b=h$.
  reject: [אליפסואידה]
  lesson: '2.5'
- id: paraboloid
  term: פרבולואיד
  en: paraboloid
  symbol: 'z=\frac{x^2}{a^2}+\frac{y^2}{b^2}'
  definition: >-
    פרבולואיד אליפטי (או סיבובי, כש-$a=b$): $z=\frac{x^2}{a^2}+\frac{y^2}{b^2}$, "קערה" שחתכיה האופקיים אליפסות והאנכיים
    פרבולות. פרבולואיד היפרבולי ("אוכף"): $z=\frac{x^2}{a^2}-\frac{y^2}{b^2}$, שחתכיו האנכיים פרבולות, וחתכיו האופקיים
    היפרבולות, חוץ מהחתך בגובה אפס, שהוא זוג ישרים.
  lesson: '2.5'
- id: hyperboloid
  term: היפרבולואיד
  en: hyperboloid
  definition: >-
    חד-יריעתי: $\frac{x^2}{a^2}+\frac{y^2}{b^2}-\frac{z^2}{h^2}=1$, שחתכיו האופקיים אליפסות לכל $z$. דו-יריעתי:
    $\frac{x^2}{a^2}+\frac{y^2}{b^2}-\frac{z^2}{h^2}=-1$, שאין לו חתך אופקי כש-$|z|<h$. החתכים האנכיים $x=c$ ו-$y=c$ של
    שניהם היפרבולות, חוץ מהחתכים של החד-יריעתי במישורים $x=\pm a$ ו-$y=\pm b$, שהם זוגות ישרים. הציר של המשטח הוא
    הציר של המשתנה שהסימן של הריבוע שלו שונה משל שני האחרים (כאן ציר $z$); כשמציבים במשתנה הזה אפס, בחד-יריעתי
    נשאר חתך, ובדו-יריעתי לא.
  reject: [היפרבולויד]
  lesson: '2.5'
- id: cone-surface
  term: חרוט
  en: cone (double cone)
  symbol: 'z^2=x^2+y^2'
  definition: >-
    משטח שעשוי מקרניים שיוצאות מנקודה אחת, הקודקוד, כולן באותה נטייה מהציר שלו: משפך אחד, שנמשך בלי סוף. בכדוריות
    זה המשטח $\theta=c$; למשל $z=\sqrt{x^2+y^2}$ הוא $\theta=\frac{\pi}{4}$. **חרוט כפול** הוא שני חרוטים כאלה, קודקוד
    מול קודקוד: $\frac{x^2}{a^2}+\frac{y^2}{b^2}=\frac{z^2}{h^2}$, למשל $z^2=x^2+y^2$. החתכים שלו במישורים דרך ציר $z$
    הם זוגות ישרים דרך הראשית, והחתכים האופקיים אליפסות שגדלות לינארית עם $|z|$. בין המשטחים הריבועיים (שיעור 2.5)
    "החרוט" הוא החרוט הכפול. **חרוט מלא** הוא הגוף: חרוט יחד עם כל מה שבתוכו.
  lesson: '2.5'
- id: surface-of-revolution
  term: משטח סיבוב
  en: surface of revolution
  definition: >-
    משטח שמתקבל כשמסובבים עקום סביב ציר. כשהציר הוא ציר $z$, המשתנים $x$ ו-$y$ מופיעים במשוואה רק בצירוף $x^2+y^2$,
    וכל החתכים האופקיים הם מעגלים שמרכזם על הציר. למשל הספירה, החרוט $z^2=x^2+y^2$ והפרבולואיד הסיבובי $z=x^2+y^2$.
  lesson: '2.5'
- id: cylinder-over-curve
  term: גליל מעל עקום
  en: cylinder over a plane curve
  definition: >-
    המשטח שמתארת במרחב משוואה שאחד המשתנים חסר בה: לוקחים את העקום שהמשוואה מתארת במישור של שני המשתנים האחרים,
    ומעבירים דרך כל נקודה שלו ישר מקביל לציר של המשתנה החסר. $x^2+y^2=1$ הוא הגליל המוכר סביב ציר $z$, ו-$z=x^2$
    הוא גליל מעל פרבולה, "מרזב" לאורך ציר $y$.
  lesson: '2.5'
- id: projection-on-xy
  term: היטל על מישור xy
  en: projection onto the xy-plane
  definition: >-
    ההיטל של הנקודה $(x,y,z)$ על מישור $xy$ הוא הנקודה $(x,y,0)$ שמתחתיה או מעליה. ההיטל של עקום במרחב הוא העקום
    שיוצרים ההיטלים של כל הנקודות שלו: ה"צל" של העקום על הרצפה כשמאירים מלמעלה. משוואה ב-$x$ ו-$y$ בלבד שמקיימות
    נקודות העקום מתארת את ההיטל, לא את העקום עצמו. באותו אופן מטילים על מישור $xz$ (הנקודה $(x,0,z)$) ועל מישור
    $yz$ (הנקודה $(0,y,z)$).
  lesson: '2.5'
