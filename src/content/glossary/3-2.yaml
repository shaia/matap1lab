# Terms first defined in lesson 3.2 (the Gauss plane).
- id: gauss-plane
  term: מישור גאוס
  en: complex plane (Argand plane)
  definition: >-
    המישור שבו המספר $a+bi$ הוא הנקודה $(a,b)$, או הווקטור מהראשית אליה. הציר האופקי הוא הציר הממשי והאנכי הציר
    המדומה; חיבור מרוכבים הוא חיבור וקטורים, והצמוד הוא שיקוף דרך הציר הממשי. נקרא גם מישור ארגנד.
  lesson: '3.2'
- id: complex-modulus
  term: ערך מוחלט של מספר מרוכב
  en: modulus
  symbol: '|z|'
  definition: >-
    $|a+bi|=\sqrt{a^2+b^2}$: המרחק של $z$ מהראשית במישור גאוס. $|z|^2=z\bar z$, $|zw|=|z||w|$, ו-$|z-w|$ הוא המרחק בין
    $z$ ל-$w$.
  lesson: '3.2'
- id: complex-argument
  term: ארגומנט
  en: argument
  symbol: '\arg z'
  definition: >-
    לכל $z\ne0$: זווית $\theta$ שבה $z=|z|(\cos\theta+i\sin\theta)$, הזווית מהציר הממשי החיובי לווקטור של $z$. היא
    נקבעת עד כדי כפולה של $2\pi$.
  lesson: '3.2'
- id: principal-argument
  term: ארגומנט ראשי
  en: principal argument
  symbol: '\operatorname{Arg}z\in(-\pi,\pi]'
  definition: >-
    הארגומנט היחיד בקטע $(-\pi,\pi]$. למספרים ממשיים שליליים $\operatorname{Arg}=\pi$. מחשבים אותו לפי הרביע, לא רק
    לפי $\arctan\frac{b}{a}$.
  lesson: '3.2'
- id: real-imaginary-axes
  term: הציר הממשי והציר המדומה
  en: real axis and imaginary axis
  definition: >-
    שני הצירים של מישור גאוס. על הציר הממשי (האופקי) נמצאים המספרים הממשיים, $b=0$; על הציר המדומה (האנכי) נמצאים
    המספרים $bi$, שהחלק הממשי שלהם 0. המספר $a+bi$ הוא הנקודה $(a,b)$: החלק הממשי הוא הקואורדינטה האופקית, והחלק
    המדומה הקואורדינטה האנכית.
  lesson: '3.2'
- id: reference-angle
  term: זווית עזר
  en: reference angle (the calculator's arctan)
  definition: >-
    ל-$z=a+bi$ עם $a\ne0$: המספר $\arctan\frac{b}{a}$, שהמחשבון מחזיר. הוא תמיד בין $-\frac{\pi}{2}$ ל-$\frac{\pi}{2}$,
    ולכן מצביע ימינה. משמאל לציר המדומה מתקנים אותו ב-$\pm\pi$ כדי לקבל את הארגומנט.
  lesson: '3.2'
- id: half-plane
  term: חצי מישור
  en: half-plane
  definition: >-
    אחד משני החלקים שישר מחלק אליהם את המישור, למשל $\operatorname{Re}z>1$ (מימין לישר $x=1$). חצי מישור סגור כולל את
    הישר, וחצי מישור פתוח לא.
  lesson: '3.2'
