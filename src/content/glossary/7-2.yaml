# Terms first defined in lesson 7.2 (integration by substitution).
- id: substitution
  term: הצבה
  en: substitution (change of variable)
  symbol: '\int f(g(x))\,g''(x)\,dx=\int f(u)\,du'
  definition: >-
    שיטת אינטגרציה שהיא כלל השרשרת בכיוון ההפוך: מציבים $u=g(x)$, מחליפים $g'(x)\,dx$ ב-$du$, מבצעים אינטגרציה לפי $u$
    וחוזרים ל-$x$ (כך גם בסיכומי ההרצאות שהקורס נבנה לפיהם). מתאימה כשהנגזרת של ביטוי פנימי מופיעה כגורם. נקראת גם החלפת משתנה.
  reject: []
  lesson: '7.2'
