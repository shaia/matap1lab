# Terms first defined in lesson 7.4 (partial fractions).
- id: proper-rational-function
  term: שבר רציונלי אמיתי
  en: proper rational function
  definition: >-
    מנה של פולינומים $\frac{P}{Q}$ שבה מעלת $P$ קטנה ממעלת $Q$. שבר שאינו אמיתי מחלקים קודם (חילוק פולינומים) לפולינום
    ועוד שבר אמיתי.
  reject: []
  lesson: '7.4'
- id: irreducible-quadratic
  term: גורם ריבועי אי-פריק
  en: irreducible quadratic factor
  symbol: 'x^2+bx+c,\ b^2-4c<0'
  definition: >-
    ביטוי ריבועי בלי שורשים ממשיים (דיסקרימיננטה שלילית), כמו $x^2+1$ או $x^2+2x+5$, ולכן אינו מתפרק לגורמים לינאריים
    ממשיים. בפירוק לשברים חלקיים מעליו מונה לינארי, והאינטגרל נותן לוגריתם ו-$\arctan$.
  reject: []
  lesson: '7.4'
- id: partial-fractions
  term: שברים חלקיים
  en: partial fractions
  definition: >-
    כתיבה של שבר רציונלי אמיתי כסכום של שברים פשוטים לפי הגורמים של המכנה: $\frac{A}{x-a}$ לכל גורם לינארי, שבר לכל
    חזקה של גורם חוזר, ו-$\frac{Bx+D}{x^2+px+q}$ לכל גורם ריבועי אי-פריק (ולגורם ריבועי חוזר, שבר כזה לכל חזקה). לכל
    שבר כזה, חוץ מחזקות של גורם ריבועי, יש פונקציה קדומה מהטבלה: לוגריתם, חזקה או $\arctan$.
  reject: [שברים חלקים]
  lesson: '7.4'
- id: pole
  term: קוטב
  en: pole (of a rational function)
  definition: >-
    נקודה $a$ שבה המכנה של פונקציה רציונלית מתאפס והמונה לא (אחרי צמצום גורמים משותפים). ליד קוטב הפונקציה גדלה בערכה
    המוחלט בלי גבול, והישר $x=a$ הוא אסימפטוטה אנכית. בפירוק לשברים חלקיים, השבר שהמכנה שלו מתאפס ב-$a$ שולט ליד $a$.
  reject: []
  lesson: '7.4'
- id: rational-function
  term: פונקציה רציונלית
  en: rational function
  definition: >-
    מנה של שני פולינומים, $R(x)=\frac{P(x)}{Q(x)}$, מוגדרת בכל מקום שבו $Q(x)\ne0$. למשל $\frac{3x-1}{x^2-3x+2}$ או
    $\frac{x^3}{x^2-1}$.
  reject: []
  lesson: '7.4'
- id: cover-up-method
  term: שיטת הכיסוי
  en: cover-up method
  definition: >-
    דרך מהירה למצוא את המקדם של $\frac{A}{x-a}$ בפירוק לשברים חלקיים, כש-$x-a$ גורם של המכנה: "מכסים" את הגורם $x-a$
    ומציבים $x=a$ בכל מה שנשאר, כמו שהוא. בגורם חוזר $(x-a)^k$ השיטה נותנת רק את המקדם של החזקה הגבוהה,
    $\frac{A_k}{(x-a)^k}$.
  reject: []
  lesson: '7.4'
