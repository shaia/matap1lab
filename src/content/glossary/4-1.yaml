# Terms first defined in lesson 4.1 (function, domain, image, composition).
- id: domain
  term: תחום הגדרה
  en: domain
  definition: >-
    קבוצת הקלטים שהפונקציה מוגדרת עליהם. כשנתונה רק נוסחה, תחום ההגדרה הוא כל ה-$x$ שבהם כל פעולה בנוסחה מותרת: מכנה
    שונה מ-0, ביטוי אי-שלילי בתוך שורש זוגי, ביטוי חיובי בתוך $\ln$.
  lesson: '4.1'
- id: image
  term: תמונה
  en: image (range)
  symbol: 'f(A)=\{f(x):x\in A\}'
  definition: >-
    קבוצת הערכים שהפונקציה באמת מקבלת: $f(A)=\{f(x):x\in A\}$. למשל התמונה של $x^2$ על $\mathbb{R}$ היא $[0,\infty)$.
  lesson: '4.1'
- id: composition
  term: הרכבה
  en: composition
  symbol: '(f\circ g)(x)=f(g(x))'
  definition: >-
    הפונקציה $(f\circ g)(x)=f(g(x))$: מפעילים קודם את $g$ ועל התוצאה את $f$. היא מוגדרת ב-$x$ כש-$x$ בתחום של $g$ וגם
    $g(x)$ בתחום של $f$. בדרך כלל $f\circ g\ne g\circ f$.
  lesson: '4.1'
- id: function
  term: פונקציה
  en: function
  symbol: 'f:A\to\mathbb{R},\ x\mapsto f(x)'
  definition: >-
    כלל שמתאים לכל מספר $x$ בקבוצה $A$ (תחום ההגדרה) מספר **אחד** $f(x)$. אפשר לחשוב עליה כמכונה: קלט $x$ נכנס, פלט
    $f(x)$ יוצא. שני קלטים שונים יכולים לתת אותו פלט, אבל קלט אחד לעולם אינו נותן שני פלטים.
  lesson: '4.1'
- id: graph-of-function
  term: גרף של פונקציה
  en: graph of a function
  symbol: '\{(x,f(x)):x\in A\}'
  definition: >-
    אוסף הנקודות $(x,f(x))$ במישור, כש-$x$ עובר על תחום ההגדרה. כל ישר אנכי פוגש את הגרף לכל היותר בנקודה אחת; ישר
    אנכי שאינו פוגש אותו בכלל עובר ב-$x$ שאינו בתחום.
  lesson: '4.1'
- id: increasing-decreasing
  term: פונקציה עולה ופונקציה יורדת
  en: increasing and decreasing function
  definition: >-
    $f$ עולה בקטע $I$ אם לכל $x_1<x_2$ ב-$I$ מתקיים $f(x_1)<f(x_2)$, ויורדת אם תמיד $f(x_1)>f(x_2)$. בגרף: כשזזים
    ימינה הגרף עולה (או יורד). זו שאלה על **הכיוון** של הגרף, לא על הסימן שלו: פונקציה שלילית יכולה לעלות.
  lesson: '4.1'
- id: zero-of-function
  term: אפס של פונקציה
  en: zero (root) of a function
  definition: >-
    מספר $x_0$ בתחום ההגדרה שבו $f(x_0)=0$. בגרף, האפסים הם נקודות החיתוך עם ציר $x$. נקודת החיתוך עם ציר $y$ היא
    $(0,f(0))$, כשהמספר 0 בתחום.
  lesson: '4.1'
