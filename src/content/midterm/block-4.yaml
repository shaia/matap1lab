    - label: ג
      points: 11
      type: open
      objectives: [OBJ-6.5-1, OBJ-6.5-2]
      prompt: >-
        חקרו את $f$: זוגיות, אסימפטוטות (ומאיזה צד של כל אסימפטוטה נמצא הגרף), תחומי עלייה וירידה, קיצון, קמירות
        ונקודות פיתול. הראו שיש ל-$f$ בדיוק שלושה אפסים, ומצאו קטע באורך 1 שמכיל את האפס החיובי. שרטטו את הגרף, ובדקו
        את השרטוט מול ערכים מחושבים.
      solution:
        - kind: given
          text: '$f(x)=x-2\arctan x$, רציפה וגזירה לכל $x$.'
        - kind: goal
          text: 'חקירה מלאה, מספר האפסים ומקומם, ושרטוט.'
        - kind: idea
          text: >-
            $f$ אי-זוגית, ולכן מספיק לחקור את $x\ge0$ ולשקף דרך הראשית. כש-$x$ גדול $\arctan x$ כמעט קבוע, ולכן $f$
            מתנהגת כמו $x$ פחות קבוע: מחפשים אסימפטוטות משופעות.
        - kind: step
          text: >-
            זוגיות: $\arctan(-x)=-\arctan x$, ולכן $f(-x)=-f(x)$. אין אסימפטוטות אנכיות, כי $f$ רציפה בכל מקום. ההפרש
            $f(x)-(x-\pi)=\pi-2\arctan x$ חיובי לכל $x$ (כי $\arctan x<\frac\pi2$) ושואף ל-0 כש-$x\to\infty$: האסימפטוטה
            $y=x-\pi$, והגרף מעליה. בשיקוף דרך הראשית: $y=x+\pi$ כש-$x\to-\infty$, והגרף מתחתיה.
        - kind: computation
          text: >-
            $f'(x)=\frac{x^2-1}{x^2+1}$: חיובית כש-$|x|>1$ ושלילית כש-$|x|<1$. לכן $f$ עולה ב-$(-\infty,-1]$ וב-$[1,\infty)$
            ויורדת ב-$[-1,1]$. מקסימום מקומי $\left(-1,\frac\pi2-1\right)\approx(-1,0.571)$, ומינימום מקומי
            $\left(1,1-\frac\pi2\right)\approx(1,-0.571)$.
        - kind: computation
          text: >-
            $f''(x)=\frac{4x}{(1+x^2)^2}$: שלילית כש-$x<0$ (קעורה) וחיובית כש-$x>0$ (קמורה). נקודת פיתול אחת, $(0,0)$,
            והשיפוע בה $f'(0)=-1$.
        - kind: step
          text: >-
            אפסים: $f(0)=0$. בקטע $(0,1]$ הפונקציה יורדת מ-0, ולכן שלילית. בקטע $[1,\infty)$ היא עולה מ-$1-\frac\pi2<0$
            אל אינסוף, ולכן מתאפסת שם פעם אחת בדיוק. $f(2)=2-2\arctan2\approx-0.214<0$ ו-$f(3)=3-2\arctan3\approx0.502>0$,
            ולפי משפט ערך הביניים האפס $a$ בקטע $(2,3)$. מאי-זוגיות, האפס השלישי הוא מינוס $a$, ואין אחרים.
        - kind: step
          text: >-
            שרטוט: משמאל הגרף מתחת לישר $y=x+\pi$ וצמוד אליו, עולה עד המקסימום ב-$x=-1$, יורד דרך הראשית בשיפוע מינוס 1
            ומחליף שם קעירות בקמירות, מגיע למינימום ב-$x=1$, ועולה מעל הישר $y=x-\pi$ ומתקרב אליו.
        - kind: check
          text: >-
            $f(0.5)\approx-0.427$, בין 0 לבין המינימום; $f(4)\approx1.348$, מעל $4-\pi\approx0.858$; $f(10)\approx7.058$,
            מעל $10-\pi\approx6.858$, וההפרש קטן מ-0.49 ל-0.20 כשמתרחקים, כמו בתיאור.
        - kind: result
          text: >-
            $f$ אי-זוגית; אסימפטוטות $y=x-\pi$ (ימינה, הגרף מעליה) ו-$y=x+\pi$ (שמאלה, הגרף מתחתיה); מקסימום מקומי
            $\left(-1,\frac\pi2-1\right)$, מינימום מקומי $\left(1,1-\frac\pi2\right)$; קעורה כש-$x<0$, קמורה כש-$x>0$,
            פיתול ב-$(0,0)$; שלושה אפסים, 0 ו-$\pm a$ עם $2<a<3$ ($a\approx2.33$).
      rubric:
        - text: 'אי-זוגיות, ושתי האסימפטוטות המשופעות עם נימוק ועם הצד שבו נמצא הגרף'
          weight: 3
        - text: >-
            $f'$ נכונה, תחומי עלייה וירידה, וסוג שתי נקודות הקיצון (הערכים עצמם נבדקו בסעיף א)
          weight: 2
        - text: >-
            $f''$ נכונה, תחומי קמירות וקעירות, ונקודת הפיתול
          weight: 2
        - text: 'בדיוק שלושה אפסים: מונוטוניות ליחידות, משפט ערך הביניים לקיום, וקטע באורך 1 לאפס החיובי'
          weight: 2
        - text: 'שרטוט עקבי עם החקירה, ובדיקה מול ערכים מחושבים'
