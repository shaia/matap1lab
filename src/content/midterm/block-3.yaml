# Midterm block 3 (chapters 4-5: functions, limits and continuity; derivatives): one exam question per paper, 25 points each.
# Original, in the style of an 80114 exam (not taken from a real exam). The three questions centre on different
# lessons: Q-mid-1-3 on 5.3 and 5.5 with 4.6 (the quickest path of a lifeguard: chain rule, a minimum on a closed
# interval and on the whole line), Q-mid-2-3 on 5.4 and 5.2 with 4.2, 4.6, 5.5 and 5.1 (Kepler's equation: existence,
# uniqueness and symmetries of an inverse, its derivative and linear approximation, a vertical tangent), Q-mid-3-3 on
# 4.5, 4.3 and 4.6 with 4.1, 4.2, 5.3 and 5.2 (the Fermi-Dirac occupation: a limit that becomes a jump, tanh, a
# tangent line). No f'' and no Taylor: extrema and monotonicity by the sign of the first derivative.
# Every key, commonWrong and solution step recomputed with sympy (scratchpad script block3_check.py, run 2026-11-27).

- id: Q-mid-1-3
  type: exam
  title: המציל והדרך המהירה ביותר
  prompt: >-
    קו החוף הוא ציר $x$ (מטרים): החול הוא $y>0$ והים $y<0$. מציל עומד בנקודה $A=(0,7)$ על החול, ושחיין במצוקה נמצא
    בנקודה $B=(31,-24)$ בים. המציל רץ על החול במהירות 6 מ׳ לשנייה ושוחה במהירות 1.75 מ׳ לשנייה. הוא רץ בקו ישר
    לנקודה $P=(x,0)$ על קו החוף, כש-$0\le x\le31$, ומשם שוחה בקו ישר אל $B$. הזמן הכולל (בשניות) הוא

    $$T(x)=\frac{\sqrt{x^2+49}}{6}+\frac{4\sqrt{(31-x)^2+576}}{7},\qquad 0\le x\le31 .$$
  parts:
    - label: א
      points: 6
      type: expr
      objectives: [OBJ-5.3-2]
      prompt: 'חשבו את $T''(x)$.'
      answer: 'x/(6*sqrt(x^2+49)) - 4*(31-x)/(7*sqrt((31-x)^2+576))'
      answerTex: '$T''(x)=\dfrac{x}{6\sqrt{x^2+49}}-\dfrac{4(31-x)}{7\sqrt{(31-x)^2+576}}$'
      variables: [x]
      domain: [0, 31]
      correctFeedback: >-
        נכון. $\left(\sqrt u\right)'=\frac{u'}{2\sqrt u}$: באיבר הראשון $u'=2x$, ובשני $u'=2(31-x)\cdot(-1)$, ומכאן
        המינוס.
      wrongFeedback: >-
        גזרו כל שורש בכלל השרשרת: $\left(\sqrt u\right)'=\frac{1}{2\sqrt u}\cdot u'$. באיבר השני הפנימית היא
        $(31-x)^2+576$, והנגזרת שלה $2(31-x)\cdot(-1)$.
      commonWrong:
        - expr: 'x/(6*sqrt(x^2+49)) + 4*(31-x)/(7*sqrt((31-x)^2+576))'
          feedback: >-
            באיבר השני חסר הכופל $(-1)$, הנגזרת של $31-x$: הנגזרת של $(31-x)^2$ היא $2(31-x)\cdot(-1)$, לא $2(31-x)$.
            בלי המינוס $T'>0$ בכל הקטע, והזמן נראה עולה כל הדרך.
          misconception: MC-c5-chain-missing-inner
        - expr: '1/(12*sqrt(x^2+49)) + 2/(7*sqrt((31-x)^2+576))'
          feedback: >-
            גזרתם רק את השורש, $\frac{1}{2\sqrt u}$, בלי לכפול בנגזרת של מה שבתוכו ($2x$ באיבר הראשון,
            ו-$2(31-x)\cdot(-1)$ בשני).
          misconception: MC-c5-chain-missing-inner

    - label: ב
      points: 10
      type: open
      objectives: [OBJ-5.5-3, OBJ-5.3-2]
      prompt: >-
        הראו ש-$T'(24)=0$, ושאין ל-$T$ נקודה קריטית אחרת בקטע $(0,31)$. הסיקו שהזמן הקצר ביותר מתקבל כשהמציל נכנס למים
        ב-$x=24$, והשוו עם שתי האפשרויות שבקצוות: לרוץ ישר לקו המים ($x=0$), או לרוץ לנקודת החוף הקרובה ביותר לשחיין
        ($x=31$).
      solution:
        - kind: given
          text: >-
            $T'(x)=\frac16\,g(x)-\frac47\,h(x)$ (סעיף א), כאשר $g(x)=\frac{x}{\sqrt{x^2+49}}$ ו-$h(x)=\frac{31-x}{\sqrt{(31-x)^2+576}}$.
        - kind: goal
          text: '$T''(24)=0$, אין נקודה קריטית אחרת ב-$(0,31)$, ו-$T(24)$ הוא הערך הקטן ביותר של $T$ בקטע $[0,31]$.'
        - kind: idea
          text: >-
            לא פותרים את $T'(x)=0$ (זו משוואה קשה), אלא מראים ש-$T'$ **עולה** בקטע: אז היא מתאפסת לכל היותר פעם אחת. אחרי
            שמוצאים את האפס, הסימן של $T'$ משני צדדיו קובע מינימום, ובקטע סגור משווים גם עם הקצוות.
        - kind: computation
          text: >-
            $g(24)=\frac{24}{\sqrt{625}}=\frac{24}{25}$ ו-$h(24)=\frac{7}{\sqrt{49+576}}=\frac{7}{25}$, ולכן
            $T'(24)=\frac{24}{150}-\frac{28}{175}=\frac{4}{25}-\frac{4}{25}=0$.
        - kind: step
          text: >-
            ל-$x>0$ מחלקים מונה ומכנה ב-$x$, ונכנסים עם ה-$x$ אל תוך השורש בעזרת $x=\sqrt{x^2}$ (מותר כי $x>0$):

            $$g(x)=\frac{1}{\frac1x\sqrt{x^2+49}}=\frac{1}{\sqrt{\frac{x^2+49}{x^2}}}=\frac{1}{\sqrt{1+49/x^2}} .$$

            כש-$x$ גדל, $\frac{49}{x^2}$ קטן, המכנה קטן ו-$g$ גדלה; וגם $g(0)=0<g(x)$.
            באותה דרך, ל-$x<31$ מחלקים ב-$31-x>0$: $h(x)=\frac{1}{\sqrt{1+576/(31-x)^2}}$. כש-$x$ גדל, $31-x$ קטן, $\frac{576}{(31-x)^2}$ גדל ו-$h$ קטנה; וגם
            $h(31)=0$. לכן $T'=\frac16g-\frac47h$ עולה ממש ב-$[0,31]$.
        - kind: step
          text: >-
            פונקציה עולה ממש מתאפסת לכל היותר פעם אחת, ולכן $x=24$ היא הנקודה הקריטית היחידה. יותר מזה: $T'<0$ ב-$[0,24)$
            ו-$T'>0$ ב-$(24,31]$, כלומר $T$ יורדת ב-$[0,24]$ ועולה ב-$[24,31]$. לכן $T(24)<T(x)$ לכל $x\ne24$ בקטע, גם
            בקצוות.
        - kind: computation
          text: >-
            $T(24)=\frac{25}{6}+\frac{4\cdot25}{7}=\frac{775}{42}\approx18.45$ שניות. בקצוות:
            $T(0)=\frac76+\frac{4\sqrt{1537}}{7}\approx23.57$ ו-$T(31)=\frac{\sqrt{1010}}{6}+\frac{96}{7}\approx19.01$.
        - kind: check
          text: >-
            הסימנים בקצוות מתאימים:

            $$\begin{aligned}T'(0)&=-\frac{4\cdot31}{7\sqrt{1537}}\approx-0.45<0,\\ T'(31)&=\frac{31}{6\sqrt{1010}}\approx0.16>0 .\end{aligned}$$

            ובמשמעות: $g(x)$ ו-$h(x)$ הם הסינוסים של הזוויות $\theta_1,\theta_2$ של שני קטעי המסלול עם האנך לחוף, ו-$T'(24)=0$
            אומר $\frac{\sin\theta_1}{6}=\frac{\sin\theta_2}{1.75}$: חוק סנל של שבירת אור, שגם הוא נובע מעקרון של זמן קצר ביותר.
        - kind: result
          text: >-
            $x=24$ היא הנקודה הקריטית היחידה של $T$ ב-$(0,31)$, ו-$T$ יורדת לפניה ועולה אחריה: הזמן הקצר ביותר הוא
            $\frac{775}{42}\approx18.45$ שניות, לעומת כ-$23.57$ ב-$x=0$ וכ-$19.01$ ב-$x=31$.
      rubric:
        - text: 'בדיקה מפורשת ש-$T''(24)=0$'
          weight: 2
        - text: 'נימוק לכך ש-$T''$ עולה ממש בקטע (כל אחד משני האיברים מונוטוני, או $T''''>0$ בקטע: גם זה מתקבל), ולכן אין נקודה קריטית אחרת'
          weight: 3
        - text: 'הסימן של $T''$ משני צידי 24 (או הערכים בקצוות): $T$ יורדת ואחר כך עולה, ולכן מינימום'
          weight: 3
        - text: 'הזמן $\frac{775}{42}\approx18.45$ והשוואה עם $T(0)\approx23.57$ ו-$T(31)\approx19.01$'
          weight: 2

    - label: ג
      points: 4
      type: numeric
      objectives: [OBJ-5.5-3, OBJ-5.3-2]
      prompt: >-
        נניח שהמציל שוחה מהר כמו שהוא רץ: 6 מ׳ לשנייה גם במים (שאר הנתונים לא משתנים). באיזו נקודה $x$ על קו החוף
