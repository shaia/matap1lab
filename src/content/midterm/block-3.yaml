- id: Q-mid-3-3
  type: exam
  title: התפלגות פרמי-דיראק
  prompt: >-
    במתכת בטמפרטורה מוחלטת $T$, ההסתברות שמצב של אלקטרון עם אנרגיה $E$ תפוס היא (התפלגות פרמי-דיראק)

    $$n(x)=\frac{1}{e^{x/\tau}+1},$$

    כאשר $x=E-\mu$ היא האנרגיה ביחס לאנרגיה קבועה $\mu$ ("הפוטנציאל הכימי"), ו-$\tau=kT>0$ היא הטמפרטורה ביחידות של
    אנרגיה ($k$ הוא קבוע בולצמן). $x$ הוא המשתנה, ו-$\tau$ פרמטר.
  parts:
    - label: א
      points: 5
      type: mc
      objectives: [OBJ-4.6-1, OBJ-4.6-2, OBJ-4.3-1]
      qualitative: true
      prompt: >-
        מקררים את המתכת לכיוון האפס המוחלט. לכל $x$ קבוע נגדיר $n_0(x)=\lim_{\tau\to0^+}n(x)$. מהי $n_0$, ואיזו אי-רציפות
        יש לה ב-$x=0$?
      choices:
        - text: '$n_0(x)=1$ כש-$x<0$, $n_0(0)=\frac12$, ו-$n_0(x)=0$ כש-$x>0$: אי-רציפות מסוג קפיצה'
          correct: true
          feedback: >-
            נכון. כש-$x>0$, $\frac x\tau\to\infty$, ולכן $e^{x/\tau}\to\infty$ ו-$n\to0$. כש-$x<0$, $\frac x\tau\to-\infty$, ולכן
            $e^{x/\tau}\to0$ ו-$n\to1$. וב-$x=0$, $n=\frac12$ לכל $\tau$. הגבולות החד-צדדיים של $n_0$ ב-0 הם 1 משמאל ו-0 מימין:
            סופיים ושונים.
        - text: 'אותה $n_0$, ואי-רציפות סליקה, כי שני הגבולות החד-צדדיים ב-0 סופיים'
          feedback: >-
            אי-רציפות סליקה דורשת גבול דו-צדדי, כלומר גבולות חד-צדדיים **שווים**. כאן 1 משמאל ו-0 מימין: קפיצה, ושום ערך
            של $n_0(0)$ לא יסלק אותה.
          misconception: MC-c4-removable-vs-jump
        - text: '$n_0(x)=0$ לכל $x\ne0$ ו-$n_0(0)=\frac12$: אי-רציפות סליקה'
          feedback: >-
            כש-$x<0$, $e^{x/\tau}=\left(e^{x}\right)^{1/\tau}$ עם בסיס $e^x<1$ ומעריך שגדל בלי גבול: הוא שואף ל-0, לא לאינסוף.
            לכן $n\to\frac{1}{0+1}=1$ שם: כל המצבים שמתחת ל-$\mu$ תפוסים.
          misconception: MC-c4-exp-base-small

    - label: ב
      points: 5
      type: expr
      objectives: [OBJ-5.3-1, OBJ-5.3-2]
      prompt: >-
        כש-$\tau=2$, $n(x)=\frac{1}{e^{x/2}+1}$. חשבו את $n'(x)$.
      answer: '-exp(x/2)/(2*(exp(x/2)+1)^2)'
      answerTex: '$n''(x)=-\dfrac{\frac12e^{x/2}}{\left(e^{x/2}+1\right)^2}=-\dfrac{e^{x/2}}{2\left(e^{x/2}+1\right)^2}$'
      variables: [x]
      domain: [-2, 2]
      correctFeedback: >-
        נכון. $\left(\frac1u\right)'=-\frac{u'}{u^2}$ עם $u=e^{x/2}+1$, ו-$u'=\frac12e^{x/2}$ מכלל השרשרת. הנגזרת שלילית
        תמיד: $n$ יורדת, כי מצב גבוה יותר תפוס בהסתברות קטנה יותר.
      wrongFeedback: >-
        כלל המנה (או השרשרת) עם $u=e^{x/2}+1$: $\left(\frac1u\right)'=-\frac{u'}{u^2}$. והנגזרת של $e^{x/2}$ היא
        $\frac12e^{x/2}$.
      commonWrong:
        - expr: '-exp(x/2)/(exp(x/2)+1)^2'
          feedback: >-
            חסר הכופל $\frac12$, הנגזרת הפנימית של $\frac x2$: $\left(e^{x/2}\right)'=\frac12e^{x/2}$.
          misconception: MC-c5-chain-missing-inner
        - expr: 'exp(x/2)/(2*(exp(x/2)+1)^2)'
          feedback: >-
            הסימן הפוך. במונה של כלל המנה הסדר הוא נגזרת המונה כפול המכנה, **פחות** המונה כפול נגזרת המכנה. כאן המונה 1
            ונגזרתו 0, ולכן $\left(\frac1u\right)'=\frac{0\cdot u-1\cdot u'}{u^2}=-\frac{u'}{u^2}$. בדיקה: $n$ יורדת מ-1 ל-0,
            ולכן $n'<0$.
          misconception: MC-c5-quotient-order

    - label: ג
      points: 10
      type: open
      objectives: [OBJ-4.5-1, OBJ-4.1-1, OBJ-4.2-1, OBJ-5.2-1]
      prompt: >-
        (1) הראו ש-$n(x)=\frac12\left(1-\tanh\frac{x}{2\tau}\right)$. (2) הסיקו מכך את התמונה של $n$, ואת הסימטריה
        $n(-x)=1-n(x)$; תארו איך מתקבל הגרף של $n$ מהגרף של $\tanh$. (3) כתבו את משוואת המשיק לגרף של $n$ ב-$x=0$, ומצאו
        היכן הוא פוגע בישרים $y=1$ ו-$y=0$. מה קורה למרחק בין שתי הנקודות האלה כש-$\tau\to0^+$, ואיך זה מתאים לסעיף א?
      solution:
        - kind: given
          text: '$n(x)=\frac{1}{e^{x/\tau}+1}$ עם $\tau>0$, ו-$\tanh s=\frac{\sinh s}{\cosh s}=\frac{e^s-e^{-s}}{e^s+e^{-s}}$.'
        - kind: goal
          text: 'הזהות עם $\tanh$, התמונה והסימטריה, הטרנספורמציות, והמשיק ב-0 עם נקודות הפגישה שלו עם $y=1$ ו-$y=0$.'
        - kind: idea
          text: >-
            כופלים מונה ומכנה של $\tanh s$ ב-$e^s$ ומקבלים ביטוי ב-$e^{2s}$; עם $2s=\frac x\tau$ מופיע בדיוק המעריך של $n$.
            את כל השאר קוראים מתכונות ידועות של $\tanh$: עולה, אי-זוגית, והתמונה שלה $(-1,1)$.
        - kind: computation
          text: >-
            $\tanh s=\frac{e^{2s}-1}{e^{2s}+1}$, ולכן $1-\tanh s=\frac{(e^{2s}+1)-(e^{2s}-1)}{e^{2s}+1}=\frac{2}{e^{2s}+1}$. עם
            $s=\frac{x}{2\tau}$: $\frac12\left(1-\tanh\frac{x}{2\tau}\right)=\frac{1}{e^{x/\tau}+1}=n(x)$.
        - kind: step
          text: >-
            כש-$x$ עובר על כל הישר, גם $s=\frac{x}{2\tau}$ עובר על כל הישר, ו-$\tanh s$ מקבלת כל ערך ב-$(-1,1)$ ורק אותם. לכן
            $1-\tanh s$ מקבלת כל ערך ב-$(0,2)$, והתמונה של $n$ היא $(0,1)$: ההסתברות לעולם אינה בדיוק 0 או 1.
        - kind: step
          text: >-
            $\tanh$ אי-זוגית, ולכן $n(-x)=\frac12\left(1+\tanh s\right)=1-n(x)$: הנקודות $(x,n(x))$ ו-$(-x,n(-x))$ סימטריות
            ביחס לנקודה $\left(0,\frac12\right)$. הגרף מתקבל מזה של $\tanh$ במתיחה לרוחב פי $2\tau$, מתיחה לגובה פי $\frac12$,
            שיקוף ביחס לציר $x$, והזזה למעלה ב-$\frac12$ (כי $n=\frac12-\frac12\tanh s$).
        - kind: computation
          text: >-
            מכלל המנה ומכלל השרשרת:

            $$\begin{aligned}n'(x)&=-\frac{\frac1\tau e^{x/\tau}}{\left(e^{x/\tau}+1\right)^2},\\ n'(0)&=-\frac{1/\tau}{(1+1)^2}=-\frac{1}{4\tau},\end{aligned}$$

            ו-$n(0)=\frac12$. המשיק: $y=\frac12-\frac{x}{4\tau}$. הוא פוגע ב-$y=1$ כש-$x=-2\tau$ וב-$y=0$ כש-$x=2\tau$.
        - kind: check
          text: >-
            $n(2\tau)=\frac{1}{e^2+1}\approx0.12$ ו-$n(-2\tau)\approx0.88$: רוב המעבר מ"כמעט תפוס" ל"כמעט ריק" קורה ברצועה ברוחב
            של כ-$4\tau$ סביב $\mu$. ולפי הסימטריה $n(2\tau)+n(-2\tau)=1$, כמצופה.
        - kind: result
          text: >-
            $n=\frac12\left(1-\tanh\frac{x}{2\tau}\right)$; התמונה $(0,1)$; $n(-x)=1-n(x)$. המשיק ב-0 הוא $y=\frac12-\frac{x}{4\tau}$,
            ופוגע ב-$y=1$ וב-$y=0$ ב-$x=\mp2\tau$: מרחק $4\tau$. כש-$\tau\to0^+$ המרחק שואף ל-0 והמשיק נעשה אנכי: המדרגה
            מתחדדת לקפיצה של $n_0$ מסעיף א.
      rubric:
        - text: 'הזהות עם $\tanh$: כתיבת $\tanh s$ בעזרת $e^{2s}$ והצבת $s=\frac{x}{2\tau}$'
          weight: 3
        - text: 'התמונה $(0,1)$ מהתמונה של $\tanh$, והסימטריה $n(-x)=1-n(x)$ מאי-הזוגיות שלה'
          weight: 2
        - text: 'תיאור הגרף מזה של $\tanh$: מתיחה לרוחב פי $2\tau$, מתיחה לגובה פי $\frac12$, שיקוף והזזה'
          weight: 1
        - text: 'משוואת המשיק $y=\frac12-\frac{x}{4\tau}$, עם $n''(0)=-\frac{1}{4\tau}$'
          weight: 3
        - text: 'נקודות הפגישה $x=\mp2\tau$, והקשר לסעיף א: המרחק $4\tau$ שואף ל-0'
          weight: 1

    - label: ד
      points: 5
      type: numeric
      objectives: [OBJ-5.2-1, OBJ-5.2-2]
