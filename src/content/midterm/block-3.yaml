            $T'(24)=\frac{1}{6}\left(\frac{24}{25}-\frac{7}{25}\right)>0$, ולכן 24 אינה נקודה קריטית.
        - value: 15.5
          feedback: >-
            אמצע הקטע $[0,31]$ אינו נקודה מיוחדת: $A$ ו-$B$ אינם באותו מרחק מקו החוף (7 מול 24). הקו הישר $AB$ חוצה את קו
