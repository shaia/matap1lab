- id: Q-mid-2-3
  type: exam
  title: משוואת קפלר
  prompt: >-
    במסלול של כוכב לכת סביב השמש מודדים את הזמן בזווית $M$ ("האנומליה הממוצעת", שגדלה בקצב קבוע ב-$2\pi$ בכל הקפה),
    ואת המקום על המסלול בזווית אחרת, $E$. הן קשורות ב**משוואת קפלר** $M=E-\varepsilon\sin E$, כאשר $\varepsilon$, מספר בין
    0 ל-1, הוא האקסצנטריות של המסלול. בסעיפים א-ג $\varepsilon=\frac12$:

    $$M=f(E)=E-\tfrac12\sin E .$$

    את המשוואה אי אפשר לפתור לפי $E$ בנוסחה. נסמן ב-$E=g(M)$ את הפתרון (אחרי שנראה בסעיף א שהוא קיים ויחיד).
  parts:
    - label: א
      points: 10
      type: open
      objectives: [OBJ-5.5-3, OBJ-4.6-3, OBJ-4.2-3]
      prompt: >-
        הוכיחו שלכל $M$ ממשי יש למשוואה $f(E)=M$ פתרון $E$ אחד בדיוק, ושהוא מקיים $|E-M|\le\frac12$. הראו גם ש-$g$
        אי-זוגית ושלכל $M$ מתקיים $g(M+2\pi)=g(M)+2\pi$.
      solution:
        - kind: given
          text: '$f(E)=E-\frac12\sin E$, רציפה וגזירה על כל הישר.'
        - kind: goal
          text: 'קיום ויחידות של פתרון לכל $M$, החסם $|E-M|\le\frac12$, והתכונות $g(-M)=-g(M)$ ו-$g(M+2\pi)=g(M)+2\pi$.'
        - kind: idea
          text: >-
            יחידות באה ממונוטוניות (הסימן של $f'$), קיום ממשפט ערך הביניים בקטע שבו $f-M$ מחליפה סימן. את הסימטריות של $g$
            מעבירים מ-$f$ בעזרת היחידות: אם מספר מקיים את המשוואה, הוא **הפתרון**.
        - kind: step
          text: >-
            $f'(E)=1-\frac12\cos E\ge1-\frac12=\frac12>0$ לכל $E$, ולכן $f$ עולה ממש על כל הישר, ולמשוואה $f(E)=M$ יש לכל
            היותר פתרון אחד.
        - kind: computation
          text: >-
            כי $|\sin|\le1$:

            $$\begin{aligned}f\!\left(M+\tfrac12\right)-M&=\tfrac12-\tfrac12\sin\!\left(M+\tfrac12\right)\ge0,\\ f\!\left(M-\tfrac12\right)-M&=-\tfrac12-\tfrac12\sin\!\left(M-\tfrac12\right)\le0.\end{aligned}$$
        - kind: theorem
          text: >-
            משפט ערך הביניים: $f$ רציפה בקטע הסגור $\left[M-\frac12,M+\frac12\right]$, ו-$M$ נמצא בין הערכים שלה בקצוות, ולכן
            יש בקטע $E$ עם $f(E)=M$.
        - kind: step
          text: >-
            לכן יש פתרון אחד בדיוק, והוא בקטע: $|E-M|\le\frac12$. (אותו חסם יוצא גם ישר מהמשוואה: $E-M=\frac12\sin E$.)
        - kind: step
          text: >-
            $f$ אי-זוגית: $f(-E)=-E+\frac12\sin E=-f(E)$. אם $E=g(M)$, אז $f(-E)=-M$, ולפי היחידות $g(-M)=-E=-g(M)$.
        - kind: step
          text: >-
            $f(E+2\pi)=E+2\pi-\frac12\sin E=f(E)+2\pi$. לכן $f\big(g(M)+2\pi\big)=M+2\pi$, ולפי היחידות $g(M+2\pi)=g(M)+2\pi$.
        - kind: result
          text: >-
            לכל $M$ יש פתרון יחיד $E=g(M)$, עם $|g(M)-M|\le\frac12$; $g$ אי-זוגית, ו-$g(M)-M$ מחזורית עם מחזור $2\pi$: אחרי
            הקפה שלמה ($M$ גדל ב-$2\pi$) גם $E$ גדל ב-$2\pi$, והכוכב חוזר לאותו מקום.
      rubric:
        - text: '$f''(E)=1-\frac12\cos E\ge\frac12>0$, ולכן $f$ עולה ממש ויש לכל היותר פתרון אחד'
          weight: 2
        - text: 'קיום בעזרת משפט ערך הביניים: קטע מפורש שבקצותיו $f-M$ מחליפה סימן, עם רציפות'
          weight: 3
        - text: 'החסם $|E-M|\le\frac12$'
          weight: 1
        - text: 'אי-זוגיות של $g$ מאי-זוגיות של $f$ ומהיחידות'
          weight: 2
        - text: '$g(M+2\pi)=g(M)+2\pi$ מ-$f(E+2\pi)=f(E)+2\pi$ ומהיחידות'
          weight: 2

    - label: ב
      points: 5
      type: numeric
      objectives: [OBJ-5.4-2]
      prompt: >-
        ברגע שבו $E=\frac\pi3$, כלומר $M=\frac\pi3-\frac{\sqrt3}4$, חשבו את $\frac{dE}{dM}=g'(M)$.
      answer: 1.3333333333333333
      tolerance: 0.001
      correctFeedback: >-
        נכון. $g'(M)=\frac{1}{f'(E)}$ בנקודה $E=g(M)=\frac\pi3$: $f'\!\left(\frac\pi3\right)=1-\frac12\cdot\frac12=\frac34$, ולכן
        $g'=\frac43$.
      wrongFeedback: >-
        הנגזרת של ההפוכה היא אחד חלקי הנגזרת של $f$, מחושבת בנקודה $E$ שמתאימה ל-$M$ (כאן $\frac\pi3$), לא ב-$M$ עצמו.
      commonWrong:
        - value: 0.75
          feedback: >-
            $\frac34=f'\!\left(\frac\pi3\right)$ היא הנגזרת של $f$. הנגזרת של ההפוכה היא ההופכי שלה, $\frac{1}{3/4}$.
          misconception: MC-c5-inverse-is-reciprocal
        - value: 1.69096510762481
          feedback: >-
            חישבתם $\frac{1}{f'(M)}$ עם $M=\frac\pi3-\frac{\sqrt3}4\approx0.614$. את $f'$ מציבים בנקודה $E=\frac\pi3$ שבה
            $f(E)=M$, לא ב-$M$.
          misconception: MC-c5-inverse-wrong-point

    - label: ג
      points: 5
      type: numeric
      objectives: [OBJ-5.2-1, OBJ-5.4-2]
      prompt: >-
        נתון ש-$g(\pi)=\pi$ (כי $f(\pi)=\pi-\frac12\sin\pi=\pi$). העריכו בעזרת הקירוב הלינארי של $g$ ליד $M=\pi$ את $E$
        כש-$M=\pi+0.3$.
      answer: 3.3415926535897933
      tolerance: 0.001
      correctFeedback: >-
