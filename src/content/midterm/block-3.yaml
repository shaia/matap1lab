    - label: ד
      points: 5
      type: mc
      objectives: [OBJ-4.6-3, OBJ-5.5-3]
      qualitative: true
      prompt: >-
        נניח שהמציל רשאי להיכנס למים בכל נקודה של קו החוף, כלומר $T(x)$ מוגדרת באותה נוסחה לכל $x$ ממשי. איזו טענה
