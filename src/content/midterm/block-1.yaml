    - label: ג
      points: 10
      type: open
      objectives: [OBJ-2.5-3, OBJ-2.1-2, OBJ-2.1-3, OBJ-2.2-2]
      standalone: false
      prompt: >-
        השפה של כתם האור היא עקום החיתוך של החרוט $z=\sqrt{x^2+y^2}$ עם מישור התקרה. מצאו את ההיטל שלה על מישור $xy$,
        הראו שהשפה עצמה היא אליפסה, ומצאו את המרכז שלה ואת חצאי הצירים שלה.
      solution:
        - kind: given
          text: 'החרוט $z^2=x^2+y^2$ עם $z\ge0$, והתקרה $z=3-\frac{x}{2}$ מסעיף ב.'
        - kind: goal
          text: 'משוואת ההיטל, זיהוי העקום שבמישור התקרה, המרכז וחצאי הצירים שלו.'
        - kind: idea
          text: >-
            מציבים את ה-$z$ של המישור במשוואת החרוט. המשוואה ב-$x$ וב-$y$ שמתקבלת היא ההיטל של עקום החיתוך על מישור $xy$,
            לא העקום עצמו. במישור $z=px+k$ העקום הוא ההיטל כשהוא מתוח פי $\sqrt{1+p^2}$ בכיוון $x$, ובכיוון $y$ הוא אינו
            משתנה.
        - kind: computation
          text: >-
            $\left(3-\frac{x}{2}\right)^2=x^2+y^2$, כלומר $9-3x+\frac{x^2}{4}=x^2+y^2$. כפל ב-4 וסידור:
            $3x^2+12x+4y^2=36$.
        - kind: computation
          text: >-
            השלמה לריבוע: $3(x+2)^2-12+4y^2=36$, כלומר $3(x+2)^2+4y^2=48$, ובחלוקה ב-48:
            $$\frac{(x+2)^2}{16}+\frac{y^2}{12}=1 .$$
            ההיטל הוא אליפסה שמרכזה $(-2,0)$, עם חצי ציר 4 בכיוון $x$ וחצי ציר $2\sqrt3$ בכיוון $y$.
        - kind: step
          text: >-
            השיפוע של התקרה הוא $p=-\frac12$, ולכן העקום עצמו מתוח בכיוון $x$ פי $\sqrt{1+\frac14}=\frac{\sqrt5}{2}$: חצאי
            הצירים שלו $4\cdot\frac{\sqrt5}{2}=2\sqrt5$ ו-$2\sqrt3$. זו אליפסה במישור התקרה. המרכז שלה מעל $(-2,0)$, בגובה
            $3+1=4$: הנקודה $(-2,0,4)$.
        - kind: check
          text: >-
            הקצוות של ההיטל בכיוון $x$ הם $x=2$ ו-$x=-6$, ומעליהם בדיוק $A=(2,0,2)$ ו-$B=(-6,0,6)$. לכן $AB$ הוא הציר הארוך:
            $|\vec{AB}|=\sqrt{64+16}=4\sqrt5$, פעמיים $2\sqrt5$. הקצה של הציר הקצר $(-2,2\sqrt3,4)$ על החרוט ($4+12=16$) ועל
            התקרה ($-2+8=6$). גם $C$: $\frac{4}{16}+\frac{9}{12}=1$. ועל כל העקום $z=3-\frac{x}{2}\ge2>0$, כך שהוא כולו על
            החצי העליון של החרוט.
        - kind: result
          text: >-
            ההיטל: $\frac{(x+2)^2}{16}+\frac{y^2}{12}=1$. שפת כתם האור היא אליפסה שמרכזה $(-2,0,4)$, עם חצי ציר $2\sqrt5$
            (לאורך $AB$) וחצי ציר $2\sqrt3$ (בכיוון $y$).
      rubric:
        - text: 'הצבת המישור בחרוט והשלמה לריבוע עד משוואת ההיטל $\frac{(x+2)^2}{16}+\frac{y^2}{12}=1$'
          weight: 4
        - text: 'הבחנה בין ההיטל לבין העקום שבמישור, ומתיחה פי $\frac{\sqrt5}{2}$ בכיוון $x$ (או חישוב ישיר של $|\vec{AB}|$)'
          weight: 3
        - text: 'מרכז $(-2,0,4)$ וחצאי צירים $2\sqrt5$ ו-$2\sqrt3$'
          weight: 2
        - text: 'בדיקה: $A$ ו-$B$ קצות הציר הארוך, או נקודה שנמצאת גם על החרוט וגם על התקרה'
          weight: 1

