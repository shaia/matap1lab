# Workbook of lesson 6.5 — sketching graphs.
# Objectives (src/course.ts):
#   OBJ-6.5-1  investigate a function: domain, asymptotes, increase and decrease, extrema, convexity, inflection points
#   OBJ-6.5-2  sketch the graph from the investigation and check it against computed values
#   OBJ-6.5-3  use the leading behaviour from Taylor to describe the graph near a point
# No L'Hôpital: limits of 0/0 by expansions. Chapter 5 (derivatives) is named in plain text.
# Every number recomputed with sympy in screens/tools/lesson-6-5-wb.py.
lesson: '6.5'
practice:
  - id: W-6.5-01
    level: basic
    objectives: [OBJ-6.5-1]
    prompt: >-
      $f(x)=x^3+3x^2-9x+2$. מצאו את תחומי הקמירות והקעירות של $f$ ואת נקודת הפיתול שלה (שני המספרים: $x$ ו-$f(x)$).
    answer: >-
      קעורה כש-$x<-1$, קמורה כש-$x>-1$, נקודת פיתול $(-1,13)$.
    solution:
      - kind: idea
        text: >-
          את הקמירות קובע הסימן של $f''$. גוזרים פעמיים, מוצאים איפה $f''$ מחליפה סימן, ומציבים ב-$f$.
      - kind: computation
        text: >-
          $f'(x)=3x^2+6x-9$, ו-$f''(x)=6x+6=6(x+1)$.
      - kind: step
        text: >-
          $f''$ שלילית כש-$x<-1$ (קעורה, פתוחה כלפי מטה) וחיובית כש-$x>-1$ (קמורה, פתוחה כלפי מעלה). הסימן מתחלף ב-$x=-1$,
          ולכן יש שם נקודת פיתול, עם $f(-1)=-1+3+9+2=13$.
      - kind: check
        text: >-
          לפולינום ממעלה 3 יש סימטריה סביב נקודת הפיתול $c$: בפיתוח סביב $c$ אין איבר $(x-c)^2$, כי $f''(c)=0$, ולכן
          $f(c+h)=f(c)+f'(c)h+\frac{f'''(c)}{6}h^3$, והאיברים עם $h$ ועם $h^3$ מתבטלים בסכום $f(c+h)+f(c-h)=2f(c)$. בדיקה
          עם $h=1$: $f(0)=2$ ו-$f(-2)=-8+12+18+2=24$, וסכומם $26=2\cdot13$. ✓
      - kind: result
        text: >-
          קעורה כש-$x<-1$, קמורה כש-$x>-1$; נקודת פיתול $(-1,13)$.

  - id: W-6.5-02
    level: basic
    objectives: [OBJ-6.5-1]
    prompt: >-
      מצאו את כל האסימפטוטות.

      (א) $f(x)=\frac{x^2-4x+1}{x-3}$

      (ב) $g(x)=\frac{3x^2-1}{x^2+x-2}$
    answer: >-
      (א) $x=3$ ו-$y=x-1$. (ב) $x=1$, $x=-2$ ו-$y=3$.
    solution:
      - kind: idea
        text: >-
          אנכיות: באפסי המכנה שבהם המונה אינו מתאפס. באינסוף: משווים מעלות. מונה גדול באחת: חילוק עם שארית נותן ישר
          משופע; מעלות שוות: אסימפטוטה אופקית בגובה היחס בין המקדמים המובילים.
      - kind: computation
        text: >-
          (א) המכנה מתאפס ב-3, והמונה שם $9-12+1=-2\ne0$: אסימפטוטה אנכית $x=3$. חילוק עם שארית, בהשוואת מקדמים כמו
          בסעיף "אסימפטוטה משופעת" של השיעור: $x^2-4x+1=(x-3)(x+q)+r=x^2+(q-3)x+(r-3q)$. המקדם של $x$: $q-3=-4$, כלומר
          $q=-1$; האיבר החופשי: $r-3q=1$, כלומר $r=-2$. בדיקה: $(x-3)(x-1)=x^2-4x+3$, ולכן $x^2-4x+1=(x-3)(x-1)-2$ ו-$f(x)=x-1-\frac{2}{x-3}$. השבר שואף ל-0: האסימפטוטה
          המשופעת $y=x-1$, בשני הכיוונים.
      - kind: computation
        text: >-
          (ב) $x^2+x-2=(x-1)(x+2)$. המונה ב-1 שווה 2, וב-$x=-2$ שווה 11, שניהם לא 0: שתי אסימפטוטות אנכיות, $x=1$
          ו-$x=-2$. המעלות שוות (2 ו-2), והמקדמים המובילים 3 ו-1: אסימפטוטה אופקית $y=3$.
      - kind: check
        text: >-
          (א) בגבולות: $\frac{f(x)}{x}=\frac{x^2-4x+1}{x^2-3x}\to1$, ו-$f(x)-x=\frac{-x+1}{x-3}$, ששואף למינוס 1. (ב)
          $g(10)=\frac{299}{108}\approx2.77$, בדרך ל-3.
      - kind: result
        text: >-
          (א) $x=3$, $y=x-1$. (ב) $x=1$, $x=-2$, $y=3$.

  - id: W-6.5-03
    level: basic
    qualitative: true
    objectives: [OBJ-6.5-1]
    prompt: >-
      לכל פונקציה קבעו אם היא קמורה או קעורה בכל תחום ההגדרה שלה, לפי הסימן של $f''$.

      (א) $e^{-x}$ (ב) $\ln x$ (ג) $\sqrt x$, כש-$x>0$ (ד) $\frac1x$, כש-$x>0$

      (ה) הסבירו בלי לחשב את $f''$ למה $\ln x$ קעורה: מה קורה לשיפוע שלה כש-$x$ גדל?
    answer: >-
      (א) קמורה. (ב) קעורה. (ג) קעורה. (ד) קמורה. (ה) השיפוע $\frac1x$ קטן כש-$x$ גדל, והשיפוע יורד פירושו קעורה.
    solution:
      - kind: idea
        text: >-
          קמורה (פתוחה כלפי מעלה) פירושו $f''>0$, כלומר השיפוע עולה; קעורה (פתוחה כלפי מטה) פירושו $f''<0$, השיפוע
          יורד.
      - kind: computation
        text: >-
          (א) $(e^{-x})''=e^{-x}>0$: קמורה. (ב) $(\ln x)'=\frac1x$ ו-$(\ln x)''=-\frac{1}{x^2}<0$: קעורה. (ג)
          $(\sqrt x)'=\frac{1}{2\sqrt x}$ ו-$(\sqrt x)''=-\frac{1}{4x\sqrt x}<0$: קעורה. (ד) $\left(\frac1x\right)''=\frac{2}{x^3}>0$
          כש-$x>0$: קמורה.
      - kind: step
        text: >-
          (ה) השיפוע של $\ln x$ הוא $\frac1x$: ב-$x=1$ הוא 1, ב-$x=2$ הוא חצי, ב-$x=10$ עשירית. השיפוע יורד לאורך כל התחום,
          וזו בדיוק ההגדרה של קעורה. הגרף ממשיך לעלות, אבל לאט יותר ויותר.
      - kind: check
        text: >-
          גרף קמור נמצא מעל המשיקים שלו. המשיק של $e^{-x}$ ב-0 הוא $y=1-x$, ואכן $e^{-1}\approx0.368>0=1-1$. גרף קעור
          נמצא מתחת: המשיק של $\ln x$ ב-1 הוא $y=x-1$, ו-$\ln2\approx0.693<1$.
      - kind: result
        text: >-
          $e^{-x}$ ו-$\frac1x$ (כש-$x>0$) קמורות; $\ln x$ ו-$\sqrt x$ קעורות.

  - id: W-6.5-04
    level: mid
    objectives: [OBJ-6.5-1, OBJ-6.5-2]
    prompt: >-
      חקרו את $f(x)=\frac{x}{x^2-4}$ ושרטטו את הגרף: תחום, סימטריה, אסימפטוטות (עם הגבולות משני הצדדים), עלייה וירידה,
      קמירות ונקודות פיתול. בדקו את השרטוט בערכים $f(1)$, $f(3)$, $f(1.9)$ ו-$f(2.1)$.
    answer: >-
      תחום $x\ne\pm2$, אי-זוגית. אסימפטוטות $x=\pm2$ ו-$y=0$. יורדת בכל אחד משלושת הקטעים, בלי קיצון. קעורה כש-$x<-2$
      וב-$(0,2)$, קמורה ב-$(-2,0)$ וכש-$x>2$; נקודת פיתול $(0,0)$.
    solution:
      - kind: idea
        text: >-
          הולכים לפי המתכון. $f$ אי-זוגית, ולכן כל מה שנמצא ב-$x>0$ משתקף דרך הראשית. מונה ממעלה 1 ומכנה ממעלה 2:
          אסימפטוטה $y=0$.
      - kind: step
        text: >-
          תחום: $x\ne\pm2$. $f(-x)=\frac{-x}{x^2-4}=-f(x)$: אי-זוגית. $f(x)=0$ רק ב-0.
      - kind: computation
        text: >-
          ליד 2 המונה שואף ל-2. המכנה $(x-2)(x+2)$ חיובי כש-$x\to2^+$ ושלילי כש-$x\to2^-$: $f\to+\infty$ מימין ו-$f\to-\infty$
          משמאל. ליד $x=-2$ המונה שלילי, ולכן להפך: $f\to+\infty$ כש-$x\to-2^+$ ו-$f\to-\infty$ כש-$x\to-2^-$.
      - kind: computation
        text: >-
          בכלל המנה: $f'(x)=\frac{(x^2-4)-x\cdot2x}{(x^2-4)^2}=\frac{-(x^2+4)}{(x^2-4)^2}<0$ בכל התחום. $f$ יורדת בכל אחד
          מהקטעים, ואין קיצון.
      - kind: computation
        text: >-
          גוזרים שוב את $f'(x)=-\frac{x^2+4}{(x^2-4)^2}$ בכלל המנה; הנגזרת של המכנה, בכלל השרשרת, $2(x^2-4)\cdot2x$:
          $f''(x)=-\frac{2x(x^2-4)^2-(x^2+4)\cdot4x(x^2-4)}{(x^2-4)^4}=-\frac{2x(x^2-4)-4x(x^2+4)}{(x^2-4)^3}$ (צמצמנו גורם
          $x^2-4$ אחד). במונה $2x^3-8x-4x^3-16x=-2x^3-24x$, ועם המינוס שלפני השבר
          $f''(x)=\frac{2x(x^2+12)}{(x^2-4)^3}$. $x^2+12>0$, ולכן הסימן הוא הסימן של $x(x^2-4)$: שלילי כש-$x<-2$,
          חיובי ב-$(-2,0)$, שלילי ב-$(0,2)$, חיובי כש-$x>2$. בתוך התחום הסימן מתחלף רק ב-0: נקודת פיתול $(0,0)$.
      - kind: step
        text: >-
          השרטוט: משמאל ל-$x=-2$ הגרף יורד מתחת לציר, מ-0 אל מינוס אינסוף. באמצע הוא יורד מ-$+\infty$ דרך הראשית, שם הוא
          מחליף קמירות, אל מינוס אינסוף. מימין ל-2 הוא יורד מ-$+\infty$ אל 0, מעל הציר.
      - kind: check
        text: >-
          $f(1)=-\frac13$ ו-$f(3)=\frac35$: הענף האמצעי מתחת לציר מימין לראשית, והענף הימני מעליו. $f(1.9)\approx-4.87$
          ו-$f(2.1)\approx5.12$: הקפיצה דרך האסימפטוטה $x=2$, מלמטה למעלה.
      - kind: result
        text: >-
          יורדת בכל קטע, אסימפטוטות $x=\pm2$ ו-$y=0$, נקודת פיתול יחידה בראשית.

  - id: W-6.5-05
    level: mid
    objectives: [OBJ-6.5-3]
    prompt: >-
      בעזרת פיתוחי טיילור סביב 0 תארו את הגרף ליד $x=0$: קיצון (איזה), או אין קיצון. האם מבחן הנגזרת השנייה מכריע?

      (א) $f(x)=\sin x-x\cos x$

      (ב) $g(x)=x^2-\sin^2x$
    answer: >-
      (א) $f(x)=\frac{x^3}{3}+\dots$: אין קיצון, $f$ עולה דרך 0 ומחליפה שם קמירות. (ב) $g(x)=\frac{x^4}{3}+\dots$: מינימום
      מקומי. בשניהם $f''(0)=g''(0)=0$, והמבחן אינו מכריע.
    solution:
      - kind: idea
        text: >-
          מפתחים עד האיבר הראשון שאינו אפס, $cx^k$: $k$ זוגי, קיצון לפי הסימן של $c$; $k$ אי-זוגי, אין קיצון. צריך לפתח
          מספיק רחוק: האיברים הראשונים מתבטלים.
      - kind: computation
        text: >-
          (א) $\sin x=x-\frac{x^3}{6}+\dots$ ו-$x\cos x=x\left(1-\frac{x^2}{2}+\dots\right)=x-\frac{x^3}{2}+\dots$. בהפרש
          $x$ מתבטל, ונשאר $f(x)=\left(-\frac16+\frac12\right)x^3+\dots=\frac{x^3}{3}+\dots$.
      - kind: step
        text: >-
          $k=3$ אי-זוגי ו-$c=\frac13>0$: אין קיצון, $f$ עולה דרך 0 עם משיק אופקי ומחליפה שם קמירות (נקודת פיתול).
      - kind: computation
        text: >-
          (ב) $\sin^2x=\left(x-\frac{x^3}{6}+\dots\right)^2=x^2-2\cdot x\cdot\frac{x^3}{6}+\dots=x^2-\frac{x^4}{3}+\dots$,
          ולכן $g(x)=\frac{x^4}{3}+\dots$: $k=4$ זוגי, $c>0$, מינימום מקומי ב-0.
      - kind: step
        text: >-
          בשתי הפונקציות אין איבר $x^2$, ולכן $f''(0)=g''(0)=0$: מבחן הנגזרת השנייה שותק, והפיתוח מכריע.
      - kind: check
        text: >-
          $f(0.1)\approx0.000333$ ו-$f(-0.1)\approx-0.000333$, קרוב ל-$\frac{0.1^3}{3}$ בגודלו, והסימן מתחלף. $g(\pm0.1)\approx3.33\cdot10^{-5}>0$,
          קרוב ל-$\frac{0.1^4}{3}$.
      - kind: result
        text: >-
          (א) נקודת פיתול עם משיק אופקי, בלי קיצון. (ב) מינימום מקומי.

  - id: W-6.5-06
    level: mid
    qualitative: true
    objectives: [OBJ-6.5-3, OBJ-6.5-1]
    prompt: >-
      נכון או לא נכון? נמקו כל טענה. $f$ פונקציה שאפשר לפתח סביב $a$ (כמו כל הפונקציות האלמנטריות בתחום שלהן).

      (א) אם $f'(a)=f''(a)=0$ ו-$f'''(a)\ne0$, אז אין ל-$f$ קיצון ב-$a$, ו-$(a,f(a))$ נקודת פיתול.

      (ב) אם $f'(a)=f''(a)=f'''(a)=0$ ו-$f^{(4)}(a)<0$, אז ל-$f$ יש מקסימום מקומי ב-$a$.

      (ג) בכל נקודת פיתול המשיק אופקי.

      (ד) לפונקציה שמקיימת $f''>0$ בכל הישר יש לכל היותר נקודת קיצון מקומי אחת.
    answer: >-
      (א) נכון. (ב) נכון. (ג) לא נכון, למשל $x^3-3x$ ב-0. (ד) נכון.
    solution:
      - kind: idea
        text: >-
          האיבר הראשון שאינו אפס בפיתוח של $f(x)-f(a)$ הוא $\frac{f^{(k)}(a)}{k!}(x-a)^k$, עם $k$ הנגזרת הראשונה שאינה
          מתאפסת ב-$a$. ממנו קוראים קיצון ופיתול.
      - kind: step
        text: >-
          (א) נכון. האיבר המוביל $\frac{f'''(a)}{6}(x-a)^3$: $k=3$ אי-זוגי, אין קיצון. הוא מוביל גם אחרי שמחסירים את המשיק
          (שהוא אופקי, כי $f'(a)=0$), ולכן הגרף חוצה את המשיק: נקודת פיתול.
      - kind: step
        text: >-
          (ב) נכון. האיבר המוביל $\frac{f^{(4)}(a)}{24}(x-a)^4$: $k=4$ זוגי, והמקדם שלילי: מקסימום מקומי, למרות ש-$f''(a)=0$.
      - kind: step
        text: >-
          (ג) לא נכון. $f(x)=x^3-3x$: $f''(x)=6x$ מחליפה סימן ב-0, ולכן $(0,0)$ נקודת פיתול, אבל $f'(0)=-3$: המשיק $y=-3x$,
          יורד. משיק אופקי בנקודת פיתול הוא מקרה מיוחד, כמו $x^3$.
      - kind: step
        text: >-
          (ד) נכון. $f''>0$ פירושו ש-$f'$ עולה, ולכן $f'$ מתאפסת לכל היותר פעם אחת. קיצון מקומי של פונקציה גזירה יכול
          להיות רק באפס של $f'$.
      - kind: check
        text: >-
          (א) ו-(ב) עם דוגמאות: $x^3$ (פיתול ב-0, בלי קיצון) ומינוס $x^4$ (מקסימום ב-0). (ד) $e^x$ (אין קיצון) ו-$x^2$
          (קיצון אחד): שתיהן עם $f''>0$.
      - kind: result
        text: >-
          (א), (ב) ו-(ד) נכונות; (ג) לא נכונה.

  - id: W-6.5-07
    level: mid
    qualitative: true
    objectives: [OBJ-6.5-2, OBJ-6.5-1]
    prompt: >-
      סטודנטית חקרה את $f(x)=x+\frac4x$ ומצאה מקסימום מקומי ב-$x=-2$ בגובה $f(-2)=-4$, ומינימום מקומי ב-$x=2$ בגובה
      $f(2)=4$. היא כתבה: "יש לי טעות, כי המקסימום קטן מהמינימום."

      (א) האם יש טעות? בדקו בערכים סמוכים: $f(\pm1)$ ו-$f(\pm4)$.

      (ב) מצאו את האסימפטוטות, ותארו את הגרף.
    answer: >-
      (א) אין טעות: $f(-1)=f(-4)=-5<-4$ ו-$f(1)=f(4)=5>4$. המקסימום והמינימום על ענפים שונים, משני צדי האסימפטוטה
      $x=0$. (ב) $x=0$ ו-$y=x$.
    solution:
      - kind: idea
        text: >-
          מקסימום מקומי פירושו "גדול מהשכנים", לא "גדול מכל הערכים". כשיש אסימפטוטה אנכית ביניהם, מקסימום מקומי יכול
          להיות קטן ממינימום מקומי. בודקים בערכים.
      - kind: computation
        text: >-
          $f'(x)=1-\frac{4}{x^2}=\frac{(x-2)(x+2)}{x^2}$: חיובית כש-$|x|>2$, שלילית כש-$0<|x|<2$. ב-$x=-2$ עלייה מתחלפת
          בירידה (מקסימום), וב-2 ירידה בעלייה (מינימום). $f''(x)=\frac{8}{x^3}$: שלילית משמאל ל-0 (קעורה), חיובית מימין
          (קמורה).
      - kind: check
        text: >-
          (א) $f(-1)=-1-4=-5$ ו-$f(-4)=-4-1=-5$, שניהם קטנים מ-$f(-2)=-4$: מקסימום מקומי. $f(1)=5$ ו-$f(4)=5$, גדולים
          מ-$f(2)=4$: מינימום מקומי. החקירה נכונה.
      - kind: step
        text: >-
          (ב) $x=0$ אינו בתחום, ו-$\frac4x\to\pm\infty$ שם: אסימפטוטה אנכית. $f(x)-x=\frac4x\to0$: אסימפטוטה משופעת
          $y=x$, עם הגרף מעליה כש-$x>0$ ומתחתיה כש-$x<0$.
      - kind: step
        text: >-
          הגרף: ענף ימני קמור, קערה עם תחתית ב-$(2,4)$ בין הציר $x=0$ לבין הישר $y=x$; וענף שמאלי, השיקוף שלו דרך
          הראשית (הפונקציה אי-זוגית), כיפה עם פסגה ב-$(-2,-4)$.
      - kind: result
        text: >-
          אין טעות: מקסימום מקומי $(-2,-4)$ ומינימום מקומי $(2,4)$ על שני ענפים נפרדים; אסימפטוטות $x=0$ ו-$y=x$.

  - id: W-6.5-08
    level: exam
    objectives: [OBJ-6.5-1, OBJ-6.5-2]
    prompt: >-
      $f(x)=\frac{\ln x}{x}$.

      (א) חקרו את $f$: תחום, חיתוך עם הצירים, אסימפטוטות, עלייה וירידה, קיצון, קמירות ונקודות פיתול. שרטטו.

      (ב) היעזרו בתוצאה כדי להכריע בלי מחשבון: מה גדול יותר, $e^\pi$ או $\pi^e$?
    answer: >-
      (א) $x>0$; חיתוך $(1,0)$; $x=0$ ו-$y=0$; עולה ב-$(0,e]$, יורדת אחר כך; מקסימום $\left(e,\frac1e\right)$; קעורה כש-$x<e^{3/2}$,
      קמורה אחר כך, נקודת פיתול $\left(e^{3/2},\frac{3}{2e^{3/2}}\right)\approx(4.48,0.335)$. (ב) $e^\pi>\pi^e$.
    solution:
      - kind: idea
        text: >-
          מתכון החקירה, עם שני גבולות משיעור 4.3: $\ln x\to-\infty$ כש-$x\to0^+$, והלוגריתם גדל לאט מכל חזקה. ב-(ב)
          משווים לוגריתמים, וזה בדיוק השוואה של ערכי $f$.
      - kind: step
        text: >-
          תחום: $x>0$. $f(x)=0$ כש-$\ln x=0$, כלומר $x=1$. כש-$x\to0^+$ המונה שואף למינוס אינסוף והמכנה ל-0 מצד החיוביים:
          $f\to-\infty$, אסימפטוטה אנכית $x=0$. כש-$x\to\infty$, $f\to0$: אסימפטוטה אופקית $y=0$, והגרף מעליה (כש-$x>1$,
          $f>0$).
      - kind: computation
        text: >-
          $f'(x)=\frac{\frac1x\cdot x-\ln x}{x^2}=\frac{1-\ln x}{x^2}$: חיובית כש-$\ln x<1$, כלומר $x<e$, ושלילית כש-$x>e$.
          מקסימום (מוחלט) $f(e)=\frac1e\approx0.368$.
      - kind: computation
        text: >-
          $f'(x)=(1-\ln x)x^{-2}$, ובכלל המכפלה $f''(x)=-\frac1x\cdot x^{-2}+(1-\ln x)\cdot(-2x^{-3})=\frac{2\ln x-3}{x^3}$.
          הסימן הוא הסימן של $2\ln x-3$: שלילי כש-$x<e^{3/2}\approx4.48$ (קעורה), חיובי אחר כך (קמורה). נקודת פיתול
          ב-$x=e^{3/2}$, עם $f=\frac{3/2}{e^{3/2}}\approx0.335$.
      - kind: step
        text: >-
          השרטוט: עולה מתוך מינוס אינסוף ליד הציר האנכי, חוצה את ציר $x$ ב-1, מגיע לפסגה ב-$(e,0.368)$, יורד, ואחרי
          $x\approx4.48$ מתעקם כלפי מעלה ונשכב על הציר מלמעלה.
      - kind: computation
        text: >-
          (ב) $e<3<\pi$, ו-$f$ יורדת כש-$x>e$, ולכן $f(\pi)<f(e)$: $\frac{\ln\pi}{\pi}<\frac1e$. כופלים ב-$e\pi>0$: $e\ln\pi<\pi$,
          כלומר $\ln\left(\pi^e\right)<\ln\left(e^\pi\right)$. $\ln$ עולה, ולכן $\pi^e<e^\pi$.
      - kind: check
        text: >-
          $f(10)=\frac{\ln10}{10}\approx0.230$: אחרי הפיתול, בין 0 לבין $f(e^{3/2})\approx0.335$. ✓ ובמחשבון:
          $e^\pi\approx23.14$ ו-$\pi^e\approx22.46$. ✓
      - kind: result
        text: >-
          מקסימום $\left(e,\frac1e\right)$, נקודת פיתול ב-$x=e^{3/2}$, אסימפטוטות $x=0$ ו-$y=0$; ו-$e^\pi>\pi^e$.

  - id: W-6.5-09
    level: exam
    objectives: [OBJ-6.5-1, OBJ-6.5-3]
    prompt: >-
      $f(x)=\sqrt{x^2+2x}$.

      (א) מצאו את התחום, את תחומי העלייה והירידה ואת הקמירות.

      (ב) מצאו את האסימפטוטות כש-$x\to\infty$ וכש-$x\to-\infty$ בעזרת הטור הבינומי של $\sqrt{1+t}$, וקבעו מאיזה צד שלהן
      נמצא הגרף.
    answer: >-
      (א) $x\le-2$ או $x\ge0$; יורדת כש-$x\le-2$, עולה כש-$x\ge0$; קעורה בשני הענפים. (ב) $y=x+1$ כש-$x\to\infty$ ו-$y=-x-1$
      כש-$x\to-\infty$, והגרף מתחת לשתיהן.
    solution:
      - kind: idea
        text: >-
          מתחת לשורש צריך ביטוי אי-שלילי. באינסוף מוציאים את $|x|$ מהשורש ומפתחים את $\sqrt{1+t}$ עם $t=\frac2x\to0$: האיבר
          הקבוע נותן את האסימפטוטה, והאיבר הבא את הצד.
      - kind: step
        text: >-
          (א) $x^2+2x=x(x+2)\ge0$ כש-$x\le-2$ או $x\ge0$. בקצוות $f(-2)=f(0)=0$, וזה הערך הקטן ביותר של שורש: מינימום
          מוחלט בשני הקצוות.
      - kind: computation
        text: >-
          בכלל השרשרת $f'(x)=\frac{2x+2}{2\sqrt{x^2+2x}}=\frac{x+1}{\sqrt{x^2+2x}}$: חיובית כש-$x>0$ (עולה), שלילית כש-$x<-2$
          (יורדת). כשמתקרבים לקצוות המכנה שואף ל-0 והשיפוע גדל בלי גבול בערכו המוחלט: הגרף יוצא מ-$(0,0)$ ומ-$(-2,0)$ במשיק אנכי.
      - kind: computation
        text: >-
          $f'(x)=(x+1)(x^2+2x)^{-1/2}$, ובכלל המכפלה
          $f''(x)=(x^2+2x)^{-1/2}-(x+1)^2(x^2+2x)^{-3/2}=\frac{(x^2+2x)-(x+1)^2}{(x^2+2x)^{3/2}}=\frac{-1}{(x^2+2x)^{3/2}}<0$:
          קעורה בשני הענפים.
      - kind: computation
        text: >-
          (ב) $\sqrt{x^2+2x}=|x|\sqrt{1+t}$ עם $t=\frac2x$, ו-$\sqrt{1+t}=1+\frac t2-\frac{t^2}{8}+\dots$. כש-$x>0$:
          $x\left(1+\frac1x-\frac{1}{2x^2}+\dots\right)=x+1-\frac{1}{2x}+\dots$, ולכן האסימפטוטה $y=x+1$ והגרף מתחתיה.
      - kind: computation
        text: >-
          כש-$x<0$, $|x|=-x$, ולכן $f(x)=-x\left(1+\frac1x-\frac{1}{2x^2}+\dots\right)=-x-1+\frac{1}{2x}+\dots$. האסימפטוטה $y=-x-1$, ו-$\frac{1}{2x}<0$:
          שוב מתחת.
      - kind: check
        text: >-
          $f(10)=\sqrt{120}\approx10.954$, מתחת ל-11 בכ-$0.046$, קרוב ל-$\frac{1}{20}$. $f(-10)=\sqrt{80}\approx8.944$, מתחת
          ל-9. ותמונה: $y^2=x^2+2x$ פירושו $(x+1)^2-y^2=1$, החצי העליון של היפרבולה שהאסימפטוטות שלה $y=\pm(x+1)$.
      - kind: result
        text: >-
          תחום $x\le-2$ או $x\ge0$; יורדת משמאל ועולה מימין, קעורה; אסימפטוטות $y=x+1$ ו-$y=-x-1$, הגרף מתחתן.

  - id: W-6.5-10
    level: exam
    objectives: [OBJ-6.5-2, OBJ-6.5-3]
    prompt: >-
      גוף נע לאורך קו, $r>0$, באנרגיה פוטנציאלית $U(r)=\frac{1}{r^2}-\frac2r$ (ביחידות נוחות; זו "האנרגיה הפוטנציאלית
      האפקטיבית" של כוכב לכת סביב שמש).

      (א) חקרו את $U$ ושרטטו: אסימפטוטות, אפס, קיצון, קמירות ונקודת פיתול.

      (ב) פתחו את $U$ סביב נקודת המינימום עד האיבר המוביל. האם שיווי המשקל יציב? מהי התדירות הזוויתית של תנודות קטנות
      של גוף במסה $m$?

      (ג) הכוח הוא $F=-U'(r)$. לאילו ערכים של האנרגיה הכוללת $E$ הגוף נשאר כלוא בין שני מרחקים?
    answer: >-
      (א) $r=0$ ו-$y=0$; אפס ב-$r=\frac12$; מינימום $(1,-1)$; קמורה כש-$r<\frac32$, קעורה אחר כך, פיתול
      $\left(\frac32,-\frac89\right)$. (ב) $U=-1+(r-1)^2+\dots$, יציב, $\omega=\sqrt{\frac2m}$. (ג) כש-$E$ בין מינוס 1 ל-0.
    solution:
      - kind: idea
        text: >-
          מתכון החקירה, ואחריו הקריאה הפיזיקלית: מינימום של $U$ הוא שיווי משקל יציב, האיבר המוביל סביבו קובע את
          הקפיץ, וקו אופקי בגובה $E$ חותך את הגרף בנקודות שבהן הגוף נעצר ומסתובב.
      - kind: step
        text: >-
          (א) $U(r)=\frac{1-2r}{r^2}$: אפס ב-$r=\frac12$. כש-$r\to0^+$ המונה שואף ל-1 והמכנה ל-0 מצד החיוביים:
          $U\to+\infty$, אסימפטוטה $r=0$. כש-$r\to\infty$, $U\to0$, ומתחת לציר, כי האיבר $\frac2r$ גדול מ-$\frac{1}{r^2}$ כש-$r>\frac12$.
      - kind: computation
        text: >-
          $U'(r)=-\frac{2}{r^3}+\frac{2}{r^2}=\frac{2(r-1)}{r^3}$: שלילית כש-$r<1$, חיובית כש-$r>1$. מינימום $U(1)=1-2=-1$.
          $U''(r)=\frac{6}{r^4}-\frac{4}{r^3}=\frac{2(3-2r)}{r^4}$: חיובית כש-$r<\frac32$ (קמורה), שלילית אחר כך (קעורה).
          נקודת פיתול $U\left(\frac32\right)=\frac49-\frac43=-\frac89$.
      - kind: computation
        text: >-
          (ב) $U'(1)=0$ ו-$U''(1)=2$, ולכן $U(r)=-1+\frac{2}{2}(r-1)^2+\dots=-1+(r-1)^2+\dots$: $k=2$ ומקדם חיובי, מינימום,
          שיווי משקל יציב. הכוח ליד 1 הוא $F\approx-2(r-1)$, קפיץ עם קבוע $U''(1)=2$, ולכן $\omega=\sqrt{\frac{2}{m}}$.
      - kind: step
        text: >-
          (ג) האנרגיה הקינטית $E-U(r)$ אינה שלילית, ולכן הגוף נמצא רק היכן ש-$U(r)\le E$. כש-$E$ בין מינוס 1 ל-0, הקו $y=E$ חותך את
          הגרף בשתי נקודות, משני צדי המינימום, והגוף כלוא ביניהן. כש-$E\ge0$ אין חיתוך מימין (הגרף מתחת ל-0 לכל
          $r>\frac12$), והגוף מתרחק בלי גבול. ($E=-1$: הגוף נח במינימום.)
      - kind: check
        text: >-
          $U(2)=\frac14-1=-\frac34$ ו-$U(3)=\frac19-\frac23=-\frac59$: מעל המינימום, עולים לכיוון 0. ✓ והפיתוח: ב-$r=1.1$,
          $U\approx-0.9917$, ו-$U(1)+0.1^2=-0.99$. ✓
      - kind: result
        text: >-
          מינימום $(1,-1)$, פיתול $\left(\frac32,-\frac89\right)$; שיווי משקל יציב עם $\omega=\sqrt{2/m}$; תנועה כלואה כש-$E$ בין מינוס 1 ל-0.

challenge:
  - id: W-6.5-c1
    stars: 1
    objectives: [OBJ-6.5-1]
    prompt: >-
      $f$ פולינום ממעלה 3 שמקיים $f'(1)=0$ ו-$f'(3)=0$. קבעו אם כל טענה נכונה, ונמקו.

      (א) $f(x)=0$ לאיזשהו $x$ בקטע $[1,3]$.

      (ב) $f''(x)=0$ לאיזשהו $x$ בקטע $[1,3]$.

      (ג) ב-$x=3$ אין ל-$f$ מקסימום מוחלט (על כל הישר).

      בשתי הטענות הבאות $f$ פולינום כלשהו ממעלה 3, בלי התנאים על $f'$:

      (ד) אם ל-$f$ שלושה שורשים, יש לה נקודת פיתול אחת בדיוק.

      (ה) אם ל-$f$ נקודת פיתול אחת, יש לה שלושה שורשים ממשיים.
    answer: >-
      (א) לא נכון. (ב) נכון, ב-$x=2$. (ג) נכון. (ד) נכון. (ה) לא נכון.
    solution:
      - kind: idea
        text: >-
          $f'$ היא פולינום ממעלה 2, ושני השורשים שלה ידועים, ולכן $f'(x)=a(x-1)(x-3)$ עם $a\ne0$. מזה יוצאת $f''$, וכל
          השאר הוא קריאה של טבלאות סימנים. טענה כללית מפריכים בדוגמה אחת.
      - kind: computation
        text: >-
          $f''(x)=a\bigl((x-3)+(x-1)\bigr)=2a(x-2)$.
      - kind: step
        text: >-
          (א) לא נכון. דוגמה: $f(x)=x^3-6x^2+9x+1$, ש-$f'(x)=3x^2-12x+9=3(x-1)(x-3)$. ב-$[1,3]$ $f'\le0$, ולכן $f$ יורדת
          מ-$f(1)=5$ ל-$f(3)=1$: כל הערכים בקטע לפחות 1, ואין שם שורש.
      - kind: step
        text: >-
          (ב) נכון. $f''(2)=0$, ו-2 בקטע. יותר מזה: $f''$ ליניארית ומחליפה סימן ב-2, ולכן $(2,f(2))$ נקודת פיתול, באמצע
          בין שתי הנקודות הקריטיות.
      - kind: step
        text: >-
          (ג) נכון. לפולינום ממעלה 3 אין מקסימום מוחלט בכלל: האיבר המוביל $px^3$ גובר על השאר כש-$|x|$ גדול, ולכן $f$ גדלה
          בלי גבול בכיוון אחד. ב-3 יכול להיות מקסימום **מקומי** (כש-$a<0$), אבל לא מוחלט.
      - kind: step
        text: >-
          (ד) נכון, ולא בגלל השורשים: לכל פולינום $px^3+qx^2+rx+s$ עם $p\ne0$, $f''(x)=6px+2q$ היא ליניארית ולא קבועה, ולכן
          מתאפסת בדיוק פעם אחת ומחליפה שם סימן. לכל פולינום ממעלה 3 יש בדיוק נקודת פיתול אחת.
      - kind: step
        text: >-
          (ה) לא נכון. $f(x)=x^3+1$: נקודת פיתול ב-0, אבל $f$ עולה בכל הישר ($f'(x)=3x^2\ge0$, ומתאפסת רק ב-0), ולכן יש לה
          שורש ממשי אחד בלבד, $x=-1$.
      - kind: check
        text: >-
          לדוגמה של (א) יש שורש ממשי אחד בלבד, בערך מינוס $0.104$, מחוץ ל-$[1,3]$. ו-(ב) מתאים לסימטריה של פולינום ממעלה 3
          סביב נקודת הפיתול: 2 הוא האמצע בין 1 ל-3.
      - kind: result
        text: >-
          (ב), (ג) ו-(ד) נכונות; (א) ו-(ה) לא נכונות.
    source:
      name: 'G. Strang, E. Herman, Calculus Volume 1 (OpenStax)'
      year: 2016
      problem: 'Section 4.5 (Derivatives and the Shape of a Graph), exercises 246 to 250'
      url: https://openstax.org/books/calculus-volume-1/pages/4-5-derivatives-and-the-shape-of-a-graph
      verified: '2026-11-27'
      adapted: true

  - id: W-6.5-c2
    stars: 1
    objectives: [OBJ-6.5-1]
    prompt: >-
      הוכיחו שכל נקודות הפיתול של הגרף $y=x\sin x$ נמצאות על העקום $y^2\left(4+x^2\right)=4x^2$. הראו גם שבכל נקודה
      שבה $y''=0$ הקמירות באמת מתחלפת.
    answer: >-
      $y''=2\cos x-x\sin x$. בנקודה שבה $y''=0$: $y=x\sin x=2\cos x$ ו-$\sin x=\frac{2\cos x}{x}$; מ-$\sin^2x+\cos^2x=1$
      יוצא $\cos^2x\left(4+x^2\right)=x^2$, וכפל ב-4 נותן את משוואת העקום. הקמירות מתחלפת כי $y'''\ne0$ שם.
    solution:
      - kind: idea
        text: >-
          גוזרים פעמיים ומשתמשים במשוואה $y''=0$ פעמיים: פעם כדי לבטא את $y$ בעזרת $\cos x$ בלבד, ופעם כדי לבטא את
          $\sin x$ בעזרת $\cos x$. הזהות $\sin^2x+\cos^2x=1$ מעלימה את הפונקציות הטריגונומטריות.
      - kind: computation
        text: >-
          $y'=\sin x+x\cos x$, ו-$y''=\cos x+\cos x-x\sin x=2\cos x-x\sin x$.
      - kind: step
        text: >-
          בנקודה שבה $y''=0$: $x\sin x=2\cos x$. שם $\cos x\ne0$: אחרת גם $x\sin x=0$, כלומר $x=0$ או $\sin x=0$, ושניהם
          סותרים את $\cos x=0$. ו-$x\ne0$, כי $y''(0)=2$.
      - kind: computation
        text: >-
          לכן בנקודה כזו $y=x\sin x=2\cos x$, כלומר $y^2=4\cos^2x$, וגם $\sin x=\frac{2\cos x}{x}$. מציבים בזהות:
          $\frac{4\cos^2x}{x^2}+\cos^2x=1$, ואחרי כפל ב-$x^2$: $\cos^2x\left(4+x^2\right)=x^2$.
      - kind: computation
        text: >-
          כופלים ב-4: $4\cos^2x\left(4+x^2\right)=4x^2$, כלומר $y^2\left(4+x^2\right)=4x^2$.
      - kind: step
        text: >-
          החלפת הסימן: $y'''=-2\sin x+\bigl(-\sin x-x\cos x\bigr)=-3\sin x-x\cos x$. בנקודה שבה $y''=0$ מציבים
          $\sin x=\frac{2\cos x}{x}$ ומקבלים $y'''=-\frac{6\cos x}{x}-x\cos x=-\frac{\cos x\left(6+x^2\right)}{x}$. הביטוי
          הזה מתאפס רק כש-$\cos x=0$, שכבר נשלל. לכן $y'''\ne0$, והאיבר המוביל של $y''$ סביב הנקודה הוא $y'''(a)(x-a)$: מסדר 1, ומחליף סימן.
      - kind: check
        text: >-
          נקודת הפיתול הראשונה (מחושבת) בערך $x\approx1.0769$, $y\approx0.9482$, ו-$0.9482^2\cdot(4+1.0769^2)\approx4.6386\approx4\cdot1.0769^2$.
          ✓ הגרף זוגי ($x\sin x$ זוגית), וגם העקום סימטרי לציר $y$.
      - kind: result
        text: >-
          כל נקודות הפיתול של $y=x\sin x$ מקיימות $y^2\left(4+x^2\right)=4x^2$, ובכל אפס של $y''$ הקמירות מתחלפת.
