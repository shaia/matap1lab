# Workbook of lesson 6.1 — higher derivatives and the Taylor polynomial.
# Objectives (src/course.ts):
#   OBJ-6.1-1  higher derivatives, a formula for the n-th derivative of simple functions
#   OBJ-6.1-2  the Taylor polynomial about a point; a polynomial is its own Taylor polynomial
#   OBJ-6.1-3  orders 1 and 2 geometrically: the tangent line and the osculating parabola
# No remainder (6.2), no series theory (6.3–6.4), no L'Hôpital. Chapter 5 is used through reminders.
# Every number recomputed with sympy in screens/tools/lesson-6-1.py.
lesson: '6.1'
practice:
  - id: W-6.1-01
    level: basic
    objectives: [OBJ-6.1-1]
    prompt: >-
      תהי $f(x)=\cos(2x)$.

      (א) מצאו נוסחה ל-$f^{(n)}(x)$, לפי מה שנשאר מ-$n$ בחלוקה ב-4.

      (ב) חשבו את $f^{(10)}(0)$ ואת $f^{(9)}(0)$.
    answer: >-
      (א) כש-$n=4m$, $f^{(n)}(x)=2^n\cos2x$; כש-$n=4m+1$, $f^{(n)}(x)=-2^n\sin2x$; כש-$n=4m+2$, $f^{(n)}(x)=-2^n\cos2x$;
      כש-$n=4m+3$, $f^{(n)}(x)=2^n\sin2x$. (ב) $f^{(10)}(0)=-1024$, $f^{(9)}(0)=0$.
    solution:
      - kind: idea
        text: >-
          שני דברים קורים בכל גזירה: כלל השרשרת מוסיף גורם 2 (הנגזרת של $2x$), והקוסינוס מתקדם צעד אחד במחזור
          $\cos\to-\sin\to-\cos\to\sin\to\cos$.
      - kind: computation
        text: >-
          $f'=-2\sin2x$, $f''=-4\cos2x$, $f'''=8\sin2x$, $f^{(4)}=16\cos2x$. אחרי ארבע גזירות חזרנו לקוסינוס, עם הגורם
          $2^4$.
      - kind: step
        text: >-
          (א) לכן $f^{(n)}(x)=2^n\cdot g(2x)$, כש-$g$ היא הנגזרת מסדר $n$ של הפונקציה $\cos$ (גוזרים את $\cos$ $n$
          פעמים, ובתוצאה מציבים $2x$). את $g$ קובע מה שנשאר מ-$n$ בחלוקה ב-4: כשנשאר 0, $g=\cos$; כשנשאר 1, $g=-\sin$;
          כשנשאר 2, $g=-\cos$; כשנשאר 3, $g=\sin$.
      - kind: computation
        text: >-
          (ב) $10=2\cdot4+2$, נשאר 2: $f^{(10)}(x)=-2^{10}\cos2x$, ו-$f^{(10)}(0)=-1024$. $9=2\cdot4+1$, נשאר 1:
          $f^{(9)}(x)=-2^9\sin2x$, ו-$f^{(9)}(0)=0$.
      - kind: check
        text: >-
          הנוסחה ב-$n=2$ נותנת $f''=-4\cos2x$, כמו בגזירה הישירה. וכל הנגזרות מסדר אי-זוגי הן $\pm2^n\sin2x$, שמתאפסות ב-0,
          כמו $f^{(9)}(0)$.
      - kind: result
        text: >-
          $f^{(n)}(x)=\pm2^n\cos2x$ או $\pm2^n\sin2x$ לפי מה שנשאר מ-$n$ בחלוקה ב-4; $f^{(10)}(0)=-1024$ ו-$f^{(9)}(0)=0$.

  - id: W-6.1-02
    level: basic
    objectives: [OBJ-6.1-2]
    prompt: >-
      (א) כתבו את פולינום טיילור מסדר 3 של $f(x)=e^{-x}$ סביב $x_0=0$.

      (ב) קרבו בעזרתו את $e^{-0.1}$, והשוו לערך במחשבון.
    answer: >-
      (א) $T_3(x)=1-x+\frac{x^2}{2}-\frac{x^3}{6}$. (ב) $T_3(0.1)\approx0.9048333$; במחשבון $e^{-0.1}\approx0.9048374$,
      והשגיאה בערך $4\cdot10^{-6}$.
    solution:
      - kind: idea
        text: >-
          טבלת נגזרות: כל גזירה של $e^{-x}$ מוסיפה גורם $(-1)$ (כלל השרשרת), ולכן $f^{(k)}(x)=(-1)^ke^{-x}$ ו-$f^{(k)}(0)=(-1)^k$.
      - kind: computation
        text: >-
          המקדמים $\frac{f^{(k)}(0)}{k!}$ ל-$k=0,1,2,3$: $1,\ -1,\ \frac12,\ -\frac16$.
      - kind: step
        text: >-
          (א) $T_3(x)=1-x+\frac{x^2}{2}-\frac{x^3}{6}$.
      - kind: computation
        text: >-
          (ב) $T_3(0.1)=1-0.1+0.005-0.0001\overline{6}\approx0.9048333$.
      - kind: check
        text: >-
          במחשבון $e^{-0.1}\approx0.9048374$; ההפרש בערך $0.0000041$, וזה בערך האיבר הבא, $\frac{0.1^4}{24}\approx0.0000042$.
          וגם: $T_3$ הוא $T_3$ של $e^x$ עם $(-x)$ במקום $x$, כצפוי.
      - kind: result
        text: >-
          $T_3(x)=1-x+\frac{x^2}{2}-\frac{x^3}{6}$, ו-$e^{-0.1}\approx0.90483$.

  - id: W-6.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-6.1-3]
    prompt: >-
      על פונקציה $f$ ידוע: $f(2)=1$, $f'(2)=3$, $f''(2)=4$.

      (א) כתבו את משוואת הישר המשיק לגרף ב-$x=2$ ואת הפרבולה הצמודה שם.

      (ב) לאיזה כיוון נפתחת הפרבולה? האם ליד 2 הגרף של $f$ מעל המשיק או מתחתיו?

      (ג) העריכו את $f(2.1)$ פעם בעזרת המשיק ופעם בעזרת הפרבולה. איזו הערכה גבוהה יותר, ולמה?
    answer: >-
      (א) $y=1+3(x-2)$ ו-$y=1+3(x-2)+2(x-2)^2$. (ב) כלפי מעלה; הגרף מעל המשיק. (ג) $1.3$ ו-$1.32$; הפרבולה גבוהה יותר,
      כי האיבר $2(x-2)^2$ חיובי.
    solution:
      - kind: idea
        text: >-
          $T_1$ הוא המשיק ו-$T_2$ הוא הפרבולה הצמודה. ההפרש ביניהם הוא $\frac{f''(2)}{2}(x-2)^2$, והסימן של $f''(2)$ קובע
          לאיזה צד של המשיק הגרף נמצא.
      - kind: computation
        text: >-
          (א) $T_1(x)=1+3(x-2)$. המקדם הריבועי $\frac{f''(2)}{2!}=\frac42=2$, ולכן $T_2(x)=1+3(x-2)+2(x-2)^2$.
      - kind: step
        text: >-
          (ב) $f''(2)=4>0$: הפרבולה נפתחת כלפי מעלה. היא מתעקמת כמו הגרף, ולכן ליד 2 הגרף מעל המשיק.
      - kind: computation
        text: >-
          (ג) $T_1(2.1)=1+0.3=1.3$, ו-$T_2(2.1)=1.3+2\cdot0.01=1.32$.
      - kind: check
        text: >-
          ההפרש $0.02$ הוא האיבר הריבועי, חיובי משני הצדדים של 2: גם ב-$x=1.9$, $T_2(1.9)=0.7+0.02=0.72$, מעל
          $T_1(1.9)=0.7$.
      - kind: result
        text: >-
          משיק $y=1+3(x-2)$, פרבולה צמודה $y=1+3(x-2)+2(x-2)^2$ שנפתחת כלפי מעלה; $f(2.1)\approx1.32$, וההערכה במשיק,
          $1.3$, נמוכה ממנה.

  - id: W-6.1-04
    level: mid
    objectives: [OBJ-6.1-1, OBJ-6.1-2]
    prompt: >-
      תהי $f(x)=xe^x$.

      (א) חשבו את $f'$, $f''$ ו-$f'''$, ונחשו נוסחה ל-$f^{(n)}(x)$.

      (ב) בדקו שהנוסחה עם $n+1$ יוצאת מהנוסחה עם $n$ בגזירה אחת נוספת: גזרו את הביטוי שניחשתם ל-$f^{(n)}$. למה זה מספיק
      כדי לסמוך על הניחוש לכל $n$?

      (ג) כתבו את $T_4$ של $f$ סביב 0, ומצאו את $f^{(20)}(0)$.
    answer: >-
      (א) $f^{(n)}(x)=(x+n)e^x$. (ב) $\left((x+n)e^x\right)'=(x+n+1)e^x$, הנוסחה עם $n+1$; מ-$n=1$ מתקדמים כך צעד אחר צעד לכל
      $n$. (ג) $T_4(x)=x+x^2+\frac{x^3}{2}+\frac{x^4}{6}$, ו-$f^{(20)}(0)=20$.
    solution:
      - kind: idea
        text: >-
          כלל המכפלה (שיעור 5.3): $(uv)'=u'v+uv'$. כל גזירה של פולינום כפול $e^x$ נותנת שוב פולינום כפול $e^x$, ורק
          הפולינום משתנה.
      - kind: computation
        text: >-
          (א) $f'=e^x+xe^x=(x+1)e^x$. $f''=e^x+(x+1)e^x=(x+2)e^x$. $f'''=(x+3)e^x$. בכל גזירה המספר שבסוגריים עולה ב-1:
          הניחוש $f^{(n)}(x)=(x+n)e^x$.
      - kind: computation
        text: >-
          (ב) גוזרים את $(x+n)e^x$ פעם אחת, בכלל המכפלה: $1\cdot e^x+(x+n)e^x=(x+n+1)e^x$. זו בדיוק הנוסחה עם $n+1$.
          למה זה מספיק: ב-$n=1$ הנוסחה נכונה (חישבנו ב-(א)), ולכן לפי הבדיקה היא נכונה גם ב-$n=2$, ומשם ב-$n=3$, וכן
          הלאה. זו שרשרת של צעדים, וכל $n$ מגיעים אליו אחרי מספר סופי של צעדים.
      - kind: computation
        text: >-
          (ג) $f^{(k)}(0)=(0+k)e^0=k$. המקדם של $x^k$: $\frac{k}{k!}=\frac{k}{k\cdot(k-1)!}=\frac{1}{(k-1)!}$ כש-$k\ge1$ (כי $k!=k\cdot(k-1)!$), ו-0 כש-$k=0$. לכן
          $T_4(x)=x+x^2+\frac{x^3}{2}+\frac{x^4}{6}$, ו-$f^{(20)}(0)=20$.
      - kind: check
        text: >-
          $T_4$ הוא $x$ כפול $T_3$ של $e^x$, כלומר $x\left(1+x+\frac{x^2}{2}+\frac{x^3}{6}\right)$: הגיוני, כי $f=x\cdot e^x$.
          ובמספר: $T_4(0.1)\approx0.1105167$, ו-$0.1\cdot e^{0.1}\approx0.1105171$.
      - kind: result
        text: >-
          $f^{(n)}(x)=(x+n)e^x$; $T_4(x)=x+x^2+\frac{x^3}{2}+\frac{x^4}{6}$; $f^{(20)}(0)=20$.

  - id: W-6.1-05
    level: mid
    objectives: [OBJ-6.1-2]
    prompt: >-
      (א) כתבו את פולינום טיילור מסדר 2 של $f(x)=\sqrt[3]{x}=x^{1/3}$ סביב $x_0=8$.

      (ב) קרבו בעזרתו את $\sqrt[3]{9}$ ואת $\sqrt[3]{7}$, והשוו לקירוב של המשיק ולמחשבון.
    answer: >-
      (א) $T_2(x)=2+\frac{x-8}{12}-\frac{(x-8)^2}{288}$. (ב) $T_2(9)=\frac{599}{288}\approx2.07986$ (משיק $2.08333$, מחשבון
      $2.08008$); $T_2(7)=\frac{551}{288}\approx1.91319$ (מחשבון $1.91293$).
    solution:
      - kind: idea
        text: >-
          סביב 8, כי שם השורש ידוע בדיוק: $\sqrt[3]{8}=2$. גוזרים כחזקה, מציבים 8, ומחלקים ב-$k!$. נוח לזכור ש-$8^{1/3}=2$,
          ולכן $8^{-2/3}=\frac14$ ו-$8^{-5/3}=\frac{1}{32}$.
      - kind: computation
        text: >-
          $f'(x)=\frac13x^{-2/3}$, ולכן $f'(8)=\frac13\cdot\frac14=\frac{1}{12}$. $f''(x)=-\frac29x^{-5/3}$, ולכן
          $f''(8)=-\frac29\cdot\frac{1}{32}=-\frac{1}{144}$, והמקדם $\frac{-1/144}{2}=-\frac{1}{288}$.
      - kind: step
        text: >-
          (א) $T_2(x)=2+\frac{x-8}{12}-\frac{(x-8)^2}{288}$.
      - kind: computation
        text: >-
          (ב) ב-$x=9$: $x-8=1$, ו-$T_2(9)=2+\frac{1}{12}-\frac{1}{288}=\frac{576+24-1}{288}=\frac{599}{288}\approx2.07986$. ב-$x=7$:
          $x-8=-1$, ו-$T_2(7)=2-\frac{1}{12}-\frac{1}{288}=\frac{551}{288}\approx1.91319$.
      - kind: check
        text: >-
          המשיק נותן $T_1(9)=2+\frac1{12}\approx2.08333$, והמחשבון $\sqrt[3]{9}\approx2.08008$: השגיאה של הפרבולה ($0.00022$) קטנה פי 15 בערך מזו של המשיק ($0.0033$).
          $f''(8)<0$: הגרף מתחת למשיק, ולכן $T_1$ גבוה מדי משני הצדדים, ו-$\sqrt[3]{7}\approx1.91293$ נמוך מ-$T_1(7)\approx1.91667$.
      - kind: result
        text: >-
          $T_2(x)=2+\frac{x-8}{12}-\frac{(x-8)^2}{288}$; $\sqrt[3]{9}\approx2.0799$ ו-$\sqrt[3]{7}\approx1.9132$.

  - id: W-6.1-06
    level: mid
    qualitative: true
    objectives: [OBJ-6.1-2]
    prompt: >-
      (א) כתבו את $x^4$ בחזקות של $x-1$, בעזרת טבלת נגזרות ב-1.

      (ב) נכון או לא נכון: "$x^4$ הוא פולינום, ולכן פולינום הטיילור מסדר 2 שלו סביב 1 שווה ל-$x^4$". נמקו, ומצאו את
      ההפרש בין $x^4$ לבין $T_2$.

      (ג) לאילו $n$ מתקיים $T_n=x^4$?
    answer: >-
      (א) $x^4=1+4(x-1)+6(x-1)^2+4(x-1)^3+(x-1)^4$. (ב) לא נכון: $x^4-T_2(x)=4(x-1)^3+(x-1)^4$. (ג) לכל $n\ge4$.
    solution:
      - kind: idea
        text: >-
          פולינום שווה לפולינום הטיילור שלו מסדר שגדול או שווה למעלה שלו. מסדר נמוך יותר, $T_n$ הוא רק ההתחלה שלו בחזקות של
          $x-x_0$.
      - kind: computation
        text: >-
          (א) הנגזרות ב-1: $p(1)=1$, $p'=4x^3\to4$, $p''=12x^2\to12$, $p'''=24x\to24$, $p^{(4)}=24$. חלקי $k!$: $1,\ 4,\ 6,\ 4,\ 1$.
          לכן $x^4=1+4(x-1)+6(x-1)^2+4(x-1)^3+(x-1)^4$.
      - kind: step
        text: >-
          (ב) לא נכון. "פולינום שווה לפולינום הטיילור של עצמו" נכון רק מסדר 4 והלאה. $T_2(x)=1+4(x-1)+6(x-1)^2$, וההפרש
          הוא שני האיברים האחרונים: $x^4-T_2(x)=4(x-1)^3+(x-1)^4$.
      - kind: check
        text: >-
          $T_2(1.1)=1+0.4+0.06=1.46$, ו-$1.1^4=1.4641$: קרוב ליד 1. אבל $T_2(3)=1+8+24=33$, ו-$3^4=81$. המקדמים
          $1,4,6,4,1$ הם המקדמים הבינומיים: $x^4=\left((x-1)+1\right)^4$.
      - kind: result
        text: >-
          (א) $1+4(x-1)+6(x-1)^2+4(x-1)^3+(x-1)^4$. (ב) לא נכון; ההפרש $4(x-1)^3+(x-1)^4$. (ג) $n\ge4$.

  - id: W-6.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-6.1-3]
    prompt: >-
      תהי $f(x)=x\ln x$ ל-$x>0$.

      (א) מצאו את המשיק ואת הפרבולה הצמודה לגרף ב-$x_0=1$.

      (ב) בלי לחשב ערכים: האם ליד 1 הגרף מעל המשיק או מתחתיו? ואיזה מהקירובים, $T_1$ או $T_2$, צפוי להיות קרוב יותר
      ל-$f$ ליד 1?

      (ג) בדקו את התשובה ל-(ב) ב-$x=1.5$ וב-$x=0.5$.
    answer: >-
      (א) $T_1(x)=x-1$, $T_2(x)=(x-1)+\frac{(x-1)^2}{2}$. (ב) מעל המשיק, כי $f''(1)=1>0$; $T_2$ קרוב יותר. (ג) $f(1.5)\approx0.608$,
      $T_1=0.5$, $T_2=0.625$; $f(0.5)\approx-0.347$, $T_1=-0.5$, $T_2=-0.375$.
    solution:
      - kind: idea
        text: >-
          כלל המכפלה לנגזרות, ואז הסימן של $f''(1)$ קובע לאן הפרבולה נפתחת ולאיזה צד של המשיק נמצא הגרף.
      - kind: computation
        text: >-
          (א) $f(1)=0$. $f'(x)=\ln x+x\cdot\frac1x=\ln x+1$, ולכן $f'(1)=1$. $f''(x)=\frac1x$, ולכן $f''(1)=1$ והמקדם
          $\frac12$. $T_1(x)=x-1$, $T_2(x)=(x-1)+\frac{(x-1)^2}{2}$.
      - kind: step
        text: >-
          (ב) $f''(1)>0$: הפרבולה נפתחת כלפי מעלה, והגרף ליד 1 מעל המשיק. $T_2$ מתאים גם את הנגזרת השנייה, ולכן ליד 1
          הוא צפוי להיות קרוב יותר.
      - kind: computation
        text: >-
          (ג) $f(1.5)=1.5\ln1.5\approx0.6082$; $T_1(1.5)=0.5$, $T_2(1.5)=0.5+0.125=0.625$. $f(0.5)=0.5\ln0.5\approx-0.3466$;
          $T_1(0.5)=-0.5$, $T_2(0.5)=-0.5+0.125=-0.375$.
      - kind: check
        text: >-
          בשתי הנקודות $f>T_1$: הגרף מעל המשיק. השגיאות של $T_2$ ($0.017$ ו-$0.028$) קטנות מאלה של $T_1$ ($0.108$ ו-$0.153$).
      - kind: result
        text: >-
          משיק $y=x-1$, פרבולה צמודה $y=(x-1)+\frac{(x-1)^2}{2}$; הגרף מעל המשיק, ו-$T_2$ קרוב יותר.

  - id: W-6.1-08
    level: exam
    objectives: [OBJ-6.1-1, OBJ-6.1-2]
    prompt: >-
      תהי $f(x)=\frac{1}{1+2x}$, כש-$x\ne-\frac12$.

      (א) מצאו נוסחה ל-$f^{(n)}(x)$, ובדקו אותה ב-$n=1,2$.

      (ב) כתבו את $T_n$ של $f$ סביב 0, לכל $n$, בסימן הסכום.

      (ג) חשבו את $T_3(0.1)$ והשוו ל-$f(0.1)$.

      (ד) חשבו את $T_3(1)$ והשוו ל-$f(1)$. מה ההבדל בין האיברים של $T_3(0.1)$ לאלה של $T_3(1)$?
    answer: >-
      (א) $f^{(n)}(x)=\frac{(-2)^n\,n!}{(1+2x)^{n+1}}$. (ב) $T_n(x)=\sum_{k=0}^{n}(-2)^kx^k$. (ג) $T_3(0.1)=0.832$, $f(0.1)=\frac56\approx0.8333$.
      (ד) $T_3(1)=-5$ ו-$f(1)=\frac13$: ב-$x=1$ האיברים גדלים במקום לקטון.
    solution:
      - kind: idea
        text: >-
          חזקה שלילית, כמו $\frac1x$, ועכשיו גם נגזרת פנימית: כל גזירה מורידה מעריך שלילי וגם מוסיפה גורם 2 מהנגזרת של
          $1+2x$.
      - kind: computation
        text: >-
          (א) $f=(1+2x)^{-1}$. $f'=(-1)\cdot2\,(1+2x)^{-2}$. $f''=(-1)(-2)\cdot2^2\,(1+2x)^{-3}$.
          $f'''=(-1)(-2)(-3)\cdot2^3\,(1+2x)^{-4}$. אחרי $n$ גזירות: $(-1)^nn!\cdot2^n=(-2)^nn!$, ולכן
          $f^{(n)}(x)=\frac{(-2)^n\,n!}{(1+2x)^{n+1}}$.
      - kind: check
        text: >-
          $n=1$: $\frac{-2}{(1+2x)^2}$, שלילי, ואכן $f$ יורדת כש-$x>-\frac12$. $n=2$: $\frac{8}{(1+2x)^3}$, כמו בגזירה
          ישירה של $f'=-2(1+2x)^{-2}$: $(-2)(-2)\cdot2\,(1+2x)^{-3}$.
      - kind: computation
        text: >-
          (ב) $f^{(k)}(0)=(-2)^kk!$, והמקדם $\frac{(-2)^kk!}{k!}=(-2)^k$: העצרת מתבטלת. לכן
          $T_n(x)=\sum_{k=0}^{n}(-2)^kx^k=1-2x+4x^2-8x^3+\dots+(-2)^nx^n$.
      - kind: computation
        text: >-
          (ג) $T_3(0.1)=1-0.2+0.04-0.008=0.832$, ו-$f(0.1)=\frac{1}{1.2}=\frac56\approx0.83333$. ההפרש בערך $0.0013$.
      - kind: computation
        text: >-
          (ד) $T_3(1)=1-2+4-8=-5$, אבל $f(1)=\frac13$. ב-$x=0.1$ כל איבר קטן פי 5 מקודמו ($|-2x|=0.2$), ולכן האיברים
          שהשמטנו זניחים. ב-$x=1$ כל איבר **גדול** פי 2 מקודמו, ושום סדר סופי לא יקרב.
      - kind: result
        text: >-
          $f^{(n)}(x)=\frac{(-2)^nn!}{(1+2x)^{n+1}}$, $T_n(x)=\sum_{k=0}^n(-2)^kx^k$; ב-$0.1$ הקירוב $0.832$ טוב, וב-1 הוא חסר
          ערך. מתי זה קורה בדיוק: שיעור 6.4.

  - id: W-6.1-09
    level: exam
    objectives: [OBJ-6.1-2, OBJ-6.1-3]
    prompt: >-
      האנרגיה הפוטנציאלית של שני אטומים במולקולה, כפונקציה של הסטייה $x$ של המרחק ביניהם מהמרחק הרגיל, מתוארת (ביחידות
      שבהן כל הקבועים הם 1) על ידי $U(x)=e^{-2x}-2e^{-x}$.

      (א) מצאו את נקודת שיווי המשקל, שבה $U'(x)=0$, ואת $U$ בה.

      (ב) כתבו את $T_2$ של $U$ סביב נקודת שיווי המשקל. מהו "קבוע הקפיץ" $k=U''(x_0)$? האם שיווי המשקל יציב?

      (ג) כתבו גם את $T_3$, והשוו את $U$, $T_2$ ו-$T_3$ ב-$x=0.1$ וב-$x=-0.1$. מה מוסיף האיבר מסדר 3?
    answer: >-
      (א) $x_0=0$, $U(0)=-1$. (ב) $T_2(x)=-1+x^2$, $k=2$, יציב. (ג) $T_3(x)=-1+x^2-x^3$; $U(0.1)\approx-0.99094$, $T_2=-0.99$,
      $T_3=-0.991$; $U(-0.1)\approx-0.98894$, $T_3=-0.989$. האיבר $\left(-x^3\right)$ שובר את הסימטריה: למתוח קל יותר מללחוץ.
    solution:
      - kind: idea
        text: >-
          ליד שיווי משקל $U'(x_0)=0$, ולכן $T_2$ הוא פרבולה עם קודקוד בנקודה: האנרגיה של קפיץ. האיבר מסדר 3 הוא התיקון הראשון
          לקפיץ.
      - kind: computation
        text: >-
          (א) $U'(x)=-2e^{-2x}+2e^{-x}=2e^{-x}\left(1-e^{-x}\right)$. הגורם $2e^{-x}$ חיובי תמיד, ולכן $U'=0$ רק כש-$e^{-x}=1$,
          כלומר $x=0$. $U(0)=1-2=-1$.
      - kind: computation
        text: >-
          (ב) $U''(x)=4e^{-2x}-2e^{-x}$, ולכן $U''(0)=2$, והמקדם $\frac22=1$. $T_2(x)=-1+0\cdot x+x^2=-1+x^2$. קבוע הקפיץ
          $k=U''(0)=2>0$: הפרבולה נפתחת כלפי מעלה, האנרגיה מינימלית בשיווי המשקל, והוא יציב.
      - kind: computation
        text: >-
          (ג) $U'''(x)=-8e^{-2x}+2e^{-x}$, ולכן $U'''(0)=-6$ והמקדם $\frac{-6}{3!}=-1$. $T_3(x)=-1+x^2-x^3$.
      - kind: computation
        text: >-
          ב-$x=0.1$: $U\approx-0.990944$, $T_2=-0.99$, $T_3=-0.991$. ב-$x=-0.1$: $U\approx-0.988939$, $T_2=-0.99$,
          $T_3=-0.989$.
      - kind: check
        text: >-
          $T_2$ סימטרי ונותן אותו ערך בשני הצדדים, אבל $U$ לא: למתוח ב-$0.1$ עולה פחות אנרגיה מללחוץ ב-$0.1$. האיבר $\left(-x^3\right)$
          שלילי כש-$x>0$ וחיובי כש-$x<0$, ובדיוק מתקן את זה. $T_3$ קרוב ל-$U$ בשתי הנקודות עד בערך $0.0001$.
      - kind: result
        text: >-
          $x_0=0$, $T_2=-1+x^2$ ($k=2$, יציב), $T_3=-1+x^2-x^3$, והאיבר מסדר 3 מתאר את חוסר הסימטריה בין מתיחה ללחיצה.

  - id: W-6.1-10
    level: exam
    qualitative: true
    objectives: [OBJ-6.1-2, OBJ-6.1-3]
    prompt: >-
      קבעו לכל טענה אם היא נכונה, ונמקו (בנימוק קצר או בדוגמה נגדית). כל הפולינומים הם פולינומי טיילור סביב 0.

      (א) אם $f$ זוגית, כלומר $f(-x)=f(x)$ לכל $x$, אז ב-$T_n$ של $f$ מופיעות רק חזקות זוגיות של $x$.

      (ב) פולינום טיילור מסדר 2 של $f+g$ הוא הסכום של פולינומי טיילור מסדר 2 של $f$ ושל $g$.

      (ג) פולינום טיילור מסדר 2 של $f\cdot g$ הוא המכפלה של פולינומי טיילור מסדר 2 של $f$ ושל $g$.

      (ד) אם ל-$f$ ול-$g$ אותו $T_1$, אז לגרפים שלהן אותו ישר משיק ב-0.
    answer: >-
      (א) נכון. (ב) נכון. (ג) לא נכון: המכפלה ממעלה 4; רק אחרי שמוחקים את החזקות שמעל 2 מקבלים את $T_2$ של המכפלה. (ד) נכון.
    solution:
      - kind: idea
        text: >-
          כל טענה על $T_n$ היא טענה על הערך ועל הנגזרות ב-0, כי המקדם של $x^k$ הוא $\frac{f^{(k)}(0)}{k!}$.
      - kind: step
        text: >-
          (א) נכון. גוזרים את $f(-x)=f(x)$ בכלל השרשרת: $f'(x)=-f'(-x)$, כלומר $f'$ אי-זוגית. באותו אופן הנגזרת של
          אי-זוגית זוגית, ולכן כל הנגזרות מסדר אי-זוגי אי-זוגיות. לפונקציה אי-זוגית $h$: $h(0)=-h(0)$, ולכן $h(0)=0$. כל
          המקדמים של החזקות האי-זוגיות מתאפסים. (כמו $\cos x$: $1-\frac{x^2}{2}+\frac{x^4}{24}$.)
      - kind: step
        text: >-
          (ב) נכון. $(f+g)^{(k)}=f^{(k)}+g^{(k)}$ לכל $k$, ולכן כל מקדם של הסכום הוא סכום המקדמים.
      - kind: computation
        text: >-
          (ג) לא נכון. דוגמה: $f=g$, עם $f(0)=2$, $f'(0)=-3$, $f''(0)=2$, כלומר $T_2$ של $f$ הוא $2-3x+x^2$. ל-$h=f^2$:
          $h(0)=4$; $h'=2ff'$, ולכן $h'(0)=-12$; $h''=2(f')^2+2ff''$, ולכן $h''(0)=18+8=26$ והמקדם 13. $T_2$ של $h$ הוא
          $4-12x+13x^2$. אבל $\left(2-3x+x^2\right)^2=4-12x+13x^2-6x^3+x^4$, ממעלה 4.
      - kind: step
        text: >-
          (ד) נכון. $T_1$ של $f$ הוא $f(0)+f'(0)x$, והגרף שלו הוא המשיק ב-0. אם ה-$T_1$ שווים, $f(0)=g(0)$ ו-$f'(0)=g'(0)$:
          אותה נקודה ואותו שיפוע.
      - kind: check
        text: >-
          ב-(ג), החזקות עד 2 של המכפלה, $4-12x+13x^2$, הן בדיוק $T_2$ של $h$: הכפלה של פולינומי טיילור ואחריה מחיקה של
          החזקות הגבוהות כן עובדת. זה כלי של שיעור 6.3.
      - kind: result
        text: >-
          (א) נכון. (ב) נכון. (ג) לא נכון (נכון רק אחרי מחיקת החזקות שמעל 2). (ד) נכון.

challenge:
  - id: W-6.1-c1
    stars: 1
    objectives: [OBJ-6.1-1, OBJ-6.1-2]
    prompt: >-
      תהי $f(x)=e^{-1/x^2}$ כש-$x\ne0$, ו-$f(0)=0$.

      (א) הראו ש-$f$ רציפה ב-0.

      (ב) חשבו את $f'(0)$ לפי ההגדרה של הנגזרת, כגבול של מנת ההפרשים.

      (ג) חשבו את $f'(x)$ כש-$x\ne0$, והראו ש-$f''(0)=0$.

      (ד) אפשר להמשיך כך ולהראות שכל הנגזרות של $f$ ב-0 הן 0. מה הם כל פולינומי הטיילור של $f$ סביב 0? באילו נקודות
      $T_n(x)=f(x)$?

      רמז: הציבו $t=\frac{1}{h^2}$, והיעזרו בכך ש-$e^t$ גדלה מהר יותר מכל חזקה של $t$ (שיעור 4.3), כלומר
      $t^me^{-t}\to0$ כש-$t\to\infty$.
    answer: >-
      (א) $f(x)\to0=f(0)$. (ב) $f'(0)=0$. (ג) $f'(x)=\frac{2}{x^3}e^{-1/x^2}$, ו-$f''(0)=0$. (ד) $T_n\equiv0$ לכל $n$, ו-$T_n(x)=f(x)$
      רק ב-$x=0$.
    solution:
      - kind: idea
        text: >-
          ליד 0, המעריך $\left(-\frac{1}{x^2}\right)$ הוא מספר שלילי ענק, ו-$e^{-1/x^2}$ קטן יותר מכל חזקה של $x$. לכן כל מנת הפרשים ב-0
          שואפת ל-0, וכל הנגזרות שם מתאפסות. אבל $f$ אינה אפס: הפונקציה כל כך שטוחה ב-0, שפולינום טיילור, שרואה רק את
          הנקודה הזאת, לא רואה אותה בכלל.
      - kind: computation
        text: >-
          (א) כש-$x\to0$, $x^2\to0^+$ ולכן $\frac{1}{x^2}\to+\infty$, המעריך שואף למינוס אינסוף, ו-$e^{-1/x^2}\to0=f(0)$.
      - kind: computation
        text: >-
          (ב) מנת ההפרשים: $\frac{f(h)-f(0)}{h}=\frac{e^{-1/h^2}}{h}$. כש-$h>0$ נציב $t=\frac{1}{h^2}$, כלומר $h=\frac{1}{\sqrt t}$,
          ו-$h\to0^+$ פירושו $t\to\infty$: המנה היא $\sqrt t\,e^{-t}\to0$. כש-$h<0$ המנה היא מינוס אותו ביטוי עם $|h|$, ושואפת
          גם היא ל-0. לכן $f'(0)=0$.
      - kind: computation
        text: >-
          (ג) כש-$x\ne0$, בכלל השרשרת: $\left(-x^{-2}\right)'=2x^{-3}$, ולכן $f'(x)=\frac{2}{x^3}e^{-1/x^2}$. מנת ההפרשים של
          $f'$ ב-0: $\frac{f'(h)-0}{h}=\frac{2}{h^4}e^{-1/h^2}=2t^2e^{-t}\to0$. לכן $f''(0)=0$.
      - kind: step
        text: >-
          (ד) בכל גזירה נוספת (כש-$x\ne0$) מקבלים פולינום ב-$\frac1x$ כפול $e^{-1/x^2}$, ומנת ההפרשים ב-0 היא שוב פולינום
          ב-$\frac1h$ כפול $e^{-1/h^2}$, כלומר צירוף של ביטויים כמו $t^{m/2}e^{-t}$, ששואפים ל-0. לכן $f^{(k)}(0)=0$ לכל $k$,
          כל המקדמים מתאפסים, ו-$T_n(x)=0$ לכל $n$.
      - kind: step
        text: >-
          כש-$x\ne0$, $f(x)=e^{-1/x^2}>0=T_n(x)$. לכן $T_n(x)=f(x)$ רק ב-$x=0$, לכל סדר.
      - kind: check
        text: >-
          $f(1)=e^{-1}\approx0.368$, $f(0.5)=e^{-4}\approx0.018$, ו-$f(0.1)=e^{-100}\approx3.7\cdot10^{-44}$: באמת שטוחה מאוד ליד
          0, ובכל זאת לא אפס. השגיאה של $T_n$ היא כל $f$, וזה מה ששיעור 6.2 יצטרך לחסום.
      - kind: result
        text: >-
          כל הנגזרות של $f$ ב-0 הן 0, כל פולינומי הטיילור שלה סביב 0 הם אפס, והם שווים ל-$f$ רק ב-0: פונקציה שאינה אפס
          יכולה להיות בעלת פולינומי טיילור אפס.
    source:
      name: 'C. Wendl, Calculus II, Spring 2004: Extra Credit Assignment'
      year: 2004
      problem: 'Extra Credit Assignment (the function e^(-1/x^2)); split into parts, hint added'
      url: https://www2.mathematik.hu-berlin.de/~wendl/calc2/extra.pdf
      verified: '2026-11-27'
      adapted: true

  - id: W-6.1-c2
    stars: 2
    objectives: [OBJ-6.1-1, OBJ-6.1-2]
    prompt: >-
      תהי $f(x)=(1-x+x^2)e^x$. הוכיחו שכל מקדם שאינו אפס בפולינומי הטיילור של $f$ סביב 0 הוא מספר רציונלי שהמונה שלו,
      אחרי צמצום מלא, הוא 1 או מספר ראשוני. (המקדם של $x^k$ זהה בכל $T_n$ עם $n\ge k$.)

      רמז: הראו ש-$f^{(n)}(x)=q_n(x)e^x$, כש-$q_n$ פולינום ממעלה 2, ומצאו את $q_n$.
    answer: >-
      $f^{(n)}(x)=\left(x^2+(2n-1)x+(n-1)^2\right)e^x$, ולכן המקדם של $x^n$ הוא $\frac{(n-1)^2}{n!}$. כש-$n\ge2$ הוא
      $\frac{n-1}{n\,(n-2)!}$, ואחרי צמצום המונה הוא $n-1$ כש-$n-1$ ראשוני, 2 כש-$n=5$, ו-1 בכל שאר המקרים.
    solution:
      - kind: idea
        text: >-
          גזירה של $q(x)e^x$ נותנת $\left(q+q'\right)e^x$ (כלל המכפלה), ולכן כל הנגזרות הן פולינום ממעלה 2 כפול $e^x$. מוצאים
          נוסחה ל-$q_n$, מציבים 0, ומחלקים ב-$n!$. את השאלה על המונה פותרים בשיקול של מחלקים.
      - kind: computation
        text: >-
          $q_0=x^2-x+1$, ו-$q_{n+1}=q_n+q_n'$. $q_1=x^2-x+1+2x-1=x^2+x$, $q_2=x^2+x+2x+1=x^2+3x+1$. הניחוש:
          $q_n=x^2+(2n-1)x+(n-1)^2$. צעד: $q_n+q_n'=x^2+(2n-1)x+(n-1)^2+2x+(2n-1)=x^2+(2n+1)x+n^2$, וזו הנוסחה עם $n+1$.
      - kind: computation
        text: >-
          לכן $f^{(n)}(0)=q_n(0)=(n-1)^2$, והמקדם של $x^n$ הוא $c_n=\frac{(n-1)^2}{n!}$: $c_0=1$, $c_1=0$, $c_2=\frac12$. כש-$n\ge2$,
          $n!=n(n-1)(n-2)!$, ולכן $c_n=\frac{n-1}{n\,(n-2)!}$.
      - kind: step
        text: >-
          ל-$n-1$ ול-$n$ אין מחלק משותף גדול מ-1 (מספרים עוקבים). לכן אחרי צמצום המונה הוא $\frac{n-1}{d}$, כש-$d$ הוא המחלק
          המשותף הגדול ביותר של $n-1$ ושל $(n-2)!$.
      - kind: step
        text: >-
          אם $n-1=p$ ראשוני: $(n-2)!=(p-1)!$ היא מכפלה של מספרים קטנים מ-$p$, ואף אחד מהם אינו מתחלק ב-$p$, ולכן $d=1$
          והמונה $p$, ראשוני. אם $n-1=1$: המונה 1.
      - kind: step
        text: >-
          אם $n-1=ab$ פריק עם $1<a<b$: שני הגורמים לכל היותר $n-2$ ושונים, ולכן שניהם בתוך $(n-2)!$, ו-$ab$ מחלק אותו: המונה 1.
          אם $n-1=a^2$ עם $a\ge3$: גם $a$ וגם $2a$ לכל היותר $a^2-1=n-2$ (כי $a^2-2a-1>0$ כש-$a\ge3$), ולכן $2a^2$ מחלק את
          $(n-2)!$: המונה 1. נשאר $n-1=4$, כלומר $n=5$: $c_5=\frac{16}{120}=\frac{2}{15}$, והמונה 2, ראשוני.
      - kind: check
        text: >-
          המקדמים הראשונים: $1,\ 0,\ \frac12,\ \frac23,\ \frac38,\ \frac{2}{15},\ \frac{5}{144},\ \frac{1}{140},\ \frac{7}{5760}$; המונים
          $1,1,2,3,2,5,1,7$. בדיקה מחושבת עד $n=59$ לא מצאה מונה אחר.
      - kind: result
        text: >-
          המקדם של $x^n$ הוא $\frac{(n-1)^2}{n!}$, והמונה שלו אחרי צמצום הוא 1 או ראשוני.
    source:
      name: 'The 75th William Lowell Putnam Mathematical Competition'
      year: 2014
      problem: 'A1 (Taylor series replaced by the coefficients of the Taylor polynomials; hint added)'
      url: https://kskedlaya.org/putnam-archive/2014.pdf
      verified: '2026-11-27'
      adapted: true
