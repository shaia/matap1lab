# Workbook of lesson 6.2 — Taylor's formula with the Lagrange remainder.
# Objectives (src/course.ts):
#   OBJ-6.2-1  write Taylor's formula with the remainder in Lagrange form
#   OBJ-6.2-2  bound the error of a Taylor approximation on a given interval
#   OBJ-6.2-3  choose the order needed for a given accuracy
# The Lagrange form is used without proof; no mean value theorem, no L'Hôpital.
# Every number recomputed with sympy in screens/tools/lesson-6-2.py.
lesson: '6.2'
practice:
  - id: W-6.2-01
    level: basic
    objectives: [OBJ-6.2-1]
    prompt: >-
      כתבו את נוסחת טיילור עם השארית בצורת לגרנז׳:

      (א) ל-$f(x)=e^{2x}$ סביב $x_0=0$, עם $n=3$.

      (ב) ל-$g(x)=\sqrt x$ סביב $x_0=4$, עם $n=1$.

      בדקו כל נוסחה בנקודה אחת: (א) ב-$x=0.1$, (ב) ב-$x=5$.
    answer: >-
      (א) $e^{2x}=1+2x+2x^2+\frac43x^3+\frac23e^{2c}x^4$, $c$ בין 0 ל-$x$. (ב)
      $\sqrt x=2+\frac{x-4}{4}-\frac{(x-4)^2}{8c^{3/2}}$, $c$ בין 4 ל-$x$.
    solution:
      - kind: idea
        text: >-
          גוזרים $n+1$ פעמים. הנגזרות עד הסדר $n$, ב-$x_0$, נותנות את $T_n$; הנגזרת ה-$(n+1)$, בנקודה לא ידועה $c$,
          נותנת את השארית.
      - kind: computation
        text: >-
          (א) בכלל השרשרת כל גזירה של $e^{2x}$ כופלת ב-2: $f^{(k)}(x)=2^ke^{2x}$, וב-0: $2^k$. לכן
          $T_3(x)=1+2x+\frac{4}{2}x^2+\frac{8}{6}x^3=1+2x+2x^2+\frac43x^3$.
      - kind: computation
        text: >-
          השארית: $f^{(4)}(c)=16e^{2c}$, ולכן $R_3(x)=\frac{16e^{2c}}{24}x^4=\frac23e^{2c}x^4$, עם $c$ בין 0 ל-$x$.
      - kind: computation
        text: >-
          (ב) $g'(x)=\frac{1}{2\sqrt x}$ ו-$g''(x)=-\frac{1}{4}x^{-3/2}$. ב-4: $g(4)=2$, $g'(4)=\frac14$. לכן
          $T_1(x)=2+\frac{x-4}{4}$, ו-$R_1(x)=\frac{g''(c)}{2}(x-4)^2=-\frac{(x-4)^2}{8c^{3/2}}$, עם $c$ בין 4 ל-$x$.
      - kind: check
        text: >-
          (א) $e^{0.2}\approx1.2214028$ ו-$T_3(0.1)\approx1.2213333$: הפרש $6.94\cdot10^{-5}$. הנוסחה נותנת
          $\frac23e^{2c}\cdot10^{-4}$ עם $0<c<0.1$, כלומר בין $6.67\cdot10^{-5}$ ל-$8.14\cdot10^{-5}$, וההפרש באמת שם. (ב)
          $\sqrt5\approx2.2360680$ ו-$T_1(5)=2.25$: הפרש $\sqrt5-T_1(5)\approx-0.01393$. הנוסחה נותנת $R_1(5)=-\frac{1}{8c^{3/2}}$ עם $4<c<5$, כלומר
          $R_1(5)\in(-0.015625,\ -0.01118)$, וגם כאן ההפרש בתחום.
      - kind: result
        text: >-
          (א) $e^{2x}=1+2x+2x^2+\frac43x^3+\frac23e^{2c}x^4$. (ב) $\sqrt x=2+\frac{x-4}{4}-\frac{(x-4)^2}{8c^{3/2}}$. בשתיהן
          $c$ בין $x_0$ ל-$x$.

  - id: W-6.2-02
    level: basic
    objectives: [OBJ-6.2-2]
    prompt: >-
      חסמו את השגיאה של הקירוב $\sin x\approx x$ בקטע $|x|\le0.2$ בשתי דרכים: (א) בעזרת $R_1$; (ב) בעזרת $R_2$, כשרואים
      ב-$x$ את $T_2$. איזה חסם טוב יותר, ולמה מותר להשתמש בשני?
    answer: >-
      (א) $\frac{(0.2)^2}{2}=0.02$. (ב) $\frac{(0.2)^3}{6}\approx0.00133$, טוב פי 15 בערך. מותר כי המקדם של $x^2$ בפולינומי
      טיילור של $\sin$ סביב 0 אפס, ולכן $T_1=T_2=x$.
    solution:
      - kind: idea
        text: >-
          החסם $\frac{M}{(n+1)!}\delta^{n+1}$ עם $M=1$ (כל נגזרת של סינוס היא $\pm\sin$ או $\pm\cos$). כשהמקדם הבא אפס, אותו
          פולינום הוא גם $T_{n+1}$, ומותר להשתמש בשארית מהסדר הגבוה יותר.
      - kind: computation
        text: >-
          (א) $R_1(x)=\frac{f''(c)}{2}x^2=-\frac{\sin c}{2}x^2$, ולכן $|R_1(x)|\le\frac{x^2}{2}\le\frac{0.04}{2}=0.02$.
      - kind: step
        text: >-
          (ב) $f''(0)=-\sin0=0$, ולכן $T_2(x)=T_1(x)=x$. מכאן $\sin x-x=R_2(x)=\frac{f'''(c)}{6}x^3=-\frac{\cos c}{6}x^3$.
      - kind: computation
        text: >-
          $|R_2(x)|\le\frac{|x|^3}{6}\le\frac{0.008}{6}\approx0.00133$.
      - kind: check
        text: >-
          $0.2-\sin0.2\approx0.0013307$: מתחת לחסם (ב), וקרוב מאוד אליו. החסם (א) נכון, אבל גדול פי 15 מהשגיאה האמיתית.
      - kind: result
        text: >-
          (א) $0.02$. (ב) $\frac{(0.2)^3}{6}\approx1.33\cdot10^{-3}$, הטוב מבין השניים; מותר כי $T_1=T_2$ לסינוס.

  - id: W-6.2-03
    level: basic
    qualitative: true
    objectives: [OBJ-6.2-1]
    prompt: >-
      הראו בעזרת השארית בצורת לגרנז׳ של $T_1$ ש-$\ln(1+x)\le x$ לכל $x>-1$, עם שוויון רק ב-$x=0$. מה המשמעות בגרף?
    answer: >-
      $\ln(1+x)=x-\frac{x^2}{2(1+c)^2}$, והשארית אף פעם לא חיובית. הגרף של $\ln(1+x)$ נמצא מתחת למשיק שלו ב-0, $y=x$.
    solution:
      - kind: idea
        text: >-
          אי-שוויון בין פונקציה לפולינום טיילור שלה הוא שאלה על הסימן של השארית. אם הסימן של הנגזרת המתאימה ידוע בכל
          מקום, הסימן של השארית ידוע בלי לדעת את $c$.
      - kind: computation
        text: >-
          $f(x)=\ln(1+x)$: $f(0)=0$, $f'(x)=\frac{1}{1+x}$ ו-$f'(0)=1$, ולכן $T_1(x)=x$. $f''(x)=-\frac{1}{(1+x)^2}$, ולכן
          $R_1(x)=-\frac{x^2}{2(1+c)^2}$, עם $c$ בין 0 ל-$x$ (וגם $c>-1$, כי $x>-1$).
      - kind: step
        text: >-
          $x^2\ge0$ ו-$(1+c)^2>0$, ולכן $R_1(x)\le0$, כלומר $\ln(1+x)\le x$. שוויון רק כש-$x^2=0$, כלומר ב-$x=0$.
      - kind: check
        text: >-
          $x=1$: $\ln2\approx0.693<1$. $x=-0.5$: $\ln0.5\approx-0.693<-0.5$. שני הצדדים של 0 מקיימים את האי-שוויון.
      - kind: result
        text: >-
          $\ln(1+x)\le x$ לכל $x>-1$, עם שוויון רק ב-0: הגרף מתחת למשיק $y=x$.

  - id: W-6.2-04
    level: mid
    objectives: [OBJ-6.2-2]
    prompt: >-
      $f(x)=\frac{1}{1+x}$ ו-$T_2(x)=1-x+x^2$ סביב 0.

      (א) חסמו את השגיאה של $T_2$ בקטע $[0,0.1]$.

      (ב) חסמו אותה בקטע $[-0.1,0]$. למה החסם שונה, אף שהמרחק מ-0 זהה?
    answer: >-
      (א) $10^{-3}$. (ב) $\frac{1}{(0.9)^4}\cdot10^{-3}\approx1.52\cdot10^{-3}$: הנגזרת השלישית יורדת, ולכן בצד השמאלי היא
      גדולה יותר.
    solution:
      - kind: idea
        text: >-
          המתכון: $R_2=\frac{f'''(c)}{3!}x^3$, ו-$M$ הוא המקסימום של $|f'''|$ על הקטע עצמו. בכל קטע בודקים מחדש באיזה קצה
          המקסימום.
      - kind: computation
        text: >-
          $f'(x)=-\frac{1}{(1+x)^2}$, $f''(x)=\frac{2}{(1+x)^3}$, $f'''(x)=-\frac{6}{(1+x)^4}$. לכן
          $|R_2(x)|=\frac{1}{(1+c)^4}|x|^3$.
      - kind: computation
        text: >-
          (א) ב-$[0,0.1]$: $\frac{6}{(1+t)^4}$ יורדת, ולכן הכי גדולה ב-$t=0$: $M=6$. $|R_2|\le\frac66(0.1)^3=10^{-3}$.
      - kind: computation
        text: >-
          (ב) ב-$[-0.1,0]$: הכי גדולה בקצה השמאלי, $t=-0.1$: $M=\frac{6}{(0.9)^4}\approx9.145$. $|R_2|\le\frac{9.145}{6}(0.1)^3\approx1.52\cdot10^{-3}$.
          הסיבה: משמאל ל-0 מתקרבים לנקודה $x=-1$, שבה $f$ מתפוצצת, והנגזרות גדלות.
      - kind: check
        text: >-
          בדיוק, $f(x)-T_2(x)=-\frac{x^3}{1+x}$ (פתחו סוגריים: $(1+x)(1-x+x^2)=1+x^3$). ב-$x=0.1$: $R_2(0.1)=-\frac{0.001}{1.1}\approx-9.1\cdot10^{-4}$,
          ובגודל מתחת ל-$10^{-3}$. ב-$x=-0.1$: $\frac{0.001}{0.9}\approx1.11\cdot10^{-3}$, מתחת ל-$1.52\cdot10^{-3}$.
      - kind: result
        text: >-
          (א) $|R_2|\le10^{-3}$. (ב) $|R_2|\le1.52\cdot10^{-3}$, כי שם המקסימום של $|f'''|$ בקצה $t=-0.1$.

  - id: W-6.2-05
    level: mid
    objectives: [OBJ-6.2-3]
    prompt: >-
      רוצים את $\cos1$ בשגיאה קטנה מ-$10^{-5}$ בעזרת פולינום טיילור סביב 0. מה הסדר הקטן ביותר שהשארית בצורת לגרנז׳
      מבטיחה? כתבו את הפולינום וחשבו את הקירוב.
    answer: >-
      $n=8$: $T_8(1)=1-\frac12+\frac1{24}-\frac1{720}+\frac1{40320}\approx0.5403026$.
    solution:
      - kind: idea
        text: >-
          הבעיה ההפוכה: $M=1$ לכל סדר, $\delta=1$, ולכן החסם $\frac{1}{(n+1)!}$. מנסים $n=1,2,\dots$ עד שהוא קטן מ-$10^{-5}$.
      - kind: computation
        text: >-
          $\frac{1}{7!}=\frac{1}{5040}\approx2.0\cdot10^{-4}$ ($n=6$), $\frac{1}{8!}=\frac{1}{40320}\approx2.5\cdot10^{-5}$ ($n=7$), עוד
          גדולים מדי. $\frac{1}{9!}=\frac{1}{362880}\approx2.8\cdot10^{-6}$ ($n=8$): מספיק.
      - kind: step
        text: >-
          שימו לב: $T_7=T_6$ לקוסינוס, ולכן "לדלג" לא עוזר כאן: גם $T_7$ שוגה עד $\frac{1}{8!}$, וזה יותר מ-$10^{-5}$. צריך
          את האיבר $\frac{x^8}{8!}$.
      - kind: computation
        text: >-
          $T_8(1)=1-0.5+0.0416667-0.0013889+0.0000248=0.5403026$ (בעיגול).
      - kind: check
        text: >-
          $\cos1\approx0.5403023$: השגיאה האמיתית בערך $2.7\cdot10^{-7}$, מתחת ל-$10^{-5}$. ו-$T_6(1)$ שוגה ב-$2.5\cdot10^{-5}$: באמת
          לא מספיק.
      - kind: result
        text: >-
          $n=8$, ו-$\cos1\approx0.5403026$.

  - id: W-6.2-06
    level: mid
    qualitative: true
    objectives: [OBJ-6.2-2]
    prompt: >-
      סטודנט חוסם את השגיאה של $e^x\approx1+x+\frac{x^2}{2}$ בקטע $[-2,0]$: "$R_2(x)=\frac{e^c}{6}x^3$, ו-$c$ בין 0 ל-$x$.
      הקצה הרחוק הוא $x=-2$, ולכן אציב $c=-2$: $|R_2|\le\frac{e^{-2}}{6}\cdot8\approx0.18$."

      (א) מצאו את הטעות.

      (ב) תנו חסם נכון, ובדקו אותו ב-$x=-2$.
    answer: >-
      (א) $e^c$ הכי **קטנה** ב-$c=-2$; חסם צריך את הערך הגדול ביותר, ב-$c=0$. (ב) $|R_2|\le\frac{8}{6}=\frac43$; השגיאה ב-$x=-2$
      בערך $0.865$, מעל $0.18$ ומתחת ל-$\frac43$.
    solution:
      - kind: idea
        text: >-
          $c$ יכולה להיות כל נקודה בין 0 ל-$x$, ולכן חסם צריך את המקרה הגרוע ביותר של $e^c$ על כל הקטע, ולא את הערך בקצה
          כלשהו שבחרנו.
      - kind: step
        text: >-
          (א) $e^t$ עולה. בקטע $[-2,0]$ היא הכי קטנה ב-$t=-2$ והכי גדולה ב-0. הסטודנט לקח את הקצה שבו הנגזרת הכי **קטנה**,
          וקיבל מספר קטן מהשגיאה האמיתית: זה לא חסם.
      - kind: computation
        text: >-
          (ב) $M=e^0=1$ ו-$|x|^3\le8$, ולכן $|R_2(x)|\le\frac{8}{6}=\frac43$.
      - kind: check
        text: >-
          ב-$x=-2$: $e^{-2}\approx0.1353$ ו-$T_2(-2)=1-2+2=1$, ולכן השגיאה בערך $0.865$. היא גדולה מ"החסם" $0.18$ של הסטודנט,
          וקטנה מ-$\frac43$.
      - kind: result
        text: >-
          (א) הוא הציב את $c$ בקצה שבו $e^c$ מינימלית. (ב) $|R_2|\le\frac43$ על $[-2,0]$.

  - id: W-6.2-07
    level: mid
    objectives: [OBJ-6.2-3, OBJ-6.2-2]
    prompt: >-
      בסימולציה של מטוטלת מחליפים $\sin\theta$ ב-$\theta-\frac{\theta^3}{6}$.

      (א) עד איזו משרעת $|\theta|$ (ברדיאנים ובמעלות) השארית בצורת לגרנז׳ מבטיחה שגיאה של לכל היותר $10^{-6}$?

      (ב) ואם מחליפים $\sin\theta$ רק ב-$\theta$?
    answer: >-
      (א) $|\theta|\le(1.2\cdot10^{-4})^{1/5}\approx0.164$ רדיאן, בערך $9.4^\circ$. (ב) $|\theta|\le(6\cdot10^{-6})^{1/3}\approx0.0182$
      רדיאן, בערך $1.04^\circ$.
    solution:
      - kind: idea
        text: >-
          כאן הסדר נתון ומחפשים את הקטע: כותבים את החסם כפונקציה של $|\theta|$ ופותרים אי-שוויון. כי המקדמים הזוגיים של
          סינוס אפס, $\theta-\frac{\theta^3}{6}=T_3=T_4$ ו-$\theta=T_1=T_2$.
      - kind: computation
        text: >-
          (א) $|R_4(\theta)|=\frac{|\cos c|}{120}|\theta|^5\le\frac{|\theta|^5}{120}$. הדרישה $\frac{|\theta|^5}{120}\le10^{-6}$ נותנת
          $|\theta|^5\le1.2\cdot10^{-4}$, כלומר $|\theta|\le0.16437$ רדיאן. במעלות: $0.16437\cdot\frac{180}{\pi}\approx9.42^\circ$.
      - kind: computation
        text: >-
          (ב) $|R_2(\theta)|\le\frac{|\theta|^3}{6}\le10^{-6}$ נותן $|\theta|^3\le6\cdot10^{-6}$, כלומר $|\theta|\le0.01817$ רדיאן, בערך
          $1.04^\circ$.
      - kind: check
        text: >-
          ב-$\theta=0.16437$ השגיאה האמיתית של $\theta-\frac{\theta^3}{6}$ (מחושבת) כ-$9.99\cdot10^{-7}$: ממש בגבול, כי האיבר
          הבא של פולינום טיילור, $\frac{\theta^5}{120}$, הוא כמעט כל השגיאה.
      - kind: result
        text: >-
          (א) עד בערך $0.164$ רדיאן ($9.4^\circ$). (ב) רק עד $0.018$ רדיאן ($1.04^\circ$): האיבר הנוסף מרחיב את הטווח פי 9 בערך.

  - id: W-6.2-08
    level: exam
    objectives: [OBJ-6.2-1, OBJ-6.2-2]
    prompt: >-
      (א) כתבו את $T_2$ של $f(x)=(1+x)^{1/3}$ סביב 0 ואת השארית $R_2$ בצורת לגרנז׳.

      (ב) השתמשו בכך ש-$\sqrt[3]{9}=2\sqrt[3]{1+\frac18}$ כדי לקרב את $\sqrt[3]{9}$, וחסמו את השגיאה.

      (ג) האם הקירוב גדול מ-$\sqrt[3]{9}$ או קטן ממנו? נמקו בלי מחשבון.
    answer: >-
      (א) $T_2=1+\frac x3-\frac{x^2}{9}$, $R_2=\frac{5}{81}(1+c)^{-8/3}x^3$. (ב) $\sqrt[3]{9}\approx2.079861$, שגיאה לכל
      היותר $2.41\cdot10^{-4}$. (ג) קטן: השארית חיובית.
    solution:
      - kind: idea
        text: >-
          מוציאים מהשורש את החזקה השלישית הקרובה ($8=2^3$) כדי שמה שנשאר יהיה $1+x$ עם $x$ קטן, ואז המתכון: שארית, $M$ בקטע
          $[0,\frac18]$, חסם. הסימן של $f'''$ קובע את הסימן של השגיאה.
      - kind: computation
        text: >-
          (א) $f'=\frac13(1+x)^{-2/3}$, $f''=-\frac29(1+x)^{-5/3}$, $f'''=\frac{10}{27}(1+x)^{-8/3}$. ב-0: $1,\frac13,-\frac29$, ולכן
          $T_2(x)=1+\frac x3-\frac{x^2}{9}$, ו-$R_2(x)=\frac{10/27}{6}(1+c)^{-8/3}x^3=\frac{5}{81}(1+c)^{-8/3}x^3$.
      - kind: computation
        text: >-
          (ב) $T_2(\frac18)=1+\frac1{24}-\frac1{576}=1.0399306$, ולכן $\sqrt[3]{9}\approx2\cdot1.0399306=2.0798611$.
      - kind: computation
        text: >-
          החסם: $(1+c)^{-8/3}\le1$ כש-$c\ge0$, ולכן $|R_2(\frac18)|\le\frac{5}{81}\cdot\frac{1}{512}\approx1.206\cdot10^{-4}$. השגיאה
          של $\sqrt[3]{9}$ היא פי 2 מזה: לכל היותר $2.41\cdot10^{-4}$.
      - kind: step
        text: >-
          (ג) $f'''>0$ ו-$x^3>0$, ולכן $R_2(\frac18)>0$: $\sqrt[3]{1.125}>T_2(\frac18)$, והקירוב **קטן** מהערך האמיתי.
      - kind: check
        text: >-
          $\sqrt[3]{9}\approx2.0800838$: השגיאה $2.23\cdot10^{-4}$, חיובית ומתחת ל-$2.41\cdot10^{-4}$. ו-$2.0798611^3\approx8.9971<9$.
      - kind: result
        text: >-
          $\sqrt[3]{9}\approx2.07986$, נמוך מהערך האמיתי, בשגיאה של לכל היותר $2.41\cdot10^{-4}$.

  - id: W-6.2-09
    level: exam
    qualitative: true
    objectives: [OBJ-6.2-1, OBJ-6.2-2]
    prompt: >-
      (א) הוכיחו בעזרת השארית בצורת לגרנז׳ שלכל $x\ge0$:
      $$x-\frac{x^2}{2}\le\ln(1+x)\le x-\frac{x^2}{2}+\frac{x^3}{3}.$$

      (ב) הסיקו קטע שמכיל את $\ln1.1$, ושלושה מקומות אחרי הנקודה שבהם $\ln 1.1$ בטוח.

      (ג) מה נותנים אותם אי-שוויונות ל-$\ln2$? מה זה אומר על הדיוק כש-$x$ אינו קטן?
    answer: >-
      (א) $R_2\ge0$ ו-$R_3\le0$ כש-$x\ge0$. (ב) $0.095\le\ln1.1\le0.09534$, כלומר $\ln1.1=0.095\ldots$. (ג)
      $0.5\le\ln2\le0.8\overline{3}$: נכון, אבל רחב מאוד.
    solution:
      - kind: idea
        text: >-
          שני אי-שוויונות הם שני סימנים של שתי שאריות: $\ln(1+x)-T_2(x)=R_2(x)$ ו-$\ln(1+x)-T_3(x)=R_3(x)$. מוצאים את הסימן
          של כל אחת בעזרת הסימן של הנגזרת המתאימה.
      - kind: computation
        text: >-
          (א) $f'''(x)=\frac{2}{(1+x)^3}$ ו-$f^{(4)}(x)=-\frac{6}{(1+x)^4}$. לכן $R_2(x)=\frac{x^3}{3(1+c_1)^3}$ ו-$R_3(x)=-\frac{x^4}{4(1+c_2)^4}$,
          עם $c_1,c_2$ בין 0 ל-$x$.
      - kind: step
        text: >-
          כש-$x\ge0$: $R_2(x)\ge0$, כלומר $\ln(1+x)\ge x-\frac{x^2}{2}$; ו-$R_3(x)\le0$, כלומר $\ln(1+x)\le x-\frac{x^2}{2}+\frac{x^3}{3}$.
          (ל-$R_3$ הסימן שלילי לכל $x$, אבל $T_2\le f$ דורש $x\ge0$, כי $x^3$ משנה סימן.)
      - kind: computation
        text: >-
          (ב) $x=0.1$: $0.1-0.005=0.095$ ו-$0.095+\frac{0.001}{3}=0.0953333$. לכן $0.095\le\ln1.1\le0.09534$, ושלוש הספרות
          $0.095$ בטוחות.
      - kind: computation
        text: >-
          (ג) $x=1$: $1-\frac12=0.5\le\ln2\le0.5+\frac13\approx0.833$. רוחב הקטע $\frac{x^3}{3}$: ב-$x=0.1$ הוא $3.3\cdot10^{-4}$,
          וב-$x=1$ הוא $0.33$. השארית קטנה רק כש-$x$ קטן.
      - kind: check
        text: >-
          $\ln1.1\approx0.0953102$ ו-$\ln2\approx0.6931$: שניהם בקטעים שמצאנו.
      - kind: result
        text: >-
          לכל $x\ge0$: $x-\frac{x^2}{2}\le\ln(1+x)\le x-\frac{x^2}{2}+\frac{x^3}{3}$. מכאן $0.095\le\ln1.1\le0.09534$ ו-$0.5\le\ln2\le0.84$.

  - id: W-6.2-10
    level: exam
    objectives: [OBJ-6.2-3, OBJ-6.2-2]
    prompt: >-
      ספרייה של שפת תכנות מחשבת $e^x$ בעזרת $T_n(x)$ סביב 0, ורוצה **שגיאה יחסית** (השגיאה חלקי $e^x$) קטנה מ-$10^{-8}$.

      (א) הראו שלכל $x>0$: $\frac{|R_n(x)|}{e^x}<\frac{x^{n+1}}{(n+1)!}$.

      (ב) מה ה-$n$ הקטן ביותר שהחסם של (א) מבטיח בשבילו את הדיוק לכל $x\in[0,1]$? ולכל $x\in[0,2]$?

      (ג) למה, לדעתכם, ספרייה כזו מעבירה קודם כל $x$ לקטע קצר?
    answer: >-
      (א) $\frac{|R_n|}{e^x}=e^{c-x}\frac{x^{n+1}}{(n+1)!}$ עם $c<x$. (ב) $n=11$ ב-$[0,1]$, $n=15$ ב-$[0,2]$. (ג) בקטע קצר צריך
      פחות איברים, ואת השאר משלימים בחוקי החזקות.
    solution:
      - kind: idea
        text: >-
          בשגיאה יחסית מחלקים את השארית ב-$e^x$. הגורם $e^c$ בשארית מתחלק כמעט כולו, כי $c<x$: נשאר חסם בלי $M$ בכלל.
      - kind: computation
        text: >-
          (א) $R_n(x)=\frac{e^c}{(n+1)!}x^{n+1}$ עם $0<c<x$. לכן $\frac{|R_n(x)|}{e^x}=e^{c-x}\frac{x^{n+1}}{(n+1)!}$, ו-$c-x<0$
          נותן $e^{c-x}<1$.
      - kind: computation
        text: >-
          (ב) ב-$[0,1]$: $x^{n+1}\le1$, והדרישה $\frac{1}{(n+1)!}<10^{-8}$. $\frac{1}{11!}\approx2.5\cdot10^{-8}$ ($n=10$) עוד
          גדול, $\frac{1}{12!}\approx2.1\cdot10^{-9}$ ($n=11$) מספיק.
      - kind: computation
        text: >-
          ב-$[0,2]$: $\frac{2^{n+1}}{(n+1)!}<10^{-8}$. $n=14$: $\frac{2^{15}}{15!}\approx2.5\cdot10^{-8}$, גדול מדי; $n=15$:
          $\frac{2^{16}}{16!}\approx3.1\cdot10^{-9}$, מספיק.
      - kind: step
        text: >-
          (ג) הכפלת הקטע עלתה ארבעה איברים, וכל איבר עולה זמן חישוב. במקום זה כותבים $x=k\ln2+r$ עם $r$ קטן, ומחשבים
          $e^x=2^k e^r$: את $2^k$ קל לחשב, ול-$e^r$ מספיקים מעט איברים.
      - kind: check
        text: >-
          ב-$x=1$ עם $n=11$: השגיאה היחסית האמיתית (מחושבת) כ-$8.3\cdot10^{-10}$, מתחת ל-$10^{-8}$ ומתחת לחסם $2.1\cdot10^{-9}$.
      - kind: result
        text: >-
          (ב) $n=11$ על $[0,1]$, $n=15$ על $[0,2]$. (ג) קטע קצר חוסך איברים.

challenge:
  - id: W-6.2-c1
    stars: 1
    objectives: [OBJ-6.2-1, OBJ-6.2-2]
    prompt: >-
      **$e$ אינו מספר רציונלי.** נניח בשלילה ש-$e=\frac{r}{s}$, עם $r,s$ טבעיים.

      (א) כתבו את $T_n(1)$ של $e^x$ סביב 0, ואת $R_n(1)=e-T_n(1)$ בצורת לגרנז׳. הראו ש-$0<R_n(1)<\frac{3}{(n+1)!}$.

      (ב) הראו שכאשר $n\ge s$, המספר $n!\,R_n(1)$ הוא מספר שלם.

      (ג) הראו שכאשר $n\ge2$, $0<n!\,R_n(1)<1$, והסיקו סתירה.
    answer: >-
      (ב) $n!\,e=\frac{n!}{s}r$ שלם כי $s$ מחלק את $n!$, ו-$n!\,T_n(1)=\sum_{k=0}^n\frac{n!}{k!}$ שלם. (ג) $n!\,R_n(1)<\frac{3}{n+1}\le1$:
      שלם בין 0 ל-1 אינו קיים, ולכן $e$ אינו רציונלי.
    solution:
      - kind: idea
        text: >-
          הנחה ש-$e$ רציונלי הופכת את השארית, אחרי כפל במספר שלם מתאים, למספר שלם. השארית בצורת לגרנז׳ אומרת שהיא חיובית
          וקטנה מאוד: שלם חיובי קטן מ-1 לא קיים.
      - kind: computation
        text: >-
          (א) $T_n(1)=\sum_{k=0}^{n}\frac{1}{k!}$ ו-$R_n(1)=\frac{e^c}{(n+1)!}$ עם $0<c<1$. כי $1<e^c<e<3$:
          $0<R_n(1)<\frac{3}{(n+1)!}$.
      - kind: step
        text: >-
          (ב) אם $n\ge s$, אז $s$ אחד הגורמים של $n!=1\cdot2\cdots n$, ולכן $n!\,e=\frac{n!}{s}\cdot r$ שלם. כל איבר
          $\frac{n!}{k!}$ עם $k\le n$ הוא מכפלת השלמים $(k+1)\cdots n$, ולכן גם $n!\,T_n(1)$ שלם. ההפרש $n!\,R_n(1)$ שלם.
      - kind: computation
        text: >-
          (ג) מ-(א): $0<n!\,R_n(1)<\frac{3\cdot n!}{(n+1)!}=\frac{3}{n+1}\le1$ כש-$n\ge2$.
      - kind: step
        text: >-
          בוחרים $n\ge\max(s,2)$. לפי (ב) $n!\,R_n(1)$ שלם, ולפי (ג) הוא ממש בין 0 ל-1. אין שלם כזה: סתירה. לכן $e$ אינו
          רציונלי.
      - kind: check
        text: >-
          מחושב: $2!\,R_2(1)\approx0.437$, $3!\,R_3(1)\approx0.310$, $4!\,R_4(1)\approx0.239$: כולם בין 0 ל-1 ואינם שלמים, כמו שההוכחה
          צופה.
      - kind: result
        text: >-
          $e$ אינו מספר רציונלי.
    source:
      name: 'G. Strang, E. Herman, Calculus Volume 2 (OpenStax)'
      year: 2016
      problem: 'Section 6.3, Student Project "Proving that e is Irrational"'
      url: https://openstax.org/books/calculus-volume-2/pages/6-3-taylor-and-maclaurin-series
      verified: '2026-11-27'
      adapted: true

  - id: W-6.2-c2
    stars: 1
    objectives: [OBJ-6.2-2, OBJ-6.2-3]
    prompt: >-
      מקרבים $\ln x\approx x-1$ (פולינום טיילור מסדר 1 סביב $x_0=1$) בקטע $[1-R,\ 1+R]$, עם $0<R<1$.

      (א) הראו שהחסם של לגרנז׳ על השגיאה בקטע הוא $B(R)=\frac{R^2}{2(1-R)^2}$.

      (ב) מצאו במדויק את ה-$R$ הגדול ביותר שעבורו $B(R)\le0.1$.

      (ג) בדקו את השגיאה האמיתית בשני הקצוות של הקטע שמצאתם. אם מסתפקים בצד הימני בלבד, $[1,1+R]$, איזה $R$ מתקבל?
    answer: >-
      (ב) $R=\frac{\sqrt5-1}{4}\approx0.309$. (ג) השגיאות כ-$0.061$ משמאל וכ-$0.040$ מימין; בצד הימני בלבד $R=\sqrt{0.2}\approx0.447$.
    solution:
      - kind: idea
        text: >-
          $|f''(t)|=\frac{1}{t^2}$ יורדת, ולכן הקצה הבעייתי הוא השמאלי, $t=1-R$, שקרוב ל-0 שבו $\ln$ מתפוצץ. אחרי שיש נוסחה
          ל-$B(R)$, פותרים אי-שוויון; הוא נהיה לינארי אחרי הוצאת שורש.
      - kind: computation
        text: >-
          (א) $f'(t)=\frac1t$ ו-$f''(t)=-\frac{1}{t^2}$. בקטע $[1-R,1+R]$ המקסימום של $\frac{1}{t^2}$ ב-$t=1-R$: $M=\frac{1}{(1-R)^2}$.
          המרחק הגדול ביותר מ-1 הוא $R$, ולכן $B(R)=\frac{M}{2}R^2=\frac{R^2}{2(1-R)^2}$.
      - kind: computation
        text: >-
          (ב) $B$ עולה ב-$R$ (המונה גדל והמכנה קטן). $\frac{R^2}{2(1-R)^2}\le0.1$ שקול ל-$\left(\frac{R}{1-R}\right)^2\le0.2$, כלומר
          $\frac{R}{1-R}\le\frac{1}{\sqrt5}$ (שני הצדדים חיוביים). מכאן $\sqrt5R\le1-R$, ו-$R\le\frac{1}{1+\sqrt5}=\frac{\sqrt5-1}{4}\approx0.30902$.
      - kind: computation
        text: >-
          (ג) ב-$x=1-R\approx0.691$: $|\ln0.691-(-0.309)|\approx0.0606$. ב-$x=1+R\approx1.309$: $|\ln1.309-0.309|\approx0.0397$. שתיהן
          מתחת ל-$0.1$: החסם פסימי פי 1.6 לפחות. בצד הימני בלבד $M=1$ (ב-$t=1$), ו-$\frac{R^2}{2}\le0.1$ נותן $R\le\sqrt{0.2}\approx0.447$.
      - kind: check
        text: >-
          הצבה: $R=\frac{\sqrt5-1}{4}$ נותן $1-R=\frac{5-\sqrt5}{4}$, ו-$\frac{R}{1-R}=\frac{\sqrt5-1}{5-\sqrt5}=\frac{1}{\sqrt5}$, ולכן $B(R)=\frac{1}{2}\cdot\frac15=0.1$
          בדיוק.
      - kind: result
        text: >-
          $R=\frac{\sqrt5-1}{4}\approx0.309$ לקטע הסימטרי; $R=\sqrt{0.2}\approx0.447$ לצד הימני בלבד.
    source:
      name: 'G. Strang, E. Herman, Calculus (OpenStax), LibreTexts edition'
      year: 2016
      problem: 'Section 10.3 exercises, Exercise 23 (ln x approximated by x − 1, a = 1); solved exactly instead of by plotting, parts (ג) added'
      url: https://math.libretexts.org/Bookshelves/Calculus/Book%3A_Calculus_(OpenStax)/10%3A_Power_Series/10.3%3A_Taylor_and_Maclaurin_Series/10.3E%3A_Exercises_for_Section_10.3
      verified: '2026-11-27'
      adapted: true
