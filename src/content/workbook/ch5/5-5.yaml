# Workbook of lesson 5.5 — the derivative table and its uses.
# Objectives (src/course.ts):
#   OBJ-5.5-1  differentiate every elementary function in the table, including the hyperbolic ones
#   OBJ-5.5-2  related rates in physical and geometric problems
#   OBJ-5.5-3  intervals of increase and decrease and extreme points from the derivative
# Order of knowledge: extrema by the sign of f' and the closed-interval candidates only (no f'', no concavity, no
# Taylor, no integrals); the mean value theorem is used without proof.
# Every number recomputed with sympy in screens/tools/lesson-5-5.py.
lesson: '5.5'
practice:
  - id: W-5.5-01
    level: basic
    objectives: [OBJ-5.5-1]
    prompt: >-
      גזרו:

      (א) $f(x)=5^x$

      (ב) $g(x)=\log_3\left(x^2+1\right)$

      (ג) $k(x)=\sinh x\cosh x$. כתבו את התוצאה כפונקציה היפרבולית אחת, בעזרת זהות הזווית הכפולה של שיעור 4.5.
    answer: >-
      (א) $5^x\ln5$. (ב) $\frac{2x}{\left(x^2+1\right)\ln3}$. (ג) $\cosh^2x+\sinh^2x=\cosh2x$.
    solution:
      - kind: idea
        text: >-
          בסיס כללי מעבירים לבסיס $e$: $a^x=e^{x\ln a}$ נותן $\left(a^x\right)'=a^x\ln a$, ו-$\log_au=\frac{\ln u}{\ln a}$.
          בהרכבה כופלים בנגזרת הפנימית, ובמכפלה משתמשים בכלל המכפלה.
      - kind: computation
        text: >-
          (א) מהטבלה, עם $a=5$: $\left(5^x\right)'=5^x\ln5$.
      - kind: computation
        text: >-
          (ב) $g(x)=\frac{\ln\left(x^2+1\right)}{\ln3}$, ו-$\ln3$ קבוע. הפנימית $u=x^2+1$, $u'=2x$, ולכן
          $g'(x)=\frac{1}{\ln3}\cdot\frac{1}{x^2+1}\cdot2x=\frac{2x}{\left(x^2+1\right)\ln3}$.
      - kind: computation
        text: >-
          (ג) כלל המכפלה, עם $(\sinh x)'=\cosh x$ ו-$(\cosh x)'=\sinh x$ (בלי מינוס):
          $k'(x)=\cosh x\cdot\cosh x+\sinh x\cdot\sinh x=\cosh^2x+\sinh^2x$.
      - kind: step
        text: >-
          מהזהויות של שיעור 4.5, $\cosh2x=2\cosh^2x-1$ ו-$\cosh^2x-\sinh^2x=1$, כלומר $\sinh^2x=\cosh^2x-1$. לכן
          $\cosh^2x+\sinh^2x=2\cosh^2x-1=\cosh2x$.
      - kind: check
        text: >-
          (ג) דרך אחרת: $\sinh x\cosh x=\frac12\sinh2x$, ובכלל השרשרת $\left(\frac12\sinh2x\right)'=\frac12\cdot2\cosh2x=\cosh2x$.
          (ב) ב-$x=0$ הנגזרת 0, וזה הגיוני: $x^2+1$ מינימלי שם, והלוגריתם שלו גם.
      - kind: result
        text: >-
          (א) $5^x\ln5$; (ב) $\frac{2x}{\left(x^2+1\right)\ln3}$; (ג) $\cosh2x$.

  - id: W-5.5-02
    level: basic
    objectives: [OBJ-5.5-3]
    prompt: >-
      מצאו את תחומי העלייה והירידה של $f(x)=x^4-8x^2$, ואת נקודות הקיצון המקומיות שלה עם הערכים בהן.
    answer: >-
      יורדת ב-$(-\infty,-2]$ וב-$[0,2]$, עולה ב-$[-2,0]$ וב-$[2,\infty)$. מינימום מקומי בשתי הנקודות $x=\pm2$, בערך מינוס 16;
      מקסימום מקומי ב-$x=0$, בערך 0.
    solution:
      - kind: idea
        text: >-
          הסימן של $f'$ קובע עלייה וירידה. מפרקים את $f'$ לגורמים, בונים טבלת סימנים ומסווגים כל נקודה קריטית
          במבחן החלפת הסימן.
      - kind: computation
        text: >-
          $f'(x)=4x^3-16x=4x\left(x^2-4\right)=4x(x-2)(x+2)$. הנקודות הקריטיות: $x=-2$, $0$, $2$.
      - kind: computation
        text: >-
          הסימן בכל קטע, בהצבה של נקודה אחת: $f'(-3)=4(-3)(-5)(-1)=-60<0$; $f'(-1)=4(-1)(-3)(1)=12>0$;
          $f'(1)=4(1)(-1)(3)=-12<0$; $f'(3)=4(3)(1)(5)=60>0$.
      - kind: step
        text: >-
          לכן $f$ יורדת ב-$(-\infty,-2]$, עולה ב-$[-2,0]$, יורדת ב-$[0,2]$ ועולה ב-$[2,\infty)$. ב-$\pm2$ הנגזרת
          עוברת ממינוס לפלוס: מינימום מקומי. ב-0 מפלוס למינוס: מקסימום מקומי.
      - kind: computation
        text: >-
          $f(\pm2)=16-32=-16$ ו-$f(0)=0$.
      - kind: check
        text: >-
          $f$ זוגית ($f(-x)=f(x)$), ולכן התמונה סימטרית: שני מינימומים שווים בנקודות סימטריות. $f(\pm1)=1-8=-7$, בין
          0 למינוס 16, כצפוי.
      - kind: result
        text: >-
          יורדת ב-$(-\infty,-2]$ וב-$[0,2]$, עולה ב-$[-2,0]$ וב-$[2,\infty)$; מינימום מקומי בערך מינוס 16 ב-$x=\pm2$,
          מקסימום מקומי בערך 0 ב-$x=0$.

  - id: W-5.5-03
    level: basic
    objectives: [OBJ-5.5-2]
    prompt: >-
      זורקים אבן לבריכה שקטה, וגל מעגלי מתפשט ממקום הנפילה. הרדיוס של המעגל גדל בקצב של $0.5$ מ׳ לשנייה. באיזה קצב
      גדל השטח שהגל מקיף ברגע שבו הרדיוס 4 מ׳?
    answer: >-
      $4\pi\approx12.6$ מ״ר לשנייה.
    solution:
      - kind: idea
        text: >-
          קצבים קשורים: השטח והרדיוס קשורים בכל רגע ב-$A=\pi r^2$. גוזרים לפי $t$, ורק אחר כך מציבים $r=4$.
      - kind: given
        text: >-
          $r'=0.5$ מ׳ לשנייה. מבקשים את $A'$ ברגע שבו $r=4$.
      - kind: computation
        text: >-
          $A=\pi r^2$, ובכלל השרשרת $A'=2\pi r\,r'$.
      - kind: computation
        text: >-
          מציבים: $A'=2\pi\cdot4\cdot0.5=4\pi\approx12.57$ מ״ר לשנייה.
      - kind: check
        text: >-
          $2\pi r$ הוא היקף המעגל: בזמן קצר נוספת לשטח טבעת דקה שהשטח שלה בערך ההיקף כפול העובי. היחידות: מטר כפול מטר
          לשנייה הם מ״ר לשנייה. ואילו הצבנו $r=4$ לפני הגזירה, היינו מקבלים 0.
      - kind: result
        text: >-
          השטח גדל ב-$4\pi\approx12.6$ מ״ר לשנייה.

  - id: W-5.5-04
    level: mid
    qualitative: true
    objectives: [OBJ-5.5-1]
    prompt: >-
      סטודנטית גזרה ארבע פונקציות. לכל אחת קבעו אם הגזירה נכונה; אם לא, מצאו את הטעות וכתבו את הנגזרת הנכונה.

      (א) $\left(3^{x^2}\right)'=x^2\cdot3^{x^2-1}\cdot2x$

      (ב) $\left(\log_2(5x)\right)'=\frac{1}{5x\ln2}$

      (ג) $\left(\cosh^2x\right)'=2\cosh x\cdot(-\sinh x)$

      (ד) $(\tanh x)'=1-\tanh^2x$
    answer: >-
      (א) שגוי: $3^{x^2}\ln3\cdot2x$. (ב) שגוי: $\frac{1}{x\ln2}$. (ג) שגוי: $2\cosh x\sinh x=\sinh2x$. (ד) נכון.
    solution:
      - kind: idea
        text: >-
          בכל שורה שואלים: האם הכלל שנבחר מתאים (כלל החזקה רק לבסיס משתנה ומעריך קבוע), האם נכפלה הנגזרת הפנימית, והאם
          הסימן נכון ($\cosh$ נגזרת ל-$\sinh$ בלי מינוס).
      - kind: computation
        text: >-
          (א) שגוי. הבסיס 3 קבוע והמעריך $x^2$ משתנה: זה אקספוננט, לא חזקה. $3^{x^2}=e^{x^2\ln3}$, ובכלל השרשרת
          $\left(3^{x^2}\right)'=3^{x^2}\ln3\cdot2x$.
      - kind: computation
        text: >-
          (ב) שגוי: חסרה הנגזרת הפנימית $(5x)'=5$. נכון: $\frac{1}{5x\ln2}\cdot5=\frac{1}{x\ln2}$. בדרך אחרת:
          $\log_2(5x)=\log_25+\log_2x$, והקבוע $\log_25$ נגזר ל-0.
      - kind: computation
        text: >-
          (ג) שגוי בסימן. החיצונית $u^2$ והפנימית $u=\cosh x$, שהנגזרת שלה $+\sinh x$. נכון:
          $\left(\cosh^2x\right)'=2\cosh x\sinh x=\sinh2x$.
      - kind: computation
        text: >-
          (ד) נכון: $(\tanh x)'=\frac{1}{\cosh^2x}$, ו-$\frac{1}{\cosh^2x}=\frac{\cosh^2x-\sinh^2x}{\cosh^2x}=1-\tanh^2x$.
      - kind: check
        text: >-
          (ג) בבדיקת סימן: $\cosh^2x$ עולה כש-$x>0$ (כי $\cosh x$ חיובית ועולה שם), ולכן הנגזרת צריכה להיות חיובית שם.
          התשובה של הסטודנטית שלילית לכל $x>0$, וזה סימן לטעות.
      - kind: result
        text: >-
          (א) $3^{x^2}\ln3\cdot2x$; (ב) $\frac{1}{x\ln2}$; (ג) $\sinh2x$; (ד) נכון כפי שנכתב.

  - id: W-5.5-05
    level: mid
    objectives: [OBJ-5.5-1]
    prompt: >-
      $\operatorname{artanh}$ היא הפונקציה ההפוכה של $\tanh$, מוגדרת כש-$|x|<1$ (שיעור 4.5).

      (א) מצאו את $\left(\operatorname{artanh}x\right)'$ בגזירה סתומה של $\tanh y=x$.

      (ב) בדקו את התוצאה בגזירה ישירה של הנוסחה $\operatorname{artanh}x=\frac12\ln\frac{1+x}{1-x}$.
    answer: >-
      $\left(\operatorname{artanh}x\right)'=\frac{1}{1-x^2}$, כש-$|x|<1$.
    solution:
      - kind: idea
        text: >-
          כמו ב-$\operatorname{arsinh}$ בשיעור: כותבים $y=\operatorname{artanh}x$ כ-$\tanh y=x$, גוזרים את שני האגפים לפי
          $x$, ומבטאים את התוצאה בעזרת $x$ דרך זהות.
      - kind: computation
        text: >-
          (א) $(\tanh y)'=\left(1-\tanh^2y\right)y'$ (כלל השרשרת, $y=y(x)$). גזירת $\tanh y=x$ נותנת
          $\left(1-\tanh^2y\right)y'=1$.
      - kind: computation
        text: >-
          אבל $\tanh y=x$, ולכן $1-\tanh^2y=1-x^2$, ו-$y'=\frac{1}{1-x^2}$. כש-$|x|<1$ המכנה חיובי.
      - kind: computation
        text: >-
          (ב) לפי חוקי הלוגריתם, $\frac12\ln\frac{1+x}{1-x}=\frac12\ln(1+x)-\frac12\ln(1-x)$. גוזרים:
          $\frac12\cdot\frac{1}{1+x}-\frac12\cdot\frac{-1}{1-x}=\frac12\left(\frac{1}{1+x}+\frac{1}{1-x}\right)$.
      - kind: computation
        text: >-
          מכנה משותף: $\frac12\cdot\frac{(1-x)+(1+x)}{(1+x)(1-x)}=\frac12\cdot\frac{2}{1-x^2}=\frac{1}{1-x^2}$. אותה תוצאה.
      - kind: check
        text: >-
          הנגזרת חיובית בכל $(-1,1)$: $\operatorname{artanh}$ עולה, כמו $\tanh$ שהיא ההפוכה שלה. כש-$x\to\pm1$ הנגזרת גדלה
          בלי גבול: הגרף מתקרב לאסימפטוטות אנכיות, תמונת הראי של האסימפטוטות האופקיות $y=\pm1$ של $\tanh$.
      - kind: result
        text: >-
          $\left(\operatorname{artanh}x\right)'=\frac{1}{1-x^2}$ לכל $|x|<1$.

  - id: W-5.5-06
    level: mid
    objectives: [OBJ-5.5-2]
    prompt: >-
      מכונית A נוסעת צפונה, הרחק מצומת, במהירות 20 מ׳ לשנייה. מכונית B נוסעת מערבה ומתקרבת לאותו צומת ממזרח במהירות
      15 מ׳ לשנייה. ברגע מסוים A נמצאת 80 מ׳ צפונה מהצומת ו-B נמצאת 60 מ׳ מזרחה ממנו. האם המרחק בין המכוניות גדל או
      קטן ברגע הזה, ובאיזה קצב?
    answer: >-
      גדל, בקצב של 7 מ׳ לשנייה.
    solution:
      - kind: idea
        text: >-
          קצבים קשורים: המרחק $D$ בין המכוניות הוא היתר של משולש ישר זווית שהקודקוד הישר שלו בצומת. כותבים את פיתגורס
          ברגע כללי, גוזרים לפי $t$, ומציבים בסוף. הסימנים חשובים: B מתקרבת, ולכן המרחק שלה מהצומת קטן.
      - kind: given
        text: >-
          $y$ = המרחק של A מהצומת, $y'=20$. $x$ = המרחק של B מהצומת, $x'=-15$ (קטן). ברגע הנתון $x=60$ ו-$y=80$.
      - kind: computation
        text: >-
          הקשר בכל רגע: $D^2=x^2+y^2$. גזירה לפי $t$: $2DD'=2xx'+2yy'$, כלומר $D'=\frac{xx'+yy'}{D}$.
      - kind: computation
        text: >-
          ברגע הנתון $D=\sqrt{60^2+80^2}=100$, ו-$D'=\frac{60\cdot(-15)+80\cdot20}{100}=\frac{-900+1600}{100}=7$.
      - kind: check
        text: >-
          הסימן חיובי: המרחק גדל. שימו לב שהקצב אינו $20-15=5$:
          המכוניות לא נעות על אותו ישר, והקשר בין הקצבים עובר דרך $\frac xD$ ו-$\frac yD$.
      - kind: result
        text: >-
          המרחק גדל בקצב של 7 מ׳ לשנייה.

  - id: W-5.5-07
    level: mid
    qualitative: true
    objectives: [OBJ-5.5-3]
    prompt: >-
      על פונקציה $f$ שגזירה בכל הישר ידוע רק ש-$f'(x)=x(x-3)^2(x+1)$.

      (א) באילו תחומים $f$ עולה, ובאילו יורדת?

      (ב) סווגו כל נקודה קריטית: מקסימום מקומי, מינימום מקומי, או לא קיצון.

      (ג) נכון או לא נכון, ולמה: "$f(3)=0$".
    answer: >-
      (א) עולה ב-$(-\infty,-1]$ וב-$[0,\infty)$, יורדת ב-$[-1,0]$. (ב) מקסימום מקומי ב-$-1$, מינימום מקומי ב-0, ב-3 אין
      קיצון. (ג) לא נכון: מ-$f'$ אי אפשר לדעת ערכים של $f$.
    solution:
      - kind: idea
        text: >-
          מהנוסחה של $f'$ קוראים רק סימן. בונים טבלת סימנים; גורם בריבוע, $(x-3)^2$, אינו שלילי ואינו מחליף סימן.
      - kind: computation
        text: >-
          (א) הנקודות הקריטיות: $-1$, $0$, $3$. בהצבה: $f'(-2)=(-2)(25)(-1)=50>0$; $f'(-0.5)=(-0.5)(12.25)(0.5)<0$;
          $f'(1)=1\cdot4\cdot2=8>0$; $f'(4)=4\cdot1\cdot5=20>0$.
      - kind: step
        text: >-
          לכן $f$ עולה ב-$(-\infty,-1]$, יורדת ב-$[-1,0]$, ועולה ב-$[0,3]$ וגם ב-$[3,\infty)$, כלומר בכל $[0,\infty)$.
      - kind: step
        text: >-
          (ב) ב-$-1$: מפלוס למינוס, מקסימום מקומי. ב-0: ממינוס לפלוס, מינימום מקומי. ב-3: פלוס משני הצדדים, אין קיצון;
          $f'$ רק נוגעת שם בציר.
      - kind: step
        text: >-
          (ג) לא נכון. האפסים של $f'$ אינם אפסים של $f$. ל-$f$ ול-$f+c$, לכל קבוע $c$, אותה נגזרת, ולכן מהנגזרת אי אפשר
          לדעת את $f(3)$: רק שב-3 הגרף שטוח.
      - kind: check
        text: >-
          המספר של נקודות הקיצון מתאים לצורה: עולה, יורדת, עולה: פסגה אחת ועמק אחד. נקודה קריטית ממעלה זוגית (גורם
          בריבוע) אינה מחליפה סימן, כמו $x^3$ ב-0.
      - kind: result
        text: >-
          עולה ב-$(-\infty,-1]$ וב-$[0,\infty)$, יורדת ב-$[-1,0]$; מקסימום מקומי ב-$-1$, מינימום מקומי ב-0, ב-3 אין
          קיצון; "$f(3)=0$" אינו נובע מהנתונים.

  - id: W-5.5-08
    level: exam
    objectives: [OBJ-5.5-3]
    prompt: >-
      מצאו את הערך הגדול ביותר ואת הערך הקטן ביותר של $f(x)=x^2e^{-x}$ בקטע הסגור $[-1,3]$. האם המקסימום המקומי של
      $f$ הוא גם המקסימום בקטע?
    answer: >-
      המקסימום $e\approx2.718$, בקצה $x=-1$; המינימום 0, ב-$x=0$. המקסימום המקומי, $4e^{-2}\approx0.541$ ב-$x=2$, אינו
      המקסימום בקטע.
    solution:
      - kind: idea
        text: >-
          $f$ רציפה בקטע סגור, ולכן יש לה בו ערך גדול ביותר וקטן ביותר (שיעור 4.6). המועמדים: הנקודות הקריטיות שבתוך
          הקטע, ושני הקצוות. משווים ערכים.
      - kind: computation
        text: >-
          כלל המכפלה: $f'(x)=2xe^{-x}+x^2\cdot\left(-e^{-x}\right)=x(2-x)e^{-x}$. הגורם $e^{-x}$ חיובי, ולכן $f'=0$ רק
          ב-$x=0$ וב-$x=2$, ושתיהן בתוך $(-1,3)$.
      - kind: computation
        text: >-
          הערכים: $f(-1)=1\cdot e^{1}=e\approx2.718$; $f(0)=0$; $f(2)=4e^{-2}\approx0.541$; $f(3)=9e^{-3}\approx0.448$.
      - kind: step
        text: >-
          הגדול ביותר: $e$, בקצה $x=-1$. הקטן ביותר: 0, ב-$x=0$.
      - kind: step
        text: >-
          הסימן של $f'$ הוא הסימן של $x(2-x)$: שלילי כש-$x<0$, חיובי כש-$0<x<2$, שלילי כש-$x>2$. לכן ב-2 יש מקסימום
          מקומי, $4e^{-2}$, אבל הוא קטן מ-$f(-1)$: מקסימום מקומי אינו בהכרח המקסימום בקטע.
      - kind: check
        text: >-
          $f\ge0$ בכל מקום (ריבוע כפול אקספוננט), ולכן המינימום 0 סביר. ב-$x=-1$ הפונקציה יורדת ($f'(-1)=-3e<0$), כלומר
          משמאל ל-0 הערכים גדלים ככל שהולכים שמאלה: הקצה השמאלי הוא הגבוה בצד הזה.
      - kind: result
        text: >-
          המקסימום בקטע $e$ (ב-$x=-1$), המינימום 0 (ב-$x=0$). המקסימום המקומי $4e^{-2}$ ב-$x=2$ אינו המקסימום בקטע.

  - id: W-5.5-09
    level: exam
    objectives: [OBJ-5.5-3]
    prompt: >-
      רוצים לייצר פחית סגורה בצורת גליל, בנפח $1000$ סמ״ק (ליטר), עם כמה שפחות פח. מצאו את הרדיוס ואת הגובה שבהם שטח
      הפנים הכולל (דופן, תחתית ומכסה) הוא הקטן ביותר. מה היחס בין הגובה לרדיוס?
    answer: >-
      $r=\sqrt[3]{\frac{500}{\pi}}\approx5.42$ ס״מ, $h=2r\approx10.84$ ס״מ, והשטח בערך $553.6$ סמ״ר. הגובה שווה לקוטר.
    solution:
      - kind: idea
        text: >-
          בעיית קיצון במילים: כותבים את השטח כפונקציה של משתנה אחד בעזרת אילוץ הנפח, ומחפשים מינימום. התחום $r>0$ פתוח,
          ולכן מכריעים לפי הסימן של הנגזרת, לא לפי קצוות.
      - kind: step
        text: >-
          השטח: שני עיגולים ודופן, $S=2\pi r^2+2\pi rh$. האילוץ: $\pi r^2h=1000$, כלומר $h=\frac{1000}{\pi r^2}$. מציבים:
          $S(r)=2\pi r^2+\frac{2000}{r}$, כש-$r>0$.
      - kind: computation
        text: >-
          $S'(r)=4\pi r-\frac{2000}{r^2}=\frac{4\pi r^3-2000}{r^2}$. היא מתאפסת כש-$r^3=\frac{500}{\pi}$, כלומר
          $r_0=\sqrt[3]{\frac{500}{\pi}}\approx5.419$.
      - kind: step
        text: >-
          הסימן: המכנה $r^2$ חיובי, והמונה $4\pi r^3-2000$ שלילי כש-$r<r_0$ וחיובי כש-$r>r_0$. לכן $S$ יורדת בכל
          $(0,r_0]$ ועולה בכל $[r_0,\infty)$, ו-$S(r_0)$ הוא המינימום על כל התחום.
      - kind: computation
        text: >-
          הגובה: מההגדרה של $r_0$, $r_0^3=\frac{500}{\pi}$, כלומר $500=\pi r_0^3$. לכן
          $h=\frac{1000}{\pi r_0^2}=\frac{2\cdot500}{\pi r_0^2}=\frac{2\pi r_0^3}{\pi r_0^2}=2r_0\approx10.84$ ס״מ. השטח:
          $S=2\pi r_0^2+2\pi r_0\cdot2r_0=6\pi r_0^2\approx553.6$ סמ״ר.
      - kind: check
        text: >-
          בשני הקצוות של התחום השטח גדול מאוד: כש-$r\to0$ הפחית צינור דק וארוך ($\frac{2000}{r}$ גדל בלי גבול), וכש-$r$
          גדול היא מגש רחב ($2\pi r^2$ גדל). ההשוואה עם ערכים: $S(4)\approx600.5$ ו-$S(7)\approx593.6$, שניהם גדולים
          מ-$553.6$.
      - kind: result
        text: >-
          $r=\sqrt[3]{500/\pi}\approx5.42$ ס״מ ו-$h=2r\approx10.84$ ס״מ: הגובה שווה לקוטר. השטח המינימלי בערך $553.6$
          סמ״ר.

  - id: W-5.5-10
    level: exam
    qualitative: true
    objectives: [OBJ-5.5-3]
    prompt: >-
      לאילו ערכים של הקבוע $k$ יש למשוואה $x^3-3x=k$ שלושה פתרונות ממשיים שונים? נמקו בעזרת תחומי העלייה והירידה,
      ומשפט ערך הביניים.
    answer: >-
      בדיוק כש-$-2<k<2$.
    solution:
      - kind: idea
        text: >-
          נסתכל על $g(x)=x^3-3x-k$. בכל קטע שבו $g$ עולה או יורדת יש לכל היותר שורש אחד, וערך הביניים קובע אם יש
          אחד. לכן מספר השורשים נקבע לפי הסימנים של $g$ בנקודות הקיצון.
      - kind: computation
        text: >-
          $g'(x)=3x^2-3=3(x-1)(x+1)$: $g$ עולה ב-$(-\infty,-1]$, יורדת ב-$[-1,1]$ ועולה ב-$[1,\infty)$. מקסימום מקומי
          $g(-1)=2-k$ ומינימום מקומי $g(1)=-2-k$.
      - kind: step
        text: >-
          בקצוות: כש-$x\to-\infty$, $g(x)\to-\infty$, וכש-$x\to\infty$, $g(x)\to\infty$ (האיבר $x^3$ שולט, שיעור 4.6).
      - kind: step
        text: >-
          אם $2-k>0$ וגם $-2-k<0$, כלומר $-2<k<2$: ב-$(-\infty,-1)$ $g$ עולה מערכים שליליים ל-$g(-1)>0$, שורש אחד;
          ב-$(-1,1)$ היא יורדת מחיובי לשלילי, שורש אחד; ב-$(1,\infty)$ עולה משלילי לערכים חיוביים, שורש אחד. שלושה.
      - kind: step
        text: >-
          אם $k>2$: $g(-1)<0$, ולכן $g<0$ בכל $(-\infty,1]$ (עולה עד שלילי, ואז יורדת), ויש רק השורש שב-$(1,\infty)$.
          אם $k<-2$: באופן סימטרי רק שורש אחד, ב-$(-\infty,-1)$. אם $k=\pm2$: אחד מערכי הקיצון 0, ושני שורשים מתמזגים
          בו, כך שיש רק שני פתרונות שונים.
      - kind: check
        text: >-
          $k=0$: $x^3-3x=0$ נותן $x=0,\pm\sqrt3$, שלושה. $k=2$: $x^3-3x-2=(x+1)^2(x-2)$, רק $-1$ ו-2. $k=3$: במחשבון שורש
          ממשי אחד, בערך $2.10$.
      - kind: result
        text: >-
          שלושה פתרונות ממשיים שונים בדיוק כש-$-2<k<2$.

challenge:
  - id: W-5.5-c1
    stars: 1
    objectives: [OBJ-5.5-2, OBJ-5.5-3]
    prompt: >-
      מגדלור $L$ עומד על אי, במרחק 4 ק״מ מהנקודה $P$, הנקודה הקרובה אליו ביותר על חוף ישר. האור של המגדלור מסתובב
      בקצב קבוע של 10 סיבובים לדקה, והאלומה מאירה כתם על החוף.

      (א) באיזו מהירות נע הכתם לאורך החוף כשהוא במרחק 2 ק״מ מ-$P$?

      (ב) ובמרחק 1 ק״מ מ-$P$?

      (ג) באיזו נקודה על החוף הכתם נע הכי לאט? הסבירו בעזרת הסימן של נגזרת.
    answer: >-
      (א) $100\pi\approx314$ ק״מ לדקה. (ב) $85\pi\approx267$ ק״מ לדקה. (ג) ב-$P$, במהירות $80\pi\approx251$ ק״מ לדקה.
    solution:
      - kind: idea
        text: >-
          קצבים קשורים עם זווית. נסמן ב-$\theta$ את הזווית בין האלומה לבין הקטע $LP$, וב-$x$ את המרחק של הכתם מ-$P$
          לאורך החוף, כש-$X$ הוא הכתם עצמו, הנקודה על החוף שבה האלומה פוגעת. במשולש $LPX$, שישר הזווית ב-$P$, הניצב
          $LP=4$ והניצב $PX=x$, ולכן בכל רגע $x=4\tan\theta$. גוזרים לפי $t$ ומציבים בסוף.
      - kind: given
        text: >-
          10 סיבובים לדקה הם $10\cdot2\pi=20\pi$ רדיאנים לדקה: $\theta'=20\pi$. (הכיוון, עם או נגד כיוון השעון, קובע רק
          את הסימן; מחשבים את גודל המהירות.)
      - kind: computation
        text: >-
          $x'=4\cdot\frac{1}{\cos^2\theta}\cdot\theta'$. כדי לבטא בעזרת $x$: $\frac{1}{\cos^2\theta}=1+\tan^2\theta=1+\frac{x^2}{16}$.
          לכן $x'=4\left(1+\frac{x^2}{16}\right)\cdot20\pi=5\pi\left(16+x^2\right)$ ק״מ לדקה.
      - kind: computation
        text: >-
          (א) $x=2$: $x'=5\pi\cdot20=100\pi\approx314.2$ ק״מ לדקה. (ב) $x=1$: $x'=5\pi\cdot17=85\pi\approx267.0$ ק״מ לדקה.
      - kind: step
        text: >-
          (ג) המהירות כפונקציה של המקום היא $u(x)=5\pi\left(16+x^2\right)$, ו-$u'(x)=10\pi x$: שלילית כש-$x<0$ וחיובית
          כש-$x>0$. לכן $u$ יורדת עד $x=0$ ועולה אחריו, והמינימום ב-$x=0$, כלומר ב-$P$: $u(0)=80\pi\approx251.3$ ק״מ לדקה.
      - kind: check
        text: >-
          המספרים ענקיים (בערך 15,000 קמ״ש ב-$P$), וזה בסדר: הכתם אינו גוף שזז, אלא נקודה שבה האלומה פוגעת, ושום חוק
          פיזיקלי לא מגביל את המהירות שלו. ככל שהכתם רחוק יותר, האלומה פוגעת בחוף בזווית חדה יותר והכתם מהיר יותר, כמו
          שהנוסחה אומרת.
      - kind: result
        text: >-
          (א) $100\pi$ ק״מ לדקה; (ב) $85\pi$ ק״מ לדקה; (ג) הכי לאט ב-$P$, $80\pi$ ק״מ לדקה.
    source:
      name: 'G. Strang, E. Herman, Calculus Volume 1 (OpenStax)'
      year: 2016
      problem: 'Section 4.1 (Related Rates), exercises 39 and 40; miles changed to kilometres, part (ג) added'
      url: https://openstax.org/books/calculus-volume-1/pages/4-1-related-rates
      verified: '2026-11-27'
      adapted: true

  - id: W-5.5-c2
    stars: 1
    objectives: [OBJ-5.5-3]
    prompt: >-
      חותכים חוט באורך 4 מטר לשתי חתיכות. מחתיכה אחת מכופפים ריבוע שצלעו $x$, ומהשנייה מעגל. (מותר גם לא לחתוך:
      להשתמש בכל החוט לריבוע, או בכל החוט למעגל.)

      (א) איך לחתוך כדי שסכום השטחים של הריבוע והעיגול יהיה הגדול ביותר?

      (ב) איך לחתוך כדי שהסכום יהיה הקטן ביותר? מה הקשר, במקרה הזה, בין צלע הריבוע לרדיוס העיגול?
    answer: >-
      (א) לא לחתוך: כל החוט למעגל, שטח $\frac4\pi\approx1.273$ מ״ר. (ב) $x=\frac{4}{\pi+4}\approx0.560$ מ׳ (לריבוע
      $\frac{16}{\pi+4}\approx2.24$ מ׳ מהחוט), סכום השטחים $\frac{4}{\pi+4}\approx0.560$ מ״ר, ואז קוטר העיגול שווה לצלע
      הריבוע.
    solution:
      - kind: idea
        text: >-
          כותבים את סכום השטחים כפונקציה של $x$ בקטע הסגור $[0,1]$ (הריבוע לוקח $4x$ מטר מתוך 4), ומשווים את הערכים
          בנקודה הקריטית ובשני הקצוות.
      - kind: step
        text: >-
          למעגל נשארים $4-4x$ מטר, ולכן הרדיוס $r=\frac{4-4x}{2\pi}=\frac{2(1-x)}{\pi}$. סכום השטחים:
          $A(x)=x^2+\pi r^2=x^2+\frac{4(1-x)^2}{\pi}$, כש-$0\le x\le1$.
      - kind: computation
        text: >-
          $A'(x)=2x-\frac{8(1-x)}{\pi}$. השוואה ל-0: $2\pi x=8-8x$, כלומר $x_0=\frac{8}{2\pi+8}=\frac{4}{\pi+4}\approx0.560$,
          בתוך הקטע.
      - kind: computation
        text: >-
          הערכים: $A(0)=\frac4\pi\approx1.273$ (הכול מעגל); $A(1)=1$ (הכול ריבוע); וב-$x_0$, עם $1-x_0=\frac{\pi}{\pi+4}$:
          $A(x_0)=\frac{16}{(\pi+4)^2}+\frac{4\pi^2}{\pi(\pi+4)^2}=\frac{4(4+\pi)}{(\pi+4)^2}=\frac{4}{\pi+4}\approx0.560$ מ״ר.
          (זה במקרה אותו מספר כמו $x_0$, אבל אלה שני דברים שונים: $x_0$ הוא אורך במטרים, ו-$A(x_0)$ שטח במ״ר.)
      - kind: step
        text: >-
          (א) הגדול ביותר: $\frac4\pi$, בקצה $x=0$. המקסימום אינו בנקודה שבה $A'=0$: שם דווקא המינימום. (ב) הקטן ביותר:
          $\frac{4}{\pi+4}$, ב-$x_0$.
      - kind: computation
        text: >-
          ב-$x_0$ הרדיוס $r=\frac{2(1-x_0)}{\pi}=\frac{2}{\pi+4}=\frac{x_0}{2}$: קוטר העיגול שווה לצלע הריבוע.
      - kind: check
        text: >-
          הסימן של $A'$: $A'(0)=-\frac8\pi<0$ ו-$A'(1)=2>0$, ו-$A'$ היא פונקציה לינארית של $x$, ולכן $A$ יורדת עד $x_0$
          ועולה אחריו, כמו שמינימום צריך. והגיוני שהמעגל לבדו מנצח: מכל הצורות עם היקף נתון, העיגול מקיף את השטח הגדול
          ביותר.
      - kind: result
        text: >-
          (א) כל החוט למעגל: $\frac4\pi\approx1.27$ מ״ר. (ב) $\frac{16}{\pi+4}\approx2.24$ מ׳ לריבוע והשאר למעגל: $\frac{4}{\pi+4}\approx0.56$
          מ״ר, וקוטר העיגול שווה אז לצלע הריבוע.
    source:
      name: 'G. Strang, E. Herman, Calculus Volume 1 (OpenStax)'
      year: 2016
      problem: 'Section 4.7 (Applied Optimization Problems), exercises 335 and 336; feet changed to metres, the diameter remark added'
      url: https://openstax.org/books/calculus-volume-1/pages/4-7-applied-optimization-problems
      verified: '2026-11-27'
      adapted: true
