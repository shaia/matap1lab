# Workbook of lesson 5.2 — tangent line, linear approximation and differentials.
# Objectives (src/course.ts):
#   OBJ-5.2-1  find the tangent line and use it as a linear approximation near the point
#   OBJ-5.2-2  use the differential to estimate a small change of a function and an error
#   OBJ-5.2-3  know the notations for the derivative and move between them
# Derivatives known: those of 5.1 (x^n for natural n by its pattern, 1/x, sqrt x), (f+g)' and (cf)' from the
# definition, and sin'(0) = 1 from sin h / h -> 1 (4.6). No product/quotient/chain rule, no Taylor, no f''.
# Every number recomputed with sympy (scratchpad w52.py of the 5.2 session).
lesson: '5.2'
practice:
  - id: W-5.2-01
    level: basic
    objectives: [OBJ-5.2-1]
    prompt: >-
      כתבו את משוואת הישר המשיק לגרף של $f(x)=\sqrt x$ בנקודה $x=9$, והשתמשו בו כדי להעריך את $\sqrt{10}$ ואת
      $\sqrt{8.5}$.
    answer: >-
      $y=\frac{x}{6}+\frac32$; $\sqrt{10}\approx\frac{19}{6}\approx3.1667$ ו-$\sqrt{8.5}\approx\frac{35}{12}\approx2.9167$.
    solution:
      - kind: idea
        text: >-
          משיק הוא ישר שעובר בנקודת ההשקה $(9,f(9))$ ושיפועו $f'(9)$. אחרי שיש משוואה, מציבים בה את המספרים הקרובים ל-9.
      - kind: computation
        text: >-
          $f(9)=3$. מהשיעור הקודם $f'(x)=\frac{1}{2\sqrt x}$, ולכן $f'(9)=\frac{1}{2\cdot3}=\frac16$.
      - kind: computation
        text: >-
          המשיק: $y=3+\frac16(x-9)=\frac{x}{6}+\frac32$.
      - kind: computation
        text: >-
          $\sqrt{10}\approx3+\frac16\cdot1=\frac{19}{6}\approx3.1667$. ו-$\sqrt{8.5}\approx3+\frac16\cdot(-0.5)=3-\frac{1}{12}=\frac{35}{12}\approx2.9167$.
      - kind: check
        text: >-
          הצבה $x=9$ במשיק: $\frac96+\frac32=3$, נקודת ההשקה. במחשבון $\sqrt{10}=3.16228\ldots$ ו-$\sqrt{8.5}=2.91548\ldots$:
          שגיאות של כ-$0.004$ וכ-$0.001$, קטנות יותר בנקודה הקרובה יותר ל-9.
      - kind: result
        text: >-
          $y=\frac{x}{6}+\frac32$, $\sqrt{10}\approx3.1667$, $\sqrt{8.5}\approx2.9167$.

  - id: W-5.2-02
    level: basic
    qualitative: true
    objectives: [OBJ-5.2-3]
    prompt: >-
      $s(t)$ הוא המקום (במטרים) של רוכב אופניים על כביש ישר, $t$ שניות אחרי הזינוק. נתון $s(4)=30$ ו-$s'(4)=-2$.

      (א) כתבו את $s'(4)$ בעוד שני סימונים.

      (ב) מה היחידות של $s'(4)$, ומה פירוש הסימן מינוס?

      (ג) תלמיד כתב: $\frac{d}{dt}\big[s(4)\big]=-2$. מה לא נכון?
    answer: >-
      (א) $\left.\frac{ds}{dt}\right|_{t=4}$ ו-$\dot s(4)$. (ב) מטר לשנייה; ברגע $t=4$ הרוכב נע לכיוון שבו $s$ קטן, במהירות 2 מטר
      לשנייה. (ג) $s(4)=30$ הוא מספר, והנגזרת שלו 0.
    solution:
      - kind: idea
        text: >-
          כל הסימונים אומרים "גוזרים לפי $t$, ואחר כך מציבים $t=4$". יחידות הנגזרת הן יחידות המונה חלקי יחידות המכנה.
      - kind: step
        text: >-
          (א) $s'(4)=\left.\frac{ds}{dt}\right|_{t=4}=\dot s(4)$: הגרש, סימון לייבניץ, והנקודה של הפיזיקה לנגזרת לפי הזמן.
      - kind: step
        text: >-
          (ב) $\frac{ds}{dt}$ הוא גבול של $\frac{\Delta s}{\Delta t}$, מטרים חלקי שניות: מטר לשנייה. $s'(4)<0$ אומר שליד
          $t=4$ המקום $s$ קטן: הרוכב נע אחורה (לכיוון ההתחלה), ב-2 מטר בכל שנייה. המספר 30 הוא המקום, ואינו אומר דבר על
          המהירות.
      - kind: step
        text: >-
          (ג) $s(4)=30$ הוא מספר קבוע, ולכן $\frac{d}{dt}\big[s(4)\big]=\frac{d}{dt}\big[30\big]=0$. מה שהתלמיד התכוון אליו הוא
          $\left.\frac{ds}{dt}\right|_{t=4}$: קודם גוזרים, אחר כך מציבים.
      - kind: check
        text: >-
          יחידות: מטר חלקי שנייה, כמו מהירות. והקירוב הלינארי מסכים עם הפירוש: $s(4.5)\approx30+(-2)(0.5)=29$ מטר, פחות מ-30.
      - kind: result
        text: >-
          $s'(4)=\left.\frac{ds}{dt}\right|_{t=4}=\dot s(4)$, במטר לשנייה, והרוכב נע אחורה; $\frac{d}{dt}\big[s(4)\big]=0$.

  - id: W-5.2-03
    level: basic
    objectives: [OBJ-5.2-2]
    prompt: >-
      $y=x^3$, $x=2$ ו-$dx=0.1$. חשבו את $dy$ ואת $\Delta y$, ואת ההפרש ביניהם. איזה חלק של ההפרש בא מ-$(dx)^2$?
    answer: >-
      $dy=1.2$, $\Delta y=1.261$, ההפרש $0.061=6(dx)^2+(dx)^3=0.06+0.001$.
    solution:
      - kind: idea
        text: >-
          $dy$ הוא השינוי לאורך המשיק, $f'(x)\,dx$; $\Delta y$ הוא השינוי האמיתי, $f(x+dx)-f(x)$. כדי לראות ממה בנוי ההפרש,
          פותחים את $(2+dx)^3$.
      - kind: computation
        text: >-
          $f'(x)=3x^2$, $f'(2)=12$, ולכן $dy=12\cdot0.1=1.2$.
      - kind: computation
        text: >-
          $\Delta y=2.1^3-8=9.261-8=1.261$.
      - kind: step
        text: >-
          בכלל: $(2+dx)^3-8=12\,dx+6(dx)^2+(dx)^3$. האיבר הראשון הוא $dy$, והשאר הוא ההפרש: $6\cdot0.01+0.001=0.061$.
          החלק של $(dx)^2$ הוא $0.06$, וכמעט כל ההפרש.
      - kind: check
        text: >-
          $1.2+0.061=1.261$. ועם $dx=0.01$ ההפרש הוא $6\cdot0.0001+0.000001\approx0.0006$: $dx$ קטן פי 10, וההפרש כמעט פי 100.
      - kind: result
        text: >-
          $dy=1.2$, $\Delta y=1.261$, $\Delta y-dy=0.061$, מתוכם $0.06$ מ-$6(dx)^2$.

  - id: W-5.2-04
    level: mid
    objectives: [OBJ-5.2-2]
    prompt: >-
      הרדיוס של דסקית עגולה נמדד: $r=5$ ס״מ, בשגיאה של עד $0.02$ ס״מ. העריכו בעזרת דיפרנציאל את השגיאה המקסימלית בשטח
      $A=\pi r^2$, ואת השגיאה היחסית בשטח. השוו לשגיאה היחסית ברדיוס.
    answer: >-
      $dA=0.2\pi\approx0.628$ סמ״ר; שגיאה יחסית $0.8\%$, פי 2 מ-$0.4\%$ ברדיוס.
    solution:
      - kind: idea
        text: >-
          השגיאה בשטח היא בערך $dA=A'(r)\,dr$. $A$ הוא קבוע כפול $r^2$, ולכן השגיאה היחסית מוכפלת במעריך 2.
      - kind: computation
        text: >-
          $A'(r)=\pi\cdot2r=2\pi r$ (כלל הקבוע), ו-$A'(5)=10\pi$. לכן $dA=10\pi\cdot0.02=0.2\pi\approx0.628$ סמ״ר.
      - kind: computation
        text: >-
          $A(5)=25\pi$, והשגיאה היחסית $\frac{0.2\pi}{25\pi}=0.008=0.8\%$. ברדיוס: $\frac{0.02}{5}=0.4\%$.
      - kind: check
        text: >-
          $\frac{dA}{A}=2\,\frac{dr}{r}=2\cdot0.4\%$. והשינוי המדויק: $\pi(5.02^2-25)=0.2004\pi\approx0.6296$, קרוב ל-$0.628$.
      - kind: result
        text: >-
          השגיאה בשטח עד כ-$0.63$ סמ״ר, כלומר $0.8\%$: פי 2 מהשגיאה היחסית ברדיוס.

  - id: W-5.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-5.2-1]
    prompt: >-
      הקירוב הלינארי של $\sqrt x$ ליד 1 הוא $L(x)=1+\frac{x-1}{2}$.

      (א) הראו, בלי מחשבון, ש-$L(x)\ge\sqrt x$ לכל $x>0$: הקירוב אף פעם אינו קטן מהשורש.

      (ב) באיזה משני המספרים הקירוב טוב יותר: $\sqrt{1.2}$ או $\sqrt{0.8}$? נמקו, ואחר כך בדקו במחשבון.
    answer: >-
      (א) $L(x)^2-x=\frac{(x-1)^2}{4}\ge0$. (ב) ב-$\sqrt{1.2}$: השגיאה $\frac{(x-1)^2}{4(L+\sqrt x)}$, ובשני המקרים המונה זהה
      והמכנה גדול יותר ב-1.2. שגיאות: כ-$0.0046$ מול כ-$0.0056$.
    solution:
      - kind: idea
        text: >-
          שני מספרים חיוביים משווים דרך הריבועים שלהם: אם $L>0$ ו-$L^2\ge x$, אז $L\ge\sqrt x$. ואת השגיאה עצמה כותבים
          בכפל בצמוד, כמו בגזירת $\sqrt x$ בשיעור 5.1: מכפילים ומחלקים ב-$L+\sqrt x$, ומקבלים
          $L-\sqrt x=\frac{L^2-x}{L+\sqrt x}$.
      - kind: computation
        text: >-
          (א) עם $h=x-1$: $L^2-x=\left(1+\frac h2\right)^2-(1+h)=1+h+\frac{h^2}{4}-1-h=\frac{h^2}{4}\ge0$. כש-$x>0$ גם
          $L=\frac{x+1}{2}>0$, ולכן $L\ge\sqrt x$, עם שוויון רק ב-$x=1$.
      - kind: step
        text: >-
          (ב) $L-\sqrt x=\frac{h^2/4}{L+\sqrt x}$. ב-$x=1.2$ וב-$x=0.8$ המונה זהה, $\frac{0.04}{4}=0.01$. המכנה גדול יותר ב-1.2
          (שם $L$ ו-$\sqrt x$ גדולים יותר), ולכן שם השגיאה קטנה יותר.
      - kind: computation
        text: >-
          $L(1.2)=1.1$, $\sqrt{1.2}=1.095445\ldots$, שגיאה כ-$0.00455$. $L(0.8)=0.9$, $\sqrt{0.8}=0.894427\ldots$, שגיאה כ-$0.00557$.
      - kind: check
        text: >-
          $\frac{0.01}{1.1+1.0954}\approx0.00455$ ו-$\frac{0.01}{0.9+0.8944}\approx0.00557$: הנוסחה מסכימה עם המחשבון.
      - kind: result
        text: >-
          הקירוב תמיד גדול מהשורש או שווה לו, והוא טוב יותר ב-$\sqrt{1.2}$ מאשר ב-$\sqrt{0.8}$.

  - id: W-5.2-06
    level: mid
    qualitative: true
    objectives: [OBJ-5.2-1, OBJ-5.2-2]
    prompt: >-
      (א) השתמשו בקירוב הלינארי של $\sin\theta$ ליד 0 כדי להעריך את $\sin2^\circ$.

      (ב) סטודנטית כתבה: "$\sin\theta\approx\theta$, ולכן $\sin2^\circ\approx2$". מה הטעות, ואיך יודעים מיד שהתוצאה לא
      ייתכן?

      (ג) מטוטלת נמשכת הצידה בזווית של $2^\circ$. בכמה אחוזים, בערך, $\theta$ ו-$\sin\theta$ נבדלים זה מזה?
    answer: >-
      (א) $\sin2^\circ\approx\frac{\pi}{90}\approx0.034907$. (ב) $\theta$ חייבת להיות ברדיאנים; וסינוס אף פעם אינו גדול מ-1.
      (ג) בכ-$0.02\%$.
    solution:
      - kind: idea
        text: >-
          ב-0 השיפוע של $\sin$ הוא 1, כי מנת ההפרשים שם היא $\frac{\sin h}{h}\to1$ (שיעור 4.6, $h$ ברדיאנים). לכן המשיק הוא
          $y=\theta$, וקירוב הזווית הקטנה נכון רק כשהזווית ברדיאנים.
      - kind: computation
        text: >-
          (א) $2^\circ=2\cdot\frac{\pi}{180}=\frac{\pi}{90}\approx0.034907$ רדיאן, ולכן $\sin2^\circ\approx0.034907$.
      - kind: step
        text: >-
          (ב) הסטודנטית הציבה את מספר המעלות, 2, במקום הזווית ברדיאנים. ותוצאה 2 בלתי אפשרית: $|\sin\theta|\le1$ לכל זווית.
          הקירוב גדול פי $\frac{180}{\pi}\approx57$ מהנכון.
      - kind: computation
        text: >-
          (ג) במחשבון $\sin2^\circ=0.0348995\ldots$. ההפרש $0.034907-0.0348995\approx7.1\cdot10^{-6}$, ויחסית לסינוס
          $\frac{7.1\cdot10^{-6}}{0.0349}\approx0.0002=0.02\%$.
      - kind: check
        text: >-
          בשיעור 4.6: ב-$10^\circ$ המנה $\frac{\sin\theta}{\theta}$ כ-$0.9949$, הפרש של כחצי אחוז. ב-$2^\circ$ ההפרש קטן בהרבה,
          כצפוי מקירוב שהשגיאה שלו קטנה מהר יותר מהצעד.
      - kind: result
        text: >-
          $\sin2^\circ\approx0.0349$ (ברדיאנים!), וההפרש בין $\theta$ ל-$\sin\theta$ כ-$0.02\%$.

  - id: W-5.2-07
    level: mid
    objectives: [OBJ-5.2-3, OBJ-5.2-1]
    prompt: >-
      על פונקציה $y=f(x)$ ידוע רק: $f(2)=5$ ו-$\left.\frac{dy}{dx}\right|_{x=2}=-3$.

      (א) כתבו את משוואת המשיק ב-$x=2$.

      (ב) העריכו את $f(2.1)$ ואת $f(1.95)$.

      (ג) מה הערך של $\frac{d}{dx}\big[f(2)\big]$?
    answer: >-
      (א) $y=-3x+11$. (ב) $f(2.1)\approx4.7$, $f(1.95)\approx5.15$. (ג) 0.
    solution:
      - kind: idea
        text: >-
          $\left.\frac{dy}{dx}\right|_{x=2}$ הוא $f'(2)$ בסימון אחר: השיפוע. עם נקודה ושיפוע יש משיק, ועם המשיק קירוב לינארי. לא
          צריך לדעת את $f$ עצמה.
      - kind: computation
        text: >-
          (א) $y=5+(-3)(x-2)=-3x+11$.
      - kind: computation
        text: >-
          (ב) $f(2.1)\approx5-3\cdot0.1=4.7$. $f(1.95)\approx5-3\cdot(-0.05)=5.15$.
      - kind: step
        text: >-
          (ג) $f(2)=5$ הוא מספר, ולכן $\frac{d}{dx}\big[f(2)\big]=\frac{d}{dx}\big[5\big]=0$. זה **אינו** $f'(2)$.
      - kind: check
        text: >-
          המשיק עובר ב-$(2,5)$: $11-3\cdot2=5$. ובכיוון: הנגזרת שלילית, ולכן מימין ל-2 הערך קטן (4.7) ומשמאל גדל (5.15).
      - kind: result
        text: >-
          $y=-3x+11$; $f(2.1)\approx4.7$, $f(1.95)\approx5.15$; $\frac{d}{dx}\big[f(2)\big]=0$.

  - id: W-5.2-08
    level: exam
    objectives: [OBJ-5.2-1]
    prompt: >-
      $f(x)=x^3-3x$.

      (א) מצאו את כל המשיקים לגרף של $f$ שמקבילים לישר $y=9x$.

      (ב) מצאו את המשיקים האופקיים.

      (ג) כל אחד מהמשיקים של (א) פוגש את הגרף בנקודה נוספת. מצאו אותה.
    answer: >-
      (א) $y=9x-16$ (ב-$x=2$) ו-$y=9x+16$ (ב-$x=-2$). (ב) $y=-2$ (ב-$x=1$) ו-$y=2$ (ב-$x=-1$). (ג) $x=-4$ ו-$x=4$.
    solution:
      - kind: idea
        text: >-
          ישרים מקבילים הם ישרים עם אותו שיפוע. לכן מחפשים את הנקודות שבהן $f'(x)=9$ (ובמשיק אופקי $f'(x)=0$), ואז כותבים
          משיק בכל אחת. כדי למצוא חיתוך נוסף משווים את $f$ למשיק: נקודת ההשקה היא שורש **כפול**.
      - kind: computation
        text: >-
          $f'(x)=3x^2-3$ (סכום, וכלל הקבוע). (א) $3x^2-3=9$, כלומר $x^2=4$ ו-$x=\pm2$. $f(2)=2$, ולכן $y=2+9(x-2)=9x-16$.
          $f(-2)=-8+6=-2$, ולכן $y=-2+9(x+2)=9x+16$.
      - kind: computation
        text: >-
          (ב) $3x^2-3=0$, כלומר $x=\pm1$. $f(1)=-2$ ו-$f(-1)=2$: המשיקים $y=-2$ ו-$y=2$.
      - kind: computation
        text: >-
          (ג) ההפרש בין הגרף למשיק ב-2: $x^3-3x-(9x-16)=x^3-12x+16$. נקודת ההשקה $x=2$ היא שורש כפול שלו, ולכן
          $x^3-12x+16=(x-2)^2(x+c)$. משווים את המקדמים החופשיים: בצד ימין $(-2)^2\cdot c=4c$, ולכן $4c=16$ ו-$c=4$. החיתוך
          הנוסף ב-$x=-4$.
      - kind: computation
        text: >-
          המשיק ב-$x=-2$: $x^3-3x-(9x+16)=x^3-12x-16=(x+2)^2(x+c)$. המקדמים החופשיים: $4c=-16$, ולכן $c=-4$, הגורם $(x-4)$, והחיתוך
          הנוסף ב-$x=4$.
      - kind: check
        text: >-
          פתיחת סוגריים: $(x-2)^2(x+4)=(x^2-4x+4)(x+4)=x^3-12x+16$. ובנקודות: $f(-4)=-64+12=-52=9(-4)-16$, ו-$f(4)=64-12=52=9\cdot4+16$.
      - kind: result
        text: >-
          המשיקים המקבילים $y=9x\mp16$, האופקיים $y=\mp2$, והחיתוכים הנוספים ב-$x=\mp4$.

  - id: W-5.2-09
    level: exam
    objectives: [OBJ-5.2-2]
    prompt: >-
      מפעל מייצר קופסאות בצורת קובייה שצריכות להכיל 1000 סמ״ק, בסטייה של עד $1\%$ בנפח.

      (א) בעזרת דיפרנציאל, באיזו שגיאה מותר לחתוך את הצלע?

      (ב) בדקו את התשובה: מה הנפח המדויק של קובייה שהצלע שלה גדולה ב-$\frac{1}{30}$ ס״מ?
    answer: >-
      (א) שגיאה יחסית של עד $\frac13\%$ בצלע: $da\le\frac{1}{30}\approx0.033$ ס״מ. (ב) $\left(10+\frac{1}{30}\right)^3\approx1010.03$ סמ״ק,
      מעט מעל הגבול: הדיפרנציאל הוא הערכה.
    solution:
      - kind: idea
        text: >-
          זו שאלת שגיאה "הפוכה": נתונה השגיאה המותרת בתוצאה, ומחפשים את השגיאה המותרת במדידה. ל-$V=a^3$:
          $\frac{dV}{V}=3\,\frac{da}{a}$, ולכן $\frac{da}{a}=\frac13\cdot\frac{dV}{V}$.
      - kind: computation
        text: >-
          (א) $a=\sqrt[3]{1000}=10$ ס״מ. $\frac{da}{a}\le\frac13\cdot1\%$, ולכן $da\le\frac{10}{300}=\frac{1}{30}\approx0.033$ ס״מ:
          שליש מילימטר.
      - kind: step
        text: >-
          בדרך ישירה: $dV=3a^2\,da=300\,da$, והדרישה $300\,da\le10$ (אחוז אחד מ-1000) נותנת אותה תשובה.
      - kind: computation
        text: >-
          (ב) $\left(10+\frac{1}{30}\right)^3=1010.0334\ldots$: חריגה של $10.03$ סמ״ק, מעט מעל 10. ההפרש בא מהאיברים
          $3a(da)^2+(da)^3$ שהדיפרנציאל משמיט.
      - kind: check
        text: >-
          $3a(da)^2=30\cdot\frac{1}{900}\approx0.0333$, ועוד $(da)^3\approx0.00004$: יחד בדיוק החריגה, $0.0334$. לכן במפעל כדאי לקחת מרווח ביטחון קטן, למשל $0.03$ ס״מ.
      - kind: result
        text: >-
          בערך $\frac{1}{30}$ ס״מ, כלומר שגיאה יחסית של שליש אחוז בצלע.

  - id: W-5.2-10
    level: exam
    qualitative: true
    objectives: [OBJ-5.2-1, OBJ-5.2-3]
    prompt: >-
      שלושה סטודנטים כתבו את המשיק לגרף של $f(x)=\frac1x$ בנקודה $x=-1$:

      סטודנט א׳: $y=-x$. סטודנט ב׳: $y=-1-\frac{1}{x^2}(x+1)$. סטודנט ג׳: $y=-1+(x+1)$.

      (א) מצאו את הטעות של כל אחד, וכתבו את המשיק הנכון.

      (ב) מצאו את כל הנקודות על הגרף של $\frac1x$ שבהן המשיק עובר דרך הנקודה $(1,0)$.
    answer: >-
      (א) א׳: ישר דרך הראשית, לא דרך $(-1,-1)$. ב׳: שיפוע כפונקציה, יוצא לא ישר. ג׳: סימן שגוי בשיפוע. הנכון: $y=-x-2$.
      (ב) רק $\left(\frac12,2\right)$, עם המשיק $y=-4x+4$.
    solution:
      - kind: idea
        text: >-
          משיק הוא ישר דרך $(a,f(a))$ עם השיפוע **המספרי** $f'(a)$. כל אחת משלוש הדרישות (הנקודה, השיפוע כמספר, ערך השיפוע)
          נבדקת לחוד. ב-(ב) נקודת ההשקה לא ידועה: כותבים משיק כללי ודורשים שיעבור ב-$(1,0)$.
      - kind: computation
        text: >-
          המשיק הנכון: $f(-1)=-1$, $f'(x)=-\frac{1}{x^2}$, ולכן $f'(-1)=-\frac{1}{1}$, כלומר מינוס 1. $y=-1-(x+1)=-x-2$.
      - kind: step
        text: >-
          (א) א׳: לשיפוע מינוס 1 צדק, אבל $y=-x$ נותן ב-$x=-1$ את הערך 1, ולא מינוס 1: הישר לא עובר בנקודת ההשקה. ב׳: השאיר
          את $f'(x)$ כפונקציה של $x$ במקום להציב $x=-1$; יצא ביטוי שאינו ישר. ג׳: חישב $f'(-1)=1$, אולי כי $(-1)^2=1$ ושכח את המינוס שלפני השבר.
      - kind: computation
        text: >-
          (ב) המשיק בנקודה $a\ne0$: $y=\frac1a-\frac{1}{a^2}(x-a)=\frac{2}{a}-\frac{x}{a^2}$. הצבת $(1,0)$: $\frac2a-\frac{1}{a^2}=0$,
          כלומר $2a-1=0$, ו-$a=\frac12$. המשיק: $y=4-4x$.
      - kind: check
        text: >-
          הצבה $x=-1$ במשיק הנכון נותנת $1-2$, כלומר מינוס 1: הוא עובר ב-$(-1,-1)$. ב-(ב): $4-4\cdot1=0$, ו-$4-4\cdot\frac12=2=f\!\left(\frac12\right)$.
      - kind: result
        text: >-
          המשיק ב-$x=-1$ הוא $y=-x-2$; המשיק היחיד דרך $(1,0)$ הוא $y=-4x+4$, בנקודה $\left(\frac12,2\right)$.

challenge:
  - id: W-5.2-c1
    stars: 1
    objectives: [OBJ-5.2-1]
    prompt: >-
      המשיק לגרף של $y=\frac1x$ בנקודה כלשהי, יחד עם שני הצירים, יוצר משולש.

      (א) הוכיחו שהשטח של המשולש הוא 2, בכל נקודה ברביע הראשון.

      (ב) הוכיחו שנקודת ההשקה היא בדיוק אמצע היתר (הקטע של המשיק שבין שני הצירים).

      (ג) מה קורה בנקודה על הענף שברביע השלישי?
    answer: >-
      (א) המשיק ב-$\left(a,\frac1a\right)$ חותך את הצירים ב-$(2a,0)$ וב-$\left(0,\frac2a\right)$, והשטח $\frac12\cdot2a\cdot\frac2a=2$.
      (ב) אמצע הקטע הוא $\left(a,\frac1a\right)$. (ג) אותו דבר: גם שם השטח 2.
    solution:
      - kind: idea
        text: >-
          כותבים את המשיק בנקודה כללית $\left(a,\frac1a\right)$, עם $a$ כפרמטר, ומוצאים את החיתוכים שלו עם הצירים. אלה צלעות
          המשולש. הפלא הוא ש-$a$ מתקצר.
      - kind: computation
        text: >-
          $f(a)=\frac1a$ ו-$f'(a)=-\frac{1}{a^2}$ (שיעור 5.1). המשיק: $y=\frac1a-\frac{1}{a^2}(x-a)=\frac2a-\frac{x}{a^2}$.
      - kind: computation
        text: >-
          חיתוך עם ציר ה-$y$ ($x=0$): $y=\frac2a$. חיתוך עם ציר ה-$x$ ($y=0$): $\frac{x}{a^2}=\frac2a$, כלומר $x=2a$.
      - kind: computation
        text: >-
          (א) כש-$a>0$ המשולש ברביע הראשון, עם ניצבים $2a$ ו-$\frac2a$. השטח $\frac12\cdot2a\cdot\frac2a=2$, בלי תלות ב-$a$.
      - kind: computation
        text: >-
          (ב) אמצע הקטע בין $(2a,0)$ ל-$\left(0,\frac2a\right)$: $\left(\frac{2a+0}{2},\frac{0+2/a}{2}\right)=\left(a,\frac1a\right)$,
          נקודת ההשקה.
      - kind: step
        text: >-
          (ג) כש-$a<0$ שני החיתוכים שליליים, $2a<0$ ו-$\frac2a<0$, והמשולש ברביע השלישי. האורכים $|2a|$ ו-$\left|\frac2a\right|$,
          והשטח שוב $\frac12\cdot|2a|\cdot\frac{2}{|a|}=2$. וגם (ב) נשאר נכון, באותו חישוב.
      - kind: check
        text: >-
          ב-$a=1$: המשיק $y=2-x$, המשולש עם קודקודים $(0,0)$, $(2,0)$, $(0,2)$, שטח 2, ואמצע היתר $(1,1)$. ב-$a=4$: $y=\frac12-\frac{x}{16}$,
          חיתוכים 8 ו-$\frac12$, שטח $\frac12\cdot8\cdot\frac12=2$.
      - kind: result
        text: >-
          השטח תמיד 2, ונקודת ההשקה היא תמיד אמצע היתר, בשני הענפים.
    source:
      name: 'MIT OpenCourseWare, 18.01SC Single Variable Calculus (Fall 2010)'
      year: 2010
      problem: 'Unit 1, Session 2, "A Harder Problem": the triangle formed by the axes and a tangent to y = 1/x; parts (ב) and (ג) added'
      url: https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/647e09bf25d96528720344251aea8e8a_MIT18_01SCF10_Ses2b.pdf
      verified: '2026-11-27'
      adapted: true

  - id: W-5.2-c2
    stars: 1
    objectives: [OBJ-5.2-2]
    prompt: >-
      חתיכת מסטיק לעיסה בנפח של 4 סמ״ק מנפחים לבועה כדורית שהרדיוס הפנימי שלה 10 ס״מ. כל המסטיק נמצא בקליפה שבין הרדיוס
      הפנימי לרדיוס החיצוני.

      (א) העריכו בעזרת דיפרנציאל את העובי של הקליפה.

      (ב) מצאו נוסחה מדויקת לעובי.

      (ג) כמה ספרות משמעותיות של התשובה המדויקת נכונות בהערכה של (א)? הסבירו למה ההערכה גדולה מהערך המדויק.
    answer: >-
      (א) $\frac{1}{100\pi}\approx0.0031831$ ס״מ. (ב) $t=\sqrt[3]{1000+\frac{3}{\pi}}-10\approx0.0031821$ ס״מ. (ג) שלוש: ההפרש כ-$10^{-6}$
      ס״מ, יחסית כ-$0.03\%$. ההערכה גדולה כי הדיפרנציאל משמיט איברים חיוביים.
    solution:
      - kind: idea
        text: >-
          נפח הקליפה הוא ההפרש בין נפחי שני כדורים: $\Delta V$ כשהרדיוס עולה מ-10 ל-$10+t$. כש-$t$ קטן, $\Delta V\approx dV=V'(r)\,dr$,
          כלומר שטח הפנים כפול העובי. מהמשוואה $dV=4$ מחלצים את העובי.
      - kind: computation
        text: >-
          (א) $V(r)=\frac43\pi r^3$, ולכן $V'(r)=4\pi r^2$ (כלל הקבוע והנגזרת של $r^3$). ב-$r=10$: $V'(10)=400\pi$. הדרישה
          $400\pi\,t\approx4$ נותנת $t\approx\frac{1}{100\pi}\approx0.0031831$ ס״מ, כ-$0.03$ מילימטר.
      - kind: computation
        text: >-
          (ב) בדיוק: $\frac43\pi\left((10+t)^3-1000\right)=4$, כלומר $(10+t)^3=1000+\frac{3}{\pi}$, ולכן
          $t=\sqrt[3]{1000+\frac{3}{\pi}}-10\approx0.00318209$ ס״מ.
      - kind: step
        text: >-
          (ג) ההפרש $0.00318310-0.00318209\approx1.0\cdot10^{-6}$ ס״מ, שגיאה יחסית של כ-$0.03\%$: שלוש הספרות המשמעותיות
          הראשונות, $3.18$, נכונות. הסיבה שההערכה גדולה: $(10+t)^3-1000=300t+30t^2+t^3$, והדיפרנציאל שומר רק את $300t$.
          האיברים שהושמטו חיוביים, ולכן כדי להגיע לאותו נפח, ה-$t$ האמיתי צריך להיות קצת קטן יותר.
      - kind: check
        text: >-
          $\frac{30t^2}{300t}=\frac{t}{10}\approx3\cdot10^{-4}$: בדיוק השגיאה היחסית שנמדדה. ויחידות: סמ״ק חלקי סמ״ר הם ס״מ.
      - kind: result
        text: >-
          העובי כ-$\frac{1}{100\pi}\approx0.00318$ ס״מ; הערך המדויק $\sqrt[3]{1000+\frac{3}{\pi}}-10$, ושלוש ספרות משמעותיות נכונות.
