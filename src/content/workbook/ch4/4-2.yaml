# Workbook of lesson 4.2 — shifts and stretches of graphs, graphical solutions, parity and period.
# Objectives (src/course.ts):
#   OBJ-4.2-1  sketch the graph of a shift, stretch or reflection of a function from its graph
#   OBJ-4.2-2  solve graphically f(x) = c or f(x) = g(x) and estimate the number of solutions
#   OBJ-4.2-3  recognise even, odd and periodic functions from the formula and from the graph
# Only lesson 4.2 and earlier: no derivatives, no limits beyond intuition, no Taylor.
# Every number recomputed with sympy in screens/tools/lesson-4-2.py.
lesson: '4.2'
practice:
  - id: W-4.2-01
    level: basic
    objectives: [OBJ-4.2-1]
    prompt: >-
      על הגרף של $y=x^2$ מבצעים כל אחת מרשימות הפעולות הבאות. כתבו את הנוסחה שמתקבלת ואת הקודקוד.

      (א) הזזה 2 יחידות שמאלה ו-3 יחידות למעלה.

      (ב) שיקוף ביחס לציר $x$, ואחר כך הזזה 4 יחידות למעלה. איפה הגרף חותך את ציר $x$?

      (ג) מתיחה פי 3 לרוחב. באיזו מתיחה לגובה מקבלים בדיוק אותו גרף?

      (ד) הזזה יחידה אחת ימינה, ואחר כך כיווץ פי 2 לרוחב (לעבר ציר $y$).
    answer: >-
      (א) $y=(x+2)^2+3$, קודקוד $(-2,3)$; (ב) $y=4-x^2$, קודקוד $(0,4)$, חיתוכים ב-$x=\pm2$; (ג) $y=\frac{x^2}{9}$,
      כמו כיווץ לגובה פי 9 (כפל ב-$\frac19$); (ד) $y=(2x-1)^2$, קודקוד $\left(\frac12,0\right)$.
    solution:
      - kind: idea
        text: >-
          כל פעולה פועלת על הנוסחה הנוכחית. פעולה לרוחב מחליפה את $x$: הזזה ימינה ב-$a$ מחליפה $x$ ב-$x-a$, ומתיחה פי
          $b$ מחליפה $x$ ב-$\frac xb$. פעולה לגובה פועלת על כל הנוסחה: מוסיפים מספר, או כופלים. את הקודקוד עוקבים כנקודה
          בולטת.
      - kind: computation
        text: >-
          (א) שמאלה ב-2 היא הזזה ימינה במינוס 2: $x$ מוחלף ב-$x+2$. אחר כך מוסיפים 3: $y=(x+2)^2+3$. הקודקוד $(0,0)$ עבר
          אל $(-2,3)$.
      - kind: computation
        text: >-
          (ב) השיקוף נותן $y=-x^2$, וההזזה $y=-x^2+4=4-x^2$. הקודקוד $(0,4)$. חיתוך עם ציר $x$: $4-x^2=0$, כלומר
          $x=\pm2$.
      - kind: computation
        text: >-
          (ג) מחליפים $x$ ב-$\frac x3$: $y=\left(\frac x3\right)^2=\frac{x^2}{9}$. זה גם $\frac19\cdot x^2$, כלומר כפל
          הערכים ב-$\frac19$: כיווץ פי 9 לגובה. הקודקוד נשאר $(0,0)$.
      - kind: computation
        text: >-
          (ד) אחרי ההזזה $(x-1)^2$. הכיווץ פי 2 מחליף **כל** $x$ ב-$2x$: $y=(2x-1)^2$. הקודקוד איפה שמה שבסוגריים
          מתאפס: $2x-1=0$, כלומר $x=\frac12$. ההזזה התכווצה גם היא, מ-1 ל-$\frac12$.
      - kind: check
        text: >-
          (ד) נקודה נוספת: בגרף של $(x-1)^2$ הנקודה $(2,1)$. בכיווץ פי 2 היא עוברת אל $(1,1)$, ואכן $(2\cdot1-1)^2=1$.
          (ג) הנקודה $(1,1)$ של $x^2$ עוברת במתיחה אל $(3,1)$, ואכן $\frac{9}{9}=1$.
      - kind: result
        text: >-
          (א) $y=(x+2)^2+3$; (ב) $y=4-x^2$, חיתוכים $x=\pm2$; (ג) $y=\frac{x^2}{9}$, כיווץ פי 9 לגובה; (ד) $y=(2x-1)^2$,
          קודקוד $\left(\frac12,0\right)$.

  - id: W-4.2-02
    level: basic
    qualitative: true
    objectives: [OBJ-4.2-3]
    prompt: >-
      (א) קבעו לכל פונקציה אם היא זוגית, אי-זוגית, או לא זה ולא זה, ונמקו: $x^5-x$, $x^2+x$, $\cos x+x^2$,
      $\sin x\cos x$, $\frac{x^3}{x^2-4}$, $\sqrt x$.

      (ב) הגרף של פונקציה אי-זוגית עובר בנקודה $(2,3)$. באיזו נקודה נוספת הוא בהכרח עובר? ואם הפונקציה זוגית?
    answer: >-
      (א) אי-זוגית, לא זה ולא זה, זוגית, אי-זוגית, אי-זוגית, לא זה ולא זה. (ב) באי-זוגית: $(-2,-3)$; בזוגית: $(-2,3)$.
    solution:
      - kind: idea
        text: >-
          לפי ההגדרה: בודקים שהתחום סימטרי סביב 0, מציבים מינוס $x$ ומשווים ל-$f(x)$ ולמינוס $f(x)$. לשלילה מספיקה נקודה
          אחת.
      - kind: computation
        text: >-
          $(-x)^5-(-x)=-x^5+x=-(x^5-x)$: אי-זוגית. ל-$x^2+x$: $f(1)=2$ ו-$f(-1)=0$; 0 אינו 2 ואינו מינוס 2, ולכן לא זה
          ולא זה. $\cos(-x)+(-x)^2=\cos x+x^2$: זוגית.
      - kind: computation
        text: >-
          $\sin(-x)\cos(-x)=(-\sin x)\cos x$: אי-זוגית (אי-זוגית כפול זוגית). $\frac{x^3}{x^2-4}$: התחום, כל $x\ne\pm2$,
          סימטרי, ו-$\frac{(-x)^3}{(-x)^2-4}=\frac{-x^3}{x^2-4}$: אי-זוגית. $\sqrt x$ מוגדרת רק כש-$x\ge0$: התחום אינו
          סימטרי, ולכן לא זה ולא זה.
      - kind: computation
        text: >-
          (ב) אי-זוגית: $f(-2)=-f(2)=-3$, הנקודה $(-2,-3)$. זוגית: $f(-2)=f(2)=3$, הנקודה $(-2,3)$.
      - kind: check
        text: >-
          בציור: הנקודה $(-2,-3)$ מתקבלת מ-$(2,3)$ בחצי סיבוב סביב הראשית, ו-$(-2,3)$ היא השיקוף שלה בציר $y$.
      - kind: result
        text: >-
          $x^5-x$ אי-זוגית; $x^2+x$ לא זה ולא זה; $\cos x+x^2$ זוגית; $\sin x\cos x$ אי-זוגית; $\frac{x^3}{x^2-4}$
          אי-זוגית; $\sqrt x$ לא זה ולא זה. (ב) $(-2,-3)$, ובזוגית $(-2,3)$.

  - id: W-4.2-03
    level: basic
    objectives: [OBJ-4.2-2]
    prompt: >-
      שרטטו באותה מערכת צירים את $y=|x|$ ואת $y=2-x^2$, וקבעו לפי הציור כמה פתרונות יש למשוואה $|x|=2-x^2$. אחר כך
      מצאו אותם בדיוק.
    answer: >-
      שני פתרונות: $x=1$ ו-$x=-1$.
    solution:
      - kind: idea
        text: >-
          פתרון גרפי: סופרים את נקודות החיתוך של ה-V עם הפרבולה ההפוכה. שתי הפונקציות זוגיות, ולכן מספיק לפתור כש-$x\ge0$
          ולשקף.
      - kind: step
        text: >-
          הציור: הפרבולה $2-x^2$ יורדת מהשיא $(0,2)$ וחותכת את ציר $x$ ב-$\pm\sqrt2$. ה-V עולה מ-$(0,0)$. ב-$x=0$
          הפרבולה מעל (2 מול 0); ב-$x=\sqrt2$ היא כבר מתחת (0 מול $\sqrt2$). חיתוך אחד מימין, ובגלל הסימטריה עוד אחד
          משמאל.
      - kind: computation
        text: >-
          כש-$x\ge0$: $x=2-x^2$, כלומר $x^2+x-2=0$, $(x+2)(x-1)=0$. הפתרון $x=-2$ נפסל (הנחנו $x\ge0$), ונשאר $x=1$. לפי
          הזוגיות גם $x=-1$.
      - kind: check
        text: >-
          $|1|=1$ ו-$2-1=1$; $|-1|=1$ ו-$2-1=1$. ומי שלא היה פוסל את מינוס 2 היה בודק: $|-2|=2$ ואילו $2-4=-2$. אינו פתרון.
      - kind: result
        text: >-
          שני פתרונות, $x=\pm1$.

  - id: W-4.2-04
    level: mid
    objectives: [OBJ-4.2-1]
    prompt: >-
      על חבל נע פולס שצורתו בכל רגע היא $y(x,t)=\frac{4}{1+(x-3t)^2}$ (מקום $x$ במטרים, זמן $t$ בשניות).

      (א) איפה השיא של הפולס ב-$t=0$ וב-$t=2$, ומה גובהו?

      (ב) לאיזה כיוון נע הפולס, ובאיזו מהירות?

      (ג) מהקצה השני של החבל יוצא פולס שני, $y_2(x,t)=\frac{4}{1+(x+3t-12)^2}$. לאן הוא נע? מתי ואיפה נפגשים השיאים?

      (ד) סטודנט טוען שהפולס $g(2x-6t)$ נע במהירות 6, "כי זה המקדם של $t$". צדק?
    answer: >-
      (א) ב-$x=0$ וב-$x=6$, בגובה 4; (ב) ימינה, 3 מטרים לשנייה; (ג) שמאלה במהירות 3; נפגשים ב-$t=2$, ב-$x=6$;
      (ד) לא: $2x-6t=2(x-3t)$, והמהירות 3.
    solution:
      - kind: idea
        text: >-
          לכל $t$ קבוע, $f(x-vt)$ היא הגרף של $f$ מוזז $vt$ ימינה. השיא של $\frac{4}{1+u^2}$ הוא ב-$u=0$, ולכן השיא של
          הפולס נמצא איפה שמה שבסוגריים מתאפס.
      - kind: computation
        text: >-
          (א) $x-3t=0$, כלומר $x=3t$: ב-$t=0$ השיא ב-$x=0$, וב-$t=2$ ב-$x=6$. הגובה $\frac{4}{1+0}=4$ בכל רגע: ההזזה
          אינה משנה גבהים.
      - kind: computation
        text: >-
          (ב) מקום השיא $x=3t$ גדל ב-3 מטרים בכל שנייה: הפולס נע ימינה במהירות 3 מטרים לשנייה.
      - kind: computation
        text: >-
          (ג) $x+3t-12=x-(12-3t)$: השיא ב-$x=12-3t$, שקטן ב-3 בכל שנייה. הפולס נע שמאלה במהירות 3, ויוצא מ-$x=12$.
          נפגשים כש-$3t=12-3t$, כלומר $t=2$, במקום $x=6$.
      - kind: step
        text: >-
          (ד) מוציאים את המקדם של $x$, כמו בסדר הפעולות של השיעור: $g(2x-6t)=g\big(2(x-3t)\big)$. בכל רגע זה הגרף של
          $g(2x)$, כלומר $g$ מכווצת פי 2, מוזז $3t$ ימינה. המהירות היא 3, לא 6. המקדם 2 של $x$ משנה את רוחב הפולס, לא את
          מהירותו.
      - kind: check
        text: >-
          (א) ב-$t=0$ ו-$x=1$ הגובה $\frac{4}{1+1}=2$; ב-$t=2$ אותו גובה מתקבל ב-$x=7$, שש יחידות ימינה, כמו שהזזה ב-6
          צריכה לתת. (ד) השיא של $g(2x-6t)$ ב-$2x-6t=0$, כלומר $x=3t$: מהירות 3.
      - kind: result
        text: >-
          (א) $x=0$ ו-$x=6$, גובה 4; (ב) ימינה, 3 מטרים לשנייה; (ג) שמאלה, נפגשים ב-$t=2$ ב-$x=6$; (ד) לא, המהירות 3.

  - id: W-4.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-4.2-1]
    prompt: >-
      שלושה סטודנטים תיארו איך מתקבל הגרף של $y=\sqrt{4-2x}$ מהגרף של $y=\sqrt x$.

      סטודנט א׳: "הזזה 4 שמאלה, שיקוף ביחס לציר $y$, ואז כיווץ פי 2 לרוחב."

      סטודנטית ב׳: "כיווץ פי 2 לרוחב, שיקוף ביחס לציר $y$, ואז הזזה 2 ימינה."

      סטודנט ג׳: "כיווץ פי 2 לרוחב, הזזה 4 שמאלה, ואז שיקוף ביחס לציר $y$."

      מי צודק? בדקו כל תיאור בבנייה של הנוסחה צעד אחר צעד, ובנקודת ההתחלה של הגרף.
    answer: >-
      א׳ ו-ב׳ צודקים; ג׳ מקבל $\sqrt{8-2x}$, שמתחיל ב-$x=4$ ולא ב-$x=2$.
    solution:
      - kind: idea
        text: >-
          כל פעולה לרוחב מחליפה את $x$ בנוסחה הנוכחית: הזזה ימינה ב-$a$ מחליפה $x$ ב-$x-a$, שיקוף ביחס לציר $y$ מחליף
          $x$ ב-$(-x)$, כיווץ פי 2 מחליף $x$ ב-$2x$. נקודה בולטת לבדיקה: נקודת ההתחלה של השורש, איפה שמה שבתוכו מתאפס.
          ב-$\sqrt{4-2x}$ זו $x=2$, והתחום $x\le2$.
      - kind: computation
        text: >-
          א׳: $\sqrt x$, אחר כך $\sqrt{x+4}$, אחר כך $\sqrt{-x+4}$, ולבסוף $\sqrt{-2x+4}$. זה $\sqrt{4-2x}$. נקודת ההתחלה: 0, אחרי ההזזה מינוס 4,
          אחרי השיקוף 4, אחרי הכיווץ 2.
      - kind: computation
        text: >-
          ב׳: $\sqrt x$, אחר כך $\sqrt{2x}$, אחר כך $\sqrt{-2x}$, ולבסוף $\sqrt{-2(x-2)}=\sqrt{4-2x}$. נכון גם כן. נקודת ההתחלה: 0, 0, 0, ואחרי
          ההזזה 2.
      - kind: computation
        text: >-
          ג׳: $\sqrt x$, אחר כך $\sqrt{2x}$, אחר כך $\sqrt{2(x+4)}$, ולבסוף $\sqrt{2(-x+4)}=\sqrt{8-2x}$. נקודת ההתחלה 4. הטעות: ההזזה נעשתה
          **אחרי** הכיווץ, ולכן היא לא התכווצה; כדי להגיע ל-$\sqrt{4-2x}$ בסדר הזה צריך להזיז רק 2 שמאלה.
      - kind: check
        text: >-
          בנקודה נוספת: ב-$x=0$ הערך הנכון הוא $\sqrt4=2$. בנוסחה של ג׳ יוצא $\sqrt8\approx2.83$. ולפי הצורה
          $\sqrt{-2(x-2)}$ של ב׳: $b=-\frac12$ ו-$a=2$, כלומר כיווץ פי 2 עם שיקוף, ואחריהם הזזה 2 ימינה.
      - kind: result
        text: >-
          א׳ וב׳ צודקים (יש יותר מסדר נכון אחד). ג׳ טועה: הוא מקבל $\sqrt{8-2x}$.

  - id: W-4.2-06
    level: mid
    objectives: [OBJ-4.2-2]
    prompt: >-
      (א) הסבירו בעזרת הגרפים של $y=e^{-x}$ ושל $y=x$ למה למשוואה $e^{-x}=x$ יש פתרון אחד בדיוק.

      (ב) מצאו בין אילו שני מספרים עם שתי ספרות אחרי הנקודה העשרונית הוא נמצא. (מחשבון מותר.)
    answer: >-
      (א) $e^{-x}$ יורדת ו-$x$ עולה, ולכן יש לכל היותר חיתוך אחד; ב-$x=0$ האקספוננט מעל, וב-$x=1$ מתחת, ולכן יש חיתוך.
      (ב) בין 0.56 ל-0.57 (בערך 0.5671).
    solution:
      - kind: idea
        text: >-
          פונקציה יורדת ופונקציה עולה נחתכות לכל היותר פעם אחת: אחרי החיתוך הראשונה רק יורדת והשנייה רק עולה, והן מתרחקות.
          קיום החיתוך: מחפשים החלפת סדר בין הגרפים.
      - kind: step
        text: >-
          (א) $e^{-x}$ היא השיקוף של $e^x$ ביחס לציר $y$, ולכן היא יורדת. $y=x$ עולה. ב-$x=0$: $e^{0}=1>0$, האקספוננט מעל
          הישר. ב-$x=1$: $e^{-1}\approx0.368<1$, מתחת. הסדר התחלף, ולכן יש חיתוך בין 0 ל-1, ובגלל העלייה והירידה הוא
          היחיד.
      - kind: computation
        text: >-
          (ב) מצמצמים את הקטע: $e^{-0.5}\approx0.607>0.5$ (מעל), $e^{-0.6}\approx0.549<0.6$ (מתחת). ואז
          $e^{-0.56}\approx0.5712>0.56$ (מעל) ו-$e^{-0.57}\approx0.5655<0.57$ (מתחת). הפתרון בין 0.56 ל-0.57.
      - kind: check
        text: >-
          פתרון מספרי נותן $x\approx0.5671$, ובאמת $e^{-0.5671}\approx0.5671$.
      - kind: result
        text: >-
          פתרון יחיד, בין 0.56 ל-0.57.

  - id: W-4.2-07
    level: mid
    objectives: [OBJ-4.2-3]
    prompt: >-
      מצאו את המחזור של כל פונקציה. ב-(א), (ג) ו-(ד) נמקו גם למה מספר חיובי קטן יותר אינו מחזור; ב-(ב) השתמשו
      בעובדה מהשיעור על המחזור של סכום גלים.

      (א) $\cos\frac{\pi x}{2}$

      (ב) $\sin3x+\sin2x$

      (ג) $|\sin x|$

      (ד) $\tan\frac x2$
    answer: >-
      (א) 4; (ב) $2\pi$; (ג) $\pi$; (ד) $2\pi$.
    solution:
      - kind: idea
        text: >-
          ל-$f(\omega x)$ עם $\omega>0$ המחזור הוא המחזור של $f$ חלקי $\omega$. לסכום של גלים, הכפולה המשותפת הקטנה ביותר של המחזורים.
          כדי לשלול כל מחזור קטן יותר, מציבים נקודה נוחה, כמו $x=0$, ובודקים אילו $T$ בכלל אפשריים.
      - kind: computation
        text: >-
          (א) $\omega=\frac\pi2$, והמחזור $\frac{2\pi}{\pi/2}=4$. בדיקה: $\cos\frac{\pi(x+4)}{2}=\cos\left(\frac{\pi x}2+2\pi\right)$.
          ואין מחזור קטן יותר: אם $T$ מחזור, אז ב-$x=0$ מתקיים $\cos\frac{\pi T}{2}=\cos0=1$, ולכן $\frac{\pi T}{2}$ כפולה
          של $2\pi$, כלומר $T$ כפולה של 4. המחזור החיובי הקטן ביותר הוא 4.
      - kind: computation
        text: >-
          (ב) המחזורים $\frac{2\pi}{3}$ ו-$\pi$. הכפולה המשותפת הקטנה ביותר: $2\pi=3\cdot\frac{2\pi}3=2\cdot\pi$. לפי העובדה
          מהשיעור, שמשתמשים בה בלי הוכחה, זה המחזור. להמחשה, $\pi$ (המחזור של המחובר השני) אינו מחזור של הסכום: $\sin3(x+\pi)=-\sin3x$ ו-$\sin2(x+\pi)=\sin2x$, ולכן בהזזה ב-$\pi$ הסכום נעשה
          $-\sin3x+\sin2x$. ב-$x=\frac\pi6$ זה $-1+\frac{\sqrt3}{2}$ במקום $1+\frac{\sqrt3}{2}$.
      - kind: computation
        text: >-
          (ג) $|\sin(x+\pi)|=|-\sin x|=|\sin x|$: $\pi$ הוא מחזור. מספר $T$ בין 0 ל-$\pi$ אינו מחזור: $|\sin0|=0$, ואילו
          $|\sin T|>0$. בגרף: הערך המוחלט משקף למעלה כל גבעה שלילית, והגבעות חוזרות כל $\pi$.
      - kind: computation
        text: >-
          (ד) המחזור של $\tan x$ הוא $\pi$, ולכן של $\tan\frac x2$, עם $\omega=\frac12$, הוא $\frac{\pi}{1/2}=2\pi$. מספר $T$
          בין 0 ל-$2\pi$ אינו מחזור: $\tan0=0$, ואילו $\tan\frac T2\ne0$ כי $\frac T2$ בין 0 ל-$\pi$ ואינו מתאפס שם.
      - kind: check
        text: >-
          (ב) $2\pi$ באמת מחזיר את שני המחוברים: $3\cdot2\pi=6\pi$ ו-$2\cdot2\pi=4\pi$, שתיהן כפולות של $2\pi$.
      - kind: result
        text: >-
          (א) 4; (ב) $2\pi$; (ג) $\pi$; (ד) $2\pi$.

  - id: W-4.2-08
    level: exam
    objectives: [OBJ-4.2-1, OBJ-4.2-2, OBJ-4.2-3]
    prompt: >-
      $g$ היא פונקציה זוגית, מחזורית עם מחזור 2, שמקיימת $g(x)=x$ לכל $x$ בקטע $[0,1]$.

      (א) מצאו נוסחה ל-$g$ בקטע $[-1,0]$ ובקטע $[1,2]$, ושרטטו את הגרף בקטע $[-3,5]$.

      (ב) חשבו את $g(-0.3)$, $g(1.5)$, $g(7.25)$ ו-$g(-10)$.

      (ג) כמה פתרונות יש למשוואה $g(x)=\frac x5$? מצאו את כולם.
    answer: >-
      (א) $g(x)=-x$ ב-$[-1,0]$, $g(x)=2-x$ ב-$[1,2]$; הגרף הוא גל משולש בין 0 ל-1. (ב) $0.3$, $0.5$, $0.75$, $0$.
      (ג) חמישה: $x=0,\ \frac53,\ \frac52,\ \frac{10}3,\ 5$.
    solution:
      - kind: idea
        text: >-
          הזוגיות משקפת את הקטע הידוע אל $[-1,0]$, והמחזוריות מעתיקה את $[-1,1]$ ימינה ושמאלה בצעדים של 2. כדי לחשב
          ערך, מזיזים את $x$ בכפולה של 2 אל $[-1,1]$. את המשוואה פותרים גרפית: ישר דרך הראשית מול גל משולש.
      - kind: computation
        text: >-
          (א) ב-$[-1,0]$: $g(x)=g(-x)=-x$, כי $-x\in[0,1]$. יחד: $g(x)=|x|$ ב-$[-1,1]$. ב-$[1,2]$: $x-2\in[-1,0]$, ולכן
          $g(x)=g(x-2)=|x-2|=2-x$. הגרף: קטעים ישרים שעולים מ-0 ל-1 ויורדים חזרה, עם שיאים 1 בכל מספר אי-זוגי ואפסים בכל
          מספר זוגי.
      - kind: computation
        text: >-
          (ב) $g(-0.3)=|-0.3|=0.3$. $g(1.5)=g(1.5-2)=g(-0.5)=0.5$. $g(7.25)=g(7.25-8)=g(-0.75)=0.75$. $g(-10)=g(0)=0$.
      - kind: step
        text: >-
          (ג) הגבולות: $0\le g\le1$. כש-$x<0$ הישר $\frac x5$ שלילי ואין חיתוך; כש-$x>5$ הוא מעל 1 ואין חיתוך. ב-$x=0$:
          $g(0)=0$, פתרון. נשאר הקטע $(0,5]$, ובו פותרים קטע אחר קטע, כי בכל קטע בין שני שלמים $g$ היא ישר.
      - kind: computation
        text: >-
          ב-$(0,1]$: $x=\frac x5$ רק ב-0, אין פתרון נוסף. ב-$[1,2]$: $2-x=\frac x5$, כלומר $x=\frac53$. ב-$[2,3]$:
          $x-2=\frac x5$, כלומר $x=\frac52$. ב-$[3,4]$: $4-x=\frac x5$, כלומר $x=\frac{10}3$. ב-$[4,5]$: $x-4=\frac x5$,
          כלומר $x=5$, בקצה, שם $g(5)=1=\frac55$.
      - kind: check
        text: >-
          כל פתרון בתוך הקטע שלו: $\frac53\approx1.67$, $2.5$, $\frac{10}{3}\approx3.33$, 5. הצבה: $g\left(\frac53\right)=2-\frac53=\frac13=\frac{5/3}{5}$.
          בדיקה מספרית על רשת צפופה ב-$[-2,7]$ מוצאת אותם חמישה אפסים.
      - kind: result
        text: >-
          (ב) $0.3$, $0.5$, $0.75$, $0$; (ג) חמישה פתרונות: $0,\ \frac53,\ \frac52,\ \frac{10}3,\ 5$.

  - id: W-4.2-09
    level: exam
    objectives: [OBJ-4.2-2, OBJ-4.2-3]
    prompt: >-
      תהי $h(x)=x^2-4|x|$.

      (א) הראו ש-$h$ זוגית, ושרטטו אותה בעזרת הגרף שלה ב-$x\ge0$.

      (ב) מצאו, לכל מספר ממשי $k$, את מספר הפתרונות של $h(x)=k$.
    answer: >-
      (א) $h(-x)=h(x)$; ב-$x\ge0$, $h(x)=(x-2)^2-4$; הגרף צורת W עם מינימום מינוס 4 ב-$x=\pm2$ וגבעה בגובה 0 ב-0.
      (ב) $k<-4$: אין; $k=-4$: שניים; $-4<k<0$: ארבעה; $k=0$: שלושה; $k>0$: שניים.
    solution:
      - kind: idea
        text: >-
          פונקציה זוגית נקבעת לפי החצי הימני שלה: משרטטים את $x\ge0$ ומשקפים בציר $y$. את מספר הפתרונות סופרים בחיתוך עם
          ישר אופקי, ומשתמשים בכך שכל פתרון חיובי בא עם בן זוג שלילי.
      - kind: computation
        text: >-
          (א) $h(-x)=(-x)^2-4|-x|=x^2-4|x|$: זוגית. כש-$x\ge0$: $h(x)=x^2-4x=(x-2)^2-4$, פרבולה עם קודקוד $(2,-4)$
          שמתחילה ב-$h(0)=0$ וחוצה את ציר $x$ ב-$x=4$. השיקוף מוסיף קודקוד ב-$(-2,-4)$ ואפס במינוס 4.
      - kind: computation
        text: >-
          (ב) פותרים ב-$x\ge0$: $(x-2)^2=k+4$. כש-$k<-4$ אין פתרון. כש-$k=-4$: $x=2$ בלבד. כש-$k>-4$: $x=2\pm\sqrt{k+4}$,
          ושני אלה אינם שליליים כש-$\sqrt{k+4}\le2$, כלומר $k\le0$. כש-$k>0$ רק $2+\sqrt{k+4}$ חיובי.
      - kind: step
        text: >-
          מוסיפים את בני הזוג השליליים, וזהירים עם $x=0$, שהוא בן הזוג של עצמו: $k<-4$: אין פתרון. $k=-4$: $\pm2$, שניים.
          $-4<k<0$: שני פתרונות חיוביים ושני שליליים, ארבעה. $k=0$: $x=0$ ו-$x=4$, ובן הזוג מינוס 4, שלושה. $k>0$: אחד חיובי
          ואחד שלילי, שניים.
      - kind: check
        text: >-
          $k=-3$: $x^2-4x=-3$ נותן $x=1,3$, ובני הזוג מינוס 1, מינוס 3: ארבעה. $k=5$: $x^2-4x-5=(x-5)(x+1)$, רק $x=5$
          חיובי, ועם $-5$ שניים.
      - kind: result
        text: >-
          $k<-4$: 0; $k=-4$: 2; $-4<k<0$: 4; $k=0$: 3; $k>0$: 2.

  - id: W-4.2-10
    level: exam
    qualitative: true
    objectives: [OBJ-4.2-1]
    prompt: >-
      לכל טענה על פונקציה $f$ קבעו אם היא נכונה לכל $f$. טענה שגויה הפריכו בדוגמה.

      (א) הזזה 1 ימינה ואחריה מתיחה פי 2 לרוחב נותנות אותו גרף כמו מתיחה פי 2 לרוחב ואחריה הזזה 1 ימינה.

      (ב) הזזה אופקית והזזה אנכית אפשר לבצע בכל סדר.

      (ג) מתיחה פי 3 לגובה והזזה 1 למעלה אפשר לבצע בכל סדר.

      (ד) שיקוף ביחס לציר $y$ ואחריו הזזה 2 ימינה נותנים את $f(2-x)$.

      (ה) אם הגרף של $f(x-a)$ מתלכד עם הגרף של $f$ עבור מספר $a\ne0$, אז $f$ מחזורית.
    answer: >-
      (א) לא נכון; (ב) נכון; (ג) לא נכון; (ד) נכון; (ה) נכון.
    solution:
      - kind: idea
        text: >-
          כותבים את שתי הנוסחאות, כל פעולה על הנוסחה הנוכחית, ומשווים. לדוגמה נגדית לוקחים $f(x)=x^2$ ובודקים את
          הקודקוד.
      - kind: computation
        text: >-
          (א) הזזה ואז מתיחה: $f(x-1)$, ואחרי המתיחה $f\left(\frac x2-1\right)=f\left(\frac{x-2}{2}\right)$, הזזה של 2. מתיחה ואז
          הזזה: $f\left(\frac{x-1}{2}\right)$, הזזה של 1. ל-$x^2$ הקודקודים ב-2 וב-1. לא נכון.
      - kind: computation
        text: >-
          (ב) $f(x-a)+c$ בשני הסדרים: ההזזה האופקית נוגעת רק ב-$x$, והאנכית רק בערך. נכון.
      - kind: computation
        text: >-
          (ג) מתיחה ואז הזזה: $3f(x)+1$. הזזה ואז מתיחה: $3\big(f(x)+1\big)=3f(x)+3$. ל-$x^2$ הקודקודים $(0,1)$ ו-$(0,3)$.
          לא נכון.
      - kind: computation
        text: >-
          (ד) השיקוף נותן $f(-x)$, וההזזה מחליפה **כל** $x$ ב-$x-2$: $f\big(-(x-2)\big)=f(2-x)$. נכון. (בסדר ההפוך,
          הזזה ואז שיקוף, יוצא $f(-x-2)$, גרף אחר.)
      - kind: computation
        text: >-
          (ה) ההתלכדות אומרת $f(x-a)=f(x)$ לכל $x$. מציבים $x=y+a$: $f(y)=f(y+a)$ לכל $y$. לכן $|a|$ מקיים את הגדרת
          המחזוריות (אם $a<0$, מציבים $y-a$ במקום $y$ ומקבלים את אותו שוויון עם מינוס $a$). נכון.
      - kind: check
        text: >-
          (ד) ל-$f(x)=\sqrt x$: השיקוף $\sqrt{-x}$ מתחיל ב-0 ופונה שמאלה; אחרי הזזה 2 ימינה הוא מתחיל ב-2. ואכן $\sqrt{2-x}$
          מוגדרת בדיוק כש-$x\le2$.
      - kind: result
        text: >-
          (א) לא נכון; (ב) נכון; (ג) לא נכון; (ד) נכון; (ה) נכון.

challenge:
  - id: W-4.2-c1
    stars: 1
    objectives: [OBJ-4.2-2, OBJ-4.2-3]
    prompt: >-
      כמה פתרונות ממשיים יש למשוואה $\frac{x}{100}=\sin x$ (הזווית ברדיאנים)?
    answer: >-
      63.
    solution:
      - kind: idea
        text: >-
          פתרון גרפי: הישר $y=\frac{x}{100}$ מול גל הסינוס. מצמצמים את התחום לפי התמונה של הסינוס, משתמשים בכך ששני הצדדים
          אי-זוגיים כדי לספור רק $x>0$, ואחר כך סופרים "גבעה" אחר "גבעה" של הסינוס.
      - kind: step
        text: >-
          כי $|\sin x|\le1$, פתרון מקיים $\left|\frac{x}{100}\right|\le1$, כלומר $|x|\le100$. שני האגפים אי-זוגיים, ולכן
          אם $x_0$ פתרון גם מינוס $x_0$ פתרון. $x=0$ הוא פתרון. נשאר לספור את הפתרונות החיוביים, ולהכפיל ב-2 ולהוסיף 1.
      - kind: step
        text: >-
          כש-$0<x\le100$ הישר בין 0 ל-1. לכן אין חיתוך איפה שהסינוס שלילי, בקטעים $(\pi,2\pi)$, $(3\pi,4\pi)$ וכן הלאה.
          החיתוכים נמצאים רק בגבעות החיוביות $[2m\pi,(2m+1)\pi]$, שבהן הסינוס עולה מ-0 ל-1 (בשיא, באמצע) ויורד ל-0.
      - kind: computation
        text: >-
          הגבעה הראשונה, $[0,\pi]$: ליד 0 הסינוס מעל הישר (למשל $\sin\frac\pi2=1>\frac{\pi}{200}$), וב-$\pi$ הוא 0, מתחת
          לישר: חיתוך חיובי אחד. בכל גבעה אחרת שכולה לפני 100: בקצוות הסינוס 0, מתחת לישר; בשיא 1, מעל הישר: חיתוך אחד
          בעלייה ואחד בירידה. הגבעה $m=15$ היא $[30\pi,31\pi]$, ו-$31\pi\approx97.39<100$: כולה בתחום. הגבעה הבאה מתחילה
          ב-$32\pi\approx100.53>100$, מעבר לתחום.
      - kind: computation
        text: >-
          חיתוכים חיוביים: 1 בגבעה הראשונה, ו-2 בכל אחת מהגבעות $m=1,\dots,15$: $1+2\cdot15=31$. בסך הכול
          $2\cdot31+1=63$.
      - kind: check
        text: >-
          מה שהציור לבדו אינו מוכיח: שבכל גבעה אין **יותר** משני חיתוכים. הסיבה היא הצורה של הגבעה, "קעורה" (כל מיתר
          מתחת לקשת), וישר חותך קשת כזו לכל היותר פעמיים; נוכיח את הקעירות בפרק 5. בדיקה מספרית על רשת צפופה ב-$[-101,101]$
          מוצאת בדיוק 63 החלפות סימן של $\sin x-\frac{x}{100}$.
      - kind: result
        text: >-
          63 פתרונות.
    source:
      name: '32nd Annual High School Mathematics Examination (AHSME, Mathematical Association of America), as posted on Po-Shen Loh''s past-contests site'
      year: 1981
      problem: 'Problem 18'
      url: https://live.poshenloh.com/past-contests/amc12/1981/problem/18
      verified: '2026-11-26'
      adapted: true

  - id: W-4.2-c2
    stars: 2
    objectives: [OBJ-4.2-3]
    prompt: >-
      $f$ היא פונקציה ממשית שמוגדרת לכל $x$, ויש מספר $a>0$ שעבורו

      $$f(x+a)=\frac12+\sqrt{f(x)-f(x)^2}$$

      לכל $x$ ממשי.

      (א) הוכיחו ש-$f$ מחזורית.

      (ב) תנו דוגמה לפונקציה כזו שאינה קבועה, עם $a=1$.
    answer: >-
      (א) $f(x+2a)=f(x)$ לכל $x$, כלומר $2a$ הוא מחזור. (ב) למשל $f(x)=\frac12+\frac12\left|\cos\frac{\pi x}{2}\right|$, או
      $f=1$ על $[0,1)$ ו-$f=\frac12$ על $[1,2)$, מורחבת במחזור 2.
    solution:
      - kind: idea
        text: >-
          מפעילים את השוויון פעמיים ורואים ש"צעד כפול" מחזיר את הערך. כדי שהשורש ייפתח יפה, מזיזים את הפונקציה ב-$\frac12$
          למטה: $g=f-\frac12$. ההזזה הזו הופכת את השוויון לסימטרי.
      - kind: step
        text: >-
          תחת השורש יש מספר שאינו שלילי, ולכן אגף ימין לפחות $\frac12$: $f(x+a)\ge\frac12$ לכל $x$. כש-$x$ עובר על כל
          הישר, גם $x+a$ עובר על כל הישר, ולכן $f\ge\frac12$ בכל מקום. נסמן $g=f-\frac12$; אז $g\ge0$.
      - kind: computation
        text: >-
          מציבים $f=\frac12+g$: $f-f^2=\frac12+g-\left(\frac14+g+g^2\right)=\frac14-g^2$. השוויון נעשה
          $g(x+a)=\sqrt{\frac14-g(x)^2}$, ובריבוע: $g(x+a)^2=\frac14-g(x)^2$.
      - kind: computation
        text: >-
          מפעילים פעמיים: $g(x+2a)^2=\frac14-g(x+a)^2=\frac14-\left(\frac14-g(x)^2\right)=g(x)^2$. שני הצדדים של
          $g(x+2a)=\sqrt{g(x)^2}$ אינם שליליים, ולכן $g(x+2a)=|g(x)|=g(x)$. כלומר $f(x+2a)=f(x)$ לכל $x$: $f$ מחזורית,
          ו-$2a$ הוא מחזור.
      - kind: computation
        text: >-
          (ב) צריך $g\ge0$ עם $g(x+1)^2+g(x)^2=\frac14$. הזהות $\cos^2+\sin^2=1$ מציעה $g(x)=\frac12\left|\cos\frac{\pi x}2\right|$:
          אז $g(x+1)=\frac12\left|\cos\left(\frac{\pi x}{2}+\frac\pi2\right)\right|=\frac12\left|\sin\frac{\pi x}2\right|$,
          והסכום של הריבועים הוא $\frac14$. לכן $f(x)=\frac12+\frac12\left|\cos\frac{\pi x}{2}\right|$, עם מחזור 2.
      - kind: check
        text: >-
          הדוגמה של המקור, פונקציית מדרגות: $f=1$ על $[0,1)$ ו-$f=\frac12$ על $[1,2)$, במחזור 2. מ-$f=1$:
          $\frac12+\sqrt{1-1}=\frac12$; מ-$f=\frac12$: $\frac12+\sqrt{\frac12-\frac14}=1$. ובדוגמה הרציפה, בדיקה מספרית
          ב-200 נקודות אקראיות מאשרת את השוויון.
      - kind: result
        text: >-
          (א) $f(x+2a)=f(x)$ לכל $x$, ולכן $f$ מחזורית. (ב) $f(x)=\frac12+\frac12\left|\cos\frac{\pi x}{2}\right|$.
