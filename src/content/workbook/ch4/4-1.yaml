# Workbook of lesson 4.1 — function: domain, graph, image and composition.
# Objectives (src/course.ts):
#   OBJ-4.1-1  find the domain and the image of a given function
#   OBJ-4.1-2  compose functions, find the domain of a composition, decompose a complicated function
#   OBJ-4.1-3  read from a graph values, intervals of increase and decrease, intercepts with the axes
# Only high school and lesson 4.1: increasing/decreasing from the definition (no derivatives), ln from lesson 0.3.
# Every number recomputed with sympy in screens/tools/lesson-4-1.py.
lesson: '4.1'
practice:
  - id: W-4.1-01
    level: basic
    objectives: [OBJ-4.1-1]
    prompt: >-
      מצאו את תחום ההגדרה של כל פונקציה, וכתבו אותו כקטע או כאיחוד של קטעים.

      (א) $f(x)=\sqrt{9-x^2}$

      (ב) $f(x)=\dfrac{1}{x^2+1}$

      (ג) $f(x)=\ln(x^2-4x)$

      (ד) $f(x)=\dfrac{x+1}{x^2-x-6}$
    answer: >-
      (א) $[-3,3]$; (ב) $\mathbb{R}$; (ג) $(-\infty,0)\cup(4,\infty)$; (ד) $\mathbb{R}\setminus\{-2,3\}$.
    solution:
      - kind: idea
        text: >-
          רושמים את התנאי של כל פעולה שעלולה להיכשל: ביטוי בתוך שורש אינו שלילי, ביטוי בתוך $\ln$ חיובי ממש, מכנה שונה
          מ-0. פותרים כל תנאי, ולוקחים את החיתוך.
      - kind: computation
        text: >-
          (א) $9-x^2\ge0$, כלומר $x^2\le9$, כלומר $|x|\le3$. התחום $[-3,3]$, עם שני הקצוות (שם השורש הוא $\sqrt0=0$).
      - kind: computation
        text: >-
          (ב) המכנה $x^2+1\ge1$ לעולם אינו 0. אין תנאי, והתחום $\mathbb{R}$.
      - kind: computation
        text: >-
          (ג) $x^2-4x=x(x-4)>0$. טבלת סימנים: הגורמים מתאפסים ב-0 וב-4; משמאל ל-0 שניהם שליליים (מכפלה חיובית), בין 0
          ל-4 הסימנים שונים (מכפלה שלילית), מימין ל-4 שניהם חיוביים. אי-השוויון חזק, ולכן הקצוות בחוץ:
          $(-\infty,0)\cup(4,\infty)$.
      - kind: computation
        text: >-
          (ד) $x^2-x-6=(x-3)(x+2)\ne0$, כלומר $x\ne3$ וגם $x\ne-2$. המונה אינו מוסיף תנאי. התחום
          $(-\infty,-2)\cup(-2,3)\cup(3,\infty)$.
      - kind: check
        text: >-
          (ג) ב-$x=2$, מתוך הפער: $\ln(4-8)=\ln(-4)$, לא מוגדר. ב-$x=5$: $\ln5$, מוגדר. (א) ב-$x=4$: $\sqrt{-7}$, לא מוגדר.
      - kind: result
        text: >-
          (א) $[-3,3]$; (ב) $\mathbb{R}$; (ג) $(-\infty,0)\cup(4,\infty)$; (ד) $\mathbb{R}\setminus\{-2,3\}$.

  - id: W-4.1-02
    level: basic
    qualitative: true
    objectives: [OBJ-4.1-3]
    prompt: >-
      $f(x)=4-x^2$.

      (א) מצאו את נקודות החיתוך של הגרף עם שני הצירים.

      (ב) באילו קטעים $f$ עולה, ובאילו היא יורדת? בדקו לפי ההגדרה, עם $x_1<x_2$.

      (ג) נכון או לא נכון, ונמקו: מכיוון ש-$f(-1)=f(1)$, הפונקציה אינה עולה ואינה יורדת בקטע $[-1,1]$.
    answer: >-
      (א) $(0,4)$, $(-2,0)$ ו-$(2,0)$. (ב) עולה ב-$(-\infty,0]$, יורדת ב-$[0,\infty)$. (ג) נכון.
    solution:
      - kind: idea
        text: >-
          חיתוך עם ציר $y$: מציבים $x=0$. חיתוך עם ציר $x$: פותרים $f(x)=0$. עלייה וירידה: מפרקים את ההפרש
          $f(x_2)-f(x_1)$ לגורמים ובודקים את הסימן שלו.
      - kind: computation
        text: >-
          (א) $f(0)=4$: הנקודה $(0,4)$. $4-x^2=0$ כש-$x=\pm2$: הנקודות $(-2,0)$ ו-$(2,0)$.
      - kind: computation
        text: >-
          (ב) $f(x_2)-f(x_1)=x_1^2-x_2^2=(x_1-x_2)(x_1+x_2)$. כש-$x_1<x_2$ הגורם הראשון שלילי. אם שתי הנקודות ב-$(-\infty,0]$,
          אז $x_1+x_2<0$, וההפרש חיובי: $f$ עולה. אם שתיהן ב-$[0,\infty)$, אז $x_1+x_2>0$, וההפרש שלילי: $f$ יורדת.
      - kind: step
        text: >-
          (ג) נכון. אילו $f$ הייתה עולה ב-$[-1,1]$, היה מתקיים $f(-1)<f(1)$; אילו הייתה יורדת, $f(-1)>f(1)$. אבל
          $f(-1)=3=f(1)$, ולכן אף אחת מהאפשרויות אינה מתקיימת. מ-(ב) רואים את הסיבה: בתוך הקטע, ב-$x=0$, הכיוון מתהפך.
      - kind: check
        text: >-
          במספרים: $f(-1)=3<f(0)=4$ (עולה), ו-$f(0)=4>f(1)=3$ (יורדת). הגרף פרבולה הפוכה עם קודקוד $(0,4)$.
      - kind: result
        text: >-
          (א) $(0,4)$, $(\pm2,0)$; (ב) עולה ב-$(-\infty,0]$ ויורדת ב-$[0,\infty)$; (ג) נכון: ערכים שווים בשתי נקודות
          שונות סותרים גם עלייה וגם ירידה.

  - id: W-4.1-03
    level: basic
    objectives: [OBJ-4.1-2]
    prompt: >-
      $f(x)=2x+3$ ו-$g(x)=x^2$.

      (א) חשבו את $f(g(1))$ ואת $g(f(1))$.

      (ב) כתבו נוסחאות ל-$f(g(x))$, ל-$g(f(x))$ ול-$f(f(x))$.
    answer: >-
      (א) $f(g(1))=5$, $g(f(1))=25$. (ב) $f(g(x))=2x^2+3$, $g(f(x))=(2x+3)^2=4x^2+12x+9$, $f(f(x))=4x+9$.
    solution:
      - kind: idea
        text: >-
          מבפנים החוצה: מחשבים את הפונקציה הפנימית, ואת התוצאה מציבים בחיצונית. בנוסחה, מציבים את כל הביטוי של הפנימית
          במקום המשתנה של החיצונית.
      - kind: computation
        text: >-
          (א) $g(1)=1$, ולכן $f(g(1))=f(1)=5$. בסדר ההפוך $f(1)=5$, ולכן $g(f(1))=g(5)=25$.
      - kind: computation
        text: >-
          (ב) $f(g(x))=2\cdot g(x)+3=2x^2+3$. $g(f(x))=\big(f(x)\big)^2=(2x+3)^2=4x^2+12x+9$.
          $f(f(x))=2(2x+3)+3=4x+9$.
      - kind: check
        text: >-
          מציבים $x=1$ בנוסחאות: $2+3=5$ ו-$4+12+9=25$, כמו ב-(א). ו-$f(f(1))=f(5)=13=4+9$.
      - kind: result
        text: >-
          $f(g(1))=5$, $g(f(1))=25$; $f(g(x))=2x^2+3$, $g(f(x))=4x^2+12x+9$, $f(f(x))=4x+9$.

  - id: W-4.1-04
    level: mid
    objectives: [OBJ-4.1-1]
    prompt: >-
      מצאו את התמונה של כל פונקציה.

      (א) $f(x)=3-x^2$

      (ב) $f(x)=\dfrac{1}{x^2+1}$

      (ג) $f(x)=\dfrac{2x+1}{x-3}$

      (ד) $f(x)=x^2$ על הקטע $[-3,1]$
    answer: >-
      (א) $(-\infty,3]$; (ב) $(0,1]$; (ג) $\mathbb{R}\setminus\{2\}$; (ד) $[0,9]$.
    solution:
      - kind: idea
        text: >-
          $c$ בתמונה כשלמשוואה $f(x)=c$ יש פתרון בתחום. מבודדים את $x$ ורושמים לאילו $c$ זה אפשרי. על קטע: בודקים גם את
          הנקודה שבה הפונקציה מחליפה כיוון, לא רק את הקצוות.
      - kind: computation
        text: >-
          (א) $3-x^2=c$ פירושו $x^2=3-c$, ויש פתרון בדיוק כש-$3-c\ge0$, כלומר $c\le3$. התמונה $(-\infty,3]$.
      - kind: computation
        text: >-
          (ב) $x^2+1\ge1$, ולכן $0<\frac{1}{x^2+1}\le1$. כל $c$ ב-$(0,1]$ מתקבל: $\frac{1}{x^2+1}=c$ פירושו
          $x^2=\frac1c-1\ge0$. הערך 0 אינו מתקבל (שבר שהמונה שלו 1). התמונה $(0,1]$.
      - kind: computation
        text: >-
          (ג) $\frac{2x+1}{x-3}=c$ פירושו $2x+1=cx-3c$, כלומר $x(2-c)=-3c-1$, ו-$x=\frac{3c+1}{c-2}$, לכל $c\ne2$. צריך
          לבדוק שזה אינו 3: $\frac{3c+1}{c-2}=3$ נותן $3c+1=3c-6$, בלתי אפשרי. ל-$c=2$ המשוואה היא $2x+1=2x-6$, כלומר
          $1=-6$: אין פתרון. התמונה $\mathbb{R}\setminus\{2\}$.
      - kind: computation
        text: >-
          (ד) הקטע מכיל את 0, ושם $x^2=0$, הערך הקטן ביותר. הגדול ביותר: $(-3)^2=9$ (ב-1 רק 1). כל ערך בין 0 ל-9 מתקבל
          ב-$x=-\sqrt c$, שנמצא ב-$[-3,0]$. התמונה $[0,9]$.
      - kind: check
        text: >-
          (ג) ל-$c=5$: $x=\frac{16}{3}$, ו-$\frac{2\cdot\frac{16}{3}+1}{\frac{16}{3}-3}=\frac{35/3}{7/3}=5$. (ד) הקצוות לבדם
          נותנים 9 ו-1, ו-$[1,9]$ היה מפספס את הערכים שבין 0 ל-1.
      - kind: result
        text: >-
          (א) $(-\infty,3]$; (ב) $(0,1]$; (ג) $\mathbb{R}\setminus\{2\}$; (ד) $[0,9]$.

  - id: W-4.1-05
    level: mid
    qualitative: true
    objectives: [OBJ-4.1-3]
    prompt: >-
      נכון או לא נכון? נמקו כל טענה, והפריכו טענה שגויה בדוגמה.

      (א) $f(x)=\sqrt{x+1}$ עולה בכל תחום ההגדרה שלה.

      (ב) פונקציה שחיובית בכל נקודה של קטע עולה בקטע הזה.

      (ג) אם $f$ עולה בקטע $[0,1]$ ועולה בקטע $[1,2]$, אז היא עולה בקטע $[0,2]$.

      (ד) אם $f$ עולה בקטע $(-\infty,0)$ ועולה בקטע $(0,\infty)$, אז היא עולה בכל התחום $\mathbb{R}\setminus\{0\}$.
    answer: >-
      (א) נכון; (ב) לא נכון, למשל $\frac1x$ על $(0,\infty)$; (ג) נכון, כי הנקודה 1 משותפת; (ד) לא נכון, למשל $f(x)=-\frac1x$.
    solution:
      - kind: idea
        text: >-
          כל טענה נבדקת מול ההגדרה: $f$ עולה בקטע אם לכל $x_1<x_2$ בו, $f(x_1)<f(x_2)$. לטענה כללית מחפשים נימוק לכל זוג
          נקודות; לטענה חשודה, זוג אחד שמפר אותה.
      - kind: computation
        text: >-
          (א) נכון. התחום $[-1,\infty)$. אם $x_1<x_2$ בתחום, אז $0\le x_1+1<x_2+1$, ושורש של מספר לא שלילי גדול יותר גדול
          יותר: $\sqrt{x_1+1}<\sqrt{x_2+1}$.
      - kind: computation
        text: >-
          (ב) לא נכון. $\frac1x$ חיובית ב-$(0,\infty)$, אבל $\frac11=1>\frac12$: היא יורדת שם. חיובית היא שאלה על הגובה,
          עולה היא שאלה על הכיוון.
      - kind: step
        text: >-
          (ג) נכון. ניקח $x_1<x_2$ ב-$[0,2]$. אם שתיהן באותו חצי, הטענה נתונה. אחרת $x_1<1<x_2$ (או שאחת מהן היא 1), ואז
          $f(x_1)<f(1)$ מהעלייה ב-$[0,1]$ ו-$f(1)<f(x_2)$ מהעלייה ב-$[1,2]$. יחד $f(x_1)<f(x_2)$. הנקודה המשותפת 1
          מחברת את שני החצאים.
      - kind: computation
        text: >-
          (ד) לא נכון. $f(x)=-\frac1x$ עולה בכל אחד מהקטעים: ב-$(0,\infty)$ ראינו זאת בדוגמה 3 בשיעור, וב-$(-\infty,0)$ אותו נימוק עובד, כי אם $x_1<x_2<0$ אז גם $\frac1{x_1}>\frac1{x_2}$ (למשל $\frac{1}{-2}>\frac{1}{-1}$). אבל $f(-1)=1$ ו-$f(1)=-1$: הנקודה מינוס 1 משמאל לנקודה 1, ובכל זאת
          $f(-1)>f(1)$. כאן אין נקודה משותפת שמחברת את שני הקטעים.
      - kind: check
        text: >-
          (ד) במספרים נוספים: $f(-2)=\frac12<f(-1)=1$ (בתוך הקטע השמאלי, עולה), $f(1)=-1<f(2)=-\frac12$ (בתוך הימני,
          עולה), אבל המעבר בין הקטעים יורד.
      - kind: result
        text: >-
          (א) נכון; (ב) לא נכון; (ג) נכון; (ד) לא נכון.

  - id: W-4.1-06
    level: mid
    objectives: [OBJ-4.1-2]
    prompt: >-
      $f(x)=\sqrt x$ ו-$g(x)=x^2-5x+4$.

      (א) מצאו את תחום ההגדרה של $f\circ g$, וחשבו $(f\circ g)(0)$ ו-$(f\circ g)(5)$.

      (ב) כתבו נוסחה ל-$g\circ f$ ומצאו את תחום ההגדרה שלה.

      (ג) מצאו את כל ה-$x$ שבהם $(g\circ f)(x)=0$.
    answer: >-
      (א) $(-\infty,1]\cup[4,\infty)$; $(f\circ g)(0)=(f\circ g)(5)=2$. (ב) $x-5\sqrt x+4$, על $[0,\infty)$. (ג) $x=1$ ו-$x=16$.
    solution:
      - kind: idea
        text: >-
          תחום של הרכבה: $x$ בתחום של הפנימית, והפלט שלה בתחום של החיצונית. ב-(ג) נוח לסמן $s=\sqrt x$, ואז המשוואה
          ריבועית ב-$s$.
      - kind: computation
        text: >-
          (א) $g$ מוגדרת לכל $x$; צריך $g(x)\ge0$. $x^2-5x+4=(x-1)(x-4)\ge0$, ומטבלת סימנים: $x\le1$ או $x\ge4$.
          $g(0)=4$ ו-$f(4)=2$; $g(5)=25-25+4=4$ ושוב $f(4)=2$.
      - kind: computation
        text: >-
          (ב) הפנימית היא $f$, והיא דורשת $x\ge0$; $g$ מקבלת כל קלט. $g(f(x))=(\sqrt x)^2-5\sqrt x+4=x-5\sqrt x+4$, ל-$x\ge0$
          (הפישוט $(\sqrt x)^2=x$ נכון רק שם).
      - kind: computation
        text: >-
          (ג) עם $s=\sqrt x\ge0$: $s^2-5s+4=(s-1)(s-4)=0$, כלומר $s=1$ או $s=4$. שניהם אינם שליליים, ולכן $x=s^2$: $x=1$
          או $x=16$.
      - kind: check
        text: >-
          $g(f(16))=g(4)=16-20+4=0$ ו-$g(f(1))=g(1)=0$. וב-(א), נקודה בפער: $x=2$ נותן $g(2)=-2$, ו-$\sqrt{-2}$ לא מוגדר.
      - kind: result
        text: >-
          (א) $(-\infty,1]\cup[4,\infty)$, והערכים 2 ו-2; (ב) $x-5\sqrt x+4$ על $[0,\infty)$; (ג) $x=1,16$.

  - id: W-4.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-4.1-2]
    prompt: >-
      (א) כתבו כל פונקציה כהרכבה של פונקציות פשוטות, לפי סדר החישוב: $e^{-x^2}$, $\sin^2(3x)$, $\sqrt{1+\ln x}$.

      (ב) סטודנטית כתבה: "$\sin^2(3x)=\sin(3x)\cdot\sin(3x)$, ולכן היא מכפלה ולא הרכבה". סטודנט ענה: "$\sin^2(3x)$ היא
      הרכבה של שלוש פונקציות". מי צודק?

      (ג) האם יש רק דרך אחת לכתוב את $(x^2+1)^5$ כהרכבה של שתי פונקציות? הסבירו.
    answer: >-
      (א) $e^{-x^2}$: קודם $u=-x^2$, אחר כך $e^u$. $\sin^2(3x)$: קודם $3x$, אחר כך $\sin$, ובסוף ריבוע.
      $\sqrt{1+\ln x}$: קודם $\ln x$, אחר כך $1+u$, ובסוף שורש. (ב) שניהם צודקים. (ג) לא, יש יותר מדרך אחת.
    solution:
      - kind: idea
        text: >-
          קוראים את הנוסחה כמו מחשבון: מה מחשבים ראשון (הפונקציה הפנימית ביותר), מה אחר כך, ומה אחרון (החיצונית).
      - kind: computation
        text: >-
          (א) $e^{-x^2}$: קודם $u=-x^2$, אחר כך $e^u$. $\sin^2(3x)=\big(\sin(3x)\big)^2$: קודם $v=3x$, אחר כך $w=\sin v$, ובסוף
          $w^2$. $\sqrt{1+\ln x}$: קודם $u=\ln x$, אחר כך $1+u$, ובסוף שורש.
      - kind: step
        text: >-
          (ב) שניהם צודקים: אותה פונקציה אפשר לראות בשתי דרכים. היא המכפלה של $\sin(3x)$ בעצמה, וגם ההרכבה של "העלאה
          בריבוע" אחרי $\sin(3x)$, שהיא עצמה הרכבה של $\sin$ אחרי $3x$. מה שאסור לחשוב (ושני הסטודנטים לא חשבו) הוא
          שזו מכפלה של $\sin x$ ב-$3x$ או ב-$\sin x$: המשתנה נכנס קודם ל-$3x$, ורק התוצאה נכנסת לסינוס.
      - kind: step
        text: >-
          (ג) לא. $(x^2+1)^5$ היא $u^5$ אחרי $u=x^2+1$, וגם $(v+1)^5$ אחרי $v=x^2$. בוחרים את הפירוק שבו כל חוליה פשוטה
          ומוכרת; בדרך כלל זה הראשון.
      - kind: check
        text: >-
          מציבים נקודה: ב-$x=\frac{\pi}{6}$, $3x=\frac\pi2$, $\sin\frac\pi2=1$, ובריבוע 1. ב-$x=1$: $e^{-1}$, ו-$\sqrt{1+\ln1}=1$.
          בשתי הדרכים של (ג), ב-$x=1$: $2^5=32$.
      - kind: result
        text: >-
          (א) כמו בחישוב; (ב) שניהם צודקים; (ג) יש יותר מפירוק אחד.

  - id: W-4.1-08
    level: exam
    objectives: [OBJ-4.1-1, OBJ-4.1-3]
    prompt: >-
      $f(x)=\dfrac{x}{x^2+1}$.

      (א) מצאו את תחום ההגדרה ואת נקודות החיתוך עם הצירים.

      (ב) מצאו את התמונה של $f$. רמז: לאילו $c$ יש למשוואה $cx^2-x+c=0$ פתרון?

      (ג) הראו ש-$f(x_2)-f(x_1)=\dfrac{(x_2-x_1)(1-x_1x_2)}{(x_1^2+1)(x_2^2+1)}$, והסיקו ש-$f$ עולה בקטע $[-1,1]$ ויורדת
      בקטע $[1,\infty)$.
    answer: >-
      (א) $\mathbb{R}$; חיתוך אחד עם שני הצירים, בראשית. (ב) $\left[-\frac12,\frac12\right]$. (ג) עולה ב-$[-1,1]$, יורדת
      ב-$[1,\infty)$ (וגם ב-$(-\infty,-1]$).
    solution:
      - kind: idea
        text: >-
          לתמונה פותרים $f(x)=c$, שהופכת למשוואה ריבועית ב-$x$; יש פתרון כשהדיסקרימיננטה אינה שלילית. לעלייה מביאים את
          ההפרש למכנה משותף ובודקים את הסימן של כל גורם.
      - kind: computation
        text: >-
          (א) $x^2+1\ge1$, ולכן התחום $\mathbb{R}$. $f(0)=0$, ו-$f(x)=0$ רק כש-$x=0$: הגרף חותך את שני הצירים רק בראשית.
      - kind: computation
        text: >-
          (ב) $\frac{x}{x^2+1}=c$ פירושו $cx^2-x+c=0$. ל-$c=0$ הפתרון $x=0$. ל-$c\ne0$ זו משוואה ריבועית עם דיסקרימיננטה
          $1-4c^2$, ויש פתרון בדיוק כש-$1-4c^2\ge0$, כלומר $|c|\le\frac12$. התמונה $\left[-\frac12,\frac12\right]$.
      - kind: computation
        text: >-
          (ג) מכנה משותף:
          $f(x_2)-f(x_1)=\frac{x_2(x_1^2+1)-x_1(x_2^2+1)}{(x_1^2+1)(x_2^2+1)}$. במונה:
          $x_2x_1^2+x_2-x_1x_2^2-x_1=(x_2-x_1)-x_1x_2(x_2-x_1)=(x_2-x_1)(1-x_1x_2)$.
      - kind: step
        text: >-
          המכנה חיובי, ו-$x_2-x_1>0$, ולכן הסימן של ההפרש הוא הסימן של $1-x_1x_2$. נניח ש-$x_1<x_2$ שניהם ב-$[-1,1]$.
          אם הסימנים שלהם שונים (או שאחד מהם 0), המכפלה $x_1x_2\le0$, ולכן $1-x_1x_2\ge1>0$. אם הסימנים שווים, כל אחד
          מהם בערכו המוחלט לכל היותר 1, ושניהם אינם יכולים להיות שווים ל-1 בערכם המוחלט יחד (כי $x_1\ne x_2$ ובאותו
          סימן), ולכן $x_1x_2=|x_1|\cdot|x_2|<1$. בשני המקרים $1-x_1x_2>0$, ההפרש חיובי, ו-$f$ עולה. אם שניהם ב-$[1,\infty)$ ו-$x_1<x_2$, אז $x_1x_2>1$, ההפרש שלילי,
          ו-$f$ יורדת. אותו נימוק נותן ירידה גם ב-$(-\infty,-1]$.
      - kind: check
        text: >-
          $f(1)=\frac12$ ו-$f(-1)=-\frac12$: הקצוות של התמונה מתקבלים בדיוק בנקודות שבהן הכיוון מתהפך. ו-$f(2)=\frac25<f(1)$,
          $f(3)=\frac3{10}<f(2)$: יורדת.
      - kind: result
        text: >-
          תחום $\mathbb{R}$, חיתוך בראשית; תמונה $\left[-\frac12,\frac12\right]$; עולה ב-$[-1,1]$ ויורדת ב-$[1,\infty)$
          וב-$(-\infty,-1]$.

  - id: W-4.1-09
    level: exam
    qualitative: true
    objectives: [OBJ-4.1-1, OBJ-4.1-2]
    prompt: >-
      בלון כדורי מתנפח, והרדיוס שלו (בסנטימטרים) אחרי $t$ שניות הוא $r(t)=2+t$, מהרגע $t=0$ ועד $t=10$. הנפח של כדור
      ברדיוס $r$ הוא $V(r)=\frac43\pi r^3$.

      (א) כתבו את הנפח כפונקציה של הזמן, כהרכבה. מהו תחום ההגדרה הפיזיקלי שלה?

      (ב) חשבו את הנפח ב-$t=1$, ומצאו מתי הנפח הוא $288\pi$ סנטימטר מעוקב.

      (ג) מהי התמונה של ההרכבה על התחום הפיזיקלי?

      (ד) האם להרכבה בסדר ההפוך, $r(V(t))$, יש משמעות פיזיקלית? הסבירו.
    answer: >-
      (א) $V(r(t))=\frac43\pi(2+t)^3$ על $[0,10]$. (ב) $36\pi$; אחרי 4 שניות. (ג) $\left[\frac{32\pi}{3},2304\pi\right]$.
      (ד) לא: $r$ מצפה לקלט שהוא זמן, ו-$V$ מחזירה נפח.
    solution:
      - kind: idea
        text: >-
          זו שרשרת מדידות: הזמן קובע את הרדיוס, והרדיוס קובע את הנפח. הפונקציה הפנימית היא $r$, והחיצונית $V$. את
          התחום קובע הסיפור, ואת התמונה קובעת העלייה של שתי החוליות.
      - kind: computation
        text: >-
          (א) $V(r(t))=\frac43\pi(2+t)^3$. הנוסחה מוגדרת לכל $t$, אבל הסיפור נותן $0\le t\le10$: התחום הפיזיקלי $[0,10]$.
      - kind: computation
        text: >-
          (ב) $r(1)=3$, ו-$V(3)=\frac43\pi\cdot27=36\pi$. ל-$288\pi$: $\frac43\pi r^3=288\pi$ פירושו $r^3=216$, $r=6$, ומ-$2+t=6$
          מקבלים $t=4$.
      - kind: computation
        text: >-
          (ג) $r$ עולה, ו-$r^3$ עולה כש-$r>0$, ולכן הנפח עולה עם הזמן. הקטן ביותר ב-$t=0$: $\frac43\pi\cdot8=\frac{32\pi}{3}$.
          הגדול ביותר ב-$t=10$: $\frac43\pi\cdot12^3=2304\pi$. כל ערך ביניהם מתקבל, כמו ב-(ב): פותרים לרדיוס ואז לזמן. התמונה
          $\left[\frac{32\pi}{3},2304\pi\right]$.
      - kind: step
        text: >-
          (ד) לא. $V(t)$ כפונקציה של $t$ היא בכלל לא מוגדרת: $V$ מצפה לרדיוס. וגם אילו הצבנו מספר, $r$ מצפה לקלט שהוא זמן
          בשניות ולא לנפח. בהרכבה של גדלים פיזיקליים, הפלט של החוליה הפנימית חייב להיות גודל מהסוג שהחיצונית מקבלת.
      - kind: check
        text: >-
          יחידות: $(2+t)$ בסנטימטרים, בחזקה שלישית: סנטימטר מעוקב. ו-$V(r(4))=\frac43\pi\cdot216=288\pi$.
      - kind: result
        text: >-
          (א) $\frac43\pi(2+t)^3$ על $[0,10]$; (ב) $36\pi$, ו-$t=4$; (ג) $\left[\frac{32\pi}{3},2304\pi\right]$; (ד) אין משמעות.

  - id: W-4.1-10
    level: exam
    objectives: [OBJ-4.1-1, OBJ-4.1-2, OBJ-4.1-3]
    prompt: >-
      $h(x)=\ln(4-x^2)$.

      (א) כתבו את $h$ כהרכבה של שתי פונקציות, ומצאו את תחום ההגדרה שלה.

      (ב) מצאו את נקודות החיתוך עם הצירים.

      (ג) באילו קטעים $h$ עולה, ובאילו יורדת? נמקו דרך החוליות של ההרכבה.

      (ד) מצאו את התמונה של $h$, ואת כל ה-$x$ שבהם $h(x)>0$.
    answer: >-
      (א) $\ln u$ אחרי $u=4-x^2$; התחום $(-2,2)$. (ב) $(0,\ln4)$, $(\pm\sqrt3,0)$. (ג) עולה ב-$(-2,0]$, יורדת ב-$[0,2)$.
      (ד) $(-\infty,\ln4]$; $h>0$ בקטע $(-\sqrt3,\sqrt3)$.
    solution:
      - kind: idea
        text: >-
          הפנימית $u=4-x^2$ והחיצונית $\ln u$. התחום: $u>0$. הכיוון: $\ln$ עולה, ולכן $h$ עולה בדיוק במקום שבו $u$ עולה,
          ויורדת במקום שבו $u$ יורדת. הסימן: $\ln u>0$ כש-$u>1$.
      - kind: computation
        text: >-
          (א) $4-x^2>0$ פירושו $x^2<4$: התחום $(-2,2)$, בלי הקצוות ($\ln0$ אינו מוגדר).
      - kind: computation
        text: >-
          (ב) $h(0)=\ln4=2\ln2\approx1.39$: הנקודה $(0,\ln4)$. $h(x)=0$ כש-$4-x^2=1$, כלומר $x=\pm\sqrt3$: הנקודות
          $(\pm\sqrt3,0)$.
      - kind: step
        text: >-
          (ג) $u=4-x^2$ עולה ב-$(-2,0]$ ויורדת ב-$[0,2)$ (כמו $4-x^2$ ב-W-4.1-02). אם $x_1<x_2$ ב-$(-2,0]$, אז
          $0<u(x_1)<u(x_2)$, ומכיוון ש-$\ln$ עולה, $h(x_1)<h(x_2)$: $h$ עולה שם. באותה דרך $h$ יורדת ב-$[0,2)$.
      - kind: computation
        text: >-
          (ד) על התחום $u=4-x^2$ מקבלת את כל הערכים ב-$(0,4]$, ו-$\ln$ ממפה את $(0,4]$ על $(-\infty,\ln4]$. התמונה
          $(-\infty,\ln4]$. $h>0$ כש-$u>1$, כלומר $x^2<3$: הקטע $(-\sqrt3,\sqrt3)$.
      - kind: check
        text: >-
          $h(1)=\ln3\approx1.10$, בין $h(0)=\ln4$ ל-$h(\sqrt3)=0$, כמו שהירידה ב-$[0,2)$ דורשת. וקרוב ל-2, למשל $x=1.99$:
          $4-x^2\approx0.04$ ו-$\ln0.04\approx-3.2$: הגרף צונח, כמו שהתמונה, שאין לה ערך קטן ביותר, אומרת.
      - kind: result
        text: >-
          תחום $(-2,2)$; חיתוכים $(0,\ln4)$ ו-$(\pm\sqrt3,0)$; עולה ב-$(-2,0]$ ויורדת ב-$[0,2)$; תמונה $(-\infty,\ln4]$,
          ו-$h>0$ ב-$(-\sqrt3,\sqrt3)$.

challenge:
  - id: W-4.1-c1
    stars: 1
    objectives: [OBJ-4.1-1, OBJ-4.1-2]
    prompt: >-
      לקבוע $c$ מגדירים $f(x)=\dfrac{cx}{2x+3}$, ל-$x\ne-\frac32$. ידוע ש-$f(f(x))=x$ לכל $x\ne-\frac32$.

      (א) מצאו את $c$.

      (ב) עם הערך שמצאתם, הראו ש-$f(x)$ לעולם אינו שווה למינוס $\frac32$. למה זה נחוץ כדי ש-$f(f(x))$ תהיה מוגדרת בכל
      התחום?
    answer: >-
      (א) $c=-3$. (ב) $f(x)=-\frac32$ מוביל לשוויון $0=-9$; לכן הפלט של $f$ תמיד בתחום של $f$, וההרכבה מוגדרת לכל $x\ne-\frac32$.
    solution:
      - kind: idea
        text: >-
          מחשבים את $f(f(x))$ כשבר אחד, ומשווים ל-$x$. שבר שווה ל-$x$ לכל $x$ רק אם המכנה שלו קבוע ושווה למקדם שבמונה.
      - kind: computation
        text: >-
          (א) מציבים את $f(x)$ במקום המשתנה:
          $f(f(x))=\frac{c\cdot\frac{cx}{2x+3}}{2\cdot\frac{cx}{2x+3}+3}$. כופלים מונה ומכנה ב-$2x+3$:
          $f(f(x))=\frac{c^2x}{2cx+3(2x+3)}=\frac{c^2x}{(2c+6)x+9}$.
      - kind: step
        text: >-
          כדי ש-$\frac{c^2x}{(2c+6)x+9}=x$ לכל $x$ בתחום, צריך $c^2x=(2c+6)x^2+9x$ לכל $x$ כזה. משווים מקדמים: המקדם של
          $x^2$ נותן $2c+6=0$, כלומר $c=-3$; המקדם של $x$ נותן $c^2=9$, ו-$c=-3$ מקיים גם אותו. (הערך $c=3$ מקיים רק את
          השני: אז $f(f(1))=\frac{9}{12+9}=\frac37\ne1$.)
      - kind: computation
        text: >-
          (ב) עם $c=-3$: $\frac{-3x}{2x+3}=-\frac32$ פירושו $2\cdot(-3x)=-3(2x+3)$, כלומר $-6x=-6x-9$, ואחרי הוספת $6x$ לשני האגפים נשאר $0=-9$: אין פתרון. לכן
          מינוס $\frac32$ אינו בתמונה של $f$.
      - kind: step
        text: >-
          לפי ההגדרה של תחום ההרכבה, $x$ בתחום של $f\circ f$ כש-$x\ne-\frac32$ **וגם** $f(x)\ne-\frac32$. מכיוון שהתנאי השני
          תמיד מתקיים, ההרכבה מוגדרת בכל התחום של $f$, כמו שהשאלה מניחה. (עם $c$ אחר, למשל $c=3$, $f(x)=-\frac32$ כש-$x=-\frac34$,
          ושם $f(f(x))$ אינה מוגדרת.)
      - kind: check
        text: >-
          $x=1$: $f(1)=\frac{-3}{5}$, ו-$f\left(-\frac35\right)=\frac{\frac95}{-\frac65+3}=\frac{9/5}{9/5}=1$. חזרנו ל-1.
      - kind: result
        text: >-
          $c=-3$, ואז $f(f(x))=x$ על כל התחום; הערך מינוס $\frac32$ אינו מתקבל, ולכן השרשרת אף פעם אינה נשברת.
    source:
      name: 'AHSME (Mathematical Association of America; today AMC 12), as posted on LIVE by Po-Shen Loh'
      year: 1980
      problem: 'Problem 14'
      url: 'https://live.poshenloh.com/past-contests/amc12/1980/problem/14?practice=1'
      verified: '2026-11-26'
      adapted: true

  - id: W-4.1-c2
    stars: 1
    objectives: [OBJ-4.1-1, OBJ-4.1-2]
    prompt: >-
      מצאו את תחום ההגדרה של

      $$f(x)=\log_{1/2}\Big(\log_4\Big(\log_{1/4}\big(\log_{16}(\log_{1/16}x)\big)\Big)\Big).$$

      התחום הוא קטע; מהו אורכו?
    answer: >-
      $\left(\frac{1}{256},\frac{1}{16}\right)$, באורך $\frac{15}{256}$.
    solution:
      - kind: idea
        text: >-
          זו הרכבה של חמישה לוגריתמים. הולכים מבפנים החוצה ורושמים לכל לוגריתם את התנאי "הקלט חיובי". בכל שלב נעזרים
          בכלל: בבסיס גדול מ-1 הלוגריתם עולה, ובבסיס בין 0 ל-1 הוא יורד, ולכן $\log_a u>0$ פירושו $u>1$ כש-$a>1$,
          ו-$0<u<1$ כש-$0<a<1$.
      - kind: computation
        text: >-
          נסמן $L_1=\log_{1/16}x$ (צריך $x>0$), $L_2=\log_{16}L_1$ (צריך $L_1>0$), $L_3=\log_{1/4}L_2$ (צריך $L_2>0$),
          $L_4=\log_4L_3$ (צריך $L_3>0$), ו-$f=\log_{1/2}L_4$ (צריך $L_4>0$).
      - kind: step
        text: >-
          מהחיצוני פנימה: $L_4>0$ עם בסיס 4 פירושו $L_3>1$. $L_3=\log_{1/4}L_2>1$ עם בסיס קטן מ-1 פירושו $0<L_2<\frac14$.
          $L_2=\log_{16}L_1<\frac14$ פירושו $L_1<16^{1/4}=2$, ו-$L_2>0$ פירושו $L_1>1$. לכן $1<L_1<2$.
      - kind: computation
        text: >-
          $1<\log_{1/16}x<2$, עם בסיס קטן מ-1, הופך את הכיוון: $\left(\frac1{16}\right)^2<x<\left(\frac1{16}\right)^1$,
          כלומר $\frac1{256}<x<\frac1{16}$. כל התנאים הפנימיים יותר ($L_1>0$, $x>0$) כבר מתקיימים כאן.
      - kind: check
        text: >-
          $x=\frac1{64}$, בתוך הקטע: $L_1=\frac32$, $L_2=\log_{16}1.5\approx0.146$, $L_3\approx1.39$, $L_4\approx0.24>0$,
          ו-$f$ מוגדרת. $x=\frac1{10}$, מחוץ לקטע: $L_1\approx0.83<1$, ולכן $L_2<0$ ו-$L_3$ אינו מוגדר.
      - kind: result
        text: >-
          התחום $\left(\frac{1}{256},\frac{1}{16}\right)$, ואורכו $\frac1{16}-\frac1{256}=\frac{15}{256}$.
