# Workbook of lesson 4.4 — trigonometric functions and their inverses.
# Objectives (src/course.ts):
#   OBJ-4.4-1  sketch sine, cosine and tangent with period, amplitude and phase shift
#   OBJ-4.4-2  define arcsin, arccos and arctan, their domains and their images
#   OBJ-4.4-3  compute values of the inverse functions and simplify compositions such as cos(arcsin x)
# Convention: y = A sin(ωx + φ) + d, ω > 0, phase shift −φ/ω; arcsin → [−π/2, π/2], arccos → [0, π], arctan → (−π/2, π/2).
# Every number recomputed with sympy in screens/tools/lesson-4-4.py (all ok, 2026-11-26).
lesson: '4.4'
practice:
  - id: W-4.4-01
    level: basic
    objectives: [OBJ-4.4-1]
    prompt: >-
      לפונקציה

      $$y=5\sin\left(\frac{\pi x}{2}-\frac{\pi}{2}\right)+1$$

      מצאו את האמפליטודה, את קו האמצע, את התמונה, את המחזור ואת הזזת המופע (בכמה ולאיזה כיוון). כתבו חמש נקודות
      מיוחדות של מחזור אחד, ושרטטו אותו.
    answer: >-
      אמפליטודה 5, קו אמצע $y=1$, תמונה $[-4,6]$, מחזור 4, הזזה של 1 ימינה. הנקודות $(1,1)$, $(2,6)$, $(3,1)$, $(4,-4)$,
      $(5,1)$.
    solution:
      - kind: idea
        text: >-
          המתכון של השיעור: $|A|$ ו-$d$ נותנים את הגובה, $\frac{2\pi}{\omega}$ את המחזור, ומחזור מתחיל כשהזווית שבתוך
          הסינוס היא 0.
      - kind: computation
        text: >-
          $A=5$, $\omega=\frac{\pi}{2}$, $\varphi$ הוא מינוס $\frac{\pi}{2}$, $d=1$. האמפליטודה 5, קו האמצע $y=1$, והתמונה
          $[1-5,\ 1+5]=[-4,6]$.
      - kind: computation
        text: >-
          המחזור: $T=\frac{2\pi}{\pi/2}=4$. בדיקת סבירות: $\omega=\frac{\pi}{2}\approx1.57$ גדול מ-1, ולכן הגל צפוף
          יותר מ-$\sin x$, והמחזור 4 אכן קצר מ-$2\pi\approx6.28$.
      - kind: step
        text: >-
          תחילת מחזור: $\frac{\pi x}{2}-\frac{\pi}{2}=0$, כלומר $x_0=1$. הוצאת $\omega$ מהסוגריים נותנת אותו דבר:
          $\frac{\pi}{2}(x-1)$. הגרף של $5\sin\frac{\pi x}{2}+1$ מוזז ב-1 **ימינה**.
      - kind: computation
        text: >-
          רבע מחזור הוא 1. מ-$x_0=1$: קו האמצע ב-$(1,1)$, מקסימום ב-$(2,6)$, קו האמצע ב-$(3,1)$, מינימום ב-$(4,-4)$, וקו
          האמצע ב-$(5,1)$.
      - kind: check
        text: >-
          הצבה ישירה: $y(2)=5\sin\frac{\pi}{2}+1=6$, ו-$y(4)=5\sin\frac{3\pi}{2}+1=-4$. וגם $y(0)=5\sin\left(-\frac{\pi}{2}\right)+1=-4$:
          מינימום, מחזור אחד לפני $x=4$.
      - kind: result
        text: >-
          אמפליטודה 5, קו אמצע $y=1$, תמונה $[-4,6]$, מחזור 4, הזזה של 1 ימינה.

  - id: W-4.4-02
    level: basic
    objectives: [OBJ-4.4-2, OBJ-4.4-3]
    prompt: >-
      חשבו, או קבעו שהביטוי אינו מוגדר:

      $$\arcsin\frac12,\qquad \arccos\frac{\sqrt3}{2},\qquad \arcsin(-1),\qquad \arccos(-1),\qquad \arctan\left(-\frac{1}{\sqrt3}\right),\qquad \arcsin\frac{\pi}{3}.$$
    answer: >-
      $\frac{\pi}{6}$, $\frac{\pi}{6}$, מינוס $\frac{\pi}{2}$, $\pi$, מינוס $\frac{\pi}{6}$; $\arcsin\frac{\pi}{3}$ אינו מוגדר.
    solution:
      - kind: idea
        text: >-
          קודם בודקים שהמספר בתחום ($[-1,1]$ ל-$\arcsin$ ול-$\arccos$), אחר כך הזווית החדה מהטבלה, ואז הקטע לפי הסימן.
      - kind: computation
        text: >-
          $\arcsin\frac12=\frac{\pi}{6}$ ו-$\arccos\frac{\sqrt3}{2}=\frac{\pi}{6}$: אותה זווית, כי $\sin\frac{\pi}{6}=\frac12$
          ו-$\cos\frac{\pi}{6}=\frac{\sqrt3}{2}$, ו-$\frac{\pi}{6}$ בשני הקטעים.
      - kind: computation
        text: >-
          $\arcsin(-1)$: הזווית בחצי הימני של המעגל שבה הנקודה בתחתית, כלומר מינוס $\frac{\pi}{2}$. $\arccos(-1)$: הזווית
          בחצי העליון שבה הנקודה בקצה השמאלי, כלומר $\pi$.
      - kind: computation
        text: >-
          $\arctan\left(-\frac{1}{\sqrt3}\right)$: $\tan\frac{\pi}{6}=\frac{1}{\sqrt3}$, והמספר שלילי, ולכן מינוס $\frac{\pi}{6}$.
      - kind: step
        text: >-
          $\frac{\pi}{3}\approx1.047$, גדול מ-1. אין זווית שהסינוס שלה גדול מ-1, ולכן $\arcsin\frac{\pi}{3}$ אינו מוגדר.
          (המלכודת: $\frac{\pi}{3}$ "נראה כמו זווית", אבל כאן הוא הקלט של $\arcsin$, ולא הפלט.)
      - kind: check
        text: >-
          $\sin\left(-\frac{\pi}{2}\right)=-1$, $\cos\pi=-1$, $\tan\left(-\frac{\pi}{6}\right)=-\frac{1}{\sqrt3}$, וכל תשובה בקטע
          של הפונקציה שלה.
      - kind: result
        text: >-
          $\frac{\pi}{6}$, $\frac{\pi}{6}$, מינוס $\frac{\pi}{2}$, $\pi$, מינוס $\frac{\pi}{6}$, ו-$\arcsin\frac{\pi}{3}$ אינו
          מוגדר.

  - id: W-4.4-03
    level: basic
    qualitative: true
    objectives: [OBJ-4.4-1]
    prompt: >-
      לכל פונקציה קבעו את המחזור, ואם יש לה אמפליטודה, גם אותה. נמקו במשפט.

      (א) $\sin3x$

      (ב) $\tan\frac{x}{3}+1$

      (ג) $|\sin x|$

      (ד) $4\cos(x-2)$
    answer: >-
      (א) מחזור $\frac{2\pi}{3}$, אמפליטודה 1. (ב) מחזור $3\pi$, אין אמפליטודה. (ג) מחזור $\pi$, אין אמפליטודה (אינה גל
      מהצורה $A\sin(\omega x+\varphi)+d$, אף שחצי המרחק בין הערכים הקיצוניים הוא $\frac12$). (ד) מחזור $2\pi$, אמפליטודה 4.
    solution:
      - kind: idea
        text: >-
          מחזור הוא המספר החיובי הקטן ביותר $T$ שעבורו $f(x+T)=f(x)$ לכל $x$ (שיעור 4.2). מקדם בתוך הפונקציה מחלק את
          המחזור; הזזה ותוספת קבוע לא משנות אותו. אמפליטודה מוגדרת בשיעור רק לגל מהצורה $A\sin(\omega x+\varphi)+d$ (או
          אותה צורה עם קוסינוס), והיא $|A|$.
      - kind: computation
        text: >-
          (א) $\sin3x$ חוזר כש-$3x$ גדל ב-$2\pi$, כלומר כש-$x$ גדל ב-$\frac{2\pi}{3}$. האמפליטודה 1.
      - kind: computation
        text: >-
          (ב) המחזור של $\tan$ הוא $\pi$, ולכן $\tan\frac{x}{3}$ חוזר כש-$\frac{x}{3}$ גדל ב-$\pi$: המחזור $3\pi$. הוספת 1
          מזיזה למעלה ולא משנה מחזור. הטנגנס אינו חסום, ולכן אין אמפליטודה.
      - kind: step
        text: >-
          (ג) $\sin(x+\pi)=-\sin x$, ולכן $|\sin(x+\pi)|=|\sin x|$: $\pi$ הוא מחזור. אין מחזור קטן יותר: $|\sin x|$ מתאפס רק
          בכפולות של $\pi$, ובין שני אפסים סמוכים הוא חיובי, ולכן הזזה בפחות מ-$\pi$ מעבירה אפס למקום שבו הפונקציה חיובית.
          הגרף הוא "קשתות" בין 0 ל-1, עם פינות חדות באפסים: הוא אינו גל מהצורה $A\sin(\omega x+\varphi)+d$, ולכן לפי
          ההגדרה של השיעור אין לו אמפליטודה, אף שחצי המרחק בין הערך הגבוה לנמוך הוא $\frac12$.
      - kind: computation
        text: >-
          (ד) הזזה ב-2 ימינה אינה משנה את המחזור, $2\pi$, ולא את האמפליטודה, 4.
      - kind: check
        text: >-
          (א) $\sin\left(3\left(x+\frac{2\pi}{3}\right)\right)=\sin(3x+2\pi)=\sin3x$. (ב) $\tan\frac{x+3\pi}{3}=\tan\left(\frac x3+\pi\right)=\tan\frac x3$.
      - kind: result
        text: >-
          מחזורים: $\frac{2\pi}{3}$, $3\pi$, $\pi$, $2\pi$. אמפליטודה: 1 ל-(א), 4 ל-(ד), ול-(ב) ול-(ג) אין.

  - id: W-4.4-04
    level: mid
    objectives: [OBJ-4.4-1]
    prompt: >-
      גרף של פונקציה מהצורה $y=A\cos(\omega x+\varphi)+d$, עם $A>0$ ו-$\omega>0$, מגיע למקסימום בנקודה
      $\left(\frac{\pi}{6},5\right)$, ולמינימום הראשון שאחריה בנקודה $\left(\frac{2\pi}{3},-1\right)$. מצאו את $A$, $\omega$,
      $\varphi$ ו-$d$ (עם $\varphi\in(-\pi,\pi]$), ואת $y(0)$.
    answer: >-
      $y=3\cos\left(2x-\frac{\pi}{3}\right)+2$, כלומר $A=3$, $\omega=2$, $\varphi$ הוא מינוס $\frac{\pi}{3}$, $d=2$;
      $y(0)=\frac72$.
    solution:
      - kind: idea
        text: >-
          כל אחד מהמספרים נקרא מנתון אחר: הגובה מהמקסימום והמינימום, המחזור מהמרחק ביניהם (חצי מחזור), והמופע מהמקום
          של המקסימום, שבו הזווית שבתוך הקוסינוס היא 0.
      - kind: computation
        text: >-
          $d=\frac{5+(-1)}{2}=2$ (באמצע), $A=\frac{5-(-1)}{2}=3$ (חצי המרחק).
      - kind: computation
        text: >-
          ממקסימום למינימום הבא עובר חצי מחזור: $\frac{T}{2}=\frac{2\pi}{3}-\frac{\pi}{6}=\frac{\pi}{2}$, ולכן $T=\pi$
          ו-$\omega=\frac{2\pi}{T}=2$.
      - kind: step
        text: >-
          הקוסינוס מקסימלי כשהזווית שבתוכו היא 0 (או כפולה של $2\pi$). דורשים $2\cdot\frac{\pi}{6}+\varphi=0$, ומקבלים
          $\varphi=-\frac{\pi}{3}$, בקטע $(-\pi,\pi]$.
      - kind: computation
        text: >-
          $y(0)=3\cos\left(-\frac{\pi}{3}\right)+2=3\cdot\frac12+2=\frac72$.
      - kind: check
        text: >-
          $y\left(\frac{2\pi}{3}\right)=3\cos\left(\frac{4\pi}{3}-\frac{\pi}{3}\right)+2=3\cos\pi+2=-1$, המינימום הנתון. ו-$y(0)=3.5$
          בין קו האמצע 2 למקסימום 5, כמו שצריך: $x=0$ קרוב למקסימום ב-$\frac{\pi}{6}$.
      - kind: result
        text: >-
          $y=3\cos\left(2x-\frac{\pi}{3}\right)+2$, ו-$y(0)=\frac72$.

  - id: W-4.4-05
    level: mid
    qualitative: true
    objectives: [OBJ-4.4-2]
    prompt: >-
      בכל סעיף כתוב חלק מפתרון של סטודנט. מצאו את הטעות, הסבירו אותה ותקנו.

      (א) "המחשבון נותן $\arccos0.6\approx0.927$, ולכן $\arccos(-0.6)\approx-0.927$."

      (ב) "$\arctan1000\approx89.94^\circ$. אם ניקח מספר גדול מספיק, נקבל $\arctan$ ששווה בדיוק $90^\circ$."

      (ג) "$\arcsin$ היא פונקציה, ולכן $\arcsin(2x-1)$ מוגדרת לכל $x$ ממשי."
    answer: >-
      (א) $\arccos$ אינה שלילית: $\arccos(-0.6)=\pi-\arccos0.6\approx2.214$. (ב) התמונה של $\arctan$ היא קטע פתוח:
      $90^\circ$ לעולם אינו מתקבל. (ג) צריך $-1\le2x-1\le1$, כלומר התחום הוא $[0,1]$.
    solution:
      - kind: idea
        text: >-
          שלוש הטעויות הן שלוש עובדות של השיעור: התמונה של $\arccos$ היא $[0,\pi]$; התמונה של $\arctan$ פתוחה; והתחום של
          $\arcsin$ הוא $[-1,1]$, ולכן גם הרכבה צריכה שהפונקציה הפנימית תישאר בו (שיעור 4.1).
      - kind: step
        text: >-
          (א) הסטודנט הניח ש-$\arccos$ אי-זוגית. אבל מינוס $0.927$ אינו בקטע $[0,\pi]$, וגם הקוסינוס שלו הוא $+0.6$
          (הקוסינוס זוגי), לא מינוס. הזווית בחצי העליון עם קוסינוס מינוס $0.6$ היא, לפי $\arccos(-y)=\pi-\arccos y$,
          $\pi-0.927\approx2.214$, ברביע השני.
      - kind: step
        text: >-
          (ב) אילו $\arctan y=\frac{\pi}{2}$, היה $y=\tan\frac{\pi}{2}$, שאינו מוגדר. $\arctan y$ מתקרב ל-$\frac{\pi}{2}$ כש-$y$
          גדל, בלי להגיע: לכל $y$ הוא קטן מ-$90^\circ$.
      - kind: step
        text: >-
          (ג) $\arcsin u$ מוגדר רק כש-$-1\le u\le1$. כאן $u=2x-1$: מוסיפים 1 ומחלקים ב-2, ומקבלים $0\le x\le1$. למשל ב-$x=2$,
          $\arcsin3$ אינו מוגדר.
      - kind: check
        text: >-
          (א) במחשבון, $\cos2.214\approx-0.600$, ו-$2.214$ בין 0 ל-$\pi\approx3.14$. (ג) בקצוות: $x=0$ נותן $\arcsin(-1)$ ו-$x=1$
          נותן $\arcsin1$, שניהם מוגדרים.
      - kind: result
        text: >-
          (א) $\arccos(-0.6)=\pi-\arccos0.6\approx2.214$. (ב) אין $y$ כזה. (ג) התחום $[0,1]$.

  - id: W-4.4-06
    level: mid
    objectives: [OBJ-4.4-3]
    prompt: >-
      חשבו:

      (א) $\arcsin\left(\sin\frac{7\pi}{6}\right)$

      (ב) $\arccos\left(\cos\left(-\frac{2\pi}{3}\right)\right)$

      (ג) $\arctan\left(\tan\frac{5\pi}{4}\right)$

      (ד) $\arcsin(\sin10)$ (ברדיאנים)
    answer: >-
      (א) מינוס $\frac{\pi}{6}$. (ב) $\frac{2\pi}{3}$. (ג) $\frac{\pi}{4}$. (ד) $3\pi-10\approx-0.575$.
    solution:
      - kind: idea
        text: >-
          הפונקציה ההפוכה מחזירה את הזווית **בקטע הראשי** שיש לה אותו ערך כמו הזווית הנתונה. מוצאים אותה בעזרת מחזור
          ($2\pi$, ול-$\tan$ גם $\pi$), זוגיות, והזהות $\sin(\pi-x)=\sin x$.
      - kind: computation
        text: >-
          (א) $\sin\frac{7\pi}{6}=-\frac12$ (הרביע השלישי, זווית חדה $\frac{\pi}{6}$), ו-$\arcsin\left(-\frac12\right)$ הוא
          מינוס $\frac{\pi}{6}$.
      - kind: computation
        text: >-
          (ב) הקוסינוס זוגי: $\cos\left(-\frac{2\pi}{3}\right)=\cos\frac{2\pi}{3}$, ו-$\frac{2\pi}{3}\in[0,\pi]$. לכן התשובה
          $\frac{2\pi}{3}$, לא מינוס $\frac{2\pi}{3}$.
      - kind: computation
        text: >-
          (ג) המחזור של הטנגנס $\pi$: $\tan\frac{5\pi}{4}=\tan\frac{\pi}{4}=1$, ו-$\frac{\pi}{4}$ בקטע $\left(-\frac{\pi}{2},\frac{\pi}{2}\right)$.
      - kind: step
        text: >-
          (ד) קודם מורידים סיבוב: $10-2\pi\approx3.717$, ו-$\sin10=\sin(10-2\pi)$. המספר הזה בין $\frac{\pi}{2}\approx1.571$
          ל-$\frac{3\pi}{2}\approx4.712$, ושם $\arcsin(\sin u)=\pi-u$. לכן $\arcsin(\sin10)=\pi-(10-2\pi)=3\pi-10\approx-0.575$.
      - kind: check
        text: >-
          (ד) $3\pi-10\approx-0.575$ בין מינוס $\frac{\pi}{2}$ ל-$\frac{\pi}{2}$, ובמחשבון $\sin10\approx-0.544$
          ו-$\sin(-0.575)\approx-0.544$.
      - kind: result
        text: >-
          מינוס $\frac{\pi}{6}$, $\frac{2\pi}{3}$, $\frac{\pi}{4}$, $3\pi-10$.

  - id: W-4.4-07
    level: mid
    objectives: [OBJ-4.4-3]
    prompt: >-
      כתבו כביטוי אלגברי ב-$x$, וציינו לאילו $x$ הביטוי נכון:

      (א) $\tan(\arcsin x)$

      (ב) $\sin(\arccos x)$

      (ג) $\cos(2\arcsin x)$
    answer: >-
      (א) $\frac{x}{\sqrt{1-x^2}}$ ל-$-1<x<1$. (ב) $\sqrt{1-x^2}$ ל-$-1\le x\le1$. (ג) $1-2x^2$ ל-$-1\le x\le1$.
    solution:
      - kind: idea
        text: >-
          נותנים שם לזווית, מוצאים את הפונקציה המבוקשת מ-$\sin^2+\cos^2=1$ (או ממשולש עזר), וקובעים את הסימן מהקטע של
          הפונקציה ההפוכה.
      - kind: computation
        text: >-
          (א) $\theta=\arcsin x$: $\sin\theta=x$, ו-$\theta\in\left[-\frac{\pi}{2},\frac{\pi}{2}\right]$, שם $\cos\theta=\sqrt{1-x^2}\ge0$.
          לכן $\tan\theta=\frac{x}{\sqrt{1-x^2}}$. בקצוות $x=\pm1$ הזווית היא $\pm\frac{\pi}{2}$, והטנגנס אינו מוגדר: הביטוי
          נכון ל-$-1<x<1$.
      - kind: computation
        text: >-
          (ב) $\theta=\arccos x$: $\cos\theta=x$, ו-$\theta\in[0,\pi]$, שם הסינוס אינו שלילי. לכן $\sin\theta=\sqrt{1-x^2}$, לכל
          $x\in[-1,1]$, גם ל-$x$ שלילי.
      - kind: computation
        text: >-
          (ג) לפי הזווית הכפולה $\cos2\theta=1-2\sin^2\theta$, ועם $\sin\theta=x$: $1-2x^2$. כאן אין שאלת סימן, כי לא הוצאנו
          שורש.
      - kind: check
        text: >-
          ב-$x=\frac12$: $\arcsin\frac12=\frac{\pi}{6}$, ו-$\tan\frac{\pi}{6}=\frac{1}{\sqrt3}$, וגם $\frac{1/2}{\sqrt{3/4}}=\frac{1}{\sqrt3}$.
          $\cos\frac{\pi}{3}=\frac12$, וגם $1-2\cdot\frac14=\frac12$. ב-(ב) עם $x=-1$: $\sin\pi=0=\sqrt{1-1}$.
      - kind: result
        text: >-
          $\frac{x}{\sqrt{1-x^2}}$, $\sqrt{1-x^2}$, $1-2x^2$.

  - id: W-4.4-08
    level: exam
    objectives: [OBJ-4.4-1, OBJ-4.4-3]
    prompt: >-
      מקומו של גוף על קפיץ (בס״מ, $t$ בשניות) הוא $x(t)=-4\cos2t-3\sin2t$.

      (א) כתבו את $x(t)$ בצורה $A\cos(2t+\varphi)$, עם $A>0$ ו-$\varphi\in(-\pi,\pi]$.

      (ב) מצאו את האמפליטודה ואת זמן המחזור.

      (ג) מצאו את הרגע הראשון $t>0$ שבו הגוף בנקודה הגבוהה ביותר (ערך מדויק וקירוב).
    answer: >-
      (א) $x(t)=5\cos(2t+\varphi)$ עם $\varphi=\pi-\arctan\frac34\approx2.498$. (ב) 5 ס״מ, $\pi$ שניות.
      (ג) $t=\frac{\pi}{2}+\frac12\arctan\frac34\approx1.893$ שניות.
    solution:
      - kind: idea
        text: >-
          כמו בשיעור: $a\cos\omega t+b\sin\omega t=A\cos(\omega t+\varphi)$ כש-$(A,\varphi)$ הן הקואורדינטות הקוטביות של
          הנקודה $(a,-b)$. את הזווית קובעים עם הרביע, כמו בארגומנט הראשי של שיעור 3.2.
      - kind: computation
        text: >-
          (א) פותחים לפי נוסחת הקוסינוס של סכום: $A\cos(2t+\varphi)=A\cos\varphi\cos2t-A\sin\varphi\sin2t$. משווים ל-$-4\cos2t-3\sin2t$:
          $A\cos\varphi=-4$ ו-$A\sin\varphi=3$. כלומר הנקודה $(a,-b)=(-4,3)$, ו-$A=\sqrt{16+9}=5$.
      - kind: step
        text: >-
          הנקודה $(-4,3)$ ברביע השני. $\arctan\frac{3}{-4}=-\arctan\frac34\approx-0.644$ (הארקטנגנס אי-זוגית), וזו זווית ברביע
          הרביעי: הכיוון ההפוך. הרכיב הראשון שלילי והשני חיובי, ולכן מוסיפים $\pi$:
          $\varphi=-\arctan\frac34+\pi=\pi-\arctan\frac34\approx2.498$ (כלומר $143.13^\circ$), בקטע $(-\pi,\pi]$.
      - kind: computation
        text: >-
          (ב) האמפליטודה 5 ס״מ; המחזור $\frac{2\pi}{2}=\pi\approx3.14$ שניות.
      - kind: step
        text: >-
          (ג) מקסימום כש-$\cos(2t+\varphi)=1$, כלומר $2t+\varphi=2\pi k$. ב-$k=0$ יוצא $2t=-\varphi<0$, זמן שלילי. לכן $k=1$:
          $2t=2\pi-\varphi=\pi+\arctan\frac34$, ו-$t=\frac{\pi}{2}+\frac12\arctan\frac34\approx1.893$.
      - kind: check
        text: >-
          $x(0)=5\cos\varphi=-4$, כמו בנוסחה הנתונה ($-4\cos0=-4$). עם הזווית השגויה, מינוס $0.644$, היה יוצא
          $x(0)=5\cos(-0.644)\approx4$. ו-$t\approx1.893$ קטן ממחזור אחד, $\pi$, כמו שצריך לרגע הראשון; הצבה במחשבון נותנת
          $x(1.893)\approx5$.
      - kind: result
        text: >-
          $x(t)=5\cos\left(2t+\pi-\arctan\frac34\right)$; אמפליטודה 5 ס״מ, מחזור $\pi$ שניות; מקסימום ראשון ב-$t\approx1.893$.

  - id: W-4.4-09
    level: exam
    qualitative: true
    objectives: [OBJ-4.4-2, OBJ-4.4-3]
    prompt: >-
      (א) הוכיחו ש-$\arctan x+\arctan\frac1x=\frac{\pi}{2}$ לכל $x>0$.

      (ב) מה ערך הסכום כש-$x<0$? נמקו.

      (ג) סטודנט ניסה להוכיח את (א) בנוסחת הטנגנס של סכום, $\tan(\alpha+\beta)=\frac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$,
      ונתקע. למה?
    answer: >-
      (א) $\frac{\pi}{2}-\arctan x$ היא הזווית ב-$\left(0,\frac{\pi}{2}\right)$ שהטנגנס שלה $\frac1x$. (ב) מינוס $\frac{\pi}{2}$,
      כי $\arctan$ אי-זוגית. (ג) המכנה $1-x\cdot\frac1x$ הוא 0: $\tan\frac{\pi}{2}$ אינו מוגדר.
    solution:
      - kind: idea
        text: >-
          כמו בזהות $\arcsin x+\arccos x=\frac{\pi}{2}$: מראים שזווית מסוימת מקיימת את שני התנאים שמגדירים את $\arctan\frac1x$
          (הטנגנס שלה $\frac1x$, והיא בקטע $\left(-\frac{\pi}{2},\frac{\pi}{2}\right)$), ולכן היא $\arctan\frac1x$.
      - kind: step
        text: >-
          (א) $x>0$, ונסמן $\theta=\arctan x$. אז $\tan\theta=x>0$, ולכן $0<\theta<\frac{\pi}{2}$, וגם $0<\frac{\pi}{2}-\theta<\frac{\pi}{2}$.
      - kind: computation
        text: >-
          $\tan\left(\frac{\pi}{2}-\theta\right)=\frac{\sin(\pi/2-\theta)}{\cos(\pi/2-\theta)}=\frac{\cos\theta}{\sin\theta}=\frac{1}{\tan\theta}=\frac1x$
          (לפי נוסחאות ההפרש: $\sin\left(\frac{\pi}{2}-\theta\right)=\cos\theta$, $\cos\left(\frac{\pi}{2}-\theta\right)=\sin\theta$).
      - kind: step
        text: >-
          כלומר $\frac{\pi}{2}-\theta$ היא זווית בקטע הראשי של $\arctan$ שהטנגנס שלה $\frac1x$, ולכן היא $\arctan\frac1x$.
          מכאן $\arctan x+\arctan\frac1x=\frac{\pi}{2}$.
      - kind: step
        text: >-
          (ב) ל-$x<0$, המספר $-x$ חיובי, ו-$\arctan$ אי-זוגית: $\arctan x+\arctan\frac1x=-\left(\arctan(-x)+\arctan\frac{1}{-x}\right)=-\frac{\pi}{2}$.
          (בתמונה: שתי הזוויות שליליות, והסכום לא יכול להיות $\frac{\pi}{2}$.)
      - kind: step
        text: >-
          (ג) עם $\tan\alpha=x$ ו-$\tan\beta=\frac1x$ המכנה הוא $1-x\cdot\frac1x=0$. זה בדיוק המקרה שבו $\alpha+\beta$ היא
          זווית שהטנגנס שלה אינו מוגדר, $\pm\frac{\pi}{2}$: הנוסחה לא נותנת ערך, ולכן לא יכולה להוכיח את הזהות.
      - kind: check
        text: >-
          $x=1$: $\frac{\pi}{4}+\frac{\pi}{4}=\frac{\pi}{2}$. $x=\sqrt3$: $\frac{\pi}{3}+\frac{\pi}{6}=\frac{\pi}{2}$. $x=-1$:
          מינוס $\frac{\pi}{4}$ ועוד מינוס $\frac{\pi}{4}$ נותן מינוס $\frac{\pi}{2}$.
      - kind: result
        text: >-
          הסכום $\frac{\pi}{2}$ ל-$x>0$ ומינוס $\frac{\pi}{2}$ ל-$x<0$; נוסחת הסכום נכשלת כי המכנה מתאפס.

  - id: W-4.4-10
    level: exam
    objectives: [OBJ-4.4-3]
    prompt: >-
      פתרו את המשוואה

      $$\arctan2x+\arctan3x=\frac{\pi}{4}.$$
    answer: >-
      $x=\frac16$ בלבד. (הפתרון הנוסף של המשוואה הריבועית, $x=-1$, אינו פתרון.)
    solution:
      - kind: idea
        text: >-
          מפעילים טנגנס על שני האגפים ומשתמשים בנוסחת הסכום. אבל הפעלת טנגנס אינה הפיכה: היא מאבדת את המידע באיזה קטע
          נמצא הסכום. לכן כל פתרון שמתקבל נבדק במשוואה המקורית.
      - kind: computation
        text: >-
          נסמן $\alpha=\arctan2x$, $\beta=\arctan3x$. אם $\alpha+\beta=\frac{\pi}{4}$, אז $\tan(\alpha+\beta)=1$:
          $\frac{2x+3x}{1-6x^2}=1$.
      - kind: computation
        text: >-
          $5x=1-6x^2$, כלומר $6x^2+5x-1=0$, $(6x-1)(x+1)=0$: $x=\frac16$ או $x=-1$.
      - kind: step
        text: >-
          בדיקה של $x=-1$: $\arctan(-2)+\arctan(-3)$ הוא סכום של שתי זוויות שליליות, ולכן שלילי, ואינו $\frac{\pi}{4}$.
          (הטנגנס שלו אכן 1: הסכום הוא מינוס $\frac{3\pi}{4}$, זווית אחרת עם אותו טנגנס.) נפסל.
      - kind: step
        text: >-
          בדיקה של $x=\frac16$: $\arctan\frac13+\arctan\frac12$. שני המספרים בין 0 ל-1, ולכן כל זווית בין 0 ל-$\frac{\pi}{4}$
          והסכום בין 0 ל-$\frac{\pi}{2}$; הטנגנס שלו 1, ולכן הוא $\frac{\pi}{4}$. מתקיים.
      - kind: check
        text: >-
          במחשבון: $\arctan\frac13+\arctan\frac12\approx0.3218+0.4636=0.7854\approx\frac{\pi}{4}$, ו-$\arctan(-2)+\arctan(-3)\approx-2.356$.
      - kind: result
        text: >-
          $x=\frac16$.

challenge:
  - id: W-4.4-c1
    stars: 1
    objectives: [OBJ-4.4-3]
    prompt: >-
      (א) חשבו את $(5-i)^2(1+i)$, והיעזרו בתוצאה כדי להוכיח ש-

      $$\arctan\frac{7}{17}+2\arctan\frac15=\frac{\pi}{4}.$$

      (ב) הוכיחו באותה דרך ש-

      $$3\arctan\frac14+\arctan\frac{1}{20}+\arctan\frac{1}{1985}=\frac{\pi}{4}.$$

      (רמז: אילו מספרים מרוכבים כדאי לכפול?)
    answer: >-
      (א) $(5-i)^2(1+i)=34+14i$, והארגומנט שלו $\arctan\frac{7}{17}=\frac{\pi}{4}-2\arctan\frac15$. (ב)
      $(4+i)^3(20+i)(1985+i)=1970113(1+i)$, שהארגומנט שלו $\frac{\pi}{4}$.
    solution:
      - kind: idea
        text: >-
          בכפל מספרים מרוכבים הארגומנטים מתחברים (שיעור 3.3), ו-$\arctan\frac ba$ הוא הארגומנט של $a+bi$ כש-$a>0$. לכן סכום
          של ארקטנגנסים הוא ארגומנט של מכפלה. נשאר לחשב את המכפלה בצורה האלגברית, ולבדוק שהסכום נמצא בקטע $(-\pi,\pi]$,
          כדי שלא יהיה צורך בתיקון של $2\pi$.
      - kind: computation
        text: >-
          (א) $(5-i)^2=25-10i+i^2=24-10i$, ו-$(24-10i)(1+i)=24+24i-10i-10i^2=34+14i$.
      - kind: step
        text: >-
          הארגומנטים: $5-i$ ברביע הרביעי, והארגומנט הראשי שלו הוא מינוס $\arctan\frac15$; $1+i$ בזווית $\frac{\pi}{4}$. לכן
          $\frac{\pi}{4}-2\arctan\frac15$ הוא ארגומנט של $34+14i$. מכיוון ש-$0<\arctan\frac15<\frac{\pi}{4}$, הסכום הזה בין
          מינוס $\frac{\pi}{4}$ ל-$\frac{\pi}{4}$, ולכן הוא **הארגומנט הראשי**.
      - kind: step
        text: >-
          מצד שני, $34+14i$ ברביע הראשון, והארגומנט הראשי שלו הוא $\arctan\frac{14}{34}=\arctan\frac{7}{17}$. משווים:
          $\arctan\frac{7}{17}=\frac{\pi}{4}-2\arctan\frac15$, וזו הזהות.
      - kind: computation
        text: >-
          (ב) כופלים את $(4+i)^3$, $20+i$ ו-$1985+i$: $(4+i)^2=15+8i$, $(4+i)^3=(15+8i)(4+i)=52+47i$,
          $(52+47i)(20+i)=993+992i$, ו-$(993+992i)(1985+i)=1970113+1970113i$.
      - kind: step
        text: >-
          החלק הממשי והמדומה שווים וחיוביים, ולכן הארגומנט הראשי של המכפלה הוא $\frac{\pi}{4}$. סכום הארגומנטים הוא
          $3\arctan\frac14+\arctan\frac{1}{20}+\arctan\frac{1}{1985}$. כל מחובר חיובי וקטן מ-$\arctan\frac{1}{\sqrt3}=\frac{\pi}{6}$,
          ולכן הסכום בין 0 ל-$5\cdot\frac{\pi}{6}$, בתוך $(-\pi,\pi]$: הוא הארגומנט הראשי, כלומר $\frac{\pi}{4}$.
      - kind: check
        text: >-
          במחשבון: $\arctan\frac{7}{17}+2\arctan\frac15\approx0.39061+0.39479=0.78540$, ו-$\frac{\pi}{4}\approx0.78540$. וגם
          $3(0.24498)+0.04996+0.00050\approx0.78540$. (חישוב מדויק ב-sympy מאשר את שתי הזהויות.)
      - kind: result
        text: >-
          שתי הזהויות נכונות: הן ארגומנטים של $34+14i$ ושל $1970113(1+i)$.
    source:
      name: 'STEP (Sixth Term Examination Paper) II, 2000, in the STEP Support Programme collection "STEP 2 Complex Numbers Questions" (University of Cambridge)'
      year: 2000
      problem: 'STEP II 2000, Question 4 (the two arctan identities; the de Moivre parts omitted)'
      url: https://step.maths.org/sites/default/files/2023-07/Complex_questions_2019_1.pdf
      verified: '2026-11-26'
      adapted: true

  - id: W-4.4-c2
    stars: 1
    objectives: [OBJ-4.4-1, OBJ-4.4-3]
    prompt: >-
      כתבו כל פונקציה בצורה $A\cos(\omega t-\delta)$, עם $A>0$ ו-$\delta\in(-\pi,\pi]$. (זו הצורה של המקור. היא הצורה
      $A\cos(\omega t+\varphi)$ של השיעור, עם $\varphi=-\delta$.) התחילו כל סעיף בציור של משולש ישר-זווית (או של נקודה במישור).

      (א) $2\cos3t+2\sin3t$

      (ב) $\sqrt3\cos\pi t-\sin\pi t$

      (ג) $\cos\left(t-\frac{\pi}{8}\right)+\sin\left(t-\frac{\pi}{8}\right)$

      (ד) $-\sqrt3\cos\pi t-\sin\pi t$
    answer: >-
      (א) $2\sqrt2\cos\left(3t-\frac{\pi}{4}\right)$. (ב) $2\cos\left(\pi t+\frac{\pi}{6}\right)$, כלומר $\delta$ הוא מינוס
      $\frac{\pi}{6}$. (ג) $\sqrt2\cos\left(t-\frac{3\pi}{8}\right)$. (ד) $2\cos\left(\pi t+\frac{5\pi}{6}\right)$, כלומר $\delta$
      הוא מינוס $\frac{5\pi}{6}$.
    solution:
      - kind: idea
        text: >-
          לפי נוסחת הקוסינוס של הפרש, $A\cos(\omega t-\delta)=A\cos\delta\cos\omega t+A\sin\delta\sin\omega t$. לכן
          $a\cos\omega t+b\sin\omega t=A\cos(\omega t-\delta)$ כש-$a=A\cos\delta$ ו-$b=A\sin\delta$, כלומר $(A,\delta)$ הן
          הקואורדינטות הקוטביות של הנקודה $(a,b)$ (בשיעור, עם $\varphi=-\delta$, זו הייתה הנקודה $(a,-b)$): $A=\sqrt{a^2+b^2}$,
          ו-$\delta$ הזווית של הנקודה, עם הרביע. ב-(ג) המשתנה הוא $u=t-\frac{\pi}{8}$, ומציבים בסוף.
      - kind: computation
        text: >-
          (א) $(a,b)=(2,2)$: $A=\sqrt8=2\sqrt2$, הרביע הראשון, $\delta=\frac{\pi}{4}$. לכן $2\sqrt2\cos\left(3t-\frac{\pi}{4}\right)$.
      - kind: computation
        text: >-
          (ב) $(a,b)=(\sqrt3,-1)$: $A=2$, הרביע הרביעי, והזווית היא מינוס $\frac{\pi}{6}$ ($\cos\delta=\frac{\sqrt3}{2}$,
          $\sin\delta=-\frac12$). לכן $2\cos\left(\pi t+\frac{\pi}{6}\right)$.
      - kind: computation
        text: >-
          (ג) עם $u=t-\frac{\pi}{8}$: $\cos u+\sin u$, ו-$(a,b)=(1,1)$, ולכן $\sqrt2\cos\left(u-\frac{\pi}{4}\right)$. מציבים:
          $u-\frac{\pi}{4}=t-\frac{\pi}{8}-\frac{2\pi}{8}=t-\frac{3\pi}{8}$.
      - kind: step
        text: >-
          (ד) $(a,b)=(-\sqrt3,-1)$, ברביע השלישי. $\arctan\frac{-1}{-\sqrt3}=\arctan\frac{1}{\sqrt3}=\frac{\pi}{6}$ מצביע לרביע
          הראשון, ולכן מחסירים $\pi$: $\delta=\frac{\pi}{6}-\pi=-\frac{5\pi}{6}$. התוצאה $2\cos\left(\pi t+\frac{5\pi}{6}\right)$.
      - kind: check
        text: >-
          ב-$t=0$: (א) $2\sqrt2\cos\frac{\pi}{4}=2$, כמו $2\cos0$. (ב) $2\cos\frac{\pi}{6}=\sqrt3$. (ג) $\sqrt2\cos\frac{3\pi}{8}\approx0.541$,
          וגם $\cos\frac{\pi}{8}-\sin\frac{\pi}{8}\approx0.924-0.383=0.541$. (ד) $2\cos\frac{5\pi}{6}=-\sqrt3$, כמו בנוסחה.
      - kind: result
        text: >-
          $2\sqrt2\cos\left(3t-\frac{\pi}{4}\right)$, $2\cos\left(\pi t+\frac{\pi}{6}\right)$, $\sqrt2\cos\left(t-\frac{3\pi}{8}\right)$,
          $2\cos\left(\pi t+\frac{5\pi}{6}\right)$.
    source:
      name: 'MIT OpenCourseWare, 18.03SC Differential Equations, Fall 2011, Problem Set 2, Part I Problems'
      year: 2011
      problem: 'Part I, Problem 1 (a)–(c); part (d) added'
      url: https://www.ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/f36e0b01950b4ac0a77ca8ba7490e3ca_MIT18_03SCF11_ps2_s7q.pdf
      verified: '2026-11-26'
      adapted: true
