# Workbook of lesson 4.3 — exponential, logarithm and powers.
# Objectives (src/course.ts):
#   OBJ-4.3-1  sketch exponentials and logarithms in different bases; behaviour at infinity and at 0
#   OBJ-4.3-2  define ln and e; use that exp and ln are inverse to each other
#   OBJ-4.3-3  compare growth rates of powers, exponentials and logarithms
# Conventions: no derivatives (chapter 5), no integrals (ln as an area waits for chapter 8), no Taylor; limits are
# intuitive. A crossing found only by a scan is a probe. Every number recomputed with sympy in
# screens/tools/lesson-4-3.py.
lesson: '4.3'
practice:
  - id: W-4.3-01
    level: basic
    objectives: [OBJ-4.3-1]
    prompt: >-
      (א) מלאו טבלת ערכים ל-$y=3^x$ ב-$x=-2,-1,0,1,2$, ושרטטו באותה מערכת צירים את $y=3^x$, $y=\left(\frac13\right)^x$,
      $y=\log_3x$ ו-$y=\log_{1/3}x$.


      (ב) לכל אחד מארבעת הגרפים: האם הפונקציה עולה או יורדת, ומה קורה לה בקצות התחום?


      (ג) לאילו $x$ מתקיים $3^x>\left(\frac13\right)^x$?
    answer: >-
      (א) $3^x$: $\frac19,\frac13,1,3,9$. (ב) $3^x$ עולה, מ-0 (במינוס אינסוף) לאינסוף; $\left(\frac13\right)^x$ יורדת,
      מאינסוף ל-0; $\log_3x$ עולה, ממינוס אינסוף ליד 0 לאינסוף; $\log_{1/3}x$ יורדת, מאינסוף ליד 0 למינוס אינסוף.
      (ג) בדיוק כש-$x>0$.
    solution:
      - kind: idea
        text: >-
          טבלה אחת מספיקה. $\left(\frac13\right)^x=3^{-x}$ הוא שיקוף של $3^x$ ביחס לציר $y$. $\log_3x$, ההפוכה של
          $3^x$, היא שיקוף ביחס לישר $y=x$. ו-$\log_{1/3}x=\frac{\ln x}{\ln(1/3)}$ הוא מינוס $\log_3x$: שיקוף של $\log_3x$
          ביחס לציר $x$.
      - kind: computation
        text: >-
          (א) $3^{-2}=\frac19$, $3^{-1}=\frac13$, $3^0=1$, $3^1=3$, $3^2=9$. הנקודות של $\left(\frac13\right)^x$ הן אותן
          נקודות עם $x$ בסימן הפוך: $(2,\frac19)$, $(1,\frac13)$, $(0,1)$, $(-1,3)$, $(-2,9)$. של $\log_3x$: מחליפים
          קואורדינטות, $(\frac19,-2)$, $(\frac13,-1)$, $(1,0)$, $(3,1)$, $(9,2)$. של $\log_{1/3}x$: אותן נקודות עם $y$
          בסימן הפוך, למשל $(9,-2)$ ו-$(\frac19,2)$.
      - kind: step
        text: >-
          (ב) $3^x$: בסיס גדול מ-1, עולה. כש-$x$ גדל מאוד היא גדלה בלי גבול, וכש-$x$ שלילי וגדול בערכו המוחלט היא
          מתקרבת ל-0 (אסימפטוטה $y=0$ משמאל). $\left(\frac13\right)^x$: יורדת, האסימפטוטה $y=0$ מימין.
      - kind: step
        text: >-
          $\log_3x$: מוגדרת ל-$x>0$, עולה. ליד 0 מימין היא יורדת בלי גבול (ציר $y$ אסימפטוטה אנכית), וכש-$x$ גדל
          היא גדלה בלי גבול, לאט. $\log_{1/3}x$: הפוך בסימן, יורדת; היא גדלה בלי גבול ליד 0 מימין, ויורדת בלי גבול כש-$x$
          גדל.
      - kind: computation
        text: >-
          (ג) $\frac{3^x}{(1/3)^x}=3^x\cdot3^x=9^x$, וזה גדול מ-1 בדיוק כש-$x>0$. (ב-$x=0$ שתיהן 1.)
      - kind: check
        text: >-
          כל ארבעת הגרפים עוברים בנקודות הקבועות: שתי החזקות ב-$(0,1)$, שני הלוגריתמים ב-$(1,0)$. ו-$\log_{1/3}9$:
          $\left(\frac13\right)^{-2}=9$, ולכן הוא מינוס 2, כמו בטבלה.
      - kind: result
        text: >-
          החזקות עוברות ב-$(0,1)$ עם אסימפטוטה $y=0$, הלוגריתמים ב-$(1,0)$ עם אסימפטוטה $x=0$. בסיס 3 עולה, בסיס
          $\frac13$ יורד. $3^x>\left(\frac13\right)^x$ בדיוק כש-$x>0$.

  - id: W-4.3-02
    level: basic
    objectives: [OBJ-4.3-2]
    prompt: >-
      פשטו:


      (א) $\ln\left(e^{-4}\right)$


      (ב) $e^{\ln7-\ln2}$


      (ג) $\frac{\ln8}{\ln2}$


      (ד) $e^{-2\ln x}$, ל-$x>0$


      (ה) $\log_927$
    answer: >-
      (א) מינוס 4. (ב) $\frac72$. (ג) 3. (ד) $\frac{1}{x^2}$. (ה) $\frac32$.
    solution:
      - kind: idea
        text: >-
          $\ln$ ו-$e^{(\cdot)}$ מבטלים זה את זה, אבל רק כשבמעריך יש בדיוק $\ln$ של משהו. לכן קודם מצרפים בעזרת החוקים:
          הפרש של לוגריתמים הוא לוגריתם של מנה, ומקדם נכנס פנימה כחזקה. ללוגריתם בבסיס אחר: מעבר בסיס.
      - kind: computation
        text: >-
          (א) $\ln\left(e^u\right)=u$ לכל $u$, ולכן התוצאה מינוס 4. (ב) $\ln7-\ln2=\ln\frac72$, ולכן
          $e^{\ln7-\ln2}=\frac72$.
      - kind: computation
        text: >-
          (ג) $\ln8=\ln\left(2^3\right)=3\ln2$, ולכן המנה 3. זה גם $\log_28$ במעבר בסיס.
      - kind: computation
        text: >-
          (ד) $e^{-2\ln x}=e^{\ln\left(x^{-2}\right)}$, כי מקדם נכנס פנימה כחזקה. לכן $e^{-2\ln x}=x^{-2}=\frac{1}{x^2}$. (ל-$x>0$, שם $\ln x$ מוגדר.)
      - kind: computation
        text: >-
          (ה) $\log_927=\frac{\ln27}{\ln9}=\frac{3\ln3}{2\ln3}=\frac32$.
      - kind: check
        text: >-
          (ה) $9^{3/2}=\left(\sqrt9\right)^3=27$. (ד) ב-$x=2$: $e^{-2\ln2}=\frac{1}{e^{2\ln2}}=\frac14$.
      - kind: result
        text: >-
          מינוס 4; $\frac72$; 3; $\frac{1}{x^2}$; $\frac32$.

  - id: W-4.3-03
    level: basic
    objectives: [OBJ-4.3-2]
    prompt: >-
      פתרו את המשוואות (ערך מדויק, ואחריו ערך מקורב):


      (א) $2^x=10$


      (ב) $e^{3x-1}=4$


      (ג) $\ln(2x+1)=3$


      (ד) $5e^{-x}=2$


      (ה) $e^x+3=0$
    answer: >-
      (א) $x=\frac{\ln10}{\ln2}\approx3.322$. (ב) $x=\frac{1+\ln4}{3}\approx0.795$. (ג) $x=\frac{e^3-1}{2}\approx9.543$.
      (ד) $x=\ln\frac52\approx0.916$. (ה) אין פתרון.
    solution:
      - kind: idea
        text: >-
          מבודדים את האקספוננט (או את הלוגריתם), בודקים שהצד השני חיובי, ואז מבטלים: $\ln$ על אקספוננט, $e^{(\cdot)}$ על
          לוגריתם.
      - kind: computation
        text: >-
          (א) $\ln$ משני הצדדים: $x\ln2=\ln10$, ולכן $x=\frac{\ln10}{\ln2}=\log_210\approx3.322$.
      - kind: computation
        text: >-
          (ב) $3x-1=\ln4$, ולכן $x=\frac{1+\ln4}{3}\approx0.795$.
      - kind: computation
        text: >-
          (ג) מעלים את $e$ בחזקת שני הצדדים: $2x+1=e^3$, ולכן $x=\frac{e^3-1}{2}\approx9.543$. בדיקת תחום: $2x+1=e^3>0$.
      - kind: computation
        text: >-
          (ד) מחלקים ב-5: $e^{-x}=\frac25$. לוקחים $\ln$: מינוס $x$ שווה ל-$\ln\frac25$, ולכן $x=\ln\frac52\approx0.916$.
      - kind: step
        text: >-
          (ה) $e^x=-3$. אבל $e^x>0$ לכל $x$, ולכן אין פתרון. (לקחת $\ln(-3)$ היה טעות: הוא אינו מוגדר.)
      - kind: check
        text: >-
          (ב) $e^{3\cdot\frac{1+\ln4}{3}-1}=e^{\ln4}=4$. (ד) $5e^{-\ln(5/2)}=5\cdot\frac25=2$.
      - kind: result
        text: >-
          $\log_210$; $\frac{1+\ln4}{3}$; $\frac{e^3-1}{2}$; $\ln\frac52$; ובסעיף (ה) אין פתרון.

  - id: W-4.3-04
    level: mid
    qualitative: true
    objectives: [OBJ-4.3-1]
    prompt: >-
      נכון או לא נכון? נמקו כל תשובה, ולטענה שגויה תנו דוגמה נגדית.


      (א) $0.9^x$ מתקרב ל-0 כש-$x$ גדל מאוד.


      (ב) ל-$0<x<1$ מתקיים $\log_2x<\log_3x$.


      (ג) הגרף של $5^x$ נמצא מעל הגרף של $2^x$ לכל $x$.


      (ד) ל-$\log_2x$ יש אסימפטוטה אופקית כש-$x$ גדל מאוד.


      (ה) $\ln x<0$ לכל $x<1$.
    answer: >-
      (א) נכון. (ב) נכון. (ג) לא נכון ($x<0$). (ד) לא נכון. (ה) לא נכון: רק ל-$0<x<1$; ל-$x\le0$ הוא אינו מוגדר.
    solution:
      - kind: idea
        text: >-
          כל טענה נבדקת מול התכונות של הגרפים: בסיס קטן מ-1 יורד, בסיס גדול נותן ערך גדול רק ל-$x>0$, לוגריתם בבסיס
          $a$ הוא $\frac{\ln x}{\ln a}$, ולוגריתם מוגדר רק למספרים חיוביים.
      - kind: step
        text: >-
          (א) נכון. הבסיס $0.9$ בין 0 ל-1: כל צעד של 1 כופל ב-$0.9$, והכמות שואפת ל-0.
      - kind: step
        text: >-
          (ב) נכון. $\log_2x=\frac{\ln x}{\ln2}$ ו-$\log_3x=\frac{\ln x}{\ln3}$. ל-$0<x<1$ המונה $\ln x$ שלילי, והמכנה
          $\ln2$ קטן יותר, ולכן $\log_2x$ שלילי יותר. למשל $\log_2\frac12$ הוא מינוס 1, ו-$\log_3\frac12\approx-0.63$.
      - kind: step
        text: >-
          (ג) לא נכון. $\frac{5^x}{2^x}=\left(\frac52\right)^x$, וזה קטן מ-1 כש-$x<0$. ב-$x=-1$: $\frac15<\frac12$.
      - kind: step
        text: >-
          (ד) לא נכון. $\log_2x$ גדל לאט אבל בלי חסם: לכל $M$, אם $x>2^M$ אז $\log_2x>M$.
      - kind: step
        text: >-
          (ה) לא נכון. ב-$x=0$ או $x=-1$ הביטוי $\ln x$ אינו מוגדר, ולכן אינו שלילי. הנכון: $\ln x<0$ בדיוק כש-$0<x<1$.
      - kind: result
        text: >-
          (א) ו-(ב) נכונות; (ג), (ד) ו-(ה) שגויות.

  - id: W-4.3-05
    level: mid
    objectives: [OBJ-4.3-2]
    prompt: >-
      פתרו בעזרת ההצבה $u=e^x$:


      (א) $e^{2x}-3e^x+2=0$


      (ב) $e^{2x}-e^x-6=0$
    answer: >-
      (א) $x=0$ או $x=\ln2$. (ב) $x=\ln3$ בלבד.
    solution:
      - kind: idea
        text: >-
          $e^{2x}=\left(e^x\right)^2$ (חוק החזקות), ולכן עם $u=e^x$ המשוואה נעשית ריבועית ב-$u$. פותרים אותה, ואז חוזרים
          מ-$u$ ל-$x$ בעזרת $\ln$. מכיוון ש-$u=e^x>0$, פתרון $u$ שלילי נפסל.
      - kind: computation
        text: >-
          (א) $u^2-3u+2=0$, כלומר $(u-1)(u-2)=0$: $u=1$ או $u=2$. שניהם חיוביים. $e^x=1$ נותן $x=\ln1=0$, ו-$e^x=2$
          נותן $x=\ln2$.
      - kind: computation
        text: >-
          (ב) $u^2-u-6=0$, כלומר $(u-3)(u+2)=0$: $u=3$ או $u=-2$.
      - kind: step
        text: >-
          $e^x=-2$ אין לו פתרון, כי $e^x>0$. נשאר $e^x=3$, כלומר $x=\ln3$.
      - kind: check
        text: >-
          (א) ב-$x=\ln2$: $e^{2\ln2}-3e^{\ln2}+2=4-6+2=0$. (ב) ב-$x=\ln3$: $9-3-6=0$.
      - kind: result
        text: >-
          (א) $x=0$ ו-$x=\ln2$; (ב) $x=\ln3$ בלבד.

  - id: W-4.3-06
    level: mid
    objectives: [OBJ-4.3-2, OBJ-4.3-1]
    prompt: >-
      עוצמת קול בדציבלים היא $L=10\log_{10}\frac{I}{I_0}$, כאשר $I$ העוצמה (אנרגיה ליחידת שטח ולשנייה) ו-$I_0$ עוצמת סף
      קבועה. החומציות, pH, היא מינוס $\log_{10}c$, כאשר $c$ ריכוז יוני המימן (במול לליטר).


      (א) רעש עלה מ-60 ל-90 דציבלים. פי כמה גדלה העוצמה?


      (ב) רמקול אחד יוצר 60 דציבלים. כמה דציבלים יוצרים שני רמקולים זהים (העוצמות מתחברות)? ועשרה?


      (ג) מה ה-pH של תמיסה עם $c=2.5\cdot10^{-4}$? ופי כמה גדול הריכוז בתמיסה עם pH 3 מאשר בתמיסה עם pH 5?
    answer: >-
      (א) פי 1000. (ב) בערך 63 דציבלים; 70 דציבלים. (ג) בערך $3.60$; פי 100.
    solution:
      - kind: idea
        text: >-
          הלוגריתם הופך כפל לחיבור: כפל של העוצמה בגורם $k$ מוסיף $10\log_{10}k$ דציבלים, בלי קשר לעוצמה ההתחלתית.
          ובכיוון ההפוך, הפרש של $\Delta L$ דציבלים הוא כפל ב-$10^{\Delta L/10}$.
      - kind: computation
        text: >-
          (א) $L_2-L_1=10\log_{10}\frac{I_2}{I_0}-10\log_{10}\frac{I_1}{I_0}=10\log_{10}\frac{I_2}{I_1}$. לכן
          $10\log_{10}\frac{I_2}{I_1}=30$, ו-$\frac{I_2}{I_1}=10^3=1000$.
      - kind: computation
        text: >-
          (ב) שני רמקולים: העוצמה מוכפלת ב-2, ולכן נוספים $10\log_{10}2\approx3.01$ דציבלים: בערך 63. עשרה רמקולים: כפל
          ב-10, ולכן נוספים $10\log_{10}10=10$: בדיוק 70 דציבלים, ולא 600.
      - kind: computation
        text: >-
          (ג) $\log_{10}\left(2.5\cdot10^{-4}\right)=\log_{10}2.5-4\approx0.398-4$, ולכן ה-pH בערך $4-0.398\approx3.60$. כל
          יחידת pH היא פי 10 בריכוז: בין pH 3 ל-pH 5 יש פי $10^2=100$, והריכוז הגדול יותר הוא ב-pH הנמוך.
      - kind: check
        text: >-
          (ג) ה-pH בין 3 ל-4, כי הריכוז בין $10^{-4}$ ל-$10^{-3}$. (ב) המספר 63 קרוב ל-60: הוספת רמקול שני לא "מכפילה את
          הרעש" בסולם, כי הסולם לוגריתמי.
      - kind: result
        text: >-
          פי 1000; בערך 63 ו-70 דציבלים; pH בערך $3.60$, ופי 100.

  - id: W-4.3-07
    level: mid
    qualitative: true
    objectives: [OBJ-4.3-3]
    prompt: >-
      סדרו לפי מהירות הגידול כש-$x$ גדל מאוד, מהאיטית למהירה, ונמקו כל מעבר:
      $e^{2x}$, $x^{100}$, $\ln\left(x^5\right)$, $2^x$, $(\ln x)^5$, $e^{x/100}$, $x^{0.1}$.
    answer: >-
      $\ln\left(x^5\right)\prec(\ln x)^5\prec x^{0.1}\prec x^{100}\prec e^{x/100}\prec2^x\prec e^{2x}$.
    solution:
      - kind: idea
        text: >-
          קודם מזהים לכל פונקציה את הסוג שלה, אחרי פישוט: לוגריתם (או חזקה של לוגריתם), חזקה, או אקספוננט. כל אקספוננט
          כותבים כ-$b^x$ ומשווים בסיסים. ואז משתמשים בסולם: לוגריתם, חזקות לפי המעריך, אקספוננטים לפי הבסיס.
      - kind: step
        text: >-
          $\ln\left(x^5\right)=5\ln x$: זה לוגריתם, לא חזקה. $(\ln x)^5$ מהיר יותר: $\frac{5\ln x}{(\ln x)^5}=\frac{5}{(\ln x)^4}$,
          שנעשה קטן כרצוננו כש-$x$ גדל.
      - kind: step
        text: >-
          $(\ln x)^5$ מול $x^{0.1}$. הרעיון: לכתוב את המנה כחזקה חמישית של מנה אחת, כי $x^{0.1}=\left(x^{0.02}\right)^5$.
          כך $\frac{(\ln x)^5}{x^{0.1}}=\left(\frac{\ln x}{x^{0.02}}\right)^5$. בפנים לוגריתם חלקי חזקה חיובית, שנעשה קטן
          כרצוננו לפי הסולם, וחזקה חמישית של מספר קטן קטנה עוד יותר. לכן אפילו $x^{0.1}$ מהירה יותר, אף שהעקיפה קורית
          מאוחר מאוד.
      - kind: step
        text: >-
          החזקות לפי המעריך: $x^{0.1}\prec x^{100}$.
      - kind: step
        text: >-
          האקספוננטים, כ-$b^x$: $e^{x/100}=\left(e^{0.01}\right)^x\approx1.01005^x$, $2^x$, ו-$e^{2x}=\left(e^2\right)^x\approx7.389^x$.
          כל הבסיסים גדולים מ-1, ולכן כולם מהירים מכל חזקה, כולל $x^{100}$; ביניהם הבסיס הגדול מנצח.
      - kind: check
        text: >-
          הסדר $x^{100}\prec e^{x/100}$ נראה מפתיע, ואכן העקיפה רחוקה: בהשוואה בלוגריתמים, $100\ln x$ מול $\frac{x}{100}$,
          היא קורית ליד $x\approx1.17\cdot10^5$. "גדלה מהר יותר" אומר רק שבסוף היא עוקפת.
      - kind: result
        text: >-
          $\ln\left(x^5\right)\prec(\ln x)^5\prec x^{0.1}\prec x^{100}\prec e^{x/100}\prec2^x\prec e^{2x}$.

  - id: W-4.3-08
    level: exam
    qualitative: true
    objectives: [OBJ-4.3-2]
    prompt: >-
      במודל פשוט של האטמוספרה (טמפרטורה קבועה), הלחץ בגובה $h$ קילומטרים הוא $p(h)=p_0e^{-h/8}$.


      (א) איזה חלק מהלחץ שליד הים יש בפסגת האוורסט, $h=8.85$? ובגובה טיסה של 11 ק״מ?


      (ב) באיזה גובה הלחץ חצי מהלחץ שליד הים? ובאיזה גובה עשירית?


      (ג) סטודנט אומר: "הלחץ נחצה ב-$5.5$ ק״מ, ולכן ב-11 ק״מ כבר אין אוויר." מה הטעות, ומה הנכון?
    answer: >-
      (א) בערך $0.33$; בערך $0.25$. (ב) $8\ln2\approx5.55$ ק״מ; $8\ln10\approx18.4$ ק״מ. (ג) הוא חשב בירידה לינארית; בגובה
      $2\cdot8\ln2\approx11.1$ ק״מ נשאר רבע.
    solution:
      - kind: given
        text: '$p(h)=p_0e^{-h/8}$, עם $h$ בקילומטרים.'
      - kind: idea
        text: >-
          החלק היחסי הוא $\frac{p(h)}{p_0}=e^{-h/8}$, ולא תלוי ב-$p_0$. כדי למצוא גובה מחלק נתון, פותרים $e^{-h/8}=q$
          בעזרת $\ln$. ודעיכה מעריכית כופלת באותו גורם בכל קטע גובה שווה; היא לא מחסירה אותה כמות.
      - kind: computation
        text: >-
          (א) $e^{-8.85/8}\approx0.331$: בערך שליש. $e^{-11/8}\approx0.253$: בערך רבע.
      - kind: computation
        text: >-
          (ב) $e^{-h/8}=\frac12$, כלומר $\frac{h}{8}=\ln2$, ו-$h=8\ln2\approx5.55$ ק״מ. ובאותה דרך $e^{-h/8}=\frac{1}{10}$
          נותן $h=8\ln10\approx18.4$ ק״מ.
      - kind: step
        text: >-
          (ג) הטעות: "חצי ב-$5.5$ ק״מ, ולכן הכול ב-11" היא חשיבה של ירידה בקו ישר. כאן כל $8\ln2$ ק״מ **כופלים** את
          הלחץ ב-$\frac12$: אחרי שני קטעים כאלה, בגובה $16\ln2\approx11.1$ ק״מ, נשאר $\frac14$ מהלחץ, כמו בסעיף (א).
          הלחץ לעולם אינו מגיע ל-0 במודל הזה.
      - kind: check
        text: >-
          (ב) ו-(א) מתאימים: $8.85$ ק״מ הם יותר מקטע אחד של $5.55$ ק״מ, ולכן הלחץ שם פחות מחצי, ואכן $0.33<0.5$; ו-11
          ק״מ הם כמעט שני קטעים כאלה, ולכן כמעט רבע: $0.253$.
      - kind: result
        text: >-
          בערך שליש באוורסט ורבע ב-11 ק״מ; חצי ב-$5.55$ ק״מ ועשירית ב-$18.4$ ק״מ; ובגובה 11 ק״מ נשאר בערך רבע, לא אפס.

  - id: W-4.3-09
    level: exam
    objectives: [OBJ-4.3-1, OBJ-4.3-2]
    prompt: >-
      $f(x)=\dfrac{4}{1+e^{-x}}$ (עקום לוגיסטי, כמו גידול של אוכלוסייה עם משאבים מוגבלים).


      (א) מצאו את התחום, הראו ש-$f$ עולה, תארו למה $f(x)$ מתקרב כש-$x$ גדל מאוד וכש-$x$ שלילי וגדול בערכו המוחלט,
      ומצאו את התמונה.


      (ב) מצאו נוסחה ל-$f^{-1}$, עם התחום שלה, ובדקו בשתי נקודות.


      (ג) לאילו ישרים מתאימות האסימפטוטות של $f$ בגרף של $f^{-1}$?
    answer: >-
      (א) כל הישר; עולה; שואפת ל-4 ול-0; התמונה $(0,4)$. (ב) $f^{-1}(x)=\ln\frac{x}{4-x}$, ל-$0<x<4$. (ג) האסימפטוטות
      האופקיות $y=0$ ו-$y=4$ הופכות לאנכיות $x=0$ ו-$x=4$.
    solution:
      - kind: idea
        text: >-
          כל התכונות באות מ-$e^{-x}$: חיובי, יורד, שואף ל-0 באינסוף ולאינסוף במינוס אינסוף. את ההפוכה מוצאים בביטול
          הפעולות מהחיצונית לפנימית, והגרף שלה הוא שיקוף ביחס ל-$y=x$.
      - kind: step
        text: >-
          (א) המכנה $1+e^{-x}>1$, לעולם אינו 0: התחום כל הישר. אם $x_1<x_2$ אז $e^{-x_1}>e^{-x_2}$, המכנה ב-$x_1$ גדול
          יותר, והמנה $\frac{4}{\cdot}$ קטנה יותר: $f(x_1)<f(x_2)$. $f$ עולה.
      - kind: step
        text: >-
          כש-$x$ גדל מאוד, $e^{-x}$ מתקרב ל-0, ולכן $f(x)$ מתקרב ל-$\frac41=4$. כש-$x$ שלילי וגדול בערכו המוחלט, $e^{-x}$
          גדל בלי גבול, ולכן $f(x)$ מתקרב ל-0. מכיוון
          ש-$e^{-x}$ מקבל כל ערך חיובי, המכנה מקבל כל ערך ב-$(1,\infty)$, ו-$f$ כל ערך ב-$(0,4)$.
      - kind: computation
        text: >-
          (ב) $y=\frac{4}{1+e^{-x}}$, ולכן $1+e^{-x}=\frac4y$, ו-$e^{-x}=\frac4y-1=\frac{4-y}{y}$. זה חיובי בדיוק כש-$0<y<4$.
          לוקחים $\ln$: מינוס $x$ שווה ל-$\ln\frac{4-y}{y}$, ולכן $x=\ln\frac{y}{4-y}$. מחליפים שמות:
          $f^{-1}(x)=\ln\frac{x}{4-x}$, ל-$0<x<4$.
      - kind: check
        text: >-
          $f(0)=\frac42=2$, ו-$f^{-1}(2)=\ln\frac22=0$. $f(\ln3)=\frac{4}{1+\frac13}=3$, ו-$f^{-1}(3)=\ln\frac31=\ln3$.
      - kind: step
        text: >-
          (ג) ל-$f$ שתי אסימפטוטות אופקיות: $y=0$ משמאל ו-$y=4$ מימין. בשיקוף ביחס ל-$y=x$ הן נעשות אנכיות: ליד 0 מימין
          $f^{-1}(x)$ יורד בלי גבול, וליד 4 משמאל הוא גדל בלי גבול.
      - kind: result
        text: >-
          $f$ עולה מ-0 ל-4, התמונה $(0,4)$; $f^{-1}(x)=\ln\frac{x}{4-x}$ על $(0,4)$, עם אסימפטוטות אנכיות $x=0$ ו-$x=4$.

  - id: W-4.3-10
    level: exam
    objectives: [OBJ-4.3-3, OBJ-4.3-1]
    prompt: >-
      המשוואה $x^4=2^x$, עם $x>0$.


      (א) הראו ש-$x=16$ פתרון, והסבירו למה $x=2$ אינו פתרון אף ש-$2^4=4^2$.


      (ב) הראו שיש פתרון בין 1 ל-2, ומצאו אותו בדיוק של $0.01$ בחלוקה חוזרת לחצאים: בכל שלב בודקים את אמצע הקטע,
      ושומרים את החצי שבו $x^4-2^x$ מחליף סימן.


      (ג) לאילו $x>0$ מתקיים $x^4>2^x$? מה מבוסס על נימוק, ומה על בדיקה?


      (ד) מה קורה למנה $\frac{x^4}{2^x}$ כש-$x$ גדל מאוד?
    answer: >-
      (א) $16^4=2^{16}=65536$. (ב) $x\approx1.24$. (ג) בערך ל-$1.24<x<16$. (ד) היא מתקרבת ל-0.
    solution:
      - kind: idea
        text: >-
          משווים בלוגריתמים: $x^4=2^x$ בדיוק כש-$4\ln x=x\ln2$. בכל נקודה בודקים מי מובילה; כשההובלה מתחלפת, הגרפים
          נחתכים. הסולם אומר מי מובילה בסוף, אבל לא מתי.
      - kind: computation
        text: >-
          (א) $16^4=\left(2^4\right)^4=2^{16}$. אז $x=16$ פתרון. ב-$x=2$: $x^4=16$, ו-$2^x=4$. השוויון $2^4=4^2$ הוא
          החלפה של בסיס ומעריך, לא הצבה במשוואה.
      - kind: computation
        text: >-
          (ב) נסמן $h(x)=x^4-2^x$. ב-$x=1$: $h(1)=1-2$, שלילי: האקספוננט מוביל. ב-$x=2$: $h(2)=16-4>0$: החזקה מובילה.
          שני הגרפים בלי קפיצות, ולכן הם נחתכים ביניהם. עכשיו חוצים את הקטע שוב ושוב, ובכל פעם שומרים את החצי שבקצותיו
          $h$ בסימנים שונים.
      - kind: computation
        text: >-
          $h(1.5)\approx2.234>0$: הקטע $(1,1.5)$. $h(1.25)\approx0.063>0$: הקטע $(1,1.25)$. $h(1.125)\approx-0.579<0$:
          הקטע $(1.125,1.25)$. $h(1.1875)\approx-0.289<0$: הקטע $(1.1875,1.25)$. $h(1.21875)\approx-0.121<0$: הקטע
          $(1.21875,1.25)$. $h(1.234375)\approx-0.031<0$: הקטע $(1.234375,1.25)$. $h(1.2421875)\approx0.015>0$: הקטע
          $(1.2344,1.2422)$, שאורכו פחות מ-$0.01$. לכן הפתרון בערך $1.24$.
      - kind: step
        text: >-
          (ג) בין הפתרונות: ב-$x=10$, $10^4=10000>1024=2^{10}$, החזקה מובילה. אחרי 16: ב-$x=20$, $4\ln20\approx11.98$
          ו-$20\ln2\approx13.86$, האקספוננט מוביל, ולפי הסולם הוא מוביל לתמיד. ב-$0<x<1$: $x^4<1<2^x$.
      - kind: step
        text: >-
          מה מבוסס על מה: שיש נקודת חיתוך בין 1 ל-2 ושיש נקודת חיתוך ב-16, ראינו בחישוב. שאין נקודות חיתוך נוספות בין
          $1.24$ ל-16, ושאחרי 16
          האקספוננט לא מאבד את ההובלה אף פעם, זו עדות של בדיקה בנקודות ושל הסולם; הוכחה מלאה תבוא בפרק 5. התשובה:
          $x^4>2^x$ בערך ל-$1.24<x<16$.
      - kind: computation
        text: >-
          (ד) $2^x$ אקספוננט עם בסיס גדול מ-1, ולכן הוא גדל מהר יותר מכל חזקה: המנה $\frac{x^4}{2^x}$ נעשית קטנה כרצוננו,
          כלומר מתקרבת ל-0.
      - kind: check
        text: >-
          ב-$x=16$: $4\ln16=16\ln2$, כי $\ln16=4\ln2$. מחשבון: הפתרון בין 1 ל-2 הוא $1.2396$ בקירוב.
      - kind: result
        text: >-
          שני פתרונות חיוביים, $x\approx1.24$ ו-$x=16$; $x^4>2^x$ בדיוק ביניהם; והמנה מתקרבת ל-0.

challenge:
  - id: W-4.3-c1
    stars: 1
    objectives: [OBJ-4.3-2, OBJ-4.3-1]
    prompt: >-
      בלי מחשבון, סדרו מהקטן לגדול את חמשת המספרים:
      $\log_23$, $\log_48$, $\log_32$, $\log_510$, $\log_34$.


      (במקור נשאלה השאלה על ארבעת הראשונים בלבד; הוספנו את $\log_34$. רמז: מצאו קודם את אלה שאפשר לחשב בדיוק,
      והשוו את האחרים אליהם בהעלאה בחזקה.)
    answer: >-
      $\log_32<\log_34<\log_510<\log_48<\log_23$.
    solution:
      - kind: idea
        text: >-
          לבסיס גדול מ-1, $\log_ab<c$ בדיוק כש-$b<a^c$, כי $a^x$ עולה. לכן השוואה של לוגריתם למספר רציונלי $\frac pq$ היא
          השוואה של שתי חזקות שלמות: $b<a^{p/q}$ בדיוק כש-$b^q<a^p$.
      - kind: computation
        text: >-
          $\log_48=\frac32$ בדיוק: $4^{3/2}=\left(\sqrt4\right)^3=8$. ו-$\log_32<1$, כי $2<3=3^1$; כל האחרים גדולים מ-1,
          כי בכל אחד $b>a$.
      - kind: computation
        text: >-
          $\log_23$ מול $\frac32$: $3$ מול $2^{3/2}$, כלומר $3^2=9$ מול $2^3=8$. $9>8$, ולכן $\log_23>\frac32$.
      - kind: computation
        text: >-
          $\log_510$ מול $\frac32$: $10^2=100$ מול $5^3=125$. $100<125$, ולכן $\log_510<\frac32$. ו-$\log_34$ מול
          $\frac32$: $4^2=16$ מול $3^3=27$, ולכן גם $\log_34<\frac32$.
      - kind: computation
        text: >-
          נשאר להשוות את $\log_34$ ל-$\log_510$. נבדוק מול $\frac43$: $\log_34<\frac43$ כי $4^3=64<81=3^4$, ו-$\log_510>\frac43$
          כי $10^3=1000>625=5^4$. לכן $\log_34<\frac43<\log_510$.
      - kind: check
        text: >-
          במחשבון: $\log_32\approx0.631$, $\log_34\approx1.262$, $\log_510\approx1.431$, $\log_48=1.5$, $\log_23\approx1.585$.
      - kind: result
        text: >-
          $\log_32<\log_34<\log_510<\log_48<\log_23$; הגדול מכולם הוא $\log_23$.
    source:
      name: 'Oxford University Mathematics Admissions Test (via Underground Mathematics, resource R7231)'
      year: 2010
      problem: 'Q1E'
      url: https://undergroundmathematics.org/exp-and-log/r7231
      verified: '2026-11-26'
      adapted: true

  - id: W-4.3-c2
    stars: 2
    objectives: [OBJ-4.3-2]
    prompt: >-
      קבוצת הזוגות $(x,y)$ של מספרים חיוביים שמקיימים $x^y=y^x$ מורכבת מהישר $y=x$ ומעקום נוסף.


      (א) הציבו $y=kx$ עם $k>0$, $k\ne1$, ומצאו את $x$ ואת $y$ כפונקציות של $k$. בדקו ב-$k=2$.


      (ב) מצאו את הנקודה שבה העקום הנוסף חותך את הישר $y=x$. (רמז: מה קורה כש-$k$ מתקרב ל-1? הציבו $k=1+\frac1n$.)
    answer: >-
      (א) $x=k^{1/(k-1)}$, $y=k^{k/(k-1)}$; ב-$k=2$: $(2,4)$. (ב) הנקודה $(e,e)$.
    solution:
      - kind: idea
        text: >-
          שוויון של חזקות עם בסיס משתנה פותרים בלוגריתם, או בהעלאה בחזקה מתאימה. ההצבה $y=kx$ הופכת את שני הנעלמים
          לפרמטר אחד. נקודת החיתוך עם $y=x$ היא מה שקורה כש-$k\to1$, וההצבה $k=1+\frac1n$ מביאה את הגבול שמגדיר את $e$.
      - kind: computation
        text: >-
          (א) $x^{kx}=(kx)^x$. מעלים את שני הצדדים בחזקת $\frac1x$ (מותר: הכול חיובי): $x^k=kx$. מחלקים ב-$x$:
          $x^{k-1}=k$, ולכן $x=k^{1/(k-1)}$ ו-$y=kx=k\cdot k^{1/(k-1)}=k^{k/(k-1)}$.
      - kind: check
        text: >-
          ב-$k=2$: $x=2^1=2$, $y=2^2=4$, ואכן $2^4=16=4^2$. ב-$k=\frac12$ מתקבל $(4,2)$: אותו זוג בסדר הפוך.
      - kind: computation
        text: >-
          (ב) כש-$k$ מתקרב ל-1, הנקודה $(x,y)$ מתקרבת לישר $y=kx$ עם שיפוע כמעט 1. מציבים $k=1+\frac1n$: אז $k-1=\frac1n$,
          ולכן $x=\left(1+\frac1n\right)^n$ ו-$y=\left(1+\frac1n\right)^{n+1}=\left(1+\frac1n\right)^n\cdot\left(1+\frac1n\right)$.
      - kind: step
        text: >-
          כש-$n$ גדל, $x$ מתקרב ל-$e$ לפי ההגדרה של $e$, והגורם $1+\frac1n$ מתקרב ל-1, ולכן גם $y$ מתקרב ל-$e$. העקום מגיע לישר $y=x$
          בנקודה $(e,e)$.
      - kind: check
        text: >-
          הזוגות ב-$n=1,2,3,10$: $(2,4)$, $(2.25,3.375)$, $(2.370,3.160)$, $(2.594,2.853)$: הם מתקרבים זה לזה, משני צדי
          $e\approx2.718$. ובלוגריתמים, $x^y=y^x$ שקול ל-$\frac{\ln x}{x}=\frac{\ln y}{y}$: ב-$(2.25,3.375)$ שני הצדדים
          בערך $0.3604$.
      - kind: result
        text: >-
          העקום הוא $\left(k^{1/(k-1)},k^{k/(k-1)}\right)$, $k>0$, $k\ne1$, והוא חותך את הישר $y=x$ בנקודה $(e,e)$.
    source:
      name: 'The 22nd William Lowell Putnam Mathematical Competition (Kalva archive)'
      year: 1961
      problem: 'A1'
      url: https://prase.cz/kalva/putnam/psoln/psol611.html
      verified: '2026-11-26'
      adapted: true
