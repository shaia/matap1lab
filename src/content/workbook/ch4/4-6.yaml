# Workbook of lesson 4.6 — limits and continuity, intuitively.
# Objectives (src/course.ts):
#   OBJ-4.6-1  limits at a point and at infinity of elementary functions, including one-sided limits
#   OBJ-4.6-2  points of discontinuity, classified: removable, jump or infinite
#   OBJ-4.6-3  the intermediate value theorem and max/min on a closed interval to guarantee a solution or an extremum
# Limits are intuitive (tables, pictures, algebra): no epsilon-delta, no derivatives, no L'Hôpital.
# Every number recomputed with sympy in screens/tools/lesson-4-6.py.
lesson: '4.6'
practice:
  - id: W-4.6-01
    level: basic
    objectives: [OBJ-4.6-1]
    prompt: >-
      חשבו את $\lim_{x\to-2}\frac{x^3+8}{x+2}$, ובדקו את התשובה בטבלה של ארבעה ערכים: $x=-2.1,\ -2.01,\ -1.99,\ -1.9$.
    answer: >-
      $12$. בטבלה: $12.61$, $12.0601$, $11.9401$, $11.41$.
    solution:
      - kind: idea
        text: >-
          הצבה של $x=-2$ נותנת $\frac{-8+8}{0}=\frac00$: המונה והמכנה מתאפסים יחד, ולכן יש להם גורם משותף $(x+2)$.
          מפרקים, מצמצמים (מותר, כי $x\ne-2$) ומציבים.
      - kind: step
        text: >-
          המונה הוא סכום של שני חזקות שלישיות, $x^3+2^3$, והנוסחה מהתיכון: $a^3+b^3=(a+b)(a^2-ab+b^2)$. לכן
          $x^3+8=(x+2)(x^2-2x+4)$. (בדיקה בפתיחת סוגריים: $x^3-2x^2+4x+2x^2-4x+8=x^3+8$.)
      - kind: computation
        text: >-
          לכל $x\ne-2$: $\frac{x^3+8}{x+2}=x^2-2x+4$. מציבים $x=-2$: $4+4+4=12$.
      - kind: check
        text: >-
          $\frac{(-2.1)^3+8}{-0.1}=\frac{-9.261+8}{-0.1}=12.61$, ובאותו אופן $12.0601$ ב-$x=-2.01$, $11.9401$ ב-$x=-1.99$
          ו-$11.41$ ב-$x=-1.9$. הערכים מתקרבים ל-12 משני הצדדים.
      - kind: result
        text: >-
          $\lim_{x\to-2}\frac{x^3+8}{x+2}=12$.

  - id: W-4.6-02
    level: basic
    qualitative: true
    objectives: [OBJ-4.6-2, OBJ-4.6-1]
    prompt: >-
      לכל פונקציה מצאו את שני הגבולות החד-צדדיים בנקודה הנתונה, וסווגו את אי-הרציפות: סליקה, קפיצה או אינסופית.

      (א) $f(x)=\frac{|x-1|}{x-1}$ ב-$x=1$

      (ב) $g(x)=\frac{x^2+x}{x}$ ב-$x=0$

      (ג) $h(x)=\frac{1}{(x+2)^2}$ ב-$x=-2$
    answer: >-
      (א) משמאל מינוס 1, מימין 1: קפיצה בגודל 2. (ב) שני הצדדים 1: סליקה. (ג) משני הצדדים $h\to+\infty$: אינסופית.
    solution:
      - kind: idea
        text: >-
          בכל נקודה מחשבים כל צד לחוד, ומכריעים: אותו מספר משני הצדדים והערך חסר, סליקה; מספרים שונים, קפיצה; צד
          אינסופי, אינסופית.
      - kind: computation
        text: >-
          (א) כש-$x>1$, $|x-1|=x-1$ והמנה 1. כש-$x<1$, $|x-1|=-(x-1)$ והמנה מינוס 1. לכן הגבול מימין 1 והגבול משמאל
          מינוס 1: שני מספרים שונים, קפיצה בגודל $1-(-1)=2$.
      - kind: computation
        text: >-
          (ב) לכל $x\ne0$: $\frac{x^2+x}{x}=\frac{x(x+1)}{x}=x+1$, ולכן שני הגבולות החד-צדדיים הם 1. $g(0)$ אינה
          מוגדרת: אי-רציפות סליקה (מתקנים ב-$g(0)=1$).
      - kind: computation
        text: >-
          (ג) המונה 1 והמכנה $(x+2)^2$ שואף ל-0 ונשאר חיובי משני הצדדים. לכן $h\to+\infty$ משני הצדדים: אי-רציפות
          אינסופית, עם אסימפטוטה אנכית $x=-2$.
      - kind: check
        text: >-
          (א) $f(0.9)=\frac{0.1}{-0.1}$, כלומר מינוס 1, ו-$f(1.1)=1$. (ב) $g(0.01)=1.01$. (ג) $h(-2.01)=h(-1.99)=10000$.
      - kind: result
        text: >-
          (א) קפיצה. (ב) סליקה, הגבול 1. (ג) אינסופית.

  - id: W-4.6-03
    level: basic
    objectives: [OBJ-4.6-3]
    prompt: >-
      הראו שלמשוואה $2^x=3x$ יש לפחות שני פתרונות: אחד בקטע $(0,1)$ ואחד בקטע $(3,4)$.
    answer: >-
      $g(x)=2^x-3x$ רציפה; $g(0)=1>0$, $g(1)=-1<0$, $g(3)=-1<0$, $g(4)=4>0$. לפי משפט ערך הביניים יש שורש בכל אחד
      מהקטעים.
    solution:
      - kind: idea
        text: >-
          מעבירים הכול לאגף אחד, $g(x)=2^x-3x$, ומחפשים החלפת סימן בקצוות של כל קטע. פונקציה רציפה שמחליפה סימן
          חוצה את 0 (משפט ערך הביניים).
      - kind: step
        text: >-
          $g$ רציפה בכל מקום: $2^x$ פונקציה מעריכית (שיעור 4.3) ו-$3x$ פולינום, וההפרש של שתי פונקציות רציפות רציף.
      - kind: computation
        text: >-
          $g(0)=1-0=1>0$, $g(1)=2-3=-1<0$. לכן יש שורש ב-$(0,1)$.
      - kind: computation
        text: >-
          $g(3)=8-9=-1<0$, $g(4)=16-12=4>0$. לכן יש שורש ב-$(3,4)$.
      - kind: check
        text: >-
          הקטעים אינם חופפים, ולכן אלה שני פתרונות שונים. בחישוב מספרי הם בערך $0.458$ ו-$3.313$. שימו לב ש-$g(2)=4-6=-2$:
          בין 1 ל-3 הפונקציה שלילית בקצוות, והמשפט אינו אומר שם דבר.
      - kind: result
        text: >-
          יש פתרון ב-$(0,1)$ ופתרון ב-$(3,4)$.

  - id: W-4.6-04
    level: mid
    objectives: [OBJ-4.6-1]
    prompt: >-
      חשבו:

      (א) $\lim_{x\to1}\frac{\sqrt x-1}{x-1}$

      (ב) $\lim_{x\to9}\frac{x-9}{\sqrt x-3}$
    answer: >-
      (א) $\frac12$. (ב) $6$.
    solution:
      - kind: idea
        text: >-
          בשניהם ההצבה נותנת $\frac00$, ויש שורש. כופלים בצמוד, כדי ש-$(A-B)(A+B)=A^2-B^2$ יעלים את השורש. ב-(ב) אפשר גם
          לראות את $x-9$ כהפרש ריבועים: $x-9=(\sqrt x)^2-3^2$ כש-$x\ge0$.
      - kind: computation
        text: >-
          (א) $\frac{\sqrt x-1}{x-1}\cdot\frac{\sqrt x+1}{\sqrt x+1}=\frac{x-1}{(x-1)(\sqrt x+1)}=\frac{1}{\sqrt x+1}$ לכל
          $x\ne1$ (ו-$x\ge0$). מציבים $x=1$: $\frac{1}{1+1}=\frac12$.
      - kind: computation
        text: >-
          (ב) $x-9=(\sqrt x-3)(\sqrt x+3)$, ולכן $\frac{x-9}{\sqrt x-3}=\sqrt x+3$ לכל $x\ne9$. מציבים: $3+3=6$.
      - kind: check
        text: >-
          (א) ב-$x=0.99$ המנה בערך $0.50126$, וב-$x=1.01$ בערך $0.49876$. (ב) בדרך של (א): $\frac{\sqrt x-3}{x-9}=\frac{1}{\sqrt x+3}\to\frac16$,
          והביטוי של (ב) הוא ההופכי שלו, ולכן שואף ל-6. ב-$x=9.01$: $\sqrt{9.01}+3\approx6.0017$.
      - kind: result
        text: >-
          (א) $\frac12$. (ב) $6$.

  - id: W-4.6-05
    level: mid
    objectives: [OBJ-4.6-1]
    prompt: >-
      חשבו:

      (א) $\lim_{x\to\infty}\left(\frac{x^2+1}{x+1}-x\right)$

      (ב) $\lim_{x\to\infty}\frac{2^x+3^x}{3^x}$

      (ג) $\lim_{x\to\infty}x\sin\frac1x$
    answer: >-
      (א) מינוס 1. (ב) 1. (ג) 1.
    solution:
      - kind: idea
        text: >-
          (א) $\infty-\infty$: מכנה משותף הופך את ההפרש למנה. (ב) מחלקים בגורם השולט, $3^x$. (ג) הצבה $t=\frac1x$ מעבירה את
          הגבול באינסוף לגבול המיוחד ליד 0.
      - kind: computation
        text: >-
          (א) $\frac{x^2+1}{x+1}-x=\frac{x^2+1-x(x+1)}{x+1}=\frac{1-x}{x+1}$. מחלקים מונה ומכנה ב-$x$:
          $\frac{\frac1x-1}{1+\frac1x}\to\frac{0-1}{1+0}$, כלומר מינוס 1.
      - kind: computation
        text: >-
          (ב) $\frac{2^x+3^x}{3^x}=\left(\frac23\right)^x+1$. הבסיס $\frac23$ קטן מ-1, ולכן $\left(\frac23\right)^x\to0$
          (שיעור 4.3), והגבול 1.
      - kind: computation
        text: >-
          (ג) נסמן $t=\frac1x$. כש-$x\to\infty$, $t\to0^+$, ו-$x\sin\frac1x=\frac{\sin t}{t}\to1$.
      - kind: check
        text: >-
          (א) ב-$x=100$: $\frac{-99}{101}\approx-0.980$. (ב) ב-$x=10$: $1+\left(\frac23\right)^{10}\approx1.0173$. (ג) ב-$x=100$:
          $100\sin0.01\approx0.99998$. שימו לב ש-(ג) אינו "אינסוף כפול 0 שווה 0": $x$ גדל ו-$\sin\frac1x$ קטן באותו קצב.
      - kind: result
        text: >-
          (א) מינוס 1. (ב) 1. (ג) 1.

  - id: W-4.6-06
    level: mid
    objectives: [OBJ-4.6-2, OBJ-4.6-1]
    prompt: >-
      $f(x)=\frac{x^2-2x}{x^2-4}$.

      (א) מצאו את כל הנקודות שבהן $f$ אינה רציפה, וסווגו כל אחת. בנקודה אינסופית מצאו את הסימן בכל צד.

      (ב) מצאו את $\lim_{x\to\infty}f(x)$ ואת $\lim_{x\to-\infty}f(x)$.
    answer: >-
      (א) ב-$x=2$ סליקה (הגבול $\frac12$); ב-$x=-2$ אינסופית: משמאל $f\to+\infty$, מימין $f\to-\infty$. (ב) שני הגבולות 1.
    solution:
      - kind: idea
        text: >-
          הנקודות החשודות הן אפסי המכנה. מפרקים מונה ומכנה, מצמצמים, ובכל נקודה בודקים: אם הגורם התבטל, הגבול סופי
          (סליקה); אם נשאר "מספר חלקי אפס", אינסופית.
      - kind: computation
        text: >-
          $x^2-2x=x(x-2)$ ו-$x^2-4=(x-2)(x+2)$. המכנה מתאפס ב-$x=2$ וב-$x=-2$. לכל $x\ne\pm2$: $f(x)=\frac{x}{x+2}$.
      - kind: computation
        text: >-
          ב-$x=2$: $\lim_{x\to2}f(x)=\frac{2}{4}=\frac12$, גבול סופי ו-$f(2)$ אינה מוגדרת: סליקה.
      - kind: computation
        text: >-
          ב-$x=-2$: המונה שואף ל-מינוס 2 והמכנה $x+2$ ל-0. משמאל ($x<-2$) המכנה שלילי, ושלילי חלקי שלילי חיובי:
          $f\to+\infty$. מימין המכנה חיובי: $f\to-\infty$. אי-רציפות אינסופית.
      - kind: computation
        text: >-
          (ב) מחלקים ב-$x$: $\frac{1}{1+\frac2x}\to1$, גם כש-$x\to\infty$ וגם כש-$x\to-\infty$. הישר $y=1$ הוא אסימפטוטה אופקית.
      - kind: check
        text: >-
          $f(-2.01)=\frac{-2.01}{-0.01}=201$ ו-$f(-1.99)=\frac{-1.99}{0.01}=-199$: הסימנים מתאימים. ובשאר הנקודות $f$ מנה של
          פולינומים עם מכנה שאינו 0, ולכן רציפה.
      - kind: result
        text: >-
          סליקה ב-2, אינסופית ב-$x=-2$ (משמאל $f\to+\infty$, מימין $f\to-\infty$); הגבול באינסוף 1 בשני הכיוונים.

  - id: W-4.6-07
    level: mid
    qualitative: true
    objectives: [OBJ-4.6-3]
    prompt: >-
      לכל פונקציה קבעו אם יש לה ערך גדול ביותר ואם יש לה ערך קטן ביותר בקטע הנתון, ונמקו: האם משפט קיום מקסימום
      ומינימום חל, ואם לא, מה קורה בפועל.

      (א) $x^2$ בקטע $(-1,1)$

      (ב) $\frac1x$ בקטע $[1,2]$

      (ג) $\tan x$ בקטע $\left[0,\frac{\pi}{2}\right)$

      (ד) $f(x)=x$ כש-$0\le x<1$, ו-$f(x)=0$ כש-$1\le x\le2$, בקטע $[0,2]$
    answer: >-
      (א) מינימום 0, אין מקסימום. (ב) מקסימום 1, מינימום $\frac12$ (המשפט חל). (ג) מינימום 0, אין מקסימום. (ד) מינימום 0,
      אין מקסימום (אין רציפות ב-1).
    solution:
      - kind: theorem
        text: >-
          המשפט: פונקציה רציפה בקטע **סגור** מקבלת בו מקסימום ומינימום. כשאחד התנאים חסר, המשפט שותק, ובודקים בעצמנו.
      - kind: step
        text: >-
          (א) הקטע פתוח, והמשפט אינו חל. $x^2\ge0$ ו-$0^2=0$, ו-0 בקטע: המינימום 0 מתקבל. הערכים מתקרבים ל-1 כש-$x\to\pm1$,
          אבל $\pm1$ אינם בקטע, ולכל $x$ בקטע יש $x$ קרוב יותר לקצה עם ערך גדול יותר: אין מקסימום.
      - kind: step
        text: >-
          (ב) $\frac1x$ רציפה ב-$[1,2]$ (0 אינו בקטע), והקטע סגור: המשפט חל. $\frac1x$ יורדת, ולכן המקסימום $\frac11=1$
          ב-$x=1$ והמינימום $\frac12$ ב-$x=2$.
      - kind: step
        text: >-
          (ג) הקטע אינו סגור בקצה $\frac{\pi}{2}$, ושם $\tan x\to+\infty$: הפונקציה אינה חסומה מלמעלה, ואין מקסימום.
          המינימום $\tan0=0$ מתקבל.
      - kind: step
        text: >-
          (ד) הקטע סגור, אבל $f$ אינה רציפה ב-1: משמאל הגבול 1, מימין 0. הערכים הם כל המספרים ב-$[0,1)$, ו-0. הם
          מתקרבים ל-1 בלי להגיע: אין מקסימום. המינימום 0 מתקבל, ב-$x=0$ ובכל $[1,2]$.
      - kind: check
        text: >-
          בכל מקרה שבו אין מקסימום, אפשר להראות "עוד אחד גדול יותר": ב-(א) $f(0.99)=0.9801<f(0.999)$; ב-(ד)
          $f(0.99)=0.99<f(0.999)=0.999$, ושניהם קטנים מ-1. ו-(ב) הוא היחיד שבו כל תנאי המשפט מתקיימים.
      - kind: result
        text: >-
          (א) מינימום 0, אין מקסימום. (ב) 1 ו-$\frac12$. (ג) מינימום 0, אין מקסימום. (ד) מינימום 0, אין מקסימום.

  - id: W-4.6-08
    level: exam
    objectives: [OBJ-4.6-1, OBJ-4.6-2]
    prompt: >-
      (א) חשבו את $\lim_{x\to0}\frac{\sin3x}{x}$ ואת $\lim_{x\to0}\frac{\sin5x}{\sin2x}$.

      (ב) חשבו את $\lim_{x\to0}\frac{1-\cos x}{x^2}$. רמז: $1-\cos x=2\sin^2\frac x2$.

      (ג) $g(x)=\frac{1-\cos x}{x^2}$ כש-$x\ne0$, ו-$g(0)=a$. לאיזה $a$ הפונקציה רציפה ב-0? איזו אי-רציפות יש ל-$g$ ב-0
      לכל $a$ אחר?
    answer: >-
      (א) $3$ ו-$\frac52$. (ב) $\frac12$. (ג) $a=\frac12$; לכל $a$ אחר אי-רציפות סליקה.
    solution:
      - kind: idea
        text: >-
          כל הגבולות מהצורה $\frac00$ עם סינוס. משתמשים בגבול המיוחד $\frac{\sin t}{t}\to1$ כש-$t\to0$, אחרי שמתאימים את
          הצורה: מה שבתוך הסינוס צריך להופיע גם במכנה.
      - kind: computation
        text: >-
          (א) $\frac{\sin3x}{x}=3\cdot\frac{\sin3x}{3x}$. כש-$x\to0$ גם $3x\to0$, ולכן הגבול $3\cdot1=3$.
      - kind: computation
        text: >-
          ב-$\frac{\sin5x}{\sin2x}$ יש שני סינוסים, ולכל אחד צריך מכנה משלו עם אותו דבר שבתוכו: $5x$ מתחת ל-$\sin5x$, ו-$2x$
          מעל $\sin2x$ (כי הסינוס הזה במכנה, ושם הגבול המיוחד מופיע הפוך). מכפילים ומחלקים בהם, ומה שנשאר הוא מספר:
          $\frac{\sin5x}{\sin2x}=\frac{\sin5x}{5x}\cdot\frac{2x}{\sin2x}\cdot\frac{5x}{2x}$. הגורם הראשון שואף ל-1, השני
          ל-$\frac11=1$, והשלישי שווה $\frac52$ (כש-$x\ne0$). לפי כלל המכפלה של גבולות, הגבול $1\cdot1\cdot\frac52=\frac52$.
      - kind: step
        text: >-
          (ב) הזהות מהתיכון $\cos2\alpha=1-2\sin^2\alpha$ עם $\alpha=\frac x2$ נותנת $1-\cos x=2\sin^2\frac x2$.
      - kind: computation
        text: >-
          לכן $\frac{1-\cos x}{x^2}=\frac{2\sin^2\frac x2}{x^2}=\frac{2}{4}\cdot\left(\frac{\sin\frac x2}{\frac x2}\right)^2$,
          כי $x^2=4\left(\frac x2\right)^2$. הסוגריים שואפים ל-1, והגבול $\frac12$.
      - kind: step
        text: >-
          (ג) רציפות ב-0 דורשת $g(0)=\lim_{x\to0}g(x)$, כלומר $a=\frac12$. לכל $a$ אחר הגבול קיים (ושווה $\frac12$), אבל שונה
          מ-$g(0)$: זו בדיוק אי-רציפות סליקה, לא קפיצה.
      - kind: check
        text: >-
          ב-$x=0.01$: $\frac{\sin0.05}{\sin0.02}\approx2.4991$; $\frac{1-\cos0.1}{0.01}\approx0.49958$, ו-$\frac{1-\cos0.01}{0.0001}\approx0.4999958$.
      - kind: result
        text: >-
          (א) $3$, $\frac52$. (ב) $\frac12$. (ג) $a=\frac12$.

  - id: W-4.6-09
    level: exam
    qualitative: true
    objectives: [OBJ-4.6-3]
    prompt: >-
      טבעת מתכת דקה מחוממת באופן לא אחיד. נסמן ב-$T(\theta)$ את הטמפרטורה בנקודה שבזווית $\theta$ על הטבעת, ונניח ש-$T$
      רציפה. כמובן $T(\theta+2\pi)=T(\theta)$: זו אותה נקודה.

      (א) הוכיחו שיש על הטבעת שתי נקודות **נגדיות** (במרחק חצי סיבוב זו מזו) שהטמפרטורה בהן שווה.

      (ב) מוט ישר באורך $L$ מחומם באופן לא אחיד, והטמפרטורה לאורכו רציפה. האם בהכרח יש בו שתי נקודות במרחק $\frac L2$
      זו מזו עם אותה טמפרטורה? הוכיחו או תנו דוגמה נגדית.
    answer: >-
      (א) $g(\theta)=T(\theta)-T(\theta+\pi)$ רציפה ו-$g(\pi)=-g(0)$; לפי משפט ערך הביניים יש ל-$g$ אפס ב-$[0,\pi]$. (ב) לא:
      למשל טמפרטורה שעולה לאורך המוט, $T(x)=20+x$.
    solution:
      - kind: idea
        text: >-
          כמו בשאלת המטיילת: שאלה על "שני מקומות עם אותו ערך" הופכת לשאלה על השורש של הפרש. בטבעת ההפרש מחליף סימן
          כשמסובבים חצי סיבוב, כי הנקודות מחליפות תפקידים.
      - kind: step
        text: >-
          (א) נגדיר $g(\theta)=T(\theta)-T(\theta+\pi)$, ההפרש בין נקודה לנקודה הנגדית לה. $g$ רציפה (הפרש של פונקציות
          רציפות).
      - kind: computation
        text: >-
          $g(0)=T(0)-T(\pi)$, ו-$g(\pi)=T(\pi)-T(2\pi)=T(\pi)-T(0)=-g(0)$.
      - kind: step
        text: >-
          אם $g(0)=0$, הנקודות $0$ ו-$\pi$ הן התשובה. אחרת $g(0)$ ו-$g(\pi)$ בסימנים מנוגדים, ו-$g$ רציפה ב-$[0,\pi]$: לפי
          משפט ערך הביניים יש $\theta_0$ עם $g(\theta_0)=0$, כלומר $T(\theta_0)=T(\theta_0+\pi)$.
      - kind: step
        text: >-
          (ב) לא בהכרח. מודדים את המקום על המוט ב-$x\in[0,L]$, ונניח $T(x)=20+x$, טמפרטורה שעולה מקצה לקצה. לכל $x$ שבו
          גם $x+\frac L2$ על המוט: $T\left(x+\frac L2\right)-T(x)=\frac L2\ne0$. אין זוג כזה.
      - kind: check
        text: >-
          מה שונה במוט: בטבעת, אחרי חצי סיבוב חוזרים לאותן שתי נקודות בסדר הפוך, ולכן ההפרש מתהפך. במוט אין "חזרה",
          ו-$g(x)=T(x)-T\left(x+\frac L2\right)$ יכולה להישאר בסימן אחד. בדוגמה של (ב) היא תמיד מינוס $\frac L2$.
      - kind: result
        text: >-
          (א) בטבעת יש תמיד שתי נקודות נגדיות עם אותה טמפרטורה. (ב) במוט לא בהכרח.

  - id: W-4.6-10
    level: exam
    objectives: [OBJ-4.6-3]
    prompt: >-
      $f(x)=x^3+2x-5$.

      (א) הראו של-$f$ יש שורש בקטע $[1,2]$, והראו שהוא השורש היחיד של $f$ בכל הישר.

      (ב) בצעו ארבעה צעדים של שיטת החצייה, החל מ-$[1,2]$. מהו הקטע שמתקבל?

      (ג) כמה צעדים של חצייה, החל מ-$[1,2]$, צריך כדי לקבל קטע שאורכו קטן מ-$0.001$?
    answer: >-
      (א) $f(1)=-2<0<7=f(2)$; $f$ עולה, ולכן שורש אחד בלבד. (ב) $[1.3125,\ 1.375]$. (ג) 10 צעדים.
    solution:
      - kind: idea
        text: >-
          קיום ממשפט ערך הביניים (רציפות והחלפת סימן); יחידות מכך ש-$f$ עולה; החצייה ממשיכה בכל צעד עם החצי שבקצותיו
          הסימן מתחלף, והאורך קטן פי 2.
      - kind: computation
        text: >-
          (א) $f$ פולינום, ולכן רציפה. $f(1)=1+2-5=-2<0$ ו-$f(2)=8+4-5=7>0$: יש שורש ב-$(1,2)$.
      - kind: step
        text: >-
          יחידות: אם $x_1<x_2$, אז $x_1^3<x_2^3$ (חזקה שלישית שומרת על הסדר) ו-$2x_1<2x_2$, ולכן $f(x_1)<f(x_2)$: $f$ עולה
          בכל הישר, ומקבלת כל ערך, ובפרט 0, לכל היותר פעם אחת.
      - kind: computation
        text: >-
          (ב) $f(1)<0$. אמצע 1.5: $f(1.5)=3.375+3-5=1.375>0$, סימן הפוך לקצה השמאלי: $[1,1.5]$. אמצע 1.25:
          $f(1.25)\approx-0.547<0$: $[1.25,1.5]$. אמצע 1.375: $f(1.375)\approx0.350>0$: $[1.25,1.375]$. אמצע 1.3125:
          $f(1.3125)\approx-0.114<0$: $[1.3125,1.375]$.
      - kind: computation
        text: >-
          (ג) אחרי $n$ צעדים האורך $\frac{1}{2^n}$. צריך $2^n>1000$: $2^9=512$ אינו מספיק, ו-$2^{10}=1024$ מספיק. 10 צעדים.
      - kind: check
        text: >-
          הקטע $[1.3125,1.375]$ באורך $\frac{1}{16}$, כמו שצריך אחרי ארבעה צעדים, והשורש (מחושב) בערך $1.3283$ נמצא בו.
      - kind: result
        text: >-
          (א) שורש יחיד, ב-$(1,2)$. (ב) $[1.3125,\ 1.375]$. (ג) 10.

challenge:
  - id: W-4.6-c1
    stars: 1
    objectives: [OBJ-4.6-3]
    prompt: >-
      המשפט "הקוסינוס של $t$ שווה ל-$t$ בשלישית".

      (א) כתבו אותו כמשוואה.

      (ב) הוכיחו שלמשוואה יש לפחות פתרון ממשי אחד.

      (ג) מצאו, בעזרת מחשבון, קטע באורך $0.01$ שמכיל פתרון.

      (ד) הוכיחו שלמשוואה יש **בדיוק** פתרון ממשי אחד.
    answer: >-
      (א) $\cos t=t^3$. (ב) $g(t)=\cos t-t^3$: $g(0)=1>0$, $g(1)=\cos1-1<0$, ומשפט ערך הביניים. (ג) $[0.86,0.87]$. (ד) מחוץ
      ל-$[0,1]$ אין פתרון, ובתוכו $g$ יורדת.
    solution:
      - kind: idea
        text: >-
          מעבירים הכול לאגף אחד, $g(t)=\cos t-t^3$, ומחפשים שורש. קיום: משפט ערך הביניים. מיקום: חצייה, או בדיקה של
          הסימן בקצות קטעים קצרים. יחידות: מראים שמחוץ לקטע מסוים אין פתרון, ובתוכו $g$ יורדת.
      - kind: computation
        text: >-
          (ב) $g$ רציפה (קוסינוס ופולינום). $g(0)=1-0=1>0$, ו-$g(1)=\cos1-1\approx0.5403-1=-0.4597<0$. לפי משפט ערך
          הביניים יש $t\in(0,1)$ עם $g(t)=0$.
      - kind: computation
        text: >-
          (ג) בשיטת החצייה מ-$[0,1]$: $g(0.5)>0$, $g(0.75)>0$, $g(0.875)\approx-0.029<0$, $g(0.8125)>0$, $g(0.84375)>0$,
          $g(0.859375)\approx0.018>0$, $g(0.8671875)\approx-0.005<0$. אחרי שבעה צעדים הקטע $[0.859375,\ 0.8671875]$, באורך
          $\frac{1}{128}<0.01$. קטע עגול יותר: $g(0.86)\approx0.0164>0$ ו-$g(0.87)\approx-0.0137<0$, ולכן יש פתרון ב-$[0.86,0.87]$.
      - kind: step
        text: >-
          (ד) מחוץ ל-$[0,1]$ אין פתרון. כש-$t>1$: $t^3>1\ge\cos t$. כש-$t<-1$: $t^3<-1\le\cos t$. וכש-$t\in[-1,0)$: $t^3<0$,
          ואילו $\cos t\ge\cos1>0$, כי שם $|t|\le1<\frac{\pi}{2}$. בכל המקרים $\cos t\ne t^3$.
      - kind: step
        text: >-
          ב-$[0,1]$: אם $0\le t_1<t_2\le1$, אז $\cos t_1>\cos t_2$ (במעגל היחידה, ברביע הראשון הקוסינוס יורד, שיעור 4.4)
          ו-$t_1^3<t_2^3$. לכן $g(t_1)>g(t_2)$: $g$ יורדת, ומתאפסת לכל היותר פעם אחת. עם (ב), בדיוק פעם אחת.
      - kind: check
        text: >-
          הפתרון (מחושב) בערך $0.86547$, בתוך שני הקטעים של (ג). ו-$\cos0.86547\approx0.6483\approx0.86547^3$.
      - kind: result
        text: >-
          למשוואה $\cos t=t^3$ יש פתרון יחיד, בקטע $[0.86,\ 0.87]$.
    source:
      name: 'G. Strang, E. Herman, Calculus Volume 1 (OpenStax)'
      year: 2016
      problem: 'Section 2.4 (Continuity), exercise 152; part (ד) added'
      url: https://openstax.org/books/calculus-volume-1/pages/2-4-continuity
      verified: '2026-11-26'
      adapted: true

  - id: W-4.6-c2
    stars: 1
    objectives: [OBJ-4.6-3]
    prompt: >-
      רוכבת אופניים עוברת 10 קילומטרים ב-40 דקות, תמיד קדימה (אבל לא בהכרח במהירות קבועה). נסמן ב-$s(t)$ את המרחק
      שעברה אחרי $t$ דקות; $s$ רציפה, $s(0)=0$ ו-$s(40)=10$.

      (א) הוכיחו שיש פרק זמן של 8 דקות בדיוק שבו עברה 2 קילומטרים בדיוק.

      (ב) נסו להפעיל את אותו נימוק על פרק זמן של 12 דקות ו-3 קילומטרים (שוב בדיוק הקצב הממוצע). איפה הוא נשבר?
    answer: >-
      (א) $D(t)=s(t+8)-s(t)$ על $[0,32]$: $D(0)+D(8)+D(16)+D(24)+D(32)=10$, ולכן לא כל הערכים בצד אחד של 2, ומשפט
      ערך הביניים. (ב) 40 אינו כפולה של 12: חלונות של 12 דקות אינם מכסים בדיוק את הנסיעה.
    solution:
      - kind: idea
        text: >-
          מסתכלים על הדרך שעוברים בכל "חלון" של 8 דקות כפונקציה של זמן ההתחלה. חמישה חלונות צמודים מכסים את כל 40 הדקות,
          ולכן סכום הדרכים בהם הוא 10, והממוצע 2. אם לא כולם 2, יש חלון מעל 2 וחלון מתחת ל-2, ומשפט ערך הביניים מוצא
          חלון באמצע.
      - kind: definition
        text: >-
          $D(t)=s(t+8)-s(t)$ לכל $t\in[0,32]$: הדרך שעברה בין הדקה $t$ לדקה $t+8$. $D$ רציפה, כהפרש של שתי פונקציות רציפות.
      - kind: computation
        text: >-
          (א) בסכום של חמשת החלונות הצמודים כל איבר באמצע מופיע פעם בפלוס ופעם במינוס, ונשארים רק הקצוות:
          $D(0)+D(8)+D(16)+D(24)+D(32)=s(40)-s(0)=10$.
      - kind: step
        text: >-
          לחמישה מספרים שסכומם 10 יש ממוצע 2. אם אחד מהם שווה 2, מצאנו חלון. אחרת לא ייתכן שכולם גדולים מ-2 (הסכום היה
          גדול מ-10) או שכולם קטנים מ-2. לכן יש זמנים $t_1$, $t_2$ עם $D(t_1)<2<D(t_2)$.
      - kind: theorem
        text: >-
          $D$ רציפה בקטע הסגור שבין $t_1$ ל-$t_2$, ו-2 בין $D(t_1)$ ל-$D(t_2)$. לפי משפט ערך הביניים יש $t^*$ ביניהם עם
          $D(t^*)=2$: בין הדקה $t^*$ לדקה $t^*+8$ היא עברה בדיוק 2 קילומטרים.
      - kind: step
        text: >-
          (ב) החלונות של 12 דקות שמתחילים ב-0, 12 ו-24 מכסים רק 36 דקות, וחלון רביעי כבר חורג מ-40. הסכום שלהם הוא
          $s(36)-s(0)$, ואין סיבה שיהיה 9 (שלושה חלונות כפול 3). לכן אי אפשר להסיק שיש חלון מעל 3 וחלון מתחת ל-3, והנימוק
          נשבר. אפשר להראות (לא נעשה זאת כאן) שיש נסיעות שבהן **אין** אף פרק של 12 דקות עם 3 קילומטרים בדיוק: הנימוק עובד
          רק כשאורך החלון מחלק את זמן הנסיעה.
      - kind: check
        text: >-
          במקרה הפשוט, נסיעה בקצב קבוע $s(t)=\frac{t}{4}$: $D(t)=\frac{8}{4}=2$ לכל $t$, וכל חלון מתאים. ובנסיעה שבה
          הרוכבת עוצרת לגמרי בדקות 0–8 ומשלימה את הדרך בדקות 8–40, $D(0)=0<2$. אם בדקות 8–40 היא רוכבת בקצב קבוע, 10 קילומטרים ב-32 דקות, אז $D(8)=8\cdot\frac{10}{32}=2.5>2$: החלון שמחפשים מתחיל בין 0 ל-8.
      - kind: result
        text: >-
          (א) יש פרק של 8 דקות בדיוק עם 2 קילומטרים בדיוק. (ב) הנימוק דורש שחלונות צמודים יכסו את כל הנסיעה, ו-12 אינו
          מחלק את 40.
    source:
      name: 'K. Mahlburg, LSU Problem Solving Seminar, Fall 2018, handout "Calculus and Functions" (Sep. 12)'
      year: 2018
      problem: 'Warm Up 3 (10 miles in 40 minutes), parts (a) and (b); miles changed to kilometres, (b) asked as where the argument breaks'
      url: https://www.math.lsu.edu/~mahlburg/teaching/handouts/2018F-3903/Practice4.pdf
      verified: '2026-11-26'
      adapted: true
