# Workbook of lesson 7.1 — the antiderivative and the fundamental theorem.
# Objectives (src/course.ts):
#   OBJ-7.1-1  define an antiderivative and see why it is determined up to a constant
#   OBJ-7.1-2  state the fundamental theorem of calculus and use it to compute a definite integral
#   OBJ-7.1-3  immediate integrals from the table and by linearity
# Order of knowledge: the basic table and linearity only (no substitution beyond a linear inner function, no parts).
# Every number recomputed with sympy in screens/tools/lesson-7-1.py.
lesson: '7.1'
practice:
  - id: W-7.1-01
    level: basic
    objectives: [OBJ-7.1-3]
    prompt: >-
      חשבו $\int\left(6x^5-4\sqrt[3]{x}+\frac{3}{x^4}\right)dx$ בתחום $x>0$, ובדקו בגזירה.
    answer: >-
      $x^6-3x^{4/3}-\frac{1}{x^3}+C$
    solution:
      - kind: idea
        text: >-
          לינאריות: מפרקים לשלושה איברים. כל איבר כותבים כחזקה של $x$ ומפעילים את כלל החזקה: מעלים את המעריך באחד
          ומחלקים במעריך החדש.
      - kind: step
        text: >-
          כותבים כחזקות: $\sqrt[3]{x}=x^{1/3}$ ו-$\frac{3}{x^4}=3x^{-4}$.
      - kind: computation
        text: >-
          $\int6x^5\,dx=6\cdot\frac{x^6}{6}=x^6$. $\int4x^{1/3}\,dx=4\cdot\frac{x^{4/3}}{4/3}=3x^{4/3}$, ובשאלה הוא עם מינוס.
          $\int3x^{-4}\,dx=3\cdot\frac{x^{-3}}{-3}=-x^{-3}=-\frac{1}{x^3}$.
      - kind: check
        text: >-
          $\left(x^6\right)'=6x^5$; $\left(3x^{4/3}\right)'=3\cdot\frac43x^{1/3}=4\sqrt[3]{x}$; $\left(x^{-3}\right)'=-3x^{-4}$, ועם המינוס שלפניו $+\frac{3}{x^4}$. מתקבל האינטגרנד. ✓
      - kind: result
        text: >-
          $\int\left(6x^5-4\sqrt[3]{x}+\frac{3}{x^4}\right)dx=x^6-3x^{4/3}-\frac{1}{x^3}+C$.

  - id: W-7.1-02
    level: basic
    objectives: [OBJ-7.1-3]
    prompt: >-
      חשבו $\int\left(3e^x-\frac{2}{1+x^2}+\frac{4}{\sqrt{1-x^2}}+\cosh x\right)dx$ בקטע $|x|<1$.
    answer: >-
      $3e^x-2\arctan x+4\arcsin x+\sinh x+C$
    solution:
      - kind: idea
        text: >-
          ארבעה איברים, וכל אחד הוא קבוע כפול שורה מהטבלה. כל שורה היא נגזרת מפרק 5 קרואה מהסוף.
      - kind: computation
        text: >-
          $\int3e^x\,dx=3e^x$; $\int\frac{2}{1+x^2}\,dx=2\arctan x$, ובשאלה הוא עם מינוס; $\int\frac{4}{\sqrt{1-x^2}}\,dx=4\arcsin x$;
          $\int\cosh x\,dx=\sinh x$.
      - kind: step
        text: >-
          הקטע $|x|<1$ נבחר כי שם $\sqrt{1-x^2}$ מוגדר וחיובי, ו-$\arcsin x$ גזירה.
      - kind: check
        text: >-
          גוזרים איבר איבר: $(3e^x)'=3e^x$, $(2\arctan x)'=\frac{2}{1+x^2}$, $(4\arcsin x)'=\frac{4}{\sqrt{1-x^2}}$ ו-$(\sinh x)'=\cosh x$; עם הסימנים מתקבל האינטגרנד. ✓
      - kind: result
        text: >-
          $3e^x-2\arctan x+4\arcsin x+\sinh x+C$.

  - id: W-7.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-7.1-1]
    prompt: >-
      בכל זוג קבעו אם $G$ היא פונקציה קדומה של $g$ בתחום הנתון, בלי לחשב אינטגרל.

      (א) $g(x)=\frac{1}{2\sqrt x}$, $G(x)=\sqrt x+3$, בתחום $x>0$.

      (ב) $g(x)=\ln x$, $G(x)=\frac1x$, בתחום $x>0$.

      (ג) $g(x)=xe^x$, $G(x)=(x-1)e^x$, על כל הישר.

      (ד) $g(x)=\frac{1}{x\ln x}$, $G(x)=\ln(\ln x)$, בתחום $x>1$.
    answer: >-
      (א) כן. (ב) לא. (ג) כן. (ד) כן.
    solution:
      - kind: idea
        text: >-
          לפי ההגדרה, $G$ קדומה של $g$ אם $G'=g$. לכן גוזרים את $G$ (לא את $g$) ומשווים.
      - kind: computation
        text: >-
          (א) $\left(\sqrt x+3\right)'=\frac{1}{2\sqrt x}$: כן. הקבוע 3 נעלם בגזירה.
      - kind: computation
        text: >-
          (ב) $\left(\frac1x\right)'=-\frac{1}{x^2}\ne\ln x$: לא. זו הטעות ההפוכה: $\frac1x$ היא **הנגזרת** של $\ln x$, לא
          קדומה שלו.
      - kind: computation
        text: >-
          (ג) בכלל המכפלה: $\bigl((x-1)e^x\bigr)'=1\cdot e^x+(x-1)e^x=xe^x$: כן.
      - kind: computation
        text: >-
          (ד) בכלל השרשרת: $\bigl(\ln(\ln x)\bigr)'=\frac{1}{\ln x}\cdot\frac1x=\frac{1}{x\ln x}$: כן. בתחום $x>1$, $\ln x>0$,
          ולכן $\ln(\ln x)$ מוגדרת.
      - kind: check
        text: >-
          (ב) בערך אחד: ב-$x=1$, $g(1)=\ln1=0$, ואילו $G'(1)=-1$. מספיקה נקודה אחת כדי לפסול.
      - kind: result
        text: >-
          (א), (ג) ו-(ד) כן; (ב) לא.

  - id: W-7.1-04
    level: mid
    objectives: [OBJ-7.1-1, OBJ-7.1-3]
    prompt: >-
      מצאו את הפונקציה $f$ שמקיימת $f''(x)=6x+2$ לכל $x$, וגם $f'(0)=1$ ו-$f(1)=0$.
    answer: >-
      $f(x)=x^3+x^2+x-3$
    solution:
      - kind: idea
        text: >-
          נתונה הנגזרת השנייה, ולכן מבצעים אינטגרציה פעמיים. בכל אינטגרציה נוסף קבוע אחד, וכל תנאי קובע קבוע אחד: שני
          תנאים לשני קבועים.
      - kind: computation
        text: >-
          $f'(x)=\int(6x+2)\,dx=3x^2+2x+C_1$. התנאי $f'(0)=1$ נותן $C_1=1$, ולכן $f'(x)=3x^2+2x+1$.
      - kind: computation
        text: >-
          $f(x)=\int\left(3x^2+2x+1\right)dx=x^3+x^2+x+C_2$. התנאי $f(1)=0$: $1+1+1+C_2=0$, כלומר $C_2=-3$.
      - kind: step
        text: >-
          את $C_1$ צריך לקבוע **לפני** האינטגרציה השנייה: אחרי האינטגרציה הוא הופך לאיבר $C_1x$, ושוכחים אותו בקלות.
      - kind: check
        text: >-
          $f'(x)=3x^2+2x+1$, $f'(0)=1$ ✓; $f''(x)=6x+2$ ✓; $f(1)=1+1+1-3=0$ ✓.
      - kind: result
        text: >-
          $f(x)=x^3+x^2+x-3$.

  - id: W-7.1-05
    level: mid
    objectives: [OBJ-7.1-2, OBJ-7.1-3]
    prompt: >-
      חשבו בעזרת המשפט היסודי.

      (א) $\int_1^4\frac{2x-1}{\sqrt x}\,dx$

      (ב) $\int_0^{\pi/4}\frac{dx}{\cos^2x}$

      (ג) $\int_0^{1/2}\frac{dx}{\sqrt{1-x^2}}$
    answer: >-
      (א) $\frac{22}{3}$. (ב) 1. (ג) $\frac\pi6$.
    solution:
      - kind: idea
        text: >-
          בכל אחד: קדומה מהטבלה (אחרי פישוט, אם צריך), בדיקה בגזירה, ואז הערך בגבול העליון פחות הערך בגבול התחתון.
          בכל הקטעים האינטגרנד רציף.
      - kind: step
        text: >-
          (א) מפשטים קודם, איבר איבר: $\frac{2x-1}{\sqrt x}=2x^{1/2}-x^{-1/2}$. קדומה:
          $F(x)=2\cdot\frac{x^{3/2}}{3/2}-\frac{x^{1/2}}{1/2}=\frac43x^{3/2}-2\sqrt x$.
      - kind: computation
        text: >-
          $F(4)=\frac43\cdot8-4=\frac{20}{3}$ ו-$F(1)=\frac43-2=-\frac23$. לכן האינטגרל $\frac{20}{3}-\left(-\frac23\right)=\frac{22}{3}$.
      - kind: computation
        text: >-
          (ב) $F(x)=\tan x$, ו-$\tan\frac\pi4-\tan0=1-0=1$.
      - kind: computation
        text: >-
          (ג) $F(x)=\arcsin x$, ו-$\arcsin\frac12-\arcsin0=\frac\pi6\approx0.524$.
      - kind: check
        text: >-
          (א) האינטגרנד חיובי בקטע (כש-$x\ge1$, $2x-1>0$), והוא בין $1$ (ב-$x=1$) ל-$3.5$ (ב-$x=4$), ולכן השטח, ברוחב 3,
          בין 3 ל-10.5; ו-$\frac{22}{3}\approx7.33$. ✓ (ג) האינטגרנד בקטע בין 1 ל-$\frac{1}{\sqrt{3/4}}\approx1.155$, והרוחב
          $\frac12$: השטח בין $0.5$ ל-$0.577$, ו-$\frac\pi6\approx0.524$. ✓
      - kind: result
        text: >-
          (א) $\frac{22}{3}$; (ב) 1; (ג) $\frac\pi6$.

  - id: W-7.1-06
    level: mid
    qualitative: true
    objectives: [OBJ-7.1-2]
    prompt: >-
      $f(x)=x^2-1$ בקטע $[0,2]$.

      (א) שרטטו את $f$ וקבעו, בלי חישוב, אם $\int_0^2f(x)\,dx$ חיובי או שלילי. נמקו לפי הציור.

      (ב) חשבו את $\int_0^2f(x)\,dx$.

      (ג) חשבו את השטח הגיאומטרי הכולל שבין הגרף לציר $x$ בקטע (כל החלקים בחיוב).
    answer: >-
      (א) חיובי. (ב) $\frac23$. (ג) 2.
    solution:
      - kind: idea
        text: >-
          האינטגרל המסוים הוא שטח עם סימן. כדי לקבל שטח גיאומטרי מפרקים את הקטע בנקודה שבה $f$ מחליפה סימן, ומחשבים כל
          חלק לחוד.
      - kind: step
        text: >-
          (א) $f<0$ ב-$[0,1)$ ו-$f>0$ ב-$(1,2]$, ושני החלקים באותו רוחב, 1. משווים אותם בשיקוף סביב $x=1$: לכל $0<s<1$,
          הגובה מעל הציר בנקודה $1+s$ הוא $f(1+s)=(1+s)^2-1=2s+s^2$, והעומק מתחת לציר בנקודה $1-s$ הוא
          $1-(1-s)^2=2s-s^2$. הגובה גדול מהעומק בכל זוג נקודות, ולכן השטח שמעל הציר גדול מהשטח שמתחתיו, והאינטגרל חיובי.
      - kind: computation
        text: >-
          (ב) $F(x)=\frac{x^3}{3}-x$, ו-$F(2)-F(0)=\left(\frac83-2\right)-0=\frac23$.
      - kind: computation
        text: >-
          (ג) $\int_0^1f\,dx=F(1)-F(0)=\frac13-1=-\frac23$: שטח $\frac23$ מתחת לציר. $\int_1^2f\,dx=F(2)-F(1)=\frac23-\left(-\frac23\right)=\frac43$:
          שטח $\frac43$ מעליו. השטח הגיאומטרי: $\frac23+\frac43=2$.
      - kind: check
        text: >-
          שני החלקים עם הסימן מחזירים את (ב): $\frac43-\frac23=\frac23$. ✓ והשטח הגיאומטרי גדול מהאינטגרל, כמו שצריך
          כשיש חלק מתחת לציר.
      - kind: result
        text: >-
          (א) חיובי; (ב) $\int_0^2\left(x^2-1\right)dx=\frac23$; (ג) השטח הכולל 2.

  - id: W-7.1-07
    level: mid
    objectives: [OBJ-7.1-3]
    prompt: >-
      פשטו, ואז חשבו.

      (א) $\int\frac{(x+1)^2}{\sqrt x}\,dx$, בתחום $x>0$.

      (ב) $\int\frac{4^x-1}{2^x}\,dx$.

      (ג) $\int\tan^2x\,dx$, בקטע $|x|<\frac\pi2$. (רמז: $1+\tan^2x=\frac{1}{\cos^2x}$.)
    answer: >-
      (א) $\frac25x^{5/2}+\frac43x^{3/2}+2\sqrt x+C$. (ב) $\frac{2^x+2^{-x}}{\ln2}+C$. (ג) $\tan x-x+C$.
    solution:
      - kind: idea
        text: >-
          אין כלל למנה או למכפלה, ולכן קודם הופכים כל אינטגרנד לסכום של איברים שכל אחד מהם בטבלה: פתיחת סוגריים, חוקי
          חזקות, וזהות טריגונומטרית.
      - kind: step
        text: >-
          (א) $(x+1)^2=x^2+2x+1$, ובחלוקה ב-$x^{1/2}$: $x^{3/2}+2x^{1/2}+x^{-1/2}$.
      - kind: computation
        text: >-
          $\int\left(x^{3/2}+2x^{1/2}+x^{-1/2}\right)dx=\frac25x^{5/2}+\frac43x^{3/2}+2x^{1/2}+C$.
      - kind: step
        text: >-
          (ב) $4^x=\left(2^2\right)^x=2^{2x}$, ולכן $\frac{4^x-1}{2^x}=2^x-2^{-x}$, ו-$2^{-x}=\left(\frac12\right)^x$.
      - kind: computation
        text: >-
          לפי $\int a^x\,dx=\frac{a^x}{\ln a}$: $\int2^x\,dx=\frac{2^x}{\ln2}$, ו-$\int\left(\frac12\right)^xdx=\frac{(1/2)^x}{\ln(1/2)}$.
      - kind: step
        text: >-
          המכנה: $\ln\frac12=\ln1-\ln2=-\ln2$ (הלוגריתם של מנה). לכן $\int\left(\frac12\right)^xdx=\frac{2^{-x}}{-\ln2}$, ועם
          המינוס שלפני $2^{-x}$ בשאלה: $\int\left(2^x-2^{-x}\right)dx=\frac{2^x}{\ln2}+\frac{2^{-x}}{\ln2}+C$.
      - kind: step
        text: >-
          (ג) מהזהות: $\tan^2x=\frac{1}{\cos^2x}-1$. שני האיברים בטבלה.
      - kind: computation
        text: >-
          $\int\left(\frac{1}{\cos^2x}-1\right)dx=\tan x-x+C$.
      - kind: check
        text: >-
          (ב) $\left(\frac{2^x+2^{-x}}{\ln2}\right)'=\frac{2^x\ln2-2^{-x}\ln2}{\ln2}=2^x-2^{-x}$ ✓ (הנגזרת של $2^{-x}$ היא
          מינוס $\ln2\cdot2^{-x}$, בכלל השרשרת). (ג) $(\tan x-x)'=\frac{1}{\cos^2x}-1=\tan^2x$ ✓. (א) $\left(\frac25x^{5/2}\right)'=x^{3/2}$,
          $\left(\frac43x^{3/2}\right)'=2x^{1/2}$, $\left(2x^{1/2}\right)'=x^{-1/2}$ ✓.
      - kind: result
        text: >-
          (א) $\frac25x^{5/2}+\frac43x^{3/2}+2\sqrt x+C$; (ב) $\frac{2^x+2^{-x}}{\ln2}+C$; (ג) $\tan x-x+C$.

  - id: W-7.1-08
    level: exam
    qualitative: true
    objectives: [OBJ-7.1-1, OBJ-7.1-2]
    prompt: >-
      $f(x)=\frac{1}{x^2}$ בתחום $x\ne0$.

      (א) מצאו פונקציה $F$, מוגדרת לכל $x\ne0$, שמקיימת $F'(x)=f(x)$ בכל התחום, וגם $F(1)=0$ ו-$F(-1)=3$.

      (ב) סטודנט חישב: "$\int_{-1}^1\frac{dx}{x^2}=\left(-\frac1x\right)\Big|_{-1}^1=-1-1=-2$". הסבירו בלי חישוב למה התשובה
      בלתי אפשרית, ואיזה תנאי של המשפט היסודי הופר.
    answer: >-
      (א) $F(x)=1-\frac1x$ כש-$x>0$, ו-$F(x)=2-\frac1x$ כש-$x<0$. (ב) האינטגרנד חיובי, ולכן "שטח" שלילי בלתי אפשרי; $f$
      אינה מוגדרת (ואינה רציפה) ב-0, שנמצא בתוך הקטע, והמשפט אינו חל.
    solution:
      - kind: idea
        text: >-
          התחום $x\ne0$ הוא שני קטעים, ובכל קטע הקדומות נבדלות בקבוע משלו. לכן אפשר לקיים שני תנאים, אחד בכל קטע. המשפט
          היסודי דורש ש-$f$ תהיה רציפה בכל הקטע שבין הגבולות.
      - kind: computation
        text: >-
          (א) $\int x^{-2}\,dx=\frac{x^{-1}}{-1}=-\frac1x$. לכן $F(x)=-\frac1x+C_1$ כש-$x>0$ ו-$F(x)=-\frac1x+C_2$ כש-$x<0$.
      - kind: computation
        text: >-
          $F(1)=-1+C_1=0$, כלומר $C_1=1$. $F(-1)=1+C_2=3$, כלומר $C_2=2$.
      - kind: step
        text: >-
          $F$ היא פונקציה אחת על כל התחום, עם נגזרת $\frac{1}{x^2}$ בכל נקודה, אף שאינה מהצורה "$-\frac1x+C$" עם קבוע
          אחד: בתחום שאינו קטע, "עד כדי קבוע" פירושו קבוע לכל קטע.
      - kind: step
        text: >-
          (ב) $\frac{1}{x^2}>0$ בכל מקום שבו היא מוגדרת, וכל השטח שמתחת לגרף נמצא מעל הציר. אינטגרל של פונקציה חיובית על
          קטע שבו $a<b$ אינו יכול להיות שלילי.
      - kind: step
        text: >-
          המשפט היסודי מניח ש-$f$ רציפה בכל הקטע $[a,b]$. כאן $f$ אינה מוגדרת ב-0, שנמצא בתוך $[-1,1]$, וליד 0 היא גדלה
          בלי גבול. ההצבה $F(1)-F(-1)$ "מדלגת" על החור, ולכן התוצאה חסרת משמעות. (מה כן עושים עם אינטגרל כזה, ומה יוצא כאן,
          נראה בשיעור 8.3 על אינטגרלים לא אמיתיים.)
      - kind: check
        text: >-
          (א) $F'(x)=\frac{1}{x^2}$ בשני הקטעים ✓, $F(1)=1-1=0$ ✓, $F(-1)=2+1=3$ ✓. (ב) עם הקדומה מ-(א) ההצבה נותנת
          $F(1)-F(-1)=0-3=-3$, מספר אחר: גם זה סימן שההצבה אינה חוקית, כי מספר שנקבע ממשפט אינו יכול להיות תלוי בבחירת
          הקדומה.
      - kind: result
        text: >-
          (א) $F(x)=1-\frac1x$ ל-$x>0$ ו-$F(x)=2-\frac1x$ ל-$x<0$. (ב) "שטח" שלילי לפונקציה חיובית בלתי אפשרי: $f$ אינה רציפה
          ב-0, שבתוך הקטע, והמשפט היסודי אינו חל.

  - id: W-7.1-09
    level: exam
    objectives: [OBJ-7.1-1, OBJ-7.1-2]
    prompt: >-
      $f(x)=4-x^2$, ו-$A(x)=\int_{-2}^xf(t)\,dt$ פונקציית השטח שלה ממינוס 2.

      (א) כתבו את $A(x)$ בנוסחה בעזרת המשפט היסודי.

      (ב) מה $A'(x)$? ענו פעם מהמשפט היסודי, בלי הנוסחה, ופעם בגזירה של הנוסחה מ-(א).

      (ג) מצאו את המקסימום של $A$ בקטע $[-2,4]$, והסבירו בעזרת השטח למה הוא שם.

      (ד) מצאו $x>-2$ שבו $A(x)=0$, ופרשו את התוצאה כשוויון בין שני שטחים.
    answer: >-
      (א) $A(x)=4x-\frac{x^3}{3}+\frac{16}{3}$. (ב) $A'(x)=4-x^2$. (ג) ב-$x=2$, $A(2)=\frac{32}{3}$. (ד) $x=4$.
    solution:
      - kind: idea
        text: >-
          פונקציית השטח היא $F(x)-F(-2)$ לכל קדומה $F$, והנגזרת שלה היא $f$. לכן $A$ עולה איפה ש-$f>0$ ויורדת איפה
          ש-$f<0$, ויש לה קיצון איפה ש-$f$ מחליפה סימן.
      - kind: computation
        text: >-
          (א) $F(t)=4t-\frac{t^3}{3}$, ו-$F(-2)=-8+\frac83=-\frac{16}{3}$. לכן $A(x)=F(x)-F(-2)=4x-\frac{x^3}{3}+\frac{16}{3}$.
      - kind: computation
        text: >-
          (ב) לפי החלק הראשון של המשפט, $A'(x)=f(x)=4-x^2$. מהנוסחה: $\left(4x-\frac{x^3}{3}+\frac{16}{3}\right)'=4-x^2$. אותו
          דבר.
      - kind: step
        text: >-
          (ג) $f=(2-x)(2+x)$: חיובית ב-$(-2,2)$ ושלילית כש-$x>2$. לכן $A$ עולה ממינוס 2 עד 2 ויורדת אחר כך: מקסימום ב-$x=2$.
          בשטח: עד 2 מוסיפים פסים מעל הציר, ואחרי 2 כל פס נספר בשלילה.
      - kind: computation
        text: >-
          $A(2)=8-\frac83+\frac{16}{3}=\frac{32}{3}\approx10.67$: השטח של קשת הפרבולה מעל הציר.
      - kind: computation
        text: >-
          (ד) $A(x)=0$ פירושו $4x-\frac{x^3}{3}+\frac{16}{3}=0$, ואחרי כפל במינוס 3: $x^3-12x-16=0$. שורש אחד ידוע מראש:
          $x=-2$, כי $A(-2)=0$ מההגדרה (בקטע ברוחב 0 אין שטח). לכן $x+2$ גורם של הפולינום.
      - kind: computation
        text: >-
          מוצאים את הגורם השני בהשוואת מקדמים: $x^3-12x-16=(x+2)\left(x^2+px+q\right)$, ובפתיחת סוגריים האגף הימני הוא $x^3+(p+2)x^2+(2p+q)x+2q$. המקדם של
          $x^2$: $p+2=0$, כלומר $p=-2$; האיבר החופשי: $2q=-16$, כלומר $q=-8$; ובדיקה במקדם של $x$: $2p+q=-4-8=-12$ ✓.
          לכן $x^3-12x-16=(x+2)\left(x^2-2x-8\right)$, ו-$x^2-2x-8=(x-4)(x+2)$, כלומר $x^3-12x-16=(x+2)^2(x-4)$.
          הפתרון $x>-2$ הוא $x=4$.
      - kind: step
        text: >-
          הפירוש: $A(4)=0$ פירושו שהשטח שמעל הציר, ממינוס 2 עד 2, שווה לשטח שמתחת לציר מ-2 עד 4. שניהם $\frac{32}{3}$.
      - kind: check
        text: >-
          $\int_2^4\left(4-x^2\right)dx=\left(4x-\frac{x^3}{3}\right)\Big|_2^4$, כלומר $\left(16-\frac{64}{3}\right)-\left(8-\frac83\right)=-\frac{32}{3}$, ו-$\frac{32}{3}-\frac{32}{3}=0$
          ✓. וגם $A(4)=16-\frac{64}{3}+\frac{16}{3}=0$ ✓.
      - kind: result
        text: >-
          $A(x)=4x-\frac{x^3}{3}+\frac{16}{3}$, $A'(x)=4-x^2$, המקסימום $A(2)=\frac{32}{3}$, ו-$A(4)=0$.

  - id: W-7.1-10
    level: exam
    objectives: [OBJ-7.1-1, OBJ-7.1-2, OBJ-7.1-3]
    prompt: >-
      חלקיק יוצא בזמן $t=0$ מהראשית ונע לאורך ציר $x$ במהירות $v(t)=\frac{1}{1+t^2}$ (מטר לשנייה), לכל $t\ge0$.

      (א) מצאו את המקום $x(t)$.

      (ב) מה ההעתק בשנייה הראשונה?

      (ג) האם החלקיק יגיע אי פעם לנקודה $x=2$? נמקו.

      (ד) מתי הוא בנקודה $x=1$?
    answer: >-
      (א) $x(t)=\arctan t$. (ב) $\frac\pi4\approx0.785$ מטר. (ג) לא: $x(t)<\frac\pi2\approx1.571$ תמיד. (ד) ב-$t=\tan1\approx1.557$
      שניות.
    solution:
      - kind: idea
        text: >-
          המקום הוא קדומה של המהירות, והתנאי $x(0)=0$ קובע את הקבוע. ההעתק הוא אינטגרל מסוים של $v$. כדי לדעת לאן החלקיק
          מגיע, קוראים את התמונה של $\arctan$, כלומר את קבוצת הערכים שהיא מקבלת.
      - kind: computation
        text: >-
          (א) $x(t)=\int\frac{dt}{1+t^2}=\arctan t+C$, ו-$x(0)=\arctan0+C=C=0$. לכן $x(t)=\arctan t$.
      - kind: computation
        text: >-
          (ב) $\int_0^1\frac{dt}{1+t^2}=\arctan1-\arctan0=\frac\pi4\approx0.785$ מטר.
      - kind: step
        text: >-
          (ג) $v>0$, ולכן החלקיק תמיד מתקדם; אבל $\arctan t<\frac\pi2$ לכל $t$ (שיעור 4.4: התמונה של $\arctan$, קבוצת הערכים שלה,
          היא $\left(-\frac\pi2,\frac\pi2\right)$). לכן $x(t)<\frac\pi2\approx1.571<2$, והחלקיק לא יגיע ל-2, אף שהוא נע לנצח.
          המהירות דועכת כמו $\frac{1}{t^2}$, מהר מספיק כדי שהדרך הכוללת תהיה סופית.
      - kind: computation
        text: >-
          (ד) $\arctan t=1$ כש-$t=\tan1\approx1.557$ שניות (הזווית 1 ברדיאנים, בין 0 ל-$\frac\pi2$).
      - kind: check
        text: >-
          (א) $(\arctan t)'=\frac{1}{1+t^2}$ ✓. (ב) המהירות בשנייה הראשונה בין $\frac12$ ל-1, ולכן ההעתק בין $0.5$ ל-1 מטר,
          ו-$0.785$ ביניהם ✓. (ד) $1<\frac\pi2$, ולכן הנקודה 1 אכן בהישג יד ✓.
      - kind: result
        text: >-
          $x(t)=\arctan t$; בשנייה הראשונה $\frac\pi4$ מטר; לעולם לא מגיע ל-2 (החסם $\frac\pi2$); ב-$x=1$ בזמן $t=\tan1\approx1.557$.

challenge:
  - id: W-7.1-c1
    stars: 1
    objectives: [OBJ-7.1-1, OBJ-7.1-3]
    prompt: >-
      חברת רכב רוצה שהדגם החדש שלה ייעצר בבלימה בתאוטה קבועה (מהירות שקטנה בקצב קבוע).

      (א) המכונית נוסעת ב-30 מטר לשנייה (108 קמ״ש) ונדרשת לעצור תוך 5 שניות. מה התאוטה הדרושה, ואיזה מרחק היא עוברת עד
      שהיא נעצרת?

      (ב) במהירות 25 מטר לשנייה (90 קמ״ש) היא נדרשת לעצור במרחק של 50 מטר לכל היותר. מה התאוטה הקטנה ביותר שמספיקה?
    answer: >-
      (א) 6 מטר לשנייה בריבוע, ומרחק 75 מטר. (ב) $6.25$ מטר לשנייה בריבוע (ואז היא נעצרת אחרי 4 שניות, בדיוק ב-50 מטר).
    solution:
      - kind: idea
        text: >-
          תאוטה קבועה $k>0$ פירושה $v'(t)=-k$. מבצעים אינטגרציה פעמיים, מהתאוצה למהירות ומהמהירות למקום, וקובעים כל פעם את
          הקבוע מתנאי ההתחלה. אחר כך מוצאים את הרגע שבו $v=0$.
      - kind: computation
        text: >-
          עם מהירות התחלתית $v_0$ ומקום התחלה 0: $v(t)=\int(-k)\,dt=-kt+C_1$, ו-$v(0)=v_0$ נותן $v(t)=v_0-kt$. אחר כך
          $x(t)=\int(v_0-kt)\,dt=v_0t-\frac{k}{2}t^2+C_2$, ו-$x(0)=0$ נותן $C_2=0$.
      - kind: step
        text: >-
          המכונית נעצרת כש-$v(T)=0$, כלומר $T=\frac{v_0}{k}$, ואז המרחק הוא
          $x(T)=v_0\cdot\frac{v_0}{k}-\frac k2\cdot\frac{v_0^2}{k^2}=\frac{v_0^2}{2k}$.
      - kind: computation
        text: >-
          (א) $T=5$ ו-$v_0=30$: $k=\frac{30}{5}=6$ מטר לשנייה בריבוע. המרחק: $x(5)=30\cdot5-\frac62\cdot25=150-75=75$ מטר.
      - kind: computation
        text: >-
          (ב) המרחק $\frac{v_0^2}{2k}$ קטן כש-$k$ גדל. הדרישה $\frac{25^2}{2k}\le50$ שקולה ל-$k\ge\frac{625}{100}=6.25$ מטר
          לשנייה בריבוע. עם $k=6.25$: $T=\frac{25}{6.25}=4$ שניות.
      - kind: check
        text: >-
          (א) המרחק הוא גם השטח מתחת לגרף המהירות, משולש עם בסיס 5 וגובה 30: $\frac12\cdot5\cdot30=75$ ✓. (ב) אותו דבר:
          $\frac12\cdot4\cdot25=50$ ✓.
      - kind: result
        text: >-
          (א) תאוטה 6 מטר לשנייה בריבוע, מרחק בלימה 75 מטר. (ב) לפחות $6.25$ מטר לשנייה בריבוע.
    source:
      name: 'G. Strang, E. Herman, Calculus Volume 1 (OpenStax)'
      year: 2016
      problem: 'Section 4.10 (Antiderivatives), exercises 513 and 514; SI units and numbers changed'
      url: https://openstax.org/books/calculus-volume-1/pages/4-10-antiderivatives
      verified: '2026-11-27'
      adapted: true

  - id: W-7.1-c2
    stars: 1
    objectives: [OBJ-7.1-2]
    prompt: >-
      $\ell$ פונקציה רציפה בקטע $[0,6]$, שהגרף שלה מורכב מקטעים ישרים בין הנקודות $(0,0)$, $(1,-1)$, $(2,1)$, $(3,3)$,
      $(4,3.5)$, $(5,4)$ ו-$(6,2)$. נגדיר $y(x)=\int_0^x\ell(t)\,dt$.

      (א) באילו קטעים $y$ עולה ובאילו יורדת? איפה המינימום שלה ב-$[0,6]$, ומה ערכו?

      (ב) מצאו את $y(6)$.

      (ג) מצאו את ה-$x>0$ שבו $y(x)=0$.
    answer: >-
      (א) יורדת ב-$[0,1.5]$ ועולה ב-$[1.5,6]$; המינימום $y(1.5)=-\frac34$. (ב) $y(6)=11.5$. (ג) $x=\frac{3+\sqrt3}{2}\approx2.366$.
    solution:
      - kind: idea
        text: >-
          $y$ היא פונקציית השטח של $\ell$ מ-0, ולפי המשפט היסודי $y'=\ell$ ($\ell$ רציפה). לכן הסימן של $\ell$ קובע איפה
          $y$ עולה. את הערכים מחשבים כשטחים עם סימן של משולשים וטרפזים, כי $\ell$ ישרה בכל קטע.
      - kind: step
        text: >-
          (א) בקטע $[1,2]$, $\ell(t)=-1+2(t-1)=2t-3$, שמתאפסת ב-$t=1.5$. לכן $\ell<0$ ב-$(0,1.5)$ ו-$\ell>0$ ב-$(1.5,6]$: $y$
          יורדת ב-$[0,1.5]$ ועולה אחר כך, והמינימום ב-$x=1.5$.
      - kind: computation
        text: >-
          $y(1.5)$ הוא השטח עם הסימן של משולש מתחת לציר, עם בסיס $1.5$ (מ-0 עד $1.5$) וקודקוד בעומק 1: מינוס $\frac12\cdot1.5\cdot1=\frac34$.
      - kind: computation
        text: >-
          (ב) מעל הציר: מ-$1.5$ עד 2 משולש, $\frac12\cdot0.5\cdot1=0.25$; מ-2 עד 3 טרפז, $\frac{1+3}{2}=2$; מ-3 עד 4,
          $\frac{3+3.5}{2}=3.25$; מ-4 עד 5, $\frac{3.5+4}{2}=3.75$; מ-5 עד 6, $\frac{4+2}{2}=3$. הסכום $12.25$, ו-$y(6)=-0.75+12.25=11.5$.
      - kind: computation
        text: >-
          (ג) כמה שורשים יש? ב-$(0,1.5]$ אין: שם $y$ יורדת מ-$y(0)=0$, ולכן שלילית. ב-$[1.5,6]$ $y$ עולה, ולכן מקבלת כל
          ערך לכל היותר פעם אחת. $y(2)=y(1.5)+0.25=-0.5<0$ ו-$y(3)=y(2)+2=1.5>0$, ולכן יש בדיוק שורש אחד, והוא בין 2 ל-3.
      - kind: computation
        text: >-
          בקטע $[2,3]$ האינטגרנד הוא הישר $\ell(t)=2t-3$, ונוח למדוד את המרחק מתחילת הקטע: $x=2+s$ עם $0\le s\le1$. אז
          $y(2+s)=y(2)+\int_2^{2+s}(2t-3)\,dt$, ו-$\left(t^2-3t\right)\Big|_2^{2+s}=s^2+s$ (פתחו סוגריים). לכן $y(2+s)=s^2+s-\frac12$.
      - kind: computation
        text: >-
          $s^2+s-\frac12=0$ נותן $s=\frac{-1+\sqrt3}{2}\approx0.366$ (הפתרון החיובי), כלומר $x=\frac{3+\sqrt3}{2}\approx2.366$.
      - kind: check
        text: >-
          $s\approx0.366$ אכן בין 0 ל-1 ✓, ובהצבה: $0.366^2+0.366-0.5\approx0.134+0.366-0.5=0$ ✓.
      - kind: result
        text: >-
          $y$ יורדת ב-$[0,1.5]$ ועולה ב-$[1.5,6]$, עם מינימום $y(1.5)=-\frac34$ ב-$x=1.5$; $y(6)=11.5$; $y=0$ שוב ב-$x=\frac{3+\sqrt3}{2}\approx2.366$.
    source:
      name: 'G. Strang, E. Herman, Calculus Volume 1 (OpenStax)'
      year: 2016
      problem: 'Section 5.3 (The Fundamental Theorem of Calculus), exercise 162; the questions about y = ∫ℓ instead of ℓ'
      url: https://openstax.org/books/calculus-volume-1/pages/5-3-the-fundamental-theorem-of-calculus
      verified: '2026-11-27'
      adapted: true
