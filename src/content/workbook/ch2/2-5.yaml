# Workbook of lesson 2.5 — surfaces in space and their sections.
# Objectives (src/course.ts):
#   OBJ-2.5-1  identify a surface by its sections with planes parallel to the coordinate planes
#   OBJ-2.5-2  the basic quadric surfaces: ellipsoid, cone, paraboloid, hyperboloid
#   OBJ-2.5-3  sketch a quadric from its sections, and find its intersection with a given plane
# Every number recomputed with sympy in screens/tools/lesson-2-5.py.
lesson: '2.5'
practice:
  - id: W-2.5-01
    level: basic
    objectives: [OBJ-2.5-1, OBJ-2.5-2]
    prompt: >-
      נתון המשטח $x^2+\frac{y^2}{4}+\frac{z^2}{16}=1$.

      (א) מצאו את החתכים שלו בשלושת מישורי הצירים, וכתבו את חצאי הצירים של כל חתך.

      (ב) מצאו את החתך במישור $z=2$, ואת חצאי הצירים שלו.

      (ג) באיזה גובה $c>0$ החתך במישור $z=c$ הוא נקודה אחת? מה קורה מעל הגובה הזה?

      (ד) מה שם המשטח?
    answer: >-
      (א) $z=0$: $x^2+\frac{y^2}{4}=1$ (1 ו-2); $y=0$: $x^2+\frac{z^2}{16}=1$ (1 ו-4); $x=0$: $\frac{y^2}{4}+\frac{z^2}{16}=1$
      (2 ו-4). (ב) $x^2+\frac{y^2}{4}=\frac34$, חצאי הצירים $\frac{\sqrt3}{2}$ ו-$\sqrt3$. (ג) $c=4$; מעליו אין חתך.
      (ד) אליפסואיד.
    solution:
      - kind: idea
        text: >-
          חתך מקבלים בהצבה של הקואורדינטה הקבועה. נשארת משוואה בשני משתנים; כשהיא מהצורה "סכום של שני ריבועים שווה
          מספר חיובי" זו אליפסה, וכדי לקרוא את חצאי הצירים מביאים את אגף ימין ל-1.
      - kind: computation
        text: >-
          (א) $z=0$: $x^2+\frac{y^2}{4}=1$, אליפסה עם חצי ציר 1 בכיוון $x$ ו-2 בכיוון $y$. $y=0$: $x^2+\frac{z^2}{16}=1$,
          חצאי הצירים 1 (בכיוון $x$) ו-4 (בכיוון $z$). $x=0$: $\frac{y^2}{4}+\frac{z^2}{16}=1$, חצאי הצירים 2 ו-4.
      - kind: computation
        text: >-
          (ב) מציבים $z=2$: $\frac{z^2}{16}=\frac{4}{16}=\frac14$, ולכן $x^2+\frac{y^2}{4}=1-\frac14=\frac34$.
      - kind: step
        text: >-
          אגף ימין אינו 1, ולכן מחלקים ב-$\frac34$: $\frac{x^2}{3/4}+\frac{y^2}{3}=1$. חצאי הצירים הם השורשים של המכנים:
          $\sqrt{\frac34}=\frac{\sqrt3}{2}\approx0.87$ בכיוון $x$, ו-$\sqrt3\approx1.73$ בכיוון $y$.
      - kind: computation
        text: >-
          (ג) בגובה $c$ אגף ימין הוא $1-\frac{c^2}{16}$. הוא מתאפס כש-$c^2=16$, כלומר $c=4$: אז $x^2+\frac{y^2}{4}=0$, והחתך
          הוא הנקודה $(0,0,4)$ בלבד. כש-$c>4$ אגף ימין שלילי (למשל ב-$c=5$ הוא $-\frac{9}{16}$), ואין חתך.
      - kind: step
        text: >-
          (ד) שלושה ריבועים בסימן פלוס ו-1 באגף ימין, כל החתכים אליפסות, והמשטח חסום: אליפסואיד שחצאי הצירים שלו 1, 2
          ו-4.
      - kind: check
        text: >-
          החתכים מסכימים זה עם זה על הצירים: שני החתכים שמכילים את ציר $z$ חותכים אותו ב-$\pm4$, כמו הגובה שמצאנו
          ב-(ג). והחתך בגובה 2 הוא החתך של גובה אפס מוקטן פי $\frac{\sqrt3}{2}$ בשני הכיוונים: $1\cdot\frac{\sqrt3}{2}$
          ו-$2\cdot\frac{\sqrt3}{2}=\sqrt3$.
      - kind: result
        text: >-
          אליפסואיד עם חצאי הצירים 1, 2, 4. בגובה 2 החתך הוא האליפסה $x^2+\frac{y^2}{4}=\frac34$, עם חצאי הצירים
          $\frac{\sqrt3}{2}$ ו-$\sqrt3$; בגובה 4 החתך הוא הנקודה $(0,0,4)$, ומעליו אין חתך.

  - id: W-2.5-02
    level: basic
    qualitative: true
    objectives: [OBJ-2.5-2]
    prompt: >-
      לכל משוואה כתבו את שם המשטח ואת הציר של המשטח (באליפסואיד אין ציר כזה), ונמקו בקצרה.

      (א) $x^2+y^2+4z^2=4$

      (ב) $x^2+y^2=4z^2$

      (ג) $y=2-x^2-z^2$

      (ד) $x^2-y^2+z^2=4$

      (ה) $x^2-y^2-z^2=4$

      (ו) $y^2+z^2=9$
    answer: >-
      (א) אליפסואיד. (ב) חרוט סביב ציר $z$. (ג) פרבולואיד סיבובי סביב ציר $y$, שנפתח לכיוון השלילי של ציר $y$.
      (ד) היפרבולואיד חד-יריעתי סביב ציר $y$. (ה) היפרבולואיד דו-יריעתי סביב ציר $x$. (ו) גליל ברדיוס 3 סביב ציר $x$.
    solution:
      - kind: idea
        text: >-
          מסדרים את המשוואה כך שכל הריבועים באגף אחד, ומסתכלים על שלושה דברים: כמה משתנים מופיעים בריבוע, מה הסימנים
          שלהם, ומה כתוב באגף ימין. הציר של המשטח הוא הציר של המשתנה החריג: זה שהסימן שלו שונה, שמופיע בחזקה ראשונה,
          או שחסר. בהיפרבולואיד מציבים אפס במשתנה החריג כדי לספור יריעות.
      - kind: step
        text: >-
          (א) שלושה ריבועים בסימן פלוס ומספר חיובי באגף ימין: אליפסואיד. אחרי חלוקה ב-4:
          $\frac{x^2}{4}+\frac{y^2}{4}+z^2=1$, חצאי הצירים 2, 2 ו-1. אין משתנה חריג.
      - kind: step
        text: >-
          (ב) מעבירים אגף: $x^2+y^2-4z^2=0$. שלושה ריבועים, אחד בסימן מינוס, ואפס באגף ימין: חרוט. המשתנה החריג הוא
          $z$, ולכן הציר הוא ציר $z$. (בגובה $c$ החתך הוא מעגל ברדיוס $2|c|$.)
      - kind: step
        text: >-
          (ג) $y$ בחזקה ראשונה ושני ריבועים באותו סימן: פרבולואיד סיבובי, והציר שלו ציר $y$. החתכים $y=c$ הם
          $x^2+z^2=2-c$: מעגלים כש-$c<2$, הנקודה $(0,2,0)$ כש-$c=2$, ואין חתך כש-$c>2$. הקודקוד הוא $(0,2,0)$, והקערה
          נפתחת לכיוון השלילי של ציר $y$.
      - kind: step
        text: >-
          (ד) שלושה ריבועים, והמשתנה החריג הוא $y$: היפרבולואיד שהציר שלו ציר $y$. מציבים $y=0$: $x^2+z^2=4$, מעגל
          ברדיוס 2. נשאר חתך, ולכן יריעה אחת. (מי שמציב $z=0$ מקבל את ההיפרבולה $x^2-y^2=4$, שאינה מכריעה.)
      - kind: step
        text: >-
          (ה) המשתנה החריג הוא $x$: היפרבולואיד שהציר שלו ציר $x$. מציבים $x=0$: $-y^2-z^2=4$, כלומר $y^2+z^2=-4$. אין
          חתך, ולכן שתי יריעות.
      - kind: step
        text: >-
          (ו) $x$ חסר במשוואה, ולכן הוא חופשי: גליל מעל המעגל $y^2+z^2=9$ שבמישור $yz$, כלומר גליל ברדיוס 3 שהציר שלו
          ציר $x$.
      - kind: check
        text: >-
          בדיקה של (ד) ושל (ה) בכל החתכים שמאונכים לציר: ב-(ד), $y=c$ נותן $x^2+z^2=4+c^2$, מעגל לכל $c$. ב-(ה),
          $x=c$ נותן $y^2+z^2=c^2-4$, שקיים רק כש-$|c|\ge2$: שתי היריעות מתחילות ב-$x=2$ וב-$x=-2$. וגם קיצור הדרך
          מסכים: אחרי חלוקה ב-4, ב-(ד) יש מינוס אחד מול 1 חיובי, וב-(ה) שני מינוסים.
      - kind: result
        text: >-
          (א) אליפסואיד; (ב) חרוט סביב ציר $z$; (ג) פרבולואיד סיבובי סביב ציר $y$, שקודקודו $(0,2,0)$ והוא נפתח לכיוון
          השלילי של ציר $y$; (ד) היפרבולואיד חד-יריעתי סביב ציר $y$; (ה) היפרבולואיד דו-יריעתי סביב ציר $x$; (ו) גליל
          ברדיוס 3 סביב ציר $x$.

  - id: W-2.5-03
    level: basic
    objectives: [OBJ-2.5-3]
    prompt: >-
      חותכים במישור $z=4$ שלושה משטחים: החרוט $x^2+y^2-z^2=0$, ההיפרבולואיד $x^2+y^2-z^2=4$ וההיפרבולואיד
      $x^2+y^2-z^2=-4$.

      (א) מצאו את הרדיוס של מעגל החתך בכל אחד מהם.

      (ב) סדרו את שלושת המשטחים מבפנים החוצה, בגובה הזה.

      (ג) חזרו על (א) בגובה $z=1$. מה השתנה?

      (ד) מאיזה גובה חיובי והלאה יש חתך לכל שלושת המשטחים?
    answer: >-
      (א) $4$, $\sqrt{20}=2\sqrt5\approx4.47$, $\sqrt{12}=2\sqrt3\approx3.46$. (ב) הדו-יריעתי, החרוט, החד-יריעתי.
      (ג) חרוט: 1; חד-יריעתי: $\sqrt5\approx2.24$; דו-יריעתי: אין חתך. (ד) מ-$z=2$ (שם החתך של הדו-יריעתי הוא נקודה
      אחת).
    solution:
      - kind: idea
        text: >-
          מציבים את הגובה במשוואה ומעבירים את $z^2$ לאגף ימין. נשאר $x^2+y^2$ מול מספר: אם הוא חיובי זה ריבוע הרדיוס,
          ולא הרדיוס עצמו.
      - kind: computation
        text: >-
          (א) $z=4$, $z^2=16$. חרוט: $x^2+y^2=16$, רדיוס 4. חד-יריעתי: $x^2+y^2=4+16=20$, רדיוס
          $\sqrt{20}=2\sqrt5\approx4.47$. דו-יריעתי: $x^2+y^2=16-4=12$, רדיוס $\sqrt{12}=2\sqrt3\approx3.46$.
      - kind: step
        text: >-
          (ב) $2\sqrt3<4<2\sqrt5$: הדו-יריעתי בפנים, אחריו החרוט, והחד-יריעתי בחוץ. ההפרשים הם בערך 0.54 ו-0.47.
      - kind: computation
        text: >-
          (ג) $z=1$, $z^2=1$. חרוט: רדיוס 1. חד-יריעתי: $x^2+y^2=4+1=5$, רדיוס $\sqrt5\approx2.24$. דו-יריעתי:
          $x^2+y^2=1-4=-3$, מספר שלילי, ולכן אין חתך.
      - kind: computation
        text: >-
          (ד) לחרוט ולחד-יריעתי יש חתך בכל גובה. בדו-יריעתי החתך בגובה $c$ הוא $x^2+y^2=c^2-4$, ואגף ימין אינו שלילי
          רק כש-$|c|\ge2$. לכן מ-$z=2$ והלאה: בגובה 2 עצמו החתך הוא הנקודה $(0,0,2)$, ומעליו מעגל.
      - kind: check
        text: >-
          בגובה 1 נמצאים בתוך הפער שבין שתי היריעות של הדו-יריעתי (בין $z=-2$ ל-$z=2$), וקרוב למותן של החד-יריעתי,
          שרדיוסו 2. ובגובה גדול ההפרשים קטנים: בגובה 10 הרדיוסים הם $\sqrt{96}\approx9.80$, 10 ו-$\sqrt{104}\approx10.20$.
      - kind: result
        text: >-
          בגובה 4: רדיוסים $2\sqrt3$, $4$, $2\sqrt5$ (דו-יריעתי, חרוט, חד-יריעתי). בגובה 1: לחרוט 1, לחד-יריעתי
          $\sqrt5$, ולדו-יריעתי אין חתך. לכל השלושה יש חתך מ-$z=2$ והלאה.

  - id: W-2.5-04
    level: mid
    qualitative: true
    objectives: [OBJ-2.5-1, OBJ-2.5-2]
    prompt: >-
      על שני משטחים ידועים רק החתכים שלהם. זהו כל משטח, וכתבו משוואה שמתאימה לו.

      (א) בכל גובה $c>0$ החתך במישור $z=c$ הוא אליפסה שמרכזה על ציר $z$, עם חצי ציר $\sqrt c$ בכיוון $x$ וחצי ציר
      $\frac{\sqrt c}{2}$ בכיוון $y$. בגובה אפס החתך הוא נקודה אחת, ומתחת לו אין חתך.

      (ב) החתך בכל מישור $y=c$ הוא פרבולה שנפתחת כלפי מטה, והקודקוד שלה בגובה $c^2$. החתך בכל מישור $x=c$ הוא פרבולה
      שנפתחת כלפי מעלה, והקודקוד שלה בגובה $-c^2$. החתך במישור $z=0$ הוא זוג הישרים $y=\pm x$.
    answer: >-
      (א) פרבולואיד אליפטי (קערה), $z=x^2+4y^2$. (ב) פרבולואיד היפרבולי (אוכף), $z=y^2-x^2$.
    solution:
      - kind: idea
        text: >-
          שואלים את שלוש השאלות של השיעור: האם יש חתך בכל גובה, איך הוא משתנה עם הגובה, ומה החתך האנכי. אחרי שמזהים את
          הסוג, כותבים את משוואת החתך הנתון ומחליפים בה את $c$ בחזרה במשתנה שנקבע.
      - kind: step
        text: >-
          (א) חתכים רק מעל גובה אפס, ונקודה אחת בגובה אפס: קערה. האליפסות אינן מעגלים, ולכן זה פרבולואיד אליפטי. (אפשר
          היה לחשוד בחרוט, אבל בחרוט חצאי הצירים גדלים כמו $c$, וכאן כמו $\sqrt c$.)
      - kind: computation
        text: >-
          אליפסה עם חצאי הצירים $\sqrt c$ ו-$\frac{\sqrt c}{2}$ היא $\frac{x^2}{c}+\frac{y^2}{c/4}=1$. מכפילים ב-$c$:
          $x^2+4y^2=c$. זה החתך בגובה $z=c$, ולכן המשטח הוא $z=x^2+4y^2$.
      - kind: step
        text: >-
          (ב) פרבולות פתוחות למטה בכיוון אחד ולמעלה בכיוון האחר, וזוג ישרים בגובה אפס: אוכף.
      - kind: computation
        text: >-
          במישור $y=c$ הפרבולה נפתחת כלפי מטה, כלומר $x^2$ מופיע בסימן מינוס, והקודקוד בגובה $c^2$: $z=c^2-x^2$. מחליפים את
          $c$ ב-$y$ ומקבלים $z=y^2-x^2$.
      - kind: check
        text: >-
          (א) בגובה 4 המשוואה נותנת $x^2+4y^2=4$, חצאי הצירים 2 ו-1, כמו $\sqrt4$ ו-$\frac{\sqrt4}{2}$. (ב) במישור $x=c$
          המשוואה נותנת $z=y^2-c^2$, פרבולה נפתחת כלפי מעלה שקודקודה בגובה $-c^2$, ובמישור $z=0$ היא נותנת $y^2=x^2$, כלומר
          $y=\pm x$. שני הנתונים שלא השתמשנו בהם מתקיימים.
      - kind: result
        text: >-
          (א) פרבולואיד אליפטי, $z=x^2+4y^2$. (ב) פרבולואיד היפרבולי (אוכף), $z=y^2-x^2$: הוא עולה בכיוון $y$ ויורד
          בכיוון $x$.

  - id: W-2.5-05
    level: mid
    objectives: [OBJ-2.5-3, OBJ-2.5-1]
    prompt: >-
      נתון המשטח $z^2=4x^2+y^2$.

      (א) מצאו את החתכים האופקיים $z=c$, ואת חצאי הצירים שלהם.

      (ב) מצאו את החתכים $x=0$ ו-$y=0$.

      (ג) זהו את המשטח, ותארו שלד לשרטוט שלו.

      (ד) הראו שהישר $(t,\,2t,\,2\sqrt2\,t)$ נמצא כולו על המשטח.
    answer: >-
      (א) האליפסה $\frac{x^2}{(c/2)^2}+\frac{y^2}{c^2}=1$, חצאי הצירים $\frac{|c|}{2}$ ו-$|c|$; בגובה אפס הראשית בלבד.
      (ב) $z=\pm y$; $z=\pm2x$. (ג) חרוט כפול סביב ציר $z$ שהחתכים האופקיים שלו אליפסות. (ד) $4t^2+4t^2=8t^2$.
    solution:
      - kind: idea
        text: >-
          מתכון השרטוט: חתכים אופקיים, איך הם גדלים, ואחר כך שני חתכים אנכיים. במשוואה יש שלושה ריבועים, אחד בסימן
          הפוך, ואפס באגף ימין ($4x^2+y^2-z^2=0$), ולכן מצפים לחרוט.
      - kind: computation
        text: >-
          (א) $z=c$: $4x^2+y^2=c^2$. כש-$c\ne0$ מחלקים ב-$c^2$: $\frac{x^2}{c^2/4}+\frac{y^2}{c^2}=1$. אליפסה שחצאי הצירים
          שלה $\frac{|c|}{2}$ בכיוון $x$ ו-$|c|$ בכיוון $y$. בגובה אפס: $4x^2+y^2=0$, הראשית בלבד.
      - kind: step
        text: >-
          חצאי הצירים גדלים ביחס ישר לגובה: בגובה 2 הם 1 ו-2, ובגובה 4 הם 2 ו-4. גידול כזה, לינארי, הוא הסימן של חרוט.
      - kind: computation
        text: >-
          (ב) $x=0$: $z^2=y^2$, כלומר $z=\pm y$, זוג ישרים במישור $yz$. $y=0$: $z^2=4x^2$, כלומר $z=\pm2x$, זוג ישרים
          תלולים יותר במישור $xz$.
      - kind: step
        text: >-
          (ג) חרוט כפול שהקודקוד שלו בראשית והציר שלו ציר $z$, עם חתכים אופקיים שהם אליפסות (חרוט "מעוך"). לשרטוט:
          מציירים את ארבעת הישרים מסעיף (ב), ושתי אליפסות אופקיות, למשל בגבהים 2 ו-$-2$, שעוברות דרך הנקודות של
          הישרים באותם גבהים: $(\pm1,0,\pm2)$ ו-$(0,\pm2,\pm2)$.
      - kind: computation
        text: >-
          (ד) מציבים $x=t$, $y=2t$, $z=2\sqrt2\,t$: אגף ימין $4t^2+(2t)^2=8t^2$, ואגף שמאל $(2\sqrt2\,t)^2=8t^2$. שווים לכל
          $t$, ולכן כל נקודות הישר על המשטח.
      - kind: check
        text: >-
          הישר שב-(ד) עובר דרך הראשית, כמו כל ישר על חרוט שקודקודו בראשית. ובגובה 2 האליפסה חותכת את המישור $y=0$
          ב-$x=\pm1$, מתאים לישרים $z=\pm2x$.
      - kind: result
        text: >-
          חרוט כפול סביב ציר $z$: בגובה $c$ החתך הוא אליפסה עם חצאי הצירים $\frac{|c|}{2}$ ו-$|c|$, והחתכים האנכיים דרך
          הציר הם זוגות הישרים $z=\pm y$ ו-$z=\pm2x$.

  - id: W-2.5-06
    level: mid
    qualitative: true
    objectives: [OBJ-2.5-1, OBJ-2.5-2]
    prompt: >-
      מה מתארת כל משוואה, או כל זוג משוואות, **במרחב**? ענו במילים: איזו צורה, ואיפה היא נמצאת.

      (א) $y=x^2$

      (ב) $x^2+z^2=9$

      (ג) $z=3$

      (ד) $x^2+y^2=0$

      (ה) $x^2+y^2=1$ וגם $z=2$
    answer: >-
      (א) גליל מעל פרבולה, לאורך ציר $z$. (ב) גליל ברדיוס 3 סביב ציר $y$. (ג) מישור אופקי בגובה 3. (ד) ציר $z$ כולו
      (ישר). (ה) מעגל ברדיוס 1 בגובה 2, שמרכזו על ציר $z$.
    solution:
      - kind: idea
        text: >-
          במרחב משוואה אחת מתארת בדרך כלל משטח, ושתי משוואות עקום. משתנה שאינו מופיע במשוואה הוא חופשי: לוקחים את
          מה שהמשוואה מתארת במישור של המשתנים שמופיעים, ו"מושכים" אותו לאורך הציר של המשתנה החסר.
      - kind: step
        text: >-
          (א) חסר $z$. במישור $xy$ זו הפרבולה $y=x^2$; במרחב, מעל ומתחת לכל נקודה שלה עומד ישר אנכי. מתקבל קיר מעוקל:
          גליל מעל פרבולה. כל חתך אופקי שלו הוא אותה פרבולה.
      - kind: step
        text: >-
          (ב) חסר $y$. במישור $xz$ זה מעגל ברדיוס 3 סביב הראשית; במרחב, גליל ברדיוס 3 שהציר שלו ציר $y$.
      - kind: step
        text: >-
          (ג) חסרים גם $x$ וגם $y$, ושניהם חופשיים: כל הנקודות שגובהן 3. זה מישור אופקי, כמו בשיעור 1.3 (הנורמל שלו
          $(0,0,1)$).
      - kind: step
        text: >-
          (ד) סכום של שני ריבועים שווה אפס רק כששניהם אפס: $x=0$ וגם $y=0$. $z$ חופשי, ולכן מתקבלות כל הנקודות
          $(0,0,z)$: ציר $z$. זה מקרה מנוון, "גליל ברדיוס אפס": משוואה אחת שמתארת ישר ולא משטח, כי היא שקולה לשתי
          משוואות.
      - kind: step
        text: >-
          (ה) שתי משוואות: החתך של הגליל $x^2+y^2=1$ במישור $z=2$. זה מעגל ברדיוס 1 שנמצא בגובה 2, ומרכזו $(0,0,2)$.
      - kind: check
        text: >-
          בדיקה בנקודות: $(2,4,7)$ מקיימת את (א) לכל גובה. $(3,-5,0)$ מקיימת את (ב). $(0,0,-8)$ מקיימת את (ד), ו-$(1,0,0)$
          אינה מקיימת אותה. $(1,0,2)$ מקיימת את שתי המשוואות של (ה), ו-$(1,0,0)$ רק את הראשונה.
      - kind: result
        text: >-
          (א) גליל מעל הפרבולה $y=x^2$, לאורך ציר $z$; (ב) גליל ברדיוס 3 סביב ציר $y$; (ג) מישור אופקי בגובה 3; (ד) ציר
          $z$; (ה) מעגל ברדיוס 1 בגובה 2 סביב ציר $z$.

  - id: W-2.5-07
    level: mid
    objectives: [OBJ-2.5-3]
    prompt: >-
      המישור $z=x+3$ חותך את הגליל $x^2+y^2=4$.

      (א) מה ההיטל של עקום החיתוך על מישור $xy$?

      (ב) כתבו פרמטריזציה של עקום החיתוך.

      (ג) מצאו את הנקודה הגבוהה ביותר ואת הנמוכה ביותר על העקום, ואת המרחק ביניהן.

      (ד) מה העקום, ומה חצאי הצירים שלו?
    answer: >-
      (א) המעגל $x^2+y^2=4$. (ב) $(2\cos t,\ 2\sin t,\ 3+2\cos t)$, $0\le t<2\pi$. (ג) $(2,0,5)$ ו-$(-2,0,1)$, במרחק
      $4\sqrt2\approx5.66$. (ד) אליפסה שמרכזה $(0,0,3)$, עם חצאי הצירים $2\sqrt2$ ו-2.
    solution:
      - kind: idea
        text: >-
          כל נקודה של העקום נמצאת על הגליל, ולכן ההיטל שלה על מישור $xy$ נמצא על המעגל שהגליל עומד עליו. את הגובה של
          כל נקודה קובע המישור. לכן כותבים פרמטריזציה של המעגל ומוסיפים לה $z$ מהמישור. הצורה של העקום היא ההיטל
          כשהוא מתוח בכיוון העלייה של המישור.
      - kind: step
        text: >-
          (א) במשוואת הגליל אין $z$, ולכן אין מה להציב: כל נקודה של העקום מקיימת $x^2+y^2=4$. ולהפך, מעל כל נקודה
          $(x,y)$ של המעגל יש נקודה אחת של העקום, בגובה $x+3$. ההיטל הוא המעגל כולו, ברדיוס 2.
      - kind: computation
        text: >-
          (ב) המעגל: $x=2\cos t$, $y=2\sin t$. הגובה: $z=x+3=3+2\cos t$. העקום: $(2\cos t,\ 2\sin t,\ 3+2\cos t)$,
          $0\le t<2\pi$.
      - kind: computation
        text: >-
          (ג) הגובה $3+2\cos t$ הוא הגדול ביותר כש-$\cos t=1$: הנקודה $(2,0,5)$. הוא הקטן ביותר כש-$\cos t=-1$: הנקודה
          $(-2,0,1)$. המרחק: $\sqrt{4^2+0^2+4^2}=\sqrt{32}=4\sqrt2\approx5.66$.
      - kind: step
        text: >-
          (ד) השיפוע של המישור בכיוון $x$ הוא 1: צעד של יחידה בכיוון $x$ מעלה יחידה, ואורכו על המישור
          $\sqrt{1+1}=\sqrt2$. בכיוון $y$ אין שיפוע. לכן העקום הוא ההיטל, מעגל ברדיוס 2, כשהוא מתוח פי $\sqrt2$ בכיוון
          $x$ בלבד: אליפסה שמרכזה $(0,0,3)$, עם חצי ציר גדול $2\sqrt2$ וחצי ציר קטן 2.
      - kind: check
        text: >-
          הציר הארוך, $2\cdot2\sqrt2=4\sqrt2$, הוא בדיוק המרחק שמצאנו ב-(ג) בין הנקודה הגבוהה לנמוכה. ובכיוון השני,
          הנקודות $(0,2,3)$ ו-$(0,-2,3)$ (ב-$t=\frac{\pi}{2}$ וב-$t=\frac{3\pi}{2}$) רחוקות זו מזו 4, כמו הציר הקצר.
      - kind: result
        text: >-
          עקום החיתוך הוא האליפסה $(2\cos t,\ 2\sin t,\ 3+2\cos t)$, בין $(-2,0,1)$ ל-$(2,0,5)$, עם חצאי הצירים $2\sqrt2$
          ו-2. ההיטל שלה על מישור $xy$ הוא המעגל $x^2+y^2=4$.

  - id: W-2.5-08
    level: exam
    objectives: [OBJ-2.5-3]
    prompt: >-
      בכל סעיף מצאו את החיתוך של שני המשטחים, ותארו אותו במילים (איזה עקום, באיזה גובה, באיזה גודל).

      (א) הפרבולואיד $z=x^2+y^2$ והפרבולואיד ההפוך $z=8-x^2-y^2$.

      (ב) הפרבולואיד $z=x^2+y^2$ והחרוט $z=\sqrt{x^2+y^2}$.

      (ג) הספירה $x^2+y^2+z^2=25$ והספירה $x^2+y^2+(z-6)^2=13$.
    answer: >-
      (א) מעגל ברדיוס 2 בגובה 4. (ב) הראשית, והמעגל ברדיוס 1 בגובה 1. (ג) מעגל ברדיוס 3 בגובה 4. בכל הסעיפים מרכז
      המעגל על ציר $z$.
    solution:
      - kind: idea
        text: >-
          נקודת חיתוך מקיימת את שתי המשוואות. משתמשים באחת כדי לסלק משתנה מהשנייה. כאן כל המשטחים הם משטחי סיבוב סביב
          ציר $z$, ו-$x$ ו-$y$ מופיעים רק בצירוף $x^2+y^2$: לכן מסלקים את הצירוף הזה (או משתמשים ב-$r$ הגלילי), ונשארת
          משוואה ב-$z$ בלבד.
      - kind: computation
        text: >-
          (א) משווים את שני הביטויים ל-$z$: $x^2+y^2=8-x^2-y^2$, כלומר $2(x^2+y^2)=8$ ו-$x^2+y^2=4$. הגובה: $z=x^2+y^2=4$.
          החיתוך הוא מעגל ברדיוס 2 בגובה 4.
      - kind: computation
        text: >-
          (ב) בגליליות, עם $r=\sqrt{x^2+y^2}$: הפרבולואיד הוא $z=r^2$ והחרוט $z=r$. משווים: $r^2=r$, כלומר $r(r-1)=0$:
          $r=0$ או $r=1$. $r=0$ נותן את הראשית, ששני המשטחים עוברים בה. $r=1$ נותן $z=1$: מעגל ברדיוס 1 בגובה 1.
      - kind: step
        text: >-
          שימו לב לא לחלק ב-$r$: מי שמחלק מקבל רק $r=1$ ומאבד את נקודת החיתוך שבראשית.
      - kind: computation
        text: >-
          (ג) מחסרים את המשוואה השנייה מהראשונה. $x^2+y^2$ מצטמצם: $z^2-(z-6)^2=25-13$. פותחים: $z^2-(z^2-12z+36)=12z-36$,
          ולכן $12z-36=12$ ו-$z=4$. מציבים בספירה הראשונה: $x^2+y^2=25-16=9$. מעגל ברדיוס 3 בגובה 4.
      - kind: check
        text: >-
          (א) בגובה 4 גם הפרבולואיד השני נותן $8-4=4$. (ב) הנקודה $(1,0,1)$: $1=1^2+0$ וגם $1=\sqrt{1+0}$. (ג) הנקודה
          $(3,0,4)$: $9+0+16=25$ וגם $9+0+(4-6)^2=13$. ועוד בדיקה ל-(ג): המרכזים במרחק 6 זה מזה, והרדיוסים 5
          ו-$\sqrt{13}\approx3.61$. מפני ש-$5-3.61<6<5+3.61$, הספירות אכן נחתכות.
      - kind: result
        text: >-
          (א) המעגל $x^2+y^2=4$ בגובה $z=4$. (ב) הראשית, והמעגל $x^2+y^2=1$ בגובה $z=1$. (ג) המעגל $x^2+y^2=9$ בגובה
          $z=4$.

  - id: W-2.5-09
    level: exam
    objectives: [OBJ-2.5-3, OBJ-2.5-1]
    prompt: >-
      נתון האוכף $z=x^2-y^2$.

      (א) מצאו את החתכים שלו במישורים $x=c$, $y=c$ ו-$z=c$, וזהו כל אחד.

      (ב) המישור האנכי $y=x+1$ חותך את האוכף. הראו שעקום החיתוך הוא **ישר**, וכתבו הצגה פרמטרית שלו.

      (ג) הראו שלכל מספר $k$, המישור $y=x+k$ חותך את האוכף בישר.

      (ד) המישור הנטוי $z=2x$ חותך את האוכף. מה ההיטל של עקום החיתוך על מישור $xy$?
    answer: >-
      (א) $x=c$: הפרבולה $z=c^2-y^2$, נפתחת כלפי מטה. $y=c$: הפרבולה $z=x^2-c^2$, נפתחת כלפי מעלה. $z=c$: ההיפרבולה
      $x^2-y^2=c$, ובגובה אפס זוג הישרים $y=\pm x$. (ב) $(t,\ t+1,\ -2t-1)$. (ג) $z=-2kx-k^2$, לינארי ב-$x$.
      (ד) ההיפרבולה $(x-1)^2-y^2=1$.
    solution:
      - kind: idea
        text: >-
          בכל הסעיפים מציבים את המישור במשוואת המשטח. במישורים שמקבילים למישורי הצירים מה שנשאר הוא החתך עצמו. במישור
          $y=x+k$ מציבים את $y$ ומקבלים את הגובה כפונקציה של $x$; אם היא לינארית, העקום ישר. במישור הנטוי $z=2x$ מה
          שנשאר ב-$x$ וב-$y$ הוא ההיטל.
      - kind: computation
        text: >-
          (א) $x=c$: $z=c^2-y^2$, פרבולה במשתנים $y,z$ שנפתחת כלפי מטה, וקודקודה בגובה $c^2$. $y=c$: $z=x^2-c^2$, פרבולה
          שנפתחת כלפי מעלה, וקודקודה בגובה $-c^2$. $z=c$: $x^2-y^2=c$, היפרבולה שנפתחת לאורך ציר $x$ כש-$c>0$ ולאורך ציר
          $y$ כש-$c<0$; כש-$c=0$ מקבלים $(x-y)(x+y)=0$, זוג הישרים $y=\pm x$.
      - kind: computation
        text: >-
          (ב) מציבים $y=x+1$: $z=x^2-(x+1)^2=x^2-x^2-2x-1=-2x-1$. הריבועים הצטמצמו. בוחרים $x=t$ כפרמטר:
          $x=t$, $y=t+1$, $z=-2t-1$.
      - kind: step
        text: >-
          זו הצגה פרמטרית של ישר (שיעור 1.3): הוא עובר דרך הנקודה $(0,1,-1)$, וכיוונו $(1,1,-2)$. לכן עקום החיתוך הוא
          ישר שלם שמונח על האוכף.
      - kind: computation
        text: >-
          (ג) באותו אופן, $y=x+k$ נותן $z=x^2-(x+k)^2=-2kx-k^2$. לכל $k$ זה ביטוי ממעלה ראשונה ב-$x$, ולכן החיתוך הוא
          הישר $(t,\ t+k,\ -2kt-k^2)$. כש-$k=0$ זה הישר $y=x$ בגובה אפס, אחד משני הישרים של סעיף (א).
      - kind: computation
        text: >-
          (ד) מציבים $z=2x$: $2x=x^2-y^2$, כלומר $x^2-2x-y^2=0$. משלימים לריבוע: $(x-1)^2-1-y^2=0$, ולכן
          $(x-1)^2-y^2=1$. ההיטל הוא היפרבולה שמרכזה $(1,0)$, נפתחת לאורך ציר $x$, עם קודקודים ב-$(0,0)$ וב-$(2,0)$.
      - kind: check
        text: >-
          (ב) שתי נקודות של הישר: $t=0$ נותן $(0,1,-1)$, ואכן $0^2-1^2=-1$; $t=1$ נותן $(1,2,-3)$, ואכן $1-4=-3$.
          (ד) הקודקודים של ההיטל מתאימים לנקודות $(0,0,0)$ ו-$(2,0,4)$, ושתיהן על האוכף ($0=0$, $4=4-0$) ועל המישור
          $z=2x$.
      - kind: result
        text: >-
          החתכים האנכיים של האוכף במישורים $x=c$ ו-$y=c$ הם פרבולות, והאופקיים היפרבולות (זוג ישרים בגובה אפס). כל
          מישור $y=x+k$ חותך אותו בישר $(t,\ t+k,\ -2kt-k^2)$, כך שהאוכף, אף שהוא עקום, מכוסה כולו בישרים. ההיטל של
          החיתוך עם $z=2x$ הוא ההיפרבולה $(x-1)^2-y^2=1$.

  - id: W-2.5-10
    level: exam
    qualitative: true
    objectives: [OBJ-2.5-1, OBJ-2.5-2, OBJ-2.5-3]
    prompt: >-
      נתון המשטח $4x^2+4y^2-z^2=4$.

      (א) זהו את המשטח בעזרת החתכים שלו (אופקיים, ואנכי אחד), ומצאו את החתך האופקי הקטן ביותר.

      (ב) מצאו את הרדיוס של החתך במישור $z=4$.

      (ג) סטודנטית חותכת את המשטח במישור $z=x$. היא מציבה, מקבלת $\frac{x^2}{4/3}+y^2=1$, וכותבת: "החיתוך הוא
      אליפסה שחצאי הצירים שלה $\frac{2}{\sqrt3}$ ו-1". מה נכון בתשובה שלה, ומה לא? תקנו אותה: תארו את עקום החיתוך
      עצמו.

      (ד) מה עקום החיתוך של המשטח עם המישור התלול יותר $z=2x$?
    answer: >-
      (א) היפרבולואיד חד-יריעתי סביב ציר $z$; החתך הקטן ביותר הוא המותן, מעגל ברדיוס 1 בגובה אפס. (ב) $\sqrt5\approx2.24$.
      (ג) החשבון נכון, אבל האליפסה שקיבלה היא רק ההיטל של עקום החיתוך על מישור $xy$. העקום עצמו הוא האליפסה
      $\left(\frac{2}{\sqrt3}\cos t,\ \sin t,\ \frac{2}{\sqrt3}\cos t\right)$, שמרכזה בראשית, עם חצאי הצירים
      $\frac{2\sqrt6}{3}\approx1.63$ ו-1. (ד) שני ישרים מקבילים, $(t,1,2t)$ ו-$(t,-1,2t)$.
    solution:
      - kind: idea
        text: >-
          לזיהוי: חתכים אופקיים ואחריהם חתך אנכי. לחיתוך עם מישור נטוי: ההצבה נותנת את ההיטל על מישור $xy$; את העקום
          עצמו מקבלים מפרמטריזציה של ההיטל ועוד הגובה מהמישור, והצורה שלו היא ההיטל כשהוא מתוח בכיוון העלייה של
          המישור.
      - kind: computation
        text: >-
          (א) מחלקים ב-4: $x^2+y^2-\frac{z^2}{4}=1$. $z=c$: $x^2+y^2=1+\frac{c^2}{4}$. אגף ימין חיובי לכל $c$, ולכן בכל
          גובה יש מעגל סביב ציר $z$, ברדיוס $\sqrt{1+\frac{c^2}{4}}$. הקטן ביותר בגובה אפס: רדיוס 1. $x=0$:
          $y^2-\frac{z^2}{4}=1$, היפרבולה שחותכת את ציר $y$ ב-$\pm1$, עם האסימפטוטות $z=\pm2y$.
      - kind: step
        text: >-
          מעגל בכל גובה, מותן, ופרופיל של היפרבולה: היפרבולואיד חד-יריעתי שהציר שלו ציר $z$. (וגם: המשתנה החריג הוא
          $z$, והצבה של $z=0$ משאירה חתך, מעגל היחידה.)
      - kind: computation
        text: >-
          (ב) $z=4$: $x^2+y^2=1+\frac{16}{4}=5$, רדיוס $\sqrt5\approx2.24$.
      - kind: computation
        text: >-
          (ג) ההצבה $z=x$ במשוואה המקורית: $4x^2+4y^2-x^2=4$, כלומר $3x^2+4y^2=4$. מחלקים ב-4:
          $\frac{x^2}{4/3}+y^2=1$. החשבון של הסטודנטית נכון, וזו אכן אליפסה שחצאי הצירים שלה $\sqrt{\frac43}=\frac{2}{\sqrt3}\approx1.15$
          ו-1.
      - kind: step
        text: >-
          מה שלא נכון הוא הפירוש. המשוואה שהתקבלה היא ב-$x$ וב-$y$ בלבד: היא מתארת את ההיטל של עקום החיתוך על מישור
          $xy$. העקום עצמו נמצא במישור הנטוי. פרמטריזציה של ההיטל: $x=\frac{2}{\sqrt3}\cos t$, $y=\sin t$; הגובה
          מהמישור: $z=x=\frac{2}{\sqrt3}\cos t$.
      - kind: step
        text: >-
          הצורה של העקום: במישור $z=x$ צעד של יחידה בכיוון $x$ מעלה יחידה, ואורכו על המישור $\sqrt{1+1}=\sqrt2$. בכיוון
          $y$ אין שיפוע. העקום הוא ההיטל כשהוא מתוח פי $\sqrt2$ בכיוון $x$ בלבד: אליפסה שמרכזה בראשית, עם חצאי הצירים
          $\frac{2}{\sqrt3}\cdot\sqrt2=\frac{2\sqrt6}{3}\approx1.63$ ו-1.
      - kind: computation
        text: >-
          (ד) ההצבה $z=2x$: $4x^2+4y^2-4x^2=4$. הפעם $x^2$ מצטמצם לגמרי, ונשאר $y^2=1$, כלומר $y=1$ או $y=-1$, ו-$x$
          חופשי. ההיטל הוא שני ישרים מקבילים. גם העקום עצמו הוא שני ישרים: בוחרים $x=t$, והגובה מהמישור הוא $z=2t$.
          מתקבלים הישרים $(t,1,2t)$ ו-$(t,-1,2t)$, ששניהם בכיוון $(1,0,2)$.
      - kind: check
        text: >-
          (ג) הנקודה הגבוהה ביותר של העקום, ב-$t=0$, היא $\left(\frac{2}{\sqrt3},0,\frac{2}{\sqrt3}\right)$, והנמוכה ביותר
          $\left(-\frac{2}{\sqrt3},0,-\frac{2}{\sqrt3}\right)$. המרחק ביניהן $\sqrt{2\cdot\left(\frac{4}{\sqrt3}\right)^2}=\sqrt{\frac{32}{3}}=\frac{4\sqrt6}{3}\approx3.27$,
          פעמיים חצי הציר שמצאנו. והנקודה הגבוהה על המשטח: $4\cdot\frac43+0-\frac43=4$. (ד) הנקודה $(t,1,2t)$ על המשטח
          לכל $t$: $4t^2+4-4t^2=4$. כמו בשיעור, גם כאן מונחים ישרים שלמים על משטח עקום.
      - kind: result
        text: >-
          המשטח הוא היפרבולואיד חד-יריעתי סביב ציר $z$, עם מותן ברדיוס 1 ורדיוס $\sqrt5$ בגובה 4. האליפסה
          $\frac{x^2}{4/3}+y^2=1$ היא ההיטל של החיתוך עם המישור $z=x$; החיתוך עצמו הוא אליפסה עם חצאי הצירים
          $\frac{2\sqrt6}{3}$ ו-1. המישור $z=2x$ חותך את המשטח בשני הישרים המקבילים $(t,\pm1,2t)$.

challenge:
  - id: W-2.5-c1
    stars: 1
    objectives: [OBJ-2.5-2, OBJ-2.5-3]
    prompt: >-
      בקרטוגרפיה מקרבים את כדור הארץ לא על ידי ספירה אלא על ידי אליפסואיד פחוס: הרדיוס שלו בקו המשווה הוא בערך 3963
      מייל, והרדיוס בקטבים בערך 3950 מייל. הניחו שמרכז כדור הארץ בראשית, ושהחתך במישור $z=0$ הוא קו המשווה.

      (א) כתבו את משוואת האליפסואיד.

      (ב) מצאו את עקום החיתוך שלו עם המישור $z=1000$ (עקום כזה נקרא קו רוחב). מה הרדיוס שלו?

      (ג) מצאו את עקום החיתוך שלו עם המישור $x+y=0$, שמכיל את ציר $z$ (עקום כזה נקרא קו אורך, מרידיאן). מה ההיטל
      שלו על מישור $xz$, ומה העקום עצמו? מה חצאי הצירים של כל אחד מהם?
    answer: >-
      (א) $\frac{x^2}{3963^2}+\frac{y^2}{3963^2}+\frac{z^2}{3950^2}=1$. (ב) המעגל $x^2+y^2=3963^2\cdot\frac{5841}{6241}$
      בגובה 1000, ברדיוס $\frac{3963\sqrt{5841}}{79}\approx3833.9$ מייל. (ג) ההיטל על מישור $xz$:
      $\frac{2x^2}{3963^2}+\frac{z^2}{3950^2}=1$, אליפסה עם חצאי הצירים $\frac{3963}{\sqrt2}\approx2802.3$ ו-3950. העקום
      עצמו: אליפסה במישור $x+y=0$ עם חצאי הצירים 3963 ו-3950.
    solution:
      - kind: idea
        text: >-
          קו המשווה הוא מעגל, ולכן שני חצאי הצירים האופקיים שווים, והשלישי, לאורך ציר $z$, קצר מהם. חתך במישור אופקי
          מקבלים בהצבה. המישור $x+y=0$ אינו מקביל לאף מישור צירים: ההצבה $y=-x$ נותנת את ההיטל של עקום החיתוך על מישור
          $xz$, ואת העקום עצמו מודדים בתוך המישור שלו.
      - kind: computation
        text: >-
          (א) אליפסואיד עם $a=b=3963$ ו-$h=3950$: $\frac{x^2}{3963^2}+\frac{y^2}{3963^2}+\frac{z^2}{3950^2}=1$. בדיקה
          מהירה: $z=0$ נותן $x^2+y^2=3963^2$, מעגל ברדיוס 3963, ו-$x=y=0$ נותן $z=\pm3950$.
      - kind: computation
        text: >-
          (ב) $z=1000$: $\frac{1000^2}{3950^2}=\left(\frac{20}{79}\right)^2=\frac{400}{6241}$, ולכן
          $\frac{x^2+y^2}{3963^2}=1-\frac{400}{6241}=\frac{5841}{6241}$. זה מעגל סביב ציר $z$ שהרדיוס שלו
          $3963\sqrt{\frac{5841}{6241}}=\frac{3963\sqrt{5841}}{79}\approx3833.9$ מייל.
      - kind: step
        text: >-
          (ג) במישור $x+y=0$ מתקיים $y=-x$. מציבים: $\frac{x^2}{3963^2}+\frac{x^2}{3963^2}+\frac{z^2}{3950^2}=1$, כלומר
          $\frac{2x^2}{3963^2}+\frac{z^2}{3950^2}=1$. זו משוואה ב-$x$ וב-$z$: ההיטל של עקום החיתוך על מישור $xz$. הוא
          אליפסה שחצי הציר שלה בכיוון $x$ הוא $\frac{3963}{\sqrt2}\approx2802.3$, ובכיוון $z$ הוא 3950.
      - kind: step
        text: >-
          העקום עצמו נמצא במישור $x+y=0$, ואת הצורה שלו מודדים בתוך המישור, כמו במישור האנכי $y=x+1$ שבשיעור: צעד של
          יחידה בכיוון $x$ מלווה בצעד של יחידה בכיוון $y$, ואורכו האמיתי $\sqrt2$. נקודה במישור היא $(x,-x,z)$, והמרחק
          האופקי שלה מציר $z$ הוא $s=\sqrt{x^2+x^2}=\sqrt2\,|x|$, לא $|x|$. במונחי $s$ ו-$z$, שהם המרחקים האמיתיים בתוך
          המישור, $2x^2=s^2$, ולכן $\frac{s^2}{3963^2}+\frac{z^2}{3950^2}=1$. זו אליפסה עם חצאי הצירים 3963 ו-3950:
          ההיטל כשהוא מתוח פי $\sqrt2$ בכיוון האופקי.
      - kind: check
        text: >-
          כך צריך להיות: האליפסואיד הוא משטח סיבוב סביב ציר $z$, ולכן החתך שלו בכל מישור שמכיל את ציר $z$ הוא אותה
          אליפסה, כמו החתך במישור $y=0$, שהוא $\frac{x^2}{3963^2}+\frac{z^2}{3950^2}=1$. ההיטל צר יותר פי $\sqrt2$ כי
          המישור $x+y=0$ יוצר זווית של $45^\circ$ עם מישור $xz$. ובדיקה מספרית: הנקודה של קו המשווה במישור הזה,
          $\left(\frac{3963}{\sqrt2},-\frac{3963}{\sqrt2},0\right)$, נמצאת במרחק 3963 מהמרכז.
      - kind: result
        text: >-
          האליפסואיד: $\frac{x^2+y^2}{3963^2}+\frac{z^2}{3950^2}=1$. קו הרוחב בגובה 1000 מייל הוא מעגל ברדיוס של בערך
          3833.9 מייל. קו האורך שבמישור $x+y=0$ הוא אליפסה עם חצאי הצירים 3963 ו-3950 מייל, וההיטל שלה על מישור $xz$
          הוא האליפסה $\frac{2x^2}{3963^2}+\frac{z^2}{3950^2}=1$.
    source:
      name: 'OpenStax, Calculus Volume 3 (G. Strang, E. Herman), Section 2.6 Quadric Surfaces'
      year: 2016
      problem: 'Exercise 359'
      url: https://openstax.org/books/calculus-volume-3/pages/2-6-quadric-surfaces
      verified: '2026-11-18'
      adapted: true

  - id: W-2.5-c2
    stars: 1
    objectives: [OBJ-2.5-1, OBJ-2.5-3]
    prompt: >-
      נתון המשטח $x=4-5y^2-9z^2$.

      (א) מצאו את החתכים שלו במישורים $x=c$. לאילו ערכים של $c$ יש חתך, ומה חצאי הצירים שלו?

      (ב) מצאו את החתכים במישורים $y=0$ ו-$z=0$.

      (ג) זהו את המשטח ותארו שלד לשרטוט שלו: איפה הקודקוד, מה הציר, ולאיזה כיוון המשטח נפתח?

      (ד) המישור $x=4-6z$ חותך את המשטח. מצאו את ההיטל של עקום החיתוך על מישור $yz$, כתבו פרמטריזציה של העקום עצמו,
      ומצאו את חצאי הצירים שלו.
    answer: >-
      (א) $5y^2+9z^2=4-c$: אליפסה כש-$c<4$, עם חצאי הצירים $\sqrt{\frac{4-c}{5}}$ (בכיוון $y$) ו-$\frac{\sqrt{4-c}}{3}$
      (בכיוון $z$); הנקודה $(4,0,0)$ כש-$c=4$; אין חתך כש-$c>4$. (ב) הפרבולות $x=4-9z^2$ ו-$x=4-5y^2$. (ג) פרבולואיד
      אליפטי שקודקודו $(4,0,0)$, הציר שלו ציר $x$, והוא נפתח לכיוון השלילי של ציר $x$. (ד) ההיטל:
      $5y^2+9\left(z-\frac13\right)^2=1$; העקום: $\left(2-2\sin t,\ \frac{1}{\sqrt5}\cos t,\ \frac13+\frac13\sin t\right)$,
      אליפסה עם חצאי הצירים $\frac{\sqrt{37}}{3}\approx2.03$ ו-$\frac{1}{\sqrt5}\approx0.45$.
    solution:
      - kind: idea
        text: >-
          המשתנה החריג הוא $x$, שמופיע בחזקה ראשונה, ולכן הוא משחק כאן את התפקיד ש-$z$ שיחק בשיעור: חותכים קודם
          במישורים $x=c$, שמאונכים לציר המשטח, ואחר כך בשני המישורים שמכילים את הציר. גם בסעיף (ד) התפקידים מוחלפים:
          המישור נותן את $x$ כפונקציה של $z$, ולכן ההצבה משאירה משוואה ב-$y$ וב-$z$, שהיא ההיטל על מישור $yz$.
      - kind: computation
        text: >-
          (א) $x=c$: $c=4-5y^2-9z^2$, כלומר $5y^2+9z^2=4-c$. כש-$c<4$ אגף ימין חיובי, ומחלקים בו:
          $\frac{y^2}{(4-c)/5}+\frac{z^2}{(4-c)/9}=1$. אליפסה עם חצי ציר $\sqrt{\frac{4-c}{5}}$ בכיוון $y$ ו-$\frac{\sqrt{4-c}}{3}$
          בכיוון $z$. כש-$c=4$ החתך הוא הנקודה $(4,0,0)$, וכש-$c>4$ אין חתך.
      - kind: step
        text: >-
          הגודל: האליפסות גדלות ככל ש-$c$ קטן. במישור $x=0$, למשל, החתך הוא $5y^2+9z^2=4$, עם חצאי הצירים
          $\frac{2}{\sqrt5}\approx0.89$ ו-$\frac23$.
      - kind: computation
        text: >-
          (ב) $y=0$: $x=4-9z^2$, פרבולה במישור $xz$ שקודקודה ב-$x=4$ והיא פתוחה לכיוון השלילי של ציר $x$. $z=0$:
          $x=4-5y^2$, פרבולה דומה במישור $xy$, רחבה יותר.
      - kind: step
        text: >-
          (ג) חתכים שהם אליפסות רק מצד אחד של $x=4$, ופרופילים של פרבולות: פרבולואיד אליפטי. הקודקוד $(4,0,0)$, הציר
          הוא ציר $x$, והקערה שוכבת על הצד ונפתחת לכיוון השלילי של ציר $x$. לשרטוט: מסמנים את הקודקוד, מציירים את
          האליפסה שבמישור $x=0$ ועוד אחת רחוקה יותר (למשל ב-$x=-5$, שם $5y^2+9z^2=9$), ומחברים בשתי הפרבולות של (ב).
      - kind: computation
        text: >-
          (ד) משווים את שני הביטויים ל-$x$: $4-6z=4-5y^2-9z^2$, כלומר $5y^2+9z^2-6z=0$. משלימים לריבוע ב-$z$:
          $9z^2-6z=9\left(z-\frac13\right)^2-1$. לכן $5y^2+9\left(z-\frac13\right)^2=1$: ההיטל על מישור $yz$ הוא אליפסה
          שמרכזה $\left(0,\frac13\right)$, עם חצי ציר $\frac{1}{\sqrt5}$ בכיוון $y$ ו-$\frac13$ בכיוון $z$.
      - kind: computation
        text: >-
          פרמטריזציה של ההיטל: $y=\frac{1}{\sqrt5}\cos t$, $z=\frac13+\frac13\sin t$. את $x$ לוקחים מהמישור:
          $x=4-6z=2-2\sin t$. העקום: $\left(2-2\sin t,\ \frac{1}{\sqrt5}\cos t,\ \frac13+\frac13\sin t\right)$, $0\le t<2\pi$.
      - kind: step
        text: >-
          הצורה של העקום עצמו: במישור $x=4-6z$ צעד של יחידה בכיוון $z$ מזיז 6 יחידות בכיוון $x$, ואורכו האמיתי
          $\sqrt{1+36}=\sqrt{37}$. צעד בכיוון $y$ אינו מושפע. העקום הוא ההיטל כשהוא מתוח פי $\sqrt{37}$ בכיוון $z$: חצי
          הציר $\frac13$ נמתח ל-$\frac{\sqrt{37}}{3}\approx2.03$, וחצי הציר $\frac{1}{\sqrt5}\approx0.45$ נשאר. זו אליפסה
          שמרכזה $\left(2,0,\frac13\right)$, הנקודה של המישור שמול מרכז ההיטל.
      - kind: check
        text: >-
          מודדים במרחב: ב-$\sin t=-1$ מקבלים את $(4,0,0)$, וב-$\sin t=1$ את $\left(0,0,\frac23\right)$. המרחק ביניהן
          $\sqrt{4^2+\left(\frac23\right)^2}=\sqrt{\frac{148}{9}}=\frac{2\sqrt{37}}{3}\approx4.06$, פעמיים חצי הציר הארוך.
          בכיוון השני, הנקודות $\left(2,\pm\frac{1}{\sqrt5},\frac13\right)$ במרחק $\frac{2}{\sqrt5}\approx0.89$. שתי הנקודות
          הקיצוניות על המשטח: $4-0-0=4$, ו-$4-0-9\cdot\frac49=0$. והמישור עובר דרך הקודקוד $(4,0,0)$ של המשטח, ולכן הקודקוד
          הוא אחת מנקודות העקום.
      - kind: result
        text: >-
          פרבולואיד אליפטי שקודקודו $(4,0,0)$ ונפתח לכיוון השלילי של ציר $x$; החתך שלו במישור $x=c$ הוא האליפסה
          $5y^2+9z^2=4-c$ (כש-$c<4$). החיתוך עם המישור $x=4-6z$ הוא אליפסה עם חצאי הצירים $\frac{\sqrt{37}}{3}$
          ו-$\frac{1}{\sqrt5}$, שההיטל שלה על מישור $yz$ הוא $5y^2+9\left(z-\frac13\right)^2=1$.
