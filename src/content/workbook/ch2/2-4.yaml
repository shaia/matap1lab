# Workbook of lesson 2.4 — cylindrical and spherical coordinates.
# Objectives (src/course.ts):
#   OBJ-2.4-1  Cartesian <-> cylindrical and spherical, by the course's angle convention
#   OBJ-2.4-2  the surfaces where one coordinate is constant: cylinder, plane, sphere, cone
#   OBJ-2.4-3  solids such as a ball, a cylinder and a cone in the fitting coordinates
# Convention: cylindrical (r, θ, z); spherical (r, θ, φ), θ from the positive z-axis, φ the azimuth.
# Every number recomputed with sympy in screens/tools/lesson-2-4.py.
lesson: '2.4'
practice:
  - id: W-2.4-01
    level: basic
    objectives: [OBJ-2.4-1]
    prompt: >-
      לנקודה $P$ הקואורדינטות הגליליות $(r,\theta,z)=\left(2,\frac{7\pi}{6},2\sqrt3\right)$.

      (א) מצאו את הקואורדינטות הקרטזיות של $P$.

      (ב) מה המרחק של $P$ מציר $z$, ומה המרחק שלה מהראשית?

      (ג) מצאו את הקואורדינטות הכדוריות של $P$.
    answer: >-
      (א) $(-\sqrt3,\,-1,\,2\sqrt3)$. (ב) מציר $z$: 2; מהראשית: 4. (ג) $(r,\theta,\varphi)=\left(4,\frac{\pi}{6},\frac{7\pi}{6}\right)$.
    solution:
      - kind: idea
        text: >-
          גליליות הן קוטביות על הרצפה ועוד גובה, ולכן $x$ ו-$y$ מתקבלים כמו בשיעור 2.3 ו-$z$ עובר כמו שהוא. ה-$r$
          הגלילי הוא המרחק מציר $z$; המרחק מהראשית הוא האורך של וקטור המקום. במעבר לכדוריות האזימוט נשאר אותה
          זווית ורק מחליף אות.
      - kind: computation
        text: >-
          (א) $x=2\cos\frac{7\pi}{6}=2\cdot\left(-\frac{\sqrt3}{2}\right)=-\sqrt3$,
          $y=2\sin\frac{7\pi}{6}=2\cdot\left(-\frac12\right)=-1$, ו-$z=2\sqrt3$.
      - kind: computation
        text: >-
          (ב) המרחק מציר $z$ הוא ה-$r$ הגלילי, 2. המרחק מהראשית: $\sqrt{x^2+y^2+z^2}=\sqrt{r^2+z^2}=\sqrt{4+12}=4$.
      - kind: computation
        text: >-
          (ג) ה-$r$ הכדורי הוא המרחק מהראשית, 4. הזווית מציר $z$: $\cos\theta=\frac{z}{r}=\frac{2\sqrt3}{4}=\frac{\sqrt3}{2}$,
          ולכן $\theta=\frac{\pi}{6}$. האזימוט $\varphi$ הוא ה-$\theta$ הגלילי: $\frac{7\pi}{6}$.
      - kind: check
        text: >-
          ה-$r$ הגלילי צריך להיות $r\sin\theta$ הכדורי: $4\sin\frac{\pi}{6}=2$. הסימנים: אזימוט $\frac{7\pi}{6}$ הוא ברביע
          השלישי, ואכן $x<0$ ו-$y<0$. שימו לב ש-$r$ ו-$\theta$ קיבלו ערכים אחרים בשתי השלישיות.
      - kind: result
        text: >-
          $P=(-\sqrt3,-1,2\sqrt3)$; מרחק 2 מציר $z$ ו-4 מהראשית; בכדוריות $\left(4,\frac{\pi}{6},\frac{7\pi}{6}\right)$.

  - id: W-2.4-02
    level: basic
    objectives: [OBJ-2.4-1]
    prompt: >-
      לנקודה $Q$ הקואורדינטות הכדוריות $(r,\theta,\varphi)=\left(2,\frac{3\pi}{4},\frac{5\pi}{3}\right)$.

      (א) בלי לחשב: האם $Q$ מעל מישור $xy$ או מתחתיו? באיזה רביע ההיטל שלה על מישור $xy$?

      (ב) מצאו את הקואורדינטות הקרטזיות של $Q$.

      (ג) מצאו את הקואורדינטות הגליליות של $Q$.
    answer: >-
      (א) מתחת למישור; ההיטל ברביע הרביעי. (ב) $\left(\frac{\sqrt2}{2},\,-\frac{\sqrt6}{2},\,-\sqrt2\right)$.
      (ג) $(r,\theta,z)=\left(\sqrt2,\frac{5\pi}{3},-\sqrt2\right)$.
    solution:
      - kind: idea
        text: >-
          $\theta$ הכדורי אומר כמה הקטע מהראשית נוטה מציר $z$: מעל $\frac{\pi}{2}$ הנקודה מתחת לרצפה. האזימוט $\varphi$
          אומר לאיזה רביע פונה ההיטל. לחישוב: קודם הגובה $r\cos\theta$ והמרחק מהציר $r\sin\theta$, ואחר כך מפרקים את
          המרחק מהציר לפי האזימוט.
      - kind: step
        text: >-
          (א) $\frac{3\pi}{4}>\frac{\pi}{2}$, ולכן הנקודה מתחת למישור $xy$. האזימוט $\frac{5\pi}{3}$ הוא $300^\circ$, בין
          $270^\circ$ ל-$360^\circ$: ההיטל ברביע הרביעי, $x>0$ ו-$y<0$.
      - kind: computation
        text: >-
          (ב) הגובה: $z=2\cos\frac{3\pi}{4}=-\sqrt2$. המרחק מציר $z$: $2\sin\frac{3\pi}{4}=\sqrt2$.
      - kind: computation
        text: >-
          $x=\sqrt2\cos\frac{5\pi}{3}=\sqrt2\cdot\frac12=\frac{\sqrt2}{2}$, ו-$y=\sqrt2\sin\frac{5\pi}{3}=\sqrt2\cdot\left(-\frac{\sqrt3}{2}\right)=-\frac{\sqrt6}{2}$.
      - kind: computation
        text: >-
          (ג) ה-$r$ הגלילי הוא המרחק מציר $z$ שכבר חישבנו, $\sqrt2$. ה-$\theta$ הגלילי הוא האזימוט, $\frac{5\pi}{3}$.
          והגובה $z=-\sqrt2$.
      - kind: check
        text: >-
          סכום הריבועים: $\frac12+\frac64+2=4=r^2$. הסימנים מתאימים ל-(א): $x>0$, $y<0$, $z<0$. במספרים עשרוניים
          $Q\approx(0.71,\,-1.22,\,-1.41)$.
      - kind: result
        text: >-
          $Q=\left(\frac{\sqrt2}{2},-\frac{\sqrt6}{2},-\sqrt2\right)$, ובגליליות $\left(\sqrt2,\frac{5\pi}{3},-\sqrt2\right)$.

  - id: W-2.4-03
    level: basic
    qualitative: true
    objectives: [OBJ-2.4-2]
    prompt: >-
      לכל משוואה אמרו איזו קבוצה של נקודות במרחב היא מתארת, ותנו נקודה אחת שנמצאת בה (בקואורדינטות קרטזיות).

      (א) בגליליות: $z=-1$.

      (ב) בכדוריות: $\varphi=\frac{3\pi}{2}$.

      (ג) בכדוריות: $r=\frac12$.

      (ד) בכדוריות: $\theta=\pi$.

      (ה) בגליליות: $r=0$.

      (ו) בכדוריות: $\theta=\frac{5\pi}{6}$.
    answer: >-
      (א) מישור אופקי בגובה $-1$. (ב) חצי המישור $x=0$, $y\le0$. (ג) ספירה ברדיוס $\frac12$ סביב הראשית.
      (ד) ציר $z$ השלילי. (ה) ציר $z$ כולו. (ו) חרוט שפונה למטה, $z=-\sqrt3\cdot\sqrt{x^2+y^2}$.
    solution:
      - kind: idea
        text: >-
          לכל משוואה שואלים מה מודדת הקואורדינטה הקבועה במערכת שלה, ונותנים לשתי האחרות לעבור על כל הערכים. מרחק
          קבוע מהציר נותן גליל, מרחק קבוע מהראשית ספירה, אזימוט קבוע חצי מישור, וזווית קבועה מציר $z$ חרוט. בערכי
          קצה המשטח מתנוון לקו.
      - kind: step
        text: >-
          (א) גובה קבוע, $r$ ו-$\theta$ חופשיים: המישור האופקי $z=-1$. למשל $(0,0,-1)$.
      - kind: step
        text: >-
          (ב) אזימוט קבוע: חצי מישור שהשפה שלו ציר $z$. האזימוט $\frac{3\pi}{2}$ פונה לכיוון ציר $y$ השלילי, ולכן זה
          $x=0$, $y\le0$. למשל $(0,-1,0)$.
      - kind: step
        text: >-
          (ג) מרחק קבוע מהראשית: הספירה $x^2+y^2+z^2=\frac14$. למשל $\left(\frac12,0,0\right)$.
      - kind: step
        text: >-
          (ד) נטייה של $\pi$ מציר $z$ החיובי היא "ישר למטה". החרוט נסגר לקרן אחת: ציר $z$ השלילי. למשל $(0,0,-2)$.
          זה קו, לא משטח.
      - kind: step
        text: >-
          (ה) מרחק 0 מציר $z$: הגליל התכווץ לציר $z$ עצמו. למשל $(0,0,3)$.
      - kind: computation
        text: >-
          (ו) $\frac{5\pi}{6}>\frac{\pi}{2}$: חרוט שפונה למטה. היחס בין המרחק מהציר לגובה הוא
          $\tan\frac{5\pi}{6}=-\frac{1}{\sqrt3}$, כלומר $\sqrt{x^2+y^2}=-\frac{z}{\sqrt3}$, או $z=-\sqrt3\cdot\sqrt{x^2+y^2}$.
          נקודה: עם $r=2$ ו-$\varphi=0$ מקבלים $(2\sin\frac{5\pi}{6},\,0,\,2\cos\frac{5\pi}{6})=(1,0,-\sqrt3)$.
      - kind: check
        text: >-
          ב-(ו): $-\sqrt3\cdot\sqrt{1+0}=-\sqrt3$, כגובה של הנקודה. ב-(ב): לנקודה $(0,-1,0)$ האזימוט הוא כיוון ציר $y$
          השלילי, $270^\circ$.
      - kind: result
        text: >-
          מישור אופקי; חצי מישור $x=0$, $y\le0$; ספירה ברדיוס $\frac12$; ציר $z$ השלילי; ציר $z$; חרוט שפונה למטה,
          $z=-\sqrt3\cdot\sqrt{x^2+y^2}$.

  - id: W-2.4-04
    level: mid
    objectives: [OBJ-2.4-1]
    prompt: >-
      נתונה הנקודה $(-3,\,\sqrt3,\,-2)$ בקואורדינטות קרטזיות. מצאו את הקואורדינטות הגליליות שלה ואת הקואורדינטות
      הכדוריות שלה (אזימוט בקטע $[0,2\pi)$).
    answer: >-
      גליליות: $(r,\theta,z)=\left(2\sqrt3,\frac{5\pi}{6},-2\right)$. כדוריות:
      $(r,\theta,\varphi)=\left(4,\frac{2\pi}{3},\frac{5\pi}{6}\right)$.
    solution:
      - kind: idea
        text: >-
          שני מתכונים עם חלק משותף: האזימוט, שהוא ה-$\theta$ הגלילי וה-$\varphi$ הכדורי, מחושב פעם אחת מההיטל $(x,y)$
          לפי כלל הרביע. ה-$\theta$ הכדורי מחושב ב-$\arccos\frac{z}{r}$, בלי בעיית רביעים.
      - kind: computation
        text: >-
          המרחק מציר $z$: $\sqrt{x^2+y^2}=\sqrt{9+3}=\sqrt{12}=2\sqrt3$.
      - kind: computation
        text: >-
          האזימוט: ההיטל $(-3,\sqrt3)$ ברביע השני. $\arctan\frac{\sqrt3}{-3}=\arctan\left(-\frac{1}{\sqrt3}\right)$ הוא מינוס
          $\frac{\pi}{6}$, זווית ברביע הרביעי; מאחר ש-$x<0$ מוסיפים $\pi$ ומקבלים $\frac{5\pi}{6}$.
      - kind: step
        text: >-
          גליליות: $(r,\theta,z)=\left(2\sqrt3,\frac{5\pi}{6},-2\right)$.
      - kind: computation
        text: >-
          המרחק מהראשית: $\sqrt{9+3+4}=4$. הזווית מציר $z$: $\cos\theta=\frac{-2}{4}=-\frac12$, ולכן $\theta=\frac{2\pi}{3}$.
      - kind: check
        text: >-
          $4\sin\frac{2\pi}{3}=2\sqrt3$, כמו ה-$r$ הגלילי, ו-$4\cos\frac{2\pi}{3}=-2$, כמו $z$. הזווית $\frac{2\pi}{3}$ גדולה
          מ-$\frac{\pi}{2}$, כמו שצריך לנקודה עם $z<0$.
      - kind: result
        text: >-
          גליליות $\left(2\sqrt3,\frac{5\pi}{6},-2\right)$; כדוריות $\left(4,\frac{2\pi}{3},\frac{5\pi}{6}\right)$.

  - id: W-2.4-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.4-1]
    prompt: >-
      בסיכומי ההרצאות שהקורס נבנה לפיהם נקודה כתובה כ-$\left(6,\frac{\pi}{3},-\frac{\pi}{6}\right)$, והנוסחאות שם,
      באותיות של הסיכומים, הן $x=\rho\cos\theta\cos\varphi$, $y=\rho\sin\theta\cos\varphi$, $z=\rho\sin\varphi$. כלומר
      המרחק מהראשית 6, האזימוט $\frac{\pi}{3}$, והזווית השלישית, שנסמן כמו בשיעור $\beta$, היא מינוס $\frac{\pi}{6}$.

      (א) לפי איזו מהנוסחאות אפשר לדעת, בלי שום הסבר נלווה, שהזווית השלישית נמדדת ממישור $xy$ ולא מציר $z$?

      (ב) מצאו את הקואורדינטות הקרטזיות של הנקודה לפי הנוסחאות של הסיכומים.

      (ג) תרגמו את השלישייה למוסכמה של הקורס, $(r,\theta,\varphi)$, ובדקו שהנוסחאות של הקורס נותנות אותה נקודה.

      (ד) חבר העתיק את השלישייה כמו שהיא והציב אותה בנוסחאות של הקורס. איזה $z$ הוא קיבל, ומה זה אומר על הנקודה
      שלו?
    answer: >-
      (א) לפי הנוסחה של $z$: כתוב בה סינוס של הזווית. (ב) $\left(\frac{3\sqrt3}{2},\,\frac92,\,-3\right)$.
      (ג) $(r,\theta,\varphi)=\left(6,\frac{2\pi}{3},\frac{\pi}{3}\right)$. (ד) $z=3$ במקום $-3$: נקודה מעל מישור $xy$,
      לא הנקודה הנכונה.
    solution:
      - kind: idea
        text: >-
          את המוסכמה מזהים לפי הנוסחה של $z$: קוסינוס פירושו זווית מציר $z$, סינוס פירושו זווית ממישור $xy$ (זווית
          רוחב). התרגום: המרחק נשאר, $r=\rho$; האזימוט נשאר אותה זווית ועובר למקום השלישי בשלישייה; ובמקום זווית
          הרוחב $\beta$ כותבים $\theta=\frac{\pi}{2}-\beta$.
      - kind: step
        text: >-
          (א) לפי הנוסחה של $z$: הגובה הוא $\rho$ כפול **סינוס** של הזווית. כשהזווית 0 מקבלים $z=0$, כלומר זווית 0
          היא מישור $xy$, והזווית נמדדת ממנו. אילו נמדדה מציר $z$, זווית 0 הייתה נותנת את הגובה המרבי, והנוסחה
          הייתה עם קוסינוס.
      - kind: computation
        text: >-
          (ב) $\cos\left(-\frac{\pi}{6}\right)=\frac{\sqrt3}{2}$ ו-$\sin\left(-\frac{\pi}{6}\right)=-\frac12$. לכן
          $x=6\cdot\frac12\cdot\frac{\sqrt3}{2}=\frac{3\sqrt3}{2}$, $y=6\cdot\frac{\sqrt3}{2}\cdot\frac{\sqrt3}{2}=\frac92$,
          ו-$z=6\cdot\left(-\frac12\right)=-3$.
      - kind: computation
        text: >-
          (ג) $r=6$. הזווית מציר $z$: $\theta=\frac{\pi}{2}-\beta=\frac{\pi}{2}-\left(-\frac{\pi}{6}\right)=\frac{2\pi}{3}$
          (מחסרים מספר שלילי, ולכן $\theta$ גדלה). האזימוט:
          $\varphi=\frac{\pi}{3}$. בדיקה בנוסחאות של הקורס: $z=6\cos\frac{2\pi}{3}=-3$; המרחק מהציר
          $6\sin\frac{2\pi}{3}=3\sqrt3$; $x=3\sqrt3\cos\frac{\pi}{3}=\frac{3\sqrt3}{2}$ ו-$y=3\sqrt3\sin\frac{\pi}{3}=\frac92$.
          אותה נקודה.
      - kind: computation
        text: >-
          (ד) בנוסחאות של הקורס עם $\theta=\frac{\pi}{3}$: $z=6\cos\frac{\pi}{3}=3$. הנקודה שלו מעל מישור $xy$, בעוד
          הנקודה של הסיכומים מתחתיו (זווית רוחב שלילית). בנוסף, הערך $-\frac{\pi}{6}$ שהוא הציב כאזימוט הוא בכלל זווית
          הרוחב. העתקה של שלישייה בין מוסכמות נותנת נקודה אחרת.
      - kind: check
        text: >-
          סכום הריבועים ב-(ב): $\frac{27}{4}+\frac{81}{4}+9=36=6^2$. זווית רוחב שלילית פירושה "מתחת לקו המשווה", ואכן
          $z<0$ וה-$\theta$ שלנו גדול מ-$\frac{\pi}{2}$.
      - kind: result
        text: >-
          הנקודה היא $\left(\frac{3\sqrt3}{2},\frac92,-3\right)$, ובמוסכמה של הקורס $\left(6,\frac{2\pi}{3},\frac{\pi}{3}\right)$.
          מזהים מוסכמה לפי הנוסחה של $z$, ומתרגמים לפני שמציבים.

  - id: W-2.4-06
    level: mid
    qualitative: true
    objectives: [OBJ-2.4-3]
    prompt: >-
      חצי הכדור התחתון הוא $x^2+y^2+z^2\le9$, $z\le0$. תלמיד תיאר אותו בקואורדינטות כדוריות כך:
      $0\le r\le3$, $\frac{\pi}{2}\le\theta\le\pi$, $0\le\varphi\le\pi$.

      (א) מצאו נקודה של חצי הכדור התחתון שאינה מקיימת את התיאור של התלמיד. מה הטעות?

      (ב) איזה גוף התלמיד תיאר בפועל?

      (ג) כתבו את התיאור הנכון של חצי הכדור התחתון.

      (ד) תארו בקואורדינטות כדוריות את החלק של הכדור שבו $x\ge0$, $y\ge0$ ו-$z\le0$.
    answer: >-
      (א) למשל $(0,-1,-1)$, שהאזימוט שלה $\frac{3\pi}{2}$: הטעות היא בקטע של $\varphi$. (ב) רבע כדור: החלק שבו $z\le0$
      וגם $y\ge0$. (ג) $0\le r\le3$, $\frac{\pi}{2}\le\theta\le\pi$, $0\le\varphi<2\pi$. (ד) $0\le r\le3$,
      $\frac{\pi}{2}\le\theta\le\pi$, $0\le\varphi\le\frac{\pi}{2}$.
    solution:
      - kind: idea
        text: >-
          כל אי-שוויון חותך את המרחב לאורך משטח קואורדינטה. בודקים כל שורה בנפרד: מה היא מרשה ומה היא אוסרת. שתי
          הזוויות אינן דומות: $\theta$ עוברת רק מ-0 עד $\pi$ וקובעת את הגובה, והאזימוט $\varphi$ מקיף סיבוב שלם וקובע
          את הצד.
      - kind: step
        text: >-
          השורות $0\le r\le3$ ו-$\frac{\pi}{2}\le\theta\le\pi$ נכונות: המרחק מהראשית עד 3, והנטייה מציר $z$ בין "אופקי"
          ל"ישר למטה", כלומר $z=r\cos\theta\le0$.
      - kind: step
        text: >-
          (א) השורה $0\le\varphi\le\pi$ מרשה רק חצי סיבוב סביב ציר $z$: האזימוטים שבהם $\sin\varphi\ge0$, כלומר
          $y\ge0$. הנקודה $(0,-1,-1)$ נמצאת בחצי הכדור התחתון ($0+1+1\le9$ ו-$z\le0$), אבל האזימוט שלה הוא
          $\frac{3\pi}{2}$, מחוץ לקטע. נראה שהתלמיד העתיק ל-$\varphi$ את הקטע של $\theta$.
      - kind: step
        text: >-
          (ב) $z\le0$ וגם $y\ge0$: רבע של הכדור.
      - kind: step
        text: >-
          (ג) חצי הכדור התחתון מקיף את ציר $z$ כולו: $0\le r\le3$, $\frac{\pi}{2}\le\theta\le\pi$, $0\le\varphi<2\pi$.
      - kind: step
        text: >-
          (ד) $x\ge0$ וגם $y\ge0$ פירושו שההיטל על מישור $xy$ ברביע הראשון: $0\le\varphi\le\frac{\pi}{2}$. יחד עם
          $z\le0$: $0\le r\le3$, $\frac{\pi}{2}\le\theta\le\pi$, $0\le\varphi\le\frac{\pi}{2}$. זו שמינית של הכדור.
      - kind: check
        text: >-
          נקודה מהתיאור של (ד): $(r,\theta,\varphi)=\left(1,\frac{3\pi}{4},\frac{\pi}{4}\right)$ היא
          $\left(\frac12,\frac12,-\frac{\sqrt2}{2}\right)$: $x>0$, $y>0$, $z<0$, כנדרש.
      - kind: result
        text: >-
          הטעות בקטע של האזימוט. חצי הכדור התחתון: $0\le r\le3$, $\frac{\pi}{2}\le\theta\le\pi$, $0\le\varphi<2\pi$; התלמיד
          תיאר רבע כדור; השמינית של (ד) היא $0\le\varphi\le\frac{\pi}{2}$ עם אותם גבולות ל-$r$ ול-$\theta$.

  - id: W-2.4-07
    level: mid
    objectives: [OBJ-2.4-2]
    prompt: >-
      משטח קואורדינטה של מערכת אחת אינו בהכרח פשוט במערכת אחרת.

      (א) כתבו את המישור $z=4$ בקואורדינטות כדוריות, כ-$r$ כפונקציה של $\theta$. לאילו ערכים של $\theta$ יש
      נקודות על המישור?

      (ב) כתבו את הגליל $x^2+y^2=9$ בקואורדינטות כדוריות, כ-$r$ כפונקציה של $\theta$.

      (ג) כתבו את הספירה $x^2+y^2+z^2=169$ בקואורדינטות גליליות. מה הרדיוס של המעגל שבו היא חותכת את המישור
      $z=-5$?

      (ד) המישור של (א) והגליל של (ב) נחתכים במעגל. מצאו את $r$ ואת $\theta$ הכדוריים של הנקודות שעליו.
    answer: >-
      (א) $r=\frac{4}{\cos\theta}$, $0\le\theta<\frac{\pi}{2}$. (ב) $r=\frac{3}{\sin\theta}$, $0<\theta<\pi$.
      (ג) $r^2+z^2=169$; רדיוס 12. (ד) $r=5$, $\tan\theta=\frac34$, כלומר $\theta\approx36.9^\circ$.
    solution:
      - kind: idea
        text: >-
          כמו בגליל של סעיף הגופים בשיעור ("קיר זר"): מתרגמים כל ביטוי קרטזי לשווה לו. בכדוריות $z=r\cos\theta$
          ו-$\sqrt{x^2+y^2}=r\sin\theta$ (המרחק מציר $z$); בגליליות $x^2+y^2=r^2$. אחר כך מבודדים את הקואורדינטה
          המבוקשת. ב-(א), (ב) ו-(ד) האות $r$ היא המרחק מהראשית; ב-(ג) היא המרחק מציר $z$.
      - kind: computation
        text: >-
          (א) $z=4$ הוא $r\cos\theta=4$, כלומר $r=\frac{4}{\cos\theta}$. מאחר ש-$r\ge0$ נדרש $\cos\theta>0$:
          $0\le\theta<\frac{\pi}{2}$. ואכן, רק קרניים שנוטות למעלה פוגעות במישור שמעל הרצפה.
      - kind: computation
        text: >-
          (ב) $x^2+y^2=9$ פירושו שהמרחק מציר $z$ הוא 3: $r\sin\theta=3$, כלומר $r=\frac{3}{\sin\theta}$, לכל
          $0<\theta<\pi$. (ב-$\theta=0$ וב-$\theta=\pi$ הקרן היא ציר $z$ עצמו, והיא אינה פוגעת בגליל.)
      - kind: computation
        text: >-
          (ג) מחליפים $x^2+y^2$ ב-$r^2$: $r^2+z^2=169$. בגובה $z=-5$: $r^2=169-25=144$, ולכן $r=12$. זה ה-$r$ הגלילי,
          המרחק מציר $z$, והוא הרדיוס של מעגל החיתוך.
      - kind: computation
        text: >-
          (ד) על מעגל החיתוך מתקיימים שני התנאים: $r\cos\theta=4$ ו-$r\sin\theta=3$. מחלקים את השני בראשון:
          $\tan\theta=\frac34$, $\theta\approx36.9^\circ$. מעלים בריבוע ומחברים, ונעזרים ב-$\sin^2\theta+\cos^2\theta=1$:
          $r^2=16+9=25$, $r=5$.
      - kind: check
        text: >-
          (א) ב-$\theta=\frac{\pi}{3}$: $r=8$, והגובה $8\cos\frac{\pi}{3}=4$. (ב) ב-$\theta=\frac{\pi}{6}$: $r=6$, והמרחק מהציר
          $6\sin\frac{\pi}{6}=3$. (ד) בקרטזיות המעגל הוא $x^2+y^2=9$ בגובה 4, והמרחק של כל נקודה שלו מהראשית הוא
          $\sqrt{9+16}=5$.
      - kind: result
        text: >-
          המישור: $r=\frac{4}{\cos\theta}$; הגליל: $r=\frac{3}{\sin\theta}$; הספירה בגליליות: $r^2+z^2=169$, עם מעגל
          ברדיוס 12 בגובה $-5$; מעגל החיתוך של (ד): $r=5$, $\tan\theta=\frac34$.

  - id: W-2.4-08
    level: exam
    objectives: [OBJ-2.4-3, OBJ-2.4-2]
    prompt: >-
      הגוף $E$ הוא כל הנקודות שנמצאות בתוך הכדור $x^2+y^2+z^2\le8$, מעל מישור $xy$ ($z\ge0$), ו**מתחת** לחרוט
      $z=\sqrt{x^2+y^2}$.

      (א) תארו את $E$ בקואורדינטות כדוריות.

      (ב) תארו את $E$ בקואורדינטות גליליות.

      (ג) מהו החתך של $E$ במישור $z=1$?

      (ד) האם הנקודה $(2,1,1)$ נמצאת ב-$E$?
    answer: >-
      (א) $0\le r\le2\sqrt2$, $\frac{\pi}{4}\le\theta\le\frac{\pi}{2}$, $0\le\varphi<2\pi$. (ב) $0\le\theta<2\pi$; ל-$0\le r\le2$:
      $0\le z\le r$; ל-$2\le r\le2\sqrt2$: $0\le z\le\sqrt{8-r^2}$. (ג) הטבעת $1\le r\le\sqrt7$. (ד) כן.
    solution:
      - kind: idea
        text: >-
          בכדוריות שלושת הקירות הם משטחי קואורדינטות: הספירה $r=2\sqrt2$, החרוט $\theta=\frac{\pi}{4}$ והרצפה
          $\theta=\frac{\pi}{2}$. צריך רק לבחור את הצד הנכון של החרוט. בגליליות לכל מרחק מהציר יש שתי תקרות, החרוט
          והספירה. נקודה של הגוף נמצאת מתחת לשתיהן, כלומר מתחת לנמוכה מהן, והנמוכה מתחלפת במקום שבו הן נפגשות
          (כמו בדוגמה 6(ה) בשיעור, שם שני חסמים על המרחק מהציר).
      - kind: step
        text: >-
          (א) הכדור: $r^2\le8$, כלומר $r\le2\sqrt2$. החרוט $z=\sqrt{x^2+y^2}$ הוא $\theta=\frac{\pi}{4}$. "מתחת לחרוט" פירושו
          רחוק יותר מציר $z$: $\theta\ge\frac{\pi}{4}$. "מעל מישור $xy$": $\theta\le\frac{\pi}{2}$. הגוף מקיף את הציר:
          $0\le\varphi<2\pi$.
      - kind: computation
        text: >-
          (ב) בגליליות החרוט הוא $z=r$ והספירה $z=\sqrt{8-r^2}$. התנאים: $0\le z\le r$ וגם $z\le\sqrt{8-r^2}$. שתי התקרות
          נפגשות כש-$r=\sqrt{8-r^2}$, כלומר $2r^2=8$, $r=2$ (ובגובה $z=2$).
      - kind: step
        text: >-
          ל-$r\le2$ החרוט נמוך יותר ($r\le\sqrt{8-r^2}$), ולכן $0\le z\le r$. ל-$2\le r\le2\sqrt2$ הספירה נמוכה יותר, ולכן
          $0\le z\le\sqrt{8-r^2}$. מעבר ל-$r=2\sqrt2$ אין נקודות בכדור. בבדיקה: ב-$r=1$ התקרות הן 1 ו-$\sqrt7$; ב-$r=2.5$
          הן $2.5$ ו-$\sqrt{1.75}\approx1.32$.
      - kind: computation
        text: >-
          (ג) בגובה $z=1$: מתחת לחרוט פירושו $r\ge1$; בתוך הכדור פירושו $r^2\le8-1=7$, כלומר $r\le\sqrt7\approx2.65$. החתך
          הוא טבעת, $1\le r\le\sqrt7$.
      - kind: computation
        text: >-
          (ד) $(2,1,1)$: $x^2+y^2+z^2=6\le8$; $z=1\ge0$; $\sqrt{x^2+y^2}=\sqrt5\approx2.24\ge1=z$, כלומר מתחת לחרוט. כל
          התנאים מתקיימים.
      - kind: check
        text: >-
          (ד) בכדוריות: $r=\sqrt6\le2\sqrt2$, והזווית מציר $z$ היא $\arccos\frac{1}{\sqrt6}\approx65.9^\circ$, בין $45^\circ$
          ל-$90^\circ$. וב-(ג): הנקודה $(2,1,1)$ בגובה 1 נמצאת במרחק $\sqrt5$ מהציר, בין 1 ל-$\sqrt7$. מעגל המפגש של
          (ב) בכדוריות: $r=2\sqrt2$, $\theta=\frac{\pi}{4}$, והגובה שלו $2\sqrt2\cos\frac{\pi}{4}=2$.
      - kind: result
        text: >-
          בכדוריות: $0\le r\le2\sqrt2$, $\frac{\pi}{4}\le\theta\le\frac{\pi}{2}$, $0\le\varphi<2\pi$. בגליליות $z$ בין 0 לבין
          הקטן מבין $r$ ו-$\sqrt{8-r^2}$, עם $0\le r\le2\sqrt2$. החתך בגובה 1 הוא הטבעת $1\le r\le\sqrt7$, והנקודה $(2,1,1)$
          ב-$E$.

  - id: W-2.4-09
    level: exam
    objectives: [OBJ-2.4-1, OBJ-2.4-2]
    prompt: >-
      הנקודה $A$ נתונה בקואורדינטות גליליות, $(r,\theta,z)=\left(3,\frac{\pi}{2},4\right)$, והנקודה $B$ בקואורדינטות
      כדוריות, $(r,\theta,\varphi)=\left(5,\frac{\pi}{2},0\right)$.

      (א) מצאו את הקואורדינטות הקרטזיות של $A$ ושל $B$.

      (ב) מהי הזווית בין וקטורי המקום של $A$ ושל $B$, ומה המרחק בין שתי הנקודות?

      (ג) כתבו את $A$ בקואורדינטות כדוריות ואת $B$ בקואורדינטות גליליות.

      (ד) האם יש משטח קואורדינטה, גלילי או כדורי, ששתי הנקודות נמצאות עליו?
    answer: >-
      (א) $A=(0,3,4)$, $B=(5,0,0)$. (ב) $\frac{\pi}{2}$; $5\sqrt2$. (ג) $A$: $\left(5,\arccos\frac45,\frac{\pi}{2}\right)$,
      עם $\arccos\frac45\approx36.9^\circ$; $B$: $(5,0,0)$. (ד) כן: הספירה $r=5$ (בכדוריות).
    solution:
      - kind: idea
        text: >-
          קודם מזהים את המערכת של כל שלישייה: באחת $\frac{\pi}{2}$ הוא אזימוט, ובאחרת זווית מציר $z$. עוברים לקרטזיות,
          שם זוויות ומרחקים מחושבים במכפלה סקלרית ובאורך של וקטור (שיעורים 1.1 ו-1.2), ורק אחר כך חוזרים למערכת
          המבוקשת.
      - kind: computation
        text: >-
          (א) $A$ גלילית: $x=3\cos\frac{\pi}{2}=0$, $y=3\sin\frac{\pi}{2}=3$, $z=4$. $B$ כדורית: $z=5\cos\frac{\pi}{2}=0$,
          המרחק מהציר $5\sin\frac{\pi}{2}=5$, ועם אזימוט 0: $x=5$, $y=0$.
      - kind: computation
        text: >-
          (ב) $\vec{OA}\cdot\vec{OB}=0\cdot5+3\cdot0+4\cdot0=0$: הווקטורים מאונכים, והזווית $\frac{\pi}{2}$. המרחק:
          $|A-B|=|(-5,3,4)|=\sqrt{25+9+16}=\sqrt{50}=5\sqrt2\approx7.07$.
      - kind: computation
        text: >-
          (ג) $A$: המרחק מהראשית $\sqrt{0+9+16}=5$; $\cos\theta=\frac45$, כלומר $\theta=\arccos\frac45\approx36.9^\circ$;
          האזימוט $\frac{\pi}{2}$ (ה-$\theta$ הגלילי שלה). $B$: על הרצפה, במרחק 5 מציר $z$, באזימוט 0 ובגובה 0:
          $(r,\theta,z)=(5,0,0)$.
      - kind: step
        text: >-
          (ד) לשתי הנקודות אותו $r$ כדורי, 5: שתיהן על הספירה $r=5$. אין משטח קואורדינטה אחר: ה-$r$ הגלילי שלהן שונה
          (3 ו-5), הגובה שונה (4 ו-0), האזימוט שונה ($\frac{\pi}{2}$ ו-0), וה-$\theta$ הכדורי שונה ($36.9^\circ$ ו-$90^\circ$).
      - kind: check
        text: >-
          שתי נקודות על ספירה ברדיוס 5 שהווקטורים אליהן מאונכים: המשולש $OAB$ ישר זווית עם ניצבים 5 ו-5, והיתר שלו
          $5\sqrt2$, כמו המרחק שיצא. שימו לב שב-$A$ המספר 3 הוא המרחק מציר $z$ ולא מהראשית.
      - kind: result
        text: >-
          $A=(0,3,4)$ ו-$B=(5,0,0)$; הזווית ביניהן $\frac{\pi}{2}$ והמרחק $5\sqrt2$; $A$ בכדוריות
          $\left(5,\arccos\frac45,\frac{\pi}{2}\right)$, $B$ בגליליות $(5,0,0)$; שתיהן על הספירה $r=5$.

  - id: W-2.4-10
    level: exam
    objectives: [OBJ-2.4-3]
    prompt: >-
      חרוז נוצר מכדור ברדיוס 2 שקדחו דרכו חור גלילי ברדיוס 1 לאורך ציר $z$: הגוף הוא $x^2+y^2+z^2\le4$,
      $x^2+y^2\ge1$.

      (א) באיזו מערכת התיאור פשוט יותר? תארו את החרוז בקואורדינטות גליליות.

      (ב) מה הגובה של החרוז (המרחק בין הנקודה הגבוהה ביותר שלו לנמוכה ביותר)?

      (ג) תארו את החרוז בקואורדינטות כדוריות.

      (ד) האם הנקודות $(1.5,\,0,\,1)$ ו-$(0,\,0,\,1.5)$ נמצאות בחרוז?
    answer: >-
      (א) $1\le r\le2$, $0\le\theta<2\pi$, $-\sqrt{4-r^2}\le z\le\sqrt{4-r^2}$. (ב) $2\sqrt3$.
      (ג) $\frac{\pi}{6}\le\theta\le\frac{5\pi}{6}$, $\frac{1}{\sin\theta}\le r\le2$, $0\le\varphi<2\pi$. (ד) הראשונה כן,
      השנייה לא (היא בתוך החור).
    solution:
      - kind: idea
        text: >-
          לחרוז שני קירות: ספירה, שהיא משטח קואורדינטה כדורי, וגליל, שהוא משטח קואורדינטה גלילי. לכן בשום מערכת לא
          כל הגבולות קבועים, וצריך לתרגם את הקיר ה"זר" בכל מערכת: הספירה בגליליות היא $r^2+z^2=4$, והגליל בכדוריות
          הוא $r\sin\theta=1$.
      - kind: computation
        text: >-
          (א) בגליליות: החור הוא $r\ge1$, והכדור $r^2+z^2\le4$, כלומר $|z|\le\sqrt{4-r^2}$, שמוגדר עד $r=2$. לכן
          $1\le r\le2$, $0\le\theta<2\pi$, $-\sqrt{4-r^2}\le z\le\sqrt{4-r^2}$. הגבולות של $r$ ושל $\theta$ קבועים, ורק
          $z$ תלוי ב-$r$.
      - kind: computation
        text: >-
          (ב) הגובה $\sqrt{4-r^2}$ הגדול ביותר מתקבל ב-$r$ הקטן ביותר שמותר, $r=1$, על שפת החור: $z=\pm\sqrt3$. גובה
          החרוז $2\sqrt3\approx3.46$, פחות מקוטר הכדור, 4, כי הקידוח הסיר את שתי הכיפות.
      - kind: computation
        text: >-
          (ג) בכדוריות $r$ הוא מעכשיו המרחק מהראשית. הכדור הוא $r\le2$. "מחוץ לחור" פירושו שהמרחק מציר $z$ לפחות
          1: $r\sin\theta\ge1$, כלומר $r\ge\frac{1}{\sin\theta}$ (הגליל הוא קיר זר, כמו בסעיף הגופים בשיעור). יש $r$
          כזה בין $\frac{1}{\sin\theta}$ ל-2 רק כש-$\frac{1}{\sin\theta}\le2$, כלומר $\sin\theta\ge\frac12$. בקטע
          $0\le\theta\le\pi$ הסינוס עולה מ-0 ל-1 ויורד חזרה ל-0, והוא שווה $\frac12$ ב-$\frac{\pi}{6}$ וב-$\frac{5\pi}{6}$;
          בין שתי הזוויות האלה הוא גדול מ-$\frac12$. לכן $\frac{\pi}{6}\le\theta\le\frac{5\pi}{6}$. האזימוט חופשי.
      - kind: computation
        text: >-
          (ד) $(1.5,0,1)$: המרחק מהציר $1.5\ge1$, ו-$x^2+y^2+z^2=3.25\le4$: בחרוז. $(0,0,1.5)$: המרחק מהציר 0, קטן מ-1:
          בתוך החור, לא בחרוז, אף שהיא בתוך הכדור.
      - kind: check
        text: >-
          הפינה העליונה של החרוז בכדוריות: $r=2$, $\theta=\frac{\pi}{6}$. המרחק שלה מהציר $2\sin\frac{\pi}{6}=1$ והגובה
          $2\cos\frac{\pi}{6}=\sqrt3$, כמו ב-(ב). ועל מישור $xy$, $\theta=\frac{\pi}{2}$: $1\le r\le2$, כמו בגליליות בגובה 0.
      - kind: result
        text: >-
          גליליות: $1\le r\le2$, $0\le\theta<2\pi$, $|z|\le\sqrt{4-r^2}$. כדוריות: $\frac{\pi}{6}\le\theta\le\frac{5\pi}{6}$,
          $\frac{1}{\sin\theta}\le r\le2$, $0\le\varphi<2\pi$. גובה החרוז $2\sqrt3$; $(1.5,0,1)$ בחרוז ו-$(0,0,1.5)$ לא.

challenge:
  - id: W-2.4-c1
    stars: 1
    objectives: [OBJ-2.4-1, OBJ-2.4-2]
    prompt: >-
      טורוס הוא משטח בצורת כעך: מעגל ברדיוס $a$, שהמרכז שלו במרחק $R$ מציר $z$, מסתובב סביב ציר $z$ ($R\ge a>0$).
      המשוואה הקרטזית שלו היא

      $$
      \left(x^2+y^2+z^2+R^2-a^2\right)^2=4R^2\left(x^2+y^2\right).
      $$

      (א) כתבו את המשוואה בקואורדינטות כדוריות $(r,\theta,\varphi)$ של הקורס.

      (ב) הראו שכאשר $a=R$ (כעך שהחור שלו נסגר לנקודה) המשוואה הופכת ל-$r=2R\sin\theta$.

      (ג) במקרה $a=R$: איזה עקום המשטח חותך בחצי מישור $\varphi=c$? השתמשו בכך ש-$r\sin\theta$ הוא המרחק מציר
      $z$ ו-$r\cos\theta$ הגובה, והשוו לעקום $r=2\sin\theta$ משיעור 2.3.
    answer: >-
      (א) $\left(r^2+R^2-a^2\right)^2=4R^2r^2\sin^2\theta$. (ב) עם $a=R$: $r^4=4R^2r^2\sin^2\theta$, ולכן $r=2R\sin\theta$.
      (ג) מעגל ברדיוס $R$ שהמרכז שלו בגובה 0 ובמרחק $R$ מציר $z$, והוא נוגע בציר $z$ בראשית.
    solution:
      - kind: idea
        text: >-
          במשוואה מופיעים רק שני צירופים, $x^2+y^2+z^2$ ו-$x^2+y^2$, ולשניהם יש תרגום מיידי לכדוריות: ריבוע המרחק
          מהראשית הוא $r^2$, וריבוע המרחק מציר $z$ הוא $r^2\sin^2\theta$. האזימוט $\varphi$ אינו מופיע בכלל: המשטח נראה
          אותו דבר מכל צד של ציר $z$, כי הוא נוצר מסיבוב סביבו.
      - kind: computation
        text: >-
          (א) מציבים $x^2+y^2+z^2=r^2$ ו-$x^2+y^2=r^2\sin^2\theta$:
          $\left(r^2+R^2-a^2\right)^2=4R^2r^2\sin^2\theta$.
      - kind: computation
        text: >-
          (ב) עם $a=R$ הסוגריים הם $r^2$: $r^4=4R^2r^2\sin^2\theta$. חוץ מהראשית $r\ne0$, ומחלקים ב-$r^2$:
          $r^2=4R^2\sin^2\theta$. בקטע $0\le\theta\le\pi$ מתקיים $\sin\theta\ge0$, וגם $r\ge0$, ולכן אפשר להוציא שורש בלי
          ערך מוחלט: $r=2R\sin\theta$. (הראשית עצמה מתקבלת ב-$\theta=0$, ולכן לא איבדנו אותה.)
      - kind: step
        text: >-
          (ג) בחצי מישור $\varphi=c$ מודדים כל נקודה בשני מספרים: המרחק שלה מציר $z$, שנסמן $u=r\sin\theta$, והגובה
          $z=r\cos\theta$. אז $u^2+z^2=r^2$. כופלים את $r=2R\sin\theta$ ב-$r$: $r^2=2R\,r\sin\theta$, כלומר
          $u^2+z^2=2Ru$.
      - kind: computation
        text: >-
          משלימים לריבוע: $u^2-2Ru+R^2+z^2=R^2$, כלומר $(u-R)^2+z^2=R^2$. זה מעגל ברדיוס $R$ שהמרכז שלו ב-$u=R$,
          $z=0$: הוא נוגע בציר $z$ ($u=0$) בראשית, ומגיע עד $u=2R$. זה בדיוק המעגל המסתובב שבהגדרה, עם $a=R$.
      - kind: step
        text: >-
          ההשוואה לשיעור 2.3: שם $r=2\sin\theta$ היה מעגל ברדיוס 1 שעובר דרך הראשית, ושם כפלנו ב-$r$ באותו אופן. כאן
          אותו חישוב קורה בכל חצי מישור שמכיל את ציר $z$, עם הזווית מציר $z$ בתפקיד הזווית הקוטבית.
      - kind: check
        text: >-
          הנקודה $(2R,0,0)$: בכדוריות $\theta=\frac{\pi}{2}$ ו-$r=2R\sin\frac{\pi}{2}=2R$; במשוואה הקרטזית עם $a=R$:
          $(4R^2)^2=16R^4=4R^2\cdot4R^2$. הנקודה $(R,0,R)$, ראש המעגל: $(2R^2)^2=4R^4=4R^2\cdot R^2$. ובמקרה הכללי
          הנקודה $(R+a,0,0)$: $\left((R+a)^2+R^2-a^2\right)^2=\left(2R(R+a)\right)^2=4R^2(R+a)^2$.
      - kind: result
        text: >-
          בכדוריות הטורוס הוא $\left(r^2+R^2-a^2\right)^2=4R^2r^2\sin^2\theta$; כש-$a=R$ זה $r=2R\sin\theta$, ובכל חצי
          מישור $\varphi=c$ החתך הוא המעגל $(u-R)^2+z^2=R^2$ שנוגע בציר $z$ בראשית.
    source:
      name: 'OpenStax, Calculus Volume 3 (G. Strang, E. Herman), Section 2.7 Cylindrical and Spherical Coordinates'
      year: 2016
      problem: 'Exercise 421'
      url: https://openstax.org/books/calculus-volume-3/pages/2-7-cylindrical-and-spherical-coordinates
      verified: '2026-11-18'
      adapted: true

  - id: W-2.4-c2
    stars: 1
    objectives: [OBJ-2.4-2, OBJ-2.4-1]
    prompt: >-
      שתי משוואות בקואורדינטות כדוריות $(r,\theta,\varphi)$ של הקורס. תרגמו כל אחת לקואורדינטות קרטזיות וזהו את
      המשטח.

      (א) $r=-2\sin\theta\cos\varphi$.

      (ב) $\dfrac{1}{\sin\theta}=2\cos\varphi+4\sin\varphi$. רמז לזיהוי: אגף ימין של המשוואה הקרטזית הוא מכפלה
      סקלרית של וקטור המקום בווקטור קבוע.
    answer: >-
      (א) $(x+1)^2+y^2+z^2=1$: ספירה ברדיוס 1 שמרכזה $(-1,0,0)$, והיא עוברת דרך הראשית. (ב)
      $\sqrt{x^2+y^2+z^2}=2x+4y$: חרוט (צד אחד, לא חרוט כפול) שהקודקוד שלו בראשית, הציר שלו בכיוון $(1,2,0)$,
      והזווית בין הציר לדופן היא $\arccos\frac{1}{2\sqrt5}\approx77.1^\circ$.
    solution:
      - kind: idea
        text: >-
          כדי לתרגם מכדוריות לקרטזיות מחפשים את הצירופים $r\sin\theta\cos\varphi=x$, $r\sin\theta\sin\varphi=y$,
          $r\cos\theta=z$ ו-$r^2=x^2+y^2+z^2$. אם הם אינם מופיעים, כופלים את המשוואה במה שחסר, בדרך כלל ב-$r$ או
          ב-$r\sin\theta$, כמו שכפלנו ב-$r$ בעקומים הקוטביים של שיעור 2.3.
      - kind: computation
        text: >-
          (א) כופלים ב-$r$: $r^2=-2\,r\sin\theta\cos\varphi$, כלומר $x^2+y^2+z^2=-2x$. מעבירים אגף ומשלימים לריבוע:
          $x^2+2x+1+y^2+z^2=1$, כלומר $(x+1)^2+y^2+z^2=1$.
      - kind: step
        text: >-
          זו ספירה ברדיוס 1 שמרכזה $(-1,0,0)$. הכפל ב-$r$ יכול להוסיף רק את הנקודה $r=0$, והראשית ממילא על המשטח
          (למשל ב-$\theta=0$). מאחר ש-$r\ge0$ ו-$\sin\theta\ge0$, יש נקודות רק כש-$\cos\varphi\le0$, כלומר בצד $x\le0$: שם
          אכן נמצאת הספירה כולה.
      - kind: computation
        text: >-
          (ב) כופלים את שני האגפים ב-$r\sin\theta$: באגף שמאל נשאר $r$, ובאגף ימין
          $2\,r\sin\theta\cos\varphi+4\,r\sin\theta\sin\varphi=2x+4y$. לכן $\sqrt{x^2+y^2+z^2}=2x+4y$.
      - kind: step
        text: >-
          זיהוי: נסמן $\vec p=(x,y,z)$ ו-$\vec w=(2,4,0)$. המשוואה היא $|\vec p|=\vec p\cdot\vec w$. לפי שיעור 1.2,
          $\vec p\cdot\vec w=|\vec p|\,|\vec w|\cos\alpha$, כש-$\alpha$ הזווית בין $\vec p$ ל-$\vec w$. מצמצמים ב-$|\vec p|$
          (חוץ מהראשית) ומקבלים $\cos\alpha=\frac{1}{|\vec w|}=\frac{1}{\sqrt{20}}=\frac{1}{2\sqrt5}$.
      - kind: step
        text: >-
          כלומר המשטח הוא כל הנקודות שווקטור המקום שלהן יוצר זווית קבועה, $\alpha=\arccos\frac{1}{2\sqrt5}\approx77.1^\circ$,
          עם הכיוון $(2,4,0)$, שהוא הכיוון של $(1,2,0)$. זה חרוט, בדיוק כמו $\theta=c$, רק שהציר שלו אינו ציר $z$
          אלא הקרן שבכיוון $(1,2,0)$. כמו $\theta=c$, זה צד אחד בלבד ולא חרוט כפול: רק הצד שבו $2x+4y\ge0$.
      - kind: check
        text: >-
          (א) הנקודה $\theta=\frac{\pi}{2}$, $\varphi=\pi$: $r=-2\cdot1\cdot(-1)=2$, כלומר $(-2,0,0)$, ואכן $(-2+1)^2=1$.
          הנקודה $\theta=\frac{\pi}{4}$, $\varphi=\pi$: $r=\sqrt2$, כלומר $(-1,0,1)$, ואכן $0+0+1=1$. (ב) הנקודה
          $(1,0,\sqrt3)$: $\sqrt{1+0+3}=2$ ו-$2\cdot1+4\cdot0=2$. נקודה על הציר עצמו, $(1,2,0)$, אינה על המשטח:
          $\sqrt5\ne10$.
      - kind: result
        text: >-
          (א) הספירה $(x+1)^2+y^2+z^2=1$. (ב) $\sqrt{x^2+y^2+z^2}=2x+4y$: חרוט סביב הכיוון $(1,2,0)$, שהזווית בין
          הדופן שלו לבין הציר שלו היא $\arccos\frac{1}{2\sqrt5}$.
    source:
      name: "Paul's Online Notes (P. Dawkins), Calculus III, Section 12.13 Spherical Coordinates, Practice Problems"
      year: 2026
      problem: 'Practice problems 6 and 8'
      url: https://tutorial.math.lamar.edu/Problems/CalcIII/SphericalCoords.aspx
      verified: '2026-11-18'
      adapted: true
