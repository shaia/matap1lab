# Workbook of lesson 2.2 — parabola and hyperbolas.
# Objectives (src/course.ts):
#   OBJ-2.2-1  sketch the basic parabola and the hyperbolas xy = c and x^2 - y^2 = c
#   OBJ-2.2-2  identify a conic by its equation, completing the square when needed
#   OBJ-2.2-3  asymptotes of a hyperbola, and a parametrisation of each curve
# Every number recomputed with sympy in screens/tools/lesson-2-2.py.
lesson: '2.2'
practice:
  - id: W-2.2-01
    level: basic
    objectives: [OBJ-2.2-1, OBJ-2.2-3]
    prompt: >-
      נתונה הפרבולה $y=\frac12x^2-2$.

      (א) מצאו את הקודקוד שלה ואת הכיוון שאליו היא נפתחת. האם היא צרה או רחבה מהפרבולה הבסיסית $y=x^2$?

      (ב) היכן היא חותכת את הצירים?

      (ג) כתבו לה פרמטריזציה, ומצאו את ערך הפרמטר שנותן את נקודת החיתוך השמאלית עם ציר $x$.
    answer: >-
      (א) קודקוד $(0,-2)$, נפתחת כלפי מעלה, רחבה מהבסיסית. (ב) את ציר $y$ ב-$(0,-2)$ ואת ציר $x$ ב-$(\pm2,0)$.
      (ג) $(x,y)=\left(t,\frac12t^2-2\right)$, $t\in\mathbb{R}$; הנקודה $(-2,0)$ מתקבלת מ-$t=-2$.
    solution:
      - kind: idea
        text: >-
          המשוואה כבר בצורה $y=a(x-h)^2+k$, עם $a=\frac12$, $h=0$ ו-$k=-2$: אין מה להשלים לריבוע, רק לקרוא. מהפרבולה
          הבסיסית הגענו לכאן בשני צעדים: כל הגבהים הוכפלו ב-$\frac12$, והכול ירד ב-2.
      - kind: step
        text: >-
          (א) הקודקוד הוא $(h,k)=(0,-2)$. $a=\frac12>0$, ולכן הפרבולה נפתחת כלפי מעלה, והקודקוד הוא הנקודה הנמוכה
          ביותר. $|a|<1$, ולכן היא רחבה מ-$y=x^2$: ב-$x=2$ הפרבולה הבסיסית כבר בגובה 4 מעל הקודקוד שלה, וזו רק בגובה
          $\frac12\cdot4=2$ מעל הקודקוד שלה.
      - kind: computation
        text: >-
          (ב) ציר $y$: מציבים $x=0$ ומקבלים $y=-2$, זה הקודקוד עצמו. ציר $x$: מציבים $y=0$: $\frac12x^2=2$, כלומר
          $x^2=4$ ו-$x=\pm2$.
      - kind: computation
        text: >-
          (ג) $x$ קובע את הנקודה, ולכן הוא הפרמטר: $(x,y)=\left(t,\frac12t^2-2\right)$, $t\in\mathbb{R}$. נקודת החיתוך
          השמאלית היא $(-2,0)$, והיא מתקבלת מ-$t=-2$.
      - kind: check
        text: >-
          ב-$t=-2$: $\frac12\cdot4-2=0$. סימטריה: הנקודות $(4,6)$ ו-$(-4,6)$ שתיהן על הפרבולה, כי $\frac12\cdot16-2=6$.
      - kind: result
        text: >-
          קודקוד $(0,-2)$, נפתחת כלפי מעלה ורחבה מהבסיסית; חותכת את ציר $x$ ב-$(\pm2,0)$; פרמטריזציה
          $\left(t,\frac12t^2-2\right)$, ו-$(-2,0)$ מתקבלת מ-$t=-2$.

  - id: W-2.2-02
    level: basic
    qualitative: true
    objectives: [OBJ-2.2-1]
    prompt: >-
      לכל אחת מארבע ההיפרבולות קבעו, בלי לשרטט: באילו רביעים של המישור יש לה נקודות, ואילו צירים היא חותכת (והיכן).

      (א) $xy=3$

      (ב) $xy=-3$

      (ג) $x^2-y^2=5$

      (ד) $y^2-x^2=5$
    answer: >-
      (א) רביעים ראשון ושלישי, אינה חותכת אף ציר. (ב) רביעים שני ורביעי, אינה חותכת אף ציר. (ג) כל ארבעת הרביעים,
      חותכת רק את ציר $x$, ב-$(\pm\sqrt5,0)$. (ד) כל ארבעת הרביעים, חותכת רק את ציר $y$, ב-$(0,\pm\sqrt5)$.
    solution:
      - kind: idea
        text: >-
          ב-$xy=c$ הסימן של $c$ קובע אם $x$ ו-$y$ באותו סימן או בסימנים הפוכים, וזה קובע את הרביעים. ב-$x^2-y^2=c$
          מציבים $x=0$ ואחר כך $y=0$, ורואים לאיזו הצבה יש פתרון.
      - kind: step
        text: >-
          (א) המכפלה חיובית: $x$ ו-$y$ באותו סימן, ולכן הנקודות ברביע הראשון (שניהם חיוביים) וברביע השלישי (שניהם
          שליליים). אם $x=0$ או $y=0$ המכפלה היא 0 ולא 3, ולכן אין חיתוך עם הצירים.
      - kind: step
        text: >-
          (ב) המכפלה שלילית: הסימנים הפוכים, ולכן הנקודות ברביע השני ($x<0<y$) וברביע הרביעי ($y<0<x$). שוב אין
          חיתוך עם הצירים.
      - kind: computation
        text: >-
          (ג) $y=0$ נותן $x^2=5$, כלומר $x=\pm\sqrt5\approx\pm2.236$. $x=0$ נותן $-y^2=5$, בלי פתרון. הענפים נפתחים
          ימינה ושמאלה. כל ענף נמשך גם למעלה וגם למטה, ולכן יש נקודות בכל ארבעת הרביעים: למשל $(3,2)$, $(3,-2)$,
          $(-3,2)$ ו-$(-3,-2)$, כי $9-4=5$.
      - kind: computation
        text: >-
          (ד) התפקידים מתחלפים: $x=0$ נותן $y=\pm\sqrt5$, ו-$y=0$ נותן $-x^2=5$, בלי פתרון. הענפים נפתחים למעלה
          ולמטה, ושוב יש נקודות בכל ארבעת הרביעים: $(2,3)$, $(-2,3)$, $(2,-3)$, $(-2,-3)$.
      - kind: check
        text: >-
          נקודה אחת מכל עקום: $(1,3)$ על (א) וברביע הראשון; $(1,-3)$ על (ב) וברביע הרביעי. שימו לב להבדל בין שני
          הסוגים: ב-$xy=c$ כל ענף נמצא כולו ברביע אחד, וב-$x^2-y^2=c$ כל ענף עובר בשני רביעים.
      - kind: result
        text: >-
          (א) רביעים ראשון ושלישי; (ב) שני ורביעי; שתיהן אינן חותכות את הצירים. (ג) ארבעת הרביעים, חותכת את ציר $x$
          ב-$(\pm\sqrt5,0)$; (ד) ארבעת הרביעים, חותכת את ציר $y$ ב-$(0,\pm\sqrt5)$.

  - id: W-2.2-03
    level: basic
    objectives: [OBJ-2.2-3]
    prompt: >-
      לכל אחת מההיפרבולות מצאו את הקודקודים ואת משוואות האסימפטוטות.

      (א) $\dfrac{x^2}{25}-\dfrac{y^2}{4}=1$

      (ב) $\dfrac{y^2}{9}-\dfrac{x^2}{16}=1$
    answer: >-
      (א) קודקודים $(\pm5,0)$, אסימפטוטות $y=\pm\frac25x$. (ב) קודקודים $(0,\pm3)$, אסימפטוטות $y=\pm\frac34x$.
    solution:
      - kind: idea
        text: >-
          הקודקודים נמצאים על הציר של המשתנה שהריבוע שלו בא עם פלוס. את האסימפטוטות מקבלים כשמחליפים את ה-1 שבאגף
          ימין ב-0 ופותרים עבור $y$; כך אין צורך לזכור איזה מספר במונה של השיפוע.
      - kind: computation
        text: >-
          (א) הפלוס ליד $x^2$. $y=0$ נותן $x^2=25$: הקודקודים $(\pm5,0)$. האסימפטוטות: $\frac{x^2}{25}=\frac{y^2}{4}$,
          כלומר $y^2=\frac{4}{25}x^2$ ו-$y=\pm\frac25x$.
      - kind: computation
        text: >-
          (ב) הפלוס ליד $y^2$. $x=0$ נותן $y^2=9$: הקודקודים $(0,\pm3)$, והענפים נפתחים למעלה ולמטה. האסימפטוטות:
          $\frac{y^2}{9}=\frac{x^2}{16}$, כלומר $y^2=\frac{9}{16}x^2$ ו-$y=\pm\frac34x$.
      - kind: step
        text: >-
          בשני המקרים השיפוע הוא (חצי הגובה של המלבן) חלקי (חצי הרוחב שלו): ב-(א) המלבן משתרע 5 לכל צד בכיוון $x$
          ו-2 לכל צד בכיוון $y$; ב-(ב) 4 לכל צד בכיוון $x$ ו-3 לכל צד בכיוון $y$.
      - kind: check
        text: >-
          רחוק מהמרכז העקום צריך להיות קרוב לאסימפטוטה. ב-(א), ב-$x=50$: $\frac{y^2}{4}=100-1=99$, ולכן
          $y=2\sqrt{99}\approx19.90$, והאסימפטוטה שם בגובה $\frac25\cdot50=20$.
      - kind: result
        text: >-
          (א) קודקודים $(\pm5,0)$ ואסימפטוטות $y=\pm\frac25x$; (ב) קודקודים $(0,\pm3)$ ואסימפטוטות $y=\pm\frac34x$.

  - id: W-2.2-04
    level: mid
    objectives: [OBJ-2.2-2]
    prompt: >-
      זהו כל אחד מהעקומים, ומצאו את המספרים שלו (מרכז וחצאי צירים, או קודקוד וכיוון).

      (א) $4x^2+y^2+8x-6y+9=0$

      (ב) $y^2-4y-4x=0$
    answer: >-
      (א) אליפסה שמרכזה $(-1,3)$, עם חצי ציר 1 בכיוון $x$ וחצי ציר 2 בכיוון $y$: $(x+1)^2+\frac{(y-3)^2}{4}=1$.
      (ב) פרבולה אופקית שנפתחת ימינה, עם קודקוד $(-1,2)$: $x=\frac14(y-2)^2-1$.
    solution:
      - kind: idea
        text: >-
          קודם ממיינים לפי הריבועים: ב-(א) המקדמים של $x^2$ ושל $y^2$ באותו סימן (משפחת האליפסה), וב-(ב) יש רק $y^2$
          (משפחת הפרבולה). אחר כך משלימים לריבוע כדי למצוא לאן העקום הוזז, ובודקים את אגף ימין.
      - kind: computation
        text: >-
          (א) מקבצים: $4(x^2+2x)+(y^2-6y)+9=0$. משלימים: $x^2+2x=(x+1)^2-1$, והפיצוי מוכפל ב-4; $y^2-6y=(y-3)^2-9$.
          מקבלים $4(x+1)^2-4+(y-3)^2-9+9=0$.
      - kind: computation
        text: >-
          מעבירים את הקבוע: $4(x+1)^2+(y-3)^2=4$. אגף ימין חיובי, כמו הריבועים, ולכן זו אליפסה. מחלקים ב-4:
          $(x+1)^2+\frac{(y-3)^2}{4}=1$.
      - kind: step
        text: >-
          קוראים: המרכז $(-1,3)$. מתחת ל-$(x+1)^2$ המכנה הוא 1, ולכן חצי הציר בכיוון $x$ הוא 1; מתחת ל-$(y-3)^2$
          המכנה 4, ולכן חצי הציר בכיוון $y$ הוא 2. האליפסה גבוהה יותר מרחבה, אף שהמקדם הגדול במשוואה המקורית היה
          ליד $x^2$.
      - kind: computation
        text: >-
          (ב) משלימים לריבוע רק את $y$: $(y-2)^2-4-4x=0$, כלומר $4x=(y-2)^2-4$ ו-$x=\frac14(y-2)^2-1$. זו פרבולה
          אופקית, $x=a(y-k)^2+h$ עם $a=\frac14$: הקודקוד $(h,k)=(-1,2)$, והיא נפתחת ימינה כי $a>0$.
      - kind: check
        text: >-
          (א) ארבע הנקודות הקיצוניות של האליפסה, $(0,3)$, $(-2,3)$, $(-1,5)$ ו-$(-1,1)$, מקיימות את המשוואה המקורית;
          למשל $(0,3)$: $0+9+0-18+9=0$. (ב) הפרבולה חותכת את ציר $y$ כש-$y^2-4y=0$, כלומר ב-$y=0$ וב-$y=4$: שתי
          נקודות סימטריות ביחס לציר הסימטריה $y=2$.
      - kind: result
        text: >-
          (א) אליפסה, מרכז $(-1,3)$, חצאי צירים 1 (בכיוון $x$) ו-2 (בכיוון $y$). (ב) פרבולה אופקית שנפתחת ימינה,
          קודקוד $(-1,2)$.

  - id: W-2.2-05
    level: mid
    objectives: [OBJ-2.2-2, OBJ-2.2-3]
    prompt: >-
      נתונה המשוואה $y^2-4x^2-2y-16x-19=0$.

      (א) הראו שזו היפרבולה, ומצאו את המרכז שלה.

      (ב) לאן הענפים נפתחים, והיכן הקודקודים?

      (ג) מצאו את משוואות האסימפטוטות.
    answer: >-
      (א) $\frac{(y-1)^2}{4}-(x+2)^2=1$, מרכז $(-2,1)$. (ב) למעלה ולמטה; קודקודים $(-2,3)$ ו-$(-2,-1)$.
      (ג) $y-1=\pm2(x+2)$, כלומר $y=2x+5$ ו-$y=-2x-3$.
    solution:
      - kind: idea
        text: >-
          המקדמים של $y^2$ ושל $x^2$ הם 1 ו-$-4$, בסימנים שונים: משפחת ההיפרבולה. משלימים לריבוע כל משתנה בנפרד, עם
          תשומת לב לפיצוי של $x$, שמוכפל ב-$-4$. הסימן של אגף ימין יקבע איזה ריבוע בא עם פלוס, ומכאן הכיוון.
      - kind: computation
        text: >-
          (א) מקבצים: $(y^2-2y)-4(x^2+4x)-19=0$. משלימים: $y^2-2y=(y-1)^2-1$ ו-$x^2+4x=(x+2)^2-4$, והפיצוי של $x$
          הוא $-4\cdot(-4)=+16$. מקבלים $(y-1)^2-1-4(x+2)^2+16-19=0$.
      - kind: computation
        text: >-
          הקבוע: $-1+16-19=-4$. לכן $(y-1)^2-4(x+2)^2=4$. אגף ימין שונה מ-0: היפרבולה. מחלקים ב-4:
          $\frac{(y-1)^2}{4}-(x+2)^2=1$. המרכז הוא הנקודה שבה שני הסוגריים מתאפסים: $(-2,1)$.
      - kind: step
        text: >-
          (ב) הריבוע שבא עם פלוס הוא של $y$, ולכן הענפים נפתחים למעלה ולמטה. המכנה שמתחתיו הוא 4, ולכן $b=2$:
          הקודקודים נמצאים 2 יחידות מעל המרכז ומתחתיו, $(-2,3)$ ו-$(-2,-1)$. בכיוון $x$ המכנה 1, ולכן $a=1$.
      - kind: computation
        text: >-
          (ג) מחליפים את ה-1 ב-0: $\frac{(y-1)^2}{4}=(x+2)^2$, כלומר $y-1=\pm2(x+2)$. שתי האסימפטוטות: $y=2x+5$
          ו-$y=-2x-3$. שתיהן עוברות דרך המרכז, והשיפוע $\frac{b}{a}=\frac21$.
      - kind: check
        text: >-
          במשוואה המקורית, עם $x=-2$: $y^2-16-2y+32-19=y^2-2y-3=0$, והפתרונות $y=3$ ו-$y=-1$, שני הקודקודים. ועם
          $y=1$: $1-4x^2-2-16x-19=0$, כלומר $4x^2+16x+20=0$, בלי פתרונות: הישר האופקי דרך המרכז אינו פוגש את
          ההיפרבולה, כמו שצריך להיות כשהענפים נפתחים למעלה ולמטה.
      - kind: result
        text: >-
          היפרבולה $\frac{(y-1)^2}{4}-(x+2)^2=1$: מרכז $(-2,1)$, נפתחת למעלה ולמטה, קודקודים $(-2,3)$ ו-$(-2,-1)$,
          אסימפטוטות $y=2x+5$ ו-$y=-2x-3$.

  - id: W-2.2-06
    level: mid
    objectives: [OBJ-2.2-3]
    prompt: >-
      כתבו פרמטריזציה לכל אחד מהעקומים, וציינו את התחום של הפרמטר.

      (א) הפרבולה $x=2y^2-1$.

      (ב) הענף של ההיפרבולה $xy=-6$ שנמצא ברביע הרביעי.

      (ג) הענף **העליון** של ההיפרבולה $\dfrac{y^2}{4}-\dfrac{x^2}{9}=1$, בפרמטריזציה שבה $x=3u$. מצאו גם את הנקודה
      שמתאימה ל-$u=\frac43$.
    answer: >-
      (א) $(x,y)=(2t^2-1,\;t)$, $t\in\mathbb{R}$. (ב) $(x,y)=\left(t,-\frac6t\right)$, $t>0$.
      (ג) $(x,y)=\left(3u,\;2\sqrt{1+u^2}\right)$, $u\in\mathbb{R}$; ב-$u=\frac43$ הנקודה $\left(4,\frac{10}{3}\right)$.
    solution:
      - kind: idea
        text: >-
          בכל עקום בוחרים בתור הפרמטר את הקואורדינטה שקובעת את הנקודה באופן יחיד, ומחלצים את הקואורדינטה השנייה
          מהמשוואה. בפרבולה אופקית זו $y$; ב-$xy=c$ זו $x$; בהיפרבולה שנפתחת למעלה ולמטה זו $x$, והסימן של השורש
          בוחר את הענף. ב-(ג) מודדים את $x$ ביחידות של $a=3$, כמו בשיעור, כדי שלא יישאר שבר בתוך השורש.
      - kind: step
        text: >-
          (א) הריבוע הוא של $y$, ולכן $y$ קובע את $x$: $y=t$ ו-$x=2t^2-1$. $(x,y)=(2t^2-1,\;t)$, $t\in\mathbb{R}$.
          כש-$t=0$ מתקבל הקודקוד $(-1,0)$.
      - kind: step
        text: >-
          (ב) $x=t$ ו-$y=-\frac6t$. ברביע הרביעי $x>0$, ולכן $t>0$: $(x,y)=\left(t,-\frac6t\right)$, $t>0$. (עם $t<0$
          אותה נוסחה נותנת את הענף שברביע השני.)
      - kind: computation
        text: >-
          (ג) כותבים $x=3u$, מציבים: $\frac{y^2}{4}=1+\frac{9u^2}{9}=1+u^2$, ולכן $y=\pm2\sqrt{1+u^2}$. בענף העליון
          $y>0$: $(x,y)=\left(3u,\;2\sqrt{1+u^2}\right)$, $u\in\mathbb{R}$.
      - kind: computation
        text: >-
          ב-$u=\frac43$: $x=4$, ו-$\sqrt{1+\frac{16}{9}}=\sqrt{\frac{25}{9}}=\frac53$, ולכן $y=\frac{10}{3}$. הנקודה
          $\left(4,\frac{10}{3}\right)$.
      - kind: check
        text: >-
          (א) ב-$t=-1$ מתקבלת $(1,-1)$, ואכן $2\cdot1-1=1$. (ב) ב-$t=2$ מתקבלת $(2,-3)$, ברביע הרביעי, ו-$2\cdot(-3)=-6$.
          (ג) $\frac{(10/3)^2}{4}-\frac{16}{9}=\frac{25}{9}-\frac{16}{9}=1$. בכל שלוש הפרמטריזציות הפרמטר עובר על
          כל הערכים שהקואורדינטה המתאימה מקבלת על העקום, ולכן אף נקודה אינה חסרה.
      - kind: result
        text: >-
          (א) $(2t^2-1,\;t)$, $t\in\mathbb{R}$; (ב) $\left(t,-\frac6t\right)$, $t>0$; (ג) $\left(3u,\;2\sqrt{1+u^2}\right)$,
          $u\in\mathbb{R}$, והנקודה ב-$u=\frac43$ היא $\left(4,\frac{10}{3}\right)$.

  - id: W-2.2-07
    level: mid
    qualitative: true
    objectives: [OBJ-2.2-3, OBJ-2.2-1]
    prompt: >-
      כל אחת מהנוסחאות הבאות נותנת, לכל $t\in\mathbb{R}$, נקודה במישור. אילו מהן הן פרמטריזציה של הפרבולה $y=x^2$
      **כולה**? למי שאינה, כתבו איזה חלק של הפרבולה היא מכסה.

      (א) $(-t,\;t^2)$

      (ב) $(t^3,\;t^6)$

      (ג) $(\sin t,\;\sin^2t)$

      (ד) $(e^t,\;e^{2t})$

      (ה) $(2t,\;4t^2)$
    answer: >-
      (א), (ב) ו-(ה) מכסות את כל הפרבולה. (ג) מכסה רק את הקשת שבה $-1\le x\le1$. (ד) מכסה רק את החצי שבו $x>0$,
      בלי הקודקוד.
    solution:
      - kind: idea
        text: >-
          שתי בדיקות. הראשונה: האם כל נקודה שהנוסחה נותנת נמצאת על הפרבולה, כלומר האם הקואורדינטה השנייה היא הריבוע
          של הראשונה. השנייה, זו שמכריעה כאן: אילו ערכים מקבלת הקואורדינטה הראשונה כש-$t$ עובר על כל המספרים.
          הפרבולה כולה מתקבלת בדיוק כשהיא מקבלת **כל** ערך ממשי.
      - kind: step
        text: >-
          הבדיקה הראשונה מצליחה בכל החמש: $(-t)^2=t^2$, $(t^3)^2=t^6$, $(\sin t)^2=\sin^2t$, $(e^t)^2=e^{2t}$ ו-
          $(2t)^2=4t^2$. כל הנקודות על הפרבולה.
      - kind: step
        text: >-
          (א) $x=-t$ מקבל כל ערך ממשי: כל הפרבולה, רק שהנקודה נעה עליה מימין לשמאל. (ה) $x=2t$ מקבל כל ערך ממשי: כל
          הפרבולה, במהירות כפולה. (ב) $x=t^3$ מקבל כל ערך ממשי, כי לכל מספר יש שורש שלישי: כל הפרבולה.
      - kind: step
        text: >-
          (ג) $x=\sin t$ מקבל רק ערכים בין $-1$ ל-1. הנקודה נעה הלוך ושוב על הקשת שבין $(-1,1)$ ל-$(1,1)$, דרך
          הקודקוד, ולעולם אינה יוצאת ממנה. הנקודה $(2,4)$ שעל הפרבולה אינה מתקבלת.
      - kind: step
        text: >-
          (ד) $x=e^t$ מקבל רק ערכים חיוביים, וכל ערך חיובי. מתקבל החצי הימני של הפרבולה בלי הקודקוד: $x>0$. הנקודה
          $(-1,1)$ אינה מתקבלת, וגם לא $(0,0)$.
      - kind: check
        text: >-
          מנסים להגיע לנקודה $(-1,1)$ בכל נוסחה: ב-(א) $t=1$; ב-(ב) $t=-1$; ב-(ג) $t=\frac{3\pi}{2}$; ב-(ה)
          $t=-\frac12$; ב-(ד) צריך $e^t=-1$, ואין $t$ כזה. ומנסים להגיע ל-$(2,4)$: ב-(ד) $t=\ln2$, וב-(ג) צריך
          $\sin t=2$, ואין $t$ כזה.
      - kind: result
        text: >-
          כל הפרבולה: (א), (ב), (ה). רק הקשת $-1\le x\le1$: (ג). רק החצי $x>0$: (ד). לבדוק שהנקודות על העקום אינו
          מספיק; צריך לבדוק גם אילו ערכים מקבלת כל קואורדינטה.

  - id: W-2.2-08
    level: exam
    objectives: [OBJ-2.2-2, OBJ-2.2-3]
    prompt: >-
      לכל מספר ממשי $p$ נתונה המשוואה $x^2+py^2-2x=3$.

      (א) השלימו לריבוע, וקבעו לכל ערך של $p$ איזה עקום המשוואה מתארת.

      (ב) עבור $p=-4$ מצאו את הקודקודים ואת האסימפטוטות.

      (ג) הראו ששתי נקודות מסוימות נמצאות על העקום לכל ערך של $p$.

      (ד) האם יש ערך של $p$ שבו המשוואה מתארת פרבולה? נמקו.
    answer: >-
      (א) $(x-1)^2+py^2=4$: אליפסה כש-$p>0$ (מעגל ברדיוס 2 כש-$p=1$), זוג הישרים המקבילים $x=-1$ ו-$x=3$ כש-$p=0$,
      היפרבולה שנפתחת ימינה ושמאלה כש-$p<0$. (ב) קודקודים $(-1,0)$ ו-$(3,0)$, אסימפטוטות $y=\pm\frac12(x-1)$.
      (ג) $(-1,0)$ ו-$(3,0)$. (ד) לא.
    solution:
      - kind: idea
        text: >-
          המקדמים של שני הריבועים הם 1 ו-$p$, ולכן המשפחה נקבעת לפי הסימן של $p$: חיובי, אפס או שלילי. אחרי השלמה
          לריבוע ב-$x$ (ב-$y$ אין מה להשלים) בודקים את אגף ימין, שכאן אינו תלוי ב-$p$.
      - kind: computation
        text: >-
          (א) $x^2-2x=(x-1)^2-1$, ולכן המשוואה היא $(x-1)^2-1+py^2=3$, כלומר $(x-1)^2+py^2=4$. אגף ימין חיובי לכל
          $p$.
      - kind: step
        text: >-
          כש-$p>0$: שני ריבועים באותו סימן ואגף ימין חיובי, ולכן אליפסה. מחלקים ב-4: $\frac{(x-1)^2}{4}+\frac{y^2}{4/p}=1$,
          מרכז $(1,0)$, חצי ציר 2 בכיוון $x$ ו-$\frac{2}{\sqrt p}$ בכיוון $y$. כש-$p=1$ שני חצאי הצירים שווים, וזה מעגל
          ברדיוס 2.
      - kind: step
        text: >-
          כש-$p=0$: נשאר $(x-1)^2=4$, כלומר $x-1=\pm2$. אלה שני הישרים האנכיים $x=-1$ ו-$x=3$, ולא פרבולה, כי $y$
          אינו מופיע במשוואה בכלל. זוג ישרים מקבילים מתקבל רק מהמשוואה: הוא אינו חתך של החרוט.
      - kind: step
        text: >-
          כש-$p<0$: ריבועים בסימנים שונים ואגף ימין שונה מ-0, ולכן היפרבולה. הריבוע של $x$ בא עם פלוס ואגף ימין
          חיובי, ולכן היא נפתחת ימינה ושמאלה, עם מרכז $(1,0)$ ו-$a=2$.
      - kind: computation
        text: >-
          (ב) $p=-4$: $(x-1)^2-4y^2=4$, כלומר $\frac{(x-1)^2}{4}-y^2=1$. $a=2$, $b=1$. הקודקודים במרחק 2 מהמרכז
          $(1,0)$: $(-1,0)$ ו-$(3,0)$. האסימפטוטות: $(x-1)^2=4y^2$, כלומר $y=\pm\frac12(x-1)$.
      - kind: step
        text: >-
          (ג) מציבים $y=0$: האיבר $py^2$ נעלם, ונשאר $(x-1)^2=4$, כלומר $x=-1$ או $x=3$, בלי תלות ב-$p$. הנקודות
          $(-1,0)$ ו-$(3,0)$ נמצאות על כל העקומים של המשפחה: הן הקצוות של האליפסות, הקודקודים של ההיפרבולות, ונקודות
          על שני הישרים.
      - kind: step
        text: >-
          (ד) לא. פרבולה דורשת ריבוע של משתנה אחד בלבד, ושהמשתנה השני יופיע בחזקה ראשונה. ריבוע אחד נשאר רק
          כש-$p=0$, ואז $y$ אינו מופיע כלל, ומתקבל זוג ישרים.
      - kind: check
        text: >-
          $p=4$: $\frac{(x-1)^2}{4}+y^2=1$, אליפסה עם חצאי צירים 2 ו-1, ואכן $\frac{2}{\sqrt4}=1$. $(3,0)$ במשוואה
          המקורית: $9+0-6=3$, לכל $p$. והאסימפטוטה של (ב) בתוך $(x-1)^2-4y^2$: עם $y=\frac12(x-1)$ מתקבל
          $(x-1)^2-(x-1)^2=0$.
      - kind: result
        text: >-
          $(x-1)^2+py^2=4$. $p>0$: אליפסה (מעגל כש-$p=1$); $p=0$: הישרים $x=-1$ ו-$x=3$; $p<0$: היפרבולה שנפתחת ימינה
          ושמאלה. ב-$p=-4$: קודקודים $(-1,0)$, $(3,0)$ ואסימפטוטות $y=\pm\frac12(x-1)$. אין $p$ שנותן פרבולה.

  - id: W-2.2-09
    level: exam
    qualitative: true
    objectives: [OBJ-2.2-3, OBJ-2.2-1]
    prompt: >-
      נתונה ההיפרבולה $\frac{x^2}{4}-y^2=1$, שהאסימפטוטות שלה הן $y=\pm\frac12x$.

      (א) הישר $y=\frac12x+2$ מקביל לאחת האסימפטוטות. מצאו את כל נקודות החיתוך שלו עם ההיפרבולה.

      (ב) הראו שכל ישר $y=\frac12x+n$ עם $n\ne0$ חותך את ההיפרבולה בנקודה אחת בדיוק. מה קורה כש-$n=0$?

      (ג) בכמה נקודות חותך את ההיפרבולה הישר $y=x$? והישר $y=\frac14x$?

      (ד) נסחו כלל: אילו ישרים $y=mx$ דרך המרכז חותכים את ההיפרבולה, ובכמה נקודות?
    answer: >-
      (א) נקודה אחת, $\left(-\frac52,\frac34\right)$. (ב) $x=-\frac{1+n^2}{n}$, נקודה אחת; כש-$n=0$ אין חיתוך.
      (ג) $y=x$: אף נקודה. $y=\frac14x$: שתי נקודות, $\left(\pm\frac{4}{\sqrt3},\pm\frac{1}{\sqrt3}\right)$.
      (ד) כש-$|m|<\frac12$ שתי נקודות, אחת בכל ענף; כש-$|m|\ge\frac12$ אף נקודה.
    solution:
      - kind: idea
        text: >-
          חיתוך של ישר עם עקום מוצאים בהצבה של $y$ מהישר במשוואת העקום. בדרך כלל מתקבלת משוואה ריבועית ב-$x$, עם
          שני פתרונות, אחד או אף אחד. לישר שמקביל לאסימפטוטה קורה משהו מיוחד: האיבר $x^2$ מתבטל, ונשארת משוואה
          ממעלה ראשונה.
      - kind: computation
        text: >-
          (א) מציבים $y=\frac12x+2$: $\frac{x^2}{4}-\left(\frac12x+2\right)^2=\frac{x^2}{4}-\frac{x^2}{4}-2x-4=-2x-4$.
          המשוואה $-2x-4=1$ נותנת $x=-\frac52$, ואז $y=-\frac54+2=\frac34$. נקודת חיתוך אחת:
          $\left(-\frac52,\frac34\right)$, על הענף השמאלי.
      - kind: computation
        text: >-
          (ב) באותה דרך, עם $n$ במקום 2: $\left(\frac12x+n\right)^2=\frac{x^2}{4}+nx+n^2$, ולכן
          $\frac{x^2}{4}-\left(\frac12x+n\right)^2=-nx-n^2$, והמשוואה היא $-nx-n^2=1$. כש-$n\ne0$ יש
          פתרון אחד, $x=-\frac{1+n^2}{n}$. כש-$n=0$ המשוואה היא $0=1$, בלי פתרון: האסימפטוטה עצמה אינה פוגשת את
          ההיפרבולה.
      - kind: computation
        text: >-
          (ג) $y=x$: $\frac{x^2}{4}-x^2=-\frac34x^2=1$, ואגף שמאל אינו חיובי: אין נקודות חיתוך. $y=\frac14x$:
          $\frac{x^2}{4}-\frac{x^2}{16}=\frac{3}{16}x^2=1$, כלומר $x=\pm\frac{4}{\sqrt3}\approx\pm2.309$, ו-
          $y=\frac14x=\pm\frac{1}{\sqrt3}\approx\pm0.577$. שתי נקודות, אחת בכל ענף.
      - kind: step
        text: >-
          (ד) מציבים $y=mx$: $x^2\left(\frac14-m^2\right)=1$. יש פתרונות בדיוק כשהסוגריים חיוביים, כלומר
          $|m|<\frac12$, ואז הם שניים, $x=\pm\frac{1}{\sqrt{1/4-m^2}}$, אחד בכל ענף. כש-$|m|\ge\frac12$ אין אף
          פתרון. בתמונה: ישר דרך המרכז שתלול פחות מהאסימפטוטות נמצא ב"פתח" של הענפים וחוצה את שניהם; ישר תלול
          מהן, או האסימפטוטות עצמן, עובר באזור שבין הענפים.
      - kind: check
        text: >-
          הנקודה של (א): $\frac{(5/2)^2}{4}-\left(\frac34\right)^2=\frac{25}{16}-\frac{9}{16}=1$. הנוסחה של (ב) עם
          $n=2$: $-\frac{1+4}{2}=-\frac52$, כמו ב-(א). ועם $n=1$ מתקבל $x=-2$, $y=0$: הישר $y=\frac12x+1$ עובר בדיוק
          דרך הקודקוד השמאלי $(-2,0)$.
      - kind: result
        text: >-
          ישר מקביל לאסימפטוטה ($n\ne0$) חותך את ההיפרבולה בנקודה אחת, $x=-\frac{1+n^2}{n}$; עבור $n=2$ זו
          $\left(-\frac52,\frac34\right)$. ישר $y=mx$ דרך המרכז חותך אותה בשתי נקודות כש-$|m|<\frac12$, ואינו חותך
          אותה כש-$|m|\ge\frac12$.

  - id: W-2.2-10
    level: exam
    qualitative: true
    objectives: [OBJ-2.2-2]
    prompt: >-
      התבקש: לזהות את העקום $4x^2-y^2+8x+4y=0$. תלמיד כתב:

      **שלב 1.** $4(x^2+2x)-(y^2-4y)=0$.

      **שלב 2.** $4(x+1)^2-4-(y-2)^2-4=0$.

      **שלב 3.** $4(x+1)^2-(y-2)^2=8$: היפרבולה שמרכזה $(-1,2)$.

      (א) בלי לפתור מחדש, בצעו בדיקה אחת שמראה שהתשובה שגויה.

      (ב) באיזה שלב הטעות, ומהי?

      (ג) זהו את העקום נכון, ותארו אותו.

      (ד) מוסיפים למשוואה איבר חופשי $F$: $4x^2-y^2+8x+4y+F=0$. מה היא מתארת כש-$F=-4$, ומה כש-$F=4$?
    answer: >-
      (א) המרכז $(-1,2)$ מקיים את המשוואה המקורית, ומרכז של היפרבולה אינו נמצא עליה. (ב) שלב 2: $-(y^2-4y)=-(y-2)^2+4$,
      עם פלוס. (ג) $4(x+1)^2-(y-2)^2=0$: זוג הישרים $y=2x+4$ ו-$y=-2x$. (ד) $F=-4$: היפרבולה שנפתחת ימינה ושמאלה;
      $F=4$: היפרבולה שנפתחת למעלה ולמטה; לשתיהן אותן אסימפטוטות.
    solution:
      - kind: idea
        text: >-
          למשוואה ממשפחת ההיפרבולה יש שתי אפשרויות, היפרבולה או זוג ישרים, וההבדל ביניהן הוא רק אם אגף ימין אחרי
          ההשלמה הוא 0. בדיקה מהירה: המרכז. בהיפרבולה המרכז אינו על העקום (הוא בין הענפים); בזוג ישרים הוא נקודת
          המפגש שלהם, ולכן הוא על העקום.
      - kind: computation
        text: >-
          (א) מציבים את $(-1,2)$ במשוואה המקורית: $4\cdot1-4+8\cdot(-1)+4\cdot2=4-4-8+8=0$. המרכז מקיים את המשוואה.
          אבל בהיפרבולה $4(x+1)^2-(y-2)^2=8$ המרכז נותן $0=8$. לכן התשובה של התלמיד שגויה.
      - kind: step
        text: >-
          (ב) שלב 1 נכון. בשלב 2 הפיצוי של $x$ נכון: $4(x^2+2x)=4(x+1)^2-4$. הטעות בפיצוי של $y$:
          $y^2-4y=(y-2)^2-4$, ולפני הסוגריים עומד מינוס, ולכן $-(y^2-4y)=-(y-2)^2+4$. התלמיד כתב $-4$: הוא שכח
          שהמינוס שלפני הסוגריים הופך גם את הסימן של הפיצוי.
      - kind: computation
        text: >-
          (ג) החישוב הנכון: $4(x+1)^2-4-(y-2)^2+4=0$, כלומר $4(x+1)^2-(y-2)^2=0$. אגף ימין 0: זוג ישרים. מ-
          $(y-2)^2=4(x+1)^2$ מקבלים $y-2=\pm2(x+1)$, כלומר $y=2x+4$ ו-$y=-2x$. הם נחתכים ב-$(-1,2)$.
      - kind: computation
        text: >-
          (ד) האיבר החופשי רק משנה את אגף ימין: $4(x+1)^2-(y-2)^2=-F$. כש-$F=-4$ אגף ימין הוא 4, ואחרי חילוק:
          $(x+1)^2-\frac{(y-2)^2}{4}=1$, היפרבולה שנפתחת ימינה ושמאלה. כש-$F=4$ אגף ימין הוא $-4$, ואחרי כפל ב-$-1$
          וחילוק ב-4: $\frac{(y-2)^2}{4}-(x+1)^2=1$, היפרבולה שנפתחת למעלה ולמטה. לשתיהן מרכז $(-1,2)$, והאסימפטוטות
          שלהן הן שני הישרים של סעיף (ג).
      - kind: check
        text: >-
          שני הישרים במשוואה המקורית. עם $y=-2x$: $4x^2-4x^2+8x-8x=0$. עם $y=2x+4$:
          $4x^2-(2x+4)^2+8x+4(2x+4)=4x^2-4x^2-16x-16+8x+8x+16=0$. כל נקודה על כל אחד מהישרים מקיימת את המשוואה.
      - kind: result
        text: >-
          הטעות בשלב 2, בסימן של הפיצוי אחרי המינוס. העקום הוא זוג הישרים $y=2x+4$ ו-$y=-2x$, שנחתכים ב-$(-1,2)$.
          עם $F=-4$ או $F=4$ מתקבלות שתי היפרבולות, בכיוונים שונים, ששני הישרים האלה הם האסימפטוטות שלהן.

challenge:
  - id: W-2.2-c1
    stars: 1
    objectives: [OBJ-2.2-3, OBJ-2.2-1]
    prompt: >-
      נתונה הפרמטריזציה $x=\dfrac{1}{\cos t}$, $y=\tan t$.

      (א) הראו שכל נקודה שהיא נותנת נמצאת על ההיפרבולה $x^2-y^2=1$.

      (ב) איזה חלק של ההיפרבולה מתקבל כש-$-\frac\pi2<t<\frac\pi2$, ובאיזה כיוון הנקודה נעה עליו כש-$t$ גדל?

      (ג) איזה חלק מתקבל כש-$\pi\le t<\frac{3\pi}{2}$?

      (ד) בשיעור תיארנו את הענף הימני בעזרת $\left(\sqrt{1+u^2},\;u\right)$. מה הקשר בין $u$ לבין $t$ של סעיף (ב)?

      (ה) כתבו, באותה שיטה, פרמטריזציה של הענף הימני של $\frac{x^2}{16}-\frac{y^2}{9}=1$.
    answer: >-
      (א) $\frac{1}{\cos^2t}-\tan^2t=1$. (ב) כל הענף הימני, מלמטה למעלה. (ג) החצי העליון של הענף השמאלי, החל
      מהקודקוד $(-1,0)$. (ד) $u=\tan t$. (ה) $(x,y)=\left(\frac{4}{\cos t},\;3\tan t\right)$, $-\frac\pi2<t<\frac\pi2$.
    solution:
      - kind: idea
        text: >-
          המעגל $x^2+y^2=1$ מתואר בעזרת הזהות $\cos^2t+\sin^2t=1$. להיפרבולה $x^2-y^2=1$ צריך זהות עם **מינוס**,
          ויש כזו בטריגונומטריה של התיכון: מחלקים את $\cos^2t+\sin^2t=1$ ב-$\cos^2t$ ומקבלים
          $1+\tan^2t=\frac{1}{\cos^2t}$. אחר כך, כמו בכל פרמטריזציה, בודקים אילו ערכים מקבלת כל קואורדינטה.
      - kind: computation
        text: >-
          (א) $x^2-y^2=\frac{1}{\cos^2t}-\tan^2t=\frac{1-\sin^2t}{\cos^2t}=\frac{\cos^2t}{\cos^2t}=1$, לכל $t$ שבו
          $\cos t\ne0$.
      - kind: step
        text: >-
          (ב) בקטע $-\frac\pi2<t<\frac\pi2$ הקוסינוס חיובי ואינו גדול מ-1, ולכן $x=\frac{1}{\cos t}\ge1$: הנקודה על
          הענף הימני. $y=\tan t$ עולה בקטע הזה ומקבל כל ערך ממשי, פעם אחת. בענף הימני לכל גובה יש נקודה אחת, ולכן
          מתקבל הענף הימני כולו, והנקודה נעה עליו מלמטה למעלה. ב-$t=0$ היא בקודקוד $(1,0)$.
      - kind: step
        text: >-
          (ג) כותבים $t=\pi+s$, עם $0\le s<\frac\pi2$, ונעזרים בשתי זהויות מהתיכון: $\cos(\pi+s)=-\cos s$
          ו-$\tan(\pi+s)=\tan s$. לכן $x=-\frac{1}{\cos s}$ ו-$y=\tan s$. כש-$s$ עולה מ-0 אל $\frac\pi2$, $\cos s$ יורד
          מ-1 ומתקרב ל-0, ולכן $x$ יורד מ-$-1$ בלי גבול: $x\le-1$, הענף השמאלי. באותו זמן $\tan s$ מתחיל ב-0 וגדל
          בלי גבול, ולכן $y\ge0$. מתקבל החצי העליון של הענף השמאלי: הנקודה יוצאת מהקודקוד $(-1,0)$ ומתרחקת שמאלה
          ולמעלה.
      - kind: step
        text: >-
          (ד) משווים את הקואורדינטה השנייה: $u=\tan t$. אז $\sqrt{1+u^2}=\sqrt{1+\tan^2t}=\sqrt{\frac{1}{\cos^2t}}=\frac{1}{|\cos t|}$,
          וב-$-\frac\pi2<t<\frac\pi2$ הקוסינוס חיובי, ולכן זה $\frac{1}{\cos t}$. שתי הפרמטריזציות עוברות על אותן
          נקודות; ההבדל הוא רק בשם שנותנים לכל נקודה. כש-$t$ עובר על קטע סופי, $u=\tan t$ עובר על כל הממשיים.
      - kind: computation
        text: >-
          (ה) מותחים: $x=\frac{4}{\cos t}$, $y=3\tan t$, עם $-\frac\pi2<t<\frac\pi2$. אז
          $\frac{x^2}{16}-\frac{y^2}{9}=\frac{1}{\cos^2t}-\tan^2t=1$, ו-$x\ge4$.
      - kind: check
        text: >-
          נקודות: ב-$t=\frac\pi4$ מתקבלת $(\sqrt2,1)$, ו-$2-1=1$. ב-$t=\frac\pi3$ מתקבלת $(2,\sqrt3)$, ו-$4-3=1$.
          ב-$t=\frac{5\pi}{4}$, בתוך הקטע של (ג), מתקבלת $(-\sqrt2,1)$: על הענף השמאלי, בחצי העליון.
      - kind: result
        text: >-
          $\left(\frac{1}{\cos t},\tan t\right)$ נמצאת על $x^2-y^2=1$. עם $-\frac\pi2<t<\frac\pi2$ מתקבל כל הענף
          הימני, מלמטה למעלה; עם $\pi\le t<\frac{3\pi}{2}$ החצי העליון של הענף השמאלי. הקשר לפרמטריזציה של השיעור:
          $u=\tan t$.
    source:
      name: 'OpenStax, Calculus Volume 2 (G. Strang, E. Herman), Section 7.1 Parametric Equations'
      year: 2016
      problem: 'Exercises 15, 20 and 29'
      url: 'https://openstax.org/books/calculus-volume-2/pages/7-1-parametric-equations#fs-id1169293393259'
      verified: '2026-11-18'
      adapted: true

  - id: W-2.2-c2
    stars: 1
    objectives: [OBJ-2.2-3, OBJ-2.2-1]
    prompt: >-
      בגן מתכננים גדר חיה בצורת היפרבולה, סביב מזרקה שנמצאת בראשית הצירים (היחידות מטרים). הגדר צריכה להיצמד,
      רחוק מהמזרקה, לשני הישרים $y=\frac23x$ ו-$y=-\frac23x$, והמרחק הקטן ביותר שלה מהמזרקה צריך להיות 12 מטרים.

      (א) נניח ששני הענפים נפתחים מזרחה ומערבה (לאורך ציר $x$), ושהנקודות הקרובות ביותר למזרקה הן הקודקודים. מצאו
      את משוואת ההיפרבולה.

      (ב) הוכיחו את ההנחה: מכל הנקודות של ההיפרבולה שמצאתם, הקודקודים הם הקרובות ביותר לראשית.

      (ג) התנאים אינם קובעים את הכיוון. מצאו את ההיפרבולה שמקיימת אותם ונפתחת צפונה ודרומה (לאורך ציר $y$).

      (ד) כתבו פרמטריזציה של הענף המזרחי של ההיפרבולה מסעיף (א), ומצאו את הנקודה שלו שגובהה $y=6$.
    answer: >-
      (א) $\frac{x^2}{144}-\frac{y^2}{64}=1$. (ב) $x^2+y^2=\frac{13}{9}x^2-64\ge144$, עם שוויון רק כש-$x=\pm12$.
      (ג) $\frac{y^2}{144}-\frac{x^2}{324}=1$. (ד) $(x,y)=\left(12\sqrt{1+u^2},\;8u\right)$, $u\in\mathbb{R}$; הנקודה
      $(15,6)$, ב-$u=\frac34$.
    solution:
      - kind: idea
        text: >-
          "להיצמד לישרים רחוק מהמרכז" פירושו שהישרים הם האסימפטוטות, ולכן היחס $\frac{b}{a}$ ידוע. "המרחק הקטן
          ביותר מהמרכז" הוא המרחק של הקודקודים, ולכן ידוע גם המספר שמתחת לריבוע שבא עם פלוס. שני נתונים, שני
          מספרים.
      - kind: computation
        text: >-
          (א) הצורה היא $\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$. הקודקודים $(\pm a,0)$ במרחק $a$ מהראשית, ולכן $a=12$.
          האסימפטוטות $y=\pm\frac{b}{a}x$ עם $\frac{b}{a}=\frac23$, ולכן $b=8$. המשוואה:
          $\frac{x^2}{144}-\frac{y^2}{64}=1$.
      - kind: computation
        text: >-
          (ב) ריבוע המרחק של נקודה $(x,y)$ מהראשית הוא $x^2+y^2$. על ההיפרבולה $y^2=64\left(\frac{x^2}{144}-1\right)=\frac49x^2-64$,
          ולכן $x^2+y^2=x^2+\frac49x^2-64=\frac{13}{9}x^2-64$. הביטוי הזה גדל כש-$x^2$ גדל, ועל ההיפרבולה
          $x^2\ge144$. לכן הערך הקטן ביותר שלו מתקבל כש-$x^2=144$, והוא $\frac{13}{9}\cdot144-64=208-64=144$: מרחק 12,
          בדיוק בקודקודים $(\pm12,0)$.
      - kind: computation
        text: >-
          (ג) עכשיו הצורה היא $\frac{y^2}{b^2}-\frac{x^2}{a^2}=1$, והקודקודים $(0,\pm b)$, ולכן $b=12$. האסימפטוטות
          עדיין $y=\pm\frac{b}{a}x$, ולכן $\frac{12}{a}=\frac23$ ו-$a=18$. המשוואה: $\frac{y^2}{144}-\frac{x^2}{324}=1$.
          (באותה דרך כמו ב-(ב): כאן $x^2+y^2=\frac{13}{4}y^2-324$, וב-$y^2=144$ זה שוב 144.)
      - kind: computation
        text: >-
          (ד) $y=8u$ ו-$x=12\sqrt{1+u^2}$ (השורש החיובי, לענף המזרחי): $(x,y)=\left(12\sqrt{1+u^2},\;8u\right)$,
          $u\in\mathbb{R}$. גובה 6 מתקבל ב-$u=\frac68=\frac34$, ואז $x=12\sqrt{1+\frac{9}{16}}=12\cdot\frac54=15$. הנקודה
          $(15,6)$.
      - kind: check
        text: >-
          $(15,6)$ במשוואה של (א): $\frac{225}{144}-\frac{36}{64}=\frac{25}{16}-\frac{9}{16}=1$. המרחק שלה מהמזרקה הוא
          $\sqrt{225+36}=\sqrt{261}\approx16.16$ מטרים, יותר מ-12. והיא מתחת לאסימפטוטה, שב-$x=15$ נמצאת בגובה
          $\frac23\cdot15=10$: הענף נמצא בין שתי האסימפטוטות, כמו שצריך.
      - kind: result
        text: >-
          מזרח-מערב: $\frac{x^2}{144}-\frac{y^2}{64}=1$. צפון-דרום: $\frac{y^2}{144}-\frac{x^2}{324}=1$. בשתיהן
          הקודקודים הם הנקודות הקרובות ביותר למזרקה, במרחק 12 מטרים. הענף המזרחי של הראשונה:
          $\left(12\sqrt{1+u^2},\;8u\right)$, והנקודה שגובהה 6 היא $(15,6)$.
    source:
      name: 'OpenStax, Precalculus 2e (J. Abramson), Section 10.2 The Hyperbola'
      year: 2021
      problem: 'Exercise 64'
      url: https://openstax.org/books/precalculus-2e/pages/10-2-the-hyperbola
      verified: '2026-11-18'
      adapted: true
