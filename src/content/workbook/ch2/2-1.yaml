# Workbook of lesson 2.1 — circle and ellipse: equation and parametrisation.
# Objectives (src/course.ts):
#   OBJ-2.1-1  the unit circle by cos/sin and by its Cartesian equation, and moving between the two
#   OBJ-2.1-2  the ellipse in standard form: semi-axes and a parametrisation
#   OBJ-2.1-3  shifting and stretching a circle or an ellipse, and the new equation
# Every number recomputed with sympy in screens/tools/lesson-2-1.py.
lesson: '2.1'
practice:
  - id: W-2.1-01
    level: basic
    objectives: [OBJ-2.1-1]
    prompt: >-
      מעגל היחידה נתון בפרמטריזציה $(x,y)=(\cos t,\sin t)$, $0\le t<2\pi$.

      (א) מצאו את הנקודות שמתאימות ל-$t=\frac{5\pi}{6}$ ול-$t=\frac{4\pi}{3}$.

      (ב) לאיזה $t$ מתאימה הנקודה $\left(-\frac{\sqrt2}{2},\frac{\sqrt2}{2}\right)$?

      (ג) האם הנקודה $\left(\frac{\sqrt3}{2},-\frac12\right)$ נמצאת על מעגל היחידה? אם כן, באיזה רביע היא, ומהו ה-$t$
      שלה?
    answer: >-
      (א) $\left(-\frac{\sqrt3}{2},\frac12\right)$ ו-$\left(-\frac12,-\frac{\sqrt3}{2}\right)$. (ב) $t=\frac{3\pi}{4}$.
      (ג) כן; ברביע הרביעי; $t=\frac{11\pi}{6}$.
    solution:
      - kind: idea
        text: >-
          מפרמטר לנקודה מציבים. מנקודה לפרמטר מחפשים זווית שהקוסינוס שלה הוא הקואורדינטה $x$ **וגם** הסינוס שלה הוא הקואורדינטה
          $y$: הסימנים של שתי הקואורדינטות קובעים את הרביע, והקטע $0\le t<2\pi$ קובע איזה מהערכים האפשריים לקחת.
      - kind: computation
        text: >-
          (א) $\cos\frac{5\pi}{6}=-\frac{\sqrt3}{2}$ ו-$\sin\frac{5\pi}{6}=\frac12$: הנקודה $\left(-\frac{\sqrt3}{2},\frac12\right)$,
          ברביע השני. $\cos\frac{4\pi}{3}=-\frac12$ ו-$\sin\frac{4\pi}{3}=-\frac{\sqrt3}{2}$: הנקודה
          $\left(-\frac12,-\frac{\sqrt3}{2}\right)$, ברביע השלישי.
      - kind: computation
        text: >-
          (ב) $x$ שלילי ו-$y$ חיובי: הרביע השני. הזווית שהקוסינוס והסינוס שלה, בערך מוחלט, $\frac{\sqrt2}{2}$ היא
          $\frac{\pi}{4}$, וברביע השני זו $t=\pi-\frac{\pi}{4}=\frac{3\pi}{4}$.
      - kind: computation
        text: >-
          (ג) בודקים במשוואה הקרטזית: $\left(\frac{\sqrt3}{2}\right)^2+\left(-\frac12\right)^2=\frac34+\frac14=1$. הנקודה
          על המעגל. $x$ חיובי ו-$y$ שלילי: הרביע הרביעי, כלומר $\frac{3\pi}{2}<t<2\pi$.
      - kind: step
        text: >-
          הזווית שהקוסינוס שלה $\frac{\sqrt3}{2}$ והסינוס שלה $+\frac12$ היא $\frac{\pi}{6}$, ברביע הראשון. הנקודה שלנו
          היא השיקוף של הנקודה הזו בציר $x$ (אותו $x$, והסימן של $y$ התהפך), ולכן הזווית שלה היא $-\frac{\pi}{6}$.
          הערך הזה אינו בקטע; מוסיפים $2\pi$: $t=2\pi-\frac{\pi}{6}=\frac{11\pi}{6}$.
      - kind: check
        text: >-
          $\frac{11\pi}{6}\approx5.760$ נמצא בין $\frac{3\pi}{2}\approx4.712$ ל-$2\pi\approx6.283$, כמו שצריך ברביע
          הרביעי. מי שעוצר ב-$\frac{\pi}{6}$ מקבל את הנקודה $\left(\frac{\sqrt3}{2},+\frac12\right)$, השיקוף בציר $x$.
      - kind: result
        text: >-
          (א) $\left(-\frac{\sqrt3}{2},\frac12\right)$, $\left(-\frac12,-\frac{\sqrt3}{2}\right)$; (ב) $t=\frac{3\pi}{4}$;
          (ג) הנקודה על המעגל, ברביע הרביעי, עם $t=\frac{11\pi}{6}$.

  - id: W-2.1-02
    level: basic
    objectives: [OBJ-2.1-2]
    prompt: >-
      נתונה האליפסה $25x^2+4y^2=100$.

      (א) הביאו אותה לצורה הסטנדרטית ומצאו את חצאי הצירים.

      (ב) מצאו את נקודות החיתוך שלה עם הצירים. האם היא רחבה או גבוהה?

      (ג) כתבו לה פרמטריזציה, ומצאו את הנקודה שמתאימה ל-$t=\frac{\pi}{3}$.
    answer: >-
      (א) $\frac{x^2}{4}+\frac{y^2}{25}=1$, $a=2$, $b=5$. (ב) $(\pm2,0)$ ו-$(0,\pm5)$; גבוהה. (ג) $(2\cos t,5\sin t)$,
      $0\le t<2\pi$; הנקודה $\left(1,\frac{5\sqrt3}{2}\right)$.
    solution:
      - kind: idea
        text: >-
          חצאי הצירים נקראים מהמכנים רק כשאגף ימין הוא 1. לכן קודם מחלקים, אחר כך מוציאים שורש מכל מכנה, ולבסוף
          בודקים בהצבה של $y=0$ ושל $x=0$ במשוואה המקורית.
      - kind: computation
        text: >-
          (א) מחלקים ב-100: $\frac{25x^2}{100}+\frac{4y^2}{100}=1$, כלומר $\frac{x^2}{4}+\frac{y^2}{25}=1$. לכן $a^2=4$,
          $b^2=25$, ו-$a=2$, $b=5$.
      - kind: computation
        text: >-
          (ב) במשוואה המקורית, עם $y=0$: $25x^2=100$, $x=\pm2$. עם $x=0$: $4y^2=100$, $y=\pm5$. הנקודות הן $(\pm2,0)$
          ו-$(0,\pm5)$. $b>a$, ולכן האליפסה גבוהה יותר משהיא רחבה: רוחבה 4 וגובהה 10.
      - kind: computation
        text: >-
          (ג) $(x,y)=(2\cos t,5\sin t)$, $0\le t<2\pi$. ב-$t=\frac{\pi}{3}$: $x=2\cdot\frac12=1$ ו-
          $y=5\cdot\frac{\sqrt3}{2}=\frac{5\sqrt3}{2}\approx4.33$.
      - kind: check
        text: >-
          הנקודה במשוואה המקורית: $25\cdot1+4\cdot\frac{75}{4}=25+75=100$. ושימו לב: המקדם הגדול, 25, נמצא ליד $x^2$,
          ודווקא בכיוון $x$ האליפסה צרה.
      - kind: result
        text: >-
          $\frac{x^2}{4}+\frac{y^2}{25}=1$, עם $a=2$ ו-$b=5$; חיתוכים $(\pm2,0)$, $(0,\pm5)$; פרמטריזציה $(2\cos t,5\sin t)$;
          ב-$t=\frac{\pi}{3}$ הנקודה $\left(1,\frac{5\sqrt3}{2}\right)$.

  - id: W-2.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-2.1-3]
    prompt: >-
      לכל משוואה תארו במילים איך העקום מתקבל ממעגל היחידה $x^2+y^2=1$ (מתיחה, כיווץ, הזזה, ובכמה), בלי לחשב דבר
      מעבר לקריאה של המשוואה.

      (א) $(x-1)^2+(y+2)^2=4$

      (ב) $(x+1)^2+(y-2)^2=4$

      (ג) $\frac{x^2}{4}+y^2=1$

      (ד) $x^2+\frac{y^2}{4}=1$

      (ה) $4x^2+4y^2=1$
    answer: >-
      (א) הגדלה פי 2 בשני הכיוונים, ואז הזזה ב-$(1,-2)$. (ב) הגדלה פי 2, ואז הזזה ב-$(-1,2)$. (ג) מתיחה פי 2 בכיוון
      $x$. (ד) מתיחה פי 2 בכיוון $y$. (ה) כיווץ פי 2 בשני הכיוונים: מעגל ברדיוס $\frac12$.
    solution:
      - kind: idea
        text: >-
          מה שכתוב במשוואה הוא הפעולה ההפוכה למה שנעשה לנקודות: $\frac{x}{a}$ במשוואה פירושו מתיחה פי $a$ בכיוון $x$,
          ו-$x-h$ במשוואה פירושו הזזה ב-$h$ בכיוון $x$. קודם כותבים כל משוואה כ"ריבוע ועוד ריבוע שווה 1".
      - kind: step
        text: >-
          (א) מחלקים ב-4: $\left(\frac{x-1}{2}\right)^2+\left(\frac{y+2}{2}\right)^2=1$. חילוק ב-2 בשני הכיוונים: הגדלה
          פי 2 (מעגל ברדיוס 2). $x-1$ ו-$y+2=y-(-2)$: הזזה ב-$(1,-2)$. המרכז $(1,-2)$.
      - kind: step
        text: >-
          (ב) אותו רדיוס, 2. $x+1=x-(-1)$ ו-$y-2$: הזזה ב-$(-1,2)$. המרכז $(-1,2)$, הנקודה שבה שני הסוגריים מתאפסים.
          (א) ו-(ב) נבדלים רק בסימנים, והמרכזים שלהם משני צדי הראשית.
      - kind: step
        text: >-
          (ג) $\left(\frac{x}{2}\right)^2+y^2=1$: מתיחה פי 2 בכיוון $x$ בלבד. אליפסה רחבה, $a=2$, $b=1$.
      - kind: step
        text: >-
          (ד) $x^2+\left(\frac{y}{2}\right)^2=1$: מתיחה פי 2 בכיוון $y$ בלבד. אליפסה גבוהה, $a=1$, $b=2$.
      - kind: step
        text: >-
          (ה) אגף ימין כבר 1, ולכן מותר לקרוא ישר: $(2x)^2+(2y)^2=1$, כלומר
          $\left(\frac{x}{1/2}\right)^2+\left(\frac{y}{1/2}\right)^2=1$: "מתיחה" פי $\frac12$ בשני הכיוונים, כלומר כיווץ פי 2. זה המעגל $x^2+y^2=\frac14$, ברדיוס $\frac12$.
      - kind: check
        text: >-
          נקודה אחת לכל עקום, לפי התיאור. (א) $(1,0)$ עוברת ל-$(2,0)$ ואז ל-$(3,-2)$: $(3-1)^2+0=4$. (ב) $(0,1)$ עוברת
          ל-$(0,2)$ ואז ל-$(-1,4)$: $0+(4-2)^2=4$. (ג) $(1,0)$ עוברת ל-$(2,0)$: $\frac44+0=1$. (ד) $(0,1)$ עוברת ל-
          $(0,2)$: $0+\frac44=1$. (ה) $(1,0)$ עוברת ל-$\left(\frac12,0\right)$: $4\cdot\frac14=1$.
      - kind: result
        text: >-
          (א) מעגל ברדיוס 2 שמרכזו $(1,-2)$; (ב) מעגל ברדיוס 2 שמרכזו $(-1,2)$; (ג) אליפסה עם $a=2$, $b=1$; (ד) אליפסה
          עם $a=1$, $b=2$; (ה) מעגל ברדיוס $\frac12$ סביב הראשית.

  - id: W-2.1-04
    level: mid
    objectives: [OBJ-2.1-1, OBJ-2.1-3]
    prompt: >-
      נתון המעגל $x^2+y^2+6x-4y-3=0$.

      (א) מצאו את המרכז ואת הרדיוס שלו.

      (ב) כתבו פרמטריזציה שלו, $0\le t<2\pi$, שמתחילה בנקודה העליונה של המעגל ונעה **עם** כיוון השעון.

      (ג) באיזה $t$ הפרמטריזציה שכתבתם עוברת בנקודה $\left(-5,\,2-2\sqrt3\right)$?
    answer: >-
      (א) מרכז $(-3,2)$, רדיוס 4. (ב) $(x,y)=(-3+4\sin t,\,2+4\cos t)$. (ג) $t=\frac{7\pi}{6}$.
    solution:
      - kind: idea
        text: >-
          השלמה לריבוע מגלה את המרכז ואת הרדיוס. לפרמטריזציה עם התחלה וכיוון שנקבעו מראש בוחרים נוסחה, ואז בודקים
          אותה בשתי הצבות: $t=0$ לנקודת ההתחלה, ו-$t=\frac{\pi}{2}$ לכיוון.
      - kind: computation
        text: >-
          (א) משלימים לריבוע (חצי מהמקדם בתוך הסוגריים, ומחסירים את הריבוע שלו): ב-$x^2+6x$ החצי הוא 3 והריבוע 9,
          וב-$y^2-4y$ החצי הוא $-2$ והריבוע 4. לכן $x^2+6x=(x+3)^2-9$ ו-$y^2-4y=(y-2)^2-4$. מציבים: $(x+3)^2-9+(y-2)^2-4-3=0$, כלומר
          $(x+3)^2+(y-2)^2=16$. המרכז $(-3,2)$, הנקודה שבה הסוגריים מתאפסים, והרדיוס $\sqrt{16}=4$.
      - kind: step
        text: >-
          (ב) הנקודה העליונה היא $(-3,2+4)=(-3,6)$. בפרמטריזציה הרגילה, $(-3+4\cos t,\,2+4\sin t)$, מתחילים בנקודה
          הימנית ונעים נגד כיוון השעון, וזה לא מה שהתבקש. מחליפים בין הקוסינוס לסינוס: $(x,y)=(-3+4\sin t,\,2+4\cos t)$.
      - kind: computation
        text: >-
          בודקים. ב-$t=0$: $(-3+0,\,2+4)=(-3,6)$, הנקודה העליונה. ב-$t=\frac{\pi}{2}$: $(-3+4,\,2+0)=(1,2)$, הנקודה
          הימנית. מלמעלה ימינה: עם כיוון השעון. והנקודות על המעגל: $(4\sin t)^2+(4\cos t)^2=16$.
      - kind: computation
        text: >-
          (ג) דורשים $-3+4\sin t=-5$ וגם $2+4\cos t=2-2\sqrt3$, כלומר $\sin t=-\frac12$ ו-
          $\cos t=-\frac{\sqrt3}{2}$. שניהם שליליים: $t$ ברביע השלישי. הזווית שהסינוס שלה $\frac12$ והקוסינוס שלה
          $\frac{\sqrt3}{2}$ היא $\frac{\pi}{6}$, ולכן $t=\pi+\frac{\pi}{6}=\frac{7\pi}{6}$.
      - kind: check
        text: >-
          הנקודה של (ג) במשוואה המקורית, דרך הצורה $(x+3)^2+(y-2)^2$: $(-2)^2+(-2\sqrt3)^2=4+12=16$. שימו לב שב-(ג)
          $t$ אינו הזווית של הנקודה סביב המרכז, זו שנמדדת מהכיוון החיובי של ציר $x$ נגד כיוון השעון. הנקודה נמצאת 2
          יחידות משמאל למרכז ו-$2\sqrt3$ יחידות מתחתיו, כלומר בזווית של $\frac{4\pi}{3}$ סביבו, ואילו $t=\frac{7\pi}{6}$:
          בפרמטריזציה הזו $t$ נמדד מהנקודה העליונה, עם כיוון השעון.
      - kind: result
        text: >-
          מרכז $(-3,2)$ ורדיוס 4; $(x,y)=(-3+4\sin t,\,2+4\cos t)$, $0\le t<2\pi$; הנקודה הנתונה מתקבלת ב-
          $t=\frac{7\pi}{6}$.

  - id: W-2.1-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.1-1]
    prompt: >-
      נכון או לא נכון? נמקו כל סעיף.

      (א) $y=-\sqrt{4-x^2}$ היא משוואה של המעגל $x^2+y^2=4$.

      (ב) הפרמטריזציות $(2\cos t,2\sin t)$, $0\le t\le\pi$, ו-$(2\cos 2t,2\sin 2t)$, $0\le t\le\frac{\pi}{2}$, מתארות
      אותה קבוצה של נקודות.

      (ג) הפרמטריזציה $(\cos t^2,\sin t^2)$, $0\le t<\sqrt{2\pi}$, עוברת על כל מעגל היחידה בדיוק פעם אחת.

      (ד) $(\cos t,\sin 2t)$, $0\le t<2\pi$, היא פרמטריזציה של מעגל היחידה.
    answer: >-
      (א) לא נכון: רק החצי התחתון. (ב) נכון: שתיהן חצי המעגל העליון ברדיוס 2. (ג) נכון: $t^2$ עובר מ-0 עד $2\pi$.
      (ד) לא נכון: ב-$t=\frac{\pi}{4}$ הנקודה $\left(\frac{\sqrt2}{2},1\right)$ אינה על המעגל.
    solution:
      - kind: idea
        text: >-
          עקום הוא קבוצת נקודות. כדי להשוות שני תיאורים בודקים שני דברים: שכל הנקודות מקיימות את המשוואה, ואיזה חלק
          של העקום באמת מתקבל כשהפרמטר (או $x$) עובר על הקטע שלו. כדי לפסול מספיקה נקודה אחת.
      - kind: step
        text: >-
          (א) לא נכון. שורש אינו שלילי, ולכן $-\sqrt{4-x^2}\le0$: מתקבל רק חצי המעגל התחתון. הנקודה $(0,2)$ נמצאת על
          המעגל, $0+4=4$, אבל אינה מקיימת $y=-\sqrt{4-x^2}$, כי $-\sqrt4=-2$.
      - kind: step
        text: >-
          (ב) נכון. בראשונה הזווית היא $t$ והיא עוברת מ-0 עד $\pi$. בשנייה הזווית היא $2t$, וכש-$t$ עובר מ-0 עד
          $\frac{\pi}{2}$ היא עוברת מ-0 עד $\pi$. בשתיהן מתקבל חצי המעגל העליון ברדיוס 2, מ-$(2,0)$ דרך $(0,2)$ עד
          $(-2,0)$. השנייה עוברת עליו מהר פי 2.
      - kind: step
        text: >-
          (ג) נכון. כאן הזווית היא $t^2$. כש-$t$ גדל מ-0 עד $\sqrt{2\pi}\approx2.507$ (לא כולל), $t^2$ גדל מ-0 עד $2\pi$
          (לא כולל), בלי לחזור על אף ערך. לכן כל נקודה של המעגל מתקבלת פעם אחת. הקצב אינו אחיד: הנקודה מאיצה.
      - kind: step
        text: >-
          (ד) לא נכון. ב-$t=\frac{\pi}{4}$ הנקודה היא $\left(\cos\frac{\pi}{4},\sin\frac{\pi}{2}\right)=\left(\frac{\sqrt2}{2},1\right)$,
          ו-$x^2+y^2=\frac12+1=\frac32\ne1$. הזהות $\cos^2+\sin^2=1$ דורשת **אותה** זווית בקוסינוס ובסינוס.
      - kind: check
        text: >-
          ב-(ב), הצבה של הקצוות ושל האמצע בפרמטריזציה השנייה: $t=0$ נותן $(2,0)$, $t=\frac{\pi}{4}$ נותן $(0,2)$,
          ו-$t=\frac{\pi}{2}$ נותן $(-2,0)$, כמו בראשונה ב-$t=0,\frac{\pi}{2},\pi$.
      - kind: result
        text: >-
          נכון: (ב), (ג). לא נכון: (א), (ד).

  - id: W-2.1-06
    level: mid
    objectives: [OBJ-2.1-3, OBJ-2.1-2]
    prompt: >-
      מתחילים מהמעגל $x^2+y^2=9$.

      (א) מכווצים אותו פי 3 בכיוון ציר $y$: כל נקודה $(u,v)$ של המעגל עוברת לנקודה $(x,y)=\left(u,\frac{v}{3}\right)$.
      מהי המשוואה של
      העקום שמתקבל, ומהם חצאי הצירים שלו?

      (ב) את העקום של (א) מותחים פי 2 בכיוון ציר $x$. מהי המשוואה עכשיו?

      (ג) כתבו פרמטריזציה של העקום של (ב).

      (ד) האם הנקודה $\left(3\sqrt3,\frac12\right)$ נמצאת עליו? אם כן, לאיזה $t$ היא מתאימה?
    answer: >-
      (א) $x^2+9y^2=9$, כלומר $\frac{x^2}{9}+y^2=1$: $a=3$, $b=1$. (ב) $\frac{x^2}{36}+y^2=1$. (ג) $(6\cos t,\sin t)$,
      $0\le t<2\pi$. (ד) כן, $t=\frac{\pi}{6}$.
    solution:
      - kind: idea
        text: >-
          כיווץ פי 3 הוא מתיחה פי $\frac13$. הכלל אותו כלל: במשוואה מציבים את הפעולה ההפוכה. הנקודה החדשה $(x,y)$
          הגיעה מהנקודה $(u,v)=(x,3y)$ של המעגל, ולכן מציבים $3y$ במקום $y$. בכל שלב בודקים בנקודה אחת שיודעים לאן
          עברה.
      - kind: computation
        text: >-
          (א) מציבים $3y$ במקום $y$: $x^2+(3y)^2=9$, כלומר $x^2+9y^2=9$. מחלקים ב-9: $\frac{x^2}{9}+y^2=1$. זו אליפסה
          עם $a=3$ ו-$b=1$. בדיקה: הנקודה $(0,3)$ של המעגל עברה ל-$(0,1)$, ואכן $0+9\cdot1=9$.
      - kind: computation
        text: >-
          (ב) מתיחה פי 2 בכיוון $x$: מציבים $\frac{x}{2}$ במקום $x$ במשוואה של (א):
          $\frac{(x/2)^2}{9}+y^2=1$, כלומר $\frac{x^2}{36}+y^2=1$. עכשיו $a=6$, $b=1$. בדיקה: $(3,0)$ עברה ל-$(6,0)$,
          ואכן $\frac{36}{36}+0=1$.
      - kind: computation
        text: >-
          (ג) $(x,y)=(6\cos t,\sin t)$, $0\le t<2\pi$.
      - kind: computation
        text: >-
          (ד) מציבים במשוואה: $\frac{(3\sqrt3)^2}{36}+\left(\frac12\right)^2=\frac{27}{36}+\frac14=\frac34+\frac14=1$.
          הנקודה על העקום. לפרמטר: $6\cos t=3\sqrt3$ נותן $\cos t=\frac{\sqrt3}{2}$, ו-$\sin t=\frac12$. שניהם חיוביים,
          ולכן $t=\frac{\pi}{6}$.
      - kind: check
        text: >-
          מהמעגל המקורי אל העקום הסופי כל נקודה $(u,v)$ עברה ל-$\left(2u,\frac{v}{3}\right)$. חצאי הצירים היו 3 ו-3,
          ונעשו $2\cdot3=6$ ו-$\frac33=1$, כמו שיצא.
      - kind: result
        text: >-
          (א) $\frac{x^2}{9}+y^2=1$, $a=3$, $b=1$; (ב) $\frac{x^2}{36}+y^2=1$; (ג) $(6\cos t,\sin t)$; (ד) הנקודה על
          העקום, ב-$t=\frac{\pi}{6}$.

  - id: W-2.1-07
    level: mid
    objectives: [OBJ-2.1-2]
    prompt: >-
      נתונה האליפסה $(x,y)=(6\cos t,2\sin t)$, $0\le t<2\pi$.

      (א) מצאו את הנקודה שמתאימה ל-$t=\frac{\pi}{4}$, ואת הזווית שבין הקטע מהראשית אליה לבין ציר $x$ החיובי.

      (ב) לאיזה $t$ ברביע הראשון הנקודה נמצאת על הישר $y=x$? מהי הנקודה?

      (ג) לאילו ערכים של $t$ הזווית של הנקודה מעל ציר $x$ החיובי (נגד כיוון השעון) שווה בדיוק ל-$t$?
    answer: >-
      (א) $(3\sqrt2,\sqrt2)$, בזווית $\arctan\frac13\approx18.4^\circ$. (ב) $t=\arctan3\approx1.249$ (בערך $71.6^\circ$);
      הנקודה $\left(\frac{3\sqrt{10}}{5},\frac{3\sqrt{10}}{5}\right)\approx(1.897,1.897)$. (ג) רק $t=0,\frac{\pi}{2},\pi,\frac{3\pi}{2}$.
    solution:
      - kind: idea
        text: >-
          באליפסה הפרמטר אינו הזווית של הנקודה. הזווית נקבעת מהשיפוע של הקטע מהראשית, $\frac{y}{x}=\frac{2\sin t}{6\cos t}=\frac13\tan t$,
          והשיפוע הזה קטן פי 3 מ-$\tan t$.
      - kind: computation
        text: >-
          (א) $x=6\cdot\frac{\sqrt2}{2}=3\sqrt2$ ו-$y=2\cdot\frac{\sqrt2}{2}=\sqrt2$. השיפוע $\frac{\sqrt2}{3\sqrt2}=\frac13$,
          והנקודה ברביע הראשון, ולכן הזווית היא $\arctan\frac13\approx18.4^\circ$, הרבה פחות מ-$45^\circ$.
      - kind: computation
        text: >-
          (ב) על הישר $y=x$ השיפוע הוא 1: $\frac13\tan t=1$, כלומר $\tan t=3$, וברביע הראשון
          $t=\arctan3\approx1.249$ רדיאנים, בערך $71.6^\circ$.
      - kind: step
        text: >-
          כדי לקבל את הנקודה במדויק צריך את $\cos t$ ואת $\sin t$ כש-$\tan t=3$. במשולש ישר זווית עם ניצבים 1 ו-3 היתר
          הוא $\sqrt{10}$, ולכן $\cos t=\frac{1}{\sqrt{10}}$ ו-$\sin t=\frac{3}{\sqrt{10}}$. הנקודה:
          $x=\frac{6}{\sqrt{10}}=\frac{3\sqrt{10}}{5}$ ו-$y=\frac{6}{\sqrt{10}}=\frac{3\sqrt{10}}{5}\approx1.897$.
      - kind: step
        text: >-
          (ג) על הצירים: ב-$t=0,\frac{\pi}{2},\pi,\frac{3\pi}{2}$ הנקודות הן $(6,0)$, $(0,2)$, $(-6,0)$, $(0,-2)$, והזוויות
          שלהן הן בדיוק הערכים האלה. בכל $t$ אחר $\tan t$ מוגדר ושונה מאפס, והשיפוע של הנקודה, $\frac13\tan t$, שונה
          מ-$\tan t$. לכן הזווית שלה אינה $t$.
      - kind: check
        text: >-
          את (ב) אפשר לפתור גם בלי פרמטר. המשוואה הקרטזית היא $\frac{x^2}{36}+\frac{y^2}{4}=1$; מציבים $y=x$:
          $x^2\left(\frac{1}{36}+\frac14\right)=\frac{10}{36}x^2=1$, ולכן $x^2=\frac{18}{5}$ ו-$x=\frac{3\sqrt{10}}{5}$, אותה
          נקודה.
      - kind: result
        text: >-
          (א) $(3\sqrt2,\sqrt2)$, בזווית של בערך $18.4^\circ$; (ב) $t=\arctan3$, הנקודה $\left(\frac{3\sqrt{10}}{5},\frac{3\sqrt{10}}{5}\right)$;
          (ג) הפרמטר שווה לזווית רק בארבע הנקודות שעל הצירים.

  - id: W-2.1-08
    level: exam
    objectives: [OBJ-2.1-3, OBJ-2.1-2]
    prompt: >-
      נתון העקום $16x^2+y^2+96x-10y+153=0$.

      (א) הביאו אותו לצורה הסטנדרטית, ומצאו את המרכז ואת חצאי הצירים.

      (ב) מצאו את ארבע הנקודות הקיצוניות שלו.

      (ג) כתבו לו פרמטריזציה.

      (ד) האם העקום חותך את ציר $x$? ואת ציר $y$? ענו פעם מתוך התשובה של (ב), ופעם בהצבה.

      (ה) מצאו את נקודות החיתוך שלו עם הישר $x=-\frac72$.
    answer: >-
      (א) $(x+3)^2+\frac{(y-5)^2}{16}=1$: מרכז $(-3,5)$, $a=1$, $b=4$. (ב) $(-2,5)$, $(-4,5)$, $(-3,9)$, $(-3,1)$.
      (ג) $(-3+\cos t,\,5+4\sin t)$, $0\le t<2\pi$. (ד) לא ולא. (ה) $\left(-\frac72,\,5\pm2\sqrt3\right)$.
    solution:
      - kind: idea
        text: >-
          השלמה לריבוע, פעם ב-$x$ ופעם ב-$y$, מביאה את המשוואה לצורה $\frac{(x-h)^2}{a^2}+\frac{(y-k)^2}{b^2}=1$. משם
          קוראים את המרכז ואת חצאי הצירים, והם עונים על כל השאר.
      - kind: computation
        text: >-
          (א) מקבצים ומוציאים את המקדם של $x^2$: $16(x^2+6x)+(y^2-10y)+153=0$. משלימים (חצי מהמקדם, ומחסירים את
          הריבוע שלו: 3 ו-9 ב-$x$, $-5$ ו-25 ב-$y$): $x^2+6x=(x+3)^2-9$ ו-$y^2-10y=(y-5)^2-25$.
      - kind: computation
        text: >-
          מציבים, וזוכרים שה-9 מוכפל ב-16: $16(x+3)^2-144+(y-5)^2-25+153=0$. המספרים: $-144-25+153=-16$. לכן
          $16(x+3)^2+(y-5)^2=16$, ואחרי חילוק ב-16: $(x+3)^2+\frac{(y-5)^2}{16}=1$.
      - kind: step
        text: >-
          קוראים: המרכז $(-3,5)$; מתחת ל-$(x+3)^2$ המכנה 1, ולכן $a=1$; מתחת ל-$(y-5)^2$ המכנה 16, ולכן $b=4$. אליפסה
          צרה וגבוהה.
      - kind: computation
        text: >-
          (ב) $(h\pm a,k)$: $(-2,5)$ ו-$(-4,5)$. $(h,k\pm b)$: $(-3,9)$ ו-$(-3,1)$.
      - kind: computation
        text: >-
          (ג) $(x,y)=(-3+\cos t,\,5+4\sin t)$, $0\le t<2\pi$.
      - kind: step
        text: >-
          (ד) מתוך (ב): על האליפסה $-4\le x\le-2$ ו-$1\le y\le9$. $y$ אינו מתאפס, ולכן אין חיתוך עם ציר $x$; $x$ אינו
          מתאפס, ולכן אין חיתוך עם ציר $y$. בהצבה: עם $y=0$ מקבלים $(x+3)^2+\frac{25}{16}=1$, כלומר $(x+3)^2=-\frac{9}{16}$,
          ואין פתרון. עם $x=0$ מקבלים $9+\frac{(y-5)^2}{16}=1$, ושוב ריבוע ששווה למספר שלילי.
      - kind: computation
        text: >-
          (ה) מציבים $x=-\frac72$: $\left(-\frac72+3\right)^2=\frac14$, ולכן $\frac{(y-5)^2}{16}=\frac34$, $(y-5)^2=12$ ו-
          $y=5\pm2\sqrt3$. הנקודות: $\left(-\frac72,5+2\sqrt3\right)\approx(-3.5,8.46)$ ו-$\left(-\frac72,5-2\sqrt3\right)\approx(-3.5,1.54)$.
      - kind: check
        text: >-
          הנקודה העליונה $(-3,9)$ במשוואה המקורית: $144+81-288-90+153=0$. והנקודה הימנית $(-2,5)$:
          $64+25-192-50+153=0$. ב-(ה) שתי הנקודות נמצאות בין $y=1$ ל-$y=9$, כנדרש.
      - kind: result
        text: >-
          $(x+3)^2+\frac{(y-5)^2}{16}=1$: אליפסה שמרכזה $(-3,5)$ עם $a=1$, $b=4$; נקודות קיצוניות $(-2,5)$, $(-4,5)$,
          $(-3,9)$, $(-3,1)$; פרמטריזציה $(-3+\cos t,5+4\sin t)$; אין חיתוך עם הצירים; חיתוך עם $x=-\frac72$ בנקודות
          $\left(-\frac72,5\pm2\sqrt3\right)$.

  - id: W-2.1-09
    level: exam
    objectives: [OBJ-2.1-1, OBJ-2.1-2, OBJ-2.1-3]
    prompt: >-
      חלקיק נע במישור לפי $x=3-2\cos t$, $y=1+4\sin t$, $0\le t<2\pi$.

      (א) מצאו משוואה קרטזית של המסלול, וזהו אותו: מרכז וחצאי צירים.

      (ב) מאיזו נקודה החלקיק יוצא, ובאיזה כיוון הוא מקיף את המסלול?

      (ג) מתי, ובאילו נקודות, החלקיק חוצה את הישר $y=3$?

      (ד) כתבו פרמטריזציה אחרת של אותו מסלול, שיוצאת מהנקודה הימנית ביותר ונעה נגד כיוון השעון.

      (ה) מתי החלקיק רחוק ביותר ממרכז המסלול, ומה המרחק אז?
    answer: >-
      (א) $\frac{(x-3)^2}{4}+\frac{(y-1)^2}{16}=1$: מרכז $(3,1)$, $a=2$, $b=4$. (ב) מ-$(1,1)$, עם כיוון השעון.
      (ג) ב-$t=\frac{\pi}{6}$ ב-$(3-\sqrt3,3)$, וב-$t=\frac{5\pi}{6}$ ב-$(3+\sqrt3,3)$. (ד) $(3+2\cos t,\,1+4\sin t)$.
      (ה) ב-$t=\frac{\pi}{2}$ וב-$t=\frac{3\pi}{2}$, במרחק 4.
    solution:
      - kind: idea
        text: >-
          מסלקים את הפרמטר: מבודדים את $\cos t$ ואת $\sin t$, מעלים בריבוע ומחברים. המינוס שלפני הקוסינוס אינו משנה
          את קבוצת הנקודות (הוא נעלם בריבוע), אבל הוא משנה את נקודת ההתחלה ואת הכיוון, ואותם בודקים בהצבה.
      - kind: computation
        text: >-
          (א) $\cos t=\frac{3-x}{2}$ ו-$\sin t=\frac{y-1}{4}$. לכן $\frac{(3-x)^2}{4}+\frac{(y-1)^2}{16}=1$, ומכיוון
          ש-$(3-x)^2=(x-3)^2$: $\frac{(x-3)^2}{4}+\frac{(y-1)^2}{16}=1$. אליפסה שמרכזה $(3,1)$, עם $a=2$ ו-$b=4$.
      - kind: computation
        text: >-
          (ב) ב-$t=0$: $(3-2,\,1+0)=(1,1)$, הנקודה **השמאלית** ביותר. ב-$t=\frac{\pi}{2}$: $(3-0,\,1+4)=(3,5)$, הנקודה
          העליונה. ב-$t=\pi$: $(5,1)$, הימנית. משמאל, למעלה, ימינה: עם כיוון השעון.
      - kind: computation
        text: >-
          (ג) $1+4\sin t=3$ נותן $\sin t=\frac12$, כלומר $t=\frac{\pi}{6}$ או $t=\frac{5\pi}{6}$. ב-$t=\frac{\pi}{6}$:
          $x=3-2\cdot\frac{\sqrt3}{2}=3-\sqrt3\approx1.27$. ב-$t=\frac{5\pi}{6}$: $x=3-2\cdot\left(-\frac{\sqrt3}{2}\right)=3+\sqrt3\approx4.73$.
      - kind: step
        text: >-
          (ד) הפרמטריזציה הרגילה של אותה אליפסה: $(x,y)=(3+2\cos t,\,1+4\sin t)$, $0\le t<2\pi$. ב-$t=0$ היא ב-$(5,1)$,
          הנקודה הימנית, וב-$t=\frac{\pi}{2}$ ב-$(3,5)$: מימין למעלה, נגד כיוון השעון.
      - kind: computation
        text: >-
          (ה) ריבוע המרחק מהמרכז $(3,1)$: $(x-3)^2+(y-1)^2=4\cos^2t+16\sin^2t=4+12\sin^2t$, כי $4\cos^2t=4-4\sin^2t$
          (כך נשארים עם פונקציה אחת של $t$, וקל לראות מתי הביטוי הגדול ביותר). הוא
          הגדול ביותר כש-$\sin^2t=1$, כלומר ב-$t=\frac{\pi}{2}$ וב-$t=\frac{3\pi}{2}$, ואז הוא 16: המרחק 4. אלה הנקודות
          $(3,5)$ ו-$(3,-3)$, קצות הציר הארוך.
      - kind: check
        text: >-
          ב-(ג), ישירות מהמשוואה הקרטזית: עם $y=3$ מקבלים $\frac{(x-3)^2}{4}+\frac{4}{16}=1$, כלומר $(x-3)^2=3$ ו-
          $x=3\pm\sqrt3$, אותן נקודות. וב-(ה) המרחק הגדול ביותר הוא חצי הציר הגדול, $b=4$, והקטן ביותר הוא $a=2$.
      - kind: result
        text: >-
          המסלול הוא האליפסה $\frac{(x-3)^2}{4}+\frac{(y-1)^2}{16}=1$; החלקיק יוצא מ-$(1,1)$ ומקיף אותה עם כיוון השעון;
          חוצה את $y=3$ ב-$t=\frac{\pi}{6}$ וב-$t=\frac{5\pi}{6}$; פרמטריזציה נגד כיוון השעון מ-$(5,1)$:
          $(3+2\cos t,1+4\sin t)$; המרחק הגדול ביותר מהמרכז הוא 4.

  - id: W-2.1-10
    level: exam
    qualitative: true
    objectives: [OBJ-2.1-3, OBJ-2.1-2]
    prompt: >-
      תלמיד התבקש לכתוב את המשוואה של העקום שמתקבל ממעגל היחידה אחרי מתיחה פי 2 בכיוון ציר $x$ ופי 3 בכיוון ציר
      $y$, ואחריה הזזה של יחידה אחת ימינה ו-4 יחידות למעלה. הוא כתב:

      **שלב 1.** אחרי המתיחה: $(2x)^2+(3y)^2=1$, כלומר $4x^2+9y^2=1$.

      **שלב 2.** אחרי ההזזה: $4(x+1)^2+9(y+4)^2=1$.

      (א) בלי לפתור מחדש: עקבו אחרי הנקודה $(1,0)$ של מעגל היחידה, והראו שהתשובה של התלמיד שגויה.

      (ב) מהי הטעות בכל אחד מהשלבים? מה משותף לשתיהן?

      (ג) כתבו את המשוואה הנכונה ופרמטריזציה של העקום.

      (ד) איזה עקום תיאר התלמיד בפועל?
    answer: >-
      (א) $(1,0)$ עוברת ל-$(2,0)$ ואז ל-$(3,4)$, ובמשוואה של התלמיד $4\cdot16+9\cdot64=640\ne1$. (ב) בשני השלבים הוצבה
      הפעולה עצמה במקום ההפוכה לה. (ג) $\frac{(x-1)^2}{4}+\frac{(y-4)^2}{9}=1$; $(1+2\cos t,\,4+3\sin t)$. (ד) אליפסה
      שמרכזה $(-1,-4)$ עם חצאי צירים $\frac12$ ו-$\frac13$.
    solution:
      - kind: idea
        text: >-
          משוואה בוחנת את הנקודה שממנה הגענו, ולכן מציבים בה את הפעולה ההפוכה למה שנעשה לנקודות. הבדיקה הפשוטה ביותר
          לכל שאלה כזו: לעקוב אחרי נקודה אחת של העקום המקורי ולהציב את המקום החדש שלה במשוואה.
      - kind: computation
        text: >-
          (א) המתיחה מעבירה את $(1,0)$ ל-$(2\cdot1,\,3\cdot0)=(2,0)$, וההזזה מעבירה את $(2,0)$ ל-$(3,4)$. במשוואה של
          התלמיד: $4(3+1)^2+9(4+4)^2=64+576=640\ne1$. הנקודה חייבת להיות על העקום, ולכן המשוואה שגויה.
      - kind: step
        text: >-
          (ב) שלב 1: כדי למתוח פי 2 בכיוון $x$ מציבים $\frac{x}{2}$, לא $2x$; וכך גם $\frac{y}{3}$ ולא $3y$. הצבה של
          $2x$ ושל $3y$ מכווצת. שלב 2: כדי להזיז ב-$(1,4)$ מציבים $x-1$ ו-$y-4$, לא $x+1$ ו-$y+4$. הצבה של $x+1$ מזיזה
          שמאלה. המשותף: בשני השלבים התלמיד עשה ל-$x$ ול-$y$ את מה שעושים לנקודות, במקום את הדרך חזרה.
      - kind: computation
        text: >-
          (ג) מתיחה: $\left(\frac{x}{2}\right)^2+\left(\frac{y}{3}\right)^2=1$, כלומר $\frac{x^2}{4}+\frac{y^2}{9}=1$. הזזה:
          $\frac{(x-1)^2}{4}+\frac{(y-4)^2}{9}=1$. הפרמטריזציה עוברת את הפעולות עצמן: $(\cos t,\sin t)$ נמתחת ל-
          $(2\cos t,3\sin t)$ ומוזזת ל-$(x,y)=(1+2\cos t,\,4+3\sin t)$, $0\le t<2\pi$.
      - kind: step
        text: >-
          (ד) כותבים את המשוואה של התלמיד בצורה הסטנדרטית: $4(x+1)^2=\frac{(x+1)^2}{1/4}$ ו-$9(y+4)^2=\frac{(y+4)^2}{1/9}$.
          אגף ימין כבר 1, ולכן מותר לקרוא את המכנים: $a^2=\frac14$, $b^2=\frac19$: אליפסה קטנה שמרכזה $(-1,-4)$, עם $a=\frac12$ ו-$b=\frac13$.
          כל אחת מהפעולות בוצעה "הפוך": כיווץ במקום מתיחה, והזזה לכיוון הנגדי.
      - kind: check
        text: >-
          הנקודה $(3,4)$ במשוואה הנכונה: $\frac{(3-1)^2}{4}+0=1$. ועוד נקודה: $(0,1)$ עוברת ל-$(0,3)$ ואז ל-$(1,7)$, ואכן
          $0+\frac{(7-4)^2}{9}=1$. בפרמטריזציה: $t=0$ נותן $(3,4)$ ו-$t=\frac{\pi}{2}$ נותן $(1,7)$.
      - kind: result
        text: >-
          המשוואה הנכונה היא $\frac{(x-1)^2}{4}+\frac{(y-4)^2}{9}=1$, עם הפרמטריזציה $(1+2\cos t,4+3\sin t)$. התלמיד הציב
          בשני השלבים את הפעולה עצמה במקום ההפוכה לה, וקיבל אליפסה שמרכזה $(-1,-4)$ עם חצאי צירים $\frac12$ ו-$\frac13$.

challenge:
  - id: W-2.1-c1
    stars: 1
    objectives: [OBJ-2.1-1, OBJ-2.1-3]
    prompt: >-
      (א) הראו שלכל $h$, $k$ ו-$r>0$, המשוואות $x=h+r\cos\theta$, $y=k+r\sin\theta$, $0\le\theta<2\pi$, מתארות מעגל,
      ושכל נקודה של המעגל הזה מתקבלת.

      (ב) כתבו בצורה הזו את המעגל שמרכזו $(-2,3)$ ורדיוסו 5.

      (ג) באילו נקודות המעגל של (ב) חותך את ציר $x$, ולאילו ערכים של $\theta$ הן מתאימות?

      (ד) באילו נקודות הוא חותך את ציר $y$? מה אורך המיתר שהמעגל חותך מציר $x$?
    answer: >-
      (א) $(x-h)^2+(y-k)^2=r^2\cos^2\theta+r^2\sin^2\theta=r^2$. (ב) $x=-2+5\cos\theta$, $y=3+5\sin\theta$.
      (ג) $(2,0)$ ב-$\theta=2\pi-\arccos\frac45\approx5.640$, ו-$(-6,0)$ ב-$\theta=\pi+\arccos\frac45\approx3.785$.
      (ד) $\left(0,3\pm\sqrt{21}\right)$; אורך המיתר 8.
    solution:
      - kind: idea
        text: >-
          זה המעגל הכללי של השיעור, עם $\theta$ בתפקיד הפרמטר. ב-(א) יש שני כיוונים: כל נקודה שהנוסחאות נותנות
          נמצאת על המעגל (סילוק הפרמטר), וכל נקודה של המעגל מתקבלת (חוזרים אל מעגל היחידה). ב-(ג) שיעור $y$ שווה
          אפס קובע את $\sin\theta$, והשאר נובע מהזהות $\cos^2\theta+\sin^2\theta=1$.
      - kind: computation
        text: >-
          (א) כיוון ראשון: $x-h=r\cos\theta$ ו-$y-k=r\sin\theta$, ולכן $(x-h)^2+(y-k)^2=r^2(\cos^2\theta+\sin^2\theta)=r^2$.
          כל הנקודות על המעגל שמרכזו $(h,k)$ ורדיוסו $r$.
      - kind: step
        text: >-
          כיוון שני: תהי $(x,y)$ נקודה עם $(x-h)^2+(y-k)^2=r^2$. מחלקים ב-$r^2$:
          $\left(\frac{x-h}{r}\right)^2+\left(\frac{y-k}{r}\right)^2=1$. כלומר הנקודה $\left(\frac{x-h}{r},\frac{y-k}{r}\right)$
          נמצאת על מעגל היחידה, ולכן היא $(\cos\theta,\sin\theta)$ לזווית אחת $\theta$ בקטע $0\le\theta<2\pi$. מכאן
          $x=h+r\cos\theta$ ו-$y=k+r\sin\theta$.
      - kind: computation
        text: >-
          (ב) $x=-2+5\cos\theta$, $y=3+5\sin\theta$, $0\le\theta<2\pi$. המשוואה הקרטזית: $(x+2)^2+(y-3)^2=25$.
      - kind: computation
        text: >-
          (ג) $y=0$ נותן $3+5\sin\theta=0$, כלומר $\sin\theta=-\frac35$. אז $\cos^2\theta=1-\frac{9}{25}=\frac{16}{25}$ ו-
          $\cos\theta=\pm\frac45$. עם $+\frac45$: $x=-2+4=2$. עם $-\frac45$: $x=-2-4=-6$. הנקודות $(2,0)$ ו-$(-6,0)$.
      - kind: step
        text: >-
          הזוויות, כמו בסעיף "הפרמטר בקטע הנתון" בשיעור. $\arccos\frac45\approx0.6435$ היא זווית ברביע הראשון, עם
          קוסינוס $\frac45$ וסינוס $+\frac35$. כאן $\sin\theta<0$, ולכן שתי הזוויות בחצי התחתון של המעגל. הראשונה היא
          השיקוף של $\arccos\frac45$ בציר $x$, והשנייה נמצאת חצי סיבוב אחרי $\arccos\frac45$, בדיוק מולה. קוסינוס חיובי וסינוס שלילי
          הוא הרביע הרביעי:
          $\theta=2\pi-\arccos\frac45\approx6.2832-0.6435\approx5.640$. קוסינוס שלילי וסינוס שלילי הוא הרביע השלישי:
          $\theta=\pi+\arccos\frac45\approx3.1416+0.6435\approx3.785$.
      - kind: computation
        text: >-
          (ד) $x=0$ במשוואה הקרטזית: $4+(y-3)^2=25$, ולכן $(y-3)^2=21$ ו-$y=3\pm\sqrt{21}$, בערך $7.583$ ו-$-1.583$.
          המיתר על ציר $x$ הוא הקטע מ-$(-6,0)$ עד $(2,0)$, ואורכו $2-(-6)=8$.
      - kind: check
        text: >-
          $(2,0)$: $(2+2)^2+(0-3)^2=16+9=25$. $(-6,0)$: $16+9=25$. המיתר: המרכז נמצא בגובה 3 מעל ציר $x$, והרדיוס 5,
          ולכן חצי המיתר הוא $\sqrt{25-9}=4$ (משולש 3, 4, 5), והמיתר כולו 8. האמצע שלו, $(-2,0)$, נמצא בדיוק מתחת
          למרכז.
      - kind: result
        text: >-
          $x=h+r\cos\theta$, $y=k+r\sin\theta$ הוא המעגל $(x-h)^2+(y-k)^2=r^2$ כולו. למעגל שמרכזו $(-2,3)$ ורדיוסו 5:
          $x=-2+5\cos\theta$, $y=3+5\sin\theta$; חיתוך עם ציר $x$ ב-$(2,0)$ וב-$(-6,0)$, מיתר באורך 8; חיתוך עם ציר
          $y$ ב-$\left(0,3\pm\sqrt{21}\right)$.
    source:
      name: 'OpenStax, Calculus Volume 2 (G. Strang, E. Herman), Section 7.1 Parametric Equations'
      year: 2016
      problem: 'Exercises 49 and 50'
      url: https://openstax.org/books/calculus-volume-2/pages/7-1-parametric-equations
      verified: '2026-11-18'
      adapted: true

  - id: W-2.1-c2
    stars: 1
    objectives: [OBJ-2.1-2, OBJ-2.1-1]
    prompt: >-
      נתונה האליפסה $\frac{x^2}{4}+\frac{y^2}{49}=1$.

      (א) כתבו לה פרמטריזציה שנמצאת ב-$t=0$ בנקודה $(0,-7)$ ומקיפה את האליפסה **עם** כיוון השעון.

      (ב) שנו את התשובה כך שההתחלה תישאר ב-$(0,-7)$ והכיוון יתהפך.

      (ג) בפרמטריזציה של (א), היכן נמצאת הנקודה ב-$t=\frac{\pi}{4}$ וב-$t=\frac{2\pi}{3}$?

      (ד) הראו שהפרמטריזציה של (א) היא הפרמטריזציה הרגילה, $(2\cos s,7\sin s)$, עם $s=-t-\frac{\pi}{2}$. מה אומר
      המינוס שלפני $t$, ומה אומר ה-$\frac{\pi}{2}$?
    answer: >-
      (א) $(x,y)=(-2\sin t,\,-7\cos t)$, $0\le t<2\pi$. (ב) $(2\sin t,\,-7\cos t)$. (ג) $\left(-\sqrt2,-\frac{7\sqrt2}{2}\right)$
      ו-$\left(-\sqrt3,\frac72\right)$. (ד) $2\cos\left(-t-\frac{\pi}{2}\right)=-2\sin t$ ו-$7\sin\left(-t-\frac{\pi}{2}\right)=-7\cos t$;
      המינוס הופך את הכיוון, וה-$\frac{\pi}{2}$ מעביר את ההתחלה לנקודה התחתונה.
    solution:
      - kind: idea
        text: >-
          כל פרמטריזציה של האליפסה הזו בנויה מ-2 כפול פונקציה אחת ומ-7 כפול השנייה, כשהשתיים הן קוסינוס וסינוס של
          אותה זווית, עם סימנים. נקודת ההתחלה קובעת איזו מהן מתאפסת ב-$t=0$, והכיוון קובע את הסימן של האחרת. בודקים
          בהצבה של $t=0$ ושל $t=\frac{\pi}{2}$.
      - kind: step
        text: >-
          (א) ב-$t=0$ צריך $x=0$ ו-$y=-7$. $\sin0=0$ ו-$\cos0=1$, ולכן $x$ בנוי מסינוס ו-$y=-7\cos t$. נשאר הסימן של
          $x$: $x=2\sin t$ או $x=-2\sin t$. עם כיוון השעון, מהנקודה התחתונה ממשיכים **שמאלה** (ציירו: למטה, שמאלה,
          למעלה, ימינה). לכן מיד אחרי $t=0$ צריך $x<0$, כלומר $x=-2\sin t$.
      - kind: computation
        text: >-
          בודקים את $(x,y)=(-2\sin t,-7\cos t)$. על האליפסה: $\frac{4\sin^2t}{4}+\frac{49\cos^2t}{49}=\sin^2t+\cos^2t=1$.
          ב-$t=0$: $(0,-7)$. ב-$t=\frac{\pi}{2}$: $(-2,0)$, הנקודה השמאלית. מלמטה שמאלה: עם כיוון השעון.
      - kind: computation
        text: >-
          (ב) הופכים את הסימן של $x$: $(2\sin t,-7\cos t)$. ב-$t=0$ עדיין $(0,-7)$, וב-$t=\frac{\pi}{2}$ הנקודה $(2,0)$,
          הימנית: מלמטה ימינה, נגד כיוון השעון.
      - kind: computation
        text: >-
          (ג) ב-$t=\frac{\pi}{4}$: $\left(-2\cdot\frac{\sqrt2}{2},\,-7\cdot\frac{\sqrt2}{2}\right)=\left(-\sqrt2,-\frac{7\sqrt2}{2}\right)$.
          ב-$t=\frac{2\pi}{3}$: $\left(-2\cdot\frac{\sqrt3}{2},\,-7\cdot\left(-\frac12\right)\right)=\left(-\sqrt3,\frac72\right)$.
      - kind: computation
        text: >-
          (ד) נשענים על זהויות מהתיכון: $\cos(-\alpha)=\cos\alpha$, $\sin(-\alpha)=-\sin\alpha$,
          $\cos\left(\alpha+\frac{\pi}{2}\right)=-\sin\alpha$ ו-$\sin\left(\alpha+\frac{\pi}{2}\right)=\cos\alpha$. (את
          כולן רואים על מעגל היחידה: שיקוף בציר $x$ מעביר את $(\cos\alpha,\sin\alpha)$ ל-$(\cos\alpha,-\sin\alpha)$, ורבע
          סיבוב נגד כיוון השעון מעביר אותה ל-$(-\sin\alpha,\cos\alpha)$.) לכן
          $\cos\left(-t-\frac{\pi}{2}\right)=\cos\left(t+\frac{\pi}{2}\right)=-\sin t$
          ו-$\sin\left(-t-\frac{\pi}{2}\right)=-\sin\left(t+\frac{\pi}{2}\right)=-\cos t$. לכן
          $(2\cos s,7\sin s)=(-2\sin t,-7\cos t)$, הפרמטריזציה של (א).
      - kind: step
        text: >-
          כש-$t$ גדל, $s=-t-\frac{\pi}{2}$ **קטן**: הנקודה עוברת על הפרמטריזציה הרגילה לאחור, כלומר עם כיוון השעון. זה
          המינוס. וב-$t=0$ מקבלים $s=-\frac{\pi}{2}$, שמתאים לנקודה התחתונה $(0,-7)$ במקום לנקודה הימנית: זה ה-$\frac{\pi}{2}$.
          כל הפרמטריזציות של השיעור הן הפרמטריזציה הרגילה עם שעון שהוזז, ולפעמים גם הופנה לאחור.
      - kind: check
        text: >-
          הנקודה של $t=\frac{2\pi}{3}$ על האליפסה: $\frac{3}{4}+\frac{49/4}{49}=\frac34+\frac14=1$. היא ברביע השני, אחרי
          הנקודה השמאלית $(-2,0)$ ולפני העליונה $(0,7)$, כמו שצריך בתנועה עם כיוון השעון שהתחילה למטה.
      - kind: result
        text: >-
          (א) $(-2\sin t,-7\cos t)$; (ב) $(2\sin t,-7\cos t)$; (ג) $\left(-\sqrt2,-\frac{7\sqrt2}{2}\right)$ ו-
          $\left(-\sqrt3,\frac72\right)$; (ד) זו הפרמטריזציה הרגילה עם $s=-t-\frac{\pi}{2}$: המינוס הופך את הכיוון,
          וה-$\frac{\pi}{2}$ קובע את נקודת ההתחלה.
    source:
      name: "Paul's Online Notes (P. Dawkins), Calculus II, Section 9.1 Parametric Equations and Curves, Practice Problems"
      year: 2026
      problem: 'Problem 14'
      url: https://tutorial.math.lamar.edu/Solutions/CalcII/ParametricEqn/Prob14.aspx
      verified: '2026-11-18'
      adapted: true
