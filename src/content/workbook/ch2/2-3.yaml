# Workbook of lesson 2.3 — polar coordinates.
# Objectives (src/course.ts):
#   OBJ-2.3-1  Cartesian <-> polar in both directions, the angle in the right quadrant
#   OBJ-2.3-2  sketch curves given by a polar equation, translate a Cartesian equation to polar
#   OBJ-2.3-3  regions such as an annulus or a sector in polar coordinates
# Convention: r >= 0; each problem states the range of θ it wants.
# Every number recomputed with sympy in screens/tools/lesson-2-3.py.
lesson: '2.3'
practice:
  - id: W-2.3-01
    level: basic
    objectives: [OBJ-2.3-1]
    prompt: >-
      שלוש נקודות נתונות בקואורדינטות קוטביות $(r,\theta)$:

      $$\left(3,\frac{5\pi}{4}\right),\qquad \left(2,-\frac{\pi}{6}\right),\qquad (5,\pi).$$

      לכל אחת אמרו קודם, בלי לחשב, באיזה רביע או על איזה ציר היא נמצאת, ואחר כך מצאו את הקואורדינטות הקרטזיות שלה.
    answer: >-
      $\left(-\frac{3\sqrt2}{2},-\frac{3\sqrt2}{2}\right)$, ברביע השלישי; $(\sqrt3,-1)$, ברביע הרביעי; $(-5,0)$, על החלק
      השלילי של ציר $x$.
    solution:
      - kind: idea
        text: >-
          הזווית אומרת את הכיוון, ולכן את הרביע, עוד לפני החישוב; זו בדיקה מוכנה מראש לסימנים. אחר כך מציבים
          ב-$x=r\cos\theta$, $y=r\sin\theta$.
      - kind: step
        text: >-
          הרביעים: $\frac{5\pi}{4}$ בין $\pi$ ל-$\frac{3\pi}{2}$, הרביע השלישי ($x<0$, $y<0$). הזווית $-\frac{\pi}{6}$
          שלילית וקטנה, כלומר מעט מתחת לכיוון החיובי של ציר $x$: הרביע הרביעי ($x>0$, $y<0$). הזווית $\pi$ היא הכיוון
          השלילי של ציר $x$.
      - kind: computation
        text: >-
          $\left(3,\frac{5\pi}{4}\right)$: $\cos\frac{5\pi}{4}=\sin\frac{5\pi}{4}=-\frac{\sqrt2}{2}$, ולכן
          $x=y=-\frac{3\sqrt2}{2}\approx-2.12$.
      - kind: computation
        text: >-
          $\left(2,-\frac{\pi}{6}\right)$: $x=2\cos\left(-\frac{\pi}{6}\right)=2\cdot\frac{\sqrt3}{2}=\sqrt3$, ו-
          $y=2\sin\left(-\frac{\pi}{6}\right)=2\cdot\left(-\frac12\right)$, כלומר $y=-1$.
      - kind: computation
        text: >-
          $(5,\pi)$: $x=5\cos\pi$, כלומר $x=-5$, ו-$y=5\sin\pi=0$.
      - kind: check
        text: >-
          הסימנים מתאימים לרביעים שקבענו מראש. והמרחק מהראשית חוזר: $\sqrt{\frac{18}{4}+\frac{18}{4}}=\sqrt9=3$,
          $\sqrt{3+1}=2$, $\sqrt{25+0}=5$.
      - kind: result
        text: >-
          $\left(-\frac{3\sqrt2}{2},-\frac{3\sqrt2}{2}\right)$, $(\sqrt3,-1)$ ו-$(-5,0)$.

  - id: W-2.3-02
    level: basic
    objectives: [OBJ-2.3-1]
    prompt: >-
      מצאו את הקואורדינטות הקוטביות של ארבע הנקודות

      $$(-5,5),\qquad (0,4),\qquad (2,-2\sqrt3),\qquad (-\sqrt3,-1),$$

      פעם עם $0\le\theta<2\pi$ ופעם עם $-\pi<\theta\le\pi$. לאילו מהנקודות יוצאת אותה זווית בשני הטווחים, ולמה?
    answer: >-
      $\left(5\sqrt2,\frac{3\pi}{4}\right)$; $\left(4,\frac{\pi}{2}\right)$; $\left(4,\frac{5\pi}{3}\right)$, ובטווח השני
      $\theta=-\frac{\pi}{3}$; $\left(2,\frac{7\pi}{6}\right)$, ובטווח השני $\theta=-\frac{5\pi}{6}$. לשתי הראשונות אותה
      זווית בשני הטווחים, כי הן בחצי המישור העליון.
    solution:
      - kind: idea
        text: >-
          המתכון: מרחק, רביע לפי הסימנים, זווית עזר $\arctan\frac{y}{x}$, ותיקון לפי הרביע. שני הטווחים נבדלים רק
          בנקודות שמתחת לציר $x$: שם הזווית בטווח $[0,2\pi)$ גדולה מ-$\pi$, ובטווח $(-\pi,\pi]$ היא אותה זווית פחות
          $2\pi$. זה הכלל האחד של השיעור (הסעיף "הזווית ברביע הנכון"); התיקונים הישירים מזווית העזר נובעים ממנו.
      - kind: computation
        text: >-
          $(-5,5)$: $r=\sqrt{25+25}=5\sqrt2\approx7.07$. הרביע השני. זווית העזר $\arctan\frac{5}{-5}=\arctan(-1)$, שהיא
          $-\frac{\pi}{4}$; מכיוון ש-$x<0$ מוסיפים $\pi$: $\theta=\frac{3\pi}{4}$.
      - kind: computation
        text: >-
          $(0,4)$: $r=4$. הנקודה על החלק החיובי של ציר $y$, ואין מנה לחשב: $\theta=\frac{\pi}{2}$.
      - kind: computation
        text: >-
          $(2,-2\sqrt3)$: $r=\sqrt{4+12}=4$. הרביע הרביעי. זווית העזר $\arctan\frac{-2\sqrt3}{2}=\arctan(-\sqrt3)$, שהיא
          $-\frac{\pi}{3}$. הכיוון נכון ($x>0$). בטווח $[0,2\pi)$ מוסיפים $2\pi$: $\theta=\frac{5\pi}{3}$. בטווח
          $(-\pi,\pi]$ מחסירים את ה-$2\pi$ בחזרה, כלומר זווית העזר עצמה היא התשובה: $\theta=-\frac{\pi}{3}$.
      - kind: computation
        text: >-
          $(-\sqrt3,-1)$: $r=\sqrt{3+1}=2$. הרביע השלישי. זווית העזר $\arctan\frac{-1}{-\sqrt3}=\arctan\frac{1}{\sqrt3}=\frac{\pi}{6}$,
          זווית של הרביע הראשון; מכיוון ש-$x<0$ מוסיפים $\pi$: $\theta=\frac{7\pi}{6}$. בטווח $(-\pi,\pi]$ מחסירים
          $2\pi$ מהתשובה הזו: $\theta=-\frac{5\pi}{6}$. (זה אותו דבר כמו להחסיר $\pi$ מזווית העזר:
          $\frac{\pi}{6}-\pi$.)
      - kind: step
        text: >-
          הזוויות $\frac{3\pi}{4}$ ו-$\frac{\pi}{2}$ נמצאות בשני הטווחים, ולכן אינן משתנות: אלה הנקודות שמעל ציר $x$. לשתי
          הנקודות שמתחת לציר $x$ יש בכל טווח שם אחר לאותו כיוון.
      - kind: check
        text: >-
          הצבה חזרה, עם הסימנים: $4\cos\frac{5\pi}{3}=4\cdot\frac12=2$ ו-$4\sin\frac{5\pi}{3}$ הוא $-2\sqrt3$;
          $2\cos\frac{7\pi}{6}$ הוא $-\sqrt3$ ו-$2\sin\frac{7\pi}{6}$ הוא $-1$.
      - kind: result
        text: >-
          $\left(5\sqrt2,\frac{3\pi}{4}\right)$, $\left(4,\frac{\pi}{2}\right)$, $\left(4,\frac{5\pi}{3}\right)$ (או
          $\theta=-\frac{\pi}{3}$), $\left(2,\frac{7\pi}{6}\right)$ (או $\theta=-\frac{5\pi}{6}$).

  - id: W-2.3-03
    level: basic
    qualitative: true
    objectives: [OBJ-2.3-2, OBJ-2.3-3]
    prompt: >-
      תארו במילים את קבוצת הנקודות במישור שמקיימות כל תנאי (בכולם $r\ge0$), ונמקו בקצרה.

      (א) $r=2$ יחד עם $0\le\theta\le\pi$

      (ב) $\theta=\frac{\pi}{2}$

      (ג) $0\le r\le1$

      (ד) $r\ge3$

      (ה) $\theta=0$ או $\theta=\pi$
    answer: >-
      (א) חצי המעגל העליון ברדיוס 2 סביב הראשית. (ב) החלק החיובי של ציר $y$. (ג) עיגול היחידה. (ד) המעגל ברדיוס 3
      סביב הראשית וכל מה שמחוצה לו. (ה) ציר $x$ כולו.
    solution:
      - kind: idea
        text: >-
          קוראים כל תנאי בשפה של מרחק וכיוון. תנאי על $r$ בלבד מרשה כל כיוון, ולכן נותן צורה "עגולה" סביב הראשית;
          תנאי על $\theta$ בלבד מרשה כל מרחק, ולכן נותן קרניים. שוויון נותן קו, אי-שוויון נותן תחום.
      - kind: step
        text: >-
          (א) $r=2$ הוא המעגל ברדיוס 2 סביב הראשית. הכיוונים $0\le\theta\le\pi$ הם אלה שפונים למעלה ($y\ge0$): נשאר
          חצי המעגל העליון, כולל שתי נקודות הקצה $(2,0)$ ו-$(-2,0)$.
      - kind: step
        text: >-
          (ב) כיוון קבוע, "ישר למעלה", ומרחק כלשהו: קרן, החלק החיובי של ציר $y$ (עם הראשית). לא הציר כולו: החלק
          השלילי הוא $\theta=\frac{3\pi}{2}$.
      - kind: step
        text: >-
          (ג) מרחק לכל היותר 1 מהראשית, בכל כיוון: העיגול $x^2+y^2\le1$. (ד) מרחק 3 לפחות: כל המישור חוץ מפנים העיגול
          ברדיוס 3, כלומר $x^2+y^2\ge9$.
      - kind: step
        text: >-
          (ה) $\theta=0$ היא הקרן של החלק החיובי של ציר $x$, ו-$\theta=\pi$ הקרן של החלק השלילי. שתיהן יחד הן ציר $x$
          כולו. כך נכתב בקואורדינטות קוטביות ישר שעובר בראשית: כשתי קרניים.
      - kind: check
        text: >-
          נקודה לדוגמה ב-(ה): $(r,\theta)=(4,\pi)$ היא $(4\cos\pi,4\sin\pi)=(-4,0)$, על ציר $x$. ב-(ד): 3 הוא הרדיוס, ו-9
          הוא הריבוע שלו.
      - kind: result
        text: >-
          חצי מעגל עליון; החלק החיובי של ציר $y$; עיגול היחידה; החוץ של העיגול ברדיוס 3 (עם המעגל עצמו); ציר $x$.

  - id: W-2.3-04
    level: mid
    objectives: [OBJ-2.3-2]
    prompt: >-
      תרגמו כל משוואה לקואורדינטות קוטביות, ואמרו באילו זוויות $\theta$ יש לעקום נקודות.

      (א) $x^2+y^2=6y$

      (ב) $x=-3$

      (ג) $y=\sqrt3\,x$
    answer: >-
      (א) $r=6\sin\theta$, $0\le\theta\le\pi$. (ב) $r=-\frac{3}{\cos\theta}$, $\frac{\pi}{2}<\theta<\frac{3\pi}{2}$.
      (ג) שתי הקרניים $\theta=\frac{\pi}{3}$ ו-$\theta=\frac{4\pi}{3}$, יחד עם הראשית.
    solution:
      - kind: idea
        text: >-
          מחליפים לפי המילון: $x=r\cos\theta$, $y=r\sin\theta$, $x^2+y^2=r^2$, כל $x$ ו-$y$ יחד עם ה-$r$ שלהם. אחר כך
          מבודדים את $r$, ודורשים $r\ge0$: מכאן טווח הזוויות.
      - kind: computation
        text: >-
          (א) $r^2=6r\sin\theta$. הראשית ($r=0$) מקיימת את המשוואה. כש-$r>0$ מחלקים ב-$r$: $r=6\sin\theta$. הנוסחה
          אינה שלילית כש-$\sin\theta\ge0$, כלומר $0\le\theta\le\pi$, והראשית מתקבלת ממנה ב-$\theta=0$. זה המעגל
          $x^2+(y-3)^2=9$, שכולו מעל ציר $x$.
      - kind: computation
        text: >-
          (ב) $r\cos\theta=-3$, ולכן $r=-\frac{3}{\cos\theta}$. כדי ש-$r$ יהיה חיובי צריך $\cos\theta<0$:
          $\frac{\pi}{2}<\theta<\frac{3\pi}{2}$. אלה הכיוונים שפונים שמאלה, ורק בהם קרן שיוצאת מהראשית פוגשת את
          הישר. המינוס שבנוסחה אינו "$r$ שלילי": בטווח הזה הקוסינוס שלילי, והמנה חיובית.
      - kind: computation
        text: >-
          (ג) $r\sin\theta=\sqrt3\,r\cos\theta$. הראשית מקיימת. כש-$r>0$ מחלקים ב-$r$ ומקבלים $\tan\theta=\sqrt3$, ולזה
          שני פתרונות בסיבוב: $\theta=\frac{\pi}{3}$ (ברביע הראשון) ו-$\theta=\frac{\pi}{3}+\pi=\frac{4\pi}{3}$ (ברביע
          השלישי). $r$ אינו מופיע במשוואה, ולכן הוא חופשי: שתי קרניים.
      - kind: check
        text: >-
          (א) ב-$\theta=\frac{\pi}{2}$: $r=6$, הנקודה $(0,6)$, ואכן $0+36=6\cdot6$. (ב) ב-$\theta=\pi$: $r=3$, הנקודה
          $(-3,0)$; ב-$\theta=\frac{2\pi}{3}$: $r=\frac{-3}{-1/2}=6$, הנקודה $(-3,3\sqrt3)$. לשתיהן $x=-3$. (ג) הנקודה
          $\left(2,\frac{4\pi}{3}\right)$ היא $(-1,-\sqrt3)$, ואכן $-\sqrt3=\sqrt3\cdot(-1)$.
      - kind: result
        text: >-
          (א) $r=6\sin\theta$ עם $0\le\theta\le\pi$; (ב) $r=-\frac{3}{\cos\theta}$ עם $\frac{\pi}{2}<\theta<\frac{3\pi}{2}$;
          (ג) הקרניים $\theta=\frac{\pi}{3}$ ו-$\theta=\frac{4\pi}{3}$, עם הראשית.

  - id: W-2.3-05
    level: mid
    objectives: [OBJ-2.3-2]
    prompt: >-
      תרגמו כל משוואה קוטבית למשוואה קרטזית, וזהו את העקום.

      (א) $r=5\cos\theta$

      (ב) $r=\dfrac{2}{\cos\theta+2\sin\theta}$

      (ג) $r^2\sin2\theta=8$

      (ד) $r=\dfrac{4}{1+\cos\theta}$
    answer: >-
      (א) $\left(x-\frac52\right)^2+y^2=\frac{25}{4}$: מעגל שמרכזו $\left(\frac52,0\right)$ ורדיוסו $\frac52$.
      (ב) $x+2y=2$: ישר. (ג) $xy=4$: היפרבולה. (ד) $y^2=16-8x$: פרבולה שנפתחת שמאלה.
    solution:
      - kind: idea
        text: >-
          מחפשים את הצירופים של המילון: $r\cos\theta$ הוא $x$, $r\sin\theta$ הוא $y$, ו-$r^2$ הוא $x^2+y^2$. כשהם
          חסרים יוצרים אותם: כופלים ב-$r$, או כופלים במכנה. את התוצאה מזהים לפי השיעורים 2.1 ו-2.2.
      - kind: computation
        text: >-
          (א) כופלים ב-$r$: $r^2=5r\cos\theta$, כלומר $x^2+y^2=5x$. משלימים לריבוע: $x^2-5x=\left(x-\frac52\right)^2-\frac{25}{4}$,
          ולכן $\left(x-\frac52\right)^2+y^2=\frac{25}{4}$. מעגל דרך הראשית, לפי הדפוס $r=2R\cos\theta$ עם $R=\frac52$.
      - kind: computation
        text: >-
          (ב) כופלים במכנה: $r\cos\theta+2r\sin\theta=2$, כלומר $x+2y=2$. ישר, שחותך את הצירים ב-$(2,0)$ וב-$(0,1)$.
      - kind: computation
        text: >-
          (ג) לפי הזהות $\sin2\theta=2\sin\theta\cos\theta$: $r^2\cdot2\sin\theta\cos\theta=8$, כלומר
          $2\,(r\cos\theta)(r\sin\theta)=8$, ולכן $xy=4$. היפרבולה שהאסימפטוטות שלה הן הצירים.
      - kind: computation
        text: >-
          (ד) כופלים במכנה: $r+r\cos\theta=4$, כלומר $r=4-x$. נשאר $r$ בודד, שאינו חלק מצירוף של המילון. כמו
          בשיעור (הסעיף על תרגום משוואות, "מבודדים ומעלים בריבוע"): $r$ כבר לבדו באגף אחד, ומעלים את שני האגפים
          בריבוע. $x^2+y^2=(4-x)^2=16-8x+x^2$. ה-$x^2$ מצטמצם, ונשאר $y^2=16-8x$: פרבולה שהציר שלה הוא ציר $x$,
          שנפתחת שמאלה, עם קודקוד ב-$(2,0)$.
      - kind: step
        text: >-
          ההעלאה בריבוע ב-(ד) יכולה להוסיף רק נקודות שבהן $4-x$ שלילי (שם $r=4-x$ אינו אפשרי, כי $r\ge0$). אבל על
          הפרבולה $16-8x=y^2\ge0$, ולכן $x\le2$ ו-$4-x\ge2>0$: לא נוספה אף נקודה.
      - kind: check
        text: >-
          (ב) ב-$\theta=0$: $r=2$, הנקודה $(2,0)$; ב-$\theta=\frac{\pi}{2}$: $r=1$, הנקודה $(0,1)$. (ג) ב-$\theta=\frac{\pi}{4}$:
          $r^2=8$, הנקודה $(2,2)$, ואכן $2\cdot2=4$. (ד) ב-$\theta=0$: $r=2$, הנקודה $(2,0)$, הקודקוד; ב-$\theta=\frac{\pi}{2}$:
          $r=4$, הנקודה $(0,4)$, ואכן $16=16-0$.
      - kind: result
        text: >-
          (א) המעגל $\left(x-\frac52\right)^2+y^2=\frac{25}{4}$; (ב) הישר $x+2y=2$; (ג) ההיפרבולה $xy=4$; (ד) הפרבולה
          $y^2=16-8x$.

  - id: W-2.3-06
    level: mid
    qualitative: true
    objectives: [OBJ-2.3-1]
    prompt: >-
      בכל סעיף כתוב חלק מפתרון של תלמיד. מצאו את הטעות, הסבירו אותה ותקנו.

      (א) "הנקודה $(-3,-3)$: $r=\sqrt{9+9}=3\sqrt2$, ו-$\theta=\arctan\frac{-3}{-3}=\arctan1=\frac{\pi}{4}$."

      (ב) "הנקודה $(0,-2)$: המנה $\frac{y}{x}$ אינה מוגדרת, ולכן לנקודה הזו אין קואורדינטות קוטביות."

      (ג) "הזוג $\left(2,\frac{9\pi}{4}\right)$ אינו מתאר נקודה, כי $\frac{9\pi}{4}$ גדול מ-$2\pi$."
    answer: >-
      (א) הנקודה ברביע השלישי: $\theta=\frac{\pi}{4}+\pi=\frac{5\pi}{4}$. (ב) יש: $r=2$, $\theta=\frac{3\pi}{2}$; על ציר $y$
      קוראים את הזווית מהציר. (ג) הזוג מתאר את הנקודה $(\sqrt2,\sqrt2)$, אותה נקודה כמו $\left(2,\frac{\pi}{4}\right)$.
    solution:
      - kind: idea
        text: >-
          שלוש הטעויות הן שלוש המוסכמות של השיעור: $\arctan$ רואה רק את חצי המישור הימני; על ציר $y$ אין מנה אבל יש
          כיוון; והזווית נקבעת רק עד כדי כפולה של $2\pi$. הבדיקה שתופסת את הראשונה היא הצבה חזרה, עם הסימנים.
      - kind: step
        text: >-
          (א) החישוב של $r$ נכון. הטעות בזווית: $\frac{-3}{-3}=1$ היא גם המנה של הנקודה $(3,3)$, ו-$\arctan$ מחזיר את
          הזווית של $(3,3)$. הצבה חזרה מגלה זאת מיד: $3\sqrt2\cos\frac{\pi}{4}=3$, ולא $-3$. הנקודה ברביע השלישי
          ($x<0$), ולכן מוסיפים $\pi$: $\theta=\frac{5\pi}{4}$.
      - kind: step
        text: >-
          (ב) לכל נקודה במישור יש מרחק מהראשית, ולכל נקודה חוץ מהראשית יש כיוון. מה שאינו מוגדר הוא רק הנוסחה
          $\arctan\frac{y}{x}$, כי $x=0$. הנקודה $(0,-2)$ נמצאת על החלק השלילי של ציר $y$, במרחק 2: $r=2$ ו-
          $\theta=\frac{3\pi}{2}$ (או $-\frac{\pi}{2}$ בטווח $(-\pi,\pi]$).
      - kind: step
        text: >-
          (ג) כל זווית מתארת כיוון, גם כזו שגדולה מ-$2\pi$: $\frac{9\pi}{4}=\frac{\pi}{4}+2\pi$, סיבוב שלם ועוד
          $\frac{\pi}{4}$. הנקודה היא $\left(2\cos\frac{\pi}{4},2\sin\frac{\pi}{4}\right)=(\sqrt2,\sqrt2)$. הטווח
          $[0,2\pi)$ הוא בחירה של שם אחד מתוך רבים, לא תנאי לקיום הנקודה. אם שאלה מבקשת זווית בטווח הזה, עונים
          $\frac{\pi}{4}$.
      - kind: check
        text: >-
          (א) $3\sqrt2\cos\frac{5\pi}{4}=3\sqrt2\cdot\left(-\frac{1}{\sqrt2}\right)$, כלומר $-3$, וכך גם הסינוס. (ב)
          $2\cos\frac{3\pi}{2}=0$ ו-$2\sin\frac{3\pi}{2}$ הוא $-2$.
      - kind: result
        text: >-
          (א) $\left(3\sqrt2,\frac{5\pi}{4}\right)$; (ב) $\left(2,\frac{3\pi}{2}\right)$; (ג) הזוג חוקי, והוא הנקודה
          $(\sqrt2,\sqrt2)$.

  - id: W-2.3-07
    level: mid
    objectives: [OBJ-2.3-3]
    prompt: >-
      (א) תארו בקואורדינטות קוטביות את התחום $x^2+y^2\le25$, $x\le0$, $y\le0$.

      (ב) תארו בקואורדינטות קוטביות את התחום $9\le x^2+y^2\le16$.

      (ג) תארו בקואורדינטות קוטביות את התחום $x^2+y^2\le4$, $0\le y\le-x$, ובדקו את התיאור בנקודה
      $\left(-\frac32,\frac12\right)$.

      (ד) בכיוון ההפוך: תארו באי-שוויונות ב-$x$ וב-$y$ את התחום $1\le r\le3$, $\pi\le\theta\le2\pi$.

      בכל סעיף אמרו גם איזו צורה זו.
    answer: >-
      (א) $0\le r\le5$, $\pi\le\theta\le\frac{3\pi}{2}$: רבע עיגול (גזרה). (ב) $3\le r\le4$, כל הזוויות: טבעת.
      (ג) $0\le r\le2$, $\frac{3\pi}{4}\le\theta\le\pi$: גזרה. (ד) $1\le x^2+y^2\le9$, $y\le0$: חצי טבעת תחתונה.
    solution:
      - kind: idea
        text: >-
          הגבולות של $r$ באים מהתנאי על $x^2+y^2$, אחרי הוצאת שורש. הגבולות של $\theta$ באים מהתנאים שאומרים באיזה צד
          של ישר דרך הראשית נמצאים: מציירים את הקרניים שתוחמות את התחום וקוראים את הזוויות שלהן, נגד כיוון השעון.
      - kind: computation
        text: >-
          (א) $r^2\le25$ נותן $0\le r\le5$. $x\le0$ ו-$y\le0$ יחד הם הרביע השלישי, מהכיוון $\pi$ (החלק השלילי של ציר
          $x$) ועד הכיוון $\frac{3\pi}{2}$ (החלק השלילי של ציר $y$). רבע עיגול.
      - kind: computation
        text: >-
          (ב) $9\le r^2\le16$ נותן $3\le r\le4$. אין תנאי על הכיוון: $0\le\theta<2\pi$. טבעת ברוחב 1.
      - kind: computation
        text: >-
          (ג) $0\le r\le2$. $y\ge0$ הוא חצי המישור העליון, $0\le\theta\le\pi$. הישר $y=-x$ הוא שתי הקרניים
          $\frac{3\pi}{4}$ ו-$\frac{7\pi}{4}$, ובחצי המישור העליון רלוונטית רק $\frac{3\pi}{4}$. התנאי $y\le-x$ בוחר את
          הצד של הקרן הזו שמכיל את החלק השלילי של ציר $x$ (בדיקה: בנקודה $(-1,0)$ מתקיים $0\le1$). לכן
          $\frac{3\pi}{4}\le\theta\le\pi$: גזרה צרה, שמינית עיגול.
      - kind: computation
        text: >-
          הבדיקה ב-(ג): $\left(-\frac32,\frac12\right)$ מקיימת $\frac94+\frac14=\frac52\le4$ ו-$0\le\frac12\le\frac32$, כלומר
          היא בתחום. בקוטביות: $r=\sqrt{\frac52}\approx1.58\le2$. הרביע השני: זווית העזר היא $\arctan\left(-\frac13\right)$,
          כלומר מינוס $\arctan\frac13$, ומוסיפים $\pi$. לכן $\theta=\pi-\arctan\frac13\approx161.6^\circ$, בין $135^\circ$
          ל-$180^\circ$ (הגבולות $\frac{3\pi}{4}$ ו-$\pi$). שני התנאים מתקיימים.
      - kind: computation
        text: >-
          (ד) $1\le r\le3$ הוא $1\le x^2+y^2\le9$ (מעלים בריבוע). הכיוונים $\pi\le\theta\le2\pi$ הם אלה שבהם
          $\sin\theta\le0$, כלומר $y\le0$. חצי טבעת תחתונה.
      - kind: result
        text: >-
          (א) $0\le r\le5$, $\pi\le\theta\le\frac{3\pi}{2}$; (ב) $3\le r\le4$; (ג) $0\le r\le2$,
          $\frac{3\pi}{4}\le\theta\le\pi$; (ד) $1\le x^2+y^2\le9$, $y\le0$.

  - id: W-2.3-08
    level: exam
    objectives: [OBJ-2.3-2]
    prompt: >-
      נתון העקום $r=1+\sin\theta$.

      (א) הראו שיש לעקום נקודה בכל כיוון. באיזה כיוון הוא עובר בראשית, ובאיזה כיוון הוא הרחוק ביותר ממנה?

      (ב) איזו סימטריה יש לעקום? בנו טבלה בזוויות $-\frac{\pi}{2},-\frac{\pi}{6},0,\frac{\pi}{6},\frac{\pi}{2}$, עם
      $r$ ועם $(x,y)$, ותארו את העקום.

      (ג) מצאו את הנקודות הנמוכות ביותר של העקום (אלה שבהן $y$ הקטן ביותר). האם הראשית היא אחת מהן?
    answer: >-
      (א) $0\le r\le2$; בראשית ב-$\theta=\frac{3\pi}{2}$, והרחוק ביותר ($r=2$) ב-$\theta=\frac{\pi}{2}$. (ב) סימטריה
      ביחס לציר $y$; קרדיואידה שהחוד שלה בראשית והיא פונה למעלה. (ג) $y=-\frac14$, בנקודות
      $\left(\pm\frac{\sqrt3}{4},-\frac14\right)$, בזוויות $\frac{7\pi}{6}$ ו-$\frac{11\pi}{6}$. הראשית אינה אחת מהן.
    solution:
      - kind: idea
        text: >-
          המתכון לשרטוט: איפה $r\ge0$, סימטריה, וטבלה בזוויות הנוחות. "הנמוכה ביותר" היא שאלה על $y=r\sin\theta$ ולא
          על $r$: כותבים את $y$ כפונקציה של משתנה אחד, $s=\sin\theta$, ומקבלים פרבולה ב-$s$ בקטע $-1\le s\le1$.
      - kind: computation
        text: >-
          (א) $-1\le\sin\theta\le1$, ולכן $0\le r\le2$: הנוסחה אינה שלילית באף כיוון. $r=0$ כש-$\sin\theta=-1$, כלומר
          ב-$\theta=\frac{3\pi}{2}$ (ישר למטה), ו-$r=2$ כש-$\sin\theta=1$, ב-$\theta=\frac{\pi}{2}$: הנקודה $(0,2)$.
      - kind: computation
        text: >-
          (ב) הנוסחה תלויה רק ב-$\sin\theta$, ו-$\sin(\pi-\theta)=\sin\theta$. הנקודה שבזווית $\pi-\theta$ היא תמונת
          הראי ביחס לציר $y$ של הנקודה שבזווית $\theta$, ויש להן אותו $r$: העקום סימטרי ביחס לציר $y$. לכן מספיק החצי
          הימני, $-\frac{\pi}{2}\le\theta\le\frac{\pi}{2}$.
      - kind: computation
        text: >-
          הטבלה: בזוויות $-\frac{\pi}{2},-\frac{\pi}{6},0,\frac{\pi}{6},\frac{\pi}{2}$ מתקבל $r=0,\frac12,1,\frac32,2$,
          והנקודות הן $(0,0)$, $\left(\frac{\sqrt3}{4},-\frac14\right)$, $(1,0)$, $\left(\frac{3\sqrt3}{4},\frac34\right)$,
          $(0,2)$. בקירוב $\frac{\sqrt3}{4}\approx0.43$ ו-$\frac{3\sqrt3}{4}\approx1.30$.
      - kind: step
        text: >-
          העקום יוצא מהראשית, יורד מעט מתחת לציר $x$, חוצה אותו ב-$(1,0)$, עולה ומתרחק עד $(0,2)$; החצי השמאלי הוא
          תמונת ראי. זו קרדיואידה, כמו $r=1+\cos\theta$ מהשיעור, מסובבת ברבע סיבוב: החוד בראשית, והיא פונה למעלה.
      - kind: computation
        text: >-
          (ג) $y=r\sin\theta=(1+\sin\theta)\sin\theta$. מסמנים $s=\sin\theta$ ומשלימים לריבוע:
          $y=(1+s)\,s=s^2+s=\left(s+\frac12\right)^2-\frac14$. זו פרבולה "מחייכת" ב-$s$ שהקודקוד שלה ב-$s=-\frac12$,
          בתוך הקטע $[-1,1]$. לכן ה-$y$ הקטן ביותר הוא $-\frac14$, כש-$\sin\theta=-\frac12$: ב-$\theta=\frac{7\pi}{6}$
          וב-$\theta=\frac{11\pi}{6}$.
      - kind: computation
        text: >-
          בשתי הזוויות $r=1-\frac12=\frac12$, והנקודות הן
          $\left(\frac12\cos\frac{7\pi}{6},-\frac14\right)=\left(-\frac{\sqrt3}{4},-\frac14\right)$ ו-
          $\left(\frac{\sqrt3}{4},-\frac14\right)$. השנייה היא הנקודה שבטבלה בזווית $-\frac{\pi}{6}$, שהיא אותו כיוון
          כמו $\frac{11\pi}{6}$.
      - kind: check
        text: >-
          בראשית ($\theta=\frac{3\pi}{2}$) $y=0$, גבוה מ-$-\frac14$: הכיוון "ישר למטה" אינו נותן את הנקודה הנמוכה
          ביותר, כי שם המרחק מתאפס. ובקצה השני של הקטע, $s=1$, מתקבל $y=2$: הנקודה הגבוהה ביותר, $(0,2)$, כמו ב-(א).
          שתי הנקודות הנמוכות הן תמונות ראי זו של זו ביחס לציר $y$, כמו שהסימטריה דורשת.
      - kind: result
        text: >-
          העקום הוא קרדיואידה סימטרית ביחס לציר $y$, עם $0\le r\le2$. הנקודות הנמוכות ביותר הן
          $\left(\pm\frac{\sqrt3}{4},-\frac14\right)$, בזוויות $\frac{7\pi}{6}$ ו-$\frac{11\pi}{6}$, ולא הראשית.

  - id: W-2.3-09
    level: exam
    objectives: [OBJ-2.3-2, OBJ-2.3-1]
    prompt: >-
      נתון העקום $r=4\cos\theta-2\sin\theta$.

      (א) מצאו משוואה קרטזית וזהו את העקום.

      (ב) שימו לב ש-$r=(4,-2)\cdot(\cos\theta,\sin\theta)$, מכפלה סקלרית של וקטור קבוע בווקטור היחידה שבכיוון
      $\theta$. היעזרו בכך כדי למצוא את הנקודה של העקום הרחוקה ביותר מהראשית, בלי נגזרות. מה הקשר שלה למרכז?

      (ג) באילו כיוונים $\theta$ יש לעקום נקודות (כלומר $r\ge0$)? באילו כיוונים הוא עובר בראשית?

      (ד) מצאו את נקודות החיתוך של העקום עם הצירים, חוץ מהראשית.
    answer: >-
      (א) $(x-2)^2+(y+1)^2=5$: מעגל שמרכזו $(2,-1)$ ורדיוסו $\sqrt5$, דרך הראשית. (ב) $(4,-2)$, במרחק $2\sqrt5$:
      הקצה השני של הקוטר שיוצא מהראשית, פעמיים וקטור המקום של המרכז. (ג) בכיוונים שיוצרים זווית חדה או ישרה עם
      $(4,-2)$: מ-$\arctan2-\pi$ עד $\arctan2$ (בערך מ-$-116.6^\circ$ עד $63.4^\circ$); בראשית בשני הקצוות.
      (ד) $(4,0)$ ו-$(0,-2)$.
    solution:
      - kind: idea
        text: >-
          כופלים ב-$r$ כדי ליצור את הצירופים של המילון, ומשלימים לריבוע. לשאלות על המרחק נעזרים במשמעות הגיאומטרית
          של המכפלה הסקלרית (שיעור 1.2): מכפלה של וקטור בווקטור יחידה היא ההיטל שלו על הכיוון הזה, והיא הגדולה ביותר
          כשהכיוונים מתלכדים ושלילית כשהזווית קהה.
      - kind: computation
        text: >-
          (א) $r^2=4r\cos\theta-2r\sin\theta$, כלומר $x^2+y^2=4x-2y$. מעבירים אגף ומשלימים לריבוע פעמיים:
          $(x^2-4x+4)+(y^2+2y+1)=4+1$, ולכן $(x-2)^2+(y+1)^2=5$. מעגל שמרכזו $(2,-1)$ ורדיוסו $\sqrt5$. הראשית עליו:
          $4+1=5$.
      - kind: step
        text: >-
          (ב) נסמן ב-$\gamma$ את הזווית שבין שני הווקטורים שבמכפלה: הווקטור הקבוע $(4,-2)$ ווקטור היחידה
          $(\cos\theta,\sin\theta)$, שפונה לכיוון $\theta$. לפי הנוסחה הגיאומטרית של המכפלה הסקלרית (שיעור 1.2),
          המכפלה היא אורך כפול אורך כפול $\cos\gamma$.
      - kind: computation
        text: >-
          האורך של $(4,-2)$ הוא $\sqrt{16+4}=2\sqrt5\approx4.47$, והאורך של וקטור היחידה הוא 1. לכן
          $r=2\sqrt5\cdot1\cdot\cos\gamma=2\sqrt5\cos\gamma$. הערך הגדול ביותר של $\cos\gamma$ הוא 1, כש-$\gamma=0$,
          כלומר כשהכיוון $\theta$ הוא הכיוון של $(4,-2)$. אז $r=2\sqrt5$: הולכים בכיוון של $(4,-2)$ מרחק ששווה
          לאורך שלו, ומגיעים לנקודה $(4,-2)$ עצמה.
      - kind: step
        text: >-
          $(4,-2)=2\cdot(2,-1)$: זו הנקודה שמול הראשית על המעגל, הקצה השני של הקוטר. המרחק אליה, $2\sqrt5$, הוא
          הקוטר. זה המצב בכל מעגל שעובר דרך הראשית: הנקודה הרחוקה ביותר מהראשית היא זו שמולה.
      - kind: computation
        text: >-
          (ג) באותה דרך כמו בדוגמה 4(א) של השיעור. קודם מוצאים איפה $r=0$: $4\cos\theta=2\sin\theta$, כלומר
          $\tan\theta=2$. יש לזה שני פתרונות, בשני כיוונים הפוכים: $\theta=\arctan2\approx63.4^\circ$ (ברביע
          הראשון), והכיוון שמולו, $\arctan2-\pi\approx-116.6^\circ$ (ברביע השלישי). $\arctan2$ אינה זווית נוחה,
          ומשאירים אותה כך. בשני הכיוונים האלה העקום עובר בראשית.
      - kind: computation
        text: >-
          שני הכיוונים מחלקים את הסיבוב לשני חצאים, ובכל חצי הסימן של $r$ קבוע. בודקים כיוון אחד בכל חצי: ב-
          $\theta=0$ מתקבל $r=4$, חיובי; ב-$\theta=\pi$ הנוסחה נותנת מינוס 4. לכן יש לעקום נקודות בחצי שמכיל את
          $\theta=0$: $\arctan2-\pi\le\theta\le\arctan2$. זה מתיישב עם (ב): $r\ge0$ בדיוק כש-$\cos\gamma\ge0$,
          כלומר כשהכיוון $\theta$ יוצר עם $(4,-2)$ זווית חדה או ישרה, חצי סיבוב שבאמצעו הכיוון של $(4,-2)$.
      - kind: computation
        text: >-
          (ד) ציר $x$: בכיוון $\theta=0$ מתקבל $r=4$, הנקודה $(4,0)$; בכיוון $\theta=\pi$ הנוסחה נותנת $-4$, ואין
          נקודה. ציר $y$: בכיוון $\theta=\frac{\pi}{2}$ הנוסחה נותנת $-2$, ואין נקודה; בכיוון $\theta=\frac{3\pi}{2}$
          מתקבל $r=-2\cdot(-1)=2$, הנקודה $(0,-2)$.
      - kind: check
        text: >-
          שלוש הנקודות על המעגל: $(4-2)^2+(0+1)^2=5$, $(0-2)^2+(-2+1)^2=5$, $(4-2)^2+(-2+1)^2=5$. הכיוון $(1,2)$, שבו
          העקום עובר בראשית, מאונך לקוטר: $(1,2)\cdot(4,-2)=4-4=0$. זה הכיוון של המשיק למעגל בראשית. ועוד נקודה: ב-
          $\theta=\frac{\pi}{4}$ מתקבל $r=2\sqrt2-\sqrt2=\sqrt2$, הנקודה $(1,1)$, ואכן $(1-2)^2+(1+1)^2=5$.
      - kind: result
        text: >-
          המעגל $(x-2)^2+(y+1)^2=5$; הנקודה הרחוקה ביותר מהראשית היא $(4,-2)$, במרחק $2\sqrt5$; יש נקודות בכיוונים
          $\arctan2-\pi\le\theta\le\arctan2$; החיתוכים עם הצירים הם $(4,0)$ ו-$(0,-2)$.

  - id: W-2.3-10
    level: exam
    qualitative: true
    objectives: [OBJ-2.3-3, OBJ-2.3-2]
    prompt: >-
      סטודנט התבקש לתאר בקואורדינטות קוטביות את העיגול $D$: $(x+2)^2+y^2\le4$. הוא כתב: "זה עיגול ברדיוס 2, ולכן
      $0\le r\le2$, $0\le\theta<2\pi$."

      (א) מצאו נקודה שמקיימת את התיאור שלו ואינה ב-$D$, ונקודה שנמצאת ב-$D$ ואינה מקיימת את התיאור שלו. מה הוא
      תיאר בעצם?

      (ב) מצאו את התיאור הנכון של $D$, והסבירו מאיפה בא טווח הזוויות.

      (ג) תארו בקואורדינטות קוטביות את החלק של $D$ שבו $y\ge0$.

      (ד) נכון או לא נכון: הנקודה שהקואורדינטות הקוטביות שלה $\left(\sqrt2,\frac{3\pi}{4}\right)$ נמצאת ב-$D$. בדקו
      בשתי דרכים.
    answer: >-
      (א) למשל $(1,0)$ ו-$(-3,0)$; הוא תיאר את העיגול ברדיוס 2 שמרכזו בראשית. (ב) $\frac{\pi}{2}\le\theta\le\frac{3\pi}{2}$,
      $0\le r\le-4\cos\theta$. (ג) $\frac{\pi}{2}\le\theta\le\pi$, $0\le r\le-4\cos\theta$. (ד) נכון.
    solution:
      - kind: idea
        text: >-
          $0\le r\le R$ עם כל הזוויות הוא עיגול **שמרכזו בראשית**. המרכז של $D$ הוא $(-2,0)$, והראשית על המעגל
          שתוחם אותו, ולכן הגבול של $r$ תלוי בכיוון. מתרגמים את אי-השוויון לפי המילון, ומהדרישה שהגבול לא יהיה שלילי
          מקבלים את טווח הזוויות.
      - kind: step
        text: >-
          (א) $(1,0)$: $r=1\le2$, אבל $(1+2)^2+0=9>4$, ולכן היא אינה ב-$D$. $(-3,0)$: $(-3+2)^2+0=1\le4$, ולכן היא
          ב-$D$, אבל $r=3>2$. התיאור שלו הוא העיגול $x^2+y^2\le4$: אותו רדיוס, מרכז אחר.
      - kind: computation
        text: >-
          (ב) פותחים סוגריים: $x^2+4x+4+y^2\le4$, כלומר $x^2+y^2\le-4x$. מחליפים: $r^2\le-4r\cos\theta$. כש-$r>0$
          מחלקים ב-$r$ (חיובי, ולכן אי-השוויון אינו מתהפך): $r\le-4\cos\theta$.
      - kind: computation
        text: >-
          כדי שיהיו נקודות עם $r>0$ צריך $-4\cos\theta>0$, כלומר $\cos\theta<0$: הכיוונים שפונים שמאלה. יחד עם
          הקצוות, שבהם הגבול הוא 0 (הראשית): $\frac{\pi}{2}\le\theta\le\frac{3\pi}{2}$. כל העיגול נמצא משמאל לציר $y$.
          התיאור: $\frac{\pi}{2}\le\theta\le\frac{3\pi}{2}$, $0\le r\le-4\cos\theta$.
      - kind: computation
        text: >-
          (ג) $y\ge0$ הוא $0\le\theta\le\pi$. החיתוך עם $\frac{\pi}{2}\le\theta\le\frac{3\pi}{2}$ הוא
          $\frac{\pi}{2}\le\theta\le\pi$, והגבול של $r$ אינו משתנה: $0\le r\le-4\cos\theta$. זה חצי העיגול העליון.
      - kind: computation
        text: >-
          (ד) בדרך הקוטבית: $\theta=\frac{3\pi}{4}$ בטווח המותר, והגבול שם הוא
          $-4\cos\frac{3\pi}{4}=-4\cdot\left(-\frac{\sqrt2}{2}\right)=2\sqrt2\approx2.83$. $\sqrt2\le2\sqrt2$: הנקודה
          ב-$D$. בדרך הקרטזית: הנקודה היא $\left(\sqrt2\cos\frac{3\pi}{4},\sqrt2\sin\frac{3\pi}{4}\right)=(-1,1)$, ו-
          $(-1+2)^2+1^2=2\le4$. נכון.
      - kind: check
        text: >-
          שתי נקודות על המעגל שתוחם את $D$: בכיוון $\theta=\pi$ הגבול הוא $-4\cos\pi=4$, הנקודה $(-4,0)$, ואכן
          $(-4+2)^2=4$. בכיוון $\theta=\frac{2\pi}{3}$ הגבול הוא $-4\cdot\left(-\frac12\right)=2$. והמעגל כולו הוא
          $r=-4\cos\theta$, מעגל דרך
          הראשית לפי הדפוס $r=2R\cos\theta$, עם מינוס כי המרכז משמאל לראשית.
      - kind: result
        text: >-
          $D$: $\frac{\pi}{2}\le\theta\le\frac{3\pi}{2}$, $0\le r\le-4\cos\theta$. החצי העליון:
          $\frac{\pi}{2}\le\theta\le\pi$ עם אותו גבול של $r$. הנקודה $\left(\sqrt2,\frac{3\pi}{4}\right)$ ב-$D$. עיגול
          ברדיוס $R$ הוא $0\le r\le R$ רק כשהמרכז שלו בראשית.

challenge:
  - id: W-2.3-c1
    stars: 1
    objectives: [OBJ-2.3-2]
    prompt: >-
      (א) תרגמו את ההיפרבולה $x^2-y^2=16$ לקואורדינטות קוטביות. באילו כיוונים $\theta$ יש לה נקודות, ומה קורה ל-$r$
      כשמתקרבים לקצה של כיוונים אלה? מהן הנקודות שלה הקרובות ביותר לראשית?

      (ב) תרגמו את הפרבולה $y^2=4x$ לצורה $r=f(\theta)$. באילו כיוונים יש לה נקודות?

      (ג) זהו את העקום $r=\dfrac{\cos\theta}{\sin^2\theta}$, ונסחו את הכלל שעולה מ-(ב) ומ-(ג) יחד.
    answer: >-
      (א) $r^2\cos2\theta=16$, כלומר $r=\frac{4}{\sqrt{\cos2\theta}}$, בכיוונים $-\frac{\pi}{4}<\theta<\frac{\pi}{4}$
      ו-$\frac{3\pi}{4}<\theta<\frac{5\pi}{4}$; בקצוות $r$ גדל בלי גבול (האסימפטוטות $y=\pm x$); הקרובות ביותר
      $(\pm4,0)$. (ב) $r=\frac{4\cos\theta}{\sin^2\theta}$, בכיוונים $-\frac{\pi}{2}\le\theta\le\frac{\pi}{2}$,
      $\theta\ne0$. (ג) הפרבולה $y^2=x$; בכלל, $y^2=kx$ היא $r=\frac{k\cos\theta}{\sin^2\theta}$.
    solution:
      - kind: idea
        text: >-
          מחליפים לפי המילון, ומזהים זהות טריגונומטרית שמקצרת: $\cos^2\theta-\sin^2\theta=\cos2\theta$. הכיוונים שבהם
          יש לעקום נקודות הם אלה שבהם הביטוי ל-$r$ (או ל-$r^2$) חיובי, והם מספרים משהו על הצורה: היפרבולה חיה בין
          האסימפטוטות שלה.
      - kind: computation
        text: >-
          (א) $r^2\cos^2\theta-r^2\sin^2\theta=16$, כלומר $r^2\cos2\theta=16$. צריך $\cos2\theta>0$: $2\theta$ בין
          $-\frac{\pi}{2}$ ל-$\frac{\pi}{2}$, או בין $\frac{3\pi}{2}$ ל-$\frac{5\pi}{2}$. כלומר
          $-\frac{\pi}{4}<\theta<\frac{\pi}{4}$ (הענף הימני) או $\frac{3\pi}{4}<\theta<\frac{5\pi}{4}$ (הענף השמאלי),
          ושם $r=\frac{4}{\sqrt{\cos2\theta}}$.
      - kind: step
        text: >-
          כש-$\theta$ מתקרב ל-$\pm\frac{\pi}{4}$, $\cos2\theta$ מתקרב ל-0 ו-$r$ גדל בלי גבול: בכיוונים של הישרים
          $y=x$ ו-$y=-x$ העקום "בורח לאינסוף". אלה האסימפטוטות של ההיפרבולה (שיעור 2.2), והתיאור הקוטבי מראה אותן
          ככיוונים האסורים. $r$ הקטן ביותר כש-$\cos2\theta$ הגדול ביותר, 1: ב-$\theta=0$ וב-$\theta=\pi$, שם $r=4$.
          הנקודות $(4,0)$ ו-$(-4,0)$, הקודקודים.
      - kind: computation
        text: >-
          (ב) $r^2\sin^2\theta=4r\cos\theta$. הראשית מקיימת. כש-$r>0$ מחלקים ב-$r$ וב-$\sin^2\theta$ (שאינו אפס, כי
          כש-$\sin\theta=0$ ו-$r>0$ המשוואה נותנת $0=\pm4r$, וזה לא ייתכן): $r=\frac{4\cos\theta}{\sin^2\theta}$. צריך
          $\cos\theta\ge0$ ו-$\sin\theta\ne0$: $-\frac{\pi}{2}\le\theta\le\frac{\pi}{2}$, חוץ מ-$\theta=0$. בכיוון
          $\theta=0$, לאורך הציר של הפרבולה, הקרן פוגשת אותה רק בראשית; בכיוונים $\pm\frac{\pi}{2}$ הנוסחה נותנת $r=0$,
          שוב הראשית.
      - kind: computation
        text: >-
          (ג) כופלים ב-$\sin^2\theta$ ואחר כך ב-$r$: $r\sin^2\theta=\cos\theta$, ואז $r^2\sin^2\theta=r\cos\theta$,
          כלומר $y^2=x$. פרבולה שנפתחת ימינה, עם קודקוד בראשית.
      - kind: step
        text: >-
          הכלל: לכל $k>0$, הפרבולה $y^2=kx$ היא $r=\frac{k\cos\theta}{\sin^2\theta}$. ב-(ב) $k=4$, וב-(ג) $k=1$.
          ההוכחה היא אותו חישוב עם $k$ במקום 4.
      - kind: check
        text: >-
          (א) ב-$\theta=\frac{\pi}{6}$: $\cos2\theta=\frac12$, $r=4\sqrt2$, והנקודה
          $\left(4\sqrt2\cdot\frac{\sqrt3}{2},4\sqrt2\cdot\frac12\right)=(2\sqrt6,2\sqrt2)$; ואכן $24-8=16$. (ב) ב-
          $\theta=\frac{\pi}{4}$: $r=\frac{4\cdot\frac{\sqrt2}{2}}{\frac12}=4\sqrt2$, הנקודה $(4,4)$, ואכן $16=4\cdot4$.
          (ג) ב-$\theta=\frac{\pi}{4}$: $r=\sqrt2$, הנקודה $(1,1)$, ואכן $1=1$.
      - kind: result
        text: >-
          ההיפרבולה: $r^2\cos2\theta=16$, עם נקודות רק בין האסימפטוטות, $|\theta|<\frac{\pi}{4}$ או
          $|\theta-\pi|<\frac{\pi}{4}$, וקודקודים ב-$(\pm4,0)$. הפרבולה $y^2=4x$: $r=\frac{4\cos\theta}{\sin^2\theta}$.
          העקום $r=\frac{\cos\theta}{\sin^2\theta}$ הוא הפרבולה $y^2=x$.
    source:
      name: 'OpenStax, Calculus Volume 2 (G. Strang, E. Herman), Section 7.3 Polar Coordinates'
      year: 2016
      problem: 'Exercises 159, 162 and 166'
      url: https://openstax.org/books/calculus-volume-2/pages/7-3-polar-coordinates
      verified: '2026-11-18'
      adapted: true

  - id: W-2.3-c2
    stars: 1
    objectives: [OBJ-2.3-2, OBJ-2.3-1]
    prompt: >-
      (א) תרגמו לקואורדינטות קרטזיות, למשוואה בלי שברים ובלי שורשים:

      $$\frac{2}{r}=\sin\theta-\frac{1}{\cos\theta}.$$

      בדקו את התוצאה בנקודה של העקום שבכיוון $\theta=\frac{3\pi}{4}$.

      (ב) שרטטו את העקום $r=5-2\sin\theta$: הראו שיש לו נקודה בכל כיוון, מצאו את הסימטריה שלו, בנו טבלה בזוויות
      $0,\frac{\pi}{6},\frac{\pi}{2},\pi,\frac{7\pi}{6},\frac{3\pi}{2}$, ומצאו את נקודות החיתוך עם הצירים.

      (ג) מצאו את הנקודה הגבוהה ביותר ואת הנקודה הנמוכה ביותר של העקום שב-(ב). באיזו מהן $r$ הגדול ביותר, ובאיזו
      הקטן ביותר?
    answer: >-
      (א) $x^2+y^2-xy+2x=0$, בלי הראשית; ב-$\theta=\frac{3\pi}{4}$: $r=\frac{2\sqrt2}{3}$, הנקודה
      $\left(-\frac23,\frac23\right)$.
      (ב) $3\le r\le7$, סימטריה ביחס לציר $y$; חיתוכים $(5,0)$, $(0,3)$, $(-5,0)$, $(0,-7)$. (ג) הגבוהה ביותר $(0,3)$,
      דווקא שם $r$ הקטן ביותר; הנמוכה ביותר $(0,-7)$, שם $r$ הגדול ביותר.
    solution:
      - kind: idea
        text: >-
          ב-(א) יוצרים את הצירופים של המילון: כפל ב-$r$ הופך את $\sin\theta$ ל-$y$, ואת $\frac{r}{\cos\theta}$ כותבים
          כ-$\frac{r^2}{r\cos\theta}=\frac{x^2+y^2}{x}$. ב-(ב) המתכון לשרטוט. ב-(ג) "גבוהה" ו"נמוכה" הן שאלות על
          $y=r\sin\theta$: פרבולה במשתנה $s=\sin\theta$ בקטע $[-1,1]$.
      - kind: computation
        text: >-
          (א) כופלים את שני האגפים ב-$r$: $2=r\sin\theta-\frac{r}{\cos\theta}$. המחובר הראשון הוא $y$. את השני מרחיבים
          ב-$r$: $\frac{r}{\cos\theta}=\frac{r^2}{r\cos\theta}=\frac{x^2+y^2}{x}$. לכן $2=y-\frac{x^2+y^2}{x}$. כופלים
          ב-$x$: $2x=xy-x^2-y^2$, ומעבירים אגף: $x^2+y^2-xy+2x=0$.
      - kind: step
        text: >-
          בדרך כפלנו ב-$r$ וב-$x$, ולכן בודקים אם נוספו נקודות שבהן $r=0$ או $x=0$. כשמציבים $x=0$ במשוואה שהתקבלה
          נשאר $y^2=0$: הנקודה היחידה כזו היא הראשית. היא מקיימת את המשוואה הקרטזית ($0=0$), אבל אינה על העקום
          הקוטבי: כש-$r=0$ הביטוי $\frac{2}{r}$ אינו מוגדר. לכן העקום הקוטבי הוא העקום $x^2+y^2-xy+2x=0$ **בלי
          הראשית**. זו אותה בדיקה כמו בשיעור: כפל ב-$r$ יכול להוסיף רק את הראשית, וכאן הוא באמת הוסיף אותה.
      - kind: computation
        text: >-
          הבדיקה: ב-$\theta=\frac{3\pi}{4}$, $\sin\theta=\frac{\sqrt2}{2}$ ו-$\frac{1}{\cos\theta}$ הוא $-\sqrt2$, ולכן
          $\frac{2}{r}=\frac{\sqrt2}{2}+\sqrt2=\frac{3\sqrt2}{2}$ ו-$r=\frac{4}{3\sqrt2}=\frac{2\sqrt2}{3}$. הנקודה:
          $x=\frac{2\sqrt2}{3}\cdot\left(-\frac{\sqrt2}{2}\right)$, כלומר $x=-\frac23$, ו-$y=\frac23$. במשוואה הקרטזית:
          $\frac49+\frac49+\frac49-\frac43=0$.
      - kind: computation
        text: >-
          (ב) $-1\le\sin\theta\le1$, ולכן $3\le r\le7$: חיובי בכל כיוון, והעקום מקיף את הראשית. הנוסחה תלויה רק
          ב-$\sin\theta$, ו-$\sin(\pi-\theta)=\sin\theta$: סימטריה ביחס לציר $y$. הטבלה: בזוויות
          $0,\frac{\pi}{6},\frac{\pi}{2},\pi,\frac{7\pi}{6},\frac{3\pi}{2}$ מתקבל $r=5,4,3,5,6,7$.
      - kind: computation
        text: >-
          הנקודות על הצירים: $(5,0)$ ב-$\theta=0$, $(0,3)$ ב-$\frac{\pi}{2}$, $(-5,0)$ ב-$\pi$, ו-$(0,-7)$
          ב-$\frac{3\pi}{2}$. ועוד שתיים מהטבלה: ב-$\frac{\pi}{6}$ הנקודה $(2\sqrt3,2)\approx(3.46,2)$, וב-$\frac{7\pi}{6}$
          הנקודה $(-3\sqrt3,-3)\approx(-5.20,-3)$; תמונות הראי שלהן ביחס לציר $y$ הן הנקודות שבזוויות $\frac{5\pi}{6}$
          ו-$\frac{11\pi}{6}$. העקום סגור, דומה לביצה: צר וקרוב לראשית למעלה, רחב ורחוק ממנה למטה.
      - kind: computation
        text: >-
          (ג) $y=r\sin\theta=(5-2s)\,s=-2s^2+5s$, עם $s=\sin\theta$. זו פרבולה "בוכה" שהקודקוד שלה ב-$s=\frac54$,
          **מחוץ** לקטע $[-1,1]$, מימינו. לכן בקטע כולו $y$ עולה עם $s$: הגדול ביותר ב-$s=1$, $y=3$, והקטן ביותר
          ב-$s=-1$, כלומר $y=-7$.
      - kind: step
        text: >-
          הנקודה הגבוהה ביותר היא $(0,3)$, בכיוון $\theta=\frac{\pi}{2}$, ושם $r=3$ הוא **הקטן** ביותר. הנמוכה ביותר
          היא $(0,-7)$, ושם $r=7$ הגדול ביותר. הגובה $y$ נקבע על ידי המרחק והכיוון יחד, ולכן אי אפשר לקרוא אותו
          מ-$r$ לבדו: כאן הנקודה הקרובה ביותר לראשית היא גם הגבוהה ביותר.
      - kind: check
        text: >-
          השלמה לריבוע מאשרת את הקודקוד: $-2s^2+5s=-2\left(s-\frac54\right)^2+\frac{25}{8}$. והטבלה מתיישבת עם (ג): בכל
          הנקודות שחישבנו $-7\le y\le3$.
      - kind: result
        text: >-
          (א) $x^2+y^2-xy+2x=0$, בלי הראשית. (ב) עקום סגור סביב הראשית, סימטרי ביחס לציר $y$, עם $3\le r\le7$, שחותך את הצירים ב-
          $(\pm5,0)$, $(0,3)$ ו-$(0,-7)$. (ג) הגבוהה ביותר $(0,3)$, הנמוכה ביותר $(0,-7)$.
    source:
      name: "Paul Dawkins, Paul's Online Notes, Calculus II, Section 9.6 Polar Coordinates (Practice Problems)"
      year: 2026
      problem: 'Practice problems 8 and 15'
      url: https://tutorial.math.lamar.edu/Problems/CalcII/PolarCoordinates.aspx
      verified: '2026-11-18'
      adapted: true
