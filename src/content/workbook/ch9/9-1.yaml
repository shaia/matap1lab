# Workbook of lesson 9.1 — parametrised curves.
# Objectives (src/course.ts):
#   OBJ-9.1-1  describe a curve in the plane and in space by a parametrisation, and find its Cartesian equation when possible
#   OBJ-9.1-2  parametrise a segment, a circle, an ellipse, a helix and the graph of a function
#   OBJ-9.1-3  tell a curve (the set of points) from the graph of the vector function, its world line
# Order of knowledge: chapters 1–8 and 9.1 (no velocity vector, no arc length, no T or N).
# Every number recomputed with sympy in screens/tools/lesson-9-1.py.
lesson: '9.1'
practice:
  - id: W-9.1-01
    level: basic
    objectives: [OBJ-9.1-1]
    prompt: >-
      מצאו את המשוואה הקרטזית של כל עקום, ותארו אותו במילים.


      (א) $x=3-2t$, $y=1+4t$, $t\in\mathbb{R}$.


      (ב) $x=4\cos t$, $y=4\sin t$, $0\le t\le\frac\pi2$.
    answer: >-
      (א) $y=7-2x$: כל הישר. (ב) $x^2+y^2=16$, ורק רבע המעגל שברביע הראשון, מ-$(4,0)$ עד $(0,4)$.
    solution:
      - kind: idea
        text: >-
          ב-(א) אפשר לבודד את $t$ מהרכיב הראשון ולהציב בשני. ב-(ב) משתמשים בזהות $\cos^2t+\sin^2t=1$, ואחר כך בודקים איזה
          חלק של המעגל הקטע של $t$ נותן.
      - kind: computation
        text: >-
          (א) $2t=3-x$, כלומר $t=\frac{3-x}{2}$. בהצבה: $y=1+4\cdot\frac{3-x}{2}=1+2(3-x)=7-2x$.
      - kind: step
        text: >-
          $t$ עובר על כל הישר הממשי, ולכן גם $x=3-2t$ עובר על כל המספרים: העקום הוא כל הישר $y=7-2x$.
      - kind: computation
        text: >-
          (ב) $\frac x4=\cos t$ ו-$\frac y4=\sin t$, ולכן $\frac{x^2}{16}+\frac{y^2}{16}=1$, כלומר $x^2+y^2=16$: מעגל ברדיוס 4
          סביב הראשית.
      - kind: step
        text: >-
          ב-$0\le t\le\frac\pi2$ גם $\cos t\ge0$ וגם $\sin t\ge0$, ולכן $x\ge0$ ו-$y\ge0$: רק הרבע שברביע הראשון. ב-$t=0$
          הנקודה $(4,0)$ וב-$t=\frac\pi2$ הנקודה $(0,4)$, נגד כיוון השעון.
      - kind: check
        text: >-
          (א) ב-$t=0$ הנקודה $(3,1)$, ו-$7-2\cdot3=1$ ✓. (ב) ב-$t=\frac\pi4$ הנקודה $\left(2\sqrt2,2\sqrt2\right)$, ו-$8+8=16$ ✓.
      - kind: result
        text: >-
          (א) הישר $y=7-2x$. (ב) רבע המעגל $x^2+y^2=16$ שבו $x,y\ge0$, מ-$(4,0)$ עד $(0,4)$.

  - id: W-9.1-02
    level: basic
    objectives: [OBJ-9.1-2]
    prompt: >-
      $A=(-1,4)$ ו-$B=(3,-2)$.


      (א) כתבו פרמטריזציה לקטע מ-$A$ ל-$B$, $0\le t\le1$, ומצאו בעזרתה את אמצע הקטע.


      (ב) כתבו פרמטריזציה לאותו קטע, מ-$B$ ל-$A$.


      (ג) כתבו פרמטריזציה לגרף של $y=\sqrt x$ מהנקודה $(1,1)$ עד הנקודה $(4,2)$.
    answer: >-
      (א) $(-1+4t,\ 4-6t)$, האמצע $(1,1)$. (ב) $(3-4t,\ -2+6t)$, $0\le t\le1$. (ג) $\left(t,\sqrt t\right)$, $1\le t\le4$.
    solution:
      - kind: idea
        text: >-
          קטע הוא נקודת התחלה ועוד $t$ פעמים ההפרש בין הסוף להתחלה. גרף של $y=f(x)$ מקבל את $x$ עצמו כפרמטר.
      - kind: computation
        text: >-
          (א) $B-A=(3-(-1),\ -2-4)=(4,-6)$, ולכן $\vec r(t)=A+t(B-A)=(-1+4t,\ 4-6t)$. האמצע ב-$t=\frac12$: $(-1+2,\ 4-3)=(1,1)$.
      - kind: computation
        text: >-
          (ב) מתחילים ב-$B$ והולכים בכיוון $A-B=(-4,6)$: $(3-4t,\ -2+6t)$, $0\le t\le1$.
      - kind: step
        text: >-
          (ג) $x$ עובר מ-1 עד 4, ולכל $x$ הנקודה היא $\left(x,\sqrt x\right)$. לכן $\vec r(t)=\left(t,\sqrt t\right)$,
          $1\le t\le4$.
      - kind: check
        text: >-
          (א) $t=0$ נותן $(-1,4)=A$ ו-$t=1$ נותן $(3,-2)=B$ ✓, והאמצע הוא גם $\frac{A+B}{2}=(1,1)$ ✓. (ב) $t=0$ נותן $B$
          ו-$t=1$ נותן $A$ ✓. (ג) $t=4$ נותן $(4,2)$ ✓.
      - kind: result
        text: >-
          (א) $(-1+4t,\ 4-6t)$, $0\le t\le1$, האמצע $(1,1)$. (ב) $(3-4t,\ -2+6t)$, $0\le t\le1$. (ג) $\left(t,\sqrt t\right)$,
          $1\le t\le4$.

  - id: W-9.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-9.1-3]
    prompt: >-
      נקודה נעה על ציר $x$: בזמן $t$ היא ב-$\vec r(t)=\left(t^2-2t,\ 0\right)$, $0\le t\le3$.


      (א) מהו העקום, כלומר קבוצת הנקודות שהיא עוברת בהן?


      (ב) מהו קו העולם? באיזה ציור מהפיזיקה של התיכון אתם מכירים אותו?


      (ג) באילו רגעים הנקודה נמצאת בראשית? איך רואים את זה בעקום, ואיך בקו העולם?
    answer: >-
      (א) הקטע $x\in[-1,3]$ של ציר $x$. (ב) $\left(t,\ t^2-2t,\ 0\right)$: הפרבולה $x=t^2-2t$ במישור של $t$ ו-$x$, גרף מקום-זמן. (ג)
      ב-$t=0$ (ההתחלה) וב-$t=2$: בעקום זו נקודה אחת, ובקו העולם שתי נקודות, $(0,0,0)$ ו-$(2,0,0)$.
    solution:
      - kind: idea
        text: >-
          העקום הוא רק קבוצת המקומות, בלי זמן. קו העולם שם את $t$ ליד המקום, ולכן בתנועה על ישר הוא הגרף של המקום כפונקציה
          של הזמן.
      - kind: computation
        text: >-
          (א) $x(t)=t^2-2t=(t-1)^2-1$. בקטע $[0,3]$ הערך הקטן ביותר הוא $x(1)=-1$, והגדול ביותר $x(3)=3$. $x$ רציפה, ולכן
          מקבלת כל ערך ביניהם.
      - kind: step
        text: >-
          העקום הוא הקטע של ציר $x$ מ-$x=-1$ עד $x=3$. הנקודה יוצאת מהראשית שמאלה, מסתובבת ב-$x=-1$ ($t=1$), וממשיכה ימינה עד
          3. החלק $[-1,0]$ נעבר פעמיים, הלוך וחזור.
      - kind: step
        text: >-
          (ב) קו העולם הוא הנקודות $\left(t,\ t^2-2t,\ 0\right)$. הרכיב השלישי תמיד 0, ולכן כולן במישור $y=0$, המישור של
          ציר הזמן וציר $x$, ושם הן פרבולה: $x=t^2-2t$. זה גרף המקום כפונקציה של הזמן, כמו בפיזיקה של התיכון.
      - kind: computation
        text: >-
          (ג) $t^2-2t=0$ ב-$t=0$ וב-$t=2$: הנקודה בראשית פעמיים, בהתחלה וב-$t=2$. בעקום שני הרגעים הם אותה נקודה, הראשית,
          ואי אפשר להבחין ביניהם. בקו העולם הם $(0,0,0)$ ו-$(2,0,0)$: שתי נקודות שונות, כי הזמן שונה.
      - kind: check
        text: >-
          $x(2)=4-4=0$ ✓ ו-$x(1)=1-2=-1$ ✓. ובין $t=0$ ל-$t=2$, $x<0$: הנקודה באמת משמאל לראשית בזמן הזה.
      - kind: result
        text: >-
          העקום: הקטע $[-1,3]$ של ציר $x$. קו העולם: הפרבולה $x=t^2-2t$ במישור $(t,x)$. הראשית נעברת פעמיים, ב-$t=0$ וב-$t=2$.

  - id: W-9.1-04
    level: mid
    qualitative: true
    objectives: [OBJ-9.1-1, OBJ-9.1-3]
    prompt: >-
      נכון או לא נכון: העקום $x=\sin t$, $y=\cos2t$, $0\le t\le2\pi$, הוא הפרבולה $y=1-2x^2$. נמקו, ותארו איך הנקודה נעה.
      באילו ערכים של $t$ הנקודה נמצאת ב-$(0,1)$?
    answer: >-
      לא נכון: רק הקשת $|x|\le1$ של הפרבולה, מ-$(-1,-1)$ עד $(1,-1)$, הלוך וחזור. הנקודה ב-$(0,1)$ ב-$t=0$, $\pi$ ו-$2\pi$:
      בהתחלה, פעם אחת באמצע, ובסוף.
    solution:
      - kind: idea
        text: >-
          מסלקים את $t$ בעזרת זהות הזווית הכפולה, $\cos2t=1-2\sin^2t$, ואחר כך בודקים את הטווח של $x$.
      - kind: computation
        text: >-
          $y=\cos2t=1-2\sin^2t=1-2x^2$. כל נקודה של העקום על הפרבולה.
      - kind: step
        text: >-
          אבל $|x|=|\sin t|\le1$ תמיד. לכן העקום הוא רק הקשת $|x|\le1$ של הפרבולה. למשל $(2,-7)$ על הפרבולה, אבל
          דורשת $\sin t=2$. הטענה **לא נכונה**.
      - kind: computation
        text: >-
          טבלה: $t=0$: $(0,1)$; $t=\frac\pi2$: $(1,-1)$; $t=\pi$: $(0,1)$; $t=\frac{3\pi}{2}$: $(-1,-1)$; $t=2\pi$: $(0,1)$.
      - kind: step
        text: >-
          הנקודה יוצאת מהקודקוד $(0,1)$ ימינה ולמטה עד $(1,-1)$, חוזרת לקודקוד, ממשיכה שמאלה עד $(-1,-1)$, וחוזרת. $x=0$
          כש-$\sin t=0$, כלומר ב-$t=0,\pi,2\pi$: בהתחלה, באמצע ובסוף. ($t=0$ ו-$t=2\pi$ הם ההתחלה והסוף: העקום פשוט חוזר
          לנקודת ההתחלה. רק $t=\pi$ הוא מעבר נוסף באמצע הדרך.) בקו העולם אלה שלוש נקודות שונות, $(0,0,1)$, $(\pi,0,1)$
          ו-$(2\pi,0,1)$.
      - kind: check
        text: >-
          ב-$t=\frac\pi6$: $\left(\frac12,\cos\frac\pi3\right)=\left(\frac12,\frac12\right)$, ו-$1-2\cdot\frac14=\frac12$ ✓.
      - kind: result
        text: >-
          לא נכון. העקום הוא הקשת $|x|\le1$ של $y=1-2x^2$, שנעברת הלוך וחזור; הנקודה ב-$(0,1)$ ב-$t=0$, $\pi$ ו-$2\pi$ (התחלה,
          אמצע, סוף).

  - id: W-9.1-05
    level: mid
    objectives: [OBJ-9.1-2]
    prompt: >-
      כתבו פרמטריזציה, $0\le t\le2\pi$, לאליפסה שמרכזה $(2,-1)$, חצי הציר האופקי שלה 3 והאנכי 1, כך שהנקודה תתחיל בקודקוד
      העליון ותקיף את האליפסה פעם אחת **עם** כיוון השעון. כתבו גם את המשוואה הקרטזית.
    answer: >-
      $\vec r(t)=\left(2+3\sin t,\ -1+\cos t\right)$, $0\le t\le2\pi$; $\frac{(x-2)^2}{9}+(y+1)^2=1$.
    solution:
      - kind: idea
        text: >-
          מתחילים מהצורה $\left(x_0+a\cos t,\ y_0+b\sin t\right)$, שמתחילה בקודקוד הימני ונעה נגד כיוון השעון, ומחליפים בין
          קוסינוס לסינוס: אז ב-$t=0$ הנקודה למעלה, והתנועה הולכת ימינה, עם כיוון השעון.
      - kind: computation
        text: >-
          המרכז $(2,-1)$, $a=3$, $b=1$. הצעה: $x=2+3\sin t$, $y=-1+\cos t$.
      - kind: check
        text: >-
          $t=0$: $(2,0)$, הקודקוד העליון ✓. $t=\frac\pi2$: $(5,-1)$, הקודקוד הימני. $t=\pi$: $(2,-2)$, התחתון. מלמעלה, ימינה,
          למטה: עם כיוון השעון ✓.
      - kind: computation
        text: >-
          המשוואה: $\frac{x-2}{3}=\sin t$ ו-$y+1=\cos t$, ולכן $\frac{(x-2)^2}{9}+(y+1)^2=\sin^2t+\cos^2t=1$.
      - kind: step
        text: >-
          שימו לב: בפרמטריזציה מופיעים חצאי הצירים 3 ו-1, ובמשוואה הריבועים שלהם, 9 ו-1. המרכז מתווסף בפרמטריזציה כמו שהוא,
          ובמשוואה מופיע עם סימן הפוך.
      - kind: result
        text: >-
          $\left(2+3\sin t,\ -1+\cos t\right)$, $0\le t\le2\pi$; $\frac{(x-2)^2}{9}+(y+1)^2=1$.

  - id: W-9.1-06
    level: mid
    objectives: [OBJ-9.1-2]
    prompt: >-
      מעקה של מדרגות לולייניות הוא סליל ברדיוס $1.5$ מטרים סביב ציר $z$. הוא מתחיל ב-$(1.5,0,0)$, עולה 3 מטרים בסיבוב וחצי,
      ומסתובב **עם** כיוון השעון כשמסתכלים מלמעלה.


      (א) כתבו לו פרמטריזציה, עם קטע לפרמטר.


      (ב) איפה הוא מסתיים, ואיפה הוא נמצא אחרי רבע סיבוב?
    answer: >-
      (א) $\left(1.5\cos t,\ -1.5\sin t,\ \frac{t}{\pi}\right)$, $0\le t\le3\pi$. (ב) מסתיים ב-$(-1.5,0,3)$; אחרי רבע סיבוב ב-$(0,-1.5,0.5)$.
    solution:
      - kind: idea
        text: >-
          מעגל ברדיוס $1.5$, עם מינוס בסינוס כדי להסתובב עם כיוון השעון, ורכיב $z$ לינארי ב-$t$. את המקדם קובעים מהעלייה
          בסיבוב אחד.
      - kind: computation
        text: >-
          3 מטרים בסיבוב וחצי הם 2 מטרים בסיבוב. סיבוב הוא $t$ שגדל ב-$2\pi$, ולכן $z=\frac{2}{2\pi}t=\frac t\pi$.
      - kind: step
        text: >-
          (א) $\vec r(t)=\left(1.5\cos t,\ -1.5\sin t,\ \frac t\pi\right)$. סיבוב וחצי הם $t$ מ-0 עד $3\pi$.
      - kind: computation
        text: >-
          (ב) $t=3\pi$: $\left(1.5\cos3\pi,\ -1.5\sin3\pi,\ 3\right)=(-1.5,0,3)$. רבע סיבוב, $t=\frac\pi2$:
          $\left(0,\ -1.5,\ \frac12\right)$.
      - kind: check
        text: >-
          מ-$(1.5,0)$ אל $(0,-1.5)$ במבט מלמעלה זה ימינה ולמטה, עם כיוון השעון ✓. $z(3\pi)=3$ ✓, ובכל $t$
          $x^2+y^2=2.25$: על גליל ברדיוס $1.5$ ✓.
      - kind: result
        text: >-
          $\left(1.5\cos t,\ -1.5\sin t,\ \frac t\pi\right)$, $0\le t\le3\pi$; הסוף $(-1.5,0,3)$, ואחרי רבע סיבוב $(0,-1.5,0.5)$.

  - id: W-9.1-07
    level: mid
    objectives: [OBJ-9.1-2]
    prompt: >-
      (א) כתבו פרמטריזציה לחלק של הפרבולה $x=y^2-2y$ שבו $y\in[-1,3]$. מאיפה היא מתחילה, איפה מסתיימת, ובאיזה $t$ היא
      בקודקוד?


      (ב) כתבו פרמטריזציה לגרף של $y=x^3$ מהנקודה $(2,8)$ אל הנקודה $(-1,-1)$, כלומר מימין לשמאל, עם $0\le t\le3$.
    answer: >-
      (א) $\left(t^2-2t,\ t\right)$, $t\in[-1,3]$: מ-$(3,-1)$ עד $(3,3)$, הקודקוד $(-1,1)$ ב-$t=1$. (ב) $\left(2-t,\ (2-t)^3\right)$, $0\le t\le3$.
    solution:
      - kind: idea
        text: >-
          כשהעקום הוא גרף של $x$ כפונקציה של $y$, לוקחים את $y$ כפרמטר: $\bigl(f(t),t\bigr)$. כדי ללכת על גרף מימין לשמאל
          מציבים במקום $x$ פונקציה **יורדת** של $t$.
      - kind: step
        text: >-
          (א) $y=t$ ו-$x=t^2-2t$, עם $t\in[-1,3]$.
      - kind: computation
        text: >-
          $t=-1$: $(1+2,\ -1)=(3,-1)$. $t=3$: $(9-6,\ 3)=(3,3)$. $x=(t-1)^2-1$ קטן ביותר ב-$t=1$: הקודקוד $(-1,1)$.
      - kind: step
        text: >-
          (ב) $x=2-t$ יורד מ-2 עד $x=-1$ כש-$t$ עולה מ-0 עד 3, ו-$y=x^3=(2-t)^3$.
      - kind: check
        text: >-
          (ב) $t=0$: $(2,8)$ ✓; $t=3$: $(-1,-1)$ ✓; $t=1$: $(1,1)$, על $y=x^3$ ✓. (א) הפרבולה נפתחת ימינה, והקודקוד משמאל לשני
          הקצוות ✓.
      - kind: result
        text: >-
          (א) $\left(t^2-2t,\ t\right)$, $t\in[-1,3]$, מ-$(3,-1)$ דרך הקודקוד $(-1,1)$ עד $(3,3)$. (ב) $\left(2-t,\ (2-t)^3\right)$,
          $0\le t\le3$.

  - id: W-9.1-08
    level: exam
    objectives: [OBJ-9.1-1]
    prompt: >-
      העקום $x=\frac{1}{1+t^2}$, $y=\frac{t}{1+t^2}$, $t\in\mathbb{R}$.


      (א) הראו ש-$y=t\,x$, ומצאו משוואה קרטזית של העקום. (רמז: הציבו $t=\frac yx$ במשוואה של $x$.)


      (ב) זהו את העקום. האם הוא כל הקבוצה של המשוואה?


      (ג) תארו את התנועה כש-$t$ עובר על כל הישר הממשי, מהשליליים הגדולים אל החיוביים הגדולים.
    answer: >-
      (א) $x^2+y^2=x$. (ב) המעגל $\left(x-\frac12\right)^2+y^2=\frac14$ בלי הראשית. (ג) מקרבת הראשית מלמטה, דרך $(1,0)$ ב-$t=0$, אל
      קרבת הראשית מלמעלה: נגד כיוון השעון.
    solution:
      - kind: idea
        text: >-
          כאן אי אפשר לבודד את $t$ מרכיב אחד בקלות, אבל היחס $\frac yx$ הוא בדיוק $t$. מציבים אותו, ואחר כך בודקים טווח:
          $x$ תמיד חיובי.
      - kind: computation
        text: >-
          (א) $\frac yx=\frac{t/(1+t^2)}{1/(1+t^2)}=t$ ($x\ne0$ תמיד). מהמשוואה של $x$: $x\,(1+t^2)=1$. מציבים $t=\frac yx$:
          $x+\frac{y^2}{x}=1$, ובכפל ב-$x$: $x^2+y^2=x$.
      - kind: step
        text: >-
          (ב) השלמה לריבוע: $x^2-x+\frac14+y^2=\frac14$, כלומר $\left(x-\frac12\right)^2+y^2=\frac14$: מעגל ברדיוס $\frac12$ סביב
          $\left(\frac12,0\right)$. הוא עובר דרך הראשית.
      - kind: step
        text: >-
          אבל $x=\frac{1}{1+t^2}>0$ לכל $t$, ולכן הראשית, הנקודה היחידה של המעגל עם $x=0$, לא מתקבלת. כל נקודה אחרת $(x,y)$ של
          המעגל מתקבלת עם $t=\frac yx$: אז $1+t^2=\frac{x^2+y^2}{x^2}$, ועל המעגל $x^2+y^2=x$, ולכן $1+t^2=\frac{x}{x^2}=\frac1x$.
          מכאן $\frac{1}{1+t^2}=x$ ו-$\frac{t}{1+t^2}=\frac yx\cdot x=y$.
          העקום הוא המעגל בלי הראשית.
      - kind: step
        text: >-
          (ג) $t<0$ נותן $y<0$ ו-$t>0$ נותן $y>0$. כש-$t\to\pm\infty$, גם $x$ וגם $y$ שואפים ל-0. הנקודה מגיעה מקרבת הראשית
          מתחת לציר, עוברת ב-$\left(\frac12,-\frac12\right)$ ב-$t=-1$, ב-$(1,0)$ ב-$t=0$, ב-$\left(\frac12,\frac12\right)$ ב-$t=1$,
          ומתקרבת שוב לראשית מעל הציר: נגד כיוון השעון, בלי להגיע לראשית אף פעם.
      - kind: check
        text: >-
          $t=2$: $\left(\frac15,\frac25\right)$, ו-$\frac{1}{25}+\frac{4}{25}=\frac15=x$ ✓.
      - kind: result
        text: >-
          $x^2+y^2=x$: המעגל ברדיוס $\frac12$ סביב $\left(\frac12,0\right)$ בלי הראשית, נגד כיוון השעון, מ-$(1,0)$ ב-$t=0$.

  - id: W-9.1-09
    level: exam
    objectives: [OBJ-9.1-1, OBJ-9.1-3]
    prompt: >-
      העקום $\vec r(t)=(\cos t,\ \sin2t)$, $0\le t\le2\pi$.


      (א) מצאו נקודת חיתוך עצמי: נקודה ששני ערכים שונים של $t$ בתוך $(0,2\pi)$ נותנים.


      (ב) הראו ש-$y^2=4x^2\left(1-x^2\right)$. האם העקום הוא כל הקבוצה של המשוואה הזו?


      (ג) מהן שתי הנקודות של קו העולם מעל נקודת החיתוך?
    answer: >-
      (א) $(0,0)$, ב-$t=\frac\pi2$ וב-$t=\frac{3\pi}{2}$. (ב) כן: כל הקבוצה, צורה של שמונה. (ג) $\left(\frac\pi2,0,0\right)$ ו-$\left(\frac{3\pi}{2},0,0\right)$.
    solution:
      - kind: idea
        text: >-
          $x$ שווים פירושו $\cos t_1=\cos t_2$, ובקטע $(0,2\pi)$ זה $t_2=2\pi-t_1$. אחר כך דורשים גם $y$ שווים. למשוואה:
          $\sin2t=2\sin t\cos t$ ו-$\sin^2t=1-\cos^2t$.
      - kind: computation
        text: >-
          (א) $t_2=2\pi-t_1$ עם $t_1\in(0,\pi)$. $\sin2t_2=\sin(4\pi-2t_1)=-\sin2t_1$. כדי ש-$y$ יהיו שווים צריך
          $\sin2t_1=-\sin2t_1$, כלומר $\sin2t_1=0$. ב-$(0,\pi)$ זה רק $t_1=\frac\pi2$, ואז $t_2=\frac{3\pi}{2}$.
      - kind: step
        text: >-
          $\vec r\left(\frac\pi2\right)=(0,\sin\pi)=(0,0)$ ו-$\vec r\left(\frac{3\pi}{2}\right)=(0,\sin3\pi)=(0,0)$: העקום חותך את עצמו
          בראשית. (גם $t=0$ ו-$t=2\pi$ נותנים אותה נקודה, $(1,0)$, אבל אלה ההתחלה והסוף: העקום פשוט סגור.)
      - kind: computation
        text: >-
          (ב) $y^2=4\sin^2t\cos^2t$, ו-$\sin^2t=1-\cos^2t=1-x^2$, ולכן $y^2=4x^2\left(1-x^2\right)$.
      - kind: step
        text: >-
          הקבוצה של המשוואה: $1-x^2\ge0$, כלומר $|x|\le1$, ולכל $x$ כזה $y=\pm2x\sqrt{1-x^2}$. ב-$0\le t\le\pi$, $\sin t\ge0$ ולכן
          $\sin t=\sqrt{1-x^2}$ ו-$y=2x\sqrt{1-x^2}$; ב-$\pi\le t\le2\pi$, $\sin t\le0$ ו-$y=-2x\sqrt{1-x^2}$. $x=\cos t$ עובר על כל
          $[-1,1]$ בכל אחד מהחצאים, ולכן שני הסימנים מתקבלים לכל $x$: כל הקבוצה, שנראית כמו הספרה 8 על הצד.
      - kind: step
        text: >-
          (ג) קו העולם הוא $\bigl(t,\cos t,\sin2t\bigr)$, ומעל הראשית הוא עובר ב-$\left(\frac\pi2,0,0\right)$ וב-$\left(\frac{3\pi}{2},0,0\right)$:
          אותו מקום, זמנים שונים. קו העולם עצמו אינו חותך את עצמו.
      - kind: check
        text: >-
          $t=\frac\pi4$: $\left(\frac{\sqrt2}{2},1\right)$, ו-$4\cdot\frac12\cdot\frac12=1=y^2$ ✓.
      - kind: result
        text: >-
          חיתוך עצמי בראשית, ב-$t=\frac\pi2$ וב-$t=\frac{3\pi}{2}$; העקום הוא כל הקבוצה $y^2=4x^2(1-x^2)$; בקו העולם
          $\left(\frac\pi2,0,0\right)$ ו-$\left(\frac{3\pi}{2},0,0\right)$.

  - id: W-9.1-10
    level: exam
    qualitative: true
    objectives: [OBJ-9.1-1, OBJ-9.1-2]
    prompt: >-
      $\vec r(t)=\left(2\cos t,\ 2\sin t,\ 4\sin^2t\right)$, $0\le t\le2\pi$.


      (א) הראו שהעקום נמצא על הגליל $x^2+y^2=4$ וגם על המשטח $z=y^2$. מהו ההיטל שלו על מישור $xy$?


      (ב) סטודנטית בדקה ש-$\vec r(0)$ ו-$\vec r\left(\frac\pi2\right)$ מקיימות $z=2y$, והסיקה שהעקום נמצא במישור $z=2y$. נכון או
      לא נכון?


      (ג) מצאו את הנקודות הגבוהות ביותר ואת הנמוכות ביותר של העקום.
    answer: >-
      (א) $x^2+y^2=4$ ו-$z=4\sin^2t=y^2$ לכל $t$; ההיטל: המעגל ברדיוס 2. (ב) לא נכון: ב-$t=\frac\pi6$ הנקודה $\left(\sqrt3,1,1\right)$,
      ו-$1\ne2$. (ג) הגבוהות $(0,\pm2,4)$, הנמוכות $(\pm2,0,0)$.
    solution:
      - kind: idea
        text: >-
          עקום נמצא על משטח אם הצבת כל הפרמטריזציה נותנת זהות לכל $t$. בדיקה בנקודות בודדות יכולה רק להפריך, לא להוכיח.
      - kind: computation
        text: >-
          (א) $x^2+y^2=4\cos^2t+4\sin^2t=4$ לכל $t$ ✓, ו-$y^2=4\sin^2t=z$ לכל $t$ ✓. ההיטל $(2\cos t,2\sin t,0)$ הוא מעגל ברדיוס 2
          סביב הראשית, פעם אחת.
      - kind: step
        text: >-
          (ב) לא נכון. שתי נקודות שמקיימות $z=2y$ אינן מראות שכל העקום מקיים אותה. ב-$t=\frac\pi6$: $\left(\sqrt3,\ 1,\ 4\cdot\frac14\right)=\left(\sqrt3,1,1\right)$,
          ו-$2y=2\ne1=z$. (בנקודות $t=0$ ו-$t=\frac\pi2$, $(2,0,0)$ ו-$(0,2,4)$, השוויון במקרה מתקיים.)
      - kind: computation
        text: >-
          (ג) $z=4\sin^2t$ בין 0 ל-4. $z=4$ כש-$\sin t=\pm1$: $t=\frac\pi2$ נותן $(0,2,4)$ ו-$t=\frac{3\pi}{2}$ נותן $(0,-2,4)$.
          $z=0$ כש-$\sin t=0$: $t=0$ נותן $(2,0,0)$ ו-$t=\pi$ נותן $(-2,0,0)$.
      - kind: check
        text: >-
          מאחר ש-$y^2=4-x^2$ על הגליל, העקום נמצא גם על $z=4-x^2$: בנקודות הגבוהות $x=0$ ו-$z=4$ ✓, ובנמוכות $x=\pm2$ ו-$z=0$ ✓.
      - kind: result
        text: >-
          על הגליל $x^2+y^2=4$ ועל $z=y^2$; ההיטל מעגל ברדיוס 2; הטענה (ב) לא נכונה; הגבוהות $(0,\pm2,4)$, הנמוכות $(\pm2,0,0)$.

challenge:
  - id: W-9.1-c1
    stars: 1
    objectives: [OBJ-9.1-1, OBJ-9.1-2]
    prompt: >-
      הגליל $x^2+y^2=4$ נחתך על ידי המישור $x+z=6$.


      (א) מצאו פונקציה וקטורית שמתארת את עקום החיתוך.


      (ב) מצאו את הנקודה הגבוהה ביותר ואת הנמוכה ביותר של העקום.


      (ג) הנקודה $C=(0,0,6)$ נמצאת במישור. הראו ש-$\vec r(t)-C=2\sqrt2\cos t\,\vec e_1+2\sin t\,\vec e_2$, עם
      $\vec e_1=\frac{1}{\sqrt2}(1,0,-1)$ ו-$\vec e_2=(0,1,0)$. הסיקו שבתוך המישור העקום הוא אליפסה, ומצאו את חצאי הצירים שלה.
    answer: >-
      (א) $\vec r(t)=\left(2\cos t,\ 2\sin t,\ 6-2\cos t\right)$, $0\le t\le2\pi$. (ב) הגבוהה $(-2,0,8)$, הנמוכה $(2,0,4)$. (ג) אליפסה עם
      חצאי צירים $2\sqrt2$ ו-2 סביב $C$.
    solution:
      - kind: idea
        text: >-
          נקודה של החיתוך נמצאת על הגליל, ולכן ההיטל שלה על מישור $xy$ הוא על המעגל ברדיוס 2: $(2\cos t,2\sin t)$. את $z$
          מוצאים ממשוואת המישור. אחר כך כותבים את העקום בעזרת שני וקטורי יחידה ניצבים בתוך המישור, כמו צירים.
      - kind: computation
        text: >-
          (א) $x=2\cos t$, $y=2\sin t$, ומהמישור $z=6-x=6-2\cos t$. בדיקה: $x^2+y^2=4$ ✓ ו-$x+z=6$ ✓ לכל $t$.
      - kind: computation
        text: >-
          (ב) $z=6-2\cos t$ בין 4 ל-8. הנמוכה ב-$t=0$: $(2,0,4)$; הגבוהה ב-$t=\pi$: $(-2,0,8)$.
      - kind: computation
        text: >-
          (ג) $\vec r(t)-C=(2\cos t,\ 2\sin t,\ -2\cos t)$, כלומר $2\cos t\,(1,0,-1)+2\sin t\,(0,1,0)$, ו-$(1,0,-1)=\sqrt2\,\vec e_1$. לכן
          $\vec r(t)-C=2\sqrt2\cos t\,\vec e_1+2\sin t\,\vec e_2$.
      - kind: step
        text: >-
          $\vec e_1$ ו-$\vec e_2$ וקטורי יחידה ($\left|\vec e_1\right|=\frac{\sqrt2}{\sqrt2}=1$), ניצבים ($\vec e_1\cdot\vec e_2=0$), ושניהם
          במישור, כי הם ניצבים לנורמל $(1,0,1)$ שלו. אם קוראים להם "ציר $u$" ו"ציר $w$" של המישור, הנקודה היא
          $(u,w)=\left(2\sqrt2\cos t,\ 2\sin t\right)$: הפרמטריזציה של אליפסה עם חצאי צירים $2\sqrt2$ ו-2 (שיעור 2.1).
      - kind: check
        text: >-
          $\left|\vec r(t)-C\right|^2=4\cos^2t+4\sin^2t+4\cos^2t$, כלומר $4+4\cos^2t$: המרחק מ-$C$ בין 2 (ב-$t=\frac\pi2$, הנקודה $(0,2,6)$)
          ל-$2\sqrt2$ (ב-$t=0$), בדיוק חצאי הצירים ✓.
      - kind: result
        text: >-
          $\vec r(t)=\left(2\cos t,\ 2\sin t,\ 6-2\cos t\right)$; הגבוהה $(-2,0,8)$, הנמוכה $(2,0,4)$; אליפסה סביב $(0,0,6)$ עם חצאי
          צירים $2\sqrt2$ ו-2.
    source:
      name: 'G. Strang, E. Herman, Calculus Volume 3 (OpenStax)'
      year: 2016
      problem: 'Chapter 3 Review Exercises, exercise 210 (find a vector function for the intersection of the cylinder x²+y²=4 with the plane x+z=6); parts (b) and (c) added'
      url: https://openstax.org/books/calculus-volume-3/pages/3-review-exercises
      verified: '2026-11-27'
      adapted: true

  - id: W-9.1-c2
    stars: 1
    objectives: [OBJ-9.1-1]
    prompt: >-
      העקום $x=\frac{2\cos t}{\sin t}$, $y=1-\cos2t$ נקרא "המכשפה של אנייזי". הפרמטר עובר על שני קטעים, $\left[-\frac\pi2,0\right)$
      ו-$\left(0,\frac\pi2\right]$: ב-$t=0$ הנוסחה של $x$ אינה מוגדרת, ולכן זו פרמטריזציה על שני קטעים, ולא על קטע אחד כמו
      בשיעור.


      (א) הראו ש-$y=\frac{8}{x^2+4}$. (רמז: $1-\cos2t=2\sin^2t$.)


      (ב) האם העקום הוא כל הגרף של $y=\frac{8}{x^2+4}$? תארו את התנועה: מאיפה הנקודה מתחילה, לאן היא נעה, ואיזו נקודה היא
      עוברת פעמיים.


      (ג) כתבו פרמטריזציה של אותו עקום שעוברת עליו פעם אחת, משמאל לימין.
    answer: >-
      (א) $y=2\sin^2t$ ו-$x^2+4=\frac{4}{\sin^2t}$. (ב) כן, כל הגרף. הנקודה מתחילה ב-$(0,2)$, נעה שמאלה אל אינסוף, "חוזרת" מימין
      ומסתיימת שוב ב-$(0,2)$. (ג) $\left(s,\frac{8}{s^2+4}\right)$, $s\in\mathbb{R}$.
    solution:
      - kind: idea
        text: >-
          מבטאים את $y$ ואת $x^2+4$ דרך $\sin^2t$ בלבד, ומסלקים אותו. אחר כך בודקים איך $x$ משתנה בקטע החיובי, ומעבירים
          לקטע השלילי בסימטריה.
      - kind: computation
        text: >-
          (א) $y=1-\cos2t=2\sin^2t$, ו-$x^2+4=\frac{4\cos^2t+4\sin^2t}{\sin^2t}=\frac{4}{\sin^2t}$. לכן $\sin^2t=\frac{4}{x^2+4}$,
          ו-$y=\frac{8}{x^2+4}$.
      - kind: step
        text: >-
          (ב) ב-$0<t\le\frac\pi2$: כש-$t$ גדל, $\cos t$ קטן ו-$\sin t$ גדל, ולכן $x=\frac{2\cos t}{\sin t}$ קטן. ליד 0 הוא ענק
          וחיובי, וב-$\frac\pi2$ הוא 0. החלק הזה נותן את כל $x\ge0$, מימין אל $(0,2)$.
      - kind: step
        text: >-
          הקטע השלילי, בעזרת סימטריה: $\cos(-t)=\cos t$ ו-$\sin(-t)=-\sin t$, ולכן $x(-t)=-x(t)$ ו-$y(-t)=y(t)$. הנקודה ברגע
          $-t$ היא השיקוף של הנקודה ברגע $t$ ביחס לציר $y$. לכן הקטע $\left[-\frac\pi2,0\right)$ נותן את השיקוף של החלק הקודם: כל
          $x\le0$, מ-$x=0$ ב-$t=-\frac\pi2$ ועד ערכים שליליים ענקיים ליד $t=0$. יחד מתקבל כל הגרף.
      - kind: step
        text: >-
          המסלול: ב-$t=-\frac\pi2$ הנקודה $(0,2)$, היא נעה שמאלה ונעלמת לאינסוף כש-$t\to0^-$. כש-$t\to0^+$ היא מופיעה רחוק מימין,
          ונעה שמאלה עד $(0,2)$ ב-$t=\frac\pi2$. הנקודה $(0,2)$, הגבוהה ביותר, מתקבלת פעמיים.
      - kind: step
        text: >-
          (ג) העקום הוא גרף של פונקציה, ולכן $\left(s,\frac{8}{s^2+4}\right)$, $s\in\mathbb{R}$, עוברת עליו פעם אחת משמאל לימין.
      - kind: check
        text: >-
          $t=\frac\pi4$: $x=2$, $y=1-\cos\frac\pi2=1$, ו-$\frac{8}{4+4}=1$ ✓. $t=-\frac\pi4$: $(-2,1)$, הנקודה הסימטרית ✓.
      - kind: result
        text: >-
          $y=\frac{8}{x^2+4}$, כל הגרף; $(0,2)$ מתקבלת פעמיים, ב-$t=\pm\frac\pi2$; פרמטריזציה פשוטה: $\left(s,\frac{8}{s^2+4}\right)$.
    source:
      name: 'G. Strang, E. Herman, Calculus Volume 3 (OpenStax)'
      year: 2016
      problem: 'Section 1.1 (Parametric Equations), exercise 60 (the witch of Agnesi, x = 2 cot t, y = 1 − cos 2t); cot written as cos/sin, the graphing replaced by eliminating the parameter and tracing the motion'
      url: https://openstax.org/books/calculus-volume-3/pages/1-1-parametric-equations
      verified: '2026-11-27'
      adapted: true
