# Workbook of lesson 1.3 — lines and planes.
# Objectives (src/course.ts):
#   OBJ-1.3-1  a line in space in parametric and canonical form, through a point with a direction or through two points
#   OBJ-1.3-2  a plane from a point and a normal vector; the meaning of the coefficients
#   OBJ-1.3-3  line ∩ plane, is a point on a plane, distance from a point to a plane
# No cross product (lesson 1.4) and no determinant (1.5) anywhere. Every number recomputed with sympy in
# screens/tools/lesson-1-3.py (section WORKBOOK).
lesson: '1.3'
practice:
  - id: W-1.3-01
    level: basic
    objectives: [OBJ-1.3-1]
    prompt: >-
      ישר עובר דרך הנקודה $(2,0,-1)$, ווקטור הכיוון שלו $\vec v=(1,-2,3)$.

      (א) כתבו את הישר בהצגה פרמטרית ובצורה הקנונית.

      (ב) איזו נקודה מתקבלת עבור $t=2$?

      (ג) באיזו נקודה הישר חוצה את מישור $xy$ (המישור $z=0$)?
    answer: >-
      (א) $x=2+t$, $y=-2t$, $z=-1+3t$; $\frac{x-2}{1}=\frac{y}{-2}=\frac{z+1}{3}$. (ב) $(4,-4,5)$.
      (ג) $\left(\frac73,-\frac23,0\right)$, ב-$t=\frac13$.
    solution:
      - kind: idea
        text: >-
          נקודה ועוד $t$ כפול כיוון. הצורה הקנונית מתקבלת מבידוד של $t$ בכל משוואה. במישור $xy$ מתקיים $z=0$, וזה תנאי על $t$.
      - kind: computation
        text: >-
          (א) $x=2+1\cdot t$, $y=0+(-2)t$, $z=-1+3t$. מבודדים: $t=\frac{x-2}{1}=\frac{y}{-2}=\frac{z+1}{3}$.
      - kind: computation
        text: >-
          (ב) $t=2$: $(2+2,\ -4,\ -1+6)=(4,-4,5)$.
      - kind: computation
        text: >-
          (ג) $z=0$ פירושו $-1+3t=0$, כלומר $t=\frac13$. מציבים בחזרה: $x=2+\frac13=\frac73$, $y=-\frac23$.
      - kind: check
        text: >-
          ב-$t=0$ מתקבלת הנקודה הנתונה. הנקודה $(4,-4,5)$ בצורה הקנונית: $\frac21=\frac{-4}{-2}=\frac63=2$, שהוא ה-$t$ שלה.
      - kind: result
        text: >-
          $x=2+t$, $y=-2t$, $z=-1+3t$; $\frac{x-2}{1}=\frac{y}{-2}=\frac{z+1}{3}$; $(4,-4,5)$; $\left(\frac73,-\frac23,0\right)$.

  - id: W-1.3-02
    level: basic
    objectives: [OBJ-1.3-2]
    prompt: >-
      מישור עובר דרך הנקודה $(2,-1,4)$, והנורמל שלו $\vec n=(3,2,-1)$.

      (א) כתבו את משוואת המישור.

      (ב) האם המישור עובר דרך הראשית?

      (ג) כתבו נורמל אחר לאותו מישור, ונקודה נוספת עליו.
    answer: >-
      (א) $3x+2y-z=0$. (ב) כן, כי $d=0$. (ג) למשל הנורמל $(-6,-4,2)$ והנקודה $(1,-1,1)$.
    solution:
      - kind: idea
        text: >-
          המקדמים הם רכיבי הנורמל, ו-$d=\vec n\cdot P_0$. המישור עובר דרך הראשית בדיוק כש-$d=0$.
      - kind: computation
        text: >-
          (א) $d=3\cdot2+2\cdot(-1)+(-1)\cdot4=6-2-4=0$. המישור: $3x+2y-z=0$.
      - kind: step
        text: >-
          (ב) הראשית נותנת באגף שמאל 0, ו-$d=0$: היא על המישור.
      - kind: step
        text: >-
          (ג) כל כפולה של $\vec n$ במספר שונה מאפס היא נורמל, למשל $-2\vec n=(-6,-4,2)$. לנקודה בוחרים $x=1$, $y=-1$ ומחלצים
          $z=3x+2y=1$: הנקודה $(1,-1,1)$.
      - kind: check
        text: >-
          הנקודה הנתונה: $6-2-4=0$. הנקודה $(1,-1,1)$: $3-2-1=0$.
      - kind: result
        text: >-
          $3x+2y-z=0$; המישור עובר דרך הראשית; נורמל נוסף $(-6,-4,2)$ ונקודה נוספת $(1,-1,1)$ (יש תשובות רבות ל-(ג)).

  - id: W-1.3-03
    level: basic
    objectives: [OBJ-1.3-3]
    prompt: >-
      אילו מהנקודות $(1,1,1)$, $(2,0,3)$, $(0,4,-1)$ ו-$(0,0,-1)$ נמצאות על המישור $2x+y-z=1$? לכל נקודה שאינה על המישור,
      קבעו אם היא בצד שאליו מצביע הנורמל $(2,1,-1)$ או בצד השני.
    answer: >-
      על המישור: $(2,0,3)$ ו-$(0,0,-1)$. הנקודות $(1,1,1)$ ו-$(0,4,-1)$ אינן עליו, ושתיהן בצד שאליו מצביע הנורמל.
    solution:
      - kind: idea
        text: >-
          מציבים באגף שמאל ומשווים ל-$d=1$. ההפרש $r=2x+y-z-1$ הוא אפס על המישור, חיובי בצד של הנורמל ושלילי בצד השני.
      - kind: computation
        text: >-
          $(1,1,1)$: $2+1-1=2$, $r=1$. $(2,0,3)$: $4+0-3=1$, $r=0$. $(0,4,-1)$: $0+4+1=5$, $r=4$. $(0,0,-1)$: $0+0+1=1$, $r=0$.
      - kind: check
        text: >-
          הסימן: מהנקודה $(0,0,-1)$ שעל המישור הולכים צעד אחד בכיוון הנורמל ומגיעים ל-$(2,1,-2)$, שנותנת $4+1+2=7>1$. אכן
          $r>0$ בצד של הנורמל.
      - kind: result
        text: >-
          $(2,0,3)$ ו-$(0,0,-1)$ על המישור. $(1,1,1)$ ו-$(0,4,-1)$ אינן עליו, ושתיהן בצד שאליו מצביע $(2,1,-1)$.

  - id: W-1.3-04
    level: mid
    qualitative: true
    objectives: [OBJ-1.3-1]
    prompt: >-
      נתונים שלושה ישרים:

      $$L_1:\ (1,2,0)+t(2,-1,3),\qquad L_2:\ (5,0,6)+s(-4,2,-6),\qquad L_3:\ (3,1,4)+u(2,-1,3).$$

      לכל זוג מהם קבעו: אותו ישר, או שני ישרים מקבילים שונים? נמקו.
    answer: >-
      $L_1$ ו-$L_2$ הם אותו ישר. $L_3$ מקביל לשניהם ושונה מהם.
    solution:
      - kind: idea
        text: >-
          קודם משווים כיוונים: אם הם כפולה זה של זה, הישרים מקבילים או זהים. כדי להכריע בודקים נקודה אחת של ישר אחד: אם
          היא על הישר השני, הישרים זהים.
      - kind: step
        text: >-
          הכיוונים: $(-4,2,-6)=-2\,(2,-1,3)$, והכיוון של $L_3$ שווה לזה של $L_1$. שלושת הישרים מקבילים זה לזה או זהים.
      - kind: computation
        text: >-
          האם $(5,0,6)$ על $L_1$? מ-$5=1+2t$: $t=2$. בודקים: $2-2=0$ ו-$3\cdot2=6$. כן, ולכן $L_2=L_1$.
      - kind: computation
        text: >-
          האם $(3,1,4)$ על $L_1$? מ-$3=1+2t$: $t=1$. בודקים: $2-1=1$ מתאים, אבל $3\cdot1=3\ne4$. לא, ולכן $L_3$ מקביל
          ל-$L_1$ ושונה ממנו (וגם מ-$L_2$, שהוא אותו ישר).
      - kind: check
        text: >-
          $L_2$ ב-$s=1$ נותן $(1,2,0)$, נקודת ההתחלה של $L_1$: שני ישרים עם אותו כיוון ושתי נקודות משותפות הם אותו ישר.
      - kind: result
        text: >-
          $L_1=L_2$ (הצגות שונות של אותו ישר); $L_3$ מקביל להם ואינו נפגש איתם.

  - id: W-1.3-05
    level: mid
    objectives: [OBJ-1.3-1]
    prompt: >-
      נתונות הנקודות $A=(1,4,-2)$, $B=(1,6,1)$ ו-$D=(1,4,5)$.

      (א) כתבו את הישר $AB$ בהצגה פרמטרית, ואחר כך בצורה הקנונית.

      (ב) כתבו את הישר $AD$ בצורה הקנונית.

      (ג) באיזו נקודה הישר $AB$ חוצה את המישור $z=0$?
    answer: >-
      (א) $x=1$, $y=4+2t$, $z=-2+3t$; בצורה הקנונית: $x=1$ ו-$\frac{y-4}{2}=\frac{z+2}{3}$. (ב) $x=1$, $y=4$.
      (ג) $\left(1,\frac{16}{3},0\right)$.
    solution:
      - kind: idea
        text: >-
          הכיוון הוא הפרש הנקודות. רכיב אפס בכיוון אינו נכנס למכנה: הקואורדינטה המתאימה קבועה, וכותבים זאת כמשוואה
          נפרדת.
      - kind: computation
        text: >-
          (א) $\vec{AB}=(0,2,3)$. הישר: $x=1+0\cdot t=1$, $y=4+2t$, $z=-2+3t$. מבודדים את $t$ משתי האחרונות:
          $\frac{y-4}{2}=\frac{z+2}{3}$, ויחד איתה $x=1$.
      - kind: computation
        text: >-
          (ב) $\vec{AD}=(0,0,7)$. הישר: $x=1$, $y=4$, $z=-2+7t$. שתי קואורדינטות קבועות ו-$z$ מקבל כל ערך: הישר הוא
          $x=1$, $y=4$, מקביל לציר $z$.
      - kind: computation
        text: >-
          (ג) $-2+3t=0$ נותן $t=\frac23$, ואז $y=4+\frac43=\frac{16}{3}$. הנקודה: $\left(1,\frac{16}{3},0\right)$.
      - kind: check
        text: >-
          $B$ מקיימת את (א): $x=1$ ו-$\frac{6-4}{2}=\frac{1+2}{3}=1$. $D$ מקיימת את (ב). ב-(ג) $t=\frac23$ בין 0 ל-1: נקודת החצייה
          נמצאת על הקטע $AB$, כמו שצריך, כי $A$ מתחת למישור ($z=-2$) ו-$B$ מעליו ($z=1$).
      - kind: result
        text: >-
          $AB$: $x=1$, $\frac{y-4}{2}=\frac{z+2}{3}$. $AD$: $x=1$, $y=4$. החצייה: $\left(1,\frac{16}{3},0\right)$.

  - id: W-1.3-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.3-2]
    prompt: >-
      נתונים ארבעה מישורים, שנסמן באות $\Pi$ עם מספר:

      $$\Pi_1:\ x+2y-2z=3,\qquad \Pi_2:\ 2x+4y-4z=6,\qquad \Pi_3:\ x+2y-2z=-6,\qquad \Pi_4:\ 2x-y=5.$$

      (א) אילו מהם זהים? אילו מקבילים ושונים? נמקו מהמקדמים בלבד.

      (ב) מה המרחק בין $\Pi_1$ ל-$\Pi_3$?

      (ג) הראו ש-$\Pi_4$ מאונך ל-$\Pi_1$.
    answer: >-
      (א) $\Pi_1=\Pi_2$; $\Pi_3$ מקביל להם ושונה; $\Pi_4$ אינו מקביל לאף אחד מהם. (ב) 3. (ג) הנורמלים מאונכים:
      $(1,2,-2)\cdot(2,-1,0)=0$.
    solution:
      - kind: idea
        text: >-
          המקדמים של $x,y,z$ הם הנורמל וקובעים את הנטייה; $d$ קובע את המקום. משווים $d$ רק אחרי שמביאים את המשוואות
          לאותו אגף שמאל.
      - kind: step
        text: >-
          (א) $\Pi_2$ הוא $\Pi_1$ כפול 2, כולל אגף ימין ($2\cdot3=6$): אותו מישור. ל-$\Pi_3$ אותו אגף שמאל כמו ל-$\Pi_1$
          ו-$d$ אחר: מקביל ושונה. הנורמל של $\Pi_4$, $(2,-1,0)$, אינו כפולה של $(1,2,-2)$: $\Pi_4$ אינו מקביל להם.
      - kind: computation
        text: >-
          (ב) $|\vec n|=\sqrt{1+4+4}=3$, והמרחק $\frac{|3-(-6)|}{3}=\frac93=3$.
      - kind: computation
        text: >-
          (ג) שני מישורים מאונכים בדיוק כשהנורמלים שלהם מאונכים (הסעיף "מישורים מאונכים" בשיעור). כאן
          $(1,2,-2)\cdot(2,-1,0)=2-2+0=0$: הנורמלים מאונכים, ולכן המישורים מאונכים.
      - kind: check
        text: >-
          ל-(ב) בדרך אחרת: $(3,0,0)$ על $\Pi_1$, והמרחק שלה מ-$\Pi_3$ הוא $\frac{|3-(-6)|}{3}=3$.
      - kind: result
        text: >-
          $\Pi_1=\Pi_2$; $\Pi_3\parallel\Pi_1$ במרחק 3; $\Pi_4\perp\Pi_1$.

  - id: W-1.3-07
    level: mid
    objectives: [OBJ-1.3-3, OBJ-1.3-1]
    prompt: >-
      ישר עובר דרך הנקודות $A=(0,1,-1)$ ו-$B=(2,2,1)$, ונתון המישור $3x-2y+z=5$.

      (א) מצאו את נקודת החיתוך של הישר עם המישור.

      (ב) האם נקודת החיתוך נמצאת על הקטע $AB$? מה המרחק שלה מ-$A$?
    answer: >-
      (א) $\left(\frac83,\frac73,\frac53\right)$, ב-$t=\frac43$. (ב) לא: היא מעבר ל-$B$, כי $t=\frac43>1$. המרחק שלה מ-$A$
      הוא 4.
    solution:
      - kind: idea
        text: >-
          כותבים את הישר בהצגה פרמטרית, מציבים במשוואת המישור, פותרים ל-$t$, ומציבים את $t$ בחזרה בישר. אותו $t$
          עונה גם על (ב): בהצגה $A+t(B-A)$ הקטע $AB$ הוא $0\le t\le1$, וכל יחידה של $t$ מזיזה אותנו ב-$\vec v$ אחד,
          כך שהמרחק מ-$A$ הוא $|t|\cdot|\vec v|$.
      - kind: computation
        text: >-
          (א) הכיוון: $\vec v=B-A=(2,2,1)-(0,1,-1)=(2,1,2)$. הישר: $x=2t$, $y=1+t$, $z=-1+2t$.
      - kind: computation
        text: >-
          הצבה: $3(2t)-2(1+t)+(-1+2t)=6t-3$. המשוואה $6t-3=5$ נותנת $t=\frac43$.
      - kind: computation
        text: >-
          הצבה בחזרה: $x=\frac83$, $y=1+\frac43=\frac73$, $z=-1+\frac83=\frac53$.
      - kind: step
        text: >-
          (ב) ב-$t=0$ נמצאים ב-$A$ וב-$t=1$ ב-$B$. $t=\frac43>1$, ולכן נקודת החיתוך אינה על הקטע: היא על המשך הישר,
          מעבר ל-$B$.
      - kind: computation
        text: >-
          $|\vec v|=\sqrt{4+1+4}=3$, והמרחק מ-$A$ הוא $|t|\cdot|\vec v|=\frac43\cdot3=4$.
      - kind: check
        text: >-
          $3\cdot\frac83-2\cdot\frac73+\frac53=8-\frac{14}{3}+\frac53=8-3=5$. המכפלה $\vec v\cdot\vec n=6-2+2=6\ne0$: נקודת חיתוך אחת.
          המרחק ישירות: החץ מ-$A$ אל נקודת החיתוך הוא $\left(\frac83,\frac43,\frac83\right)$, ואורכו
          $\frac13\sqrt{64+16+64}=\frac{12}{3}=4$.
      - kind: result
        text: >-
          נקודת החיתוך היא $\left(\frac83,\frac73,\frac53\right)$; היא אינה על הקטע $AB$ אלא מעבר ל-$B$, במרחק 4 מ-$A$.

  - id: W-1.3-08
    level: exam
    objectives: [OBJ-1.3-3, OBJ-1.3-1]
    prompt: >-
      נתונים הישר $x=1+t$, $y=2-t$, $z=kt$ (עם פרמטר קבוע $k$) והמישור $x+2y+3z=6$.

      (א) לאילו ערכים של $k$ הישר חותך את המישור בנקודה אחת? מצאו את הנקודה עבור $k=1$.

      (ב) מה קורה בערך הנותר של $k$: הישר מקביל למישור או מוכל בו?

      (ג) האם יש $k$ שעבורו הישר מאונך למישור?
    answer: >-
      (א) לכל $k\ne\frac13$; עבור $k=1$ הנקודה היא $\left(\frac32,\frac32,\frac12\right)$. (ב) עבור $k=\frac13$ הישר מקביל למישור
      ואינו פוגש אותו. (ג) אין.
    solution:
      - kind: idea
        text: >-
          מציבים את הישר במשוואת המישור. המקדם של $t$ הוא $\vec v\cdot\vec n$: כשהוא שונה מאפס יש פתרון אחד, וכשהוא אפס
          המשוואה אינה תלויה ב-$t$. ישר מאונך למישור כשהכיוון שלו כפולה של הנורמל.
      - kind: computation
        text: >-
          הצבה: $(1+t)+2(2-t)+3kt=5+(3k-1)t$. המשוואה: $5+(3k-1)t=6$, כלומר $(3k-1)t=1$.
      - kind: step
        text: >-
          (א) אם $3k-1\ne0$, כלומר $k\ne\frac13$: $t=\frac{1}{3k-1}$, נקודה אחת. עבור $k=1$: $t=\frac12$, והנקודה
          $\left(1+\frac12,\ 2-\frac12,\ \frac12\right)=\left(\frac32,\frac32,\frac12\right)$.
      - kind: step
        text: >-
          (ב) אם $k=\frac13$ המשוואה היא $0\cdot t=1$, ואין לה פתרון: הישר מקביל למישור ואינו מוכל בו. (נקודת ההתחלה
          $(1,2,0)$ נותנת $1+4+0=5\ne6$.)
      - kind: step
        text: >-
          (ג) צריך $(1,-1,k)=\lambda(1,2,3)$. מהרכיב הראשון $\lambda=1$, ומהשני $\lambda=-\frac12$: סתירה. אין $k$ כזה.
      - kind: check
        text: >-
          עבור $k=1$: $\frac32+2\cdot\frac32+3\cdot\frac12=\frac32+3+\frac32=6$. ואכן $3k-1=(1,-1,k)\cdot(1,2,3)$.
      - kind: result
        text: >-
          נקודה אחת לכל $k\ne\frac13$ (עבור $k=1$: $\left(\frac32,\frac32,\frac12\right)$); עבור $k=\frac13$ הישר מקביל למישור; הוא
          אינו מאונך למישור לאף $k$.

  - id: W-1.3-09
    level: exam
    objectives: [OBJ-1.3-2, OBJ-1.3-3]
    prompt: >-
      נתונות הנקודות $A=(1,1,1)$ ו-$B=(3,3,2)$. מישור, שנסמן באות $\Pi$, עובר דרך הנקודה $(1,0,2)$ ומאונך לישר $AB$.

      (א) כתבו את המשוואה של $\Pi$.

      (ב) חשבו את המרחק של $A$ מ-$\Pi$.

      (ג) באיזו נקודה הישר $AB$ חותך את $\Pi$? האם היא על הקטע $AB$?

      (ד) האם $A$ ו-$B$ נמצאות באותו צד של $\Pi$? הסבירו איך זה מתיישב עם (ג).
    answer: >-
      (א) $2x+2y+z=4$. (ב) $\frac13$. (ג) $\left(\frac79,\frac79,\frac89\right)$, ב-$t=-\frac19$: לא על הקטע. (ד) כן, שתיהן בצד
      שאליו מצביע הנורמל.
    solution:
      - kind: idea
        text: >-
          מישור מאונך לישר: הכיוון של הישר הוא הנורמל. המרחק מהנוסחה; החיתוך בהצבה. הסימן של $r=2x+2y+z-4$ אומר באיזה
          צד נקודה נמצאת.
      - kind: computation
        text: >-
          (א) $\vec n=B-A=(2,2,1)$, ו-$d=2\cdot1+2\cdot0+1\cdot2=4$. המישור: $2x+2y+z=4$.
      - kind: computation
        text: >-
          (ב) $r_A=2+2+1-4=1$, $|\vec n|=\sqrt{4+4+1}=3$, והמרחק $\frac13$.
      - kind: computation
        text: >-
          (ג) הישר: $x=1+2t$, $y=1+2t$, $z=1+t$. הצבה: $2(1+2t)+2(1+2t)+(1+t)=5+9t=4$, ולכן $t=-\frac19$. הנקודה:
          $\left(1-\frac29,\ 1-\frac29,\ 1-\frac19\right)=\left(\frac79,\frac79,\frac89\right)$. הקטע $AB$ הוא $0\le t\le1$, ו-$t=-\frac19$
          מחוץ לו: החיתוך "מאחורי" $A$.
      - kind: step
        text: >-
          (ד) $r_A=1>0$ ו-$r_B=6+6+2-4=10>0$: אותו סימן, אותו צד. זה מתיישב עם (ג): קטע שמחבר שתי נקודות מאותו צד אינו
          חוצה את המישור.
      - kind: check
        text: >-
          נקודת החיתוך: $\frac{14}{9}+\frac{14}{9}+\frac89=\frac{36}{9}=4$. היא גם הנקודה הקרובה ביותר ל-$A$ במישור (הישר $AB$
          מאונך למישור), והמרחק ממנה ל-$A$ הוא $|t|\cdot|\vec n|=\frac19\cdot3=\frac13$, כמו ב-(ב).
      - kind: result
        text: >-
          $\Pi$: $2x+2y+z=4$; המרחק של $A$ הוא $\frac13$; החיתוך $\left(\frac79,\frac79,\frac89\right)$, מחוץ לקטע; $A$ ו-$B$ באותו צד.

  - id: W-1.3-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.3-3, OBJ-1.3-2]
    prompt: >-
      לכל טענה קבעו אם היא נכונה תמיד, ונמקו. המישור הוא מישור כלשהו $ax+by+cz=d$, עם הנורמל $\vec n=(a,b,c)$. כדאי
      לנסות כל טענה קודם על מישור אחד, למשל $2x-y+2z=9$ עם הנורמל $(2,-1,2)$, ורק אחר כך לנמק לכל מישור.

      (א) אם הנקודה $Q$ נותנת $\vec n\cdot Q-d>0$ והנקודה $R$ נותנת $\vec n\cdot R-d<0$, אז הקטע $QR$ חותך את המישור.
      (במישור $2x-y+2z=9$, למשל: הנקודה $(4,-2,4)$ נותנת $8+2+8-9=9$, והראשית נותנת $-9$.)

      (ב) ישר שווקטור הכיוון שלו מאונך ל-$\vec n$ חותך את המישור בזווית ישרה.

      (ג) אם $d\ne0$, הנקודה במישור הקרובה ביותר לראשית היא הנקודה שווקטור המקום שלה הוא $\frac{d}{|\vec n|^2}\,\vec n$,
      כלומר הנקודה שמגיעים אליה מהראשית כשהולכים לאורך הנורמל $\frac{d}{|\vec n|^2}$ פעמים. חשבו אותה למישור $2x-y+2z=9$.
    answer: >-
      (א) נכון. (ב) לא נכון: ישר כזה מקביל למישור (או מוכל בו). (ג) נכון; למישור $2x-y+2z=9$ הנקודה היא $(2,-1,2)$,
      במרחק 3 מהראשית.
    solution:
      - kind: idea
        text: >-
          בשלוש הטענות מציבים ישר $A+t\vec v$ במשוואת המישור ומסתכלים על $\vec n\cdot A+t(\vec n\cdot\vec v)-d$: ביטוי ממעלה
          ראשונה ב-$t$.
      - kind: step
        text: >-
          (א) נכון. על הקטע $Q+t(R-Q)$, $0\le t\le1$, הביטוי $g(t)=\vec n\cdot Q-d+t\,\vec n\cdot(R-Q)$ הוא ממעלה ראשונה ב-$t$,
          חיובי ב-$t=0$ ושלילי ב-$t=1$. ביטוי כזה (קו ישר כפונקציה של $t$) מתאפס בדיוק פעם אחת בין 0 ל-1, ושם הנקודה
          על המישור.
      - kind: step
        text: >-
          (ב) לא נכון. אם $\vec v\cdot\vec n=0$ ה-$t$ נעלם מהמשוואה: הישר מקביל למישור או מוכל בו. למשל הישר $x=t$, $y=0$,
          $z=0$ והמישור $z=1$: $(1,0,0)\cdot(0,0,1)=0$, והישר אינו פוגש את המישור כלל. ישר מאונך למישור הוא ישר שהכיוון שלו
          **מקביל** ל-$\vec n$.
      - kind: step
        text: >-
          (ג) נכון. הנקודה הקרובה לראשית נמצאת על הישר דרך הראשית בכיוון הנורמל, $t\vec n$. הצבה:
          $\vec n\cdot(t\vec n)=t|\vec n|^2=d$, ולכן $t=\frac{d}{|\vec n|^2}$, והנקודה היא זו שווקטור המקום שלה $\frac{d}{|\vec n|^2}\vec n$. המרחק שלה
          מהראשית הוא $\frac{|d|}{|\vec n|^2}\cdot|\vec n|=\frac{|d|}{|\vec n|}$, כמו בנוסחת המרחק.
      - kind: computation
        text: >-
          למישור $2x-y+2z=9$: $|\vec n|^2=4+1+4=9$, ווקטור המקום של הנקודה הוא $\frac99(2,-1,2)$, כלומר הנקודה $(2,-1,2)$. היא על המישור: $4+1+4=9$. המרחק:
          $\frac{9}{3}=3=|(2,-1,2)|$.
      - kind: check
        text: >-
          הדוגמה של (א) עם אותו מישור: $R=(0,0,0)$ נותנת $-9$ ו-$Q=(4,-2,4)$ נותנת $8+2+8-9=9$. הסימנים הפוכים, והקטע חוצה את
          המישור באמצעו, ב-$(2,-1,2)$.
      - kind: result
        text: >-
          (א) נכון; (ב) לא נכון, הישר מקביל למישור או מוכל בו; (ג) נכון, ולמישור $2x-y+2z=9$ הנקודה היא $(2,-1,2)$ והמרחק 3.

challenge:
  - id: W-1.3-c1
    stars: 1
    objectives: [OBJ-1.3-3]
    prompt: >-
      נתונים הנקודה $C=(-3,2,4)$ והמישור $2x+4y-3z=8$.

      (א) מצאו את הרדיוס של הכדור שמרכזו $C$ והוא משיק למישור (נוגע בו בנקודה אחת בלבד).

      (ב) מצאו את נקודת ההשקה $P$.
    answer: >-
      (א) $\frac{18}{\sqrt{29}}\approx3.34$. (ב) $P=\left(-\frac{51}{29},\frac{130}{29},\frac{62}{29}\right)$.
    solution:
      - kind: idea
        text: >-
          כדור שמרכזו $C$ נוגע במישור בנקודה אחת בדיוק כשהרדיוס שלו שווה למרחק הקצר ביותר מ-$C$ אל המישור: רדיוס קטן
          יותר אינו מגיע למישור, ורדיוס גדול יותר חותך אותו במעגל שלם. נקודת ההשקה היא הנקודה במישור הקרובה ביותר
          ל-$C$, כלומר החיתוך של המישור עם הישר דרך $C$ בכיוון הנורמל.
      - kind: computation
        text: >-
          (א) $\vec n=(2,4,-3)$, $|\vec n|=\sqrt{4+16+9}=\sqrt{29}$. ההצבה של $C$: $2\cdot(-3)+4\cdot2-3\cdot4-8=-6+8-12-8=-18$.
          הרדיוס: $\frac{|-18|}{\sqrt{29}}=\frac{18}{\sqrt{29}}\approx3.34$.
      - kind: computation
        text: >-
          (ב) הישר דרך $C$ בכיוון $\vec n$: $x=-3+2t$, $y=2+4t$, $z=4-3t$. הצבה במישור:
          $$2(-3+2t)+4(2+4t)-3(4-3t)=8\quad\Longrightarrow\quad -10+29t=8\quad\Longrightarrow\quad t=\tfrac{18}{29}.$$
      - kind: computation
        text: >-
          הצבה בחזרה: $x=-3+\frac{36}{29}=-\frac{51}{29}$, $y=2+\frac{72}{29}=\frac{130}{29}$, $z=4-\frac{54}{29}=\frac{62}{29}$.
      - kind: check
        text: >-
          $P$ על המישור: $\frac{-102+520-186}{29}=\frac{232}{29}=8$. המרחק מ-$C$ ל-$P$ הוא $|t|\cdot|\vec n|=\frac{18}{29}\sqrt{29}=\frac{18}{\sqrt{29}}$,
          כמו ב-(א).
      - kind: result
        text: >-
          הרדיוס $\frac{18}{\sqrt{29}}$, ונקודת ההשקה $P=\left(-\frac{51}{29},\frac{130}{29},\frac{62}{29}\right)$.
    source:
      name: 'Strang & Herman, Calculus Volume 3 (OpenStax)'
      year: 2016
      problem: 'Section 2.5 (Equations of Lines and Planes in Space), Exercise 297'
      url: 'https://openstax.org/books/calculus-volume-3/pages/2-5-equations-of-lines-and-planes-in-space'
      verified: '2026-11-17'
      adapted: false

  - id: W-1.3-c2
    stars: 1
    objectives: [OBJ-1.3-1]
    prompt: >-
      מצאו את המרחק מהנקודה $A=(4,2,5)$ אל הישר $x=-1-t$, $y=-t$, $z=2$, ואת הנקודה על הישר הקרובה ביותר ל-$A$.

      (בשיעור חישבנו מרחק מנקודה למישור. לישר אין נורמל אחד, ולכן צריך רעיון אחר: מה מאפיין את הנקודה הקרובה ביותר?)
    answer: >-
      המרחק $\frac{3\sqrt6}{2}\approx3.67$, והנקודה הקרובה $\left(\frac52,\frac72,2\right)$ (ב-$t=-\frac72$).
    solution:
      - kind: idea
        text: >-
          הנקודה $F$ על הישר הקרובה ביותר ל-$A$ היא זו שעבורה הקטע $AF$ **מאונך לישר**: כל נקודה אחרת על הישר היא קצה
          של יתר במשולש ישר זווית ש-$AF$ ניצב שלו. מאונכות היא מכפלה סקלרית אפס עם וקטור הכיוון, וזו משוואה אחת ב-$t$.
      - kind: computation
        text: >-
          נקודה על הישר: $P(t)=(-1-t,\ -t,\ 2)$, והכיוון $\vec v=(-1,-1,0)$. החץ מ-$A$ אליה:
          $P(t)-A=(-5-t,\ -2-t,\ -3)$.
      - kind: computation
        text: >-
          התנאי $(P(t)-A)\cdot\vec v=0$: $(5+t)+(2+t)+0=7+2t=0$, ולכן $t=-\frac72$.
      - kind: computation
        text: >-
          הנקודה הקרובה: $F=\left(-1+\frac72,\ \frac72,\ 2\right)=\left(\frac52,\frac72,2\right)$. החץ $F-A=\left(-\frac32,\frac32,-3\right)$,
          ואורכו $\sqrt{\frac94+\frac94+9}=\sqrt{\frac{27}{2}}=\frac{3\sqrt6}{2}\approx3.67$.
      - kind: check
        text: >-
          בדרך של שיעור 1.2: $P_0=(-1,0,2)$ על הישר, והחץ $A-P_0=(5,2,3)$ אורכו בריבוע 38. ההיטל הסקלרי שלו על הכיוון הוא
          $\frac{(5,2,3)\cdot(-1,-1,0)}{\sqrt2}=-\frac{7}{\sqrt2}$, ולפי פיתגורס החלק המאונך לישר אורכו
          $\sqrt{38-\frac{49}{2}}=\sqrt{\frac{27}{2}}$. אותו מספר. ואכן $(F-A)\cdot\vec v=\frac32-\frac32+0=0$.
      - kind: result
        text: >-
          המרחק הוא $\frac{3\sqrt6}{2}$, והנקודה הקרובה ביותר על הישר היא $\left(\frac52,\frac72,2\right)$.
