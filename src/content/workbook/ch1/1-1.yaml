# Workbook of lesson 1.1 — vectors: arrow and coordinates.
# Objectives (src/course.ts):
#   OBJ-1.1-1  represent a vector as an arrow and as coordinates; find the vector from A to B
#   OBJ-1.1-2  add vectors, multiply by a scalar, and read both operations geometrically
#   OBJ-1.1-3  compute the length of a vector and the unit vector in a given direction
# Every number recomputed with sympy in screens/tools/lesson-1-1.py.
lesson: '1.1'
practice:
  - id: W-1.1-01
    level: basic
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    prompt: >-
      נתונים קודקודי משולש: $A=(4,-2,1)$, $B=(1,2,1)$ ו-$C=(0,0,5)$.

      (א) מצאו את שלושת וקטורי הצלעות $\vec{AB}$, $\vec{BC}$ ו-$\vec{CA}$.

      (ב) חברו את שלושתם. הסבירו את התוצאה בלי חישוב.

      (ג) חשבו את היקף המשולש.
    answer: >-
      (א) $\vec{AB}=(-3,4,0)$, $\vec{BC}=(-1,-2,4)$, $\vec{CA}=(4,-2,-4)$. (ב) $\vec 0$: מסלול סגור. (ג)
      $11+\sqrt{21}\approx15.58$.
    solution:
      - kind: idea
        text: >-
          וקטור מנקודה לנקודה הוא "סוף פחות התחלה". אורך של צלע הוא האורך של וקטור הצלע. וסכום של העתקים בזה אחר זה
          הוא ההעתק מנקודת ההתחלה אל נקודת הסיום.
      - kind: computation
        text: >-
          (א) $\vec{AB}=B-A=(1-4,\ 2-(-2),\ 1-1)=(-3,4,0)$. $\vec{BC}=C-B=(0-1,\ 0-2,\ 5-1)=(-1,-2,4)$.
          $\vec{CA}=A-C=(4-0,\ -2-0,\ 1-5)=(4,-2,-4)$.
      - kind: computation
        text: >-
          (ב) $(-3-1+4,\ 4-2-2,\ 0+4-4)=(0,0,0)$. ההסבר: הולכים מ-$A$ ל-$B$, מ-$B$ ל-$C$ ומ-$C$ חזרה ל-$A$. חזרנו
          לנקודת ההתחלה, ולכן ההעתק הכולל הוא וקטור האפס. זה נכון לכל משולש, ולכל מסלול סגור.
      - kind: computation
        text: >-
          (ג) $|\vec{AB}|=\sqrt{9+16+0}=5$, $|\vec{BC}|=\sqrt{1+4+16}=\sqrt{21}$, $|\vec{CA}|=\sqrt{16+4+16}=6$. ההיקף:
          $5+6+\sqrt{21}=11+\sqrt{21}\approx15.58$.
      - kind: check
        text: >-
          סעיף (ב) הוא בדיקה של סעיף (א): טעות בסימן של רכיב אחד הייתה נותנת סכום שונה מאפס. ושימו לב להבדל: סכום
          ה**וקטורים** הוא אפס, וסכום ה**אורכים** שלהם הוא ההיקף.
      - kind: result
        text: >-
          $\vec{AB}=(-3,4,0)$, $\vec{BC}=(-1,-2,4)$, $\vec{CA}=(4,-2,-4)$; סכומם $\vec 0$; ההיקף $11+\sqrt{21}\approx15.58$.

  - id: W-1.1-02
    level: basic
    objectives: [OBJ-1.1-2]
    prompt: >-
      נתונים $\vec u=(3,-1,2)$ ו-$\vec v=(-1,4,0)$.

      (א) חשבו את $\vec u+\vec v$, את $\vec u-\vec v$ ואת $2\vec u+3\vec v$.

      (ב) כתבו את $2\vec u+3\vec v$ בעזרת $\hat\imath,\hat\jmath,\hat k$.

      (ג) מצאו וקטור $\vec w$ כך ש-$\vec u+\vec w=\vec v$. איך הייתם מציירים אותו כששני החצים $\vec u$ ו-$\vec v$ יוצאים
      מאותה נקודה?
    answer: >-
      (א) $(2,3,2)$, $(4,-5,2)$, $(3,10,4)$. (ב) $3\hat\imath+10\hat\jmath+4\hat k$. (ג) $\vec w=\vec v-\vec u=(-4,5,-2)$:
      החץ מהקצה של $\vec u$ אל הקצה של $\vec v$.
    solution:
      - kind: idea
        text: >-
          חיבור, חיסור וכפל בסקלר נעשים רכיב אחרי רכיב. וקטור ש"משלים" את $\vec u$ ל-$\vec v$ הוא ההפרש $\vec v-\vec u$.
      - kind: computation
        text: >-
          (א) $\vec u+\vec v=(3-1,\ -1+4,\ 2+0)=(2,3,2)$. $\vec u-\vec v=(3+1,\ -1-4,\ 2-0)=(4,-5,2)$.
      - kind: computation
        text: >-
          $2\vec u=(6,-2,4)$ ו-$3\vec v=(-3,12,0)$, ולכן $2\vec u+3\vec v=(6-3,\ -2+12,\ 4+0)=(3,10,4)$.
      - kind: computation
        text: >-
          (ב) הרכיבים הם המקדמים של וקטורי הצירים: $(3,10,4)=3\hat\imath+10\hat\jmath+4\hat k$.
      - kind: computation
        text: >-
          (ג) מחסרים $\vec u$ משני האגפים של $\vec u+\vec w=\vec v$: $\vec w=\vec v-\vec u=(-1-3,\ 4+1,\ 0-2)=(-4,5,-2)$.
          בציור: כששני החצים יוצאים מאותה נקודה, $\vec v-\vec u$ הוא החץ מהקצה של $\vec u$ אל הקצה של $\vec v$.
      - kind: check
        text: >-
          $\vec u+\vec w=(3-4,\ -1+5,\ 2-2)=(-1,4,0)=\vec v$. וגם $\vec w=-(\vec u-\vec v)=-(4,-5,2)$, כמו שצריך: סדר
          הפוך בחיסור נותן את הווקטור הנגדי.
      - kind: result
        text: >-
          $(2,3,2)$; $(4,-5,2)$; $(3,10,4)=3\hat\imath+10\hat\jmath+4\hat k$; $\vec w=(-4,5,-2)$.

  - id: W-1.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.1-3]
    prompt: >-
      אילו מהווקטורים הבאים הם וקטורי יחידה? נמקו כל תשובה בחישוב אחד. לכל וקטור שאינו וקטור יחידה, כתבו את וקטור
      היחידה שבכיוון שלו.

      (א) $\left(\frac35,-\frac45,0\right)$

      (ב) $\left(\frac12,\frac12,\frac12\right)$

      (ג) $\left(\frac{1}{\sqrt2},0,-\frac{1}{\sqrt2}\right)$

      (ד) $\left(\frac14,\frac14,\frac12\right)$
    answer: >-
      (א) כן. (ב) לא: האורך $\frac{\sqrt3}{2}$; וקטור היחידה $\frac{1}{\sqrt3}(1,1,1)$. (ג) כן. (ד) לא: האורך
      $\frac{\sqrt6}{4}$; וקטור היחידה $\frac{1}{\sqrt6}(1,1,2)$.
    solution:
      - kind: idea
        text: >-
          וקטור יחידה הוא וקטור שאורכו 1, כלומר שסכום **ריבועי** הרכיבים שלו הוא 1. סכום הרכיבים עצמם אינו אומר דבר.
          וכדי לנרמל וקטור שאינו וקטור יחידה, מחלקים אותו באורך שלו.
      - kind: computation
        text: >-
          (א) $\frac{9}{25}+\frac{16}{25}+0=1$: וקטור יחידה. (סכום הרכיבים שלו הוא $-\frac15$, וזה לא משנה.)
      - kind: computation
        text: >-
          (ב) $\frac14+\frac14+\frac14=\frac34$, ולכן האורך $\frac{\sqrt3}{2}\approx0.87$: לא וקטור יחידה. הווקטור הוא
          $\frac12(1,1,1)$, ו-$|(1,1,1)|=\sqrt3$, ולכן וקטור היחידה בכיוון הזה הוא $\frac{1}{\sqrt3}(1,1,1)$.
      - kind: computation
        text: >-
          (ג) $\frac12+0+\frac12=1$: וקטור יחידה.
      - kind: computation
        text: >-
          (ד) $\frac{1}{16}+\frac{1}{16}+\frac14=\frac{6}{16}$, ולכן האורך $\frac{\sqrt6}{4}\approx0.61$: לא וקטור יחידה, אף
          שסכום הרכיבים הוא בדיוק 1. הווקטור הוא $\frac14(1,1,2)$, ו-$|(1,1,2)|=\sqrt6$, ולכן וקטור היחידה הוא
          $\frac{1}{\sqrt6}(1,1,2)$.
      - kind: check
        text: >-
          לשני הווקטורים המנורמלים: $\frac13+\frac13+\frac13=1$ ו-$\frac16+\frac16+\frac46=1$. שימו לב שכדי לנרמל נוח
          להוציא קודם את הסקלר המשותף: הכיוון של $\frac14(1,1,2)$ הוא הכיוון של $(1,1,2)$.
      - kind: result
        text: >-
          (א) ו-(ג) וקטורי יחידה. (ב) לא; בכיוון שלו $\frac{1}{\sqrt3}(1,1,1)$. (ד) לא; בכיוון שלו $\frac{1}{\sqrt6}(1,1,2)$.

  - id: W-1.1-04
    level: mid
    objectives: [OBJ-1.1-1, OBJ-1.1-2]
    prompt: >-
      $ABCD$ מקבילית (הקודקודים לפי הסדר), ונתונים $A=(1,2,0)$, $B=(4,3,1)$ ו-$D=(2,5,3)$.

      (א) מצאו את הקודקוד $C$.

      (ב) מצאו את וקטורי האלכסונים $\vec{AC}$ ו-$\vec{BD}$ ואת אורכיהם.

      (ג) הראו שהאלכסונים חוצים זה את זה: לשניהם אותה נקודת אמצע.
    answer: >-
      (א) $C=(5,6,4)$. (ב) $\vec{AC}=(4,4,4)$, אורכו $4\sqrt3$; $\vec{BD}=(-2,2,2)$, אורכו $2\sqrt3$. (ג) האמצע של
      שניהם הוא $(3,4,2)$.
    solution:
      - kind: idea
        text: >-
          במקבילית הצלעות הנגדיות הן אותו וקטור: $\vec{DC}=\vec{AB}$. לכן מגיעים ל-$C$ מ-$A$ בשני ההעתקים
          $\vec u=\vec{AB}$ ו-$\vec v=\vec{AD}$ בזה אחר זה. האלכסון מ-$A$ הוא הסכום $\vec u+\vec v$, והאלכסון השני הוא
          ההפרש $\vec v-\vec u$.
      - kind: computation
        text: >-
          $\vec u=\vec{AB}=(4-1,\ 3-2,\ 1-0)=(3,1,1)$ ו-$\vec v=\vec{AD}=(2-1,\ 5-2,\ 3-0)=(1,3,3)$.
      - kind: computation
        text: >-
          (א) $C=A+\vec u+\vec v=(1+3+1,\ 2+1+3,\ 0+1+3)=(5,6,4)$.
      - kind: computation
        text: >-
          (ב) $\vec{AC}=\vec u+\vec v=(4,4,4)$, ואורכו $\sqrt{48}=4\sqrt3$. $\vec{BD}=D-B=(2-4,\ 5-3,\ 3-1)=(-2,2,2)$,
          וזה אכן $\vec v-\vec u$; אורכו $\sqrt{12}=2\sqrt3$.
      - kind: computation
        text: >-
          (ג) אמצע $AC$: $\frac{A+C}{2}=\left(\frac62,\frac82,\frac42\right)=(3,4,2)$. אמצע $BD$:
          $\frac{B+D}{2}=\left(\frac62,\frac82,\frac42\right)=(3,4,2)$. אותה נקודה.
      - kind: check
        text: >-
          $\vec{DC}=C-D=(3,1,1)=\vec{AB}$, כנדרש במקבילית. ולמה האמצעים תמיד מתלכדים: $A+C=A+(A+\vec u+\vec v)$ וגם
          $B+D=(A+\vec u)+(A+\vec v)$, אותו סכום.
      - kind: result
        text: >-
          $C=(5,6,4)$; $\vec{AC}=(4,4,4)$ באורך $4\sqrt3$; $\vec{BD}=(-2,2,2)$ באורך $2\sqrt3$; האמצע המשותף $(3,4,2)$.

  - id: W-1.1-05
    level: mid
    objectives: [OBJ-1.1-3, OBJ-1.1-2]
    prompt: >-
      נתון $\vec v=(6,-2,3)$.

      (א) מצאו את וקטור היחידה בכיוון של $\vec v$.

      (ב) מצאו וקטור באורך 21 שכיוונו הפוך לכיוון של $\vec v$.

      (ג) מצאו את כל המספרים $\lambda$ שעבורם האורך של $\lambda\vec v$ הוא $3.5$.
    answer: >-
      (א) $\left(\frac67,-\frac27,\frac37\right)$. (ב) $(-18,6,-9)$. (ג) $\lambda=\frac12$ או $\lambda=-\frac12$.
    solution:
      - kind: idea
        text: >-
          הכול נשען על האורך של $\vec v$. וקטור היחידה הוא $\vec v$ חלקי האורך; וקטור באורך $L$ בכיוון ההפוך הוא $-L$
          כפול וקטור היחידה; ואורך של כפולה הוא $|\lambda|$ כפול האורך.
      - kind: computation
        text: >-
          $|\vec v|=\sqrt{36+4+9}=\sqrt{49}=7$.
      - kind: computation
        text: >-
          (א) $\hat u=\frac{\vec v}{7}=\left(\frac67,-\frac27,\frac37\right)$.
      - kind: computation
        text: >-
          (ב) $-21\hat u=-3\vec v=(-18,6,-9)$.
      - kind: computation
        text: >-
          (ג) $|\lambda\vec v|=|\lambda|\cdot7=3.5$, ולכן $|\lambda|=\frac12$. יש שני פתרונות: $\lambda=\frac12$ (וקטור באותו
          כיוון) ו-$\lambda=-\frac12$ (בכיוון ההפוך). מי שכותב רק $\lambda=\frac12$ שכח את הערך המוחלט.
      - kind: check
        text: >-
          $\frac{36}{49}+\frac{4}{49}+\frac{9}{49}=1$. $|(-18,6,-9)|=\sqrt{324+36+81}=\sqrt{441}=21$. ו-$\frac12\vec v=(3,-1,1.5)$
          אורכו $\sqrt{9+1+2.25}=\sqrt{12.25}=3.5$.
      - kind: result
        text: >-
          $\hat u=\left(\frac67,-\frac27,\frac37\right)$; $(-18,6,-9)$; $\lambda=\pm\frac12$.

  - id: W-1.1-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      לכל טענה קבעו אם היא נכונה לכל הווקטורים (במישור או במרחב), ונמקו. לטענה שאינה נכונה תנו דוגמה נגדית.

      (א) אם $\vec u+\vec v=\vec u-\vec v$, אז $\vec v=\vec 0$.

      (ב) $|\vec u-\vec v|\ge|\vec u|-|\vec v|$.

      (ג) אם $|\vec u|=|\vec v|$, אז $\vec u=\vec v$ או $\vec u=-\vec v$.

      (ד) אם $\vec u\ne\vec 0$ ו-$\lambda\vec u=\mu\vec u$, אז $\lambda=\mu$.
    answer: >-
      (א) נכון. (ב) נכון (אי-שוויון המשולש). (ג) לא נכון: $(1,0)$ ו-$(0,1)$. (ד) נכון.
    solution:
      - kind: idea
        text: >-
          עם וקטורים עושים אלגברה כרגיל (מעבירים אגפים, מכנסים), ובכל מקום שמופיע אורך משתמשים בשני הכלים של השיעור:
          $|\lambda\vec v|=|\lambda|\,|\vec v|$ ואי-שוויון המשולש. טענה כללית מפריכים בדוגמה אחת.
      - kind: step
        text: >-
          (א) נכון. מחסרים $\vec u$ משני האגפים: $\vec v=-\vec v$. מוסיפים $\vec v$: $2\vec v=\vec 0$, ולכן כל רכיב של
          $\vec v$ הוא אפס.
      - kind: step
        text: >-
          (ב) נכון. מאיפה מתחילים: אי-שוויון המשולש מדבר על אורך של **סכום**, ואנחנו רוצים שיופיע בו
          $|\vec u-\vec v|$. לכן כותבים את $\vec u$ כסכום שאחד המחוברים שלו הוא $\vec u-\vec v$; המחובר השני חייב
          להיות $\vec v$, כדי שהסכום יחזור להיות $\vec u$. כלומר כותבים $\vec u=(\vec u-\vec v)+\vec v$ ומפעילים את אי-שוויון המשולש על הסכום הזה:
          $|\vec u|\le|\vec u-\vec v|+|\vec v|$. מעבירים את $|\vec v|$ אגף. בתמונה: $\vec u$, $\vec v$ ו-$\vec u-\vec v$ הם
          שלוש הצלעות של משולש, וצלע אחת אינה קצרה מההפרש של שתי האחרות.
      - kind: step
        text: >-
          (ג) לא נכון. $\vec u=(1,0)$ ו-$\vec v=(0,1)$: לשניהם אורך 1, והם אינם שווים ואינם נגדיים. אורך שווה אינו אומר
          דבר על הכיוון: כל הווקטורים באורך 1 שיוצאים מהראשית מסתיימים על מעגל שלם (ובמרחב, על פני כדור).
      - kind: step
        text: >-
          (ד) נכון. מעבירים אגף ומכנסים: $(\lambda-\mu)\vec u=\vec 0$. לוקחים אורך: $|\lambda-\mu|\cdot|\vec u|=0$. נתון
          ש-$|\vec u|\ne0$, ולכן $|\lambda-\mu|=0$, כלומר $\lambda=\mu$.
      - kind: check
        text: >-
          בדיקה של (ב) במספרים: $\vec u=(3,0)$, $\vec v=(0,4)$ נותנים $|\vec u-\vec v|=5\ge3-4=-1$. ובמצב שבו יש שוויון,
          $\vec u=(5,0)$ ו-$\vec v=(2,0)$: $|\vec u-\vec v|=3=5-2$, שני וקטורים באותו כיוון.
      - kind: result
        text: >-
          (א) נכון; (ב) נכון; (ג) לא נכון, למשל $(1,0)$ ו-$(0,1)$; (ד) נכון.

  - id: W-1.1-07
    level: mid
    objectives: [OBJ-1.1-1, OBJ-1.1-2]
    prompt: >-
      נתונות הנקודות $A=(-2,5,1)$ ו-$B=(6,-3,5)$.

      (א) מצאו את אמצע הקטע $AB$.

      (ב) מצאו את הנקודה $P$ על הקטע שמחלקת אותו ביחס $1:3$, כלומר $|\vec{AP}|:|\vec{PB}|=1:3$.

      (ג) האם הנקודה $R=(-6,9,-1)$ נמצאת על הישר שעובר דרך $A$ ו-$B$? אם כן, איפה היא ביחס לקטע, ומה המרחק שלה
      מ-$A$?
    answer: >-
      (א) $(2,1,3)$. (ב) $P=(0,3,2)$. (ג) כן: $\vec{AR}=-\frac12\vec{AB}$, ולכן $R$ על הישר, מחוץ לקטע, בצד של $A$,
      במרחק 6 ממנה.
    solution:
      - kind: idea
        text: >-
          כל נקודה על הישר דרך $A$ ו-$B$ היא $A+t\,\vec{AB}$. בין 0 ל-1 נמצאים על הקטע; $t=\frac12$ הוא האמצע; וביחס
          $m:n$ לוקחים $t=\frac{m}{m+n}$. כדי לבדוק אם נקודה נתונה על הישר, בודקים אם ההעתק אליה מ-$A$ הוא כפולה של
          $\vec{AB}$, והסימן והגודל של הכפולה אומרים איפה הנקודה.
      - kind: computation
        text: >-
          $\vec{AB}=(6+2,\ -3-5,\ 5-1)=(8,-8,4)$.
      - kind: computation
        text: >-
          (א) $A+\frac12\vec{AB}=(-2+4,\ 5-4,\ 1+2)=(2,1,3)$.
      - kind: computation
        text: >-
          (ב) ביחס $1:3$ יש ארבעה חלקים, ו-$P$ נמצאת חלק אחד מ-$A$: $t=\frac{1}{1+3}=\frac14$, לא $\frac13$.
          $P=A+\frac14\vec{AB}=(-2+2,\ 5-2,\ 1+1)=(0,3,2)$.
      - kind: computation
        text: >-
          (ג) $\vec{AR}=(-6+2,\ 9-5,\ -1-1)=(-4,4,-2)$. מחפשים $t$ עם $(-4,4,-2)=t\,(8,-8,4)$: מכל אחד משלושת
          הרכיבים $t=\frac{-4}{8}=\frac{4}{-8}=\frac{-2}{4}=-\frac12$. אותו $t$ בכל הרכיבים, ולכן $R$ על הישר. $t$
          שלילי: מ-$A$ הולכים **נגד** הכיוון של $\vec{AB}$. לכן $R$ מחוץ לקטע, בצד של $A$ (ולא מעבר ל-$B$), והמרחק שלה
          מ-$A$ הוא $\left|-\frac12\right|\cdot|\vec{AB}|=\frac12\cdot12=6$.
      - kind: check
        text: >-
          $|\vec{AB}|=\sqrt{64+64+16}=12$. ב-(ב): $|\vec{AP}|=|(2,-2,1)|=3$ ו-$|\vec{PB}|=|(6,-6,3)|=9$, יחס $1:3$. ב-(ג):
          $|\vec{AR}|=|(-4,4,-2)|=6$ ו-$|\vec{RB}|=|(12,-12,6)|=18=6+12$, כמו שצריך כש-$A$ נמצאת בין $R$ ל-$B$.
      - kind: result
        text: >-
          האמצע $(2,1,3)$; $P=(0,3,2)$; $R$ על הישר, מחוץ לקטע בצד של $A$ ($t=-\frac12$), במרחק 6 מ-$A$.

  - id: W-1.1-08
    level: exam
    objectives: [OBJ-1.1-1, OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      במשולש שקודקודיו $A=(1,0,2)$, $B=(3,4,0)$ ו-$C=(-1,2,4)$, תיכון הוא הקטע מקודקוד אל אמצע הצלע שמולו.

      (א) מצאו את $M$, אמצע הצלע $BC$, ואת האורך של התיכון $AM$.

      (ב) מצאו את הנקודה $G$ על התיכון $AM$ שמחלקת אותו ביחס $2:1$ (מ-$A$).

      (ג) הראו ש-$G$ נמצאת גם על התיכון מ-$B$, ומחלקת גם אותו ביחס $2:1$ (מ-$B$).

      (ד) בדקו ש-$G=\frac{A+B+C}{3}$, והסבירו למה זה מבטיח ש-$G$ נמצאת גם על התיכון השלישי.
    answer: >-
      (א) $M=(1,3,2)$, $|\vec{AM}|=3$. (ב) $G=(1,2,2)$. (ג) $B+\frac23\vec{BN}=(1,2,2)$, כאשר $N=(0,1,3)$ אמצע $AC$. (ד)
      $\frac{(3,6,6)}{3}=(1,2,2)$; הביטוי סימטרי בשלושת הקודקודים.
    solution:
      - kind: idea
        text: >-
          חשבון על נקודות הוא חשבון על וקטורי המקום שלהן. אמצע של קטע הוא ממוצע הקצוות, ונקודה שמחלקת קטע ביחס $2:1$ מתקבלת מ-$t=\frac23$ בנוסחה $A+t\,\vec{AM}$.
          מחשבים את $G$ משני תיכונים ומשווים.
      - kind: computation
        text: >-
          (א) $M=\frac{B+C}{2}=\left(\frac{3-1}{2},\frac{4+2}{2},\frac{0+4}{2}\right)=(1,3,2)$. $\vec{AM}=M-A=(0,3,0)$,
          ולכן $|\vec{AM}|=3$.
      - kind: computation
        text: >-
          (ב) $G=A+\frac23\vec{AM}=(1,0,2)+(0,2,0)=(1,2,2)$.
      - kind: computation
        text: >-
          (ג) אמצע $AC$: $N=\frac{A+C}{2}=\left(\frac{1-1}{2},\frac{0+2}{2},\frac{2+4}{2}\right)=(0,1,3)$.
          $\vec{BN}=N-B=(-3,-3,3)$, ו-$B+\frac23\vec{BN}=(3,4,0)+(-2,-2,2)=(1,2,2)$. זו אותה נקודה $G$.
      - kind: computation
        text: >-
          (ד) $A+B+C=(1+3-1,\ 0+4+2,\ 2+0+4)=(3,6,6)$, ולכן $\frac{A+B+C}{3}=(1,2,2)=G$.
      - kind: step
        text: >-
          למה זה תמיד כך. חשבון על נקודות הוא חשבון על וקטורי המקום שלהן, ולכן מותר לפתוח סוגריים ולכנס כמו
          בווקטורים. האמצע הוא $M=\frac{B+C}{2}$, וההעתק אליו מ-$A$ הוא $\vec{AM}=M-A=\frac{B+C}{2}-A$. לכן
          $$G=A+\frac23\vec{AM}=A+\frac23\left(\frac{B+C}{2}-A\right)=A-\frac23A+\frac13B+\frac13C=\frac{A+B+C}{3} .$$
          בביטוי הסופי שלושת הקודקודים ממלאים אותו תפקיד, ולכן אותו חישוב מכל קודקוד אחר נותן אותה נקודה. שלושת
          התיכונים נפגשים בנקודה אחת, והיא מחלקת כל אחד מהם ביחס $2:1$. וכמו אמצע של קטע, גם הממוצע הזה אינו תלוי
          בבחירת הראשית: הוא $A$ ועוד העתק.
      - kind: check
        text: >-
          על התיכון $AM$: $|\vec{AG}|=|(0,2,0)|=2$ ו-$|\vec{GM}|=|(0,1,0)|=1$, יחס $2:1$. בפיזיקה $G$ היא מרכז המסה של שלוש מסות
          שוות שמונחות בקודקודים.
      - kind: result
        text: >-
          $M=(1,3,2)$, $|\vec{AM}|=3$, $G=(1,2,2)=\frac{A+B+C}{3}$, והיא מחלקת כל תיכון ביחס $2:1$ מהקודקוד.

  - id: W-1.1-09
    level: exam
    objectives: [OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      על טבעת קטנה פועלים שני כוחות (בניוטון): $\vec F_1=(2,-3,6)$ ו-$\vec F_2=(1,5,-4)$.

      (א) מצאו את הכוח השלישי $\vec F_3$ שמחזיק את הטבעת בשיווי משקל, ואת גודלו.

      (ב) השוו את $|\vec F_1+\vec F_2|$ ל-$|\vec F_1|+|\vec F_2|$. מה ההסבר לפער?

      (ג) מסירים את $\vec F_2$ ואת $\vec F_3$, ובמקומם מפעילים כוח $\lambda\vec G$, עם $\vec G=(0,1,-2)$. לאיזה $\lambda$ הכוח
      השקול של $\vec F_1$ ושל $\lambda\vec G$ מקביל לציר $x$? מהו השקול אז?
    answer: >-
      (א) $\vec F_3=(-3,-2,-2)$, $|\vec F_3|=\sqrt{17}\approx4.12$ ניוטון. (ב) $\sqrt{17}\approx4.12$ מול
      $7+\sqrt{42}\approx13.48$: הכוחות כמעט מנוגדים. (ג) $\lambda=3$, והשקול $(2,0,0)$.
    solution:
      - kind: idea
        text: >-
          שיווי משקל פירושו שסכום הכוחות הוא וקטור האפס, ולכן הכוח השלישי הוא הנגדי של סכום שני האחרים. "מקביל לציר
          $x$" פירושו שהרכיב השני והרכיב השלישי מתאפסים, ושניהם צריכים להתאפס עם אותו $\lambda$.
      - kind: computation
        text: >-
          (א) $\vec F_1+\vec F_2=(2+1,\ -3+5,\ 6-4)=(3,2,2)$. מ-$\vec F_1+\vec F_2+\vec F_3=\vec 0$ מקבלים
          $\vec F_3=-(3,2,2)=(-3,-2,-2)$, וגודלו $\sqrt{9+4+4}=\sqrt{17}\approx4.12$ ניוטון.
      - kind: computation
        text: >-
          (ב) $|\vec F_1|=\sqrt{4+9+36}=7$ ו-$|\vec F_2|=\sqrt{1+25+16}=\sqrt{42}\approx6.48$, יחד בערך $13.48$. גודל הסכום
          הוא רק $\sqrt{17}\approx4.12$. אין סתירה: לפי אי-שוויון המשולש גודל הסכום אינו עולה על סכום הגדלים, והוא שווה
          לו רק כשהכוחות באותו כיוון. כאן הרכיבים השני והשלישי של שני הכוחות הפוכים בסימן ($-3$ מול 5, 6 מול $-4$),
          והם מבטלים זה את זה כמעט לגמרי.
      - kind: computation
        text: >-
          (ג) $\vec F_1+\lambda\vec G=(2,\ -3+\lambda,\ 6-2\lambda)$. הרכיב השני מתאפס כש-$\lambda=3$, וגם הרכיב השלישי:
          $6-2\cdot3=0$. לכן $\lambda=3$, והשקול הוא $(2,0,0)=2\hat\imath$.
      - kind: check
        text: >-
          $\vec F_1+\vec F_2+\vec F_3=(2+1-3,\ -3+5-2,\ 6-4-2)=(0,0,0)$. ב-(ג) היה מזל מתוכנן: שתי משוואות ונעלם אחד.
          עם $\vec G=(0,1,-1)$, למשל, הרכיב השני היה דורש $\lambda=3$ והשלישי $\lambda=6$, ולא היה פתרון.
      - kind: result
        text: >-
          $\vec F_3=(-3,-2,-2)$, $|\vec F_3|=\sqrt{17}$ ניוטון; $\sqrt{17}<7+\sqrt{42}$; $\lambda=3$ והשקול $(2,0,0)$.

  - id: W-1.1-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.1-1, OBJ-1.1-2]
    prompt: >-
      נתונות ארבע נקודות: $A=(1,1,1)$, $B=(3,2,0)$, $C=(7,4,-2)$ ו-$D=(2,2,2)$.

      (א) תלמיד טוען: "וקטור המקום של $D$ הוא פי 2 מווקטור המקום של $A$, ולכן $A$, $B$ ו-$D$ נמצאות על ישר אחד." האם
      הנימוק תקף? האם המסקנה נכונה?

      (ב) האם $A$, $B$ ו-$C$ נמצאות על ישר אחד? אם כן, איזו מהן נמצאת בין שתי האחרות, ובאיזה יחס היא מחלקת את הקטע?

      (ג) מצאו את כל הנקודות $E$ כך ש-$\vec{DE}$ מקביל ל-$\vec{AB}$ ואורכו $2\sqrt6$.
    answer: >-
      (א) הנימוק אינו תקף והמסקנה שגויה: $\vec{AB}=(2,1,-1)$ ו-$\vec{AD}=(1,1,1)$ אינם מקבילים. (ב) כן:
      $\vec{AC}=3\vec{AB}$; $B$ בין $A$ ל-$C$, ביחס $1:2$. (ג) $E=(6,4,0)$ או $E=(-2,0,4)$.
    solution:
      - kind: idea
        text: >-
          שאלה על מיקום יחסי של נקודות עונים עליה עם העתקים, לא עם וקטורי מקום: שלוש נקודות על ישר אחד בדיוק
          כששני ההעתקים מאחת מהן אל שתי האחרות מקבילים. וקטור מקביל לווקטור נתון הוא כפולה שלו בסקלר, והאורך קובע את
          הסקלר עד כדי סימן.
      - kind: step
        text: >-
          (א) הנימוק אינו תקף. $D=2A$ אומר שהראשית, $A$ ו-$D$ נמצאות על ישר אחד, ואינו אומר דבר על $B$. בודקים עם
          העתקים: $\vec{AB}=(2,1,-1)$ ו-$\vec{AD}=(1,1,1)$. הרכיב הראשון דורש כפולה 2, והשני כפולה 1, ולכן הם אינם
          מקבילים. המסקנה שגויה: $A$, $B$, $D$ אינן על ישר אחד.
      - kind: computation
        text: >-
          (ב) $\vec{AC}=(7-1,\ 4-1,\ -2-1)=(6,3,-3)=3\,(2,1,-1)=3\vec{AB}$. ההעתקים מקבילים, ולכן שלוש הנקודות על ישר אחד.
          מ-$\vec{AB}=\frac13\vec{AC}$ נובע ש-$B=A+\frac13\vec{AC}$: $B$ בין $A$ ל-$C$, בשליש הדרך, כלומר ביחס
          $|\vec{AB}|:|\vec{BC}|=1:2$.
      - kind: computation
        text: >-
          (ג) $\vec{DE}=\lambda\vec{AB}$, ו-$|\vec{AB}|=\sqrt{4+1+1}=\sqrt6$. דורשים $|\lambda|\sqrt6=2\sqrt6$, כלומר
          $\lambda=2$ או $\lambda=-2$. לכן $E=D+2\vec{AB}=(2+4,\ 2+2,\ 2-2)=(6,4,0)$, או
          $E=D-2\vec{AB}=(2-4,\ 2-2,\ 2+2)=(-2,0,4)$.
      - kind: check
        text: >-
          ב-(ב): $|\vec{AB}|=\sqrt6$ ו-$|\vec{BC}|=|(4,2,-2)|=\sqrt{24}=2\sqrt6$, יחס $1:2$. ב-(ג): $D$ היא האמצע של שתי התשובות,
          $\frac{(6,4,0)+(-2,0,4)}{2}=(2,2,2)$, כמו שצריך כשהולכים מ-$D$ אותו מרחק לשני הכיוונים.
      - kind: result
        text: >-
          (א) לא תקף, ו-$A,B,D$ אינן על ישר אחד. (ב) $A,B,C$ על ישר אחד, ו-$B$ מחלקת את $AC$ ביחס $1:2$. (ג)
          $E=(6,4,0)$ או $E=(-2,0,4)$.

challenge:
  - id: W-1.1-c1
    stars: 1
    objectives: [OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      משקולת שמשקלה 50 ניוטון תלויה על כבל, ושני חלקי הכבל שמעליה נטויים בזוויות של $40^\circ$ ושל $53^\circ$ מעל
      האופק, אחד לכל צד. המשקולת במנוחה, כלומר הכוח השקול עליה אפס. מצאו את גודלי המתיחויות $T_1$ (בחלק שנטוי ב-$40^\circ$)
      ו-$T_2$ (בחלק שנטוי ב-$53^\circ$), בדיוק של שתי ספרות אחרי הנקודה.

      האם $T_1+T_2=50$? הסבירו.
    answer: >-
      $T_1=\frac{50\cos53^\circ}{\sin93^\circ}\approx30.13$ ניוטון ו-$T_2=\frac{50\cos40^\circ}{\sin93^\circ}\approx38.35$
      ניוטון. הסכום שלהם, $68.49$, גדול מ-50: מתחברים הווקטורים, לא הגדלים.
    solution:
      - kind: idea
        text: >-
          שלושה כוחות פועלים על המשקולת: שתי המתיחויות והמשקל. הסכום הווקטורי שלהם אפס, וזה נותן משוואה אחת לכל ציר.
          רושמים כל כוח ברכיבים בעזרת הגודל שלו והזווית שלו מהאופק, ופותרים שתי משוואות בשני נעלמים.
      - kind: step
        text: >-
          **1.** צירים: $x$ ימינה, $y$ למעלה. כוח בגודל $T$ שנטוי בזווית $\alpha$ מעל האופק הוא
          $(\pm T\cos\alpha,\ T\sin\alpha)$, לפי הצד שאליו הוא נוטה: זה המעבר "מאורך ומזווית" מהשיעור, והרכיב האופקי
          שלילי כשהכוח נוטה שמאלה. לכן
          $\vec T_1=(-T_1\cos40^\circ,\ T_1\sin40^\circ)$, $\vec T_2=(T_2\cos53^\circ,\ T_2\sin53^\circ)$, והמשקל הוא $(0,-50)$.
      - kind: step
        text: >-
          **2.** $\vec T_1+\vec T_2+(0,-50)=\vec 0$, רכיב אחרי רכיב:
          $$T_1\cos40^\circ=T_2\cos53^\circ,\qquad T_1\sin40^\circ+T_2\sin53^\circ=50 .$$
      - kind: computation
        text: >-
          **3.** מהמשוואה הראשונה $T_2=T_1\frac{\cos40^\circ}{\cos53^\circ}$. מציבים בשנייה ומכפילים ב-$\cos53^\circ$:
          $$T_1\left(\sin40^\circ\cos53^\circ+\cos40^\circ\sin53^\circ\right)=50\cos53^\circ .$$
          בסוגריים עומד אגף ימין של הזהות לסינוס של סכום זוויות, מהתיכון:
          $$\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta ,$$
          עם $\alpha=40^\circ$ ו-$\beta=53^\circ$. לכן הסוגריים שווים ל-$\sin(40^\circ+53^\circ)=\sin93^\circ$, ומכאן
          $$T_1=\frac{50\cos53^\circ}{\sin93^\circ}\approx30.13,\qquad T_2=\frac{50\cos40^\circ}{\sin93^\circ}\approx38.35 .$$
      - kind: check
        text: >-
          ברכיבים: $\vec T_1\approx(-23.08,\ 19.37)$ ו-$\vec T_2\approx(23.08,\ 30.63)$. הרכיבים האופקיים מבטלים זה את זה,
          והאנכיים מסתכמים ל-$19.37+30.63=50$. החלק התלול יותר של הכבל, זה שנטוי ב-$53^\circ$, נושא יותר מהמשקל.
      - kind: step
        text: >-
          **4.** $T_1+T_2\approx68.49$, יותר מ-50. אין כאן סתירה: המתיחויות מתחברות כווקטורים, ורק הרכיבים האנכיים שלהן
          נושאים את המשקל. הרכיבים האופקיים מושכים זה נגד זה ו"מתבזבזים". לפי אי-שוויון המשולש, סכום הגדלים של שתי
          המתיחויות חייב להיות לפחות גודל הסכום שלהן, שהוא 50.
      - kind: result
        text: >-
          $T_1\approx30.13$ ניוטון, $T_2\approx38.35$ ניוטון, ו-$T_1+T_2\approx68.49>50$.
    source:
      name: 'OpenStax, Calculus Volume 3 (G. Strang, E. Herman), Section 2.1 Vectors in the Plane'
      year: 2016
      problem: 'Exercise 55'
      url: https://openstax.org/books/calculus-volume-3/pages/2-1-vectors-in-the-plane
      verified: 2026-11-17
      adapted: true

  - id: W-1.1-c2
    stars: 1
    objectives: [OBJ-1.1-3, OBJ-1.1-1]
    prompt: >-
      נתונות הנקודות $A=(1,-1,0)$ ו-$B=(-1,2,1)$. נקודה $P=(x,y,z)$ נמצאת במרחק שווה מ-$A$ ומ-$B$.

      (א) הראו שהקואורדינטות של $P$ מקיימות את המשוואה $-2x+3y+z=2$.

      (ב) הראו גם את הכיוון ההפוך: כל נקודה שמקיימת את המשוואה נמצאת במרחק שווה מ-$A$ ומ-$B$.

      (ג) בדקו שאמצע הקטע $AB$ מקיים את המשוואה. השוו את המקדמים $(-2,3,1)$ לווקטור $\vec{AB}$. מה אתם מגלים?
    answer: >-
      (א)+(ב) $|\vec{PA}|^2-|\vec{PB}|^2=-4x+6y+2z-4$, וזה אפס בדיוק כש-$-2x+3y+z=2$. (ג) האמצע $\left(0,\frac12,\frac12\right)$
      מקיים: $\frac32+\frac12=2$. המקדמים הם בדיוק הרכיבים של $\vec{AB}=(-2,3,1)$.
    solution:
      - kind: idea
        text: >-
          מרחק שווה פירושו $|\vec{PA}|=|\vec{PB}|$. שני האגפים אינם שליליים, ולכן השוויון שקול לשוויון של הריבועים, ושם
          אין שורשים. כשפותחים סוגריים, האיברים הריבועיים $x^2,y^2,z^2$ מופיעים בשני האגפים ומתבטלים, ונשארת משוואה
          ממעלה ראשונה.
      - kind: computation
        text: >-
          **1.** $|\vec{PA}|^2=(x-1)^2+(y+1)^2+z^2=x^2+y^2+z^2-2x+2y+2$.
      - kind: computation
        text: >-
          **2.** $|\vec{PB}|^2=(x+1)^2+(y-2)^2+(z-1)^2=x^2+y^2+z^2+2x-4y-2z+6$.
      - kind: computation
        text: >-
          **3.** ההפרש: $|\vec{PA}|^2-|\vec{PB}|^2=-4x+6y+2z-4$. (א) אם המרחקים שווים, ההפרש אפס, ואחרי חלוקה ב-2:
          $-2x+3y+z=2$.
      - kind: step
        text: >-
          **4.** (ב) כל צעד היה שקילות. אם $-2x+3y+z=2$, אז $-4x+6y+2z-4=0$, כלומר $|\vec{PA}|^2=|\vec{PB}|^2$, ומכיוון
          שאורכים אינם שליליים, $|\vec{PA}|=|\vec{PB}|$.
      - kind: computation
        text: >-
          **5.** (ג) האמצע: $\frac{A+B}{2}=\left(0,\frac12,\frac12\right)$, ו-$-2\cdot0+3\cdot\frac12+\frac12=2$. הוא חייב
          לקיים את המשוואה, כי הוא במרחק שווה משני הקצוות. ו-$\vec{AB}=B-A=(-2,3,1)$: אלה בדיוק המקדמים של $x,y,z$.
      - kind: check
        text: >-
          נקודה נוספת שמקיימת את המשוואה: $(2,2,0)$, כי $-4+6+0=2$. המרחקים שלה: $|(2,2,0)-A|=|(1,3,0)|=\sqrt{10}$
          ו-$|(2,2,0)-B|=|(3,0,-1)|=\sqrt{10}$. שווים.
      - kind: step
        text: >-
          **6.** מה גילינו: אוסף הנקודות שבמרחק שווה מ-$A$ ומ-$B$ מתואר על ידי משוואה אחת ממעלה ראשונה. במישור, המשוואה
          המקבילה מתארת את האנך האמצעי לקטע. במרחב היא מתארת מישור שעובר דרך אמצע הקטע, והמקדמים שלה הם הרכיבים של
          $\vec{AB}$. למה דווקא הם, ומה הקשר שלהם למישור: זה הנושא של שיעורים 1.2 ו-1.3.
      - kind: result
        text: >-
          $P$ במרחק שווה מ-$A$ ומ-$B$ בדיוק כש-$-2x+3y+z=2$; האמצע $\left(0,\frac12,\frac12\right)$ מקיים את המשוואה,
          והמקדמים שלה הם הרכיבים של $\vec{AB}=(-2,3,1)$.
