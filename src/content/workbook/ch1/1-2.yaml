# Workbook of lesson 1.2 — the dot product.
# Objectives (src/course.ts):
#   OBJ-1.2-1  compute a dot product in coordinates and use its properties
#   OBJ-1.2-2  find the angle between two vectors; recognise perpendicular vectors
#   OBJ-1.2-3  compute the projection of a vector on a direction; the work of a constant force along a displacement
# Every number recomputed with sympy in screens/tools/workbook-1-2.py.
lesson: '1.2'
practice:
  - id: W-1.2-01
    level: basic
    objectives: [OBJ-1.2-1]
    prompt: >-
      על שני וקטורים במרחב ידוע רק זה: $|\vec a|=3$, $|\vec b|=2$ ו-$\vec a\cdot\vec b=-3$. הרכיבים שלהם אינם נתונים.
      חשבו בעזרת התכונות של המכפלה הסקלרית:

      (א) $(2\vec a)\cdot(-3\vec b)$;

      (ב) $\vec a\cdot(\vec a+\vec b)$;

      (ג) $(\vec a+\vec b)\cdot(\vec a-\vec b)$.
    answer: >-
      (א) $18$. (ב) $6$. (ג) $5$.
    solution:
      - kind: idea
        text: >-
          אין צורך ברכיבים. פותחים סוגריים כמו בכפל של מספרים (פילוג, הוצאת מספר, חילופיות), ובכל מקום שמופיעה מכפלה
          של וקטור בעצמו מציבים $\vec a\cdot\vec a=|\vec a|^2$.
      - kind: computation
        text: >-
          (א) מוציאים את שני המספרים: $(2\vec a)\cdot(-3\vec b)=2\cdot(-3)\,(\vec a\cdot\vec b)=(-6)\cdot(-3)=18$.
      - kind: computation
        text: >-
          (ב) פילוג: $\vec a\cdot(\vec a+\vec b)=\vec a\cdot\vec a+\vec a\cdot\vec b=|\vec a|^2+\vec a\cdot\vec b=9-3=6$.
      - kind: computation
        text: >-
          (ג) פותחים את שני הסוגריים:
          $(\vec a+\vec b)\cdot(\vec a-\vec b)=\vec a\cdot\vec a-\vec a\cdot\vec b+\vec b\cdot\vec a-\vec b\cdot\vec b$.
          לפי החילופיות שני המחוברים האמצעיים מבטלים זה את זה, ונשאר $|\vec a|^2-|\vec b|^2=9-4=5$. זו הנוסחה
          $(x+y)(x-y)=x^2-y^2$ בלבוש של וקטורים.
      - kind: check
        text: >-
          האם יש בכלל וקטורים כאלה? $\cos\theta=\frac{\vec a\cdot\vec b}{|\vec a|\,|\vec b|}=\frac{-3}{6}=-\frac12$, מספר
          בין $-1$ ל-1, ולכן כן: הזווית ביניהם $120^\circ$. וכל שלוש התשובות מספרים, לא וקטורים.
      - kind: result
        text: >-
          (א) $18$; (ב) $6$; (ג) $5$.

  - id: W-1.2-02
    level: basic
    objectives: [OBJ-1.2-2]
    prompt: >-
      נתון הווקטור $\vec a=(3,-4)$ במישור.

      (א) בדקו ש-$(4,3)$ מאונך ל-$\vec a$.

      (ב) מצאו את **כל** הווקטורים $(x,y)$ במישור שמאונכים ל-$\vec a$.

      (ג) אילו מהם אורכם 10?
    answer: >-
      (א) $4\cdot3+3\cdot(-4)=0$. (ב) כל הכפולות $t\,(4,3)$, עם $t$ מספר כלשהו. (ג) $(8,6)$ ו-$(-8,-6)$.
    solution:
      - kind: idea
        text: >-
          "מאונך" מתורגם למשוואה אחת: המכפלה הסקלרית שווה אפס. במישור זו משוואה אחת בשני נעלמים, ולכן הפתרונות
          ממלאים ישר שלם דרך הראשית: כל הכפולות של וקטור אחד.
      - kind: computation
        text: >-
          (א) $(4,3)\cdot(3,-4)=4\cdot3+3\cdot(-4)=12-12=0$, ולכן הם מאונכים.
      - kind: computation
        text: >-
          (ב) דורשים $(x,y)\cdot(3,-4)=3x-4y=0$, כלומר $y=\frac34x$. כותבים $x=4t$ ואז $y=3t$: הפתרונות הם
          $(4t,3t)=t\,(4,3)$ לכל מספר $t$ (עם $t=0$ מתקבל וקטור האפס, שנחשב מאונך לכל וקטור).
      - kind: step
        text: >-
          שימו לב לדפוס: מחליפים את סדר הרכיבים של $(3,-4)$ והופכים את הסימן של אחד מהם. כך מקבלים במישור וקטור
          מאונך ל-$(p,q)$ בלי לפתור דבר: $(-q,p)$, כי $p\cdot(-q)+q\cdot p=0$.
      - kind: computation
        text: >-
          (ג) $|t\,(4,3)|=|t|\sqrt{16+9}=5|t|$. דורשים $5|t|=10$, כלומר $t=2$ או $t=-2$: הווקטורים $(8,6)$ ו-$(-8,-6)$.
      - kind: check
        text: >-
          $(8,6)\cdot(3,-4)=24-24=0$ ו-$|(8,6)|=\sqrt{64+36}=10$. יש שתי תשובות ולא אחת, כי לישר המאונך יש שני
          כיוונים.
      - kind: result
        text: >-
          המאונכים ל-$(3,-4)$ הם הכפולות $t\,(4,3)$; אלה שאורכם 10 הם $(8,6)$ ו-$(-8,-6)$.

  - id: W-1.2-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.2-1]
    prompt: >-
      $\vec a,\vec b,\vec c$ שלושה וקטורים במרחב, שונים מאפס. לכל ביטוי קבעו: האם הוא **מספר**, **וקטור**, או **חסר
      משמעות**? נמקו בקצרה.

      (א) $(\vec a\cdot\vec b)\,\vec c$

      (ב) $\vec a\cdot(\vec b\cdot\vec c)$

      (ג) $|\vec a|\,(\vec b\cdot\vec c)$

      (ד) $\vec a\cdot\vec b+\vec c$

      (ה) $(\vec a\cdot\vec b)(\vec c\cdot\vec a)$

      (ו) $\dfrac{\vec a\cdot\vec b}{\vec c}$
    answer: >-
      (א) וקטור. (ב) חסר משמעות. (ג) מספר. (ד) חסר משמעות. (ה) מספר. (ו) חסר משמעות.
    solution:
      - kind: idea
        text: >-
          עוברים על הביטוי מבפנים החוצה ורושמים ליד כל חלק את הסוג שלו. מכפלה סקלרית מקבלת **שני וקטורים** ומחזירה
          **מספר**; מספר כפול וקטור הוא וקטור; מספר כפול מספר הוא מספר. כל צירוף אחר (מכפלה סקלרית של וקטור במספר,
          חיבור של מספר ווקטור, חילוק בווקטור) אינו מוגדר.
      - kind: step
        text: >-
          (א) הסוגריים הם מספר, והוא כופל את הווקטור $\vec c$: **וקטור**, בכיוון של $\vec c$ או בכיוון ההפוך.
      - kind: step
        text: >-
          (ב) הסוגריים $\vec b\cdot\vec c$ הם מספר, והנקודה שלפניהם מבקשת מכפלה סקלרית של הווקטור $\vec a$ במספר:
          **חסר משמעות**. (אילו נכתב $\vec a\,(\vec b\cdot\vec c)$, בלי נקודה, זה היה וקטור.)
      - kind: step
        text: >-
          (ג) האורך $|\vec a|$ מספר והסוגריים מספר: **מספר**.
      - kind: step
        text: >-
          (ד) $\vec a\cdot\vec b$ מספר ו-$\vec c$ וקטור, ואין חיבור של מספר עם וקטור: **חסר משמעות**.
      - kind: step
        text: >-
          (ה) שני הסוגריים מספרים, ומכפלתם **מספר**. (ו) המונה מספר, אבל אין חילוק בווקטור: **חסר משמעות**.
      - kind: check
        text: >-
          בדוגמה: $\vec a=(1,2,0)$, $\vec b=(3,1,1)$, $\vec c=(0,1,2)$. אז $\vec a\cdot\vec b=5$, $\vec b\cdot\vec c=3$,
          $\vec c\cdot\vec a=2$, ולכן (א) הוא $5\vec c=(0,5,10)$, (ג) הוא $3\sqrt5$, ו-(ה) הוא $5\cdot2=10$. את (ב), (ד)
          ו-(ו) אי אפשר אפילו להתחיל לחשב.
      - kind: result
        text: >-
          מספר: (ג), (ה). וקטור: (א). חסר משמעות: (ב), (ד), (ו).

  - id: W-1.2-04
    level: mid
    objectives: [OBJ-1.2-2]
    prompt: >-
      קודקודי משולש במרחב הם $A=(1,2,1)$, $B=(3,3,3)$ ו-$C=(3,0,0)$.

      (א) מצאו את שלוש הזוויות של המשולש.

      (ב) תלמידה חישבה את הזווית בקודקוד $B$ מהווקטורים $\vec{AB}$ ו-$\vec{BC}$ וקיבלה $135^\circ$. מה השתבש?
    answer: >-
      (א) הזווית ב-$A$ היא $90^\circ$, והזוויות ב-$B$ וב-$C$ הן $45^\circ$ כל אחת. (ב) שני הווקטורים צריכים **לצאת**
      מהקודקוד: $\vec{BA}$ ו-$\vec{BC}$. עם $\vec{AB}=-\vec{BA}$ מתקבלת הזווית המשלימה ל-$180^\circ$.
    solution:
      - kind: idea
        text: >-
          הזווית בקודקוד היא הזווית בין שני וקטורי ההעתק ש**יוצאים ממנו** אל שני הקודקודים האחרים. לכל קודקוד: שני
          העתקים ("סוף פחות התחלה"), מכפלה סקלרית, שני אורכים, ו-$\arccos$.
      - kind: computation
        text: >-
          בקודקוד $A$: $\vec{AB}=B-A=(2,1,2)$ ו-$\vec{AC}=C-A=(2,-2,-1)$. המכפלה: $4-2-2=0$. הווקטורים מאונכים,
          והזווית ב-$A$ היא $90^\circ$, בלי לחשב אורכים.
      - kind: computation
        text: >-
          בקודקוד $B$: $\vec{BA}=A-B=(-2,-1,-2)$ ו-$\vec{BC}=C-B=(0,-3,-3)$. המכפלה: $0+3+6=9$. האורכים:
          $|\vec{BA}|=\sqrt{4+1+4}=3$ ו-$|\vec{BC}|=\sqrt{9+9}=3\sqrt2$. לכן
          $\cos\theta_B=\frac{9}{3\cdot3\sqrt2}=\frac{1}{\sqrt2}$, והזווית $45^\circ$.
      - kind: computation
        text: >-
          בקודקוד $C$: $\vec{CA}=(-2,2,1)$ ו-$\vec{CB}=(0,3,3)$. המכפלה: $0+6+3=9$, האורכים $3$ ו-$3\sqrt2$, ושוב
          $\cos\theta_C=\frac1{\sqrt2}$: הזווית $45^\circ$.
      - kind: step
        text: >-
          (ב) $\vec{AB}\cdot\vec{BC}=(2,1,2)\cdot(0,-3,-3)=-9$, ומכאן $\cos=-\frac{1}{\sqrt2}$ ו-$135^\circ$. אבל
          $\vec{AB}$ **נכנס** לקודקוד $B$ ואינו יוצא ממנו. כשמזיזים אותו כך שיתחיל ב-$B$, הוא מצביע אל מחוץ למשולש,
          והזווית שנמדדה היא הזווית החיצונית, $180^\circ-45^\circ$. היפוך של אחד הווקטורים הופך את הסימן של המכפלה,
          ולכן את הסימן של הקוסינוס.
      - kind: check
        text: >-
          סכום הזוויות: $90^\circ+45^\circ+45^\circ=180^\circ$. המשולש ישר זווית ושווה שוקיים ($|\vec{AB}|=|\vec{AC}|=3$),
          ופיתגורס מתקיים: $3^2+3^2=18=(3\sqrt2)^2$.
      - kind: result
        text: >-
          הזוויות הן $90^\circ$ ב-$A$, $45^\circ$ ב-$B$ ו-$45^\circ$ ב-$C$. לזווית בקודקוד לוקחים את שני הווקטורים
          שיוצאים ממנו.

  - id: W-1.2-05
    level: mid
    objectives: [OBJ-1.2-1, OBJ-1.2-2]
    prompt: >-
      על שני וקטורים ידוע: $|\vec a|=5$, $|\vec b|=3$ ו-$|\vec a+\vec b|=7$. הרכיבים אינם נתונים.

      (א) מצאו את $\vec a\cdot\vec b$.

      (ב) מצאו את הזווית בין $\vec a$ ל-$\vec b$.

      (ג) מצאו את $|\vec a-\vec b|$.
    answer: >-
      (א) $\vec a\cdot\vec b=\frac{15}{2}$. (ב) $60^\circ$, כלומר $\frac\pi3$. (ג) $|\vec a-\vec b|=\sqrt{19}\approx4.36$.
    solution:
      - kind: idea
        text: >-
          אורך של סכום אינו סכום האורכים, אבל **ריבוע** האורך נפתח כמו $(x+y)^2$, והמחובר האמצעי הוא בדיוק המכפלה
          הסקלרית. לכן שלושה אורכים קובעים את $\vec a\cdot\vec b$, וממנה הכול נגזר.
      - kind: theorem
        text: >-
          מהשיעור: $|\vec a+\vec b|^2=|\vec a|^2+2\,\vec a\cdot\vec b+|\vec b|^2$, ובאותה דרך
          $|\vec a-\vec b|^2=|\vec a|^2-2\,\vec a\cdot\vec b+|\vec b|^2$.
      - kind: computation
        text: >-
          (א) מציבים: $49=25+2\,\vec a\cdot\vec b+9$, ולכן $2\,\vec a\cdot\vec b=15$ ו-$\vec a\cdot\vec b=\frac{15}{2}$.
      - kind: computation
        text: >-
          (ב) $\cos\theta=\frac{\vec a\cdot\vec b}{|\vec a|\,|\vec b|}=\frac{15/2}{15}=\frac12$, ולכן $\theta=\frac\pi3$,
          שהם $60^\circ$.
      - kind: computation
        text: >-
          (ג) $|\vec a-\vec b|^2=25-15+9=19$, ולכן $|\vec a-\vec b|=\sqrt{19}\approx4.36$.
      - kind: check
        text: >-
          המכפלה חיובית והזווית חדה, כמו שצריך. ובדיקה בווקטורים מפורשים: $\vec a=(5,0)$ ו-
          $\vec b=\left(\frac32,\frac{3\sqrt3}{2}\right)$ (אורך 3, בזווית $60^\circ$ לציר $x$) נותנים $|\vec a+\vec b|=7$ ו-
          $|\vec a-\vec b|=\sqrt{19}$. עוד בדיקה: כשמחברים את שתי הנוסחאות המכפלה הסקלרית מתבטלת, ומתקבל
          $|\vec a+\vec b|^2+|\vec a-\vec b|^2=2|\vec a|^2+2|\vec b|^2$, ואכן $49+19=68=50+18$.
      - kind: result
        text: >-
          $\vec a\cdot\vec b=\frac{15}{2}$, הזווית $60^\circ$, ו-$|\vec a-\vec b|=\sqrt{19}$.

  - id: W-1.2-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.2-2, OBJ-1.2-3]
    prompt: >-
      נכון או לא נכון? נמקו כל סעיף: הסבר קצר כשהטענה נכונה, דוגמה נגדית כשאינה נכונה. כל הווקטורים שונים מאפס.

      (א) אם $\vec a\perp\vec b$ ו-$\vec b\perp\vec c$, אז $\vec a\perp\vec c$.

      (ב) ההיטל הסקלרי של $\vec a$ על הכיוון של $\vec b$ שווה להיטל הסקלרי של $\vec b$ על הכיוון של $\vec a$.

      (ג) וקטור ההיטל של $\vec a$ על $\vec b$ שווה לווקטור ההיטל של $\vec a$ על $-\vec b$.

      (ד) כוח קבוע שגודלו 10 ניוטון יכול לעשות עבודה של 25 ג׳אול לאורך העתק שאורכו 2 מטרים.
    answer: >-
      (א) לא נכון: $\vec a=\vec c=\hat\imath$, $\vec b=\hat\jmath$. (ב) לא נכון: $(3,4)$ ו-$(1,0)$ נותנים 3 ו-$\frac35$.
      (ג) נכון. (ד) לא נכון: העבודה לכל היותר $10\cdot2=20$ ג׳אול.
    solution:
      - kind: idea
        text: >-
          כל טענה מתרגמים לנוסחה של מכפלה סקלרית ובודקים אם היא נובעת. לטענה שגויה מספיקה דוגמה אחת, והפשוטות
          ביותר בנויות מ-$\hat\imath,\hat\jmath,\hat k$.
      - kind: step
        text: >-
          (א) לא נכון. $\vec a=\hat\imath$, $\vec b=\hat\jmath$, $\vec c=\hat\imath$: $\hat\imath\cdot\hat\jmath=0$ ו-
          $\hat\jmath\cdot\hat\imath=0$, אבל $\vec a\cdot\vec c=\hat\imath\cdot\hat\imath=1\ne0$. "מאונך ל-" אינו עובר
          הלאה כמו "שווה ל-": שני וקטורים שמאונכים לאותו וקטור יכולים להיות בכל זווית זה לזה.
      - kind: step
        text: >-
          (ב) לא נכון בדרך כלל. המונה אותו מונה, $\vec a\cdot\vec b$, אבל מחלקים באורך אחר:
          $\frac{\vec a\cdot\vec b}{|\vec b|}$ מול $\frac{\vec a\cdot\vec b}{|\vec a|}$. עבור $\vec a=(3,4)$ ו-$\vec b=(1,0)$:
          ההיטל של $\vec a$ על $\vec b$ הוא $\frac31=3$, וההיטל של $\vec b$ על $\vec a$ הוא $\frac35$. השוויון מתקיים רק
          כש-$|\vec a|=|\vec b|$ או כשהווקטורים מאונכים (ואז שני ההיטלים 0).
      - kind: step
        text: >-
          (ג) נכון. מציבים $-\vec b$ בנוסחה: $\frac{\vec a\cdot(-\vec b)}{|-\vec b|^2}(-\vec b)=\frac{-(\vec a\cdot\vec b)}{|\vec b|^2}\,(-\vec b)=\frac{\vec a\cdot\vec b}{|\vec b|^2}\,\vec b$:
          שני המינוסים מבטלים זה את זה. הצל של $\vec a$ על ישר אינו תלוי בכיוון שבחרנו לאורך הישר. ההיטל **הסקלרי**
          דווקא הופך סימן.
      - kind: computation
        text: >-
          דוגמה ל-(ג): $\vec a=(3,4)$, $\vec b=(2,1)$. $\vec a\cdot\vec b=10$ ו-$|\vec b|^2=5$, ולכן וקטור ההיטל הוא
          $2\,(2,1)=(4,2)$. עם $-\vec b=(-2,-1)$: $\frac{-10}{5}(-2,-1)=(4,2)$, אותו וקטור. ההיטלים הסקלריים:
          $\frac{10}{\sqrt5}=2\sqrt5$ ו-$-2\sqrt5$.
      - kind: step
        text: >-
          (ד) לא נכון. $W=|\vec F|\,|\vec d|\cos\theta$, ו-$\cos\theta\le1$, ולכן $W\le|\vec F|\,|\vec d|=10\cdot2=20$
          ג׳אול. את המקסימום מקבלים רק כשהכוח פועל בדיוק בכיוון התנועה.
      - kind: result
        text: >-
          נכון: (ג). לא נכון: (א), (ב), (ד).

  - id: W-1.2-07
    level: mid
    objectives: [OBJ-1.2-3]
    prompt: >-
      ארגז מונח על מדרון ישר. בוחרים מערכת צירים במישור האנכי: ציר $x$ אופקי וציר $y$ כלפי מעלה. המדרון עולה בכיוון
      של הווקטור $(4,3)$, וכוח הכובד על הארגז הוא $\vec G=(0,-50)$ ניוטון.

      (א) מצאו את וקטור היחידה $\hat u$ בכיוון העלייה במדרון.

      (ב) מצאו את הרכיב של כוח הכובד בכיוון $\hat u$. מה אומר הסימן שלו?

      (ג) פרקו את $\vec G$ לסכום של כוח לאורך המדרון וכוח מאונך למדרון, ומצאו את הגודל של כל אחד מהם.

      (ד) הארגז מחליק 5 מטרים **במורד** המדרון. כמה עבודה עושה כוח הכובד? וכמה עבודה עושה החלק של $\vec G$ שמאונך
      למדרון?
    answer: >-
      (א) $\hat u=\left(\frac45,\frac35\right)$. (ב) $\vec G\cdot\hat u=-30$ ניוטון: הכובד מושך במורד המדרון.
      (ג) $\vec G=(-24,-18)+(24,-32)$, בגדלים 30 ו-40 ניוטון. (ד) 150 ג׳אול; החלק המאונך עושה עבודה 0.
    solution:
      - kind: idea
        text: >-
          זה פירוק של וקטור לחלק לאורך כיוון נתון ולחלק מאונך לו: הרכיב לאורך המדרון הוא מכפלה סקלרית עם וקטור
          היחידה של המדרון, וקטור ההיטל הוא הרכיב כפול $\hat u$, והחלק המאונך הוא מה שנשאר. העבודה היא מכפלה
          סקלרית של הכוח בהעתק.
      - kind: computation
        text: >-
          (א) $|(4,3)|=\sqrt{16+9}=5$, ולכן $\hat u=\frac15(4,3)=\left(\frac45,\frac35\right)$.
      - kind: computation
        text: >-
          (ב) $\vec G\cdot\hat u=0\cdot\frac45+(-50)\cdot\frac35=-30$ ניוטון. הסימן השלילי אומר שההיטל של $\vec G$ נופל
          בצד ההפוך ל-$\hat u$: הכובד מושך את הארגז **במורד** המדרון, בכוח של 30 ניוטון.
      - kind: computation
        text: >-
          (ג) החלק לאורך המדרון: $\vec G_\parallel=(\vec G\cdot\hat u)\,\hat u=-30\left(\frac45,\frac35\right)=(-24,-18)$,
          וגודלו 30 ניוטון. החלק המאונך: $\vec G_\perp=\vec G-\vec G_\parallel=(0+24,\,-50+18)=(24,-32)$, וגודלו
          $\sqrt{576+1024}=\sqrt{1600}=40$ ניוטון. (זה הכוח שלוחץ את הארגז אל המדרון.)
      - kind: computation
        text: >-
          (ד) ההעתק הוא 5 מטרים בכיוון $-\hat u$: $\vec d=-5\hat u=(-4,-3)$. העבודה של הכובד:
          $\vec G\cdot\vec d=0\cdot(-4)+(-50)\cdot(-3)=150$ ג׳אול. החלק המאונך: $\vec G_\perp\cdot\vec d=24\cdot(-4)+(-32)\cdot(-3)=-96+96=0$.
          כל העבודה באה מהחלק שלאורך המדרון: $\vec G_\parallel\cdot\vec d=96+54=150$.
      - kind: check
        text: >-
          החלק המאונך אכן מאונך למדרון: $(24,-32)\cdot(4,3)=96-96=0$. פיתגורס: $30^2+40^2=2500=50^2$. ובדיקה פיזיקלית:
          הארגז ירד 3 מטרים בגובה (הרכיב האנכי של $\vec d$), ו"משקל כפול ירידה בגובה" הוא $50\cdot3=150$ ג׳אול.
          היחידות: ניוטון כפול מטר הוא ג׳אול.
      - kind: result
        text: >-
          $\hat u=\left(\frac45,\frac35\right)$; הרכיב לאורך המדרון $-30$ ניוטון; $\vec G=(-24,-18)+(24,-32)$, בגדלים 30
          ו-40 ניוטון; עבודת הכובד 150 ג׳אול, כולה מהחלק שלאורך המדרון.

  - id: W-1.2-08
    level: exam
    objectives: [OBJ-1.2-1, OBJ-1.2-2, OBJ-1.2-3]
    prompt: >-
      נתונים $\vec a=(1,2,2)$ ו-$\vec b=(4,0,3)$.

      (א) מצאו את הזווית בין $\vec a$ ל-$\vec b$.

      (ב) לכל מספר $t$ מגדירים $f(t)=|\vec b-t\vec a|^2$. כתבו את $f(t)$ כפולינום ב-$t$, ומצאו את הערך $t_0$ שבו
      הוא הקטן ביותר.

      (ג) הראו ש-$\vec b-t_0\vec a$ מאונך ל-$\vec a$, והסבירו מהו הווקטור $t_0\vec a$ בשפת ההיטלים.

      (ד) מהו האורך הקטן ביותר של $\vec b-t\vec a$?
    answer: >-
      (א) $\cos\theta=\frac23$, $\theta\approx48.19^\circ$ ($0.841$ רדיאנים). (ב) $f(t)=9t^2-20t+25$, $t_0=\frac{10}{9}$.
      (ג) $(\vec b-t_0\vec a)\cdot\vec a=10-9t_0=0$; $t_0\vec a$ הוא וקטור ההיטל של $\vec b$ על $\vec a$.
      (ד) $\frac{5\sqrt5}{3}\approx3.727$.
    solution:
      - kind: idea
        text: >-
          הווקטורים $t\vec a$ הם כל הכפולות של $\vec a$, ו-$\vec b-t\vec a$ הוא החץ מהקצה של $t\vec a$ אל הקצה של
          $\vec b$. שואלים איזו כפולה של $\vec a$ קרובה ביותר ל-$\vec b$. התשובה הצפויה: הצל של $\vec b$ על הכיוון של
          $\vec a$, כי אז החץ שנשאר מאונך ל-$\vec a$. את ריבוע האורך פותחים כמו $(x-y)^2$.
      - kind: computation
        text: >-
          (א) $\vec a\cdot\vec b=4+0+6=10$, $|\vec a|=\sqrt{1+4+4}=3$, $|\vec b|=\sqrt{16+0+9}=5$. לכן
          $\cos\theta=\frac{10}{15}=\frac23$ ו-$\theta=\arccos\frac23\approx0.841$ רדיאנים, שהם $48.19^\circ$.
      - kind: computation
        text: >-
          (ב) פותחים סוגריים:
          $f(t)=(\vec b-t\vec a)\cdot(\vec b-t\vec a)=|\vec b|^2-2t\,(\vec a\cdot\vec b)+t^2|\vec a|^2=25-20t+9t^2$.
          זו פרבולה "מחייכת" ב-$t$, והמינימום שלה בקודקוד: $t_0=\frac{20}{2\cdot9}=\frac{10}{9}$.
      - kind: computation
        text: >-
          (ג) לפי הפילוג, $(\vec b-t\vec a)\cdot\vec a=\vec b\cdot\vec a-t\,|\vec a|^2=10-9t$, וזה אפס בדיוק כש-
          $t=\frac{10}{9}=t_0$. ו-$t_0=\frac{\vec a\cdot\vec b}{|\vec a|^2}$ הוא המקדם של נוסחת ההיטל, כלומר
          $t_0\vec a=\frac{\vec b\cdot\vec a}{|\vec a|^2}\,\vec a=\left(\frac{10}{9},\frac{20}{9},\frac{20}{9}\right)$ הוא
          **וקטור ההיטל** של $\vec b$ על $\vec a$, ו-$\vec b-t_0\vec a=\left(\frac{26}{9},-\frac{20}{9},\frac{7}{9}\right)$
          הוא החלק של $\vec b$ המאונך ל-$\vec a$.
      - kind: computation
        text: >-
          (ד) $f(t_0)=9\cdot\frac{100}{81}-20\cdot\frac{10}{9}+25=\frac{100}{9}-\frac{200}{9}+\frac{225}{9}=\frac{125}{9}$,
          ולכן האורך הקטן ביותר הוא $\sqrt{\frac{125}{9}}=\frac{5\sqrt5}{3}\approx3.727$.
      - kind: check
        text: >-
          ישירות: $\left(\frac{26}{9},-\frac{20}{9},\frac{7}{9}\right)\cdot(1,2,2)=\frac{26-40+14}{9}=0$. פיתגורס במשולש
          שצלעותיו $\vec b$, ההיטל והחלק המאונך: ההיטל הסקלרי הוא $\frac{10}{3}$, ו-$\left(\frac{10}{3}\right)^2+\frac{125}{9}=\frac{225}{9}=25=|\vec b|^2$.
          ומהזווית: החלק המאונך הוא $|\vec b|\sin\theta=5\sqrt{1-\frac49}=\frac{5\sqrt5}{3}$, אותו מספר.
      - kind: result
        text: >-
          $\cos\theta=\frac23$; $f(t)=9t^2-20t+25$ עם מינימום ב-$t_0=\frac{10}{9}$; שם $\vec b-t_0\vec a\perp\vec a$,
          ו-$t_0\vec a$ הוא וקטור ההיטל של $\vec b$ על $\vec a$; האורך הקטן ביותר $\frac{5\sqrt5}{3}$. הכפולה של $\vec a$
          הקרובה ביותר ל-$\vec b$ היא ההיטל.

  - id: W-1.2-09
    level: exam
    objectives: [OBJ-1.2-3, OBJ-1.2-1]
    prompt: >-
      חלקיק נע בקו ישר מהנקודה $A=(2,-1,1)$ לנקודה $B=(5,1,-1)$, ומשם בקו ישר לנקודה $C=(5,4,3)$ (במטרים). לאורך כל
      הדרך פועלים עליו שני כוחות קבועים, $\vec F_1=(1,2,3)$ ו-$\vec F_2=(2,-3,0)$ ניוטון.

      (א) חשבו את העבודה של כל אחד מהכוחות בקטע מ-$A$ ל-$B$. מה מיוחד ב-$\vec F_2$?

      (ב) חשבו את העבודה של הכוח השקול $\vec F_1+\vec F_2$ בקטע מ-$A$ ל-$B$, והשוו לסעיף (א). איזו תכונה של המכפלה
      הסקלרית מסבירה את התוצאה?

      (ג) חשבו את העבודה של $\vec F_1$ לאורך כל הדרך, מ-$A$ דרך $B$ ל-$C$, והראו שהיא שווה לעבודה שהיה עושה
      לאורך ההעתק הישיר מ-$A$ ל-$C$. האם זה מקרה?

      (ד) מהו הרכיב של $\vec F_1$ בכיוון התנועה בקטע הראשון?
    answer: >-
      (א) $W_1=1$ ג׳אול, $W_2=0$: $\vec F_2$ מאונך להעתק. (ב) 1 ג׳אול, סכום העבודות, לפי הפילוג. (ג) $1+18=19$
      ג׳אול, וגם $\vec F_1\cdot(C-A)=19$; לא מקרה, שוב הפילוג. (ד) $\frac{1}{\sqrt{17}}\approx0.243$ ניוטון.
    solution:
      - kind: idea
        text: >-
          לכל קטע ישר: ההעתק הוא סוף פחות התחלה, והעבודה של כוח קבוע היא המכפלה הסקלרית שלו בהעתק. התכונה שעומדת
          מאחורי (ב) ו-(ג) היא הפילוג, פעם בכוח ופעם בהעתק.
      - kind: computation
        text: >-
          (א) $\vec d_1=B-A=(3,2,-2)$. $W_1=\vec F_1\cdot\vec d_1=3+4-6=1$ ג׳אול. $W_2=\vec F_2\cdot\vec d_1=6-6+0=0$:
          הכוח $\vec F_2$ מאונך לתנועה ואינו עושה עבודה, אף שגודלו $\sqrt{13}\approx3.61$ ניוטון.
      - kind: computation
        text: >-
          (ב) $\vec F_1+\vec F_2=(3,-1,3)$, ו-$(3,-1,3)\cdot(3,2,-2)=9-2-6=1$ ג׳אול, בדיוק $W_1+W_2=1+0$. זה הפילוג:
          $(\vec F_1+\vec F_2)\cdot\vec d=\vec F_1\cdot\vec d+\vec F_2\cdot\vec d$. העבודה של השקול היא סכום העבודות.
      - kind: computation
        text: >-
          (ג) הקטע השני: $\vec d_2=C-B=(0,3,4)$, ו-$\vec F_1\cdot\vec d_2=0+6+12=18$ ג׳אול. בסך הכול $1+18=19$ ג׳אול.
          ההעתק הישיר: $C-A=(3,5,2)$, ו-$\vec F_1\cdot(3,5,2)=3+10+6=19$ ג׳אול.
      - kind: step
        text: >-
          זה אינו מקרה. $\vec d_1+\vec d_2=(B-A)+(C-B)=C-A$, ולפי הפילוג
          $\vec F_1\cdot\vec d_1+\vec F_1\cdot\vec d_2=\vec F_1\cdot(\vec d_1+\vec d_2)=\vec F_1\cdot(C-A)$. העבודה של כוח
          **קבוע** תלויה רק בנקודת ההתחלה ובנקודת הסיום, לא בדרך השבורה שביניהן.
      - kind: computation
        text: >-
          (ד) $|\vec d_1|=\sqrt{9+4+4}=\sqrt{17}$, והרכיב הוא $\frac{\vec F_1\cdot\vec d_1}{|\vec d_1|}=\frac{1}{\sqrt{17}}\approx0.243$
          ניוטון.
      - kind: check
        text: >-
          רכיב כפול דרך: $\frac{1}{\sqrt{17}}\cdot\sqrt{17}=1$ ג׳אול, כמו ב-(א). גודל הכוח $\vec F_1$ הוא
          $\sqrt{14}\approx3.74$ ניוטון, ורק $0.243$ מהם פועלים בכיוון התנועה: הכוח כמעט מאונך לקטע הראשון. ושימו לב
          שבשום מקום לא נכנס וקטור המקום של נקודה, רק העתקים.
      - kind: result
        text: >-
          $W_1=1$ ג׳אול ו-$W_2=0$; השקול עושה 1 ג׳אול; $\vec F_1$ עושה 19 ג׳אול לאורך כל הדרך, כמו לאורך ההעתק הישיר;
          הרכיב של $\vec F_1$ בכיוון הקטע הראשון הוא $\frac{1}{\sqrt{17}}$ ניוטון.

  - id: W-1.2-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.2-3]
    prompt: >-
      התבקש: לפרק את $\vec a=(1,-2,2)$ לסכום של וקטור מקביל ל-$\vec b=(-4,0,3)$ ושל וקטור מאונך ל-$\vec b$. תלמיד כתב:

      **שלב 1.** $\vec a\cdot\vec b=-4+0+6=2$, ו-$|\vec b|=\sqrt{16+0+9}=5$.

      **שלב 2.** החלק המקביל: $\vec a_\parallel=\frac{\vec a\cdot\vec b}{|\vec b|}\,\vec b=\frac25(-4,0,3)=\left(-\frac85,0,\frac65\right)$.

      **שלב 3.** החלק המאונך: $\vec a_\perp=\vec a-\vec a_\parallel=\left(\frac{13}{5},-2,\frac45\right)$.

      (א) בלי לפתור מחדש, בצעו בדיקה אחת שמראה שהתשובה שגויה.

      (ב) באיזה שלב הטעות, ומהי? איך היה אפשר לחשוד בה כבר בשלב 2, אם מחליפים את $\vec b$ ב-$2\vec b$?

      (ג) כתבו את הפירוק הנכון ובדקו אותו.
    answer: >-
      (א) $\vec a_\perp\cdot\vec b=-8\ne0$: החלק ה"מאונך" אינו מאונך. (ב) שלב 2: חילק ב-$|\vec b|$ במקום ב-$|\vec b|^2$;
      עם $2\vec b$ הנוסחה שלו נותנת וקטור כפול. (ג) $\vec a=\left(-\frac{8}{25},0,\frac{6}{25}\right)+\left(\frac{33}{25},-2,\frac{44}{25}\right)$.
    solution:
      - kind: idea
        text: >-
          לפירוק יש שתי בדיקות מהירות: החלק שנשאר חייב להיות מאונך ל-$\vec b$, וההיטל תלוי רק בכיוון של $\vec b$ ולא
          באורכו. מפעילים אותן על הפתרון של התלמיד לפני שמחפשים את הטעות.
      - kind: computation
        text: >-
          (א) $\left(\frac{13}{5},-2,\frac45\right)\cdot(-4,0,3)=-\frac{52}{5}+0+\frac{12}{5}=-8\ne0$. החלק שנקרא "מאונך"
          אינו מאונך ל-$\vec b$, ולכן הפירוק שגוי. (שלב 3 עצמו, החיסור, בוצע נכון: הטעות לפניו.)
      - kind: step
        text: >-
          (ב) שלב 1 נכון. הטעות בשלב 2: $\frac{\vec a\cdot\vec b}{|\vec b|}=\frac25$ הוא ההיטל **הסקלרי**, האורך של
          הצל (עם סימן). כדי לקבל וקטור באורך הזה צריך לכפול ב**וקטור היחידה** $\hat b=\frac{\vec b}{|\vec b|}$, לא
          ב-$\vec b$ עצמו. התלמיד כפל ב-$\vec b$, שאורכו 5, וקיבל וקטור ארוך פי 5: אורכו 2 במקום $\frac25$. בנוסחה
          הנכונה מחלקים ב-$|\vec b|$ פעמיים: $\frac{\vec a\cdot\vec b}{|\vec b|^2}\,\vec b$.
      - kind: computation
        text: >-
          הבדיקה עם $2\vec b=(-8,0,6)$: $\vec a\cdot(2\vec b)=4$ ו-$|2\vec b|=10$, והנוסחה של התלמיד נותנת
          $\frac{4}{10}(-8,0,6)=\left(-\frac{16}{5},0,\frac{12}{5}\right)$, פי 2 מהתשובה הקודמת שלו. אבל $\vec b$ ו-$2\vec b$
          מגדירים אותו כיוון, והצל של $\vec a$ עליו חייב להיות אותו וקטור. נוסחה שהתוצאה שלה משתנה כשמותחים את
          $\vec b$ אינה יכולה להיות נוסחת היטל.
      - kind: computation
        text: >-
          (ג) $\vec a_\parallel=\frac{\vec a\cdot\vec b}{|\vec b|^2}\,\vec b=\frac{2}{25}(-4,0,3)=\left(-\frac{8}{25},0,\frac{6}{25}\right)$,
          ו-$\vec a_\perp=\vec a-\vec a_\parallel=\left(1+\frac{8}{25},\,-2,\,2-\frac{6}{25}\right)=\left(\frac{33}{25},-2,\frac{44}{25}\right)$.
      - kind: check
        text: >-
          $\vec a_\perp\cdot\vec b=\frac{33}{25}\cdot(-4)+0+\frac{44}{25}\cdot3=-\frac{132}{25}+\frac{132}{25}=0$. האורך של
          $\vec a_\parallel$ הוא $\frac{2}{25}\cdot5=\frac25$, שווה להיטל הסקלרי. ועם $2\vec b$ הנוסחה הנכונה נותנת
          $\frac{4}{100}(-8,0,6)=\left(-\frac{8}{25},0,\frac{6}{25}\right)$, אותו וקטור.
      - kind: result
        text: >-
          הטעות בשלב 2: חילוק ב-$|\vec b|$ במקום ב-$|\vec b|^2$. הפירוק הנכון:
          $\vec a=\left(-\frac{8}{25},0,\frac{6}{25}\right)+\left(\frac{33}{25},-2,\frac{44}{25}\right)$, והחלק השני מאונך
          ל-$\vec b$.

challenge:
  - id: W-1.2-c1
    stars: 1
    objectives: [OBJ-1.2-1, OBJ-1.2-2]
    prompt: >-
      מקבילית נבנית על שני וקטורים $\vec a$ ו-$\vec b$ שיוצאים מאותו קודקוד: הם שתי צלעות סמוכות שלה. פתרו את (א)
      ואת (ב) **בלי רכיבים**, רק בעזרת התכונות של המכפלה הסקלרית.

      (א) הראו שבמעוין (מקבילית שכל צלעותיה שוות באורכן) האלכסונים מאונכים זה לזה.

      (ב) הראו שמקבילית שהאלכסונים שלה שווים באורכם היא מלבן.

      (ג) בדקו את שתי הטענות על המקבילית שנבנית על $\vec a=(2,1,2)$ ו-$\vec b=(1,2,-2)$. איזו מקבילית זו?
    answer: >-
      האלכסונים הם $\vec a+\vec b$ ו-$\vec a-\vec b$. (א) $(\vec a+\vec b)\cdot(\vec a-\vec b)=|\vec a|^2-|\vec b|^2=0$.
      (ב) $|\vec a+\vec b|^2-|\vec a-\vec b|^2=4\,\vec a\cdot\vec b$, ולכן אלכסונים שווים נותנים $\vec a\cdot\vec b=0$.
      (ג) ריבוע שאורך צלעו 3.
    solution:
      - kind: idea
        text: >-
          מתרגמים את הגיאומטריה לווקטורים: האלכסון שיוצא מהקודקוד המשותף הוא הסכום $\vec a+\vec b$, והאלכסון השני
          מחבר את שני הקצוות, ולכן הוא ההפרש $\vec a-\vec b$ (שיעור 1.1). "מאונכים" פירושו מכפלה סקלרית אפס, ו"שווים
          באורכם" פירושו ריבועי אורכים שווים. את שניהם פותחים בעזרת הפילוג.
      - kind: computation
        text: >-
          (א) $(\vec a+\vec b)\cdot(\vec a-\vec b)=\vec a\cdot\vec a-\vec a\cdot\vec b+\vec b\cdot\vec a-\vec b\cdot\vec b=|\vec a|^2-|\vec b|^2$,
          כי לפי החילופיות שני המחוברים האמצעיים מבטלים זה את זה. במעוין $|\vec a|=|\vec b|$, ולכן המכפלה אפס
          והאלכסונים מאונכים.
      - kind: computation
        text: >-
          (ב) $|\vec a+\vec b|^2=|\vec a|^2+2\,\vec a\cdot\vec b+|\vec b|^2$ ו-$|\vec a-\vec b|^2=|\vec a|^2-2\,\vec a\cdot\vec b+|\vec b|^2$.
          מחסרים: $|\vec a+\vec b|^2-|\vec a-\vec b|^2=4\,\vec a\cdot\vec b$. אם האלכסונים שווים באורכם אגף שמאל אפס,
          ולכן $\vec a\cdot\vec b=0$: שתי צלעות סמוכות מאונכות. מקבילית עם זווית ישרה היא מלבן.
      - kind: step
        text: >-
          שני החישובים עובדים גם בכיוון ההפוך: אם האלכסונים מאונכים אז $|\vec a|=|\vec b|$ (מעוין), ואם $\vec a\perp\vec b$
          אז האלכסונים שווים באורכם. כלומר כל אחת מהתכונות מאפיינת את הצורה.
      - kind: computation
        text: >-
          (ג) $|\vec a|=\sqrt{4+1+4}=3$ ו-$|\vec b|=\sqrt{1+4+4}=3$: מעוין. $\vec a\cdot\vec b=2+2-4=0$: מלבן. מעוין שהוא
          מלבן הוא ריבוע, שאורך צלעו 3. האלכסונים: $\vec a+\vec b=(3,3,0)$ ו-$\vec a-\vec b=(1,-1,4)$.
      - kind: check
        text: >-
          $(3,3,0)\cdot(1,-1,4)=3-3+0=0$: האלכסונים מאונכים. $|(3,3,0)|=\sqrt{18}$ ו-$|(1,-1,4)|=\sqrt{1+1+16}=\sqrt{18}$:
          שווים באורכם. ו-$\sqrt{18}=3\sqrt2$ הוא אכן אורך האלכסון של ריבוע שצלעו 3.
      - kind: result
        text: >-
          במעוין $(\vec a+\vec b)\cdot(\vec a-\vec b)=|\vec a|^2-|\vec b|^2=0$, ולכן האלכסונים מאונכים. אלכסונים שווים
          באורכם נותנים $4\,\vec a\cdot\vec b=0$, ולכן המקבילית מלבן. המקבילית שב-(ג) היא ריבוע.
    source:
      name: 'OpenStax, Calculus Volume 3 (G. Strang, E. Herman), Section 2.3 The Dot Product'
      year: 2016
      problem: 'Exercises 157 and 158'
      url: https://openstax.org/books/calculus-volume-3/pages/2-3-the-dot-product
      verified: 2026-11-17
      adapted: true

  - id: W-1.2-c2
    stars: 1
    objectives: [OBJ-1.2-1, OBJ-1.2-2]
    prompt: >-
      אי-שוויון קושי-שוורץ אומר שלכל שני וקטורים, במישור או במרחב,

      $$|\vec a\cdot\vec b|\le|\vec a|\,|\vec b| .$$

      (א) הוכיחו אותו מהנוסחה הגיאומטרית של המכפלה הסקלרית. מתי מתקיים שוויון?

      (ב) כתבו מה אומר אי-השוויון לשני וקטורים במישור, $\vec a=(a_1,a_2)$ ו-$\vec b=(b_1,b_2)$, בלי שורשים ובלי ערך
      מוחלט.

      (ג) הוכחה שנייה, בלי זוויות. (1) הסבירו למה $(\vec a+t\vec b)\cdot(\vec a+t\vec b)\ge0$ לכל מספר $t$. (2) פתחו
      סוגריים וכתבו את הביטוי כפולינום ממעלה שנייה ב-$t$. (3) לפולינום ממעלה שנייה שאינו שלילי באף נקודה יש לכל
      היותר שורש אחד. מה זה אומר על המקדמים שלו?
    answer: >-
      (א) $|\vec a\cdot\vec b|=|\vec a|\,|\vec b|\,|\cos\theta|$ ו-$|\cos\theta|\le1$; שוויון כש-$\theta=0$ או $\theta=\pi$
      (אחד הווקטורים כפולה של השני), או כשאחד מהם אפס. (ב) $(a_1b_1+a_2b_2)^2\le(a_1^2+a_2^2)(b_1^2+b_2^2)$.
      (ג) הדיסקרימיננטה אינה חיובית: $4(\vec a\cdot\vec b)^2-4|\vec a|^2|\vec b|^2\le0$.
    solution:
      - kind: idea
        text: >-
          שתי דרכים לאותו אי-שוויון. הראשונה גיאומטרית: המכפלה הסקלרית היא מכפלת האורכים כפול קוסינוס, וקוסינוס אינו
          עובר את 1 בערכו המוחלט. השנייה אלגברית: ריבוע אורך של וקטור אינו שלילי, וכשהווקטור תלוי ב-$t$ מקבלים
          פרבולה שאינה יורדת מתחת לציר, ועל פרבולה כזו יודעים משהו מהתיכון: הדיסקרימיננטה שלה אינה חיובית.
      - kind: computation
        text: >-
          (א) אם אחד הווקטורים הוא וקטור האפס, שני האגפים אפס ומתקיים שוויון. אחרת
          $\vec a\cdot\vec b=|\vec a|\,|\vec b|\cos\theta$, ולכן $|\vec a\cdot\vec b|=|\vec a|\,|\vec b|\,|\cos\theta|\le|\vec a|\,|\vec b|$,
          כי $|\cos\theta|\le1$. שוויון מתקיים בדיוק כש-$|\cos\theta|=1$, כלומר $\theta=0$ או $\theta=\pi$: הווקטורים
          באותו כיוון או בכיוונים הפוכים, ואחד מהם כפולה של השני.
      - kind: computation
        text: >-
          (ב) ברכיבים: $|a_1b_1+a_2b_2|\le\sqrt{a_1^2+a_2^2}\,\sqrt{b_1^2+b_2^2}$. שני האגפים אינם שליליים, ולכן אפשר
          להעלות בריבוע בלי לשנות את אי-השוויון: $(a_1b_1+a_2b_2)^2\le(a_1^2+a_2^2)(b_1^2+b_2^2)$. זו טענה על ארבעה
          מספרים כלשהם, בלי שום וקטור.
      - kind: step
        text: >-
          (ג1) $(\vec a+t\vec b)\cdot(\vec a+t\vec b)=|\vec a+t\vec b|^2$ הוא ריבוע האורך של הווקטור $\vec a+t\vec b$,
          וריבוע של אורך אינו שלילי.
      - kind: computation
        text: >-
          (ג2) לפי הפילוג, הוצאת מספר והחילופיות:
          $(\vec a+t\vec b)\cdot(\vec a+t\vec b)=|\vec b|^2\,t^2+2\,(\vec a\cdot\vec b)\,t+|\vec a|^2$. אם $\vec b=\vec0$
          אי-השוויון כבר הוכח ב-(א); אחרת המקדם של $t^2$ חיובי וזו פרבולה ב-$t$.
      - kind: computation
        text: >-
          (ג3) לפרבולה $At^2+Bt+C$ עם שני שורשים שונים יש בין השורשים ערכים שליליים (כש-$A>0$). הפרבולה שלנו אינה
          שלילית באף נקודה, ולכן אין לה שני שורשים שונים, כלומר הדיסקרימיננטה $B^2-4AC$ אינה חיובית:
          $4(\vec a\cdot\vec b)^2-4\,|\vec b|^2\,|\vec a|^2\le0$. מחלקים ב-4 ומעבירים אגף:
          $(\vec a\cdot\vec b)^2\le|\vec a|^2|\vec b|^2$, ואחרי שורש: $|\vec a\cdot\vec b|\le|\vec a|\,|\vec b|$.
      - kind: check
        text: >-
          במספרים: $\vec a=(1,2)$, $\vec b=(3,1)$. $(\vec a\cdot\vec b)^2=5^2=25$ ו-$|\vec a|^2|\vec b|^2=5\cdot10=50$,
          ואכן $25\le50$. ההפרש, 25, הוא בדיוק $(a_1b_2-a_2b_1)^2=(1-6)^2$: פתיחת סוגריים מראה שתמיד
          $(a_1^2+a_2^2)(b_1^2+b_2^2)-(a_1b_1+a_2b_2)^2=(a_1b_2-a_2b_1)^2\ge0$, הוכחה שלישית למקרה של המישור. ושוויון:
          $\vec a=(1,2)$, $\vec b=(-2,-4)=-2\vec a$ נותנים $(-10)^2=100=5\cdot20$.
      - kind: result
        text: >-
          $|\vec a\cdot\vec b|\le|\vec a|\,|\vec b|$, עם שוויון בדיוק כשאחד הווקטורים כפולה של השני. ברכיבים במישור:
          $(a_1b_1+a_2b_2)^2\le(a_1^2+a_2^2)(b_1^2+b_2^2)$. בהוכחה השנייה אי-השוויון הוא התנאי שהדיסקרימיננטה של
          $|\vec a+t\vec b|^2$ אינה חיובית.
