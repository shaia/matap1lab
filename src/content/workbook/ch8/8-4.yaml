# Workbook of lesson 8.4 — numerical integration: the trapezoid rule and Simpson's rule.
# Objectives (src/course.ts):
#   OBJ-8.4-1  approximate an integral by the trapezoid rule and by Simpson's rule
#   OBJ-8.4-2  compare the errors of the methods when the number of subintervals doubles
#   OBJ-8.4-3  choose a method and a number of subintervals for a given accuracy
# Notation: h=(b-a)/n, f_i=f(a+ih); T_n the trapezoid sum, S_n the Simpson sum (n even); E = rule - exact.
# Every number recomputed with sympy / mpmath in screens/tools/lesson-8-4.py.
lesson: '8.4'
practice:
  - id: W-8.4-01
    level: basic
    objectives: [OBJ-8.4-1]
    prompt: >-
      קרבו את $\int_0^4\sqrt x\,dx$ בכלל הטרפז עם $n=4$. לפני החישוב, נבאו: האם הקירוב יהיה גדול מהערך המדויק או
      קטן ממנו? השוו לערך המדויק $\frac{16}{3}$.
    answer: >-
      $T_4=2+\sqrt2+\sqrt3\approx5.1463$, קטן מ-$\frac{16}{3}\approx5.3333$ (השגיאה $T_4-\frac{16}{3}\approx-0.187$), כי $\sqrt x$ קעורה.
    solution:
      - kind: idea
        text: >-
          הכיוון נקבע לפי הסימן של $f''$: בפונקציה קעורה המיתרים מתחת לגרף. אחר כך מתכון הטרפז: טבלה, משקלים
          $1,2,2,2,1$, וכפל ב-$\frac h2$.
      - kind: step
        text: >-
          $f''(x)=-\frac14x^{-3/2}<0$ לכל $x>0$: $\sqrt x$ קעורה, כל מיתר מתחת לגרף, ולכן צפוי $T_4<\frac{16}{3}$.
      - kind: computation
        text: >-
          $h=\frac{4-0}{4}=1$, הנקודות $0,1,2,3,4$, והערכים $0,\ 1,\ \sqrt2,\ \sqrt3,\ 2$.
      - kind: computation
        text: >-
          $T_4=\frac12\left(0+2\cdot1+2\sqrt2+2\sqrt3+2\right)=2+\sqrt2+\sqrt3\approx5.1463$.
      - kind: check
        text: >-
          $\int_0^4x^{1/2}\,dx=\frac23x^{3/2}\Big|_0^4=\frac23\cdot8=\frac{16}{3}\approx5.3333$, והשגיאה
          $T_4-\frac{16}{3}\approx-0.187$: שלילית, כמו שניבאנו. (חסם השגיאה של הטרפז לא חל כאן: $|f''|$ לא חסומה ליד
          0, ולכן אין $M_2$. הכלל עדיין עובד, רק בלי הבטחה.)
      - kind: result
        text: >-
          $T_4=2+\sqrt2+\sqrt3\approx5.1463<\frac{16}{3}$.

  - id: W-8.4-02
    level: basic
    objectives: [OBJ-8.4-1]
    prompt: >-
      קרבו את $\int_0^2x^4\,dx$ בכלל סימפסון עם $n=4$, ומצאו את השגיאה. השוו אותה לחסם
      $\frac{(b-a)^5M_4}{180n^4}$.
    answer: >-
      $S_4=\frac{77}{12}\approx6.4167$; השגיאה $\frac{1}{60}$, שווה בדיוק לחסם.
    solution:
      - kind: idea
        text: >-
          מתכון סימפסון: $h$, טבלה של חמישה ערכים, משקלים $1,4,2,4,1$, וכפל ב-$\frac h3$. סימפסון מדויק רק עד
          מעלה 3, ולכן ל-$x^4$ צפויה שגיאה.
      - kind: computation
        text: >-
          $h=\frac12$, הנקודות $0,\frac12,1,\frac32,2$, והערכים $0,\ \frac1{16},\ 1,\ \frac{81}{16},\ 16$.
      - kind: computation
        text: >-
          $0+4\cdot\frac1{16}+2\cdot1+4\cdot\frac{81}{16}+16=\frac14+2+\frac{81}{4}+16=38.5$, ו-$S_4=\frac16\cdot38.5=\frac{77}{12}\approx6.4167$.
      - kind: computation
        text: >-
          הערך המדויק $\frac{x^5}{5}\Big|_0^2=\frac{32}{5}=6.4$, והשגיאה $\frac{77}{12}-\frac{32}{5}=\frac{385-384}{60}=\frac1{60}\approx0.0167$.
      - kind: computation
        text: >-
          החסם: $f^{(4)}=24$ קבועה, $M_4=24$, ו-$\frac{2^5\cdot24}{180\cdot4^4}=\frac{768}{46080}=\frac1{60}$.
      - kind: check
        text: >-
          השגיאה חיובית ושווה בדיוק לחסם. אין סתירה: החסם אומר רק "לא יותר מ-". כש-$f^{(4)}$ קבועה, המקרה הגרוע הוא
          המקרה היחיד, והחסם מושג.
      - kind: result
        text: >-
          $S_4=\frac{77}{12}$, שגיאה $\frac1{60}$, בדיוק החסם.

  - id: W-8.4-03
    level: basic
    qualitative: true
    objectives: [OBJ-8.4-1]
    prompt: >-
      את הקטע $[0,3]$ מחלקים ל-$n=6$ קטעים.

      (א) מה $h$, ומהן נקודות החלוקה?

      (ב) כתבו את המשקלים של כל אחד משבעת הערכים בכלל הטרפז ובכלל סימפסון, ואת הגורם שלפני הסוגריים.

      (ג) באילו נקודות המשקל בסימפסון הוא 4?

      (ד) האם אפשר להפעיל סימפסון על אותו קטע עם $n=5$? ומה צריך להיות סכום המשקלים, כפול הגורם?
    answer: >-
      (א) $h=\frac12$; $0,\frac12,1,\frac32,2,\frac52,3$. (ב) טרפז: $1,2,2,2,2,2,1$ עם $\frac14$; סימפסון:
      $1,4,2,4,2,4,1$ עם $\frac16$. (ג) $x=\frac12,\frac32,\frac52$. (ד) לא, $n$ חייב להיות זוגי; הסכום כפול הגורם הוא
      $b-a=3$.
    solution:
      - kind: idea
        text: >-
          בטרפז כל נקודה פנימית שייכת לשני טרפזים. בסימפסון הקטעים בזוגות: האמצע של כל זוג במשקל 4, הנקודה שבין שני
          זוגות במשקל 2.
      - kind: computation
        text: >-
          (א) $h=\frac{3-0}{6}=\frac12$, ו-$x_i=\frac i2$: $0,\frac12,1,\frac32,2,\frac52,3$.
      - kind: step
        text: >-
          (ב) טרפז: $T_6=\frac h2(f_0+2f_1+\dots+2f_5+f_6)$, גורם $\frac14$ ומשקלים $1,2,2,2,2,2,1$. סימפסון:
          $S_6=\frac h3(f_0+4f_1+2f_2+4f_3+2f_4+4f_5+f_6)$, גורם $\frac16$.
      - kind: step
        text: >-
          (ג) משקל 4 לאינדקסים האי-זוגיים $i=1,3,5$, כלומר לנקודות $\frac12,\frac32,\frac52$: האמצעים של הזוגות
          $[0,1]$, $[1,2]$, $[2,3]$.
      - kind: step
        text: >-
          (ד) עם $n=5$ אי אפשר לחלק את הקטעים לזוגות, ולכן סימפסון אינו מוגדר.
      - kind: check
        text: >-
          לפונקציה $f=1$ כל כלל חייב לתת $\int_0^31\,dx=3$. טרפז: $\frac14(1+2\cdot5+1)=\frac{12}{4}=3$ ✓. סימפסון:
          $\frac16(1+4+2+4+2+4+1)=\frac{18}{6}=3$ ✓. בדיקה מהירה של משקלים בכל חישוב.
      - kind: result
        text: >-
          $h=\frac12$; טרפז $\frac14(1,2,2,2,2,2,1)$; סימפסון $\frac16(1,4,2,4,2,4,1)$, משקל 4 ב-$\frac12,\frac32,\frac52$; עם
          $n=5$ סימפסון אינו אפשרי.

  - id: W-8.4-04
    level: mid
    objectives: [OBJ-8.4-1]
    prompt: >-
      ההספק של לוח סולארי, בקילוואט, נמדד כל שעה בין 6:00 ל-18:00:

      $0,\ 0.5,\ 1.3,\ 2.2,\ 2.9,\ 3.3,\ 3.4,\ 3.1,\ 2.5,\ 1.8,\ 1.0,\ 0.3,\ 0$.

      האנרגיה, בקילוואט-שעה, היא האינטגרל של ההספק לפי הזמן בשעות. העריכו אותה בכלל הטרפז ובכלל סימפסון.
    answer: >-
      טרפז $22.3$, סימפסון $\frac{67}{3}\approx22.33$ קילוואט-שעה.
    solution:
      - kind: idea
        text: >-
          13 מדידות במרווח $h=1$ שעה הן 12 קטעים, מספר זוגי: שני הכללים אפשריים. מחשבים קודם את שני הסכומים
          החלקיים, של האינדקסים האי-זוגיים ושל הזוגיים שבפנים, ומהם את שני הכללים.
      - kind: computation
        text: >-
          אינדקסים אי-זוגיים ($i=1,3,\dots,11$): $0.5+2.2+3.3+3.1+1.8+0.3=11.2$. זוגיים בפנים ($i=2,4,\dots,10$):
          $1.3+2.9+3.4+2.5+1.0=11.1$. הקצוות: $0+0$.
      - kind: computation
        text: >-
          טרפז: $T_{12}=\frac12\bigl(0+2(11.2+11.1)+0\bigr)=22.3$.
      - kind: computation
        text: >-
          סימפסון: $S_{12}=\frac13\bigl(0+4\cdot11.2+2\cdot11.1+0\bigr)=\frac13(44.8+22.2)=\frac{67}{3}\approx22.33$.
      - kind: check
        text: >-
          סדר גודל: ההספק בין 0 ל-$3.4$, ולכן האנרגיה בין 0 ל-$3.4\cdot12=40.8$, וההספק הממוצע
          $\frac{22.3}{12}\approx1.9$ קילוואט סביר לגרף שעולה מ-0 ל-$3.4$ ויורד חזרה. ושני הקירובים קרובים זה לזה,
          ההפרש $0.03$: סימן טוב שהמדידות צפופות מספיק.
      - kind: result
        text: >-
          כ-$22.3$ קילוואט-שעה (טרפז $22.3$, סימפסון $22.33$).

  - id: W-8.4-05
    level: mid
    objectives: [OBJ-8.4-2, OBJ-8.4-3]
    prompt: >-
      (א) בכלל הטרפז, השגיאה בחישוב אינטגרל של פונקציה חלקה עם $n=5$ היא בערך $0.012$. בערך איזה $n$ ייתן שגיאה של
      כ-$3\cdot10^{-4}$?

      (ב) בכלל סימפסון, השגיאה באינטגרל אחר עם $n=4$ היא בערך $2\cdot10^{-3}$. מה ה-$n$ הקטן ביותר שצפוי לתת שגיאה של
      לכל היותר $10^{-6}$?
    answer: >-
      (א) $n\approx5\sqrt{40}\approx32$. (ב) $n=28$.
    solution:
      - kind: idea
        text: >-
          בטרפז $|E|\approx\frac{C}{n^2}$: אם $n$ גדל פי $k$, השגיאה קטנה פי $k^2$. בסימפסון $|E|\approx\frac{C}{n^4}$,
          והשגיאה קטנה פי $k^4$. זו התנהגות, לא הבטחה: התוצאה היא הערכה.
      - kind: computation
        text: >-
          (א) צריך להקטין את השגיאה פי $\frac{0.012}{3\cdot10^{-4}}=40$, ולכן $k^2=40$, $k=\sqrt{40}\approx6.32$, ו-$n\approx5\cdot6.32\approx31.6$.
          עם $n=32$: $0.012\cdot\left(\frac5{32}\right)^2\approx2.9\cdot10^{-4}$.
      - kind: computation
        text: >-
          (ב) צריך להקטין פי $\frac{2\cdot10^{-3}}{10^{-6}}=2000$, ולכן $k^4=2000$, $k\approx6.69$, ו-$n\approx4\cdot6.69\approx26.7$.
      - kind: step
        text: >-
          מעגלים למעלה ולזוגי: $n=27$ אי-זוגי, ולכן $n=28$. בדיקה: $2\cdot10^{-3}\left(\frac4{28}\right)^4\approx8.3\cdot10^{-7}\le10^{-6}$,
          ואילו $n=26$ נותן $\approx1.12\cdot10^{-6}$, מעט יותר מדי.
      - kind: check
        text: >-
          (א) מגיעים ל-32 גם בהכפלות: $5\to10\to20\to40$ מחלקות ב-$4,16,64$, ו-40 קטעים נותנים כ-$\frac{0.012}{64}\approx1.9\cdot10^{-4}$:
          32 בין 20 ל-40, כמו שצריך.
      - kind: result
        text: >-
          (א) כ-32 קטעים. (ב) $n=28$.

  - id: W-8.4-06
    level: mid
    qualitative: true
    objectives: [OBJ-8.4-2]
    prompt: >-
      שתי שיטות, A ו-B, חישבו את $\int_0^1e^x\,dx=e-1$. השגיאות (הקירוב פחות הערך המדויק):

      שיטה A, עם $n=2,4,8$: $5.79\cdot10^{-4}$, $3.70\cdot10^{-5}$, $2.33\cdot10^{-6}$.

      שיטה B, עם אותם $n$: מינוס $0.394$, מינוס $0.206$, מינוס $0.105$.

      (א) זהו כל שיטה: סכום רימן שמאלי, כלל הטרפז או כלל סימפסון? (ב) נבאו את השגיאה של כל אחת עם $n=16$. (ג) הסבירו
      את הסימן של השגיאות של B.
    answer: >-
      (א) A סימפסון (פי 16), B סכום שמאלי (פי 2). (ב) A כ-$1.5\cdot10^{-7}$, B כמינוס $0.053$. (ג) $e^x$ עולה, והסכום
      השמאלי לוקח בכל קטע את הערך הנמוך.
    solution:
      - kind: idea
        text: >-
          מחלקים כל שגיאה בבאה אחריה. היחס חושף את החזקה של $n$: 2 לסכום רימן, 4 לטרפז, 16 לסימפסון.
      - kind: computation
        text: >-
          (א) A: $\frac{5.79\cdot10^{-4}}{3.70\cdot10^{-5}}\approx15.6$ ו-$\frac{3.70\cdot10^{-5}}{2.33\cdot10^{-6}}\approx15.9$: פי 16,
          סימפסון. B: $\frac{0.394}{0.206}\approx1.9$ ו-$\frac{0.206}{0.105}\approx2.0$: פי 2, סכום רימן.
      - kind: computation
        text: >-
          (ב) A: $\frac{2.33\cdot10^{-6}}{16}\approx1.5\cdot10^{-7}$. B: $\frac{-0.105}{2}\approx-0.053$.
      - kind: step
        text: >-
          (ג) $e^x$ עולה, ולכן בכל קטע הקצה השמאלי הוא הערך הנמוך ביותר בו: כל מלבן מתחת לגרף, והסכום קטן מהאינטגרל
          (שיעור 8.1). אילו B היה הטרפז, השגיאה הייתה חיובית, כי $e^x$ קמורה.
      - kind: check
        text: >-
          חישוב ישיר: השגיאה של $S_{16}$ בערך $1.46\cdot10^{-7}$ ושל הסכום השמאלי עם 16 קטעים בערך מינוס $0.0531$, קרוב
          לניבויים. (ולשם השוואה, הטרפז עם $n=4$ טועה ב-$0.0089$: לא A ולא B.)
      - kind: result
        text: >-
          A סימפסון, B סכום רימן שמאלי; עם $n=16$ בערך $1.5\cdot10^{-7}$ ומינוס $0.053$.

  - id: W-8.4-07
    level: mid
    objectives: [OBJ-8.4-3]
    prompt: >-
      כמה קטעים צריך, לפי חסם השגיאה, כדי לחשב את $\int_1^4\sqrt x\,dx$ בכלל הטרפז בשגיאה של לכל היותר $10^{-3}$?
    answer: >-
      $n=24$.
    solution:
      - kind: idea
        text: >-
          מתכון: $f''$, המקסימום של $|f''|$ בקטע, "חסם $\le\varepsilon$", ועיגול למעלה.
      - kind: computation
        text: >-
          $f'(x)=\frac12x^{-1/2}$, $f''(x)=-\frac14x^{-3/2}$. $|f''|=\frac{1}{4x^{3/2}}$ יורדת, ולכן המקסימום ב-$[1,4]$
          בקצה השמאלי: $M_2=\frac14$.
      - kind: computation
        text: >-
          $b-a=3$: $\frac{27\cdot\frac14}{12n^2}\le10^{-3}$, כלומר $n^2\ge\frac{27}{48}\cdot10^3=562.5$ ו-$n\ge23.72$.
      - kind: step
        text: >-
          מעגלים למעלה: $n=24$.
      - kind: check
        text: >-
          $n=24$: $\frac{27}{4\cdot12\cdot576}=\frac1{1024}\approx9.8\cdot10^{-4}\le10^{-3}$ ✓; $n=23$: $\approx1.06\cdot10^{-3}$, לא מספיק.
          והשגיאה בפועל: $T_{24}-\frac{14}{3}\approx-3.3\cdot10^{-4}$, כש-$\int_1^4\sqrt x\,dx=\frac23(8-1)=\frac{14}{3}$.
      - kind: result
        text: >-
          $n=24$.

  - id: W-8.4-08
    level: exam
    objectives: [OBJ-8.4-3]
    prompt: >-
      ל-$e^{x^2}$ אין פונקציה קדומה בנוסחה. רוצים את $\int_0^1e^{x^2}\,dx$ בשגיאה של לכל היותר $10^{-6}$.

      (א) חשבו את $f''$ ואת $f^{(4)}$, ומצאו את $M_2$ ואת $M_4$ בקטע $[0,1]$.

      (ב) כמה קטעים מבטיח החסם של הטרפז, וכמה של סימפסון?

      (ג) באיזו שיטה תבחרו, ולמה?
    answer: >-
      (א) $f''=(2+4x^2)e^{x^2}$, $f^{(4)}=(12+48x^2+16x^4)e^{x^2}$; $M_2=6e$, $M_4=76e$. (ב) טרפז 1166, סימפסון 34.
      (ג) סימפסון.
    solution:
      - kind: idea
        text: >-
          גוזרים ארבע פעמים בכלל המכפלה ובכלל השרשרת. כל הנגזרות הן פולינום עם מקדמים חיוביים כפול $e^{x^2}$, ולכן
          עולות ב-$[0,1]$: המקסימום בקצה הימני. אחר כך המתכון של בחירת $n$.
      - kind: computation
        text: >-
          (א) $f'=2xe^{x^2}$; $f''=2e^{x^2}+2x\cdot2xe^{x^2}=(2+4x^2)e^{x^2}$;
          $f'''=8xe^{x^2}+(2+4x^2)2xe^{x^2}=(12x+8x^3)e^{x^2}$;
          $f^{(4)}=(12+24x^2)e^{x^2}+(12x+8x^3)2xe^{x^2}=(12+48x^2+16x^4)e^{x^2}$.
      - kind: step
        text: >-
          ב-$[0,1]$ כל גורם חיובי ועולה, ולכן גם המכפלה: $M_2=f''(1)=6e\approx16.31$ ו-$M_4=f^{(4)}(1)=76e\approx206.6$.
      - kind: computation
        text: >-
          (ב) טרפז: $\frac{6e}{12n^2}\le10^{-6}$, כלומר $n^2\ge\frac e2\cdot10^6\approx1{,}359{,}141$ ו-$n\ge1165.8$: $n=1166$.
      - kind: computation
        text: >-
          סימפסון: $\frac{76e}{180n^4}\le10^{-6}$, כלומר $n^4\ge\frac{76e}{180}\cdot10^6\approx1{,}147{,}719$ ו-$n\ge32.73$.
          33 אי-זוגי, ולכן $n=34$.
      - kind: check
        text: >-
          החסם של סימפסון ב-34 בערך $8.6\cdot10^{-7}\le10^{-6}$ ✓, וב-32 בערך $1.09\cdot10^{-6}$, לא מספיק. והשגיאה
          בפועל של $S_{34}$, מול הערך $1.4626517459$ שמחושב במחשב בדיוק רב, בערך $2.3\cdot10^{-7}$.
      - kind: step
        text: >-
          (ג) סימפסון: 35 ערכים של $e^{x^2}$ במקום 1167, לאותה הבטחה. הפונקציה חלקה, ולכן החסם של סימפסון חל.
      - kind: result
        text: >-
          $M_2=6e$, $M_4=76e$; טרפז $n=1166$, סימפסון $n=34$; בוחרים בסימפסון.

  - id: W-8.4-09
    level: exam
    qualitative: true
    objectives: [OBJ-8.4-1, OBJ-8.4-3]
    prompt: >-
      המהירות של עגלה נמדדה כל חצי שנייה, 10 פעמים, מ-$t=0$ עד $t=4.5$ שניות (במטר לשנייה):

      $0,\ 1.2,\ 2.1,\ 2.7,\ 3.0,\ 3.1,\ 3.0,\ 2.6,\ 2.0,\ 1.2$.

      (א) סטודנטית רוצה להפעיל כלל סימפסון על כל עשר המדידות. הסבירו למה אי אפשר.

      (ב) העריכו את הדרך בכלל הטרפז על כל המדידות.

      (ג) העריכו אותה בסימפסון על 8 הקטעים הראשונים, ועוד טרפז על הקטע האחרון.

      (ד) לאיזו הערכה הייתם סומכים יותר? האם אפשר להשתמש כאן בחסם השגיאה?
    answer: >-
      (א) 10 נקודות הן 9 קטעים, אי-זוגי. (ב) $10.15$ מטר. (ג) $\frac{283}{30}+0.8=\frac{307}{30}\approx10.23$ מטר. (ד)
      בשנייה, אבל בלי הבטחה: אין נוסחה, ולכן אין $M_2$ או $M_4$.
    solution:
      - kind: idea
        text: >-
          סימפסון עובד על זוגות של קטעים. כשמספר הקטעים אי-זוגי, מפעילים אותו על החלק שמתחלק לזוגות, ואת הקטע
          שנשאר מחשבים בטרפז. שטחים על קטעים צמודים מתחברים.
      - kind: step
        text: >-
          (א) 10 מדידות הן $n=9$ קטעים ברוחב $h=0.5$. 9 אי-זוגי: אי אפשר לחלק את הקטעים לזוגות, ולכן אין "פרבולה" לקטע
          האחרון.
      - kind: computation
        text: >-
          (ב) הנקודות הפנימיות: $1.2+2.1+2.7+3.0+3.1+3.0+2.6+2.0=19.7$. $T_9=\frac{0.5}{2}\left(0+2\cdot19.7+1.2\right)=\frac14\cdot40.6=10.15$.
      - kind: computation
        text: >-
          (ג) סימפסון על $[0,4]$, 9 נקודות: $0+4(1.2+2.7+3.1+2.6)+2(2.1+3.0+3.0)+2.0=38.4+16.2+2.0=56.6$, ו-$S_8=\frac{0.5}{3}\cdot56.6=\frac{283}{30}\approx9.433$.
          טרפז על $[4,4.5]$: $\frac{0.5}{2}(2.0+1.2)=0.8$. ביחד $\frac{283}{30}+0.8=\frac{307}{30}\approx10.23$.
      - kind: step
        text: >-
          (ד) בהערכה של (ג): רוב הקטע מחושב בכלל שהשגיאה שלו קטנה כמו $h^4$, בתנאי שהמהירות משתנה בצורה חלקה. אבל חסם
          השגיאה דורש את $M_2$ או את $M_4$, ומטבלה אי אפשר לדעת אותם: אין הבטחה, רק הערכה.
      - kind: check
        text: >-
          המהירות עולה עד $t=2.5$ ויורדת אחר כך, והגרף נראה קעור, ולכן הטרפז צפוי להעריך בחסר: ואכן $10.15<10.23$.
          וסדר גודל: המהירות הגדולה ביותר $3.1$, ולכן הדרך פחות מ-$3.1\cdot4.5\approx14$.
      - kind: result
        text: >-
          (א) 9 קטעים, אי-זוגי. (ב) $10.15$ מטר. (ג) כ-$10.23$ מטר. (ד) ב-(ג), בלי חסם.

  - id: W-8.4-10
    level: exam
    objectives: [OBJ-8.4-1, OBJ-8.4-3]
    prompt: >-
      נתון $I=\int_0^1\sqrt{1+x}\,dx$.

      (א) קרבו את $I$ בכלל סימפסון עם $n=4$ (שש ספרות אחרי הנקודה).

      (ב) בעזרת החסם $|E_S|\le\frac{(b-a)^5M_4}{180n^4}$, הראו שהשגיאה קטנה מ-$10^{-4}$.

      (ג) חשבו את $I$ במדויק, ובדקו.
    answer: >-
      (א) $S_4\approx1.218945$. (ב) $M_4=\frac{15}{16}$, החסם $\frac1{49152}\approx2.03\cdot10^{-5}$. (ג)
      $I=\frac23\left(2\sqrt2-1\right)\approx1.218951$, השגיאה $S_4-I\approx-6.3\cdot10^{-6}$.
    solution:
      - kind: idea
        text: >-
          טבלה של חמישה ערכים ומשקלים $1,4,2,4,1$. לחסם גוזרים ארבע פעמים; $|f^{(4)}|$ יורדת, ולכן המקסימום בקצה
          השמאלי.
      - kind: computation
        text: >-
          (א) $h=\frac14$. הערכים: $f_0=1$, $f_1=\sqrt{1.25}\approx1.118034$, $f_2=\sqrt{1.5}\approx1.224745$,
          $f_3=\sqrt{1.75}\approx1.322876$, $f_4=\sqrt2\approx1.414214$.
      - kind: computation
        text: >-
          $1+4(1.118034+1.322876)+2\cdot1.224745+1.414214\approx14.627344$, ו-$S_4=\frac1{12}\cdot14.627344\approx1.218945$.
      - kind: computation
        text: >-
          (ב) $f'=\frac12(1+x)^{-1/2}$, $f''=-\frac14(1+x)^{-3/2}$, $f'''=\frac38(1+x)^{-5/2}$,
          $f^{(4)}=-\frac{15}{16}(1+x)^{-7/2}$. $|f^{(4)}|$ יורדת, ולכן $M_4=|f^{(4)}(0)|=\frac{15}{16}$.
      - kind: computation
        text: >-
          $|E_S|\le\frac{1\cdot\frac{15}{16}}{180\cdot4^4}=\frac{15}{737280}=\frac1{49152}\approx2.03\cdot10^{-5}<10^{-4}$.
      - kind: computation
        text: >-
          (ג) $\int_0^1(1+x)^{1/2}\,dx=\frac23(1+x)^{3/2}\Big|_0^1=\frac23\left(2\sqrt2-1\right)\approx1.218951$.
      - kind: check
        text: >-
          $S_4-I\approx-6.3\cdot10^{-6}$: בגודלו פחות מהחסם $2.03\cdot10^{-5}$ ✓. (לשם השוואה, $T_4\approx1.218190$
          טועה ב-$7.6\cdot10^{-4}$, פי 120 בערך.)
      - kind: result
        text: >-
          $S_4\approx1.218945$, השגיאה מובטחת קטנה מ-$2.1\cdot10^{-5}$, והשגיאה בפועל כ-$6.3\cdot10^{-6}$.

challenge:
  - id: W-8.4-c1
    stars: 1
    objectives: [OBJ-8.4-1, OBJ-8.4-3]
    prompt: >-
      מודדת קרקע רוצה את השטח של מגרש. צד אחד שלו ישר, לאורך ציר $x$, מ-0 עד 1000 מטר, והצד שמולו עקום. כל 100 מטר
      לאורך הציר היא מדדה את הרוחב $y$ של המגרש, במטרים. ב-$x=0,100,200,\dots,1000$ הרוחבים הם:

      $125,\ 125,\ 120,\ 112,\ 90,\ 90,\ 95,\ 88,\ 75,\ 35,\ 0$.

      (א) העריכו את השטח בכלל הטרפז.

      (ב) האם אפשר להשתמש כאן בכלל סימפסון? אם כן, העריכו בו.

      (ג) בכמה אחוזים נבדלות שתי ההערכות, ומה אפשר ללמוד מזה?
    answer: >-
      (א) $89{,}250$ מ״ר. (ב) כן, $n=10$ זוגי: $89{,}500$ מ״ר. (ג) כ-$0.3\%$.
    solution:
      - kind: idea
        text: >-
          השטח הוא $\int_0^{1000}y\,dx$, ו-$y$ נתונה רק כטבלה במרווחים שווים $h=100$. 11 מדידות הן 10 קטעים, מספר
          זוגי, ולכן גם סימפסון אפשרי.
      - kind: computation
        text: >-
          (א) הנקודות הפנימיות: $125+120+112+90+90+95+88+75+35=830$. $T_{10}=\frac{100}{2}\left(125+2\cdot830+0\right)=50\cdot1785=89{,}250$.
      - kind: computation
        text: >-
          (ב) אינדקסים אי-זוגיים: $125+112+90+88+35=450$; זוגיים בפנים: $120+90+95+75=380$.
          $S_{10}=\frac{100}{3}\left(125+4\cdot450+2\cdot380+0\right)=\frac{100}{3}\cdot2685=89{,}500$.
      - kind: step
        text: >-
          (ג) ההפרש 250 מ״ר, כ-$\frac{250}{89{,}500}\approx0.28\%$. כששתי שיטות שונות על אותם נתונים מסכימות כל כך,
          כנראה שהמדידות צפופות מספיק. זו ראיה, לא הוכחה: בין שתי מדידות הגבול יכול לעשות דברים שאף מדידה לא תפסה.
      - kind: check
        text: >-
          סדר גודל: הרוחב בין 0 ל-125, ולכן השטח פחות מ-$125\cdot1000=125{,}000$; ובדיקת משקלים: בטרפז סכום המשקלים
          כפול $\frac h2$ הוא $20\cdot50=1000$, ובסימפסון $30\cdot\frac{100}{3}=1000$, אורך הקטע ✓.
      - kind: result
        text: >-
          כ-$89{,}000$ מ״ר: טרפז $89{,}250$, סימפסון $89{,}500$.
    source:
      name: 'G. Strang, E. Herman, Calculus Volume 2 (OpenStax), Section 3.6 Numerical Integration'
      year: 2016
      problem: 'Section 3.6, Exercise 343 (the area of a lot); part (b) with Simpson''s rule and part (c) added'
      url: https://openstax.org/books/calculus-volume-2/pages/3-6-numerical-integration
      verified: '2026-11-27'
      adapted: true

  - id: W-8.4-c2
    stars: 1
    objectives: [OBJ-8.4-1, OBJ-8.4-2]
    prompt: >-
      מחפשים כלל מהצורה $\int_0^1f(x)\,dx\approx A\,f(0)+B\,f\left(\tfrac12\right)+C\,f(1)$.

      (א) מצאו $A,B,C$ כך שהכלל יהיה מדויק לשלוש הפונקציות $f=1$, $f=x$, $f=x^2$. איזה כלל קיבלתם?

      (ב) הראו שהכלל מדויק גם ל-$f=x^3$, אבל לא ל-$f=x^4$.

      (ג) לפונקציה חלקה, השגיאה של הכלל היא בקירוב $c\,\bigl(f'''(1)-f'''(0)\bigr)$ עם קבוע $c$. מצאו את $c$ מתוך
      $f=x^4$, שעבורה הקירוב הזה מדויק.
    answer: >-
      (א) $A=C=\frac16$, $B=\frac23$: כלל סימפסון עם $n=2$. (ב) ל-$x^3$ שני האגפים $\frac14$; ל-$x^4$ הכלל נותן
      $\frac5{24}$ ולא $\frac15$. (ג) $c=\frac1{2880}$.
    solution:
      - kind: idea
        text: >-
          "מדויק ל-$f$" הוא משוואה לינארית ב-$A,B,C$. שלוש פונקציות נותנות שלוש משוואות בשלושה נעלמים. אחר כך
          בודקים חזקות גבוהות יותר אחת אחת.
      - kind: computation
        text: >-
          (א) $f=1$: $A+B+C=1$. $f=x$: $\frac B2+C=\frac12$. $f=x^2$: $\frac B4+C=\frac13$. מחסירים את השלישית
          מהשנייה: $\frac B4=\frac16$, כלומר $B=\frac23$; אז $C=\frac12-\frac13=\frac16$, ו-$A=1-\frac23-\frac16=\frac16$.
      - kind: step
        text: >-
          הכלל $\frac16\left(f(0)+4f\left(\frac12\right)+f(1)\right)$ הוא כלל סימפסון על $[0,1]$ עם $n=2$: $h=\frac12$
          ו-$\frac h3=\frac16$.
      - kind: computation
        text: >-
          (ב) $f=x^3$: $\frac16\left(0+4\cdot\frac18+1\right)=\frac16\cdot\frac32=\frac14=\int_0^1x^3\,dx$ ✓.
          $f=x^4$: $\frac16\left(0+4\cdot\frac1{16}+1\right)=\frac16\cdot\frac54=\frac5{24}$, ואילו $\int_0^1x^4\,dx=\frac15$.
      - kind: computation
        text: >-
          (ג) השגיאה ל-$x^4$: $\frac5{24}-\frac15=\frac{25-24}{120}=\frac1{120}$. ו-$f'''=24x$, ולכן
          $f'''(1)-f'''(0)=24$. מ-$c\cdot24=\frac1{120}$: $c=\frac1{2880}$.
      - kind: check
        text: >-
          (א) פרבולה אחת: הפולינום $4x^2+2x+1$ מקבל את הערכים $1,3,7$ ב-$0,\frac12,1$, והכלל נותן
          $\frac16(1+12+7)=\frac{10}3$, בדיוק $\int_0^1\left(4x^2+2x+1\right)dx=\frac43+1+1=\frac{10}{3}$ ✓. (ג) השגיאה
          חיובית ל-$x^4$, כמו $S_2-\frac25=\frac23-\frac25>0$ בשיעור על $[-1,1]$.
      - kind: result
        text: >-
          $A=C=\frac16$, $B=\frac23$ (כלל סימפסון); מדויק עד $x^3$, לא ל-$x^4$; $c=\frac1{2880}$.
    source:
      name: 'Gilbert Strang, Calculus (MIT OpenCourseWare RES.18-001), Section 5.8 Numerical Integration'
      year: 1991
      problem: 'Section 5.8, Problems 19 and 26 (part (b) added; the error constant with interval length 1)'
      url: https://www.ocw.mit.edu/courses/res-18-001-calculus-fall-2023/mitres_18_001_f17_ch05.pdf
      verified: '2026-11-27'
      adapted: true
