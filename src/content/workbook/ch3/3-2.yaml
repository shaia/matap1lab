# Workbook of lesson 3.2 — the Gauss plane: modulus, argument and conjugate.
# Objectives (src/course.ts):
#   OBJ-3.2-1  a complex number as a point and a vector in the Gauss plane; addition as vector addition
#   OBJ-3.2-2  modulus and argument, the principal argument in the right quadrant
#   OBJ-3.2-3  sets in the Gauss plane given by a condition on the modulus or the argument
# Convention: Arg z in (-π, π].
# Every number recomputed with sympy in screens/tools/lesson-3-2.py.
lesson: '3.2'
practice:
  - id: W-3.2-01
    level: basic
    objectives: [OBJ-3.2-1]
    prompt: >-
      שלושה קודקודים של מקבילית $ABCD$, לפי הסדר, הם $A=1+i$, $B=4+2i$ ו-$C=2+5i$.

      (א) מצאו את הקודקוד הרביעי $D$.

      (ב) מצאו את אורכי הצלעות $AB$ ו-$BC$, ואת מרכז המקבילית (נקודת המפגש של האלכסונים).
    answer: >-
      (א) $D=-1+4i$. (ב) $|AB|=\sqrt{10}$, $|BC|=\sqrt{13}$; המרכז $\frac32+3i$.
    solution:
      - kind: idea
        text: >-
          במקבילית $ABCD$ הצלע $AD$ היא אותו חץ כמו הצלע $BC$: אותו אורך ואותו כיוון. חץ מנקודה לנקודה הוא הפרש של
          מספרים מרוכבים, ולכן $D-A=C-B$. אורך צלע הוא ערך מוחלט של הפרש, כלומר מרחק.
      - kind: computation
        text: >-
          (א) $D=A+(C-B)=(1+i)+(-2+3i)=-1+4i$.
      - kind: computation
        text: >-
          (ב) $B-A=3+i$, ולכן $|AB|=\sqrt{9+1}=\sqrt{10}\approx3.16$. $C-B=-2+3i$, ולכן $|BC|=\sqrt{4+9}=\sqrt{13}\approx3.61$.
      - kind: step
        text: >-
          האלכסונים של מקבילית חוצים זה את זה, ולכן המרכז הוא אמצע האלכסון $AC$: $\frac{A+C}{2}=\frac{3+6i}{2}=\frac32+3i$.
      - kind: check
        text: >-
          גם אמצע האלכסון השני צריך לצאת אותו דבר: $\frac{B+D}{2}=\frac{(4+2i)+(-1+4i)}{2}=\frac{3+6i}{2}$. ובשרטוט: $D$
          נמצאת ב-$(-1,4)$, שמאלה ולמעלה מ-$A$, בדיוק כמו ש-$C$ שמאלה ולמעלה מ-$B$.
      - kind: result
        text: >-
          $D=-1+4i$; הצלעות $\sqrt{10}$ ו-$\sqrt{13}$; המרכז $\frac32+3i$.

  - id: W-3.2-02
    level: basic
    objectives: [OBJ-3.2-2]
    prompt: >-
      מצאו את $|z|$ ואת $\operatorname{Arg}z$ לכל אחד מהמספרים. לפני כל חישוב אמרו באיזה רביע, או על איזה ציר, המספר
      נמצא.

      $$5-5i,\qquad -6,\qquad -2\sqrt3+2i,\qquad -7i,\qquad -1-2i$$
    answer: >-
      $5\sqrt2$ ו-$-\frac{\pi}{4}$; $6$ ו-$\pi$; $4$ ו-$\frac{5\pi}{6}$; $7$ ו-$-\frac{\pi}{2}$; $\sqrt5$
      ו-$\arctan2-\pi\approx-2.034$.
    solution:
      - kind: idea
        text: >-
          $|a+bi|=\sqrt{a^2+b^2}$. לזווית: קודם הרביע לפי הסימנים; על ציר קוראים מהשרטוט; אחרת זווית העזר
          $\arctan\frac{b}{a}$, ועוד $\pi$ כש-$a<0$ ו-$b>0$, פחות $\pi$ כש-$a<0$ ו-$b<0$.
      - kind: computation
        text: >-
          $5-5i$: הרביע הרביעי. $|z|=\sqrt{25+25}=5\sqrt2\approx7.07$. זווית העזר $\arctan(-1)$, כלומר מינוס
          $\frac{\pi}{4}$, וכש-$a>0$ אין תיקון: $\operatorname{Arg}z=-\frac{\pi}{4}$.
      - kind: computation
        text: >-
          $-6$: על החלק השלילי של הציר הממשי. $|z|=6$ ו-$\operatorname{Arg}z=\pi$ (הקצה $-\pi$ אינו בטווח).
      - kind: computation
        text: >-
          $-2\sqrt3+2i$: הרביע השני. $|z|=\sqrt{12+4}=4$. זווית העזר
          $\arctan\frac{2}{-2\sqrt3}=\arctan\left(-\frac{1}{\sqrt3}\right)$, כלומר מינוס $\frac{\pi}{6}$. מוסיפים $\pi$:
          $\operatorname{Arg}z=\frac{5\pi}{6}$.
      - kind: computation
        text: >-
          $-7i$: על החלק השלילי של הציר המדומה, ישר למטה. $|z|=7$ ו-$\operatorname{Arg}z=-\frac{\pi}{2}$.
      - kind: computation
        text: >-
          $-1-2i$: הרביע השלישי. $|z|=\sqrt{1+4}=\sqrt5\approx2.24$. זווית העזר $\arctan\frac{-2}{-1}=\arctan2\approx1.107$,
          זווית של הרביע הראשון. מחסירים $\pi$: $\operatorname{Arg}z=\arctan2-\pi\approx-2.034$, כלומר בערך מינוס
          $116.57^\circ$. זו אינה זווית נוחה, והתשובה המדויקת היא $\arctan2-\pi$.
      - kind: check
        text: >-
          הצבה חזרה, עם הסימנים: $4\cos\frac{5\pi}{6}=4\cdot\left(-\frac{\sqrt3}{2}\right)$, כלומר מינוס $2\sqrt3$,
          ו-$4\sin\frac{5\pi}{6}=2$. ול-$-1-2i$: הזווית $-2.034$ בין $-\pi$ ל-$-\frac{\pi}{2}$, ברביע השלישי, כמו הנקודה.
      - kind: result
        text: >-
          $(5\sqrt2,-\frac{\pi}{4})$, $(6,\pi)$, $(4,\frac{5\pi}{6})$, $(7,-\frac{\pi}{2})$, $(\sqrt5,\arctan2-\pi)$, כל
          זוג בסדר $(|z|,\operatorname{Arg}z)$.

  - id: W-3.2-03
    level: basic
    qualitative: true
    objectives: [OBJ-3.2-3]
    prompt: >-
      תארו במילים את הקבוצה של כל $z$ שמקיים את התנאי, ונמקו בקצרה.

      (א) $|z|=3$

      (ב) $|z-1+i|<1$

      (ג) $\operatorname{Im}z=-2$

      (ד) $\operatorname{Re}z\le0$

      (ה) $\operatorname{Arg}z=-\frac{\pi}{2}$

      (ו) $|z+2|=|z-2|$
    answer: >-
      (א) המעגל ברדיוס 3 סביב הראשית. (ב) העיגול שמרכזו $1-i$ ורדיוסו 1, בלי המעגל. (ג) הישר האופקי $y=-2$. (ד) חצי
      המישור השמאלי, עם הציר המדומה. (ה) החלק השלילי של הציר המדומה, בלי הראשית. (ו) הציר המדומה.
    solution:
      - kind: idea
        text: >-
          המילון: $|z-a|$ הוא המרחק מ-$a$; $\operatorname{Re}z$ ו-$\operatorname{Im}z$ הם $x$ ו-$y$; $\operatorname{Arg}z$
          הוא הכיוון מהראשית. בכל ערך מוחלט כותבים קודם "$z$ פחות משהו".
      - kind: step
        text: >-
          (א) מרחק 3 מהראשית: מעגל ברדיוס 3 סביב 0. (ב) $z-1+i=z-(1-i)$: מרחק קטן מ-1 מהנקודה $(1,-1)$. העיגול
          שמרכזו $1-i$ ורדיוסו 1, בלי המעגל עצמו, כי אי-השוויון חזק.
      - kind: step
        text: >-
          (ג) $y=-2$: ישר אופקי, שתי יחידות מתחת לציר הממשי. (ד) $x\le0$: כל מה שמשמאל לציר המדומה, יחד עם הציר עצמו.
      - kind: step
        text: >-
          (ה) הכיוון "ישר למטה" בכל מרחק: הקרן של החלק השלילי של הציר המדומה. בלי הראשית, שאין לה ארגומנט.
      - kind: step
        text: >-
          (ו) $|z+2|=|z-(-2)|$, ולכן התנאי אומר שהמרחק מ-$-2$ שווה למרחק מ-2. זה האנך האמצעי לקטע שבין $(-2,0)$
          ל-$(2,0)$: הציר המדומה.
      - kind: check
        text: >-
          (ו) בחישוב: $(x+2)^2+y^2=(x-2)^2+y^2$ נותן $8x=0$, כלומר $x=0$. (ה) נקודה לדוגמה: $-3i$, ו-$\operatorname{Arg}(-3i)=-\frac{\pi}{2}$;
          ולעומתה $3i$ נמצאת על אותו ציר, אבל בכיוון $\frac{\pi}{2}$, ולכן אינה בקבוצה.
      - kind: result
        text: >-
          מעגל; עיגול פתוח סביב $1-i$; ישר אופקי; חצי מישור שמאלי סגור; קרן כלפי מטה בלי הראשית; הציר המדומה.

  - id: W-3.2-04
    level: mid
    objectives: [OBJ-3.2-2]
    prompt: >-
      (א) חשבו בלי לפתוח סוגריים:

      $$\left|\frac{(1-i)^6(3+4i)}{(2-i)^2}\right| .$$

      (ב) מצאו את כל המספרים $z$ שמקיימים $|z|=5$ ו-$\operatorname{Re}z=-3$, ואת $\operatorname{Arg}z$ של כל אחד.

      (ג) נתון ש-$|z|=2$. בטאו את $\frac1z$ בעזרת $\bar z$.
    answer: >-
      (א) 8. (ב) $-3+4i$ ו-$-3-4i$, עם $\operatorname{Arg}=\pm\left(\pi-\arctan\frac43\right)\approx\pm2.214$. (ג)
      $\frac1z=\frac{\bar z}{4}$.
    solution:
      - kind: idea
        text: >-
          הערך המוחלט כופל ומחלק כמו שהוא: $|zw|=|z||w|$, $\left|\frac zw\right|=\frac{|z|}{|w|}$, $|z^n|=|z|^n$. לכן
          מחשבים את הערך המוחלט של כל גורם לחוד. ב-(ב) התנאי $|z|=5$ הוא מעגל, ו-$\operatorname{Re}z=-3$ ישר אנכי.
      - kind: computation
        text: >-
          (א) $|1-i|=\sqrt2$, ולכן $|(1-i)^6|=(\sqrt2)^6=8$. $|3+4i|=5$. $|2-i|=\sqrt5$, ולכן $|(2-i)^2|=5$. התוצאה:
          $\frac{8\cdot5}{5}=8$.
      - kind: computation
        text: >-
          (ב) $z=-3+bi$ עם $9+b^2=25$, כלומר $b^2=16$ ו-$b=\pm4$: $z=-3+4i$ או $z=-3-4i$. אלה שתי נקודות החיתוך של
          המעגל ברדיוס 5 עם הישר $x=-3$.
      - kind: computation
        text: >-
          $-3+4i$ ברביע השני: זווית העזר $\arctan\frac{4}{-3}$, כלומר מינוס $\arctan\frac43$, ועוד $\pi$:
          $\operatorname{Arg}=\pi-\arctan\frac43\approx2.214$ ($126.87^\circ$). $-3-4i$ ברביע השלישי, תמונת הראי שלו
          דרך הציר הממשי: $\operatorname{Arg}=\arctan\frac43-\pi\approx-2.214$.
      - kind: computation
        text: >-
          (ג) $z\bar z=|z|^2=4$. מחלקים ב-$4z$ (מותר, כי $z\ne0$): $\frac1z=\frac{\bar z}{4}$.
      - kind: check
        text: >-
          (ג) דוגמה: $z=\sqrt3+i$, ש-$|z|=2$. אז $\frac{\bar z}{4}=\frac{\sqrt3-i}{4}$, ובאמת
          $(\sqrt3+i)\cdot\frac{\sqrt3-i}{4}=\frac{3+1}{4}=1$. (ב) $|{-3}\pm4i|=\sqrt{9+16}=5$.
      - kind: result
        text: >-
          (א) 8. (ב) $-3\pm4i$, עם ארגומנטים $\pm\left(\pi-\arctan\frac43\right)$. (ג) $\frac1z=\frac{\bar z}{4}$.

  - id: W-3.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-3.2-1, OBJ-3.2-2]
    prompt: >-
      לכל טענה קבעו אם היא נכונה לכל המספרים המרוכבים $z,w$, ונמקו: הוכחה קצרה או תמונה, או דוגמה נגדית.

      (א) $|z-w|=|w-z|$

      (ב) $|z+w|\ge|z|-|w|$

      (ג) אם $|z|=|w|$, אז $z=w$ או $z=-w$.

      (ד) $\operatorname{Re}z\le|z|$

      (ה) $|z+w|^2=|z|^2+|w|^2$
    answer: >-
      (א) נכון. (ב) נכון. (ג) לא נכון ($z=1$, $w=i$). (ד) נכון. (ה) לא נכון ($z=w=1$); זה נכון בדיוק כש-$\operatorname{Re}(z\bar w)=0$,
      כלומר כשהחצים מאונכים או שאחד מהם 0.
    solution:
      - kind: idea
        text: >-
          כל טענה מתורגמת לתמונה: $|z-w|$ הוא מרחק, $|z|$ אורך, $\operatorname{Re}z$ הוא ה-$x$ של הנקודה. טענה שגויה
          מפריכים במספרים פשוטים כמו $1$ ו-$i$.
      - kind: step
        text: >-
          (א) נכון: $w-z=-(z-w)$, ו-$|-u|=|u|$. בתמונה: המרחק מ-$z$ אל $w$ שווה למרחק מ-$w$ אל $z$.
      - kind: step
        text: >-
          (ב) נכון: זה החסם מלמטה של אי-שוויון המשולש. גם ישירות: $|z|=|(z+w)+(-w)|\le|z+w|+|w|$, ומעבירים אגף.
      - kind: step
        text: >-
          (ג) לא נכון: $|1|=|i|=1$, אבל $i$ אינו $1$ ואינו מינוס 1. אורך שווה אומר רק ששתי הנקודות על אותו מעגל סביב
          הראשית; הכיוונים יכולים להיות כל שניים.
      - kind: step
        text: >-
          (ד) נכון: $\operatorname{Re}z=a\le|a|=\sqrt{a^2}\le\sqrt{a^2+b^2}=|z|$. בתמונה: ניצב אינו ארוך מהיתר.
      - kind: computation
        text: >-
          (ה) לא נכון: $z=w=1$ נותן $|2|^2=4$, ואילו $1+1=2$.
      - kind: computation
        text: >-
          הנוסחה המלאה, בשלושה צעדים. ראשית, לפי $|u|^2=u\bar u$ עם $u=z+w$, ולפי הכלל משיעור 3.1 שהצמוד של סכום הוא
          סכום הצמודים, $\overline{z+w}=\bar z+\bar w$:

          $$|z+w|^2=(z+w)(\bar z+\bar w).$$
      - kind: computation
        text: >-
          שנית, פותחים סוגריים: $(z+w)(\bar z+\bar w)=z\bar z+w\bar w+z\bar w+\bar z w=|z|^2+|w|^2+z\bar w+\bar z w$.
      - kind: computation
        text: >-
          שלישית, $\bar z w$ הוא הצמוד של $z\bar w$: הצמוד של מכפלה הוא מכפלת הצמודים, והצמוד של $\bar w$ הוא $w$, ולכן
          $\overline{z\bar w}=\bar z\,w$. סכום של מספר ושל הצמוד שלו הוא פעמיים החלק הממשי ($u+\bar u=2\operatorname{Re}u$,
          שיעור 3.1). לכן

          $$|z+w|^2=|z|^2+|w|^2+2\operatorname{Re}(z\bar w),$$

          והשוויון של (ה) נכון בדיוק כש-$\operatorname{Re}(z\bar w)=0$.
      - kind: check
        text: >-
          (ה) עם $z=1$, $w=i$: $z\bar w=-i$, שהחלק הממשי שלו 0, ואכן $|1+i|^2=2=1+1$. החצים $1$ ו-$i$ מאונכים, וזה משפט
          פיתגורס. ועם $z=a+bi$, $w=c+di$: $\operatorname{Re}(z\bar w)=ac+bd$, המכפלה הסקלרית של שני הווקטורים משיעור 1.2.
      - kind: result
        text: >-
          (א), (ב), (ד) נכונות; (ג) ו-(ה) שגויות. $|z+w|^2=|z|^2+|w|^2+2\operatorname{Re}(z\bar w)$.

  - id: W-3.2-06
    level: mid
    objectives: [OBJ-3.2-3]
    prompt: >-
      (א) תארו את הקבוצה $|z-2i|=|z+4|$ במילים, ומצאו את המשוואה שלה במשתנים $x,y$.

      (ב) תארו את הקבוצה $|z-2i|\le|z+4|$, ובדקו את התשובה בשתי נקודות.
    answer: >-
      (א) האנך האמצעי לקטע שבין $2i$ ל-$-4$: הישר $y=-2x-3$. (ב) חצי המישור $y\ge-2x-3$, הצד של $2i$, עם הישר.
    solution:
      - kind: idea
        text: >-
          $|z+4|=|z-(-4)|$. התנאי (א) אומר שהמרחק מ-$2i$ שווה למרחק מ-$-4$: האנך האמצעי. (ב) אומר ש-$z$ קרוב ל-$2i$
          לפחות כמו ל-$-4$: הצד של הישר שבו נמצא $2i$.
      - kind: computation
        text: >-
          (א) מציבים $z=x+iy$ ומעלים בריבוע (שני הצדדים אינם שליליים): $x^2+(y-2)^2=(x+4)^2+y^2$. פותחים:
          $x^2+y^2-4y+4=x^2+8x+16+y^2$. ה-$x^2$ וה-$y^2$ מצטמצמים: $-4y+4=8x+16$, כלומר $y=-2x-3$.
      - kind: check
        text: >-
          אמצע הקטע בין $(0,2)$ ל-$(-4,0)$ הוא $(-2,1)$, ואכן $-2\cdot(-2)-3=1$. הכיוון של הקטע הוא $(4,2)$, שיפוע
          $\frac12$, והשיפוע של הישר $-2$: מכפלת השיפועים מינוס 1, ולכן הם מאונכים.
      - kind: computation
        text: >-
          (ב) אותו חישוב עם $\le$: $-4y+4\le8x+16$, כלומר $-4y\le8x+12$. מחלקים במינוס 4, ואי-השוויון מתהפך:
          $y\ge-2x-3$. חצי המישור שמעל הישר, כולל הישר.
      - kind: check
        text: >-
          $z=2i$: $|0|\le|2i+4|$ נכון, ואכן $2\ge-3$. $z=-4$: $|{-4}-2i|=\sqrt{20}\le0$ לא נכון, ואכן $0\ge-2\cdot(-4)-3=5$
          לא נכון. כל נקודה נמצאת בצד של הנקודה שהיא קרובה אליה.
      - kind: result
        text: >-
          (א) הישר $y=-2x-3$. (ב) $y\ge-2x-3$: חצי המישור של $2i$, עם השפה.

  - id: W-3.2-07
    level: mid
    objectives: [OBJ-3.2-3, OBJ-3.2-2]
    prompt: >-
      נתונה הקבוצה $S=\{z\ne0:\ |z|\le2,\ -\frac{\pi}{4}\le\operatorname{Arg}z\le\frac{\pi}{2}\}$.

      (א) שרטטו את $S$ ותנו לה שם.

      (ב) קבעו לכל אחד מהמספרים אם הוא ב-$S$: $1-i$, $-1$, $2i$, $1.5+1.5i$, $\sqrt3-i$.
    answer: >-
      (א) גזרה של העיגול ברדיוס 2, בין הכיוון $-\frac{\pi}{4}$ לכיוון $\frac{\pi}{2}$ (בלי הראשית). (ב) $1-i$, $2i$
      ו-$\sqrt3-i$ ב-$S$; $-1$ ו-$1.5+1.5i$ לא.
    solution:
      - kind: idea
        text: >-
          שני תנאים, כל אחד לחוד: המרחק מהראשית לכל היותר 2, והכיוון בין $-\frac{\pi}{4}$ ל-$\frac{\pi}{2}$. לכל נקודה
          מחשבים $|z|$ ו-$\operatorname{Arg}z$, עם הרביע.
      - kind: step
        text: >-
          (א) $|z|\le2$ הוא העיגול ברדיוס 2. הכיוונים מ-$-\frac{\pi}{4}$ (למטה וימינה, על הישר $y=-x$) נגד כיוון השעון
          עד $\frac{\pi}{2}$ (ישר למעלה): $\frac{\pi}{4}$ עד הכיוון החיובי של הציר הממשי, ועוד $\frac{\pi}{2}$ עד הכיוון למעלה, כלומר
          זווית פתיחה $\frac{3\pi}{4}$. התוצאה:
          גזרה ("פרוסת עוגה") של העיגול, עם השפה. הראשית אינה ב-$S$, כי אין לה ארגומנט.
      - kind: computation
        text: >-
          (ב) $1-i$: $|z|=\sqrt2\le2$ ו-$\operatorname{Arg}=-\frac{\pi}{4}$, על השפה הישרה: ב-$S$. $-1$: $|z|=1$, אבל
          $\operatorname{Arg}=\pi$: לא. $2i$: $|z|=2$ ו-$\operatorname{Arg}=\frac{\pi}{2}$, על הפינה של הקשת: ב-$S$.
      - kind: computation
        text: >-
          $1.5+1.5i$: הכיוון $\frac{\pi}{4}$ מתאים, אבל $|z|=1.5\sqrt2\approx2.12>2$: לא. $\sqrt3-i$: $|z|=\sqrt{3+1}=2$,
          והרביע הרביעי עם זווית עזר $\arctan\left(-\frac{1}{\sqrt3}\right)$, כלומר $\operatorname{Arg}=-\frac{\pi}{6}$,
          שהוא בין $-\frac{\pi}{4}$ ל-$\frac{\pi}{2}$: ב-$S$, על הקשת.
      - kind: check
        text: >-
          $-\frac{\pi}{6}\approx-0.52$ גדול מ-$-\frac{\pi}{4}\approx-0.79$, ולכן בטווח. ול-$1.5+1.5i$ בדיקה בלי שורשים:
          $|z|^2=2.25+2.25=4.5>4$.
      - kind: result
        text: >-
          גזרה של העיגול ברדיוס 2 בזווית פתיחה $\frac{3\pi}{4}$; ב-$S$: $1-i$, $2i$, $\sqrt3-i$.

  - id: W-3.2-08
    level: exam
    qualitative: true
    objectives: [OBJ-3.2-3, OBJ-3.2-2]
    prompt: >-
      נתונה הקבוצה $T=\{z\ne0:\ |z|\ge1,\ |\operatorname{Arg}z|\ge\frac{3\pi}{4}\}$.

      (א) שרטטו את $T$ ותארו אותה במילים.

      (ב) סטודנטית כתבה את $T$ כך: $|z|\ge1,\ \frac{3\pi}{4}\le\operatorname{Arg}z\le\frac{5\pi}{4}$. מה חסר בתיאור
      שלה, ולמה?

      (ג) תארו את $T$ בעזרת $x=\operatorname{Re}z$ ו-$y=\operatorname{Im}z$ בלבד.

      (ד) קבעו אם המספרים $-2$, $-2-i$, $-1-2i$, $-\frac12$ ו-$-2+2i$ נמצאים ב-$T$.
    answer: >-
      (א) החלק של הגזרה בין הכיוונים $\frac{3\pi}{4}$ ו-$-\frac{3\pi}{4}$ (סביב הציר הממשי השלילי) שנמצא על מעגל היחידה ומחוצה לו.
      (ב) חסר כל החצי התחתון: $\operatorname{Arg}z$ אינו גדול מ-$\pi$. (ג) $x\le-|y|$ ו-$x^2+y^2\ge1$. (ד) $-2$,
      $-2-i$, $-2+2i$ ב-$T$; $-1-2i$ ו-$-\frac12$ לא.
    solution:
      - kind: idea
        text: >-
          $|\operatorname{Arg}z|\ge\frac{3\pi}{4}$ הם הכיוונים שרחוקים מהכיוון $\pi$ (ישר שמאלה) לכל היותר $\frac{\pi}{4}$,
          לכל צד. בטווח $(-\pi,\pi]$ הם נכתבים כשני חלקים, כי הכיוון $\pi$ נמצא בקצה הטווח.
      - kind: step
        text: >-
          (א) הכיוונים: מ-$\frac{3\pi}{4}$ (על הישר $y=-x$, ברביע השני) נגד כיוון השעון דרך $\pi$ ועד $-\frac{3\pi}{4}$
          (על הישר $y=x$, ברביע השלישי). זו גזרה אינסופית בזווית פתיחה $\frac{\pi}{2}$, שהציר הממשי השלילי הוא הציר
          שלה. התנאי $|z|\ge1$ מוציא ממנה את מה שבתוך עיגול היחידה, ומשאיר את הקשת של מעגל היחידה עצמה.
      - kind: step
        text: >-
          (ב) הארגומנט הראשי הוא לכל היותר $\pi$. לכן $\frac{3\pi}{4}\le\operatorname{Arg}z\le\frac{5\pi}{4}$ שקול
          ל-$\frac{3\pi}{4}\le\operatorname{Arg}z\le\pi$: רק החצי העליון של הגזרה. הכיוונים שמתחת לציר הממשי נקראים
          בטווח הזה בשמות שליליים, בין $-\pi$ ל-$-\frac{3\pi}{4}$. (בטווח $[0,2\pi)$ התיאור שלה היה נכון.)
      - kind: step
        text: >-
          (ג) הגזרה היא הנקודות שמשמאל לשני הישרים $y=x$ ו-$y=-x$: $x\le y$ וגם $x\le-y$, כלומר $x\le-|y|$. ועם
          $|z|\ge1$: $x^2+y^2\ge1$.
      - kind: computation
        text: >-
          (ד) $-2$: $\operatorname{Arg}=\pi$ ו-$|z|=2$: ב-$T$. $-2-i$: $\operatorname{Arg}=\arctan\frac12-\pi\approx-2.678$,
          ו-$|{-2.678}|\ge\frac{3\pi}{4}\approx2.356$, ו-$|z|=\sqrt5$: ב-$T$. $-1-2i$:
          $\operatorname{Arg}=\arctan2-\pi\approx-2.034$, ו-$2.034<2.356$: לא. $-\frac12$: הכיוון מתאים, אבל
          $|z|=\frac12<1$: לא. $-2+2i$: $\operatorname{Arg}=\frac{3\pi}{4}$, על השפה, ו-$|z|=2\sqrt2$: ב-$T$.
      - kind: check
        text: >-
          אותן נקודות בתיאור של (ג): $-2-i$: $-2\le-|{-1}|=-1$, ו-$4+1\ge1$: ב-$T$. $-1-2i$: $-1\le-2$ לא נכון: לא
          ב-$T$. $-2+2i$: $-2\le-2$: על השפה. שני התיאורים מסכימים.
      - kind: result
        text: >-
          $T$ היא הגזרה סביב הציר הממשי השלילי, $x\le-|y|$, על מעגל היחידה ומחוצה לו. התיאור של הסטודנטית מחמיץ את החצי
          התחתון. ב-$T$: $-2$, $-2-i$, $-2+2i$.

  - id: W-3.2-09
    level: exam
    objectives: [OBJ-3.2-3, OBJ-3.2-2]
    prompt: >-
      (א) הראו שהקבוצה $\{z:\ |z-3i|=2|z|\}$ היא מעגל, ומצאו את המרכז ואת הרדיוס שלו.

      (ב) מצאו את הערך הקטן ביותר ואת הגדול ביותר של $|z|$ על המעגל, ובאילו נקודות הם מתקבלים.
    answer: >-
      (א) $x^2+(y+1)^2=4$: מרכז $-i$, רדיוס 2. (ב) הקטן ביותר 1, ב-$z=i$; הגדול ביותר 3, ב-$z=-3i$.
    solution:
      - kind: idea
        text: >-
          יחס קבוע (לא שוויון) בין שני מרחקים: מציבים $z=x+iy$ ומעלים בריבוע, ובניגוד לאנך האמצעי ה-$x^2$ וה-$y^2$ לא
          יתבטלו. משלימים לריבוע. ל-(ב): הראשית בתוך המעגל, וזה המקרה השני בסעיף "הנקודה הקרובה ביותר לראשית, והרחוקה ביותר" בשיעור: שתי
          הנקודות על הישר דרך הראשית והמרכז, במרחקים $r-|a|$ ו-$r+|a|$.
      - kind: computation
        text: >-
          (א) שני הצדדים אינם שליליים, ולכן מותר להעלות בריבוע: $x^2+(y-3)^2=4\left(x^2+y^2\right)$, כלומר
          $x^2+y^2-6y+9=4x^2+4y^2$. מעבירים הכול לאגף ימין: $0=3x^2+3y^2+6y-9$, ומחלקים ב-3: $x^2+y^2+2y-3=0$.
      - kind: computation
        text: >-
          משלימים לריבוע ב-$y$: $y^2+2y=(y+1)^2-1$. מתקבל $x^2+(y+1)^2=4$: מעגל שמרכזו $(0,-1)$, כלומר $-i$, ורדיוסו
          2.
      - kind: step
        text: >-
          (ב) המרחק מהראשית למרכז הוא $|{-i}|=1$, קטן מהרדיוס: הראשית בתוך המעגל. הישר מהראשית דרך המרכז הוא הציר
          המדומה, והוא חותך את המעגל ב-$-i\pm2i$, כלומר ב-$i$ וב-$-3i$. הקרובה לראשית היא $i$, במרחק 1, והרחוקה $-3i$,
          במרחק 3.
      - kind: step
        text: >-
          למה אין קרובה יותר או רחוקה יותר: לפי אי-שוויון המשולש, לכל $z$ על המעגל
          $|z|=|(z+i)-i|\le|z+i|+|{-i}|=2+1=3$, ו-$|z|\ge|z+i|-|{-i}|=2-1=1$.
      - kind: check
        text: >-
          בתנאי המקורי: $z=i$: $|i-3i|=2$ ו-$2|i|=2$. $z=-3i$: $|{-6i}|=6$ ו-$2|{-3i}|=6$. ונקודה שלישית על המעגל,
          $z=2-i$: $|2-4i|=\sqrt{20}$ ו-$2|2-i|=2\sqrt5=\sqrt{20}$.
      - kind: result
        text: >-
          המעגל $|z+i|=2$; $|z|$ בין 1 (ב-$i$) ל-3 (ב-$-3i$).

  - id: W-3.2-10
    level: exam
    qualitative: true
    objectives: [OBJ-3.2-1, OBJ-3.2-3]
    prompt: >-
      (א) הוכיחו שלכל מספר מרוכב $z$ מתקיים $|z-2|+|z+2|\ge4$, והסבירו את אי-השוויון בתמונה.

      (ב) מהי הקבוצה $\{z:\ |z-2|+|z+2|=4\}$?

      (ג) מהי הקבוצה $\{z:\ |z-2|+|z+2|=3\}$?
    answer: >-
      (א) לפי אי-שוויון המשולש, $4=|(2-z)+(z+2)|\le|2-z|+|z+2|$. (ב) הקטע הממשי $[-2,2]$, כלומר $z=x$ עם $-2\le x\le2$.
      (ג) הקבוצה הריקה.
    solution:
      - kind: idea
        text: >-
          $|z-2|+|z+2|$ הוא סכום המרחקים של $z$ משתי הנקודות $2$ ו-$-2$: האורך של דרך שבורה מ-$-2$ אל $z$ ומשם אל 2.
          הדרך הקצרה ביותר בין שתי נקודות היא הקטע הישר, שאורכו 4. אי-שוויון המשולש הוא הניסוח המדויק.
      - kind: computation
        text: >-
          (א) כותבים את 4 כסכום של שני מספרים מרוכבים: $4=(2-z)+(z+2)$. לפי אי-שוויון המשולש
          $4=|(2-z)+(z+2)|\le|2-z|+|z+2|=|z-2|+|z+2|$, כי $|2-z|=|z-2|$.
      - kind: step
        text: >-
          (ב) שוויון באי-שוויון המשולש מתקבל רק כשהחצים $2-z$ ו-$z+2$ באותו כיוון (או שאחד מהם 0). $z+2$ הוא החץ
          מ-$-2$ אל $z$, ו-$2-z$ הוא החץ מ-$z$ אל 2. הם באותו כיוון בדיוק כש-$z$ נמצא על הקטע שבין $-2$ ל-2: בכל נקודה
          אחרת הדרך השבורה "מתכופפת" ב-$z$ וארוכה יותר.
      - kind: computation
        text: >-
          בדיקה בכיוון ההפוך: אם $z=x$ ממשי עם $-2\le x\le2$, אז $|x-2|=2-x$ ו-$|x+2|=x+2$, והסכום $4$.
      - kind: step
        text: >-
          (ג) לפי (א) הסכום תמיד לפחות 4, ולכן הוא אף פעם אינו 3. אין אף מספר כזה: הקבוצה ריקה.
      - kind: check
        text: >-
          נקודות לדוגמה: $z=0$ נותן $2+2=4$, על הקטע. $z=i$ נותן $|i-2|+|i+2|=2\sqrt5\approx4.47>4$. $z=3$ נותן $1+5=6>4$:
          על הישר אבל מחוץ לקטע, ושם החצים בכיוונים הפוכים.
      - kind: result
        text: >-
          $|z-2|+|z+2|\ge4$ תמיד; השוויון רק על הקטע $[-2,2]$ של הציר הממשי; הערך 3 אינו מתקבל.

challenge:
  - id: W-3.2-c1
    stars: 1
    objectives: [OBJ-3.2-3]
    prompt: >-
      שרטטו את הקבוצות הבאות במישור גאוס, ומצאו לכל אחת משוואה ב-$x,y$ (כש-$z=x+iy$):

      (א) $\{z:\ |z-i|+|z+i|=3\}$

      (ב) $\{z:\ \operatorname{Re}(z^2)=1\}$

      (ג) $\{z:\ \operatorname{Im}(z^2)=1\}$
    answer: >-
      (א) האליפסה $\frac{x^2}{5/4}+\frac{y^2}{9/4}=1$, עם קודקודים $\pm\frac32i$ ו-$\pm\frac{\sqrt5}{2}$. (ב) ההיפרבולה
      $x^2-y^2=1$. (ג) ההיפרבולה $xy=\frac12$.
    solution:
      - kind: idea
        text: >-
          (א) סכום של שני מרחקים, מ-$i$ ומ-$-i$, שווה 3. לפי אי-שוויון המשולש הסכום תמיד לפחות 2, המרחק בין $i$ ל-$-i$
          (כמו ב-W-3.2-10). הערך 3 אכן מתקבל, למשל ב-$\frac32i$: $\frac12+\frac52=3$. הנקודות יוצרות עקום סגור סביב הקטע. כדי להגיע למשוואה מבודדים שורש אחד ומעלים בריבוע, פעמיים.
          (ב) ו-(ג): $z^2=x^2-y^2+2xyi$ (שיעור 3.1).
      - kind: computation
        text: >-
          (א) $\sqrt{x^2+(y-1)^2}=3-\sqrt{x^2+(y+1)^2}$. מעלים בריבוע:
          $x^2+y^2-2y+1=9-6\sqrt{x^2+(y+1)^2}+x^2+y^2+2y+1$. מצמצמים ומבודדים את השורש:
          $6\sqrt{x^2+(y+1)^2}=9+4y$.
      - kind: computation
        text: >-
          מעלים בריבוע שוב: $36\left(x^2+y^2+2y+1\right)=81+72y+16y^2$. ה-$72y$ מצטמצם, ונשאר $36x^2+20y^2=45$. מחלקים
          ב-45:

          $$\frac{x^2}{5/4}+\frac{y^2}{9/4}=1 .$$

          זו אליפסה (שיעור 2.1) עם חצאי צירים $\frac{\sqrt5}{2}\approx1.12$ לאורך הציר הממשי ו-$\frac32$ לאורך הציר
          המדומה.
      - kind: step
        text: >-
          למה צריך לבדוק: העלאה בריבוע יכולה להוסיף נקודות שבהן שני האגפים נגדיים (כמו 2 ומינוס 2), ולכן בודקים
          שעל האליפסה שני האגפים של כל משוואה שהעלינו בריבוע אינם שליליים. במשוואה השנייה: על האליפסה $y\ge-\frac32$,
          ולכן $9+4y\ge3>0$. במשוואה הראשונה צריך $3-\sqrt{x^2+(y+1)^2}\ge0$, כלומר מרחק מ-$-i$ לכל היותר 3. מהמשוואה
          השנייה, המרחק הזה הוא $\frac{9+4y}{6}$, ועל האליפסה $y\le\frac32$, ולכן הוא לכל היותר $\frac{9+6}{6}=\frac52<3$.
          לכן כל נקודה של האליפסה מקיימת את התנאי המקורי.
      - kind: computation
        text: >-
          (ב) $\operatorname{Re}(z^2)=x^2-y^2$, והתנאי הוא $x^2-y^2=1$: היפרבולה (שיעור 2.2) עם קודקודים $\pm1$ על הציר
          הממשי והאסימפטוטות $y=\pm x$.
      - kind: computation
        text: >-
          (ג) $\operatorname{Im}(z^2)=2xy$, והתנאי $2xy=1$, כלומר $xy=\frac12$: היפרבולה ברביע הראשון וברביע השלישי, עם
          הצירים כאסימפטוטות. זו ההיפרבולה של (ב), מסובבת ב-$\frac{\pi}{4}$ סביב הראשית: הקודקודים שלה,
          $\pm\left(\frac{1}{\sqrt2}+\frac{1}{\sqrt2}i\right)$, גם הם במרחק 1 מהראשית.
      - kind: check
        text: >-
          (א) הקודקוד $\frac32i$: $\left|\frac12i\right|+\left|\frac52i\right|=\frac12+\frac52=3$. והנקודה
          $\frac{\sqrt5}{2}$: כל אחד מהמרחקים הוא $\sqrt{\frac54+1}=\frac32$, והסכום 3. (ב) $z=\frac54+\frac34i$:
          $z^2=\frac{25}{16}-\frac{9}{16}+\frac{15}{8}i$, שהחלק הממשי שלו 1. (ג) $z=1+\frac12i$: $z^2=\frac34+i$, שהחלק
          המדומה שלו 1.
      - kind: result
        text: >-
          (א) $\frac{x^2}{5/4}+\frac{y^2}{9/4}=1$. (ב) $x^2-y^2=1$. (ג) $xy=\frac12$.
    source:
      name: 'M. Beck, G. Marchesi, D. Pixton, L. Sabalka, A First Course in Complex Analysis (edition 1.6)'
      year: 2025
      problem: 'Exercise 1.5.23 (d), (g), (h)'
      url: https://matthbeck.github.io/papers/complex.pdf
      verified: '2026-11-26'
      adapted: true

  - id: W-3.2-c2
    stars: 1
    objectives: [OBJ-3.2-2, OBJ-3.2-1]
    prompt: >-
      (א) הוכיחו שלכל שני מספרים מרוכבים מתקיים $|z-w|\ge|z|-|w|$.

      (ב) הראו שלכל $z$ על המעגל $|z|=2$ מתקיים

      $$\left|\frac{1}{z^2-1}\right|\le\frac13 ,$$

      ומצאו את כל הנקודות על המעגל שבהן יש שוויון.
    answer: >-
      (א) $|z|=|(z-w)+w|\le|z-w|+|w|$. (ב) $|z^2-1|\ge|z^2|-1=4-1=3$, ולכן $\left|\frac{1}{z^2-1}\right|\le\frac13$;
      שוויון רק ב-$z=2$ וב-$z=-2$.
    solution:
      - kind: idea
        text: >-
          חסם מלמטה על ערך מוחלט של הפרש בא מאי-שוויון המשולש, אחרי שכותבים את $z$ כסכום של $z-w$ ושל $w$. ב-(ב): להגדיל
          שבר שקול להקטין את המכנה, ולכן צריך חסם **מלמטה** על $|z^2-1|$.
      - kind: computation
        text: >-
          (א) $z=(z-w)+w$, ולפי אי-שוויון המשולש $|z|\le|z-w|+|w|$. מעבירים אגף: $|z-w|\ge|z|-|w|$.
      - kind: computation
        text: >-
          (ב) לפי $|zw|=|z||w|$, $|z^2|=|z|^2=4$. לפי (א) עם $z^2$ במקום $z$ ו-1 במקום $w$:
          $|z^2-1|\ge|z^2|-|1|=4-1=3$. בפרט $z^2-1\ne0$, ולכן
          $\left|\frac{1}{z^2-1}\right|=\frac{1}{|z^2-1|}\le\frac13$.
      - kind: step
        text: >-
          שוויון: צריך $|z^2-1|=3$, כלומר שוויון באי-שוויון המשולש $|z^2|\le|z^2-1|+|1|$. זה קורה רק כשהחצים $z^2-1$
          ו-$1$ באותו כיוון, כלומר כש-$z^2-1$ ממשי ואינו שלילי. אז $z^2$ ממשי וחיובי, ועם $|z^2|=4$: $z^2=4$, כלומר
          $z=2$ או $z=-2$.
      - kind: check
        text: >-
          $z=\pm2$: $z^2-1=3$, והשבר $\frac13$. $z=2i$: $z^2-1=-5$, והשבר בערך מוחלט $\frac15<\frac13$. $z=\sqrt2+\sqrt2\,i$:
          $z^2=4i$, $|4i-1|=\sqrt{17}$, והשבר $\frac{1}{\sqrt{17}}\approx0.24<\frac13$. בתמונה: $z^2$ נע על המעגל ברדיוס 4,
          ו-$|z^2-1|$ הוא המרחק שלו מהנקודה 1; הכי קרוב ל-1 הוא בנקודה 4, במרחק 3.
      - kind: result
        text: >-
          $\left|\frac{1}{z^2-1}\right|\le\frac13$ על המעגל $|z|=2$, עם שוויון רק ב-$z=\pm2$.
