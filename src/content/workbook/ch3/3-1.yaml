# Workbook of lesson 3.1 — arithmetic with complex numbers.
# Objectives (src/course.ts):
#   OBJ-3.1-1  add, multiply and divide complex numbers in algebraic form
#   OBJ-3.1-2  the conjugate, used to divide and to find the real and imaginary parts
#   OBJ-3.1-3  solve a quadratic equation with a negative discriminant
# Only lesson 3.1 and earlier: no modulus beyond the notation |z|² = z z̄, no argument, no polar form.
# Every number recomputed with sympy (scratchpad lesson31.py of the writing session).
lesson: '3.1'
practice:
  - id: W-3.1-01
    level: basic
    objectives: [OBJ-3.1-1]
    prompt: >-
      חשבו, וכתבו כל תוצאה בצורה $a+bi$.

      (א) $(6-i)-(2+3i)+4i$

      (ב) $(-1+3i)(2+i)$

      (ג) $(2+i)(2-i)(1+i)$

      (ד) $i(4-3i)$. מהם החלק הממשי והחלק המדומה של התוצאה?
    answer: >-
      (א) $4$; (ב) $(-1+3i)(2+i)=-5+5i$; (ג) $5+5i$; (ד) $3+4i$, חלק ממשי 3 וחלק מדומה 4.
    solution:
      - kind: idea
        text: >-
          חיבור וחיסור: מכנסים את החלקים הממשיים לחוד ואת המדומים לחוד. כפל: פותחים סוגריים ומחליפים כל $i^2$ במינוס 1.
          במכפלה של שלושה גורמים מתחילים בזוג שנותן תוצאה פשוטה.
      - kind: computation
        text: >-
          (א) החלקים הממשיים: $6-2=4$. החלקים המדומים: $(-1)-3+4=0$. התוצאה $4+0i=4$, מספר ממשי.
      - kind: computation
        text: >-
          (ב) $(-1+3i)(2+i)=-2-i+6i+3i^2=-2+5i-3=-5+5i$.
      - kind: computation
        text: >-
          (ג) הזוג הראשון הוא מספר כפול הצמוד שלו: $(2+i)(2-i)=4-i^2=5$. לכן התוצאה היא $5(1+i)=5+5i$.
      - kind: computation
        text: >-
          (ד) $i(4-3i)=4i-3i^2=3+4i$. החלק הממשי 3 והחלק המדומה 4 (מספר ממשי, בלי $i$).
      - kind: check
        text: >-
          (ג) בסדר אחר: $(2-i)(1+i)=2+2i-i-i^2=3+i$, ואז $(2+i)(3+i)=6+2i+3i+i^2=5+5i$. אותה תוצאה, כמו שצריך: סדר הכפל
          אינו משנה.
      - kind: result
        text: >-
          (א) $4$; (ב) $(-1+3i)(2+i)=-5+5i$; (ג) $5+5i$; (ד) $3+4i$.

  - id: W-3.1-02
    level: basic
    objectives: [OBJ-3.1-1]
    prompt: >-
      חשבו: (א) $i^7$; (ב) $i^{40}$; (ג) $i^{2025}$; (ד) $\frac1i$; (ה) $(-i)^3$.
    answer: >-
      (א) $i^7=-i$; (ב) $i^{40}=1$; (ג) $i^{2025}=i$; (ד) $\frac1i=-i$; (ה) $(-i)^3=i$.
    solution:
      - kind: idea
        text: >-
          החזקות של $i$ חוזרות במחזור של 4: $i^1=i$, $i^2=-1$, $i^3=-i$, $i^4=1$. לכן $i^n$ נקבע לפי השארית של $n$
          בחלוקה ב-4. את $\frac1i$ מחשבים כמו כל חילוק: כופלים בצמוד של המכנה.
      - kind: computation
        text: >-
          (א) $7=4+3$, השארית 3: $i^7=i^4\cdot i^3=i^3$, כלומר מינוס $i$. (ב) 40 מתחלק ב-4: $i^{40}=\left(i^4\right)^{10}=1$.
          (ג) $2025=4\cdot506+1$, השארית 1: $i^{2025}=i$.
      - kind: computation
        text: >-
          (ד) הצמוד של $i$ הוא מינוס $i$, ו-$i\cdot(-i)=-i^2=1$. לכן $\frac1i=\frac{-i}{i\cdot(-i)}=\frac{-i}{1}$, כלומר
          מינוס $i$.
      - kind: computation
        text: >-
          (ה) $(-i)^3=(-1)^3\cdot i^3=(-1)\cdot(-i)=i$.
      - kind: check
        text: >-
          (ד) כופלים בחזרה: $i\cdot(-i)=-i^2=1$, אז מינוס $i$ הוא באמת ההפכי של $i$. שימו לב שזו גם $i^3$: $i\cdot i^3=i^4=1$.
      - kind: result
        text: >-
          $i^7=-i$, $i^{40}=1$, $i^{2025}=i$, $\frac1i=-i$, $(-i)^3=i$.

  - id: W-3.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-3.1-2]
    prompt: >-
      (א) כתבו את הצמוד של $3-7i$, של $5$ ושל המספר $0-2i$, ותארו במילים איפה נמצא הצמוד של מספר ביחס למספר עצמו בציור.

      (ב) אילו מספרים $z$ מקיימים $\bar z=z$, ואילו מקיימים $\bar z=-z$? נמקו.

      (ג) ל-$z=4-3i$ חשבו את $z+\bar z$, את $z-\bar z$ ואת $z\bar z$, וקראו מהן את $\operatorname{Re}z$ ואת $\operatorname{Im}z$.
    answer: >-
      (א) $3+7i$, $5$, $2i$; שיקוף בציר האופקי. (ב) $\bar z=z$ בדיוק לממשיים; $\bar z=-z$ בדיוק למדומים טהורים ול-0.
      (ג) $z+\bar z=8$, $z-\bar z=-6i$, $z\bar z=25$; $\operatorname{Re}z=4$, $\operatorname{Im}z=-3$.
    solution:
      - kind: definition
        text: >-
          הצמוד של $z=a+bi$ הוא $\bar z=a-bi$: אותו חלק ממשי, חלק מדומה בסימן הפוך. בציור הנקודה $(a,b)$ עוברת אל
          $(a,-b)$: שיקוף בציר האופקי.
      - kind: computation
        text: >-
          (א) $\overline{3-7i}=3+7i$. $\bar5=5$: למספר ממשי החלק המדומה 0, ושינוי הסימן שלו אינו משנה דבר. הצמוד של
          $0-2i$ הוא $0+2i$: החלק הממשי 0, והחלק המדומה מינוס 2 הופך ל-2.
      - kind: step
        text: >-
          (ב) $\bar z=z$ פירושו $a-bi=a+bi$, כלומר $b=-b$, ולכן $b=0$: בדיוק המספרים הממשיים. בציור: הנקודות שהשיקוף
          אינו מזיז, אלה שעל הציר האופקי. $\bar z=-z$ פירושו $a-bi=-a-bi$, כלומר $a=-a$, ולכן $a=0$: המדומים הטהורים,
          ועוד 0. בציור: הנקודות שעל הציר האנכי.
      - kind: computation
        text: >-
          (ג) $z+\bar z=(4-3i)+(4+3i)=8$, ולכן $\operatorname{Re}z=\frac82=4$. $z-\bar z=(4-3i)-(4+3i)=-6i$, ולכן
          $\operatorname{Im}z=\frac{-6i}{2i}=-3$. ו-$z\bar z=16+9=25$.
      - kind: check
        text: >-
          החלק המדומה של $4-3i$ הוא באמת מינוס 3, המקדם של $i$ עם הסימן שלו. אילו חילקנו את $z-\bar z$ ב-2 בלבד, היינו
          מקבלים $\frac{z-\bar z}{2}=-3i$: זה החלק המדומה כפול $i$, ולא החלק המדומה.
      - kind: result
        text: >-
          (א) $3+7i$, $5$, $2i$. (ב) ממשיים; מדומים טהורים ו-0. (ג) $\operatorname{Re}z=4$, $\operatorname{Im}z=-3$,
          $z\bar z=25$.

  - id: W-3.1-04
    level: mid
    objectives: [OBJ-3.1-1, OBJ-3.1-2]
    prompt: >-
      חשבו, וכתבו בצורה $a+bi$.

      (א) $\dfrac{2+11i}{2+i}$. היעזרו בתוצאה כדי לנחש מספר שהחזקה השלישית שלו היא $2+11i$, ובדקו. רמז: האם התוצאה היא ריבוע של מספר פשוט?

      (ב) $\dfrac{1+i}{1-i}$, ואחר כך $\left(\dfrac{1+i}{1-i}\right)^{10}$.

      (ג) $\dfrac{3-i}{i}$
    answer: >-
      (א) $3+4i$; $(2+i)^3=2+11i$. (ב) $i$, ו-$i^{10}=-1$. (ג) $\frac{3-i}{i}=-1-3i$.
    solution:
      - kind: idea
        text: >-
          כופלים מונה ומכנה בצמוד של המכנה, כדי שהמכנה יהיה ממשי. ב-(ב) עדיף לפשט קודם את המנה ורק אחר כך להעלות בחזקה:
          חזקה עשירית של מנה מסובכת היא הרבה עבודה, וחזקה עשירית של $i$ היא שורה אחת.
      - kind: computation
        text: >-
          (א) הצמוד של המכנה הוא $2-i$, והמכנה $(2+i)(2-i)=4+1=5$. המונה:
          $(2+11i)(2-i)=4-2i+22i-11i^2=15+20i$. מחלקים ב-5: $3+4i$.
      - kind: step
        text: >-
          מכאן $2+11i=(2+i)(3+4i)$. ואם $3+4i$ הוא $(2+i)^2$, אז $2+11i=(2+i)^3$. בודקים: $(2+i)^2=4+4i+i^2=3+4i$. נכון,
          ולכן $(2+i)^3=2+11i$: זה המספר של בומבלי מהשיעור.
      - kind: computation
        text: >-
          (ב) הצמוד של המכנה הוא $1+i$, והמכנה $1+1=2$. המונה $(1+i)^2=1+2i+i^2=2i$. לכן $\frac{1+i}{1-i}=\frac{2i}{2}=i$,
          ו-$\left(\frac{1+i}{1-i}\right)^{10}=i^{10}$. $10=4\cdot2+2$, ולכן $i^{10}=i^2$, כלומר מינוס 1.
      - kind: computation
        text: >-
          (ג) הצמוד של $i$ הוא מינוס $i$, ו-$i\cdot(-i)=1$. לכן $\frac{3-i}{i}=(3-i)(-i)=-3i+i^2=-1-3i$.
      - kind: check
        text: >-
          כפל חזרה במכנה: (א) $(3+4i)(2+i)=6+3i+8i+4i^2=2+11i$. (ב) $i(1-i)=i-i^2=1+i$. (ג) $(-1-3i)\cdot i=-i-3i^2=3-i$.
      - kind: result
        text: >-
          (א) $3+4i$, ו-$(2+i)^3=2+11i$. (ב) $i$, והחזקה העשירית היא מינוס 1. (ג) $\frac{3-i}{i}=-1-3i$.

  - id: W-3.1-05
    level: mid
    objectives: [OBJ-3.1-3]
    prompt: >-
      פתרו במספרים המרוכבים, ובדקו כל תשובה בעזרת הסכום והמכפלה של השורשים.

      (א) $z^2+2z+10=0$

      (ב) $z^2-z+1=0$

      (ג) $4z^2+9=0$

      (ד) $z^2+6z+13=0$, הפעם בהשלמה לריבוע ולא בנוסחה.
    answer: >-
      (א) $z=-1\pm3i$; (ב) $z=\frac12\pm\frac{\sqrt3}{2}i$; (ג) $z=\pm\frac32i$; (ד) $z=-3\pm2i$.
    solution:
      - kind: idea
        text: >-
          נוסחת השורשים, עם $\sqrt{\Delta}=i\sqrt{|\Delta|}$ כש-$\Delta<0$, וחלוקה ב-$2a$ של החלק הממשי ושל המדומה. בהשלמה
          לריבוע מגיעים ל-$(z-p)^2$ שווה למספר שלילי, ומוציאים שורש עם $i$. בדיקה: במשוואה $z^2+bz+c=0$ סכום השורשים הוא
          מינוס $b$ ומכפלתם $c$.
      - kind: computation
        text: >-
          (א) $\Delta=4-40$, כלומר מינוס 36, ו-$\sqrt{\Delta}=6i$. $z=\frac{-2\pm6i}{2}=-1\pm3i$. בדיקה: הסכום מינוס 2,
          והמכפלה $(-1)^2+3^2=10$.
      - kind: computation
        text: >-
          (ב) $\Delta=1-4$, כלומר מינוס 3, ו-$\sqrt{\Delta}=i\sqrt3$. $z=\frac{1\pm i\sqrt3}{2}=\frac12\pm\frac{\sqrt3}{2}i$.
          בדיקה: הסכום 1, כלומר מינוס $b$ עם $b=-1$; המכפלה $\frac14+\frac34=1$.
      - kind: computation
        text: >-
          (ג) אין צורך בנוסחה: $z^2=-\frac94$, ולכן $z=\pm\sqrt{-\frac94}=\pm\frac32i$. (בנוסחה: $\Delta=0-4\cdot4\cdot9$,
          כלומר מינוס 144, ו-$z=\frac{\pm12i}{8}$, אותו דבר.) בדיקה, אחרי חלוקה ב-4: הסכום 0 והמכפלה $\frac94$.
      - kind: computation
        text: >-
          (ד) $z^2+6z=(z+3)^2-9$, ולכן המשוואה היא $(z+3)^2+4=0$, כלומר $(z+3)^2=-4$. מוציאים שורש: $z+3=\pm2i$, ולכן
          $z=-3\pm2i$. בדיקה: הסכום מינוס 6, והמכפלה $9+4=13$.
      - kind: check
        text: >-
          בכל ארבעת הסעיפים המקדמים ממשיים, והשורשים יצאו זוג צמוד, כמו שהשיעור מבטיח. הצבה ישירה ב-(א):
          $(-1+3i)^2=1-6i-9=-8-6i$, ועוד $2(-1+3i)=-2+6i$, ועוד 10: הסכום 0.
      - kind: result
        text: >-
          (א) $z=-1\pm3i$; (ב) $z=\frac12\pm\frac{\sqrt3}{2}i$; (ג) $z=\pm\frac32i$; (ד) $z=-3\pm2i$.

  - id: W-3.1-06
    level: mid
    qualitative: true
    objectives: [OBJ-3.1-1, OBJ-3.1-2]
    prompt: >-
      בכל סעיף כתוב חלק מפתרון של סטודנט. מצאו את הטעות, הסבירו מאיפה היא באה, ותקנו.

      (א) "$\frac{2+3i}{1+i}=\frac21+\frac31i=2+3i$."

      (ב) "$(3+4i)(3-4i)=9-16=-7$."

      (ג) "$\operatorname{Im}\big((1+2i)^2\big)=4i$."

      (ד) "$\frac{1}{1+i}=1-i$, כי ההפכי של מספר הוא הצמוד שלו."
    answer: >-
      (א) $\frac52+\frac12i$; (ב) $25$; (ג) $4$; (ד) $\frac12-\frac12i$.
    solution:
      - kind: idea
        text: >-
          ארבע הטעויות הן ארבע הטעויות הנפוצות של השיעור: חילוק רכיב ברכיב, סימן שגוי של $i^2$, חלק מדומה עם $i$, וצמוד
          במקום הפכי. את כולן תופסת אותה בדיקה: כופלים את התשובה בחזרה, או מציבים מספר פשוט.
      - kind: step
        text: >-
          (א) הסטודנט חילק רכיב ברכיב. בדיקה: $(2+3i)(1+i)=2+2i+3i+3i^2=-1+5i$, ולא $2+3i$. התיקון: כופלים בצמוד $1-i$:
          $\frac{(2+3i)(1-i)}{2}=\frac{2-2i+3i-3i^2}{2}=\frac{5+i}{2}$.
      - kind: step
        text: >-
          (ב) הסטודנט כתב $(4i)^2=16$ במקום $16i^2$, כלומר מינוס 16. התיקון: $(3+4i)(3-4i)=9-16i^2=9+16=25$. סימן מוקדם
          לטעות: מספר כפול הצמוד שלו הוא $a^2+b^2$, ולעולם אינו שלילי.
      - kind: step
        text: >-
          (ג) החישוב $(1+2i)^2=1+4i+4i^2=-3+4i$ נכון, אבל החלק המדומה הוא המספר הממשי 4, המקדם של $i$, ולא $4i$.
      - kind: step
        text: >-
          (ד) הצמוד אינו ההפכי: $(1+i)(1-i)=2$, ולא 1. ההפכי הוא הצמוד מחולק ב-$z\bar z$:
          $\frac{1}{1+i}=\frac{1-i}{(1+i)(1-i)}=\frac{1-i}{2}$.
      - kind: check
        text: >-
          (א) $\frac{5+i}{2}\cdot(1+i)=\frac{5+5i+i+i^2}{2}=\frac{4+6i}{2}=2+3i$. (ד) $\frac{1-i}{2}\cdot(1+i)=\frac{2}{2}=1$.
      - kind: result
        text: >-
          (א) $\frac52+\frac12i$; (ב) $25$; (ג) $\operatorname{Im}=4$; (ד) $\frac12-\frac12i$.

  - id: W-3.1-07
    level: mid
    objectives: [OBJ-3.1-2, OBJ-3.1-1]
    prompt: >-
      (א) ל-$z=1+2i$ ו-$w=3-i$ חשבו את $\overline{zw}$ ואת $\bar z\,\bar w$, והשוו.

      (ב) הראו שלכל $z=a+bi$ ו-$w=c+di$ מתקיים $\operatorname{Re}(z\bar w)=ac+bd$. איזה מושג משיעור 1.2 זה מזכיר?

      (ג) היעזרו ב-(ב) כדי להחליט, בלי ציור, אם החצים של $1+2i$ ושל $i-2$ מאונכים זה לזה.
    answer: >-
      (א) שניהם $5-5i$. (ב) $z\bar w=(ac+bd)+(bc-ad)i$; $ac+bd$ היא המכפלה הסקלרית של $(a,b)$ ו-$(c,d)$. (ג) כן:
      $z\bar w=-5i$, והחלק הממשי 0.
    solution:
      - kind: idea
        text: >-
          כל השאלה היא כפל בצורה האלגברית. ב-(ב) כותבים את המכפלה $z\bar w$ באותיות ומזהים את החלק הממשי. מכפלה סקלרית
          אפס פירושה וקטורים מאונכים (שיעור 1.2).
      - kind: computation
        text: >-
          (א) $zw=(1+2i)(3-i)=3-i+6i-2i^2=5+5i$, ולכן $\overline{zw}=5-5i$. מהצד השני
          $\bar z\,\bar w=(1-2i)(3+i)=3+i-6i-2i^2=5-5i$. שווים, כמו שהכלל $\overline{zw}=\bar z\,\bar w$ אומר.
      - kind: computation
        text: >-
          (ב) $z\bar w=(a+bi)(c-di)=ac-adi+bci-bd\,i^2=(ac+bd)+(bc-ad)i$. לכן $\operatorname{Re}(z\bar w)=ac+bd$. זו בדיוק
          המכפלה הסקלרית $(a,b)\cdot(c,d)$ של שני החצים.
      - kind: computation
        text: >-
          (ג) עם $z=1+2i$ ו-$w=-2+i$: $\bar w=-2-i$, ו-$z\bar w=(1+2i)(-2-i)=-2-i-4i-2i^2=-5i$. החלק הממשי 0, ולכן
          המכפלה הסקלרית של $(1,2)$ ו-$(-2,1)$ היא 0: החצים מאונכים.
      - kind: check
        text: >-
          ישירות: $(1,2)\cdot(-2,1)=-2+2=0$. ובמספרים של (א): $z\bar w=(1+2i)(3+i)=1+7i$, ו-$(1,2)\cdot(3,-1)=3-2=1$, החלק
          הממשי.
      - kind: result
        text: >-
          (א) $\overline{zw}=\bar z\,\bar w=5-5i$. (ב) $\operatorname{Re}(z\bar w)=ac+bd$, המכפלה הסקלרית. (ג) מאונכים.

  - id: W-3.1-08
    level: exam
    objectives: [OBJ-3.1-2, OBJ-3.1-1]
    prompt: >-
      (א) מצאו את כל המספרים המרוכבים $z$ שמקיימים $z\bar z+2z=3+4i$.

      (ב) לאילו $z\ne0$ המנה $\frac{z}{\bar z}$ היא מספר ממשי? תארו את הקבוצה בציור. רמז: כפלו מונה ומכנה ב-$z$.

      (ג) לאילו $z\ne0$ המנה $\frac{z}{\bar z}$ שווה למינוס 1?
    answer: >-
      (א) $z=-1+2i$ בלבד. (ב) כש-$z$ ממשי או מדומה טהור: שני הצירים, בלי הראשית. (ג) כש-$z$ מדומה טהור.
    solution:
      - kind: idea
        text: >-
          (א) במשוואה מופיעים $z$ ו-$\bar z$, ולכן כותבים $z=a+bi$ ומשווים חלק ממשי וחלק מדומה. $z\bar z=a^2+b^2$ ממשי, ולכן
          הוא תורם רק לחלק הממשי. (ב) הכפל של מונה ומכנה ב-$z$ הופך את המכנה ל-$z\bar z$, מספר ממשי חיובי, ואז השאלה היא
          מתי המונה $z^2$ ממשי.
      - kind: computation
        text: >-
          (א) $z\bar z+2z=(a^2+b^2+2a)+2bi$. משווים ל-$3+4i$: מהחלק המדומה $2b=4$, כלומר $b=2$. מהחלק הממשי
          $a^2+4+2a=3$, כלומר $a^2+2a+1=0$, $(a+1)^2=0$, ולכן $a=-1$. פתרון יחיד: $z=-1+2i$.
      - kind: computation
        text: >-
          (ב) $\frac{z}{\bar z}=\frac{z\cdot z}{\bar z\cdot z}=\frac{z^2}{a^2+b^2}$. המכנה ממשי וחיובי, ולכן המנה ממשית בדיוק
          כש-$z^2$ ממשי. $z^2=(a^2-b^2)+2abi$, וזה ממשי כש-$ab=0$: $b=0$ (מספר ממשי שאינו 0) או $a=0$ (מדומה טהור).
          בציור: שני הצירים, בלי הראשית.
      - kind: computation
        text: >-
          (ג) $\frac{z}{\bar z}=-1$ פירושו $z=-\bar z$, כלומר $a+bi=-a+bi$, ולכן $a=0$: המדומים הטהורים. (כש-$z$ ממשי
          שאינו 0, המנה היא 1.)
      - kind: check
        text: >-
          (א) $z\bar z=1+4=5$ ו-$2z=-2+4i$; הסכום $3+4i$. (ב) ל-$z=3i$: $\frac{3i}{-3i}$ הוא מינוס 1, ממשי. ל-$z=1+i$:
          $\frac{1+i}{1-i}=i$ (מתרגיל 4), לא ממשי, ואכן $ab=1\ne0$.
      - kind: result
        text: >-
          (א) $z=-1+2i$. (ב) $z$ על אחד מהצירים, $z\ne0$. (ג) $z$ מדומה טהור.

  - id: W-3.1-09
    level: exam
    qualitative: true
    objectives: [OBJ-3.1-3, OBJ-3.1-2]
    prompt: >-
      (א) מצאו משוואה $z^2+bz+c=0$ עם $b,c$ ממשיים שאחד השורשים שלה הוא $2-5i$.

      (ב) הוכיחו: אם $a,b,c$ ממשיים ו-$z_0$ שורש של $az^2+bz+c=0$, גם $\bar z_0$ שורש. באילו כללים של הצמוד השתמשתם?

      (ג) הראו שלמשוואה $z^2-(2+i)z+2i=0$ יש השורש $i$, ושמינוס $i$ אינו שורש שלה. למה זה אינו סותר את (ב)?
    answer: >-
      (א) $z^2-4z+29=0$. (ב) הצמדה של המשוואה, עם $\overline{u+v}=\bar u+\bar v$, $\overline{uv}=\bar u\bar v$ ו-$\bar a=a$
      לממשי. (ג) $z^2-(2+i)z+2i=(z-i)(z-2)$; ב-$z=-i$ הערך הוא $4i-2\ne0$; המקדמים אינם ממשיים.
    solution:
      - kind: idea
        text: >-
          כשהמקדמים ממשיים, שורש לא-ממשי מביא איתו את הצמוד שלו, ואז המשוואה נקבעת מהסכום ומהמכפלה של שני השורשים.
          ההוכחה של התכונה היא "לקחת צמוד לשני האגפים", והיא נשענת על כך שהצמוד של מספר ממשי הוא המספר עצמו.
      - kind: computation
        text: >-
          (א) השורש השני הוא $2+5i$. הסכום $4$, והמכפלה $(2-5i)(2+5i)=4+25=29$. לכן $b$ הוא מינוס 4 ו-$c=29$: המשוואה
          $z^2-4z+29=0$.
      - kind: step
        text: >-
          (ב) מהנתון $az_0^2+bz_0+c=0$. לוקחים צמוד לשני האגפים; הצמוד של 0 הוא 0. לפי הכלל של סכום, הצמוד של אגף שמאל הוא
          $\overline{az_0^2}+\overline{bz_0}+\bar c$. לפי הכלל של מכפלה, $\overline{az_0^2}=\bar a\,\bar z_0^{\,2}$ ו-
          $\overline{bz_0}=\bar b\,\bar z_0$. מכיוון ש-$a,b,c$ ממשיים, $\bar a=a$, $\bar b=b$ ו-$\bar c=c$. יחד:
          $a\bar z_0^{\,2}+b\bar z_0+c=0$, כלומר $\bar z_0$ שורש.
      - kind: computation
        text: >-
          (ג) מציבים $z=i$: $i^2-(2+i)i+2i=-1-2i-i^2+2i=-1-2i+1+2i=0$. לכן $i$ שורש. מציבים $z=-i$:
          $(-i)^2-(2+i)(-i)+2i=-1+2i+i^2+2i=-2+4i$, שאינו 0. (בעצם $z^2-(2+i)z+2i=(z-i)(z-2)$, והשורשים הם $i$ ו-2.)
      - kind: step
        text: >-
          זה אינו סותר את (ב): המקדמים $b=-(2+i)$ ו-$c=2i$ אינם ממשיים, ובהוכחה השתמשנו בדיוק בכך ש-$\bar b=b$ ו-$\bar c=c$.
          כאן ההצמדה של המשוואה נותנת משוואה **אחרת**, $\bar z^{\,2}-(2-i)\bar z-2i=0$.
      - kind: check
        text: >-
          (א) הצבה של $2-5i$: $(2-5i)^2=4-20i-25=-21-20i$; ועוד $(-4)(2-5i)=-8+20i$; ועוד 29: הסכום 0. (ג) פתיחת הסוגריים:
          $(z-i)(z-2)=z^2-2z-iz+2i=z^2-(2+i)z+2i$.
      - kind: result
        text: >-
          (א) $z^2-4z+29=0$. (ב) הצמדה של המשוואה, בעזרת הכללים לסכום ולמכפלה ו-$\bar a=a$ לממשי. (ג) השורשים $i$ ו-2;
          הזוג הצמוד מובטח רק כשהמקדמים ממשיים.

  - id: W-3.1-10
    level: exam
    qualitative: true
    objectives: [OBJ-3.1-3, OBJ-3.1-1]
    prompt: >-
      נתונה המשוואה $z^2+2z+c=0$, שבה $c$ מספר ממשי.

      (א) לאילו ערכים של $c$ השורשים אינם ממשיים? מצאו אותם כפונקציה של $c$.

      (ב) מה קורה לשני השורשים כש-$c$ גדל מ-1 והלאה: איזה חלק שלהם משתנה ואיזה נשאר קבוע? תארו בציור.

      (ג) הראו בשתי דרכים שמכפלת השורשים היא $c$.

      (ד) נכון או לא נכון: יש ערך של $c$ שבו למשוואה שורש אחד ממשי ושורש אחד שאינו ממשי. נמקו.
    answer: >-
      (א) $c>1$; $z=-1\pm i\sqrt{c-1}$. (ב) החלק הממשי נשאר מינוס 1; השורשים נעים על הישר האנכי דרך מינוס 1, זה מעלה וזה
      מטה. (ג) $(-1)^2+(c-1)=c$, וגם מהפירוק. (ד) לא נכון.
    solution:
      - kind: idea
        text: >-
          הדיסקרימיננטה קובעת מתי השורשים אינם ממשיים. כשהיא שלילית, הנוסחה מפרידה כל שורש לחלק ממשי, מינוס $\frac b2$,
          שאינו תלוי ב-$c$, ולחלק מדומה שתלוי ב-$c$. זה מה שאיור 3.1ג מראה.
      - kind: computation
        text: >-
          (א) $\Delta=4-4c$, שלילית כש-$c>1$. אז $\sqrt{\Delta}=i\sqrt{4c-4}=2i\sqrt{c-1}$, ו-
          $z=\frac{-2\pm2i\sqrt{c-1}}{2}=-1\pm i\sqrt{c-1}$.
      - kind: step
        text: >-
          (ב) החלק הממשי של שני השורשים הוא תמיד מינוס 1. החלק המדומה, $\pm\sqrt{c-1}$, מתחיל ב-0 כש-$c=1$ (שורש כפול, מינוס
          1, על הציר) וגדל עם $c$. בציור שני השורשים עולים על הישר האנכי שעובר דרך מינוס 1, אחד למעלה ואחד למטה, כתמונות
          ראי. למשל ב-$c=5$ הם $z=-1\pm2i$.
      - kind: computation
        text: >-
          (ג) דרך ראשונה, כפל ישיר: $(-1+i\sqrt{c-1})(-1-i\sqrt{c-1})=(-1)^2-\left(i\sqrt{c-1}\right)^2=1+(c-1)=c$. דרך שנייה:
          $z^2+2z+c=(z-z_1)(z-z_2)$, והאיבר החופשי בצד ימין הוא $z_1z_2$, ולכן $z_1z_2=c$.
      - kind: step
        text: >-
          (ד) לא נכון. סכום השורשים הוא מינוס 2, מספר ממשי. אם אחד השורשים ממשי, השני הוא מינוס 2 פחות השורש הממשי, ולכן
          גם הוא ממשי. (דרך אחרת: המקדמים ממשיים, ולכן שורש לא-ממשי בא תמיד עם הצמוד שלו, ששונה ממנו.)
      - kind: check
        text: >-
          ב-$c=5$: $(-1+2i)^2+2(-1+2i)+5=(1-4i-4)+(-2+4i)+5=0$. וב-$c=1$: $(z+1)^2=0$, שורש כפול מינוס 1, נקודת המעבר בין
          שני שורשים ממשיים לזוג צמוד.
      - kind: result
        text: >-
          (א) $c>1$, $z=-1\pm i\sqrt{c-1}$. (ב) נעים אנכית על הישר $\operatorname{Re}z=-1$. (ג) המכפלה $c$. (ד) לא נכון.

challenge:
  - id: W-3.1-c1
    stars: 1
    objectives: [OBJ-3.1-1]
    prompt: >-
      לאיזה מספר טבעי $n$ מתקיים

      $$i+2i^2+3i^3+\cdots+ni^n=48+49i\ ?$$

      (בסכום, המחובר ה-$k$ הוא $k\,i^k$.)
    answer: >-
      $n=97$.
    solution:
      - kind: idea
        text: >-
          החזקות של $i$ חוזרות במחזור של 4, ולכן מקבצים את הסכום בבלוקים של ארבעה מחוברים רצופים. כל בלוק תורם אותו
          מספר, ונשאר לטפל בכמה מחוברים בסוף.
      - kind: computation
        text: >-
          הבלוק הראשון: $1\cdot i+2i^2+3i^3+4i^4=i-2-3i+4=2-2i$. בבלוק כללי, שמתחיל במחובר $k=4m+1$, החזקות הן שוב
          $i$, מינוס 1, מינוס $i$, 1, והמקדמים $4m+1$, $4m+2$, $4m+3$, $4m+4$. החלק הממשי:
          $(4m+4)-(4m+2)=2$. החלק המדומה: $(4m+1)-(4m+3)=-2$. כל בלוק תורם $2-2i$.
      - kind: step
        text: >-
          החלק הממשי של התוצאה הוא 48, ו-$48=24\cdot2$. אחרי 24 בלוקים, כלומר 96 מחוברים, הסכום הוא
          $24(2-2i)=48-48i$. החלק הממשי כבר נכון, וחסר $97i$ בחלק המדומה.
      - kind: computation
        text: >-
          המחובר ה-97 הוא $97i^{97}$, ו-$97=4\cdot24+1$, ולכן $i^{97}=i$ והמחובר הוא $97i$. אחרי 97 מחוברים:
          $48-48i+97i=48+49i$.
      - kind: check
        text: >-
          אין $n$ אחר. נסמן ב-$S_n$ את הסכום של $n$ המחוברים הראשונים. מהבלוקים, ומהמחוברים שנשארים אחרי $m$ בלוקים
          שלמים, מקבלים ארבעה מקרים לפי השארית של $n$ בחלוקה ב-4:
          $S_{4m}=2m-2mi$, $S_{4m+1}=2m+(2m+1)i$, $S_{4m+2}=-(2m+2)+(2m+1)i$ ו-$S_{4m+3}=-(2m+2)(1+i)$.
          בשני המקרים האחרונים החלק הממשי שלילי, ולכן הם אינם יכולים לתת 48. בשני הראשונים החלק הממשי הוא $2m=48$,
          כלומר $m=24$, ואז החלק המדומה הוא מינוס 48 (כש-$n=96$) או 49 (כש-$n=97$). רק $n=97$ מתאים.
      - kind: result
        text: >-
          $n=97$.
    source:
      name: 'AMC 12A (Mathematical Association of America), as posted on the Random Math forum'
      year: 2009
      problem: 'Problem 15'
      url: https://forums.randommath.com/t/amc-12a-2009-problem-15/3377
      verified: '2026-11-26'
      adapted: true

  - id: W-3.1-c2
    stars: 1
    objectives: [OBJ-3.1-1, OBJ-3.1-2]
    prompt: >-
      למספרים מרוכבים $u=a+bi$ ו-$v=c+di$ (עם $a,b,c,d$ ממשיים) מגדירים פעולה חדשה:

      $$u\otimes v=ac+bd\,i .$$

      (א) הראו שהפעולה $\otimes$ אינה הכפל של המספרים המרוכבים: חשבו את $i\otimes i$ והשוו ל-$i\cdot i$.

      (ב) נתון מספר מרוכב $z$ שמקיים $z\otimes z=z^2+40$. מצאו את $z\bar z$, ואת כל המספרים $z$ האפשריים.
    answer: >-
      (א) $i\otimes i=i$, ואילו $i\cdot i=-1$. (ב) $z\bar z=50$; $z=\sqrt{10}+2\sqrt{10}\,i$ או $z=-\sqrt{10}-2\sqrt{10}\,i$.
    solution:
      - kind: idea
        text: >-
          הפעולה $\otimes$ היא בדיוק "הכפל רכיב ברכיב", הטעות שהשיעור מזהיר ממנה. כדי לפתור את המשוואה כותבים $z=a+bi$,
          מחשבים את שני האגפים בצורה האלגברית, ומשווים חלק ממשי וחלק מדומה.
      - kind: computation
        text: >-
          (א) ל-$i=0+1i$: $i\otimes i=0\cdot0+1\cdot1\,i=i$. אבל $i\cdot i=i^2$, כלומר מינוס 1. שתי תוצאות שונות.
      - kind: computation
        text: >-
          (ב) עם $z=a+bi$: $z\otimes z=a^2+b^2i$. מהצד השני $z^2+40=(a^2-b^2+40)+2abi$. משווים: החלקים הממשיים נותנים
          $a^2=a^2-b^2+40$, כלומר $b^2=40$. החלקים המדומים נותנים $b^2=2ab$.
      - kind: step
        text: >-
          מכיוון ש-$b^2=40$, $b\ne0$, ואפשר לחלק את $b^2=2ab$ ב-$b$: $b=2a$. לכן $a^2=\frac{b^2}{4}=10$, ו-
          $z\bar z=a^2+b^2=10+40=50$. ו-$b=2a$ קובע שלשני החלקים אותו סימן: $a=\sqrt{10}$, $b=2\sqrt{10}$, או $a=-\sqrt{10}$,
          $b=-2\sqrt{10}$.
      - kind: check
        text: >-
          ל-$z=\sqrt{10}+2\sqrt{10}\,i$: $z^2=10-40+2\cdot\sqrt{10}\cdot2\sqrt{10}\,i=-30+40i$, ולכן $z^2+40=10+40i$. ו-
          $z\otimes z=a^2+b^2i=10+40i$. שווים. (בשאלה המקורית מבקשים את $|z|$, שהוא $\sqrt{50}=5\sqrt2$; השורש של
          $z\bar z$ הוא האורך שנלמד בשיעור 3.2.)
      - kind: result
        text: >-
          (א) $i\otimes i=i\ne-1=i\cdot i$. (ב) $z\bar z=50$, ו-$z=\pm\left(\sqrt{10}+2\sqrt{10}\,i\right)$.
    source:
      name: 'AMC 12B (Mathematical Association of America), as posted on the Random Math forum'
      year: 2023
      problem: 'Problem 12'
      url: https://forums.randommath.com/t/amc-12-2023-b-problem-12/7796
      verified: '2026-11-26'
      adapted: true
